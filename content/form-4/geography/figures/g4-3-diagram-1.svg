<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 284" role="img" aria-label="Illustrative soil profile: O, A, B, C, R from surface downward" font-family="sans-serif" fill="#183428"><rect width="320" height="284" fill="#fffdf5"/><text x="12" y="20" font-size="13">Illustrative profile, not to scale</text><rect x="18" y="34" width="100" height="42" fill="#503f2c" stroke="#fefaf0"/><text x="65" y="61" text-anchor="middle" font-size="20" fill="white">O</text><text x="132" y="60" font-size="13">organic litter</text><rect x="18" y="76" width="100" height="42" fill="#806448" stroke="#fefaf0"/><text x="65" y="103" text-anchor="middle" font-size="20" fill="white">A</text><text x="132" y="102" font-size="13">mineral topsoil</text><rect x="18" y="118" width="100" height="42" fill="#b88251" stroke="#fefaf0"/><text x="65" y="145" text-anchor="middle" font-size="20" fill="#183428">B</text><text x="132" y="144" font-size="13">altered subsoil</text><rect x="18" y="160" width="100" height="42" fill="#d6bf91" stroke="#fefaf0"/><text x="65" y="187" text-anchor="middle" font-size="20" fill="#183428">C</text><text x="132" y="186" font-size="13">parent material</text><rect x="18" y="202" width="100" height="42" fill="#b5b4ad" stroke="#fefaf0"/><text x="65" y="229" text-anchor="middle" font-size="20" fill="#183428">R</text><text x="132" y="228" font-size="13">hard bedrock</text><text x="12" y="269" font-size="11">E may occur; not all soils have every layer.</text></svg>