lse","explain":"Use the adverb: carefully."},{"text":"She sings good.","truth":"false","explain":"The adverb of good is well."},{"text":"Yesterday is an adverb of place.","truth":"false","explain":"It tells when: an adverb of time."}]},"pick":{"right":3,"wrong":1}}]},"80":{"subject":"english-language","class":"Form 2","lesson_no":80,"language":"en","prerequisites":[77,78],"skills":[{"id":"e2-80","name":"Writing a report on the treatment of patients; health slogans"}],"note":{"status":"draft","text":"A report gives facts clearly and in order to someone who needs them.\nLayout: a title; To: / From: / Date: / Subject:; an introduction (why you write and what you did); the findings in paragraphs (what you saw); recommendations (what should be done); your name.\nUse the past tense for what happened and formal language.\nA slogan is a short, catchy sentence that gives a message: “Clean hands save lives!” “A mosquito net a night keeps malaria out of sight!”","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Plan a report to your principal about a visit to the district hospital.","steps":["Title, To / From / Date / Subject.","Introduction: the health club visited the hospital on {14} May to see how patients are treated.","Findings: patients are registered, then examined; the wards were clean but crowded; some patients waited many hours.","Recommendations: more benches and more nurses. Then a slogan to end."],"answer":"Title → To/From/Date/Subject → introduction → findings → recommendations → name","checks":[]},"teach":{"cards":[{"id":"c80-1","status":"draft","idea":"A report starts with To, From, Date and Subject.","vars":{},"example":["Subject: Visit to the district hospital"],"checks":[],"check":{"ref":"e2-80-order"}},{"id":"c80-2","status":"draft","idea":"Give the findings in the past tense, in order.","vars":{},"example":["The wards were clean but crowded."],"checks":[],"check":{"ref":"e2-80-order"}},{"id":"c80-3","status":"draft","idea":"A slogan is short and catchy.","vars":{},"example":["Clean hands save lives!"],"checks":[],"check":{"ref":"e2-80-order"}}]},"questions":[{"id":"e2-80-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the parts of the report in order.","items":[{"text":"Report on our visit to the district hospital"},{"text":"To: The Principal  From: The Health Club  Date: 15 May"},{"text":"On 14 May, our club visited the hospital to see how patients are treated."},{"text":"We found that the wards were clean but crowded."},{"text":"We recommend more benches and more nurses."},{"text":"Signed: Tabe Ayuk, Secretary"}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write a report (about 150 words) in your exercise book to your principal about a visit to a hospital or health centre: how patients are received and treated. End with two health slogans.","model":["Report on our visit to Buea Regional Hospital\nTo: The Principal\nFrom: The Health Club\nDate: 15 May\nSubject: How patients are treated\n\nIntroduction: On 14 May, twelve members of the Health Club visited the hospital with Mrs Ewane to see how patients are received and treated.\n\nFindings: Patients first register at the reception and pay a small fee. A nurse takes their temperature and blood pressure, then they wait to see a doctor. The wards were clean and the nurses were kind, but many patients waited more than three hours on the corridor.\n\nRecommendations: The hospital needs more benches, more nurses at the reception and a health talk for people who are waiting.\n\nSlogans: “Clean hands save lives!” “Sleep under a net, keep malaria away!”\n\nTabe Ayuk, Secretary"],"checklist":["My report has a title and To / From / Date / Subject.","My introduction says why we went and when.","My findings are in the past tense and in order.","I gave clear recommendations.","I wrote two short, catchy slogans.","I used formal language.","My sentences start with capitals and end with full stops."]}},"81":{"subject":"english-language","class":"Form 2","lesson_no":81,"language":"en","prerequisites":[],"skills":[{"id":"e2-81","name":"Talking about festivals and cultural activities; reading about the Ngondo"}],"note":{"status":"draft","text":"Text: The Ngondo festival\nEvery year in December, the Sawa people of the Littoral gather on the banks of the Wouri river in Douala for the Ngondo. It is a festival of the water spirits and of the ancestors. The high point is when a diver goes under the water to receive a message from the spirits; when he comes out, the message is read to the people. There are also canoe races, wrestling, dances, a beauty contest and a fair. For the Sawa, the Ngondo keeps their traditions alive, brings families together and attracts tourists. “A people without culture is like a tree without roots,” says an elder.\n\nOther festivals of Cameroon: the Nyem-Nyem (Adamawa), the Ngouon (Bamoun, Foumban), the Lela (Bali Nyonga), the Mbaya (Tikar), the Medumba festival (Bangangté).\nFestivals keep culture alive, unite people, teach the young and bring income through tourism.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Why is the Ngondo important to the Sawa people, according to the text?","steps":["The text gives three reasons near the end.","It keeps their traditions alive, brings families together and attracts tourists."],"answer":"It keeps their traditions alive, brings families together and attracts tourists.","checks":[]},"teach":{"cards":[{"id":"c81-1","status":"draft","idea":"A festival is a time of celebration, often with music, dances and ceremonies.","vars":{},"example":["The Ngondo of the Sawa."],"checks":[],"check":{"ref":"e2-81-comp"}},{"id":"c81-2","status":"draft","idea":"Festivals keep culture alive, unite people and attract tourists.","vars":{},"example":["A festival brings families together."],"checks":[],"check":{"ref":"e2-81-why"}},{"id":"c81-3","status":"draft","idea":"Cameroon has many festivals: Ngondo, Nyem-Nyem, Ngouon, Lela.","vars":{},"example":["The Ngouon is in Foumban."],"checks":[],"check":{"id":"e2-81-match-card","type":"matching","level":1,"review":"authored","sources":["reading-texts","culture-film"],"prompt":"Match each festival to its people or town.","pool":[{"left":"Ngondo","right":"the Sawa of Douala"},{"left":"Ngouon","right":"the Bamoun of Foumban"},{"left":"Lela","right":"Bali Nyonga"},{"left":"Nyem-Nyem","right":"the Adamawa"}],"pick":4}}]},"questions":[{"id":"e2-81-comp","type":"mcq","level":1,"review":"authored","sources":["reading-texts","culture-film"],"vars":{"X":{"pick":[{"q":"where does the Ngondo take place?","r":"on the banks of the Wouri river in Douala","w":["in Foumban","on Mount Cameroon","in Maroua"],"e":["That is the Ngouon.","That is not in the text.","That is not in the text."],"y":"The text says it."},{"q":"what is the high point of the festival?","r":"a diver receives a message from the water spirits","w":["a football match","a school prize-giving","a market day"],"e":["Not in the text.","Not in the text.","There is a fair, but that is not the high point."],"y":"The diver goes under the water."}]}},"prompt":"Text “The Ngondo festival”: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-81-why","type":"mcq","level":1,"review":"authored","sources":["reading-texts","culture-film"],"vars":{"X":{"pick":[{"q":"What does the elder mean by “A people without culture is like a tree without roots”?","r":"Culture gives a people strength and identity.","w":["Trees need water.","People should cut trees.","Culture is not important."],"e":["He uses a comparison.","That is not the meaning.","He says the opposite."],"y":"Roots hold a tre ctivities"}],"note":{"status":"draft","text":"Words about festivals:\n• a festival, a celebration, a ceremony, a ritual, a parade (march-past), a procession, a feast;\n• a masquerade (dancers wearing masks), a traditional dance, a drummer, a choir;\n• costume, regalia (the special clothes and objects of a chief), beads, a headdress;\n• to celebrate, to perform, to commemorate (to remember an event), to honour, to organise;\n• heritage (traditions passed down from the past), custom, tradition, an elder, the palace, the chief (the Fon, the Lamido, the Sultan).","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Complete: “The Fon wore his ___ — a beaded hat and a long robe — for the festival.”","steps":["The special clothes and objects of a chief are called regalia.","So the word is “regalia”."],"answer":"regalia","checks":[]},"teach":{"cards":[{"id":"c82-1","status":"draft","idea":"A masquerade is a dance by people wearing masks.","vars":{},"example":["The masquerade danced in the palace yard."],"checks":[],"check":{"ref":"e2-82-def"}},{"id":"c82-2","status":"draft","idea":"To commemorate is to remember an event with a ceremony.","vars":{},"example":["We commemorate the National Day on {20} May."],"checks":[],"check":{"ref":"e2-82-cl"}},{"id":"c82-3","status":"draft","idea":"Heritage means the traditions passed down from the past.","vars":{},"example":["Our dances are part of our heritage."],"checks":[],"check":{"id":"e2-82-match-card","type":"matching","level":1,"review":"authored","sources":["vocabulary"],"prompt":"Match each word to its meaning.","pool":[{"left":"regalia","right":"the special clothes and objects of a chief"},{"left":"heritage","right":"traditions passed down from the past"},{"left":"ritual","right":"a set of actions done in the same way in a ceremony"},{"left":"an elder","right":"an old, respected person in a community"},{"left":"a parade","right":"a public march to celebrate"}],"pick":4}}]},"questions":[{"id":"e2-82-def","type": eep)","truth":"false","explain":"It is spelt lamb, with a silent b."},{"text":"numonia","truth":"false","explain":"It is spelt pneumonia, with a silent p."},{"text":"plumer","truth":"false","explain":"It is spelt plumber, with a silent b."}]},"pick":{"right":3,"wrong":1}}]},"84":{"subject":"english-language","class":"Form 2","lesson_no":84,"language":"en","prerequisites":[],"skills":[{"id":"e2-84","name":"Nouns as modifiers"}],"note":{"status":"draft","text":"A noun can be used before another noun to describe it, like an adjective. It is then a noun modifier.\n• a school bag (a bag for school), a football match, a dance festival, a leather belt, a village chief, a health centre.\nThe main noun is the last one; the first noun tells what kind: a bus station is a station (for buses).\nThe modifier is usually singular even when the meaning is plural: a shoe shop (it sells many shoes), a ten-kilometre race, a two-day festival.\nCompare: a coffee cup (a cup for coffee) and a cup of coffee (a cup full of coffee).","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Write a noun phrase with a noun modifier for “a race of ten kilometres”.","steps":["The main noun is “race”; the modifier goes before it.","Numbers + noun modifiers stay singular and take a hyphen: a ten-kilometre race."],"answer":"a ten-kilometre race","checks":[]},"teach":{"cards":[{"id":"c84-1","status":"draft","idea":"A noun before another noun describes it: a school bag.","vars":{},"example":["a football match"],"checks":[],"check":{"ref":"e2-84-main"}},{"id":"c84-2","status":"draft","idea":"The main noun is the last one.","vars":{},"example":["a village chief is a chief."],"checks":[],"check":{"ref":"e2-84-cl"}},{"id":"c84-3","status":"draft","idea":"The modifier stays singular: a shoe shop, a two-day festival.","vars":{},"example":["a three-hour journey"],"checks":[],"check":{"id":"e2-84-num-card","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"We went on a ___ journey to Garoua.","a":"two-day","w":["two-days","two day's"],"e":["The modifier stays singular.","No apostrophe here."]},{"s":"My brother ran in the ___ race.","a":"ten-kilometre","w":["ten-kilometres","ten kilometres's"],"e":["The modifier stays singular.","No apostrophe here."]},{"s":"My uncle owns a ___ shop.","a":"shoe","w":["shoes","shoe's"],"e":["The modifier stays singular.","No apostrophe here."]}]}},"prompt":"Choose the correct form.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]}}]},"questions":[{"id":"e2-84-main","type":"mcq","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"q":"In “a dance festival”, what is the main noun?","r":"festival","w":["dance","a","both words equally"],"e":["“dance” tells what kind of festival.","“a” is an article.","The last noun is the main one."],"y":"It is a festival."},{"q":"What is a “health centre”?","r":"a centre for health care","w":["a kind of health","a healthy person","the centre of the body"],"e":["The main noun is centre.","Not the meaning.","Not the meaning."],"y":"The main noun is the last."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-84-cl","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"Put the ___ in the drawer. (a knife for bread)","a":"bread knife","w":["breads knife","knife bread"],"e":["The modifier stays singular.","The modifier comes first."]},{"s":"We waited at the ___. (a stop for buses)","a":"bus stop","w":["buses stop","s etre race."},{"text":"a festival music (for music at a festival)","truth":"false","explain":"The modifier comes first: festival music."}]},"pick":{"right":3,"wrong":1}}]},"85":{"subject":"english-language","class":"Form 2","lesson_no":85,"language":"en","prerequisites":[81],"skills":[{"id":"e2-85","name":"Talking about traditional music; reading about its importance"}],"note":{"status":"draft","text":"Text: The voice of the drums\nIn Grandfather Ndi's village, music is everywhere. The talking drum sends messages from hill to hill: a birth, a death, a meeting at the palace. The balafon, made of wooden keys over calabashes, plays at weddings. Women sing work songs as they hoe the fields, and the rhythm makes the work lighter. At funerals, mournful songs comfort the family. “Our music is our history book,” Grandfather says. “The songs tell where we came from and teach the young how to behave.” Today, young artists mix the old rhythms — bikutsi, makossa, njang, bend skin — with guitars and computers, and Cameroonian music is heard all over the world.\n\nSome Cameroonian music styles: makossa (Douala), bikutsi (Centre, Beti), bend skin (West), njang (North West), assiko (Bassa), mangambeu (West).","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Why does Grandfather say “Our music is our history book”?","steps":["The text says the songs tell where the people came from.","They also teach the young how to behave, like a book."],"answer":"Because the songs tell the people's history and teach the young.","checks":[]},"teach":{"cards":[{"id":"c85-1","status":"draft","idea":"Traditional music has many uses: messages, weddings, work, funerals.","vars":{},"example":["The talking drum sends messages."],"checks":[],"check":{"ref":"e2-85-comp"}},{"id":"c85-2","status":"draft","idea":"Music keeps history and teaches values.","vars":{},"example":["Songs tell where we came from."],"checks":[],"check":{"id":"e2-85-why-card","type":"mcq","level":1,"review":"authored","sources":["reading-texts","culture-film"],"vars":{"X":{"pick":[{"q":"What is the main idea of the text?","r":"Music is an important part of life, history and culture.","w":["Drums are too loud.","Young people hate music.","Music is only for weddings."],"e":["Not the idea.","They mix old and new.","It is used in many events."],"y":"It is everywhere in the village."},{"q":"What do young artists do today, according to the text?","r":"mix old rhythms with guitars and computers","w":["stop playing music","only play the talking drum","ban traditional music"],"e":["They continue.","They mix styles.","They use it."],"y":"The music is heard all over the world."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}},{"id":"c85-3","status":"draft","idea":"Cameroonian styles include makossa, bikutsi, bend skin, njang and assiko.","vars":{},"example":["Bikutsi comes from the Centre."],"checks":[],"check":{"ref":"e2-85-match"}}]},"questions":[{"id":"e2-85-comp","type":"mcq","level":1,"review":"authored","sources":["reading-texts","culture-film"],"vars":{"X":{"pick":[{"q":"what does the talking drum do?","r":"it sends messages from hill to hill","w":["it cooks food","it plays only at school","it makes the rain fall"],"e":["Not in the text.","Not in the text.","Not in the text."],"y":"Births, deaths, meetings."},{"q":"what is a balafon made of?","r":"wooden keys over calabashes","w":["metal strings","plastic pipes","animal skins only"],"e":["Not in the text.","Not in the text.","Not in the text."],"y":"The text describes it."},{"q":"why do women sing work songs?","r":"the rhythm makes the work lighter","w":["to stop working","to call the rain","to sell food"],"e":["They keep working.","Not Which question word fits? “{X.q}”","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-86-cl","type":"cloze","level":1,"review":"authored","sources":["vocabulary"],"vars":{"X":{"pick":[{"s":"___ instruments can you play? — The flute and the drum.","a":"Which","w":["Whose","Where"],"e":["The answer is a choice of things.","The answer is not a place."]},{"s":"___ much does the ticket cost? — Five hundred francs.","a":"How","w":["What","Which"],"e":["We say “How much”.","We say “How much”."]},{"s":"___ will the concert end? — At ten.","a":"When","w":["Where","Who"],"e":["The answer is a time.","The answer is a time."]}]}},"prompt":"Choose the question word that fits.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-86-rel","type":"cloze","level":2,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"The woman ___ sings in the choir is my aunt.","a":"who","w":["which","where"],"e":["For a person, use who.","Where is for places."]},{"s":"This is the hall ___ the concert took place.","a":"where","w":["who","whose"],"e":["For a place, use where.","Whose is for owners."]},{"s":"The drum ___ my father made is very old.","a":"which","w":["who","where"],"e":["For a thing, use which.","Where is for places."]}]}},"prompt":"Choose the word that joins the sentences.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-86-spot","type":"spot_error","level":3,"review":"authored","sources":["vocabulary"],"prompt":"Which question is wrong?","pool":{"right":[{"text":"Who is the lead singer?","truth":"true"},{"text":"Where is the palace?","truth":"true"},{"text":"Whose bag is this?","truth":"true"},{"text":"Why are you crying?","truth":"true"}],"wrong":[{"text":"Who guitar is this?","truth":"false","explain":"For the owner, use Whose."},{"text":"When is the market? — In the town centre.","truth":"false","explain":"For a place, ask Where."},{"text":"Which is your name?","truth":"false","explain":"Ask What is your name?"}]},"pick":{"right":3,"wrong":1}}]},"87":{"subject":"english-language","class":"Form 2","lesson_no":87,"language":"en","prerequisites":[],"skills":[{"id":"e2-87","name":"Conditionals: zero, first and second"}],"note":{"status":"draft","text":"A conditional sentence has an if-clause (the condition) and a main clause (the result).\n• Zero conditional (always true, facts): If + present, present. “If you heat water to 100 °C, it boils.”\n• First conditional (a real possibility in the future): If + present, will + verb. “If it rains, the festival will be cancelled.”\n• Second conditional (an unreal or unlikely situation): If + past, would + verb. “If I had a guitar, I would play every day.” With be, use “were”: “If I were rich, I would build a school.”\nThe if-clause can come first (with a comma) or second (no comma): “The festival will be cancelled if it rains.”\nNever put “will” or “would” in the if-clause.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Complete with the correct form: “If it ___ (rain) tomorrow, we ___ (stay) at home.”","steps":["Tomorrow is a real future possibility: first conditional.","If + present (rains), will + verb (will stay)."],"answer":"If it rains tomorrow, we will stay at home.","checks":[]},"teach":{"cards":[{"id":"c87-1","status":"draft","idea":"Zero conditional: If + present, present — for facts.","vars":{},"example":["If you mix blue and yellow, 's school fees.\n\nFinally, women keep our culture alive. They lead dances at festivals, teach songs to the young and, in some places, the queen mother advises the Fon.\n\nIn conclusion, women are the backbone of our society. They deserve respect and the same chance to go to school as men."],"checklist":["My account has a title.","My introduction says what I will write about.","Each body paragraph is about one role, with examples.","I used linking words.","I used the simple present for general facts.","My conclusion gives my opinion.","My sentences start with capitals and end with full stops."]}},"89":{"subject":"english-language","class":"Form 2","lesson_no":89,"language":"en","prerequisites":[],"skills":[{"id":"e2-89","name":"Talking about national languages; reading about a mother tongue"}],"note":{"status":"draft","text":"Text: Speaking the language of my grandmother\nWhen Ngum visited her grandmother in Kom, she felt like a stranger. Grandmother spoke only the Kom language, and Ngum, who had grown up in Yaoundé, spoke English and French. They smiled at each other but could not share stories. Back in town, Ngum asked her father to teach her. Every evening they practised greetings, proverbs and songs. At school, she joined the national languages class. The next holiday, she greeted her grandmother in Kom. The old woman cried with joy and told her the story of their family until midnight. “A language is a key,” Ngum wrote in her diary. “It opens the door to my people's wisdom.”\n\nCameroon has more than 250 national languages (Ewondo, Duala, Fulfulde, Kom…) and two official languages, English and French. A mother tongue is the first language learnt at home.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Why did Ngum feel like a stranger in Kom?","steps":["Her grandmother spoke only the Kom language.","Ngum spoke English and French, so they could not share stories."],"answer":"Because she could not speak her grandmother's language.","checks": ilms were so good.\nMRS TANYI: Our film industry is growing. Some people call it Collywood. Young directors make films with small budgets and share them on television and online.\nAYUK: Who works on a film?\nMRS TANYI: The scriptwriter writes the story, the director guides the actors, the cameraman films, and the editor puts the scenes together. Actors play the characters.\nAYUK: Are there film festivals here?\nMRS TANYI: Yes — the Écrans Noirs festival in Yaoundé shows African films every year. The industry still needs more cinemas and money, but it creates jobs and tells our own stories.\n\nUseful words: a screening (showing a film), a director, a scriptwriter, a producer, a cast (all the actors), a scene, a budget.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"According to Mrs Tanyi, what does a director do?","steps":["She lists the jobs on a film.","She says the director guides the actors."],"answer":"The director guides the actors.","checks":[]},"teach":{"cards":[{"id":"c93-1","status":"draft","idea":"The scriptwriter writes the story; the director guides the actors.","vars":{},"example":["The editor puts the scenes together."],"checks":[],"check":{"ref":"e2-93-jobs"}},{"id":"c93-2","status":"draft","idea":"Some people call the Cameroon film industry Collywood.","vars":{},"example":["Films are shown on TV and online."],"checks":[],"check":{"ref":"e2-93-comp"}},{"id":"c93-3","status":"draft","idea":"The film industry creates jobs and tells our own stories.","vars":{},"example":["It needs more cinemas and money."],"checks":[],"check":{"id":"e2-93-why-card","type":"mcq","level":1,"review":"authored","sources":["reading-texts","culture-film"],"vars":{"X":{"pick":[{"q":"What does the film industry still need, according to Mrs Tanyi?","r":"more cinemas and money","w":["fewer actors","no stories","less television"],"e":["Not in the dialogue.","Not in the dialogue.","Not in the dialogue."],"y":"She says so at the end."},{"q":"Why is the film ind lows time order: birth and childhood, education, career, achievements, and sometimes death.\nIt uses the simple past and time words.\n\nText: Two lives in art\nManu Dibango was born in Douala in 1933. As a young man he went to study in France, where he learnt the saxophone and the piano. In 1972 his song “Soul Makossa” became a world hit and made makossa famous. He was called “Papa Groove”. He died in 2020.\nAdah Mbeng (a model biography written for this lesson) grew up in Bamenda. She loved acting in school plays. After secondary school she joined a theatre group, then acted in short films. Her first feature film won a prize in Yaoundé. Today she trains young actors: “Talent is a seed; work is the rain.”","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"When and where was Manu Dibango born?","steps":["Look at the first sentence of his biography.","“Manu Dibango was born in Douala in {1933}.”"],"answer":"In Douala, in {1933}.","checks":[]},"teach":{"cards":[{"id":"c94-1","status":"draft","idea":"A biography tells a person's life in time order.","vars":{},"example":["Birth, education, career, achievements."],"checks":[],"check":{"ref":"e2-94-comp"}},{"id":"c94-2","status":"draft","idea":"Biographies use the simple past and time words.","vars":{},"example":["In {1972} his song became a hit."],"checks":[],"check":{"ref":"e2-94-order"}},{"id":"c94-3","status":"draft","idea":"Read for facts: who, when, where, what they did.","vars":{},"example":["Adah Mbeng grew up in Bamenda."],"checks":[],"check":{"id":"e2-94-idea-card","type":"mcq","level":1,"review":"authored","sources":["reading-texts","culture-film"],"vars":{"X":{"pick":[{"q":"What does Adah Mbeng mean by “Talent is a seed; work is the rain”?","r":"Talent grows only with hard work.","w":["Seeds need no water.","Actors should be farmers.","Rain stops films."],"e":["Not the meaning.","It is a comparison.","Not the meaning."],"y":"Work makes talent grow."},{"q":"What was Manu Dibango's nickname?"," e / She has taught me that …","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Plan a composition about the artist you admire most.","steps":["Title: The artist I admire most.","Introduction: name, what they do, why I chose them.","First body paragraph: birth, education, first success (simple past).","Second body paragraph: achievements and qualities, with examples. Conclusion: what I learn from them."],"answer":"Title → introduction → life → achievements → conclusion","checks":[]},"teach":{"cards":[{"id":"c96-1","status":"draft","idea":"Use the simple past for the person's life.","vars":{},"example":["He was born in Douala."],"checks":[],"check":{"ref":"e2-96-order"}},{"id":"c96-2","status":"draft","idea":"Use the simple present for your opinion.","vars":{},"example":["I admire her because she works hard."],"checks":[],"check":{"ref":"e2-96-order"}},{"id":"c96-3","status":"draft","idea":"End with what you learn from the person.","vars":{},"example":["He has taught me never to give up."],"checks":[],"check":{"ref":"e2-96-order"}}]},"questions":[{"id":"e2-96-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the parts of the composition in order.","items":[{"text":"The artist I admire most"},{"text":"The artist I admire most is the singer Ngum Rose."},{"text":"She was born in Kumbo and sang in her church choir."},{"text":"Her songs about girls' education have won many prizes."},{"text":"She has taught me that talent needs hard work."}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write a composition (about 150 words) in your exercise book about the Cameroonian film actor, actress or musician you admire most. Give facts about their life and explain why you admire them.","model":["The artist I admire most\n\nThe artist I admire most is the singer Ngum Rose (a model artist for this exercise). I chose her because her songs give hope to young people.\n\nNgum Rose was born in Kumbo. As a child, she sang in her church choir every Sunday. After secondary school, she studied music in Yaoundé and recorded her first song at the age of twenty.\n\nHer songs mix njang rhythms with modern guitars. In her best-known song she encourages parents to send girls to school. She has won prizes at music festivals and she gives free concerts in schools.\n\nI admire her because she is talented, hard-working and generous. She has taught me that talent needs hard work, and that art can change people's lives."],"checklist":["My composition has a title.","My introduction says who the person is and why I chose them.","I used the simple past for the person's life.","I gave examples of their achievements.","I used the simple present for my opinion.","My conclusion says what I learn from them.","My sentences start with capitals and end with full stops."]}},"97":{"subject":"english-language","class":"Form 2","lesson_no":97,"language":"en","prerequisites":[83],"skills":[{"id":"e2-97","name":"Silent letters: c and l"}],"note":{"status":"draft","text":"Silent c:\n• after s before e, i or y: scene, science, scissors, scent, muscle, fascinate.\nSilent l:\n• before k: walk, talk, chalk, folk, yolk;\n• before f, m: half, calf, calm, palm, salmon;\n• in could, should, would.\nBe careful: in “film”, “milk” and “help” the l IS pronounced.\nLearn these spellings well: you cannot hear the silent letter.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Which letter is silent in “scissors” and in “chalk”?","steps":["In “scissors”, the c after s is not pronounced.","In “chalk”, the l before k is not pronounced."],"answer":"c in scissors; l in chalk","checks":[]},"teach":{"cards":[{"id":"c97-1","status":"draft","idea":"Silent c: after s, before e, i or y.","vars":{},"example":["science, scene"],"checks":[],"check":{"ref":"e2-97-c"}},{"id":"c97-2","status":"draft","idea":"Silent l: before k, f and m, and in could, should, would.","vars":{},"example":["walk, half, 3,"wrong":1}}]},"98":{"subject":"english-language","class":"Form 2","lesson_no":98,"language":"en","prerequisites":[85],"skills":[{"id":"e2-98","name":"Naming musical instruments"}],"note":{"status":"draft","text":"Musical instruments are grouped by how they make sound:\n• percussion (struck or shaken): the drum, the talking drum, the tam-tam, the balafon, the xylophone, the rattle (maracas), the gong, the bell;\n• string (strings are plucked or bowed): the guitar, the harp, the violin, the mvet (a Beti harp-zither), the kora;\n• wind (you blow into them): the flute, the trumpet, the saxophone, the horn, the whistle;\n• keyboard: the piano, the keyboard (electronic), the organ.\nPeople: a drummer, a guitarist, a pianist, a flautist, a band, an orchestra.\nDrawing task: in your exercise book, draw two instruments from your region and label their parts (for example: drum — body, skin, ropes; guitar — body, neck, strings, sound hole).","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"To which group does the mvet belong?","steps":["The mvet has strings that are plucked.","Instruments with strings belong to the string group."],"answer":"the string instruments","checks":[]},"teach":{"cards":[{"id":"c98-1","status":"draft","idea":"Percussion instruments are struck or shaken: drum, balafon, rattle.","vars":{},"example":["The drummer beats the drum."],"checks":[],"check":{"ref":"e2-98-group"}},{"id":"c98-2","status":"draft","idea":"String instruments have strings; wind instruments are blown.","vars":{},"example":["guitar (string), flute (wind)"],"checks":[],"check":{"ref":"e2-98-match"}},{"id":"c98-3","status":"draft","idea":"A person who plays a guitar is a guitarist; a piano, a pianist.","vars":{},"example":["The drummer leads the band."],"checks":[],"check":{"id":"e2-98-player-card","type":"cloze","level":1,"review":"authored","sources":["vocabulary"],"vars":{"X":{"pick":[{"s":"A person who plays the guitar is a ___.","a":"guitarist","w":["guitarer","guitarman"],"e":["Add -ist.","Add -ist."]},{"s":"A person who plays the piano is a ___.","a":"pianist","w":["pianer","pianoist"],"e":["piano → pianist.","piano → pianist."]},{"s":"A person who plays the drum is a ___.","a":"drummer","w":["drumist","drumer"],"e":["drum → drummer.","Double the m: drummer."]}]}},"prompt":"Choose the word that fits.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]}}]},"questions":[{"id":"e2-98-group","type":"mcq","level":1,"review":"rule","sources":["vocabulary"],"vars":{"X":{"pick":[{"i":"the balafon","a":"percussion","w":["wind","string","keyboard"]},{"i":"the flute","a":"wind","w":["percussion","string","keyboard"]},{"i":"the guitar","a":"string","w":["wind","percussion","keyboard"]},{"i":"the talking drum","a":"percussion","w":["wind","string","keyboard"]},{"i":"the saxophone","a":"wind","w":["string","percussion","keyboard"]},{"i":"the piano","a":"keyboard","w":["wind","percussion","string"]}]}},"prompt":"To which group does “{X.i}” belong?","correct":"{X.a}","distractors":[{"text":"{X.w[0]}","misconception":"g"},{"text":"{X.w[1]}","misconception":"g"},{"text":"{X.w[2]}","misconception":"g"}],"misconceptions":[{"id":"g","explain":"Ask how it makes sound: struck/shaken, plucked strings, blown, or keys."}],"solution":["Struck or shaken: percussion; strings: string; blown: wind; keys: keyboard.","So: {answer}."]},{"id":"e2-98-match","type":"matching","level":1,"review":"authored","sources":["vocabulary"],"prompt":"Match each instrument to how it is played.","pool":[{"left":"drum","right":"beaten with the hands or sticks"},{"left":"flute","right":"blown"},{"left":"guitar","right":"strings plucked"},{"left":"rattle","right":"shaken"},{"left":"piano","right":"keys pressed"}],"pick":4},{"id":"e2-98-player","type":"cloze","level":2,"review":"authored","sources":["vocabulary"],"vars":{"X":{"pick":[{"s":"A person who plays the guitar is a ___.","a":"guitarist","w":["guitarer","guitarman"],"e":["Add -ist.","Add -ist."]},{"s":"A person who plays the piano is a ___.","a":"pianist","w":["pianer","pianoist"],"e":["piano → pianist.","piano → pianist."]},{"s":"A person who plays the drum is a ___.","a":"drummer","w":["drumist","drumer"],"e":["drum → drummer.","Double the m: drummer."]}]}},"prompt":"Choose the word that fits.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-98-spot","type":"spot_error","level":3,"review":"authored","sources":["vocabulary"],"prompt":"Which statement is wrong?","pool":{"right":[{"text":"The balafon is a percussion instrument.","truth":"true"},{"text":"The flute is a wind instrument.","truth":"true"},{"text":"The guitar has strings.","truth":"true"},{"text":"A drummer plays the drum.","truth":"true"}],"wrong":[{"text":"The trumpet is a string instrument.","truth":"false","explain":"You blow into it: a wind instrument."},{"text":"The rattle is played by blowing.","truth":"false","explain":"It is shaken: percussion."},{"text":"A pianist plays the guitar.","truth":"false","explain":"A pianist plays the piano."}]},"pick":{"right":3,"wrong":1}}]},"99":{"subject":"english-language","class":"Form 2","lesson_no":99,"language":"en","prerequisites":[],"skills":[{"id":"e2-99","name":"Review of punctuation"}],"note":{"status":"draft","text":"• Full stop (.): ends a statement.  • Question mark (?): ends a question.  • Exclamation mark (!): shows strong feeling.\n• Comma (,): separates items in a list (“drums, flutes and guitars”), after an introductory word (“However, …”), and before direct speech.\n• Apostrophe ('): shows possession (Tabe's guitar, the actors' costumes) or a missing letter (don't, it's = it is).\n• Quotation marks (“ ”): enclose the exact words spoken: She said, “The film starts at eight.”\n• Colon (:): introduces a list or an explanation.  • Capital letters: at the start of a sentence, for names, places, days, months, titles.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Punctuate: “tabe asked where is the cinema”","steps":["Capital letters for the start and the name: Tabe.","Direct speech in quotation marks with a comma before it, and a question mark: Tabe asked, “Where is the cinema?”"],"answer":"Tabe asked, “Where is the cinema?”","checks":[]},"teach":{"cards":[{"id":"c99-1","status":"draft","idea":"Full stop for statements, question mark for questions, exclamation mark for strong feeling.","vars":{},"example":["What a great show!"],"checks":[],"check":{"ref":"e2-99-end"}},{"id":"c99-2","status":"draft","idea":"The apostrophe shows possession or a missing letter.","vars":{},"example":["Tabe's drum; don't"],"checks":[],"check":{"ref":"e2-99-apos"}},{"id":"c99-3","status":"draft","idea":"Quotation marks enclose the exact words spoken.","vars":{},"example":["He said, “I love makossa.”"],"checks":[],"check":{"id":"e2-99-spot-card","type":"spot_error","level":1,"review":"authored","sources":["grammar-tenses"],"prompt":"Which sentence is punctuated wrongly?","pool":{"right":[{"text":"Ngum said, “The show was great.”","truth":"true"},{"text":"We bought drums, flutes and a guitar.","truth":"true"},{"text":"Is the film funny?","truth":"true"},{"text":"Tabe's sister is an actress.","truth":"true"}],"wrong":[{"text":"the film starts on monday.","truth":"false","explain":"Capital letters: The … Monday."},{"text":"He said I love music.","truth":"false","explain":"Use a comma and quotation marks: He said, “I love music.”"},{"text":"Wheres the cinema?","truth":"false","explain":"Where's needs an apostrophe."}]},"pick":{"right":3,"wrong":1}}}]},"questions":[{"id":"e2-99-end","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"Where is the concert hall___","a":"?","w":[".","!"],"e":["It is a question.","It is a question, not a cry."]},{"s":"What a wonderful dancer she is___","a":"!","w":["?",","],"e":["It shows strong feeling, not a question.","A sentence ends with a stop mark."]},{"s":"The film starts at eight o'clock___","a":".","w":["?","!"],"e":["It is a statement.","It is a simple statement."]}]}},"prompt":"Choose the punctuation mark that fits.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-99-apos","type":"mcq","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"q":"Which is correct for “the guitar that belongs to Bih”?","r":"Bih's guitar","w":["Bihs guitar","Bihs' guitar","Bih guitar's"],"e":["Add an apostrophe.","One owner: 's.","The apostrophe goes after the owner."],"y":"Owner + 's."},{"q":"Which is correct for “the costumes of the actors”?","r":"the actors' costumes","w":["the actor's costumes","the actors costume's","the actors's costumes"],"e":["Many actors: after the s.","Wrong place.","Plural ending in s: just '."],"y":"Plural owners ending in s: s'."},{"q":"What is the short form of “it is”?","r":"it's","w":["its","its'","i'ts"],"e":["“its” shows possession.","Not a word.","The apostrophe replaces the i."],"y":"The apostrophe replaces the missing letter."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-99-spot","type":"spot_error","level":2,"review":"authored","sources":["grammar-tenses"],"prompt":"Which sentence is punctuated wrongly?","pool":{"right":[{"text":"Ngum said, “The show was great.”","truth":"true"},{"text":"We bought drums, flutes and a guitar.","truth":"true"},{"text":"Is the film funny?","truth":"true"},{"text":"Tabe's sister is an actress.","truth":"true"}],"wrong":[{"text":"the film starts on monday.","truth":"false","explain":"Capital letters: The … Monday."},{"text":"He said I love music.","truth":"false","explain":"Use a comma and quotation marks: He said, “I love music.”"},{"text":"Wheres the cinema?","truth":"false","explain":"Where's needs an apostrophe."}]},"pick":{"right":3,"wrong":1}},{"id":"e2-99-spot2","type":"mcq","level":3,"review":"authored","sources":["grammar-tenses"],"prompt":"Which sentence is punctuated correctly?","pool":{"right":[{"text":"On Saturday, we watched a film in Yaoundé.","truth":"true"},{"text":"“Come here!” shouted the director.","truth":"true"},{"text":"We need three things: a camera, a script and actors.","truth":"true"},{"text":"It's late.","truth":"true"}],"wrong":[{"text":"on saturday we watched a film in yaoundé","truth":"false","explain":"Capitals for the start, the day and the town; a full stop at the end."},{"text":"Its' a beautiful song.","truth":"false","explain":"It's (it is) a beautiful song."},{"text":"The actors costume's were red.","truth":"false","explain":"The actors' costumes were red."}]},"pick":{"right":1,"wrong":3}}]},"100":{"subject":"english-language","class":"Form 2","lesson_no":100,"language":"en","prerequisites":[91],"skills":[{"id":"e2-100","name":"Conjunctions"}],"note":{"status":"draft","text":"A conjunction joins words, phrases or clauses.\n• Coordinating conjunctions join equal parts: and (adds), but (contrasts), or (choice), so (result), for, nor, yet. “I like films, but my brother prefers music.”\n• Subordinating conjunctions introduce a dependent clause: because, since (reason); although, though (contrast); when, while, after, before, until (time); if, unless (condition); so that (purpose).\n“We stayed inside because it was raining.” “Although she was tired, she danced all night.”\n• Correlative pairs: both … and, either … or, neither … nor, not only … but also.\nA comma is used after a subordinate clause at the start: “When the film ended, we went home.”","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Join with a suitable conjunction: “The concert was cancelled. The singer was ill.”","steps":["The second sentence gives the reason for the first.","A reason is introduced by “because”: The concert was cancelled because the singer was ill."],"answer":"The concert was cancelled because the singer was ill.","checks":[]},"teach":{"cards":[{"id":"c100-1","status":"draft","idea":"and adds, but contrasts, or gives a choice, so gives a result.","vars":{},"example":["I was tired, so I slept."],"checks":[],"check":{"ref":"e2-100-co"}},{"id":"c100-2","status":"draft","idea":"because gives a reason; although gives a contrast; when gives a time; if gives a condition.","vars":{},"example":["If it rains, we will stay home."],"checks":[],"check":{"id":"e2-100-sub-card","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"We stayed inside ___ it was raining.","a":"because","w":["although","unless"],"e":["It gives the reason.","It gives the reason."]},{"s":"___ she was tired, she danced all night.","a":"Although","w":["Because","If"],"e":["There is a contrast.","There is a contrast."]},{"s":"You will not pass ___ you study.","a":"unless","w":["because","although"],"e":["unless = if not.","unless = if not."]},{"s":"Switch off your phone ___ the film starts.","a":"before","w":["unless","although"],"e":["It gives a time.","It gives a time."]}]}},"prompt":"Choose the conjunction that fits.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]}},{"id":"c100-3","status":"draft","idea":"Pairs: both … and, either … or, neither … nor." :{"status":"draft","vars":{},"problem":"Plan a short poem about a village festival.","steps":["Topic and title: “Festival Day”.","List images: drums beating, dancers in feathers, smoke of roasted corn.","Write short lines with rhymes: drum / come; light / night.","Add a chorus to repeat: “Come, come, the festival has come!”"],"answer":"Title → images → short rhyming lines → chorus → read aloud","checks":[]},"teach":{"cards":[{"id":"c101-1","status":"draft","idea":"Rhyme: words ending with the same sound.","vars":{},"example":["drum / come"],"checks":[],"check":{"ref":"e2-101-order"}},{"id":"c101-2","status":"draft","idea":"A simile compares with like or as.","vars":{},"example":["as bright as the sun"],"checks":[],"check":{"ref":"e2-101-order"}},{"id":"c101-3","status":"draft","idea":"A chorus is repeated after each verse of a song.","vars":{},"example":["Come, come, the festival has come!"],"checks":[],"check":{"ref":"e2-101-order"}}]},"questions":[{"id":"e2-101-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the steps of writing a poem in order.","items":[{"text":"Choose a topic"},{"text":"List words and images"},{"text":"Write short lines"},{"text":"Add rhymes and a title"},{"text":"Read it aloud and improve it"}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write a short song or poem (two or three stanzas of four lines, or verses with a chorus) in your exercise book about a festival, your village or a person you love. Use rhyme and at least one simile.","model":["Festival Day\n\nThe drums begin at the break of light,\nThe dancers shine in feathers bright;\nThe old men smile, the children run,\nTheir faces glowing like the sun.\n\nChorus: Come, come, the festival has come!\nDance to the rhythm of the drum!\n\nThe smoke of corn floats through the air,\nThe Fon sits proudly in his chair;\nWe sing the songs our fathers knew,\nOur culture old, our hearts still new."],"checklist":["My poem raft","text":"• Electric bulb (filament lamp): current heats a thin tungsten filament until it glows (electrical → light and heat). LED bulbs use much less energy.\n• Electric iron: current flows through a heating element; a thermostat (a bimetallic strip) switches it off when it is hot enough and on again when it cools.\n• Electric fan: an electric motor turns the blades (electrical → kinetic energy).\n• Refrigerator: a pump moves a cooling liquid that takes heat from inside and releases it at the back.\n• Radio: receives radio waves and changes them into sound in the loudspeaker.\n• Torch: a battery (chemical energy) lights a bulb when the switch closes the circuit.\nEnergy used = power × time; an appliance of high power uses more energy.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Why does an electric iron not keep getting hotter and hotter?","steps":["It has a thermostat (a bimetallic strip).","When the iron is hot enough, the strip bends and switches the current off; when it cools, it switches it on again."],"answer":"The thermostat switches the current off and on to keep the temperature steady.","checks":[]},"teach":{"cards":[{"id":"c35-1","status":"draft","idea":"A filament bulb turns electrical energy into light and heat.","vars":{},"example":["The filament glows."],"checks":[],"check":{"ref":"p2-35-energy"}},{"id":"c35-2","status":"draft","idea":"A thermostat switches a heater off when it is hot enough.","vars":{},"example":["An iron has a thermostat."],"checks":[],"check":{"ref":"p2-35-thermo"}},{"id":"c35-3","status":"draft","idea":"A motor turns electrical energy into movement (kinetic energy).","vars":{},"example":["A fan uses a motor."],"checks":[],"check":{"id":"p2-35-power-card","type":"numeric","level":1,"review":"rule","sources":["technology"],"vars":{"p":{"pick":[50,60,75,100,200,500]},"h":{"int":[2,10]}},"prompt":"A {p} W fan works for {h} hours. How much energy does it use in kilowatt-hours (kWh)?","answer":"p * h / 100 "status":"draft","idea":"Mass lost = mass before − mass after.","vars":{},"example":["{20} g → {11.2} g: {8.8} g lost."],"checks":[],"check":{"id":"k2-51-lost-card","type":"numeric","level":1,"review":"rule","sources":["heat-action"],"vars":{"m":{"pick":[5,10,15,20,25,50]},"a":{"expr":"m"},"b":{"expr":"dec(m * 0.56)"}},"prompt":"A carbonate of mass {a} g is heated to constant mass. {b} g of solid remains. What mass of carbon dioxide was lost?","answer":"dec(a - b)","misconceptions":[{"id":"sum","wrong":"dec(a + b)","explain":"Subtract: the gas that escaped is the difference."}],"solution":["Mass lost = before − after.","{a} − {b} = {answer} g."],"unit":"g"}},{"id":"c51-3","status":"draft","idea":"Heat to constant mass to make sure all the carbonate has decomposed.","vars":{},"example":["Weigh, heat, cool, weigh again."],"checks":[],"check":{"id":"k2-51-pct-card","type":"numeric","level":1,"review":"rule","sources":["heat-action"],"vars":{"a":{"pick":[10,20,25,50,100]},"l":{"expr":"dec(a * 0.44)"}},"prompt":"{a} g of calcium carbonate loses {l} g on heating. What is the percentage loss?","answer":"dec(l / a * 100)","misconceptions":[{"id":"mass","wrong":"l","explain":"That is the mass; divide by the starting mass and × {100}."}],"solution":["Percentage = mass lost ÷ starting mass × {100}.","{l} ÷ {a} × {100} = {answer}%."],"unit":"%"}}]},"questions":[{"id":"k2-51-why","type":"mcq","level":1,"review":"authored","sources":["heat-action"],"vars":{"X":{"pick":[{"q":"Why does the mass of calcium carbonate decrease when heated in an open crucible?","r":"Carbon dioxide gas escapes.","w":["Matter is destroyed.","The crucible melts.","Oxygen from the air is added."],"e":["Mass is conserved.","It does not melt.","That would increase the mass."],"y":"The gas leaves the crucible."},{"q":"Why do we heat to constant mass?","r":"to make sure all the carbonate has decomposed","w":["to make the crucible heavier","to cool the solid","to add water"],"e":["Not the reason.","Not the reas ; protect yourself from strong sun.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Why is the thinning of the ozone layer dangerous for people?","steps":["The ozone layer absorbs harmful ultraviolet rays.","When it is thin, more UV reaches us, causing skin cancer and eye damage."],"answer":"More UV rays reach the Earth and cause skin cancer and eye damage.","checks":[]},"teach":{"cards":[{"id":"c50-1","status":"draft","idea":"Ozone (O₃) is a gas of three oxygen atoms; the ozone layer is high in the atmosphere.","vars":{},"example":["About {15}–{35} km up."],"checks":[],"check":{"ref":"b2-50-what"}},{"id":"c50-2","status":"draft","idea":"The ozone layer absorbs harmful ultraviolet rays from the sun.","vars":{},"example":["It protects living things."],"checks":[],"check":{"ref":"b2-50-role"}},{"id":"c50-3","status":"draft","idea":"CFCs from old fridges and sprays destroy ozone; the Montreal Protocol banned most of them.","vars":{},"example":["Use CFC-free products."],"checks":[],"check":{"id":"b2-50-cause-card","type":"mcq","level":1,"review":"authored","sources":["waste-ozone"],"vars":{"X":{"pick":[{"q":"Which chemicals destroy the ozone layer?","r":"CFCs (chlorofluorocarbons)","w":["oxygen and nitrogen","water and salt","sugar and starch"],"e":["Natural gases of the air.","Not involved.","Not involved."],"y":"From old fridges and sprays."},{"q":"Which international agreement banned most CFCs?","r":"the Montreal Protocol","w":["the OHADA treaty","the Treaty of Versailles","the Port Louis treaty"],"e":["That is business law.","That ended World War One.","That is OHADA."],"y":"Signed in 1987."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questi /** A typed answer box (numbers or words): Enter or "Check" submits; the engine picks the keyboard. */
function answerBox(q, finish, inline = false) {

/** Cloze: the sentence with its blank inline. Typed: a box in the gap. Choose: a dotted gap, options below. */
function clozeSentence(q, box = null) {
  const [before, after] = q.sentence.split("___");
  return el("div", { class: "sentence" }, before, box || el("span", { class: "blank", "aria-label": "blank" }, " "), after);

/** Word order: tap a word to place it; tap a placed word to send it back. The final . ? or ! is fixed. */
function wordOrder(q, finish) {
  const placed = [];
  const line = el("div", { class: "built", "aria-live": "polite" });
  const pool = el("div", { class: "tiles" });
  const done = button(T("Check"), () => placed.length === q.items.length && finish([...placed]), "primary");
  const redraw = () => {
    line.replaceChildren(...(placed.length
      ? [...placed.map((i, k) => button(q.items[i], () => { placed.splice(k, 1); redraw(); }, "tile placed")), ...(q.end ? [el("span", { class: "end" }, q.end)] : [])]
      : [el("span", { class: "muted" }, T("Tap the words below."))]));
    fill(pool, q.items.map((t, i) => (placed.includes(i) ? null : button(t, () => { placed.push(i); redraw(); }, "tile"))));
    done.disabled = placed.length !== q.items.length;
  };

  return [para(T("Tap a word to add it. Tap a word in your sentence to take it out."), "muted"), line, pool, done];

/** Matching: tap a left item, then a right item, to pair them; tap a pair to undo it. */
function matching(q, finish) {
  const pairOf = q.left.map(() => null);  // left index → right index
  let picked = null;
  const done = button(T("Check"), () => pairOf.every((r) => r !== null) && finish([...pairOf]), "primary");
  const wrap = el("div", {});
  const redraw = () => {
    const rightUsed = new Map(pairOf.map((r, l) => [r, l]).filter(([r]) => r !== null));
    const badge = (n) => el("span", { class: "badge", "aria-hidden": "true" }, String(n + 1));
    const lefts = q.left.map((t, i) => {
      const paired = pairOf[i] !== null;
      return button([paired ? badge(i) : null, t], () => {
        if (paired) pairOf[i] = null; else picked = picked === i ? null : i;
        redraw();
      }, `match${paired ? " paired" : ""}${picked === i ? " picked" : ""}`);
    });
    const rights = q.right.map((t, r) => {
      const l = rightUsed.get(r);
      return button([l !== undefined ? badge(l) : null, t], () => {
        if (l !== undefined) pairOf[l] = null;
        else if (picked !== null) { pairOf[picked] = r; picked = null; }
        redraw();
      }, `match${l !== undefined ? " paired" : ""}${picked !== null && l === undefined ? " ready" : ""}`);
    });
    wrap.replaceChildren(el("div", { class: "match-cols" }, el("div", { class: "col" }, ...lefts), el("div", { class: "col" }, ...rights)));
    done.disabled = pairOf.some((r) => r === null);
  };
  redraw();
  return [para(T("Tap an item on the left, then its partner on the right. Tap a pair to undo it."), "muted"), wrap, done];
}

/** Sorting (matching with groups): tap a word, then tap its group; tap a word inside a group to take it out. */
function sorting(q, finish) {
  const groupOf = q.left.map(() => null);
  let picked = null;
  const done = button(T("Check"), () => groupOf.every((g) => g !== null) && finish([...groupOf]), "primary");
  const wrap = el("div", {});
  const redraw = () => {
    const loose = q.left.map((t, i) => (groupOf[i] === null ? button(t, () => { picked = picked === i ? null : i; redraw(); }, `tile${picked === i ? " picked" : ""}`) : null));
    const groups = q.right.map((g, gi) => el("div", { class: `group${picked !== null ? " ready" : ""}`, role: "button", tabindex: "0",
      onclick: (e) => { if (e.target.closest(".tile") || picked === null) return; groupOf[picked] = gi; picked = null; redraw(); },
      onkeydown: (e) => { if ((e.key === "Enter" || e.key === " ") && picked !== null) { e.preventDefault(); groupOf[picked] = gi; picked = null; redraw(); } } },
      el("div", { class: "group-name" }, g),
      el("div", { class: "tiles" }, ...q.left.map((t, i) => (groupOf[i] === gi ? button(t, () => { groupOf[i] = null; redraw(); }, "tile placed") : null)))));
    wrap.replaceChildren(el("div", { class: "tiles" }, ...loose), ...groups);
    done.disabled = groupOf.some((g) => g === null);
  };
  redraw();
  return [para(T("Tap a word, then tap its group. Tap a word in a group to take it out."), "muted"), wrap, done];
}

/** Shows q; calls onAnswer({result, ms}) when the pupil answers or presses "I don't know". */
function askQuestion(q, { kicker, title, onAnswer, bar = null, back = null }) {
  const t0 = performance.now();
  const finish = (response) => onAnswer({ result: check(q, response), ms: Math.round(performance.now() - t0) });
  const body = [bar, header(kicker, title), el("div", { class: "prompt" }, q.prompt), figureBox(q.figure)];
  if (q.type === "blanks") {
    // a step-by-step line: one small box per blank, all checked together (2026-10-19)
    const inputs = q.answers.map((_, i) => el("input", { type: "text", inputmode: "numeric", autocomplete: "off", class: "blank-input", "aria-label": T("Box {a}", { a: i + 1 }) }));
    const go = () => { const v = inputs.map((x) => normaliseInput(x.value, q)); if (v.every(Boolean)) finish(v); else inputs[v.findIndex((x) => !x)].focus(); };
    inputs.forEach((x, i) => x.addEventListener("keydown", (e) => { if (e.key === "Enter") (i < inputs.length - 1 && !inputs[i + 1].value ? inputs[i + 1].focus() : go()); }));
    setTimeout(() => inputs[0].focus(), 50);
    body.push(para(T("Fill in each box, then check."), "muted"),
      el("div", { class: "sentence blanks" }, q.parts.flatMap((p, i) => (i < inputs.length ? [p, inputs[i]] : [p]))), button(T("Check"), go, "primary"));
  } else if (q.type === "numeric") {
    const { input, check: go } = answerBox(q, finish);
    body.push(el("div", { class: "answer" }, input, q.unit ? el("span", { class: "unit" }, q.unit) : null), go);
  } else if (q.type === "cloze" && q.mode === "type") {
    const { input, check: go } = answerBox(q, finish, true);
    body.push(clozeSentence(q, input), go);
  } else if (q.type === "cloze") {
    body.push(clozeSentence(q), el("div", { class: "options" }, q.options.map((o, i) => button(o.text, () => finish(i), "option"))));
  } else if (q.type === "mcq" || q.type === "spot_error") {
    if (q.type === "spot_error") body.push(para(T("Tap the one that is wrong."), "muted"));
    body.push(el("div", { class: "options" }, q.options.map((o, i) => button(o.text, () => finish(i), "option"))));
  } else if (q.type === "ordering") {
    const chosen = [];
    const list = el("ol", { class: "chosen" });
    const pool = el("div", { class: "options" });
    const redraw = () => {
      list.replaceChildren(...chosen.map((i) => el("li", {}, q.items[i])));
      fill(pool, q.items.map((t, i) => (chosen.includes(i) ? null : button(t, () => { chosen.push(i); redraw(); }, "option"))));
      if (chosen.length === q.items.length) finish([...chosen]);
    };
    body.push(para(T("Tap them in order."), "muted"), list, pool, button(T("Start again"), () => { chosen.length = 0; redraw(); }, "link"));
    redraw();
  } else if (q.type === "word_order") {
    body.push(...wordOrder(q, finish));
  } else if (q.type === "matching") {
    body.push(...(q.groups ? sorting(q, finish) : matching(q, finish)));
  }
  body.push(button(T("I don't know"), () => finish(DONT_KNOW), "idk"), back);
  screen(...body);
}

// ---- days, streak, stars, badges (all on this phone only)
const dayOf = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayNum = (s) => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 86400000);
/** Marks today as a learning day (called on every answer in a lesson). */
function recordDay() {
  state.days = state.days || [];
  const t = dayOf();
  if (state.days[state.days.length - 1] !== t) state.days.push(t);
}
/** Learning days in the current run; a run survives up to two days off in a row. 0 if the last learning day was too long ago. */
function streak() {
  const days = [...new Set(state.days || [])].map(dayNum).sort((a, b) => a - b);
  if (!days.length || dayNum(dayOf()) - days[days.length - 1] > 3) return 0;
  let n = 1;
  for (let i = days.length - 1; i > 0 && days[i] - days[i - 1] <= 3; i--) n++;
  return n;
}
/** Stars for a finished lesson: 3 if at least 80% of first tries were right, 2 if at least half, otherwise 1. */
function starsOf(r) {
  if (!r?.done) return 0;
  if (r.stars) return r.stars;
  const first = r.rows.filter((x) => x.phase === "practice" && x.attempt === 1);
  const asked = first.length || r.rows.filter((x) => x.attempt === 1).length;
  if (!asked) return 3;
  const right = (first.length ? first : r.rows.filter((x) => x.attempt === 1)).filter((x) => x.result === "right").length / asked;
  return right >= 0.8 ? 3 : right >= 0.5 ? 2 : 1;
}

let S = "maths";                            // the subject of the lesson on screen
const C = () => state.current[S];
const L = () => CONTENT[S][C().lesson];
const N = () => C().lesson;

/** Opens lesson n: carries on a saved, unfinished flow, otherwise starts it fresh. */
function openLesson(s, n) {
  withSubject(s, () => {
    S = s;
    document.documentElement.lang = inFrench(s) ? "fr" : "en";  // screen readers read French lessons in French
    const cur = state.current[s];
    if (cur?.lesson === n && !teach.isDone(cur.flow)) { cur.at = new Date().toISOString(); return lesson(resumable(cur.flow)); }
    state.current[s] = { lesson: n, flow: teach.startTeach(CONTENT[s][n], newSeed()), rows: [], at: new Date().toISOString() };
    save();
    lesson(state.current[s].flow);
  });
}
/** Starts lesson n again from its first card: clears its saved run (stars, answers) and any unfinished flow,
 *  after the pupil confirms. Badges already earned and other lessons are kept. */
function resetLesson(s, n) {
  if (!confirm(`Start Lesson ${n} again from the beginning?\nYour stars and saved answers for this lesson will be cleared.`)) return;
  delete state.lessons[lessonKey(s, n)];
  if (state.current[s]?.lesson === n) delete state.current[s];
  save();
  openLesson(s, n);
}
/** Review has its own saved run; the original lesson answers and stars are kept. */
function openReview(s, n) {
  withSubject(s, () => {
    S = s;
    document.documentElement.lang = inFrench(s) ? "fr" : "en";
    const cur = state.current[s];
    if (cur?.lesson === n && cur.reviewMode && !teach.isDone(cur.flow)) return lesson(resumable(cur.flow));
    const ids = state.lessons[lessonKey(s, n)]?.review || [];
    const flow = teach.startReview(CONTENT[s][n], ids, newSeed());
    if (!flow.steps.length) return menu();
    // Keep another unfinished lesson available when this short review finishes.
    state.current[s] = { lesson: n, flow, rows: [], reviewMode: true, reviewIds: ids,
      previousCurrent: cur, at: new Date().toISOString() };
    lesson(flow);
  });
}
/** A flow saved mid-feedback resumes on a question: "retry" → the fresh variant, "reveal" → the next step. */
const resumable = (flow) => (flow.phase === "retry" || flow.phase === "reveal" ? teach.nextPhase(flow) : flow);

const workedBlock = () => {
  const w = renderWorked(L().worked_example, LIB());
  return el("div", { class: "example" }, el("div", { class: "kicker" }, T("Worked example")), el("div", { class: "strong pre" }, w.problem),
    figureBox(w.figure), el("ol", {}, w.steps.map((s) => el("li", {}, s))), para(T("Answer: {a}", { a: w.answer }), "strong"));
};
const cardExample = (c) => el("div", { class: "example" }, el("div", { class: "kicker" }, T("Example")), ...c.example.map((t) => para(t)), figureBox(c.figure));
const hintBlock = (q) => (q.hint ? el("div", { class: "hint" }, el("strong", {}, T("Hint: ")), q.hint) : null);

/** Every screen of a lesson goes through here, so the flow is saved at each step. */
function lesson(flow, previous = null) {
  C().flow = flow;
  save();
  if (teach.isDone(flow)) return results(flow);
  const Ln = L(), n = N();
  const step = flow.steps[flow.step];
  const nCards = Ln.teach.cards.length;
  const nPractice = flow.steps.filter((s) => s.kind === "practice").length;
  const practiceNo = flow.steps.slice(0, flow.step + 1).filter((s) => s.kind === "practice").length;
  const kicker = step.kind === "card" ? T("Lesson {n} · Idea {a} of {b}", { n, a: step.card + 1, b: nCards }) : T("Lesson {n} · Practice {a} of {b}", { n, a: practiceNo, b: nPractice });
  const go = (next, prev = null) => () => lesson(next, prev);
  const bar = progress(flow.step + 1, flow.steps.length);

  if (step.kind === "card" && flow.phase === "idea") {
    const c = teach.renderCard(Ln.teach.cards[step.card], LIB());
    return screen(bar, header(kicker, TITLES[S][n]), el("div", { class: "idea" }, c.idea), cardExample(c),
      button(T("I'm ready for a question"), go(teach.nextPhase(flow)), "primary"), toMenu());
  }
  if (step.kind === "card" || step.kind === "practice") {
    const q = teach.itemQuestion(Ln, flow, LIB(), previous);
    return askQuestion(q, {
      bar, kicker, back: toMenu(), title: q.type === "blanks" ? T("Step by step") : flow.attempt ? T("A new question") : step.kind === "card" ? T("Quick check") : T("Level {a}", { a: q.level }),
      onAnswer: ({ result, ms }) => {
        C().rows.push({ ...recordOf(q, result, ms, step.kind), card: step.kind === "card" ? Ln.teach.cards[step.card].id : "", attempt: flow.attempt + 1 });
        recordDay();
        const next = teach.answerItem(flow, result, ms);
        C().flow = next;
        save();
        if (next.phase === "reveal") return reveal(q, next, kicker, bar, result);
        if (next.phase === "retry") return retry(q, result, next, kicker, bar);
        // Teach mode only: green flash + check icon (readiness shows no right/wrong cues).
        return screen(bar, el("div", { class: "fb good flash", role: "status" }, checkIcon(), el("strong", {}, T("Correct!")),
          // 517 typed for 51₇: right, with a gentle word that the base is not typed
          result.baseTyped ? para(`Well done. You don't need to type the base: ${q.answer} is enough (the small ${q.base} only shows it is base ${q.base}).`) : null),
          button(T("Next"), go(next), "primary"), toMenu());
      },
    });
  }
  if (step.kind === "worked_example") {
    return screen(bar, header(T("Lesson {n} · Worked example", { n }), T("Follow each step")), workedBlock(),
      button(T(Ln.paper_task ? "Now write" : "Now practise"), go(teach.nextPhase(flow)), "primary"), toMenu());
  }
  if (step.kind === "paper") return paperTask(flow, bar);
  if (step.kind === "note") {
    return screen(bar, header(T("Lesson {n} · Summary", { n }), TITLES[S][n]), el("div", { class: "note" }, ...lines(Ln.note.text)),
      button(T("Finish"), go(teach.nextPhase(flow)), "primary"));
  }
}

/**
 * Writing lessons: the task → the pupil writes in the exercise book → "I've written it" → model answer and a
 * self-check list. The ticks are kept for the parent summary only; the app does not mark the writing (TR-E25).
 */
function paperTask(flow, bar) {
  const p = teach.renderPaper(L(), LIB()), n = N();
  const ticks = C().paper?.ticks || p.checklist.map(() => false);
  const write = () => screen(bar, header(`Lesson ${n} · Your turn to write`, "Write in your exercise book"),
    el("div", { class: "idea pre" }, p.prompt),
    para("Take your time. When you have finished writing, tap the button.", "muted"),
    button("I've written it", () => { C().paper = { written: true, ticks }; save(); review(); }, "primary"), toMenu());
  const review = () => {
    const boxes = p.checklist.map((item, i) => {
      const box = el("input", { type: "checkbox", id: `tick${i}` });
      box.checked = !!ticks[i];
      box.addEventListener("change", () => { ticks[i] = box.checked; C().paper = { written: true, ticks }; save(); });
      return el("label", { class: "tickrow", for: `tick${i}` }, box, el("span", {}, item));
    });
    screen(bar, header(`Lesson ${n} · Check your writing`, "Compare with this example"),
      el("div", { class: "example" }, el("div", { class: "kicker" }, "An example answer"), ...p.model.map((m) => para(m))),
      para("Look at your own writing. Tick each thing you did.", "strong"),
      el("div", { class: "ticks" }, boxes),
      para("There is no score for writing. A grown-up can look at your exercise book.", "muted"),
      button("Done", () => lesson(teach.nextPhase(flow)), "primary"));
  };
  return C().paper?.written ? review() : write();
}

/**
 * First miss, then a fresh variant (asked step by step when the template has a scaffold). Since 2026-10-19:
 *  - "I don't know": the hint, then this question's own working, one step per tap, then a new question;
 *  - a wrong answer: what the mistake was (a known misconception when the answer matches one), then for computed
 *    questions "one like it": another variant of the same shape with its working, so the example fits the question.
 */
function retry(q, result, flow, kicker, bar) {
  const step = flow.steps[flow.step];
  const again = (seen) => button(T("Try a new question"), () => lesson(teach.nextPhase(flow), seen), "primary");
  const workingBox = (title, x, list) => el("div", { class: "example" }, el("div", { class: "kicker" }, title), el("div", { class: "strong pre" }, x.prompt), figureBox(x.figure), list);
  if (result.dontKnow && q.solution?.length) {
    const list = el("ol", { "aria-live": "polite" }), tail = el("div", {});
    let shown = 0;
    const more = () => {
      list.append(el("li", {}, q.solution[shown++]));
      fill(tail, [shown < q.solution.length ? button(T("Show the next step"), more, "primary") : again(q)]);
    };
    screen(bar, header(kicker, T("Let's try again")),
      el("div", { class: "fb soft", role: "status" }, el("strong", {}, T("That's fine. Let's look at it together."))),
      hintBlock(q), workingBox(T("Here is how to do this one"), q, list), tail, toMenu());
    return more();
  }
  const wrongPairs = result.wrongPairs?.length
    ? para(T(result.wrongPairs.length === 1 ? "This one is not right yet: {a}." : "These are not right yet: {a}.", { a: result.wrongPairs.map((i) => q.left[i]).join(", ") })) : null;
  const box = result.dontKnow
    // "I don't know" on a question without written working: the hint and the worked example (spec §4)
    ? el("div", { class: "fb soft", role: "status" }, el("strong", {}, T("That's fine. Let's look at it together.")))
    : el("div", { class: "fb bad shake", role: "status" }, el("strong", {}, T("✗ Not quite")),
      result.misconception?.explain ? para(result.misconception.explain) : wrongPairs || para(T("Look at the example again, then try a new question.")));
  const like = result.dontKnow ? null : teach.exampleLike(L(), flow, LIB(), q);
  const help = like ? [workingBox(T("Here is one like it"), like, el("ol", {}, like.solution.map((s) => el("li", {}, s))))]
    : step.kind === "card" ? [result.dontKnow ? hintBlock(q) : null, cardExample(teach.renderCard(L().teach.cards[step.card], LIB()))]
    : result.dontKnow ? [hintBlock(q), workedBlock()] : [];
  screen(bar, header(kicker, T("Let's try again")), box, ...help, again(like ? [q, like] : q), toMenu());
}

/** Second miss: the correct answer with full working, then move on (marked "needs review"). */
function reveal(q, flow, kicker, bar, result) {
  const shown = q.type === "matching" ? T("Here are the right answers.")
    : T("The answer is: {a}", { a: `${q.answer}${q.base ? LIB().sub(q.base) : ""}${q.unit ? " " + q.unit : ""}` });  // 51₇, not 51
  screen(bar, header(kicker, T("Here is how to do it")),
    el("div", { class: result.dontKnow ? "fb soft" : "fb bad shake", role: "status" }, el("strong", {}, shown)),
    el("div", { class: "example" }, el("div", { class: "kicker" }, T("Full working")), el("ol", {}, q.solution.map((s) => el("li", {}, s)))),
    para(T("We will come back to this one later."), "muted"),
    button(T("Continue"), () => lesson(teach.nextPhase(flow)), "primary"), toMenu());
}
