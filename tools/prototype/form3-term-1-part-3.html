mmunity had agreed or that all resistance had ended."},{"heading":"Apply the ideas locally","text":"The German-Duala treaty conventionally dated {12} July {1884} and Nachtigal's flag raising on {14} July must be distinguished. A document signed by particular rulers had a specific scope. The later extension of German control required further diplomacy, coercion and military action. Do not compress these different stages into one event covering the whole modern territory."},{"heading":"Reason and check","text":"Build a sequence: prior contact and rivalry, coastal negotiations, imperial claim and inland expansion. Ask whose authority a treaty could actually bind. Compare the wording of a claim with the extent of control on the ground and with evidence of dissent."}],"key_words":[{"word":"commercial pressure","meaning":"firms encouraging official action to protect their interests"},{"word":"treaty negotiation","meaning":"discussion and signing of terms by particular parties"},{"word":"imperial claim","meaning":"a state's assertion of colonial authority"},{"word":"consolidation","meaning":"extension and enforcement of an initially asserted authority"}],"examples":["German trading interests urge imperial involvement on the coast.","Coastal rulers and German representatives agree a document with stated conditions.","A German flag ceremony publicly asserts a protectorate claim."],"mistake":{"wrong":"Commercial firms were completely unrelated to imperial lobbying.","right":"commercial pressure: firms encouraging official action to protect their interests.","why":"Trading interests helped encourage official protection and colonial claims."}},"worked_example":{"status":"draft","vars":{},"problem":"German trading interests urge imperial involvement on the coast. Which concept applies?","steps":["Identify the features of the case.","Firms encouraging official action to protect their interests.","Trading interests helped encourage official protection and colonial claims."],"answe l authority.","truth":"true","explain":"This statement is correct: administrative station means a local base supporting colonial authority. Look for a claim that conflicts with its definition."},{"text":"alliance: cooperation between actors for particular aims.","truth":"true","explain":"This statement is correct: alliance means cooperation between actors for particular aims. Look for a claim that conflicts with its definition."},{"text":"contested expansion: extension of authority challenged by local action.","truth":"true","explain":"This statement is correct: contested expansion means extension of authority challenged by local action. Look for a claim that conflicts with its definition."}],"wrong":[{"text":"An armed punitive expedition is a neutral population survey.","truth":"false","explain":"Its coercive purpose must be distinguished from observation alone."},{"text":"A station proves identical control over every neighbouring community.","truth":"false","explain":"A local base is evidence of a presence, not universal effective control."},{"text":"An alliance proves permanent agreement on every later policy.","truth":"false","explain":"Alliances can be limited and change with circumstances."},{"text":"A coloured colonial map proves all local opposition has disappeared.","truth":"false","explain":"A claim on a map and control accepted on the ground are not the same."}]},"pick":{"right":3,"wrong":1}}]},"10":{"subject":"history","class":"Form 3","lesson_no":10,"language":"en","prerequisites":[],"skills":[{"id":"y3-10","name":"Responses to German rule: resistance and protest"}],"note":{"status":"draft","text":"Resistance to German expansion included armed defence, petitions and refusal of imposed demands. Bakweri, Bangwa, Mamfe/Cross River and Nso campaigns had distinct causes and sequences. Early coastal conflict must also be separated from the later Duala land protest associated with Rudolf Duala Manga Bell. Compare demand, response and consequence, keeping African decisions visible. An official label such as rebellion does not prove that a community had freely accepted colonial authority. A military defeat did not erase continuing opposition or the costs of colonial rule.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Coastal and Bakweri responses","text":"Lock Priso’s opposition in {1884} differed from later Duala land petitions. Rudolf Duala Manga Bell challenged expropriation and was executed in {1914}. Around Buea, Kuva Likenye defended Bakweri authority and land against intrusion. His forces repelled the German attack in {1891}; a better-armed attack in {1894} defeated them. An early victory did not ensure permanent independence."},{"heading":"Bangwa: recruitment and changing relations","text":"Asunganyi initially received Gustav Conrau, who recruited workers for coastal plantations in {1898}. When Conrau sought more workers without the earlier recruits returning, relations deteriorated. Conrau was detained and died after attempting escape; accounts differ about the precise circumstances. Bangwa resistance met repeated German raids, destruction and seizures. Asunganyi continued opposition before his capture and exile in {1911}. Initial cooperation did not mean unconditional consent."},{"heading":"Mamfe and the Upper Cross River","text":"Colonial intrusion, coercion and commercial demands provoked opposition among communities around the Cross River. In {1904}, Pückler-Limpurg’s expedition met armed resistance; he died during the fighting. Attacks also targeted trading posts. German forces retaliated through destructive campaigns, including burning settlements and crops and executing opponents. Colonial control followed severe repression. Mamfe is a regional label here, not proof that every community had one ruler or identical aims."},{"heading":"Nso: distinguish the encounters","text":"Nso defended its authority amid unequal colonial demands. Pavel’s armed presence must be distinguished from Houben’s attack in {1902} and the further campaign in {1906}, after which German control and tribute demands were imposed. The palace suffered burning and looting during military violence. Ngonnso’s removal has a contested acquisition history: do not assign it to a particular battle without evidence. Compare local memory and colonial records, then explain each campaign’s causes, methods and consequences."}],"key_words":[{"word":"Bakweri resistance","meaning":"Kuva Likenye’s defence around Buea against German intrusion"},{"word":"Bangwa resistance","meaning":"opposition associated with Asunganyi and demands for plantation workers"},{"word":"Mamfe/Cross River resistance","meaning":"armed opposition to German intrusion in the Upper Cross River region"},{"word":"Nso resistance","meaning":"defence of Nso authority through conflicts culminating in imposed control"},{"word":"Duala land protest","meaning":"appeals against colonial land expropriation associated with Rudolf Duala Manga Bell"}],"examples":["Kuva Likenye’s forces repel the attack of {1891} before a renewed attack in {1894}.","A dispute over recruited workers precedes Bangwa resistance and German raids.","The fighting of {1904} includes attacks on an expedition and trading posts, followed by German reprisals."],"mistake":{"wrong":"The Bakweri victory in {1891} prevented every later German attack.","right":"Bakweri resistance: Kuva Likenye’s defence around Buea against German intrusion.","why":"The initial success was followed by renewed attack and defeat in {1894}."}},"worked_example":{"status":"draft","vars":{},"problem":"Kuva Likenye’s forces repel the attack of {1891} before a renewed attack in {1894}. Which concept applies?","steps":["Identify the features of the case.","Kuva likenye’s defence around buea against german intrusion.","The initial success was followed by renewed attack and defeat in {1894}."],"answer":"Bakweri resistance","checks":[]},"teach":{"cards":[{"id":"cy3-10-terms","status":"draft","ide nd communities rather than giving one unqualified verdict."},{"heading":"Apply the ideas locally","text":"A railway can carry produce and people while also serving extraction and colonial control. A plantation can increase export output while taking land and demanding labour. A school record can show educational activity without proving universal access. The useful historical question is not merely whether a facility existed, but how it operated in an unequal colonial system."},{"heading":"Reason and check","text":"For each change, identify its purpose, beneficiaries and burdens. Separate infrastructure, political control and social institutions. Avoid using one building as proof that colonial rule was universally beneficial or using the existence of coercion to deny that any material change occurred."}],"key_words":[{"word":"colonial administration","meaning":"institutions enforcing the imperial governing framework"},{"word":"export orientation","meaning":"production organised substantially for overseas markets"},{"word":"coercive labour demand","meaning":"work required through force or unequal colonial compulsion"},{"word":"unequal access","meaning":"benefits or services distributed unevenly"}],"examples":["Officials and stations organise revenue collection and authority.","Plantation produce is transported toward the coast for export.","Workers face imposed labour obligations linked to colonial projects."],"mistake":{"wrong":"A colonial institution was elected equally by every affected community.","right":"colonial administration: institutions enforcing the imperial governing framework.","why":"Imperial authority did not rest on universal local democratic consent."}},"worked_example":{"status":"draft","vars":{},"problem":"Officials and stations organise revenue collection and authority. Which concept applies?","steps":["Identify the features of the case.","Institutions enforcing the imperial governing framework.","Imperial authority did not rest on universal loca emoves imperial hierarchy.","truth":"false","explain":"Using local arrangements does not abolish colonial subordination."}]},"pick":{"right":3,"wrong":1}}]},"19":{"subject":"history","class":"Form 3","lesson_no":19,"language":"en","prerequisites":[],"skills":[{"id":"y3-19","name":"British indirect rule in Northern Nigeria"}],"note":{"status":"draft","text":"Indirect rule used selected local rulers and institutions as part of colonial administration under British supervision. Lugard is closely associated with its Northern Nigerian model. Existing emirate structures, limited European personnel, cost concerns and a wish to govern through established authority contributed to its adoption. Rulers did not remain fully sovereign: colonial officials could direct policy and alter or remove office holders. The policy changed local institutions as well as using them, and outcomes varied when applied elsewhere.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Understand the ideas","text":"Indirect rule used selected local rulers and institutions as part of colonial administration under British supervision. Lugard is closely associated with its Northern Nigerian model. Existing emirate structures, limited European personnel, cost concerns and a wish to govern through established authority contributed to its adoption. Rulers did not remain fully sovereign: colonial officials could direct policy and alter or remove office holders. The policy changed local institutions as well as using them, and outcomes varied when applied elsewhere."},{"heading":"Apply the ideas locally","text":"A resident could supervise an emir whose courts, officials and revenue institutions became part of the colonial framework. The appearance of local continuity did not make the arrangement independent of Britain. A later attempt to use the model in a different society might produce different difficulties; Northern Nigeria should not be assumed identical to every African region."},{"heading":"Reason and check","text":"Explain both the local machinery and the superior colonial authority. Distinguish an official justification from evidence of how the system worked. Assess cost and administrative convenience alongside coercion and changes to local power. Indirect is a method of colonial rule, not the absence of colonial rule."}],"key_words":[{"word":"local intermediary authority","meaning":"rulers and institutions used to implement colonial administration"},{"word":"colonial supervision","meaning":"imperial authority over the local administrative machinery"},{"word":"administrative economy","meaning":"reliance on existing machinery to limit staffing and costs"},{"word":"institutional change","meaning":"alteration of local authority within the colonial system"}],"examples":["A recognised emir and officials carry out administrative functions.","A resident directs policy and can challenge a ruler's conduct.","A government with few European officials works through established offices."],"mistake":{"wrong":"Using an emir means Britain surrendered all policy control.","right":"local intermediary authority: rulers and institutions used to implement colonial administration.","why":"The local authority operated within a colonial supervisory framework."}},"worked_example":{"status":"draft","vars":{},"problem":"A recognised emir and officials carry out administrative functions. Which concept applies?","steps":["Identify the features of the case.","Rulers and institutions used to implement colonial administration.","The local authority operated within a colonial supervisory framework."],"answer":"local intermediary authority","checks":[]},"teach":{"cards":[{"id":"cy3-19-terms","status":"draft","idea":"Distinguish the lesson's concepts before applying them.","vars":{},"example":["local intermediary authority: rulers and institutions used to implement colonial administration.","colonial supervision: imperial authority over the local administrative machinery.","  faces choices about time, land, labour and materials.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Understand the ideas","text":"Economics examines choices about scarce resources and the production, distribution and use of goods and services. A want is a desire for something; resources are means used to satisfy wants. Scarcity means resources are limited relative to the wants they could satisfy. It affects rich as well as poor people. Because not every want can be met at once, people rank alternatives and choose. A school, household or government also faces choices about time, land, labour and materials."},{"heading":"Apply the ideas locally","text":"Bih has one free afternoon. She wants to revise, help at a stall and visit a friend. Even if no money changes hands, time is scarce. A school in Buea may have enough land for a garden or an extra play area but not both on the same plot. Economics asks how such choices are made and what must be given up."},{"heading":"Reason and check","text":"Identify the decision maker, the resource constraint and the alternatives. Do not define scarcity simply as having no money: a well-funded club may still lack time or space. Explain the connection: limited resources in relation to wants make choice necessary."}],"key_words":[{"word":"want","meaning":"a desire for a good, service or activity"},{"word":"resource","meaning":"a means that can help satisfy wants"},{"word":"scarcity","meaning":"limited resources relative to competing wants"},{"word":"choice","meaning":"selection between alternatives"}],"examples":["Ayuk would like a bicycle for travel.","A school uses land, teachers' time and books.","A club has time for either a debate or a match this afternoon."],"mistake":{"wrong":"Every want is automatically satisfied.","right":"want: a desire for a good, service or activity.","why":"A desire is a want; satisfying it depends on available resources."}},"worked_example":{"status":"draft","vars":{},"problem ll rejected alternatives added together. It can involve time or an activity rather than money. A monetary cost is an amount paid; it need not measure the full opportunity cost. State what was actually given up and what the decision maker would otherwise have chosen.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Understand the ideas","text":"A scale of preference ranks wants in order of importance to a decision maker. Choice depends on this ranking and on available resources. Opportunity cost is the value of the next-best alternative forgone, not all rejected alternatives added together. It can involve time or an activity rather than money. A monetary cost is an amount paid; it need not measure the full opportunity cost. State what was actually given up and what the decision maker would otherwise have chosen."},{"heading":"Apply the ideas locally","text":"Ngozi ranks repairing her school bag above buying a novel, and the novel above buying a bracelet. If she can afford only one, choosing the repair gives up the novel as the next-best alternative. The bracelet is also not bought, but it is not added to the opportunity cost. If she later receives more resources, the feasible set can change without changing the meaning of opportunity cost."},{"heading":"Reason and check","text":"List feasible alternatives, rank them and identify the best rejected option. Do not confuse the chosen benefit with what is forgone. If an exercise asks for a remaining balance, subtract spending from the available budget and keep CFA francs in the answer."}],"key_words":[{"word":"scale of preference","meaning":"a ranking of wants in order of importance"},{"word":"opportunity cost","meaning":"the next-best alternative forgone by a choice"},{"word":"monetary cost","meaning":"the amount paid for a purchase"},{"word":"budget constraint","meaning":"the resource limit on affordable choices"}],"examples":["Bih places school-bag repair above a novel and a bracelet.","Bih cho  and effects.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Understand the ideas","text":"A mixed economy combines market exchange with public action and different ownership arrangements. Private firms and households make many decisions, while public bodies may provide services, regulate activities or pursue distributional aims. The balance varies across countries and sectors. Mixed does not mean an exact equal split. Regulation is not the same thing as ownership: a private firm can be regulated without becoming publicly owned. Evaluate a particular policy through its purpose, mechanism, costs and effects."},{"heading":"Apply the ideas locally","text":"A family stall can trade in a market while a public body maintains a road used by buyers and sellers. Rules about weights and product information can shape private exchange. The presence of both activities illustrates a mixed arrangement; it does not supply a numerical share for the whole economy or prove that every intervention works well."},{"heading":"Reason and check","text":"For each example, ask who owns the resource, who makes decisions and what public action is involved. Do not equate mixed with random or unplanned. Compare a policy's intended effect with evidence about its actual effect, including trade-offs and unintended consequences."}],"key_words":[{"word":"mixed economy","meaning":"a combination of market coordination and public action"},{"word":"regulation","meaning":"rules shaping how an activity is carried out"},{"word":"public provision","meaning":"a public body supplying or funding a service"},{"word":"policy trade-off","meaning":"a cost or competing goal involved in a policy choice"}],"examples":["Private stalls trade alongside publicly provided infrastructure.","Rules require traders to use accurate weights.","A public body provides road maintenance."],"mistake":{"wrong":"A mixed economy must divide all activity into exactly equal halves.","right":"mixed economy: a comb OHADA, the chart of accounts, enterprises and double entry"}],"note":{"status":"draft","text":"OHADA (Organisation for the Harmonisation of Business Law in Africa) was created by a treaty signed in Port Louis in 1993; Cameroon is a member. Its accounting law, SYSCOHADA (revised in 2017), gives member states the same accounting rules.\nThe chart of accounts groups accounts in classes by their first digit:\n1 equity and long-term liabilities (101 Capital, 162 Loans) · 2 fixed assets (231 Buildings, 245 Transport equipment) · 3 stocks (311 Goods) · 4 third parties (401 Suppliers, 411 Customers, 443 VAT invoiced) · 5 treasury (521 Bank, 571 Cash) · 6 expenses (601 Purchases of goods, 661 Salaries) · 7 income (701 Sales of goods) · 8 other income and expenses.\nEnterprises: sole traders, partnerships and companies (SARL, SA) in trade, industry or services.\nDouble entry: every transaction affects at least two accounts; total debits = total credits.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"OHADA and SYSCOHADA","text":"OHADA is the Organisation for the Harmonisation of Business Law in Africa. Its treaty was signed in Port Louis in {1993}, and Cameroon is one of its member states.\nOHADA makes 'uniform acts' that apply in all member states. The accounting one is SYSCOHADA (revised in {2017}): the same accounts and rules from Douala to Dakar, so accounts can be understood across borders."},{"heading":"The chart of accounts","text":"Each account has a number; its first digit gives its class:\n• {1} equity and long-term liabilities (Capital, Loans)\n• {2} fixed assets (Buildings, Equipment, Vehicles)\n• {3} stocks (Goods, Raw materials)\n• {4} third parties (Suppliers, Customers, Staff, State/VAT)\n• {5} treasury (Bank, Cash)\n• {6} expenses (Purchases, Salaries, Electricity)\n• {7} income (Sales, Services)\n• {8} other income and expenses."},{"heading":"Enterprises and double entry","text":"Enterprises may be sole traders, partnerships or companies (SARL, SA), working in trade, industry or services.\nEvery transaction has two sides. In double entry each transaction is recorded in at least two accounts: one debited and one credited for the same amount. So total debits always equal total credits.\nA cash sale: debit Cash (money comes in), credit Sales (income earned)."}],"key_words":[{"word":"OHADA","meaning":"organisation harmonising business law in member African states"},{"word":"SYSCOHADA","meaning":"the OHADA accounting system"},{"word":"chart of accounts","meaning":"the numbered list of accounts grouped in classes"},{"word":"double entry","meaning":"recording each transaction as an equal debit and credit"}],"examples":["{'101 Capital'}: class {1}","{'601 Purchases of goods'}: class {6}","{'411 Customers'}: class {4}"],"mistake":{"wrong":"Sales ({'701'}) is an expense account","right":"Sales is an income account in class {7}","why":"Class {6} holds expenses; class {7} holds income."}},"worked_example":{"status":"draft","vars":{},"problem":"In which class are these accounts: {'571 Cash'}, {'601 Purchases of goods'}, {'101 Capital'}?","steps":["The first digit gives the class.","{'571'} → class {5} (treasury); {'601'} → class {6} (expenses); {'101'} → class {1} (equity)."],"answer":"Class {5}, class {6} and class {1}","checks":[]},"teach":{"cards":[{"id":"c3a1-1","status":"draft","idea":"OHADA gives member states one set of business and accounting rules (SYSCOHADA).","vars":{},"example":["Cameroon, Senegal, Côte d'Ivoire and others"],"checks":[],"check":{"ref":"a3-1-ohada"}},{"id":"c3a1-2","status":"draft","idea":"The first digit of an account number gives its class.","vars":{},"example":["{'521 Bank'} is in class {5}: treasury."],"checks":[],"check":{"ref":"a3-1-class"}},{"id":"c3a1-3","status":"draft","idea":"Double entry: every debit has an equal credit.","vars":{},"example":["Cash sale: debit Cash, credit Sales."],"checks":[],"check":{"id":"a3-1-double-card","type":"mcq","level":1,"review":"authored","sources":["ohada"],"vars":{"X":{"pick":[{"q":"What does double entry mean?","r":"Every transaction is recorded in at least two accounts, with equal debits and credits","w":["Every transaction is written twice in the same account","Only cash transactions are recorded","Debits are always bigger than credits"],"e":["It uses two (or more) different accounts.","All transactions are recorded.","Debits always equal credits."],"y":"Each transaction has a giving and a receiving side."},{"q":"A trader sells goods for cash. Which accounts are affected?","r":"571 Cash (debit) and 701 Sales (credit)","w":["571 Cash only","601 Purchases and 401 Suppliers","101 Capital and 162 Loans"],"e":["Double entry needs two accounts.","Those are for buying on credit.","Those are financing accounts."],"y":"Cash comes in; sales income is earned."},{"q":"Which type of enterprise is owned by one person?","r":"a sole trader","w":["a public limited company (SA)","a partnership","a cooperative"],"e":["An SA has many shareholders.","A partnership has two or more partners.","A cooperative has many members."],"y":"Many small shops are sole traders."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is {answer}."]}}]},"questions":[{"id":"a3-1-ohada","type":"mcq","level":1,"review":"authored","sources":["ohada"],"vars":{"X":{"pick":[{"q":"What is OHADA?","r":"An organisation that harmonises business law, including accounting, in member African states","w":["A bank in Douala","A tax paid on sales","A type of company"],"e":["It is not a bank.","That is VAT.","Companies are SARL, SA and others."],"y":"Its uniform acts apply in all member states."},{"q":"What is SYSCOHADA?","r":"The OHADA accounting system and chart of accounts","w":["A Cameroonian bank","A spreadsheet program","A customs form"],"e":["It is not a bank.","It is a set of rules, not software.","It is not a customs document."],"y":"It sets out the accounts and how to keep them."},{"q":"Where and when was the OHADA treaty signed?","r":"Port Louis, 1993","w":["Yaoundé, 1960","Paris, 2017","Douala, 2000"],"e":["1960 is Cameroon's independence.","2017 is the revision of SYSCOHADA.","Not the treaty date."],"y":"Signed in Port Louis (Mauritius) in 1993."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is {answer}."]},{"id":"a3-1-class","type":"mcq","level":1,"review":"authored","sources":["ohada"],"vars":{"X":{"pick":[{"q":"571 Cash","r":"class 5 (treasury)","w":["class 7 (income)","class 1 (equity)","class 6 (expenses)"],"e":["Income accounts start with 7.","Equity starts with 1.","Expenses start with 6."],"y":"The first digit is 5."},{"q":"701 Sales of goods","r":"class 7 (income)","w":["class 6 (expenses)","class 4 (third parties)","class 2 (fixed assets)"],"e":["Sales are income, not expenses.","Third parties start with 4.","Fixed assets start with 2."],"y":"The first digit is 7."},{"q":"245 Transport equipment","r":"class 2 (fixed assets)","w":["class 3 (stocks)","class 5 (treasury)","class 6 (expenses)"],"e":["Stocks start with 3.","Treasury starts with 5.","Expenses start with 6."],"y":"A vehicle used for years is a fixed asset."},{"q":"401 Suppliers","r":"class 4 (third parties)","w":["class 1 (equity)","class 6 (expenses)","class 5 (treasury)"],"e":["Equity starts with 1.","Expenses start with 6.","Treasury starts with 5."],"y":"Suppliers and customers are third parties."}]}},"prompt":"In which class is this account? {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is {answer}."]},{"id":"a3-1-double","type":"mcq","level":2,"review":"authored","sources":["ohada"],"vars":{"X":{"pick":[{"q":"What does double entry mean?","r":"Every transaction is recorded in at least two accounts, with equal debits and credits","w":["Every transaction is written twice in the same account","Only cash transactions are recorded","Debits are always bigger than credits"],"e":["It uses two (or more) different accounts.","All transactions are recorded.","Debits always equal credits."],"y":"Each transaction has a giving and a receiving side."},{"q":"A trader sells goods for cash. Which accounts are affected?","r":"571 Cash (debit) and 701 Sales (credit)","w":["571 Cash only","601 Purchases and 401 Suppliers","101 Capital and 162 Loans"],"e":["Double entry needs two accounts.","Those are for buying on credit.","Those are financing accounts."],"y":"Cash comes in; sales income is earned."},{"q":"Which type of enterprise is owned by one person?","r":"a sole trader","w":["a public limited company (SA)","a partnership","a cooperative"],"e":["An SA has many shareholders.","A partnership has two or more partners.","A cooperative has many members."],"y":"Many small shops are sole traders."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is {answer}."]},{"id":"a3-1-num","type":"numeric","level":3,"review":"rule","sources":["ohada"],"vars":{"d":{"int":[50000,900000],"step":5000}},"prompt":"Total debits in a journal are {d} FCFA. Every entry is balanced. What are the total credits (FCFA)?","answer":"d","misconceptions":[{"id":"half","wrong":"d / 2","explain":"Debits and credits are equal in total; nothing is halved."},{"id":"double","wrong":"2 * d","explain":"They are equal, not double."}],"solution":["In double entry, total debits always equal total credits.","Total credits = {answer} FCFA."],"unit":"FCFA"}]},"2":{"subject":"accounting","class":"Form 3","lesson_no":2,"language":"en","prerequisites":[1],"skills":[{"id":"a3-2","name":"The accounting cycle: journal, ledger and trial balance"}],"note":{"status":"draft","text":"Accounting cycle: source documents (invoices, receipts) → journal → ledger → trial balance → financial statements.\n• Journal: transactions recorded in date order, each with the accounts debited and credited, amounts and a short explanation.\n• Ledger: each account on its own page (T-account); journal amounts are posted to the debit or credit side.\n• Balance of an account = difference between its debit total and credit total (debit balance if debits are bigger).\n• Trial balance: a list of all account balances; total debit balances must equal total credit balances. If not, there is an error.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"From documents to statements","text":"Every transaction starts with a source document: an invoice, a receipt, a bank statement. The accounting cycle then follows:\nsource documents → journal → ledger → trial balance → financial statements (balance sheet and income statement)."},{"heading":"Journal and ledger","text":"The journal records transactions in date order. Each entry gives the date, the account(s) debited and credited, the amounts and a short description; the debits equal the credits.\nThe ledger has one page (a T-account) for each account. Posting means copying each journal amount to the same side of the right ledger account.\nThe balance of an account is the difference between its two sides: a debit balance if the debits are bigger, a credit balance if the credits are bigger."},{"heading":"Trial balance","text":"A trial balance lists every account with its balance, debit balances in one column and credit balances in the other. The two totals must be equal.\nIf they differ, there is an error (a one-sided posting, a wrong addition). But equal totals do not prove everything is right: an entry left out completely, or posted to the wrong account on the correct side, does not show up."}],"key_words":[{"word":"journal","meaning":"book of first entry, in date order"},{"word":"ledger","meaning":"book of accounts, one page per account"},{"word":"posting","meaning":"copying journal amounts to the ledger"},{"word":"trial balance","meaning":"list of balances to check that debits equal credits"}],"examples":["Debits {500000}, credits {120000}: debit balance {380000}","Trial balance totals {950000} = {950000}: agrees"],"mistake":{"wrong":"Balance = debits + credits","right":"Balance = the larger side − the smaller side","why":"A balance is the difference between the two sides."}},"worked_example":{"status":"draft","vars":{"a":500000,"b":120000,"c":80000},"problem":"The Bank account has debits of {a} FCFA and {b} FCFA and a credit of {c} FCFA. Find its balance.","steps":["Total debits = {a} + {b} = {a + b} FCFA.","Total credits = {c} FCFA.","Balance = {a + b} − {c} = {a + b - c} FCFA (a debit balance)."],"answer":"{a + b - c} FCFA debit balance","checks":["a + b - c == 540000"]},"teach":{"cards":[{"id":"c3a2-1","status":"draft","idea":"Journal → ledger → trial balance.","vars":{},"example":["Record, post, check."],"checks":[],"check":{"ref":"a3-2-order"}},{"id":"c3a2-2","status":"draft","idea":"The balance is the difference between the two sides of an account.","vars":{},"example":["Debits {300000}, credits {100000}: debit balance {200000}"],"checks":[],"check":{"ref":"a3-2-bal"}},{"id":"c3a2-3","status":"draft","idea":"In a trial balance, debit and credit totals must agree.","vars":{},"example":["If they differ, look for an error."],"checks":[],"check":{"id":"a3-2-tb-card","type":"numeric","level":1,"review":"rule","sources":["ohada"],"vars":{"x":{"int":[100000,500000],"step":10000},"y":{"int":[50000,300000],"step":10000},"z":{"int":[20000,200000],"step":10000},"u":{"int":[100000,600000],"step":10000},"e":{"pick":[0,0,10000,20000,50000]},"v":{"expr":"x + y + z - u + e"}},"prompt":"A trial balance shows debit balances of {x}, {y} and {z} FCFA and credit balances of {u} and {v} FCFA. By how much do the totals differ (FCFA)? (0 if they agree)","answer":"abs(x + y + z - u - v)","misconceptions":[{"id":"total","wrong":"x + y + z","explain":"That is the debit total. Compare it with the credit total."}],"solution":["Debit total = {x} + {y} + {z} = {x + y + z}.","Credit total = {u} + {v} = {u + v}.","Difference = {answer} FCFA."],"unit":"FCFA","where":["v > 0"]}}]},"questions":[{"id":"a3-2-order","type":"ordering","level":1,"review":"authored","sources":["ohada"],"prompt":"Put the stages of the accounting cycle in order.","items":[{"text":"Source documents"},{"text":"Journal"},{"text":"Ledger"},{"text":"Trial balance"},{"text":"Financial statements"}],"order":"as_written","hint":"Documents first, statements last."},{"id":"a3-2-bal","type":"numeric","level":1,"review":"rule","sources":["ohada"],"vars":{"d":{"int":[100000,900000],"step":10000},"c":{"int":[50000,800000],"step":10000}},"prompt":"An account has debits totalling {d} FCFA and credits totalling {c} FCFA. What is the size of its balance (FCFA)?","answer":"abs(d - c)","misconceptions":[{"id":"sum","wrong":"d + c","explain":"The balance is the difference between the sides, not their sum."}],"solution":["Balance = larger side − smaller side.","|{d} − {c}| = {answer} FCFA ({d > c ? 'debit' : 'credit'} balance)."],"unit":"FCFA","where":["d != c"]},{"id":"a3-2-tb","type":"numeric","level":2,"review":"rule","sources":["ohada"],"vars":{"x":{"int":[100000,500000],"step":10000},"y":{"int":[50000,300000],"step":10000},"z":{"int":[20000,200000],"step":10000},"u":{"int":[100000,600000],"step":10000},"e":{"pick":[0,0,10000,20000,50000]},"v":{"expr":"x + y + z - u + e"}},"prompt":"A trial balance shows debit balances of {x}, {y} and {z} FCFA and credit balances of {u} and {v} FCFA. By how much do the totals differ (FCFA)? (0 if they agree)","answer":"abs(x + y + z - u - v)","misconceptions":[{"id":"total","wrong":"x + y + z","explain":"That is the debit total. Compare it with the credit total."}],"solution":["Debit total = {x} + {y} + {z} = {x + y + z}.","Credit total = {u} + {v} = {u + v}.","Difference = {answer} FCFA."],"unit":"FCFA","where":["v > 0"]},{"id":"a3-2-post","type":"mcq","level":2,"review":"authored","sources":["ohada"],"vars":{"X":{"pick":[{"q":"What is posting?","r":"Transferring journal amounts to the ledger accounts","w":["Sending letters to customers","Adding up the trial balance","Paying suppliers"],"e":["That is correspondence.","That comes after posting.","That is a transaction, not posting."],"y":"Each journal line goes to its ledger account."},{"q":"A journal entry debits 571 Cash and credits 701 Sales with 25 000 FCFA. How is it posted?","r":"25 000 on the debit side of Cash and on the credit side of Sales","w":["25 000 on the credit side of Cash","50 000 in Cash only","25 000 on the debit side of Sales"],"e":["Cash is debited.","Each account gets the amount once, on its own side.","Sales is credited."],"y":"Post each amount to the same side as in the journal."},{"q":"Which document is the starting point of the accounting cycle?","r":"source documents such as invoices and receipts","w":["the trial balance","the balance sheet","the ledger"],"e":["That comes later.","That comes at the end.","The ledger comes after the journal."],"y":"Every entry must be supported by a document."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is {answer}."]},{"id":"a3-2-err","type":"mcq","level":3,"review":"authored","sources":["ohada"],"vars":{"X":{"pick":[{"q":"A trial balance agrees. Does that prove there are no errors?","r":"No: some errors (such as a wrong account or a missing entry) do not affect the totals","w":["Yes, always","Yes, if it is typed","No, a trial balance never agrees"],"e":["Some errors are hidden.","Typing does not matter.","A correct trial balance agrees."],"y":"Errors of omission or of principle leave the totals equal."},{"q":"Rent of 50 000 FCFA was paid in cash but posted only to the Rent account. What happens to the trial balance?","r":"It does not agree: debits exceed credits by 50 000","w":["It agrees","Credits exceed debits by 50 000","It doubles"],"e":["One side is missing.","The debit was posted, the credit was not.","Nothing doubles."],"y":"Only one side was posted."},{"q":"Why do debit and credit totals agree in a correct trial balance?","r":"Every transaction was recorded with equal debits and credits","w":["The accountant chooses the totals","Because Cash is always the largest account","Because there are always ten accounts"],"e":["Totals come from the entries.","Not related.","Any number of accounts."],"y":"Double entry keeps the books in balance."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is {answer}."]}]},"3":{"subject":"accounting","class":"Form 3","lesson_no":3,"language":"en","prerequisites":[2],"skills":[{"id":"a3-3","name":"Value added tax (VAT): calculation and accounting entries"}],"note":{"status":"draft","text":"VAT in Cameroon is 19.25% of the price excluding tax (HT): 17.5% VAT plus 10% of that as council tax (17.5% × 1.1 = 19.25%).\n• Amount including tax (TTC) = HT + VAT = HT × 1.1925.\n• On sales, the enterprise charges VAT: credit 443 VAT invoiced (collected).\n• On purchases, it pays VAT it can recover: debit 445 VAT recoverable.\n• VAT payable to the State = VAT invoiced − VAT recoverable (account 4441). If recoverable is bigger, the difference is a VAT credit (4449), carried forward.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"A tax on added value","text":"Value added tax (VAT) is a tax on consumption. Each enterprise charges VAT on its sales and deducts the VAT it paid on its purchases, so in the end the final consumer bears the tax.\nIn Cameroon the rate is {19.25}%: {17.5}% VAT plus council tax of {10}% of it ({17.5}% × {1.1} = {19.25}%)."},{"heading":"Calculating","text":"• HT (hors taxes): price excluding tax.\n• VAT = {19.25}% × HT.\n• TTC (toutes taxes comprises): HT + VAT = HT × {1.1925}.\nFor {200000} FCFA HT: VAT = {38500} FCFA and TTC = {238500} FCFA.\nTo go back from TTC to HT, divide by {1.1925}."},{"heading":"Recording and paying","text":"• Sales: debit {'411'} Customers with TTC; credit {'701'} Sales with HT and {'443'} VAT invoiced with the VAT.\n• Purchases: debit {'601'} Purchases with HT and {'445'} VAT recoverable with the VAT; credit {'401'} Suppliers with TTC.\n• At the end of the month, VAT payable ({'4441'}) = VAT invoiced − VAT recoverable, paid to the State. If recoverable is bigger, the difference is a VAT credit ({'4449'}) carried to the next month."}],"key_words":[{"word":"VAT","meaning":"value added tax, {19.25}% in Cameroon"},{"word":"HT","meaning":"amount excluding tax"},{"word":"TTC","meaning":"amount including all taxes"},{"word":"VAT credit","meaning":"recoverable VAT larger than invoiced VAT, carried forward"}],"examples":["HT {80000}: VAT {15400}, TTC {95400}","Invoiced {50000} − recoverable {30000} = {20000} to pay"],"mistake":{"wrong":"VAT = {19.25}% of the TTC amount","right":"VAT = {19.25}% of the HT amount","why":"VAT is calculated on the price before tax."}},"worked_example":{"status":"draft","vars":{"ht":200000},"problem":"Goods are sold for {ht} FCFA HT. Find the VAT and the amount including tax.","steps":["VAT = {19.25}% × {ht} = {ht * 0.1925} FCFA.","TTC = {ht} + {ht * 0.1925} = {ht * 1.1925} FCFA."],"answer":"VAT {ht * 0.1925} FCFA; TTC {ht * 1.1925} FCFA","checks":["ht * 0.1925 == 38500"]},"teach":{"cards":[{"id":"c3a3-1","status":"draft","idea":"VAT = {19.25}% of the price excluding tax.","vars":{},"example":["{100000} HT: VAT {19250}"],"checks":[],"check":{"ref":"a3-3-vat"}},{"id":"c3a3-2","status":"draft","idea":"TTC = HT + VAT.","vars":{},"example":["{100000} + {19250} = {119250}"],"checks":[],"check":{"ref":"a3-3-ttc"}},{"id":"c3a3-3","status":"draft","idea":"VAT payable = VAT invoiced − VAT recoverable.","vars":{},"example":["{60000} − {45000} = {15000} to pay"],"checks":[],"check":{"id":"a3-3-pay-card","type":"numeric","level":1,"review":"rule","sources":["vat"],"vars":{"a":{"int":[10,80]},"b":{"int":[5,70]},"inv":{"expr":"a * 770"},"rec":{"expr":"b * 770"}},"prompt":"In a month, VAT invoiced on sales is {inv} FCFA and VAT recoverable on purchases is {rec} FCFA. What VAT must be paid to the State (FCFA)? (0 if there is a credit)","answer":"max(inv - rec, 0)","misconceptions":[{"id":"add","wrong":"inv + rec","explain":"Subtract the recoverable VAT from the invoiced VAT."}],"solution":["VAT payable = invoiced − recoverable = {inv} − {rec}.","{inv > rec ? 'Payable: ' + fmt(inv - rec) + ' FCFA.' : 'Recoverable is bigger: no VAT to pay; credit of ' + fmt(rec - inv) + ' FCFA.'}"],"unit":"FCFA","where":["a != b","inv + rec != max(inv - rec, 0)"]}}]},"questions":[{"id":"a3-3-vat","type":"numeric","level":1,"review":"rule","sources":["vat"],"vars":{"k":{"int":[2,50]},"ht":{"expr":"k * 4000"},"vat":{"expr":"k * 770"}},"prompt":"Goods worth {ht} FCFA HT are sold. Find the VAT at {19.25}% (FCFA).","answer":"vat","misconceptions":[{"id":"ttc","wrong":"ht + vat","explain":"That is the amount including tax. VAT is only the tax part."},{"id":"rate","wrong":"ht * 0.175","explain":"The rate in Cameroon is {19.25}% ({17.5}% plus council tax)."}],"solution":["VAT = {19.25} ÷ {100} × {ht}.","= {answer} FCFA."],"unit":"FCFA"},{"id":"a3-3-ttc","type":"numeric","level":1,"review":"rule","sources":["vat"],"vars":{"k":{"int":[2,50]},"ht":{"expr":"k * 4000"},"vat":{"expr":"k * 770"}},"prompt":"Find the amount including tax (TTC) for a sale of {ht} FCFA HT (VAT {19.25}%).","answer":"ht + vat","misconceptions":[{"id":"vat","wrong":"vat","explain":"That is the VAT only; add it to the HT amount."}],"solution":["VAT = {vat} FCFA.","TTC = {ht} + {vat} = {answer} FCFA."],"unit":"FCFA"},{"id":"a3-3-pay","type":"numeric","level":2,"review":"rule","sources":["vat"],"vars":{"a":{"int":[10,80]},"b":{"int":[5,70]},"inv":{"expr":"a * 770"},"rec":{"expr":"b * 770"}},"prompt":"In a month, VAT invoiced on sales is {inv} FCFA and VAT recoverable on purchases is {rec} FCFA. What VAT must be paid to the State (FCFA)? (0 if there is a credit)","answer":"max(inv - rec, 0)","misconceptions":[{"id":"add","wrong":"inv + rec","explain":"Subtract the recoverable VAT from the invoiced VAT."}],"solution":["VAT payable = invoiced − recoverable = {inv} − {rec}.","{inv > rec ? 'Payable: ' + fmt(inv - rec) + ' FCFA.' : 'Recoverable is bigger: no VAT to pay; credit of ' + fmt(rec - inv) + ' FCFA.'}"],"unit":"FCFA","where":["a != b","inv + rec != max(inv - rec, 0)"]},{"id":"a3-3-entry","type":"mcq","level":2,"review":"authored","sources":["vat"],"vars":{"X":{"pick":[{"q":"In a credit sale, which account records the VAT charged to the customer?","r":"443 VAT invoiced (credit)","w":["445 VAT recoverable (debit)","601 Purchases (debit)","571 Cash (credit)"],"e":["That is VAT on purchases.","Not a sale.","Cash is not involved in a credit sale."],"y":"VAT charged on sales is owed to the State."},{"q":"In a credit purchase of goods, which account records the VAT paid to the supplier?","r":"445 VAT recoverable (debit)","w":["443 VAT invoiced (credit)","701 Sales (credit)","101 Capital (credit)"],"e":["That is VAT on sales.","Not a sale.","Not a financing transaction."],"y":"The enterprise can deduct this VAT."},{"q":"Which account is debited when goods are sold on credit for an amount including tax?","r":"411 Customers (with the TTC amount)","w":["701 Sales","443 VAT invoiced","401 Suppliers"],"e":["Sales is credited with the HT amount.","VAT invoiced is credited.","Suppliers are for purchases."],"y":"The customer owes the full TTC amount."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is {answer}."]},{"id":"a3-3-ht","type":"numeric","level":3,"review":"rule","sources":["vat"],"vars":{"k":{"int":[2,50]},"ht":{"expr":"k * 4000"},"vat":{"expr":"k * 770"},"ttc":{"expr":"ht + vat"}},"prompt":"An invoice shows a total including tax of {ttc} FCFA (VAT {19.25}%). Find the amount excluding tax (FCFA).","answer":"ht","misconceptions":[{"id":"sub","wrong":"ttc - roundTo(ttc * 0.1925, 1)","explain":"Taking {19.25}% of the TTC is wrong: VAT is {19.25}% of the HT. Divide by {1.1925}."}],"solution":["TTC = HT × {1.1925}.","HT = {ttc} ÷ {1.1925} = {answer} FCFA."],"unit":"FCFA"}]},"4":{"subject":"accounting","class":"Form 3","lesson_no":4,"language":"en","prerequisites":[1,2],"skills":[{"id":"a3-4","name":"Accounting for financing transactions: capital and loans"}],"note":{"status":"draft","text":"Financing transactions bring long-term money into the enterprise.\n• Capital contributed by the owner: debit 521 Bank (or 571 Cash, or the asset given), credit 101 Capital.\n• Loan received from a bank: debit 521 Bank, credit 162 Loans from credit institutions.\n• Repayment of the loan: debit 162 Loans, credit 521 Bank. Interest paid is an expense: debit 671 Interest, credit 521 Bank.\nCapital and loans are resources (class 1); the money received is in treasury (class 5).","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Where the money comes from","text":"A new business needs money to start. The two main long-term sources are the owner's capital and loans.\nBoth are resources recorded in class {1}: {'101 Capital'} for what the owner puts in, {'162 Loans from credit institutions'} for money borrowed from a bank."},{"heading":"The entries","text":"• Capital paid into the bank: debit {'521 Bank'}, credit {'101 Capital'}. Paid in cash: debit {'571 Cash'}. If the owner brings a car, debit {'245 Transport equipment'}.\n• Loan received: debit {'521 Bank'}, credit {'162 Loans'}.\n• Loan repaid: debit {'162 Loans'}, credit {'521 Bank'}.\n• Interest paid: debit {'671 Interest'} (an expense), credit {'521 Bank'}."},{"heading":"Following the bank balance","text":"Each financing transaction changes the bank balance: capital and loans add to it; repayments and interest take from it.\nCapital {2000000} + loan {1500000} − repayment {300000} leaves {3200000} FCFA in the bank, and the loan account shows {1200000} FCFA still owed."}],"key_words":[{"word":"capital","meaning":"money or assets contributed by the owner"},{"word":"loan","meaning":"money borrowed that must be repaid"},{"word":"interest","meaning":"the cost of borrowing, an expense"},{"word":"financing transaction","meaning":"a transaction that brings long-term funds"}],"examples":["{'Dr 521 Bank / Cr 101 Capital'}","{'Dr 521 Bank / Cr 162 Loans'}","{'Dr 671 Interest / Cr 521 Bank'}"],"mistake":{"wrong":"A loan is credited to Capital","right":"A loan is credited to {'162'} Loans","why":"The loan belongs to the bank and must be repaid; capital belongs to the owner."}},"worked_example":{"status":"draft","vars":{"c":2000000,"l":1500000},"problem":"Ms Ngozi starts a business: she pays {c} FCFA into the business bank account and the bank lends the business {l} FCFA. Give the entries and the bank balance.","steps":["Capital: debit {'521 Bank'} {c}; credit {'101 Capital'} {c}.","Loan: debit {'521 Bank'} {l}; credit {'162 Loans'} {l}.","Bank balance = {c} + {l} = {c + l} FCFA."],"answer":"Bank {c + l} FCFA","checks":["c + l == 3500000"]},"teach":{"cards":[{"id":"c3a4-1","status":"draft","idea":"The owner's contribution is credited to Capital.","vars":{},"example":["{'Dr 521 Bank / Cr 101 Capital'}"],"checks":[],"check":{"ref":"a3-4-cap"}},{"id":"c3a4-2","status":"draft","idea":"A bank loan is credited to Loans.","vars":{},"example":["{'Dr 521 Bank / Cr 162 Loans'}"],"checks":[],"check":{"ref":"a3-4-loan"}},{"id":"c3a4-3","status":"draft","idea":"Repaying the loan reduces both Loans and Bank.","vars":{},"example":["{'Dr 162 Loans / Cr 521 Bank'}"],"checks":[],"check":{"id":"a3-4-bank-card","type":"numeric","level":1,"review":"rule","sources":["ohada-transactions"],"vars":{"c":{"int":[500000,3000000],"step":100000},"l":{"int":[500000,3000000],"step":100000},"r":{"int":[100000,500000],"step":50000}},"prompt":"A business receives capital of {c} FCFA and a loan of {l} FCFA into its bank account, then repays {r} FCFA of the loan. What is the bank balance (FCFA)?","answer":"c + l - r","misconceptions":[{"id":"norepay","wrong":"c + l","explain":"The repayment reduces the bank balance."},{"id":"noloan","wrong":"c - r","explain":"The loan received also adds to the bank."}],"solution":["Bank: + {c} (capital) + {l} (loan) − {r} (repayment).","= {answer} FCFA."],"unit":"FCFA"}}]},"questions":[{"id":"a3-4-cap","type":"mcq","level":1,"review":"authored","sources":["ohada-transactions"],"vars":{"X":{"pick":[{"q":"The owner pays 1 000 000 FCFA into the business bank account.","r":"Dr 521 Bank / Cr 101 Capital","w":["Dr 101 Ca remise): a reduction on the invoice; VAT is calculated on the net amount after discount.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Buying goods","text":"Goods bought for resale go to {'601 Purchases of goods'} (amount excluding tax). The VAT paid goes to {'445 VAT recoverable'}.\nIf bought on credit, the supplier is owed the total: credit {'401 Suppliers'} with the amount including tax. If paid at once, credit {'571 Cash'} or {'521 Bank'}."},{"heading":"Selling goods","text":"Sales of goods are income: credit {'701 Sales of goods'} with the amount excluding tax and {'443 VAT invoiced'} with the VAT.\nOn credit, debit {'411 Customers'} with the total including tax; for cash, debit {'571 Cash'}.\nA sale of {200000} FCFA HT: {'Dr 411'} {238500}, {'Cr 701'} {200000}, {'Cr 443'} {38500}."},{"heading":"Trade discounts","text":"A trade discount (rabais, remise) reduces the price on the invoice, for example for a regular customer or a large order.\nWork out the net amount first: list price − discount. Then calculate VAT on the net amount.\n{200000} FCFA less {10}%: net {180000}, VAT {34650}, total {214650} FCFA."}],"key_words":[{"word":"purchases of goods","meaning":"account {'601'}: goods bought to resell"},{"word":"sales of goods","meaning":"account {'701'}: income from selling goods"},{"word":"trade discount","meaning":"a price reduction shown on the invoice"},{"word":"credit transaction","meaning":"paid later, not at once"}],"examples":["{'Dr 601 / Cr 401'} (credit purchase)","{'Dr 411 / Cr 701, 443'} (credit sale)","{'Dr 571 / Cr 701, 443'} (cash sale)"],"mistake":{"wrong":"VAT is calculated on the list price before the discount","right":"VAT is calculated on the net price after the discount","why":"Tax is charged only on what the customer actually pays for the goods."}},"worked_example":{"status":"draft","vars":{"g":200000,"d":10},"problem":"Goods listed at {g} FCFA are sold on credit with a {d}% trade discount (VAT {19.25}%). Find the Dr 411 Customers 119 250 / Cr 701 Sales 119 250"],"e":["Reversed.","It is on credit, and the VAT is recorded separately.","That is a sale."],"y":"Purchases and recoverable VAT debited; the supplier credited TTC."},{"q":"Goods are sold on credit for 200 000 FCFA HT (VAT 38 500).","r":"Dr 411 Customers 238 500 / Cr 701 Sales 200 000; Cr 443 VAT invoiced 38 500","w":["Dr 701 Sales 238 500 / Cr 411 Customers 238 500","Dr 571 Cash 238 500 / Cr 701 Sales 238 500","Dr 411 Customers 200 000 / Cr 701 Sales 200 000"],"e":["Reversed.","It is a credit sale, and VAT must be shown separately.","The VAT is missing."],"y":"The customer owes the TTC amount."},{"q":"Goods are sold for cash: 50 000 FCFA HT (VAT 9 625).","r":"Dr 571 Cash 59 625 / Cr 701 Sales 50 000; Cr 443 VAT invoiced 9 625","w":["Dr 411 Customers 59 625 / Cr 701 Sales 59 625","Dr 601 Purchases 59 625 / Cr 571 Cash 59 625","Dr 571 Cash 50 000 / Cr 701 Sales 50 000"],"e":["It is a cash sale, not on credit.","That is a purchase.","The VAT collected must be recorded."],"y":"Cash comes in for the full TTC."}]}},"prompt":"Which entry records this? {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is {answer}."]},{"id":"a3-6-ttc","type":"numeric","level":1,"review":"rule","sources":["ohada-transactions"],"vars":{"k":{"int":[2,50]},"ht":{"expr":"k * 4000"},"vat":{"expr":"k * 770"}},"prompt":"Goods are bought on credit for {ht} FCFA HT (VAT {19.25}%). What amount is credited to {'401'} Suppliers (FCFA)?","answer":"ht + vat","misconceptions":[{"id":"ht","wrong":"ht","explain":"The supplier is owed the amount including VAT."}],"solution":["VAT = {vat} FCFA.","TTC = {ht} + {vat} = {answer} FCFA."],"unit":"FCFA"},{"id":"a3-6-disc","type":"numeric","level":2,"review":"rule","sources":["ohada-transactions"],"vars":{"g":{"int":[20000,500000],"step":20000},"d":{"pick":[5,10,15,20]}},"prompt":"Goods listed at {g} FCFA are sold with a {d}% trade discount. What is the net amount excluding tax (FCFA)?","answer":"g * (100 - d) / 100","misconceptions":[{"id":"disc","wrong":"g * d / 100","explain":"That is the discount; subtract it from the list price."}],"solution":["Discount = {d}% × {g} = {g * d / 100} FCFA.","Net = {g} − {g * d / 100} = {answer} FCFA."],"unit":"FCFA"},{"id":"a3-6-total","type":"numeric","level":3,"review":"rule","sources":["ohada-transactions"],"vars":{"q":{"int":[1,25]},"d":{"pick":[10,20]},"g":{"expr":"q * 40000"}},"prompt":"Goods listed at {g} FCFA are sold on credit with a {d}% trade discount (VAT {19.25}%). What amount is debited to {'411'} Customers (FCFA)?","answer":"g * (100 - d) / 100 * 1.1925","misconceptions":[{"id":"vatfirst","wrong":"g * 1.1925","explain":"Apply the discount first, then add VAT on the net amount."},{"id":"novat","wrong":"g * (100 - d) / 100","explain":"Add the VAT: the customer pays TTC."}],"solution":["Net HT = {g} × {(100 - d) / 100} = {g * (100 - d) / 100} FCFA.","VAT = {g * (100 - d) / 100 * 0.1925}; TTC = {answer} FCFA."],"unit":"FCFA","where":["(g * (100 - d) / 100 * 0.1925) % 1 == 0"]}]},"7":{"subject":"accounting","class":"Form 3","lesson_no":7,"language":"en","prerequisites":[6],"skills":[{"id":"a3-7","name":"Accounting for transactions with commercial containers"}],"note":{"status":"draft","text":"Commercial containers (emballages) such as crates, bottles and gas cylinders may be returnable. The customer pays a deposit (consignation) when goods are delivered in them and gets it back when they are returned.\nSeller:\n• Goods delivered with consigned containers: debit 411 Customers (goods TTC + deposit), credit 701 Sales and 443 VAT, and credit 4194 Customers, consigned containers (deposit). No VAT is charged on the deposit.\n• Containers returned: debit 4194, credit 411 (or 571 if refunded in cash) with the deposit refunded.\nBuyer: debit 4094 Suppliers, containers to be returned with the deposit paid; on return, credit 4094.\nContainers not returned are treated as sold (or bought).","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Returnable containers","text":"Many goods come in returnable containers: crates of soft drinks and beer, gas cylinders, drums. The seller charges a deposit (consignation) to make sure the containers come back. When they are returned, the deposit is refunded.\nThe deposit is not income and no VAT is charged on it: it is money the seller must give back."},{"heading":"The seller's entries","text":"• Containers delivered: debit {'411 Customers'}, credit {'4194 Customers, consigned containers'} with the deposits.\n• Containers returned: debit {'4194'}, credit {'411 Customers'} (or {'571 Cash'} if refunded in cash).\nExample: {20} crates at {500} FCFA = {10000} FCFA in deposits; {15} returned → refund {7500} FCFA."},{"heading":"The buyer's entries and unreturned containers","text":"The buyer records deposits paid in {'4094 Suppliers, containers to be returned'}: debit when paid, credit when the containers go back.\nContainers that are not returned are treated as sold by the seller and bought by the buyer.\nKeeping track of deposits avoids losing money on missing crates."}],"key_words":[{"word":"commercial containers","meaning":"packaging such as crates, bottles and cylinders"},{"word":"deposit (consignation)","meaning":"money paid for returnable containers, refunded on return"},{"word":"{'4194'}","meaning":"seller's account for deposits on consigned containers"},{"word":"{'4094'}","meaning":"buyer's account for deposits paid on containers"}],"examples":["{30} crates × {500} = {15000} FCFA deposit","Return of {10} crates: refund {5000} FCFA"],"mistake":{"wrong":"Container deposits are credited to {'701'} Sales","right":"They are credited to {'4194'} Customers, consigned containers","why":"A deposit is refundable, so it is a debt, not income."}},"worked_example":{"status":"draft","vars":{"n":20,"dep":500},"problem":"A drinks depot delivers drinks with {n} crates; the deposit is {dep} FCFA per crate. Find the deposit and the entry for it.","steps":["Deposit = {n} × {dep} = {n * dep} FCFA (no VAT on the deposit).","Debit {'411 Customers'} {n * dep}; credit {'4194 Customers, consigned containers'} {n * dep}."],"answer":"Deposit {n * dep} FCFA: Dr {'411'} / Cr {'4194'}","checks":["n * dep == 10000"]},"teach":{"cards":[{"id":"c3a7-1","status":"draft","idea":"Deposit = number of containers × deposit per container.","vars":{},"example":["{12} crates × {500} = {6000} FCFA"],"checks":[],"check":{"ref":"a3-7-dep"}},{"id":"c3a7-2","status":"draft","idea":"The seller credits {'4194'} with deposits received; no VAT on deposits.","vars":{},"example":["{'Cr 4194 Customers, consigned containers'}"],"checks":[],"check":{"ref":"a3-7-entry"}},{"id":"c3a7-3","status":"draft","idea":"Returned containers are refunded; unreturned ones are treated as sold.","vars":{},"example":["{15} of {20} crates returned: refund {15} deposits."],"checks":[],"check":{"id":"a3-7-ret-card","type":"numeric","level":1,"review":"rule","sources":["ohada-transactions"],"vars":{"n":{"int":[10,50]},"d":{"pick":[500,1000]},"r":{"int":[3,40]}},"prompt":"A customer received {n} crates (deposit {d} FCFA each) and returns {r} of them. How much deposit is refunded (FCFA)?","answer":"r * d","misconceptions":[{"id":"all","wrong":"n * d","explain":"Only the {r} returned crates are refunded."},{"id":"kept","wrong":"(n - r) * d","explain":"That is the value of the crates not returned."}],"solution":["Refund = returned crates × deposit = {r} × {d}.","= {answer} FCFA."],"unit":"FCFA","where":["r \u003c n"]}}]},"questions":[{"id":"a3-7-dep","type":"numeric","level":1,"review":"rule","sources":["ohada-transactions"],"vars":{"n":{"int":[5,60]},"d":{"pick":[300,500,1000,1500]}},"prompt":"A brewery depot delivers {n} crates with a deposit of {d} FCFA each. What is the total deposit (FCFA)?","answer":"n * d","misconceptions":[{"id":"vat","wrong":"n * d * 1.1925","explain":"No VAT is charged on container deposits."}],"solution":["Deposit = {n} × {d}.","= {answer} FCFA."],"unit":"FCFA"},{"id":"a3-7-entry","type":"mcq","level":1,"review":"authored","sources":["ohada-transactions"],"vars":{"X":{"pick":[{"q":"Deposits of 10 000 FCFA are charged to a customer for crates delivered.","r":"Dr 411 Customers / Cr 4194 Customers, consigned containers","w":["Dr 4194 / Cr 411","Dr 411 / Cr 701 Sales","Dr 4094 / Cr 401"],"e":["Reversed: that is the refund.","Deposits are not sales income.","Those are the buyer's accounts."],"y":"The deposit is a debt to the customer until the crates come back."},{"q":"The customer returns the crates and the 10 000 FCFA deposit is credited back to his account.","r":"Dr 4194 Customers, consigned containers / Cr 411 Customers","w":["Dr 411 / Cr 4194","Dr 701 Sales / Cr 411","Dr 4194 / Cr 701 Sales"],"e":["That charges the deposit.","Sales were not involved.","The deposit is refunded, not sold."],"y":"The debt to the customer is cancelled."},{"q":"Cash is refunded to a customer who brings back crates worth 6 000 FCFA in deposits.","r":"Dr 4194 Customers, consigned containers / Cr 571 Cash","w":["Dr 571 Cash / Cr 4194","Dr 601 Purchases / Cr 571 Cash","Dr 4194 / Cr 701 Sales"],"e":["Cash goes out, so Cash is credited.","No purchase of goods.","The deposit is refunded, not sold."],"y":"Refund in cash cancels the deposit debt."}]}},"prompt":"Which entry does the SELLER make? {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is {answer}."]},{"id":"a3-7-ret","type":"numeric","level":2,"review":"rule","sources":["ohada-transactions"],"vars":{"n":{"int":[10,50]},"d":{"pick":[500,1000]},"r":{"int":[3,40]}},"prompt":"A customer received {n} crates (deposit {d} FCFA each) and returns {r} of them. How much deposit is refunded (FCFA)?","answer":"r * d","misconceptions":[{"id":"all","wrong":"n * d","explain":"Only the {r} returned crates are refunded."},{"id":"kept","wrong":"(n - r) * d","explain":"That is the value of the crates not returned."}],"solution":["Refund = returned crates × deposit = {r} × {d}.","= {answer} FCFA."],"unit":"FCFA","where":["r \u003c n"]},{"id":"a3-7-buyer","type":"mcq","level":3,"review":"authored","sources":["ohada-transactions"],"vars":{"X":{"pick":[{"q":"Which account does the BUYER debit when paying a deposit on containers to be returned?","r":"4094 Suppliers, containers to be returned","w":["4194 Customers, consigned containers","601 Purchases of goods","701 Sales"],"e":["That is the seller's account.","The deposit is not a purchase of goods.","The buyer is not selling."],"y":"The supplier owes the buyer the deposit back."},{"q":"Why is no VAT charged on the deposit for returnable crates?","r":"The deposit is refundable, not a sale of the crates","w":["Crates are always free","VAT is only on services","Deposits are illegal"],"e":["The customer pays a deposit.","VAT applies to goods too.","Deposits are normal."],"y":"Only if the crates are kept do they become a sale."},{"q":"A customer keeps 5 crates instead of returning them. How are they treated?","r":"As a sale of containers to the customer","w":["As a loan","As capital","They are ignored"],"e":["Not a loan.","Not capital.","They must be accounted for."],"y":"Unreturned containers are treated as sold (or bought)."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is {answer}."]}]},"8":{"subject":"accounting","class":"Form 3","lesson_no":8,"language":"en","prerequisites":[6],"skills":[{"id":"a3-8","name":"Accounting for cash settlement transactions"}],"note":{"status":"draft","text":"Settlement transactions pay or receive money owed:\n• Customer pays by cheque or transfer: debit 521 Bank, credit 411 Customers. In cash: debit 571 Cash.\n• Business pays a supplier: debit 401 Suppliers, credit 521 Bank (or 571 Cash).\n• Moving money between cash and bank: cash paid into the bank: debit 521 Bank, credit 571 Cash (often through 585 Transfers of funds).\n• Cash discount (escompte) for early payment: the seller records it as an expense (673 Discounts granted); the customer pays less.\nThe cash and bank accounts must never show impossible balances; cash in hand cannot be negative.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Settling debts","text":"After a credit sale or purchase, someone still owes money. Settlement transactions pay these debts:\n• A customer pays: debit {'521 Bank'} (cheque, transfer, mobile money to the business account) or {'571 Cash'}; credit {'411 Customers'}.\n• The business pays a supplier: debit {'401 Suppliers'}; credit {'521 Bank'} or {'571 Cash'}."},{"heading":"Moving money and keeping it safe","text":"Cash paid into the bank: debit {'521 Bank'}, credit {'571 Cash'}. Cash withdrawn from the bank: the reverse. Many businesses use a transfer account ({'585'}) between the two.\nKeep track of the cash balance: opening cash + receipts − payments. It can never be negative: a credit balance on Cash shows an error."},{"heading":"Cash discounts","text":"To be paid sooner, a seller may offer a cash discount (escompte): for example {2}% off if the customer pays within {10} days.\nThe customer pays less; the seller records the discount as an expense ({'673 Discounts granted'}), and the customer as income.\n{100000} FCFA with a {2}% discount: the customer pays {98000} FCFA."}],"key_words":[{"word":"settlement","meaning":"paying or receiving money owed"},{"word":"cash discount","meaning":"reduction for paying early"},{"word":"cash balance","meaning":"opening cash + receipts − payments"}],"examples":["{'Dr 521 / Cr 411'} (customer pays by cheque)","{'Dr 401 / Cr 571'} (supplier paid in cash)","{'Dr 521 / Cr 571'} (cash banked)"],"mistake":{"wrong":"When a customer pays, credit Sales again","right":"Credit {'411'} Customers: the sale was already recorded","why":"Payment settles the debt; it is not a new sale."}},"worked_example":{"status":"draft","vars":{"open":150000,"rec":80000,"pay":60000},"problem":"Cash in hand is {open} FCFA. A customer pays {rec} FCFA in cash and a supplier is paid {pay} FCFA in cash. Find the new cash balance.","steps":["Receipts increase cash: {open} + {rec} = {open + rec}.","Payments decrease it: {open + rec} − {pay} = {open + rec - pay} FCFA."],"answer":"{open + rec - pay} FCFA","checks":["open + rec - pay == 170000"]},"teach":{"cards":[{"id":"c3a8-1","status":"draft","idea":"Money received from a customer: debit Bank or Cash, credit Customers.","vars":{},"example":["{'Dr 521 / Cr 411'}"],"checks":[],"check":{"ref":"a3-8-entry"}},{"id":"c3a8-2","status":"draft","idea":"Paying a supplier: debit Suppliers, credit Bank or Cash.","vars":{},"example":["{'Dr 401 / Cr 521'}"],"checks":[],"check":{"id":"a3-8-bal-card","type":"numeric","level":1,"review":"rule","sources":["ohada-transactions"],"vars":{"o":{"int":[100000,300000],"step":10000},"a":{"int":[50000,200000],"step":5000},"b":{"int":[20000,100000],"step":5000},"c":{"int":[50000,150000],"step":10000}},"prompt":"Cash in hand is {o} FCFA. During the day: cash sales {a} FCFA, a supplier paid {b} FCFA, {c} FCFA paid into the bank. What is the cash balance (FCFA)?","answer":"o + a - b - c","misconceptions":[{"id":"bank","wrong":"o + a - b + c","explain":"Money paid into the bank leaves the cash box: subtract it."}],"solution":["Receipts: {o} + {a} = {o + a}.","Payments: {b} + {c} = {b + c}.","Balance = {o + a} − {b + c} = {answer} FCFA."],"unit":"FCFA","where":["o + a - b - c > 0"]}},{"id":"c3a8-3","status":"draft","idea":"A cash discount for early payment is an expense for the seller.","vars":{},"example":["{2}% off for paying within {10} days"],"checks":[],"check":{"id":"a3-8-disc-card","type":"numeric","level":1,"review":"rule","sources":["ohada-transactions"],"vars":{"t":{"int":[50000,500000],"step":50000},"d":{"pick":[1,2,3,5]}},"prompt":"A customer owes {t} FCFA and pays early with a {d}% cash discount. How much does he pay (FCFA)?","answer":"t * (100 - d) / 100","misconceptions":[{"id":"disc","wrong":"t * d / 100","explain":"That is the discount, not the payment."}],"solution":["Discount = {d}% × {t} = {t * d / 100} FCFA.","Payment = {t} − {t * d / 100} = {answer} FCFA."],"unit":"FCFA"}}]},"questions":[{"id":"a3-8-entry","type":"mcq","level":1,"review":"authored","sources":["ohada-transactions"],"vars":{"X":{"pick":[{"q":"A customer pays 150 000 FCFA by cheque, paid into the bank.","r":"Dr 521 Bank / Cr 411 Customers","w":["Dr 411 Customers / Cr 521 Bank","Dr 521 Bank / Cr 701 Sales","Dr 571 Cash / Cr 401 Suppliers"],"e":["Reversed.","The sale was already recorded; now the debt is settled.","Not cash and not a supplier."],"y":"Bank increases; the customer owes less."},{"q":"The business pays a supplier 90 000 FCFA by bank transfer.","r":"Dr 401 Suppliers / Cr 521 Bank","w":["Dr 521 Bank / Cr 401 Suppliers","Dr 601 Purchases / Cr 521 Bank","Dr 401 Suppliers / Cr 701 Sales"],"e":["Reversed.","The purchase was already recorded; now the debt is paid.","No sale."],"y":"The debt falls; the bank falls."},{"q":"200 000 FCFA cash is paid into the bank.","r":"Dr 521 Bank / Cr 571 Cash","w":["Dr 571 Cash / Cr 521 Bank","Dr 521 Bank / Cr 101 Capital","Dr 521 Bank / Cr 701 Sales"],"e":["That is withdrawing cash from the bank.","It is not new capital.","It is not a sale."],"y":"Money moves from the till to th /** A saved lesson in progress is kept only if its flow is usable; a damaged one is dropped, never a blank page. */
const usable = (c) => c && c.flow && Array.isArray(c.flow.steps) && Array.isArray(c.rows) && Number.isInteger(c.lesson);
const cleanCurrent = (cur) => Object.fromEntries(Object.entries(cur || {}).filter(([, c]) => usable(c)));
function upgrade(s) {
  if (s.v === 2) return { ...fresh(), ...s, current: cleanCurrent(s.current) };

  const lessons = Object.fromEntries(Object.entries(s.lessons || {}).map(([n, x]) => [`maths:${n}`, x]));
  return { ...fresh(), readiness: s.readiness || null, lessons, current: cleanCurrent({ maths: s.current }) };
}

}
