ance.","truth":"false","explain":"Funding still depends on resources, terms and willingness to contribute."},{"text":"Every form gives one manager unlimited personal ownership rights.","truth":"false","explain":"Control arrangements differ and must be read from the form and case."},{"text":"A justified answer must claim that its preferred form has no drawback.","truth":"false","explain":"A reasoned comparison can favour an option while recognising its costs."}]},"pick":{"right":3,"wrong":1}}]},"6":{"subject":"economics","class":"Form 4","lesson_no":6,"language":"en","prerequisites":[3,4],"skills":[{"id":"n4-6","name":"Capital structure of companies"}],"note":{"status":"draft","text":"Capital structure describes the financing mix, especially equity and longer-term debt. Equity includes owners’ funds and retained earnings; debt requires repayment under agreed terms. In the stated school share-capital model, authorised capital is the permitted nominal ceiling, issued capital the nominal value allocated, called capital the amount requested on issued shares, and paid-up capital the amount actually received. These are distinct from a share’s market price. Legal terminology and permitted payment schedules vary; the model does not announce an OHADA filing rule or minimum capital.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to distinguish equity from debt and relate nominal issued, called and paid-up capital in a stated textbook model. Builds on: shares, shareholder returns and company financing needs. Leads to: the practical calculation of capital amounts."},{"heading":"Understand the economics","text":"Capital structure describes the financing mix, especially equity and longer-term debt. Equity includes owners’ funds and retained earnings; debt requires repayment under agreed terms. In the stated school share-capital model, authorised capital is the permitted nominal ceiling, issued capital the nominal value allocated, called capital the amount requested on issued shares, and paid-up capital the amount actually received. These are distinct from a share’s market price. Legal terminology and permitted payment schedules vary; the model does not announce an OHADA filing rule or minimum capital."},{"heading":"Follow the local case","text":"An invented company may issue nominal shares but request only a stated instalment. If some called funds are unpaid, paid-up capital is below called capital. It may also borrow or retain earnings; neither is another issue of shares. Ordinary shares carry a residual ownership claim; preference shares have stated preferential rights. A debenture is a debt instrument. Reserve capital in some textbook treatments is uncalled capital reserved for a specified event, not retained-profit reserves."},{"heading":"Reason and check","text":"Label the quantity, value per share and stage first. In a consistent instalment example, authorised ≥ issued ≥ called ≥ paid-up nominal amounts. Check unpaid calls separately. Debt interest, preferred distributions and ordinary dividends have different terms; no payment is risk-free merely because the example names it."}],"key_words":[{"word":"equity finance","meaning":"owners’ financing interests, including retained earnings"},{"word":"debt finance","meaning":"borrowed funds repayable under agreed terms"},{"word":"called capital","meaning":"the amount requested on issued shares in the stated instalment model"},{"word":"paid-up capital","meaning":"the called share-capital amount actually received in the model"}],"mistake":{"wrong":"Retained earnings are automatically a new bank loan.","right":"equity finance: owners’ financing interests, including retained earnings.","why":"Retaining profit is internal equity financing, not borrowing."}},"worked_example":{"status":"draft","vars":{},"problem":"A model issues {50} shares of nominal {1000} CFA francs, calls {600} per share and has unpaid c em."},{"id":"called","wrong":"calledTotal","explain":"This includes amounts still unpaid."}],"solution":["Subtract the called amount that has not been received.","{calledTotal} − {arrears} = {answer}."],"where":[],"unit":"CFA francs"},{"id":"n4-7-uncalled","type":"numeric","level":3,"review":"rule","sources":["business"],"vars":{"a":{"int":[6,12]},"b":{"int":[2,5]},"issued":{"expr":"b*10"},"authorised":{"expr":"a*10"},"nominal":1000,"called":{"pick":[400,600,800]},"unpaidShares":{"int":[1,5]},"calledTotal":{"expr":"issued*called"},"arrears":{"expr":"unpaidShares*called"},"paid":{"expr":"calledTotal-arrears"}},"prompt":"Textbook model: {issued} shares have nominal value {nominal} CFA francs each, but only {called} per share has been called. Calculate uncalled capital on those issued shares.","answer":"issued*(nominal-called)","misconceptions":[{"id":"unissued","wrong":"(authorised-issued)*nominal","explain":"That is unissued authorised capital, a different gap."},{"id":"arrears","wrong":"arrears","explain":"Arrears are called but unpaid; uncalled has not yet been requested."}],"solution":["Uncalled per share = {nominal} − {called} = {nominal-called}.","Across {issued} issued shares, uncalled capital = {answer}."],"where":["issued*(nominal-called) != (authorised-issued)*nominal","issued*(nominal-called) != arrears"],"unit":"CFA francs"}]},"8":{"subject":"economics","class":"Form 4","lesson_no":8,"language":"en","prerequisites":[5],"skills":[{"id":"n4-8","name":"Cooperatives: purpose, ownership and control"}],"note":{"status":"draft","text":"A cooperative is a voluntarily formed, jointly owned and democratically controlled enterprise meeting members’ common needs. Primary cooperatives normally follow one member, one vote under the cooperative principle. Capital is needed, but a larger contribution does not by itself create proportionately more votes in that model. Membership involves responsibilities as well as benefits. A cooperative can earn a surplus; it is not defi nagement problem.","truth":"false","explain":"The benefits depend on effective records, participation and management."}]},"pick":{"right":3,"wrong":1}}]},"10":{"subject":"economics","class":"Form 4","lesson_no":10,"language":"en","prerequisites":[4,9],"skills":[{"id":"n4-10","name":"Public enterprises"}],"note":{"status":"draft","text":"A public enterprise is owned or controlled by public authorities under its particular arrangement. It may pursue commercial returns, public-service access or strategic objectives. Public ownership differs from regulating a privately owned firm and from selling shares to private members of the public. A mixed-ownership enterprise combines public and private interests. Public enterprises still use scarce resources and require accountability. Neither public ownership nor a service objective proves efficiency, inefficiency or a need for permanent subsidy in every case.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to distinguish government ownership from regulation and assess commercial and service objectives. Builds on: private and cooperative ownership. Leads to: nationalisation and privatisation as changes in ownership."},{"heading":"Understand the economics","text":"A public enterprise is owned or controlled by public authorities under its particular arrangement. It may pursue commercial returns, public-service access or strategic objectives. Public ownership differs from regulating a privately owned firm and from selling shares to private members of the public. A mixed-ownership enterprise combines public and private interests. Public enterprises still use scarce resources and require accountability. Neither public ownership nor a service objective proves efficiency, inefficiency or a need for permanent subsidy in every case."},{"heading":"Follow the local case","text":"An invented local transport enterprise charges fares while serving a route valued for access. A classroom record compares fee income with service costs, without identifying a real operator or current fare. Learners can discuss who meets any gap and whether the service goal is clearly defined. A regulated private operator would represent a different ownership arrangement."},{"heading":"Reason and check","text":"Separate ownership, control, regulation and objectives. Assess service outcomes and resource costs together. A subsidy can fund a specified obligation but does not make its resource cost disappear. Do not infer the ownership of a real Cameroonian enterprise from its familiar name."}],"key_words":[{"word":"public ownership","meaning":"an enterprise interest held by public authorities"},{"word":"public-service objective","meaning":"a purpose such as access or continuity beyond a simple profit target"},{"word":"mixed ownership","meaning":"public and private interests sharing ownership in the stated arrangement"},{"word":"accountability","meaning":"responsibility to explain decisions, resources and outcomes"}],"mistake":{"wrong":"Any firm regulated by government is government-owned.","right":"public ownership: an enterprise interest held by public authorities.","why":"Rules can constrain a private firm without transferring its ownership."}},"worked_example":{"status":"draft","vars":{},"problem":"A fictional authority owns the transport enterprise. Explain the feature.","steps":["An enterprise interest held by public authorities.","Rules can constrain a private firm without transferring its ownership."],"answer":"public ownership","checks":[]},"teach":{"cards":[{"id":"n4-10-c1","status":"draft","idea":"Distinguish these features before judging a business.","vars":{},"example":["public ownership: an enterprise interest held by public authorities.","public-service objective: a purpose such as access or continuity beyond a simple profit target.","mixed ownership: public and private interests sharing ownership in the stated arrangement.", rprise assets or interests into public ownership through the applicable process. Possible aims include strategic control, service access or coordination. It differs from regulating a private business, subsidising it or merely changing its managers. A transfer may involve acquisition costs and continuing financing obligations. The name of the policy does not establish its outcome: efficiency, access and accountability depend on implementation and circumstances. This lesson uses hypothetical transfers, not an assertion about a current Cameroonian policy or compensation rule."},{"heading":"Follow the local case","text":"A fictional authority acquires ownership interests in an existing private enterprise to pursue a stated service goal. The enterprise still requires workers, maintenance and oversight. A separate example in which the authority sets quality rules but buys no interest is regulation, not nationalisation. A partial holding must be described accurately rather than called complete ownership."},{"heading":"Reason and check","text":"Identify what ownership changed, who paid or financed it in the model and what goal was stated. Evaluate outcomes with evidence instead of assuming the goal has already been achieved. An ownership percentage alone does not reveal every legal control right in a real enterprise."}],"key_words":[{"word":"nationalisation","meaning":"a transfer from private to public enterprise ownership"},{"word":"strategic-control aim","meaning":"an intention to direct an activity considered important by public authorities"},{"word":"acquisition cost","meaning":"resources required to obtain ownership in the stated transfer"},{"word":"implementation risk","meaning":"the possibility that the chosen ownership policy fails to achieve its aims"}],"mistake":{"wrong":"Any government quality rule is automatically nationalisation.","right":"nationalisation: a transfer from private to public enterprise ownership.","why":"A regulation need not transfer ownership." pothetical policies rather than recommend a real transaction."},{"heading":"Follow the local case","text":"An invented authority sells part of an enterprise’s shares, retaining a public stake. Another authority keeps ownership but asks its enterprise to cover more costs through charges. These are different changes. A market can remain concentrated after an ownership sale, so describing it as private does not establish effective competition or low prices."},{"heading":"Reason and check","text":"State the direction and extent of ownership change. Ask about sale proceeds, continuing obligations, access and competition. Separate a short-term receipt from recurring profit or long-term service outcomes. Read whether a percentage refers to the whole enterprise or only a block of shares."}],"key_words":[{"word":"privatisation","meaning":"a transfer from public to private ownership in the stated enterprise arrangement"},{"word":"liberalisation","meaning":"opening or changing market-entry and competition rules"},{"word":"commercialisation","meaning":"operating on a more commercial basis without necessarily transferring ownership"},{"word":"market-power concern","meaning":"the risk that a dominant seller can limit competition regardless of ownership"}],"mistake":{"wrong":"Privatisation always means the state acquires private shares.","right":"privatisation: a transfer from public to private ownership in the stated enterprise arrangement.","why":"That is the opposite ownership direction."}},"worked_example":{"status":"draft","vars":{},"problem":"Private investors buy part of a publicly held enterprise. Explain the feature.","steps":["A transfer from public to private ownership in the stated enterprise arrangement.","That is the opposite ownership direction."],"answer":"privatisation","checks":[]},"teach":{"cards":[{"id":"n4-13-c1","status":"draft","idea":"Distinguish these features before judging a business.","vars":{},"example":["privatisation: a transfer from public to privat ,"skills":[{"id":"n4-14","name":"Economies of scale"}],"note":{"status":"draft","text":"Economies of scale occur when larger output scale lowers long-run average cost as the firm can vary all inputs. Internal economies arise within the firm, such as specialisation, technical indivisibilities or purchasing advantages. External economies can arise from an industry’s expansion, such as specialised suppliers or a relevant skills pool. Total cost can rise while average cost falls. A purchasing discount is useful only if storage, quality and demand make the larger order worthwhile. Size does not guarantee a cost saving.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to explain why larger scale can lower long-run average cost and calculate the saving per unit. Builds on: resources, finance and the cost of supplying output. Leads to: diseconomies of scale and the limits to expansion."},{"heading":"Understand the economics","text":"Economies of scale occur when larger output scale lowers long-run average cost as the firm can vary all inputs. Internal economies arise within the firm, such as specialisation, technical indivisibilities or purchasing advantages. External economies can arise from an industry’s expansion, such as specialised suppliers or a relevant skills pool. Total cost can rise while average cost falls. A purchasing discount is useful only if storage, quality and demand make the larger order worthwhile. Size does not guarantee a cost saving."},{"heading":"Follow the local case","text":"A fictional Douala workshop compares complete production plans at different scales. Specialist equipment may spread its services over more output, and a larger firm may organise specialised tasks. A cluster of firms can also support a specialist supplier. These are possible mechanisms, not proof that every large firm is efficient or every observed cost fall comes from scale."},{"heading":"Reason and check","text":"Compute average cost as total cost divided by comparable output. State whether the cause is internal to one firm or external through its industry. Separate long-run scale from a short-run change with fixed capacity. Lower cost may enable lower prices, but the actual price also depends on market conditions."}],"key_words":[{"word":"internal economy","meaning":"a scale-related cost advantage arising within the firm"},{"word":"external economy","meaning":"a benefit linked to expansion of the industry or cluster rather than one firm alone"},{"word":"average cost","meaning":"total cost divided by the corresponding output"},{"word":"purchasing economy","meaning":"a scale-related opportunity to obtain inputs on lower unit-cost terms"}],"mistake":{"wrong":"Every internal economy comes only from unrelated firms expanding.","right":"internal economy: a scale-related cost advantage arising within the firm.","why":"The source is within the expanding firm’s own organisation or technology."}},"worked_example":{"status":"draft","vars":{},"problem":"Compare a smaller long-run plan costing {10000} for {20} units with a larger plan costing {16000} for {40} units.","steps":["Average costs: {10000/20} and {16000/40} CFA francs per unit.","The larger plan saves {10000/20-16000/40} per unit even though its total cost is higher."],"answer":"Average cost falls by {10000/20-16000/40} CFA francs per unit.","checks":[]},"teach":{"cards":[{"id":"n4-14-c1","status":"draft","idea":"Distinguish these features before judging a business.","vars":{},"example":["internal economy: a scale-related cost advantage arising within the firm.","external economy: a benefit linked to expansion of the industry or cluster rather than one firm alone.","average cost: total cost divided by the corresponding output.","purchasing economy: a scale-related opportunity to obtain inputs on lower unit-cost terms."],"checks":[],"check":{"ref":"n4-14-terms"}},{"id":"n4-14-c2","status":"draft","ide ather than the feature described here.","That explanation addresses external economy, rather than the feature described here.","That explanation addresses average cost, rather than the feature described here."],"y":"A scale-related opportunity to obtain inputs on lower unit-cost terms."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"n4-14-average-saving","type":"numeric","level":2,"review":"rule","sources":["business"],"vars":{"q":{"int":[10,40]},"ac":{"int":[300,600]},"save":{"int":[20,100]},"c1":{"expr":"q*ac"},"c2":{"expr":"2*q*(ac-save)"}},"prompt":"For comparable long-run production plans, an invented workshop can make {q} units at total cost {c1}, or {2*q} units at total cost {c2} CFA francs. How much lower is average cost per unit in the larger plan?","answer":"c1/q-c2/(2*q)","misconceptions":[{"id":"total","wrong":"c1-c2","explain":"Compare average costs, not a difference between total costs."},{"id":"large","wrong":"c2/(2*q)","explain":"That is the new average cost, not the decrease in it."}],"solution":["Smaller-plan average cost = {c1}/{q} = {ac}.","Larger-plan average cost = {c2}/{2*q} = {ac-save}.","Saving per unit = {ac} − {ac-save} = {answer} CFA francs."],"where":[],"unit":"CFA francs per unit"},{"id":"n4-14-repair","type":"spot_error","level":3,"review":"authored","sources":["business"],"prompt":"Find the incorrect economic claim.","pool":{"right":[{"text":"internal economy: a scale-related cost advantage arising within the firm.","truth":"true","explain":"This is correct: a scale-related cost advantage arising within the firm. Look for a statement that contradicts the lesson’s distinction."},{"text":"external economy: a benefit linked to expansi price shock is not automatically an internal diseconomy caused by a firm’s scale. Economies and diseconomies may operate together; the net cost pattern matters. Higher total spending alone does not establish diseconomies.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to identify scale-related coordination costs and calculate a rise in long-run average cost. Builds on: economies of scale and average-cost comparisons. Leads to: evaluating growth instead of assuming bigger is always better."},{"heading":"Understand the economics","text":"Diseconomies of scale occur when expansion raises long-run average cost. Communication delays, coordination difficulties and weak monitoring can offset benefits of size. External diseconomies can arise as industry expansion creates congestion or pressure on scarce local resources. A temporary input-price shock is not automatically an internal diseconomy caused by a firm’s scale. Economies and diseconomies may operate together; the net cost pattern matters. Higher total spending alone does not establish diseconomies."},{"heading":"Follow the local case","text":"An invented processor expands across several departments. Instructions arrive late and incompatible schedules cause rework. In another case, industry-wide congestion delays many firms. The first mechanism arises within the firm, while the second concerns the local industry environment. Neither proves that every large organisation must fail."},{"heading":"Reason and check","text":"Look for an explained link from scale to cost. Compare cost per unit under comparable plans, and distinguish internal from external causes. Then propose a response, such as clearer coordination, while recognising that a remedy also uses resources. Do not confuse long-run scale with diminishing returns to one variable input at fixed capacity."}],"key_words":[{"word":"internal diseconomy","meaning":"a scale-relate er than the feature described here."],"y":"Weighing relevant costs and constraints rather than a single attractive feature."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"n4-20-site-cost","type":"numeric","level":2,"review":"rule","sources":["business"],"vars":{"arent":{"pick":[2000,3000,4000]},"ain":{"pick":[1000,1500,2000]},"aout":{"pick":[500,1000,1500]},"saving":{"pick":[500,1000,2000]},"btotal":{"expr":"arent+ain+aout+saving"}},"prompt":"Invented monthly cost record: Site A has rent {arent}, input transport {ain} and outward delivery {aout}; Site B’s complete comparable total is {btotal}, all in CFA francs. How much lower is A’s stated total than B’s?","answer":"btotal-(arent+ain+aout)","misconceptions":[{"id":"rentonly","wrong":"btotal-arent","explain":"That omits A’s input and outward transport costs."},{"id":"atotal","wrong":"arent+ain+aout","explain":"That is A’s total, not its saving relative to B."}],"solution":["A total = {arent} + {ain} + {aout} = {arent+ain+aout}.","B minus A = {btotal} − {arent+ain+aout} = {answer} CFA francs.","This compares only the stated costs; check service reliability and other constraints separately."],"where":[],"unit":"CFA francs"},{"id":"n4-20-repair","type":"spot_error","level":3,"review":"authored","sources":["business"],"prompt":"Find the incorrect economic claim.","pool":{"right":[{"text":"localisation: concentration of related industrial activities in an area.","truth":"true","explain":"This is correct: concentration of related industrial activities in an area. Look for a statement that contradicts the lesson’s distinction."},{"text":"cluster benefit: an advantage from nearby related firms, skills or suppliers.","truth":"true","explain":"This is correct: an advantage from nearby related firms, skills or suppliers. Look for a statement that contradicts the lesson’s distinction."},{"text":"location incentive: a policy measure intended to attract or support activity in a place.","truth":"true","explain":"This is correct: a policy measure intended to attract or support activity in a place. Look for a statement that contradicts the lesson’s distinction."},{"text":"complete site comparison: weighing relevant costs and constraints rather than a single attractive feature.","truth":"true","explain":"This is correct: weighing relevant costs and constraints rather than a single attractive feature. Look for a statement that contradicts the lesson’s distinction."}],"wrong":[{"text":"Localisation means only one firm choosing any isolated site.","truth":"false","explain":"The term concerns a concentration of activities, not just an individual location."},{"text":"Clustering always has advantages and never congestion costs.","truth":"false","explain":"Benefits must be weighed against crowding and competing resource demands."},{"text":"An incentive alone proves every site condition is suitable.","truth":"false","explain":"Service, demand and operating constraints remain even if one cost is reduced."},{"text":"The lowest rent is always the lowest total cost and best feasible site.","truth":"false","explain":"Other costs and essential conditions can overturn a rent-only ranking."}]},"pick":{"right":3,"wrong":1}}]}},"f4-logic":{"1":{"subject":"logic","class":"Form 4","lesson_no":1,"language":"en","prerequisites":[],"skills":[{"id":"l4-1","name":"Structure of a proposition"}],"note":{"status":"draft","text":"A proposition asserts something. In standard categorical form, distinguish quantifier, subject term, copula and predicate term. Keep multiword terms intact. Parsing a claim does not verify its truth.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to separate quantifier, subject term, copula and predicate term in a standard categorical statement. Builds on: Form Three’s distinction between a term, a judgment and an argument. Leads to: categorical propositions, where these parts express a relation between classes."},{"heading":"A claim has a structure","text":"A proposition expresses an assertion that can be true or false. A question or command does not automatically assert a proposition. The standard categorical model makes its parts visible: quantifier + subject term + copula + predicate term. The quantifier sets the scope; the subject names the class discussed; the copula links; the predicate names the class attributed or denied. Other propositions need different analyses, which come later."},{"heading":"Follow the parts in a local example","text":"In an invented Buea club rule, All club members are badge holders, All is the quantifier, club members the subject term, are the copula and badge holders the predicate term. Both class expressions contain several words. A term is not restricted to one word, and naming the parts does not prove the club actually follows that rule."},{"heading":"Keep whole terms together","text":"First identify what class is discussed. Then locate the relation and the class attributed to it. Finally check the quantifier. In Some library books are not loanable items, library books is the subject, loanable items the predicate and are not the negative copula in this school model. The words not and are do not create a new class name."}],"key_words":[{"word":"quantifier","meaning":"how much of the subject class is covered"},{"word":"subject term","meaning":"the class about which the claim is made"},{"word":"copula","meaning":"the linking expression joining subject and predicate"},{"word":"predicate term","meaning":"the class attributed to, or denied of, the subject"}],"mistake":{"wrong":"Each word is a separate logical term.","right":"Club members is one multiword term.","why":"Logical function depends on the expression’s role, not its word count."}},"worked_example":{"status":"draft","vars":{},"problem":"Parse All library books are loanable items.","steps":["All states the scope.","Library books names the class discussed.","Are links that class to loanable items."],"answer":"Quantifier: All; subject: library books; copula: are; predicate: loanable items.","checks":[]},"teach":{"cards":[{"id":"l4-1-c1","status":"draft","idea":"Each part has a different job.","vars":{},"example":["quantifier: All — how much of the subject class is covered.","subject term: club members — the class about which the claim is made.","copula: are — the linking expression joining subject and predicate.","predicate term: badge holders — the class attributed to, or denied of, the subject."],"checks":[],"check":{"ref":"l4-1-parts"}},{"id":"l4-1-c2","status":"draft","idea":"The subject is the whole class being discussed.","vars":{},"example":["All library books are loanable items: library books is the subject."],"checks":[],"check":{"ref":"l4-1-subject"}},{"id":"l4-1-c3","status":"draft","idea":"A logical term can contain several words.","vars":{},"example":["School gardens and cultivated areas each function as a term."],"checks":[],"check":{"id":"l4-1-boundaries-card","type":"mcq","level":1,"review":"authored","sources":["categorical"],"vars":{"X":{"pick":[{"q":"In “All club members are badge holders,” which expression is one complete logical term?","r":"club members","w":["All","are","All are"],"e":["All is the quantifier.","Are is the copula.","This combines separate functions and omits the class expression."],"y":"A logical term may contain several words while naming one class."},{"q":"In “All library books are loanable items,” which expression is one complete logical term?","r":"library books","w":["All","are","All are"],"e":["All is the quantifier.","Are is the copula.","This combines separate functions and omits the class expression."],"y":"A logical term may contain several words while naming one class."},{"q":"In “All school gardens are cultivated areas,” which expression is one complete logical term?","r":"school gardens","w":["All","are","All are"],"e":["All is the quantifier.","Are is the copula.","This combines separate functions and omits the class expression."],"y":"A logical term may contain several words while naming one class."},{"q":"In “All reading rooms are quiet places,” which expression is one complete logical term?","r":"reading rooms","w":["All","are","All are"],"e":["All is the quantifier.","Are is the copula.","This combines separate functions and omits the class expression."],"y":"A logical term may contain several words while naming one class."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"l4-1-parts","type":"mcq","level":1,"review":"authored","sources":["categorical"],"vars":{"X":{"pick":[{"q":"In All club members are badge holders, what is the role of “All”?","r":"quantifier","w":["subject term","copula","predicate term"],"e":["That role concerns the class about which the claim is made, rather than the selected expression.","That role concerns the linking expression joining subject and predicate, rather than the selected expression.","That role concerns the class attributed to, or denied of, the subject, rather than the selected expression."],"y":"how much of the subject class is covered."},{"q":"In All club members are badge holders, what is the role of “club members”?","r":"subject term","w":["quantifier","copula","predicate term"],"e":["That role concerns how much of the subject class is covered, rather than the selected expression.","That l. No members are visitors excludes overlap; it does not prove that visitors do not exist."},{"heading":"Form and truth are separate","text":"Translate the relation clearly before checking whether it is true. A false claim can still have categorical form. Under the modern diagram convention used later, universal claims alone do not assert that S exists; particular claims do. Traditional courses may add an existence assumption. State that assumption when needed rather than inferring a member from all alone."}],"key_words":[{"word":"class","meaning":"a collection picked out by a term"},{"word":"categorical proposition","meaning":"a quantified assertion relating subject and predicate classes"},{"word":"some","meaning":"at least one"},{"word":"overlap","meaning":"members belonging to both classes"}],"mistake":{"wrong":"Some means some but never all.","right":"Some means at least one and is compatible with all.","why":"Not all is a further restriction absent from some alone."}},"worked_example":{"status":"draft","vars":{},"problem":"Does All club members are badge holders also say All badge holders are club members?","steps":["The claim starts with the club-member class.","Each of its members must be a badge holder.","Other badge holders may exist outside that club."],"answer":"No. The original inclusion does not automatically reverse.","checks":[]},"teach":{"cards":[{"id":"l4-2-c1","status":"draft","idea":"A standard categorical assertion quantifies and relates two classes.","vars":{},"example":["All school gardens are cultivated areas has explicit class terms and a copula."],"checks":[],"check":{"ref":"l4-2-recognise"}},{"id":"l4-2-c2","status":"draft","idea":"Some means at least one, with no fixed upper limit.","vars":{},"example":["Some library books are loanable items does not itself say that others are not."],"checks":[],"check":{"ref":"l4-2-some"}},{"id":"l4-2-c3","status":"draft","idea":"No S are P rules out overlap.","vars":{},"example":["The predicate class can proposition covers. Do not confuse distribution with sample size or reverse an A claim without justification.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to state and justify which terms are distributed in each categorical form. Builds on: the A, E, I and O forms. Leads to: interpreting diagrams and avoiding illicit class-wide conclusions in later syllogisms."},{"heading":"What distributed means","text":"A term is distributed when the proposition speaks about every member of the class it names. This concerns logical coverage, not how many objects a classroom sample contains. Ask separately about S and P. A: S only. E: both. I: neither. O: P only. Learn the pattern with its reason, rather than treating a quantifier as a signal that both terms are distributed."},{"heading":"Why the affirmative forms differ","text":"All club members are badge holders covers every club member. It leaves open whether other badge holders exist, so P is undistributed. Some club members are badge holders covers selected members and does not exhaust either class. Thus A distributes S, while I distributes neither. Reversing an A statement would add a claim about the entire predicate class that the original did not make."},{"heading":"Why negative predicates are distributed","text":"No S are P excludes every S from the whole P class, so both terms are distributed. Some S are not P selects at least one S and excludes that member from P as a whole: S is undistributed, P distributed. The claim does not assert that all S are outside P. Distribution will later help test whether a conclusion claims more class coverage than its premises supply."}],"key_words":[{"word":"distributed","meaning":"covering every member of the term’s class"},{"word":"undistributed","meaning":"not covering every member of the term’s class"},{"word":"subject coverage","meaning":"whether every S is covered"},{"word":"predicate cove ibutes both terms.","truth":"true","explain":"This is a correct rule: E distributes both terms. Look for a claim that breaks a rule taught in Learn."},{"text":"I distributes neither term.","truth":"true","explain":"This is a correct rule: I distributes neither term. Look for a claim that breaks a rule taught in Learn."},{"text":"O distributes its predicate only.","truth":"true","explain":"This is a correct rule: O distributes its predicate only. Look for a claim that breaks a rule taught in Learn."}],"wrong":[{"text":"Distribution is the number of letters in a term.","truth":"false","explain":"It concerns whole-class coverage, not spelling."},{"text":"Some S are P distributes its subject because some is a quantifier.","truth":"false","explain":"Some does not cover all S; I distributes neither term."},{"text":"All S are P distributes P because every P must be S.","truth":"false","explain":"A includes every S in P but allows other P."},{"text":"A negative proposition never distributes its predicate.","truth":"false","explain":"Both E and O distribute their predicate class."}]},"pick":{"right":3,"wrong":1}}]},"6":{"subject":"logic","class":"Form 4","lesson_no":6,"language":"en","prerequisites":[4,5],"skills":[{"id":"l4-6","name":"Symbolisation and Venn diagrams"}],"note":{"status":"draft","text":"A shades S-only; E shades overlap; I puts x in overlap; O puts x in S-only. Shading means empty and x means at least one. Blank is unspecified. Keep the existence convention explicit.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to translate between a categorical statement, its A/E/I/O symbol and a correctly marked Venn diagram. Builds on: categorical forms and whole-class coverage. Leads to: clear symbolisation before combining claims in later arguments."},{"heading":"Give the marks a fixed meaning","text":"The overlapping circles represent classes S and P. Their overlap contains shared members; S-only contains S outside P. Shading says a region is empty. An x asserts at least one object in a region. An unmarked region is unspecified, not necessarily occupied. Here we use the modern convention: a universal proposition alone adds no existence mark. An explicit existence assumption must be stated if a traditional treatment is used."},{"heading":"Translate each form","text":"A, All S are P: shade S-only, because no S may be outside P. E, No S are P: shade the overlap. I, Some S are P: put x in the overlap. O, Some S are not P: put x in S-only. The example diagram shows A. Its blank overlap is not evidence of existence.","figure":"\"\u003csvg xmlns=\\\"http://www.w3.org/2000/svg\\\" viewBox=\\\"0 0 320 190\\\" role=\\\"img\\\" aria-label=\\\"Categorical Venn diagram. Left circle S, right circle P. Shading means empty; x means existence.\\\">\u003cdefs>\u003cclipPath id=\\\"subject\\\">\u003ccircle cx=\\\"120\\\" cy=\\\"95\\\" r=\\\"65\\\"/>\u003c/clipPath>\u003c/defs>\u003crect width=\\\"320\\\" height=\\\"190\\\" fill=\\\"white\\\"/>\u003ccircle cx=\\\"120\\\" cy=\\\"95\\\" r=\\\"65\\\" fill=\\\"#b4c9bf\\\"/>\u003cg clip-path=\\\"url(#subject)\\\">\u003ccircle cx=\\\"195\\\" cy=\\\"95\\\" r=\\\"65\\\" fill=\\\"white\\\"/>\u003c/g>\u003cg fill=\\\"none\\\" stroke=\\\"#233e31\\\" stroke-width=\\\"2\\\">\u003ccircle cx=\\\"120\\\" cy=\\\"95\\\" r=\\\"65\\\"/>\u003ccircle cx=\\\"195\\\" cy=\\\"95\\\" r=\\\"65\\\"/>\u003c/g>\u003cg font-size=\\\"18\\\" text-anchor=\\\"middle\\\" fill=\\\"#17251c\\\">\u003ctext x=\\\"105\\\" y=\\\"22\\\">S\u003c/text>\u003ctext x=\\\"211\\\" y=\\\"22\\\">P\u003c/text>\u003c/g>\u003c/svg>\""},{"heading":"Read back to check","text":"For an invented Bamenda club, let S be club members and P badge holders. An x in S-only represents a member without a badge, so it is O. Read your completed diagram back into words before accepting it. Changing shading to x reverses empty into occupied; placing the right kind of mark in the wrong region also changes the assertion."}],"key_words":[{"word":"shading","meaning":"an assertion that a region is empty"},{"word":"x mark","meaning":"an assertion of at least one object"},{"word":"S-only","meaning":"S members outside P"},{"word":"overlap","meaning":"members common to S and P"}],"mistake":{"wrong":"Unshaded overlap proves shared members exist.","right":"Unmarked means unspecified.","why":"A universal diagram alone does not add the existence asserted by a particular form."}},"worked_example":{"status":"draft","vars":{},"problem":"Represent No library books are loanable items with S for books and P for loanable items.","steps":["No denies that an object belongs to both classes.","The forbidden region is their overlap.","Shade the overlap; do not place an existence x."],"answer":"E: overlap shaded.","checks":[],"figure":"\"\u003csvg xmlns=\\\"http://www.w3.org/2000/svg\\\" viewBox=\\\"0 0 320 190\\\" role=\\\"img\\\" aria-label=\\\"Categorical Venn diagram. Left circle S, right circle P. Shading means empty; x means existence.\\\">\u003cdefs>\u003cclipPath id=\\\"subject\\\">\u003ccircle cx=\\\"120\\\" cy=\\\"95\\\" r=\\\"65\\\"/>\u003c/clipPath>\u003c/defs>\u003crect width=\\\"320\\\" height=\\\"190\\\" fill=\\\"white\\\"/>\u003cg clip-path=\\\"url(#subject)\\\">\u003ccircle cx=\\\"195\\\" cy=\\\"95\\\" r=\\\"65\\\" fill=\\\"#b4c9bf\\\"/>\u003c/g>\u003cg fill=\\\"none\\\" stroke=\\\"#233e31\\\" stroke-width=\\\"2\\\">\u003ccircle cx=\\\"120\\\" cy=\\\"95\\\" r=\\\"65\\\"/>\u003ccircle cx=\\\"195\\\" cy=\\\"95\\\" r=\\\"65\\\"/>\u003c/g>\u003cg font-size=\\\"18\\\" text-anchor=\\\"middle\\\" fill=\\\"#17251c\\\">\u003ctext x=\\\"105\\\" y=\\\"22\\\">S\u003c/text>\u003ctext x=\\\"211\\\" y=\\\"22\\\">P\u003c/text>\u003c/g>\u003c/svg>\""},"teach":{"cards":[{"id":"l4-6-c1","status":"draft","idea":"Read the quantifier and copula before choosing a code.","vars":{},"example":["A: all are; E: no are; I: some are; O: some are not."],"checks":[],"check":{"ref": ":3,"wrong":1}}]},"8":{"subject":"logic","class":"Form 4","lesson_no":8,"language":"en","prerequisites":[2,4],"skills":[{"id":"l4-8","name":"Hypothetical or conditional propositions"}],"note":{"status":"draft","text":"A conditional links antecedent to consequent without asserting either separately. Material implication is false only for true P and false Q. Preserve direction, distinguish necessary from sufficient, and do not confuse a truth function with causal evidence.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to identify antecedent and consequent, preserve the direction of a condition and recognise its counterexample. Builds on: a proposition as a truth-valued claim; categorical inclusion as a directed relation. Leads to: disjunctions and the later symbolic-logic truth tables."},{"heading":"A compound with a direction","text":"If P then Q is a conditional: P is the antecedent and Q the consequent. Under the stated rule, P is sufficient for Q and Q necessary for P. The rule does not assert P, and it does not automatically reverse. If a fictional club meets, then its room is reserved does not say a reserved room guarantees a club meeting."},{"heading":"Find the violating case","text":"For the material-conditional convention, the conditional is false only when P is true and Q false. True/true, false/true and false/false do not refute it. A false antecedent does not establish that a real causal explanation is good: truth-functional evaluation and causal evidence are different questions. These exercises state their convention explicitly."},{"heading":"Use the relation carefully","text":"A club meeting without the required reservation refutes the invented rule. A reservation without a meeting need not refute it: another group could have booked the room. Do not infer P from Q alone. When translating only if, the condition following only if is necessary: P only if Q becomes subject":"logic","class":"Form 4","lesson_no":9,"language":"en","prerequisites":[8],"skills":[{"id":"l4-9","name":"Disjunctive propositions"}],"note":{"status":"draft","text":"Inclusive OR permits either or both and fails only when both are false. Exclusive OR requires exactly one true alternative. State the intended reading. Denying one alternative of an accepted OR requires the other; affirming one does not exclude the other under inclusive OR.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to distinguish inclusive from exclusive or, evaluate each and infer the remaining alternative when one is denied. Builds on: compound propositions and truth-value evaluation in the conditional lesson. Leads to: accurate translation and later truth tables for logical connectives."},{"heading":"Alternatives joined by or","text":"A disjunction combines propositions as P or Q. In the default formal convention here, or is inclusive: P, Q or both can make it true. Both false makes it false. For an invented Douala club notice, a message can be printed or sent electronically, allowing both methods. Do not silently read an extra not both into that statement."},{"heading":"Exactly one is a different rule","text":"An exclusive disjunction requires one true alternative and one false alternative. A task that says choose drawing or poetry, but not both explicitly uses that rule. Both true then fails, as does both false. Ordinary either…or can depend on context, so these exercises always specify the reading instead of asking pupils to guess the speaker’s intention."},{"heading":"What follows from denying an alternative","text":"If P or Q is accepted and P is false, Q must be true: otherwise both would be false. But if P is true, inclusive OR leaves Q open. This difference matters when translating everyday rules. Neither P nor Q denies both; it is not another spelling of P or Q."}],"key_words":[{"word" hen it changes word order."},{"heading":"Singular and indefinite claims","text":"Bih is a member is singular: it concerns an individual. One explicit standardisation treats S as persons identical with Bih, giving All persons identical with Bih are members; assume the name denotes a person. Teachers should confirm their course’s singular convention. Members are readers, without an explicit quantifier, is indefinite in the traditional classroom sense. Ask whether context means all or some; do not guess from the plural alone."},{"heading":"Do not erase an exception","text":"For this explicit rule, every library book except damaged library books is loanable, and none of the damaged books is loanable. Preserve both parts: All undamaged library books are loanable items; No damaged library books are loanable items. One blanket All library books are loanable items would erase the exception. Other compound claims may require more than one categorical statement, or the conditional/disjunctive forms just studied."}],"key_words":[{"word":"exclusive categorical wording","meaning":"only restricts one class to another; distinct from exclusive OR"},{"word":"singular","meaning":"concerning a specified individual"},{"word":"indefinite","meaning":"lacking an explicit quantifier in this school terminology"},{"word":"exceptive","meaning":"expressing an exception that must be preserved"}],"mistake":{"wrong":"Only members are voters means every member votes.","right":"It means every voter is a member.","why":"Only makes membership necessary for being a voter, without asserting that all members vote."}},"worked_example":{"status":"draft","vars":{},"problem":"Translate Only badge holders are club voters.","steps":["The restricted group is club voters.","Every club voter must be within the badge-holder class.","The claim leaves open whether all badge holders vote."],"answer":"All club voters are badge holders.","checks":[]},"teach":{"cards":[{"id":"l4-10-c1","status":"draft","idea":"Only S a const usable = (c) => c && c.flow && Array.isArray(c.flow.steps) && Array.isArray(c.rows) && Number.isInteger(c.lesson);
const cleanCurrent = (cur) => Object.fromEntries(Object.entries(cur || {}).filter(([, c]) => usable(c)));
function upgrade(s) {
  if (s.v === 2) return { ...fresh(), ...s, current: cleanCurrent(s.current) };

const inFrench = (s) => /^((f\d|[lu]6)-)?(french|francais-intensif)$/.test(s);  // french, f2-french, l6-francais-intensif …
const T = (text, v = {}) => ((inFrench(S) && FR[text]) || text).replace(/\{(\w)\}/g, (_, k) => v[k]);

// ---------------------------------------------------------------- one question, any type
/** A typed answer box (numbers or words): Enter or "Check" submits; the engine picks the keyboard. */
function answerBox(q, finish, inline = false) {
  const input = el("input", { type: "text", inputmode: inputModeFor(q), autocomplete: "off", autocorrect: "off", autocapitalize: "off",
    spellcheck: "false", "aria-label": T("Your answer"), class: inline ? "blank-input" : "" });
  const go = () => { const v = normaliseInput(input.value, q); if (v) finish(v); };
  input.addEventListener("keydown", (e) => e.key === "Enter" && go());
  setTimeout(() => input.focus(), 50);
  return { input, check: button(T("Check"), go, "primary") };
}

/** Cloze: the sentence with its blank inline. Typed: a box in the gap. Choose: a dotted gap, options below. */
function clozeSentence(q, box = null) {
  const [before, after] = q.sentence.split("___");
  return el("div", { class: "sentence" }, before, box || el("span", { class: "blank", "aria-label": "blank" }, " "), after);
}

/** Word order: tap a word to place it; tap a placed word to send it back. The final . ? or ! is fixed. */
function wordOrder(q, finish) {
  const placed = [];
  const line = el("div", { class: "built", "aria-live": "polite" });
  const pool = el("div", { class: "tiles" });
  const done = button(T("Check"), () => placed.length === q.items.length && finish([...placed]), "primary");
  const redraw = () => {
    line.replaceChildren(...(placed.length
      ? [...placed.map((i, k) => button(q.items[i], () => { placed.splice(k, 1); redraw(); }, "tile placed")), ...(q.end ? [el("span", { class: "end" }, q.end)] : [])]
      : [el("span", { class: "muted" }, T("Tap the words below."))]));
    fill(pool, q.items.map((t, i) => (placed.includes(i) ? null : button(t, () => { placed.push(i); redraw(); }, "tile"))));
    done.disabled = placed.length !== q.items.length;
  };
  redraw();
  return [para(T("Tap a word to add it. Tap a word in your sentence to take it out."), "muted"), line, pool, done];
}

/** Matching: tap a left item, then a right item, to pair them; tap a pair to undo it. */
function matching(q, finish) {
  const pairOf = q.left.map(() => null);  // left index → right index
  let picked = null;
  const done = button(T("Check"), () => pairOf.every((r) => r !== null) && finish([...pairOf]), "primary");
  const wrap = el("div", {});
  const redraw = () => {
    const rightUsed = new Map(pairOf.map((r, l) => [r, l]).filter(([r]) => r !== null));
    const badge = (n) => el("span", { class: "badge", "aria-hidden": "true" }, String(n + 1));
    const lefts = q.left.map((t, i) => {
      const paired = pairOf[i] !== null;
      return button([paired ? badge(i) : null, t], () => {
        if (paired) pairOf[i] = null; else picked = picked === i ? null : i;
        redraw();
      }, `match${paired ? " paired" : ""}${picked === i ? " picked" : ""}`);
    });
    const rights = q.right.map((t, r) => {
      const l = rightUsed.get(r);
      return button([l !== undefined ? badge(l) : null, t], () => {
        if (l !== undefined) pairOf[l] = null;
        else if (picked !== null) { pairOf[picked] = r; picked = null; }
        redraw();
      }, `match${l !== undefined ? " paired" : ""}${picked !== null && l === undefined ? " ready" : ""}`);
    });
    wrap.replaceChildren(el("div", { class: "match-cols" }, el("div", { class: "col" }, ...lefts), el("div", { class: "col" }, ...rights)));
    done.disabled = pairOf.some((r) => r === null);
  };
  redraw();
  return [para(T("Tap an item on the left, then its partner on the right. Tap a pair to undo it."), "muted"), wrap, done];
}

/** Sorting (matching with groups): tap a word, then tap its group; tap a word inside a group to take it out. */
function sorting(q, finish) {
  const groupOf = q.left.map(() => null);
  let picked = null;
  const done = button(T("Check"), () => groupOf.every((g) => g !== null) && finish([...groupOf]), "primary");
  const wrap = el("div", {});
  const redraw = () => {
    const loose = q.left.map((t, i) => (groupOf[i] === null ? button(t, () => { picked = picked === i ? null : i; redraw(); }, `tile${picked === i ? " picked" : ""}`) : null));
    const groups = q.right.map((g, gi) => el("div", { class: `group${picked !== null ? " ready" : ""}`, role: "button", tabindex: "0",
      onclick: (e) => { if (e.target.closest(".tile") || picked === null) return; groupOf[picked] = gi; picked = null; redraw(); },
      onkeydown: (e) => { if ((e.key === "Enter" || e.key === " ") && picked !== null) { e.preventDefault(); groupOf[picked] = gi; picked = null; redraw(); } } },
      el("div", { class: "group-name" }, g),
      el("div", { class: "tiles" }, ...q.left.map((t, i) => (groupOf[i] === gi ? button(t, () => { groupOf[i] = null; redraw(); }, "tile placed") : null)))));
    wrap.replaceChildren(el("div", { class: "tiles" }, ...loose), ...groups);
    done.disabled = groupOf.some((g) => g === null);
  };
  redraw();
  return [para(T("Tap a word, then tap its group. Tap a word in a group to take it out."), "muted"), wrap, done];
}

/** A base answer: the small base is printed after the box, so the pupil types only the digits (2026-10-24). */
const baseTag = (q) => el("span", { class: "base-tag", "aria-label": T("in base {a}", { a: q.base }) }, LIB().sub(q.base));
const baseTip = (q) => para(T("Type only the digits. The small {a} is already there.", { a: LIB().sub(q.base) }), "muted");

/** Shows q; calls onAnswer({result, ms}) when the pupil answers or presses "I don't know". */
function askQuestion(q, { kicker, title, onAnswer, bar = null, back = null }) {
  const t0 = performance.now();
  const finish = (response) => onAnswer({ result: check(q, response), ms: Math.round(performance.now() - t0) });
  const body = [bar, header(kicker, title), el("div", { class: "prompt" }, q.prompt), figureBox(q.figure)];
  if (q.type === "blanks") {
    // a step-by-step line: one small box per blank, all checked together (2026-10-19)
    // a text value is a base numeral (the last box of a division ladder): a wider box, the base shown after it
    const inputs = q.answers.map((_, i) => el("input", { type: "text", inputmode: "numeric", autocomplete: "off",
      class: typeof q.answerValues[i] === "string" ? "blank-input wide" : "blank-input", "aria-label": T("Box {a}", { a: i + 1 }) }));
    const go = () => { const v = inputs.map((x) => normaliseInput(x.value, q)); if (v.every(Boolean)) finish(v); else inputs[v.findIndex((x) => !x)].focus(); };
    inputs.forEach((x, i) => x.addEventListener("keydown", (e) => { if (e.key === "Enter") (i < inputs.length - 1 && !inputs[i + 1].value ? inputs[i + 1].focus() : go()); }));
    setTimeout(() => inputs[0].focus(), 50);
    body.push(para(T("Fill in each box, then check."), "muted"),
      el("div", { class: "sentence blanks" }, q.parts.flatMap((p, i) => (i < inputs.length ? [p, inputs[i], q.base && typeof q.answerValues[i] === "string" ? baseTag(q) : null] : [p]))),
      q.base ? baseTip(q) : null, button(T("Check"), go, "primary"));
  } else if (q.type === "numeric") {
    const { input, check: go } = answerBox(q, finish);
    body.push(el("div", { class: q.base ? "answer has-base" : "answer" }, input, q.base ? baseTag(q) : null, q.unit ? el("span", { class: "unit" }, q.unit) : null), q.base ? baseTip(q) : null, go);
  } else if (q.type === "cloze" && q.mode === "type") {
    const { input, check: go } = answerBox(q, finish, true);
    body.push(clozeSentence(q, input), go);
  } else if (q.type === "cloze") {
    body.push(clozeSentence(q), el("div", { class: "options" }, q.options.map((o, i) => button(o.text, () => finish(i), "option"))));
  } else if (q.type === "mcq" || q.type === "spot_error") {
    if (q.type === "spot_error") body.push(para(T("Tap the one that is wrong."), "muted"));
    body.push(el("div", { class: "options" }, q.options.map((o, i) => button(o.text, () => finish(i), "option"))));
  } else if (q.type === "ordering") {
    const chosen = [];
    const list = el("ol", { class: "chosen" });
    const pool = el("div", { class: "options" });
    const redraw = () => {
      list.replaceChildren(...chosen.map((i) => el("li", {}, q.items[i])));
      fill(pool, q.items.map((t, i) => (chosen.includes(i) ? null : button(t, () => { chosen.push(i); redraw(); }, "option"))));
      if (chosen.length === q.items.length) finish([...chosen]);
    };
    body.push(para(T("Tap them in order."), "muted"), list, pool, button(T("Start again"), () => { chosen.length = 0; redraw(); }, "link"));
    redraw();
  } else if (q.type === "word_order") {
    body.push(...wordOrder(q, finish));
  } else if (q.type === "matching") {
    body.push(...(q.groups ? sorting(q, finish) : matching(q, finish)));
  }
  body.push(button(T("I don't know"), () => finish(DONT_KNOW), "idk"), back);
  screen(...body);
}

const recordOf = (q, r, ms, phase) => ({

// No feedback during the check, and no score at the end (TR-C19, approved 2026-10-03):
// the pupil sees a neutral "Let's start"; scores and weak areas appear only in "Copy results".
function readinessQ(qs, i, rows) {
  if (i >= qs.length) return readinessDone(rows);
  askQuestion(qs[i], {
    bar: progress(i + 1, qs.length), kicker: "Getting ready", title: "Primary School maths",
    onAnswer: ({ result, ms }) => {
      rows.push({ ...recordOf(qs[i], result, ms, "readiness"), template: qs[i].id, correct: result.correct });
      readinessQ(qs, i + 1, rows);
    },
  });
}

function readinessDone(rows) {
  state.readiness = { score: readiness.scoreReadiness(L0(), rows), rows, at: new Date().toISOString() };
  save();
  screen(
    header("Thank you", "Let's start"),
    para("Now we begin Form One, one small idea at a time."),
    button("See the Maths lessons", () => { state.subject = "maths"; save(); menu(); }, "primary"),
  );
}

// Lesson content is loaded one subject at a time in the installed app (subjects/<id>.js); the single-file copy has
// everything already. withSubject() shows the screen as soon as the subject is ready.
const loading = {};
function loadSubject(s) {
  if (CONTENT[s]) return Promise.resolve();
  if (!loading[s]) loading[s] = new Promise((ok, fail) => {
    const tag = document.createElement("script");
    tag.src = `subjects/${s}.js?v=${VERSIONS[s] || BUILD}`;  // the file's content fingerprint: new lessons, new address
    tag.onload = () => (CONTENT[s] ? ok() : fail(new Error("empty")));
    tag.onerror = () => { delete loading[s]; tag.remove(); fail(new Error("offline")); };
    document.head.append(tag);
  });

}
function withSubject(s, show) {

// ---- days, streak, stars, badges (all on this phone only)
const dayOf = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayNum = (s) => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 86400000);
/** Marks today as a learning day (called on every answer in a lesson). */
function recordDay() {
  state.days = state.days || [];
  const t = dayOf();
  if (state.days[state.days.length - 1] !== t) state.days.push(t);
}
/** Learning days in the current run; a run survives up to two days off in a row. 0 if the last learning day was too long ago. */
function streak() {
  const days = [...new Set(state.days || [])].map(dayNum).sort((a, b) => a - b);
  if (!days.length || dayNum(dayOf()) - days[days.length - 1] > 3) return 0;
  let n = 1;
  for (let i = days.length - 1; i > 0 && days[i] - days[i - 1] <= 3; i--) n++;
  return n;
}
/** Stars for a finished lesson: 3 if at least 80% of first tries were right, 2 if at least half, otherwise 1. */
function starsOf(r) {
  if (!r?.done) return 0;
  if (r.stars) return r.stars;
  const first = r.rows.filter((x) => x.phase === "practice" && x.attempt === 1);
  const asked = first.length || r.rows.filter((x) => x.attempt === 1).length;
  if (!asked) return 3;
  const right = (first.length ? first : r.rows.filter((x) => x.attempt === 1)).filter((x) => x.result === "right").length / asked;
  return right >= 0.8 ? 3 : right >= 0.5 ? 2 : 1;
}
const doneIn = (s) => LESSONS[s].filter((n) => state.lessons[lessonKey(s, n)]?.done);
const totalDone = () => Object.keys(SUBJECTS).reduce((t, s) => t + doneIn(s).length, 0);
const totalStars = () => Object.keys(SUBJECTS).reduce((t, s) => t + doneIn(s).reduce((u, n) => u + starsOf(state.lessons[lessonKey(s, n)]), 0), 0);

  ["streak3", "🔥", "On fire", "A 3-day streak", () => streak() >= 3],
  ["streak7", "🌟", "One week", "A 7-day streak", () => streak() >= 7],
  ["streak14", "💪", "Two weeks", "A 14-day streak", () => streak() >= 14],
  ["stars30", "⭐", "Star collector", "Collect 30 stars", () => totalStars() >= 30],
  ["stars100", "🌠", "Star shower", "Collect 100 stars", () => totalStars() >= 100],
  ["explorer", "🌈", "Explorer", "Finish a lesson in every subject of your class", () => inClass(form()).every((s) => doneIn(s).length)],

}

// ---------------------------------------------------------------- 3. teach mode
let S = "maths";                            // the subject of the lesson on screen
const C = () => state.current[S];
const L = () => CONTENT[S][C().lesson];
const N = () => C().lesson;
const LIB = () => libs[S];

/** Opens lesson n: carries on a saved, unfinished flow, otherwise starts it fresh. */
function openLesson(s, n) {
  withSubject(s, () => {
    S = s;
    document.documentElement.lang = inFrench(s) ? "fr" : "en";  // screen readers read French lessons in French
    const cur = state.current[s];
    if (cur?.lesson === n && !teach.isDone(cur.flow)) { cur.at = new Date().toISOString(); return lesson(resumable(cur.flow)); }
    state.current[s] = { lesson: n, flow: teach.startTeach(CONTENT[s][n], newSeed()), rows: [], at: new Date().toISOString() };
    save();
    lesson(state.current[s].flow);
  });
}
/** Starts lesson n again from its first card: clears its saved run (stars, answers) and any unfinished flow,
 *  after the pupil confirms. Badges already earned and other lessons are kept. */
function resetLesson(s, n) {
  if (!confirm(`Start Lesson ${n} again from the beginning?\nYour stars and saved answers for this lesson will be cleared.`)) return;
  delete state.lessons[lessonKey(s, n)];
  if (state.current[s]?.lesson === n) delete state.current[s];
  save();
  openLesson(s, n);
}
/** Review has its own saved run; the original lesson answers and stars are kept. */
function openReview(s, n) {
  withSubject(s, () => {
    S = s;
    document.documentElement.lang = inFrench(s) ? "fr" : "en";
    const cur = state.current[s];
    if (cur?.lesson === n && cur.reviewMode && !teach.isDone(cur.flow)) return lesson(resumable(cur.flow));
    const ids = state.lessons[lessonKey(s, n)]?.review || [];
    const flow = teach.startReview(CONTENT[s][n], ids, newSeed());
    if (!flow.steps.length) return menu();
    // Keep another unfinished lesson available when this short review finishes.
    state.current[s] = { lesson: n, flow, rows: [], reviewMode: true, reviewIds: ids,
      previousCurrent: cur, at: new Date().toISOString() };
    lesson(flow);
  });
}
/** A flow saved mid-feedback resumes on a question: "retry" → the fresh variant, "reveal" → the next step. */
const resumable = (flow) => (flow.phase === "retry" || flow.phase === "reveal" ? teach.nextPhase(flow) : flow);

const workedBlock = () => {
  const w = renderWorked(L().worked_example, LIB());
  return el("div", { class: "example" }, el("div", { class: "kicker" }, T("Worked example")), el("div", { class: "strong pre" }, w.problem),
    figureBox(w.figure), el("ol", {}, w.steps.map((s) => el("li", {}, s))), para(T("Answer: {a}", { a: w.answer }), "strong"));
};
const cardExample = (c) => el("div", { class: "example" }, el("div", { class: "kicker" }, T("Example")), ...c.example.map((t) => para(t)), figureBox(c.figure));
