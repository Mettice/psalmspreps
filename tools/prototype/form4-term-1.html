/** Every screen of a lesson goes through here, so the flow is saved at each step. */
function lesson(flow, previous = null) {
  C().flow = flow;
  save();
  if (teach.isDone(flow)) return results(flow);
  const Ln = L(), n = N();
  const step = flow.steps[flow.step];
  const nCards = Ln.teach.cards.length;
  const nPractice = flow.steps.filter((s) => s.kind === "practice").length;
  const practiceNo = flow.steps.slice(0, flow.step + 1).filter((s) => s.kind === "practice").length;
  const kicker = step.kind === "activity" || step.kind === "activity_reflection" ? T("Lesson {n} · Activity", { n }) : step.kind === "card" ? T("Lesson {n} · Idea {a} of {b}", { n, a: step.card + 1, b: nCards }) : T("Lesson {n} · Practice {a} of {b}", { n, a: practiceNo, b: nPractice });
  const go = (next, prev = null) => () => lesson(next, prev);
  const bar = progress(flow.step + 1, flow.steps.length);

  if (step.kind === "learn") {
    const pages = teach.renderLearn(Ln, LIB()).pages, p = pages[step.page];
    const head = header(T("Lesson {n} · Learn {a} of {b}", { n, a: step.page + 1, b: pages.length }), p.heading || T("Key words and examples"));
    const body = p.heading !== undefined ? [el("div", { class: "note" }, ...lines(p.text)), figureBox(p.figure)] : [
      p.words.length ? el("div", { class: "example" }, el("div", { class: "kicker" }, T("Key words")),
        ...p.words.map((k) => el("p", {}, el("strong", {}, k.word), " — ", k.meaning))) : null,
      p.examples.length ? el("div", { class: "example" }, el("div", { class: "kicker" }, T("Examples")), el("ul", {}, p.examples.map((x) => el("li", {}, x)))) : null,
      p.mistake ? el("div", { class: "hint" }, el("strong", {}, T("Common mistake")), para(T("Wrong: {a}", { a: p.mistake.wrong })),
        para(T("Right: {a}", { a: p.mistake.right }), "strong"), para(p.mistake.why)) : null];
    const last = step.page === pages.length - 1;
    return screen(bar, head, ...body, button(T(last ? "Now the key ideas" : "Next"), go(teach.nextPhase(flow)), "primary"), toMenu());
  }
  if (step.kind === "card" && flow.phase === "idea") {
    const c = teach.renderCard(Ln.teach.cards[step.card], LIB());
    return screen(bar, header(kicker, TITLES[S][n]), el("div", { class: "idea" }, c.idea), cardExample(c),
      button(T("I'm ready for a question"), go(teach.nextPhase(flow)), "primary"), toMenu());
  }
  if (step.kind === "card" || step.kind === "practice" || step.kind === "activity") {
    const q = teach.itemQuestion(Ln, flow, LIB(), previous);
    return askQuestion(q, {
      bar, kicker, back: toMenu(), title: step.kind === "activity" ? Ln.activity.stages[step.stage].title : q.type === "blanks" ? T("Step by step") : flow.attempt ? T("A new question") : step.kind === "card" ? T("Quick check") : T("Level {a}", { a: q.level }),
      onAnswer: ({ result, ms }) => {
        C().rows.push({ ...recordOf(q, result, ms, step.kind), card: step.kind === "card" ? Ln.teach.cards[step.card].id : "", attempt: flow.attempt + 1 });
        recordDay();
        const next = teach.answerItem(flow, result, ms);
        C().flow = next;
        save();
        if (next.phase === "reveal") return reveal(q, next, kicker, bar, result);
        if (next.phase === "retry") return retry(q, result, next, kicker, bar);
        // Teach mode only: green flash + check icon (readiness shows no right/wrong cues).
        return screen(bar, el("div", { class: "fb good flash", role: "status" }, checkIcon(), el("strong", {}, T("Correct!")),
          // 517 typed for 51₇: right, with a gentle word that the base is not typed
          result.baseTyped ? para(`Well done. You don't need to type the base: ${q.answer} is enough (the small ${q.base} only shows it is base ${q.base}).`) : null),
          button(T("Next"), go(next), "primary"), toMenu());
      },
    });
  }
  if (step.kind === "worked_example") {
    return screen(bar, header(T("Lesson {n} · Worked example", { n }), T("Follow each step")), workedBlock(),
      button(T(Ln.activity ? "Now try the activity" : Ln.paper_task ? "Now write" : "Now practise"), go(teach.nextPhase(flow)), "primary"), toMenu());
  }
  if (step.kind === "paper") return paperTask(flow, bar);
  if (step.kind === "activity_reflection") return paperTask(flow, bar, Ln.activity.reflection, "activityPaper");
  if (step.kind === "note") {
    return screen(bar, header(T("Lesson {n} · Summary", { n }), TITLES[S][n]), el("div", { class: "note" }, ...lines(Ln.note.text)),
      button(T("Finish"), go(teach.nextPhase(flow)), "primary"));
  }
}

/**
 * Writing lessons: the task → the pupil writes in the exercise book → "I've written it" → model answer and a
 * self-check list. The ticks are kept for the parent summary only; the app does not mark the writing (TR-E25).
 */
function paperTask(flow, bar, task = L().paper_task, key = "paper") {
  const p = teach.renderPaper({ paper_task: task }, LIB());
  const ticks = C()[key]?.ticks || p.checklist.map(() => false);
  const write = () => screen(bar, header(T("Your turn to write"), T("Write in your exercise book")),
    el("div", { class: "idea pre" }, p.prompt),
    para(T("Take your time. When you have finished writing, tap the button."), "muted"),
    button(T("I've written it"), () => { C()[key] = { written: true, ticks }; save(); review(); }, "primary"), toMenu());
  const review = () => {
    const boxes = p.checklist.map((item, i) => {
      const box = el("input", { type: "checkbox", id: `tick${i}` });
      box.checked = !!ticks[i];
      box.addEventListener("change", () => { ticks[i] = box.checked; C()[key] = { written: true, ticks }; save(); });
      return el("label", { class: "tickrow", for: `tick${i}` }, box, el("span", {}, item));
    });
    screen(bar, header(T("Your turn to write"), T("Compare with this example")),
      el("div", { class: "example" }, el("div", { class: "kicker" }, T("An example answer")), ...p.model.map((m) => para(m))),
      para(T("Look at your own writing. Tick each thing you did."), "strong"),
      el("div", { class: "ticks" }, boxes),
      para(T("There is no score for writing. A grown-up can look at your exercise book."), "muted"),
      button(T("Done"), () => lesson(teach.nextPhase(flow)), "primary"));
  };
  return C()[key]?.written ? review() : write();
}

/**
 * First miss, then a fresh variant (asked step by step when the template has a scaffold). Since 2026-10-19:
 *  - "I don't know": the hint, then this question's own working, one step per tap, then a new question;
 *  - a wrong answer: what the mistake was (a known misconception when the answer matches one), then for computed
 *    questions "one like it": another variant of the same shape with its working, so the example fits the question.
 */
function retry(q, result, flow, kicker, bar) {
  const step = flow.steps[flow.step];
  const again = (seen) => button(T("Try a new question"), () => lesson(teach.nextPhase(flow), seen), "primary");
  const workingBox = (title, x, list) => el("div", { class: "example" }, el("div", { class: "kicker" }, title), el("div", { class: "strong pre" }, x.prompt), figureBox(x.figure), list);
  if (result.dontKnow && q.solution?.length) {
    const list = el("ol", { "aria-live": "polite" }), tail = el("div", {});
    let shown = 0;
    const more = () => {
      list.append(el("li", {}, q.solution[shown++]));
      fill(tail, [shown < q.solution.length ? button(T("Show the next step"), more, "primary") : again(q)]);
    };
    screen(bar, header(kicker, T("Let's try again")),
      el("div", { class: "fb soft", role: "status" }, el("strong", {}, T("That's fine. Let's look at it together."))),
      hintBlock(q), workingBox(T("Here is how to do this one"), q, list), tail, toMenu());
    return more();
  }
  const wrongPairs = result.wrongPairs?.length
    ? para(T(result.wrongPairs.length === 1 ? "This one is not right yet: {a}." : "These are not right yet: {a}.", { a: result.wrongPairs.map((i) => q.left[i]).join(", ") })) : null;
  const box = result.dontKnow
    // "I don't know" on a question without written working: the hint and the worked example (spec §4)
    ? el("div", { class: "fb soft", role: "status" }, el("strong", {}, T("That's fine. Let's look at it together.")))
    : el("div", { class: "fb bad shake", role: "status" }, el("strong", {}, T("✗ Not quite")),
      result.misconception?.explain ? para(result.misconception.explain) : wrongPairs || para(T("Look at the example again, then try a new question.")));
  const like = result.dontKnow ? null : teach.exampleLike(L(), flow, LIB(), q);
  const help = like ? [workingBox(T("Here is one like it"), like, el("ol", {}, like.solution.map((s) => el("li", {}, s))))]
    : step.kind === "card" ? [result.dontKnow ? hintBlock(q) : null, cardExample(teach.renderCard(L().teach.cards[step.card], LIB()))]
    : result.dontKnow ? [hintBlock(q), workedBlock()] : [];
  screen(bar, header(kicker, T("Let's try again")), box, ...help, again(like ? [q, like] : q), toMenu());
}

/** Second miss: the correct answer with full working, then move on (marked "needs review"). */
function reveal(q, flow, kicker, bar, result) {
  const shown = q.type === "matching" ? T("Here are the right answers.")
    : T("The answer is: {a}", { a: `${q.answer}${q.base ? LIB().sub(q.base) : ""}${q.unit ? " " + q.unit : ""}` });  // 51₇, not 51
  screen(bar, header(kicker, T("Here is how to do it")),
    el("div", { class: result.dontKnow ? "fb soft" : "fb bad shake", role: "status" }, el("strong", {}, shown)),
    el("div", { class: "example" }, el("div", { class: "kicker" }, T("Full working")), el("ol", {}, q.solution.map((s) => el("li", {}, s)))),
    para(T("We will come back to this one later."), "muted"),
    button(T("Continue"), () => lesson(teach.nextPhase(flow)), "primary"), toMenu());
}

// ---------------------------------------------------------------- 4. results + copy
/** A simple CSS confetti burst: each piece gets a direction, spin, colour and delay. Hidden under reduced motion. */
function confetti() {
  const colours = ["#1f6f4a", "#e0a526", "#2f6fd6", "#d0473b", "#7c4dbd", "#2aa198"];
  const box = el("div", { class: "confetti", "aria-hidden": "true" });
  for (let i = 0; i < 28; i++) {
    const angle = (Math.PI * 2 * i) / 28 + Math.random() * 0.3, dist = 90 + Math.random() * 90;
    box.append(el("i", { style: `--x:${Math.round(Math.cos(angle) * dist)}px;--y:${Math.round(Math.sin(angle) * dist - 40)}px;` +
      `--r:${Math.round(Math.random() * 540 - 270)}deg;--c:${colours[i % colours.length]};--d:${Math.round(Math.random() * 120)}ms` }));
  }
  return box;
}

const count = (rows, k) => rows.filter((r) => r.result === k).length;
const row = (x) => `${x.phase}\t${x.card ? x.card + "#" + x.attempt : x.attempt ? "#" + x.attempt : ""}\t${x.id}\tL${x.level}\t${x.result}\t${x.seconds}s\t${x.misconception}`;
const TABLE_HEAD = "phase\tcard#try\ttemplate\tlevel\tresult\ttime\tmisconception";

function readinessText() {
  const r = state.readiness?.score;
  return [`Readiness (not shown to the pupil): ${r ? `${r.right}/${r.asked} (${r.percent}%) · ${state.readiness.at.slice(0, 10)}` : "not done"}`,
    ...(r ? Object.values(r.areas).map((a) => `  ${a.name}: ${a.right}/${a.asked}${a.weak ? " · WEAK" : ""}`) : [])];
}
function lessonText(s, n, r) {
  const cards = r.rows.filter((x) => x.phase === "card"), practice = r.rows.filter((x) => x.phase === "practice");
  const secs = r.rows.reduce((t, x) => t + x.seconds, 0);
  const out = [`${subjectName(s)} Lesson ${n} (${TITLES[s][n]}) · ${r.at.slice(0, 16).replace("T", " ")} · ${Math.round(secs)}s · "I don't know" ${count(r.rows, "idk")}`,
    `  cards: ${count(cards, "right")} right, ${count(cards, "wrong")} wrong, ${count(cards, "idk")} IDK · practice: ${count(practice, "right")} right, ${count(practice, "wrong")} wrong, ${count(practice, "idk")} IDK`,
    `  needs review (missed twice): ${r.review.join(", ") || "none"}`];
  if (r.reviewRows?.length) out.push(`  targeted review: ${count(r.reviewRows, "right")} right, ${count(r.reviewRows, "wrong")} wrong, ${count(r.reviewRows, "idk")} IDK`);
  const activity = r.rows.filter((x) => x.phase === "activity");
  if (activity.length) out.push(`  subject activity: ${count(activity, "right")} right, ${count(activity, "wrong")} wrong, ${count(activity, "idk")} IDK`);
  if (r.activityPaper) {
    const items = CONTENT[s][n].activity.reflection.checklist;
    out.push(`  activity writing (not marked; self-check by the pupil): ${r.activityPaper.ticks.filter(Boolean).length} of ${items.length} ticked`,
      ...items.map((t, i) => `    ${r.activityPaper.ticks[i] ? "[x]" : "[ ]"} ${t}`));
  }
  if (r.paper) {
    const items = teach.renderPaper(CONTENT[s][n], libs[s]).checklist;
    out.push(`  paper task (not marked; self-check by the pupil): ${r.paper.ticks.filter(Boolean).length} of ${items.length} ticked`,
      ...items.map((t, i) => `    ${r.paper.ticks[i] ? "[x]" : "[ ]"} ${t}`));
  }
  return out;
}
const stamp = () => `Form One prototype ${BUILD} · ${new Date().toISOString().slice(0, 16).replace("T", " ")}`;

function lessonResultsText(s, n) {
  const r = state.lessons[lessonKey(s, n)];
  return [stamp(), ...readinessText(), ...lessonText(s, n, r), "", TABLE_HEAD, ...r.rows.map(row),
    ...(r.reviewRows?.length ? ["", "Targeted review", TABLE_HEAD, ...r.reviewRows.map(row)] : [])].join("\n");
}
function allResultsText() {
  const out = [stamp(), ...readinessText()];
  const tables = [...(state.readiness?.rows || []).map(row)];
  for (const s of Object.keys(SUBJECTS)) {
    const done = LESSONS[s].filter((n) => state.lessons[lessonKey(s, n)]?.done);
    out.push(`${subjectName(s)}: lessons done ${done.length} of ${LESSONS[s].length}`, ...done.flatMap((n) => lessonText(s, n, state.lessons[lessonKey(s, n)])));
    tables.push(...done.flatMap((n) => state.lessons[lessonKey(s, n)].rows.map(row)));
    for (const n of done) {
      const rows = state.lessons[lessonKey(s, n)].reviewRows;
      if (rows?.length) tables.push(`${subjectName(s)} Lesson ${n} · Targeted review`, ...rows.map(row));
    }
  }
  return [...out, "", TABLE_HEAD, ...tables].join("\n");
}

async function copyText(text, status, details = null, area = null) {
  try { await navigator.clipboard.writeText(text); status.textContent = "Copied. Paste it into WhatsApp or a message."; }
  catch {
    if (details && area) { details.open = true; area.select(); document.execCommand("copy"); status.textContent = "Copied (or select the text below and copy it)."; }
    else status.textContent = "Could not copy on this phone.";
  }
}

function results(flow) {
  const s = S, n = N(), Ln = L();
  const review = teach.needsReview(flow).map((x) => (x.kind === "card" ? Ln.teach.cards[x.card].id : x.template));
  if (C().reviewMode) {
    const current = C(), record = state.lessons[lessonKey(s, n)];
    record.review = [...new Set([...record.review.filter((id) => !current.reviewIds.includes(id)), ...review])];
    record.reviewRows = [...(record.reviewRows || []), ...current.rows];
    if (current.previousCurrent) state.current[s] = current.previousCurrent;
    else delete state.current[s];
    save();
    return showResults(s, n, flow.steps.length, true);
  }
  // The latest finished run of a lesson replaces the previous one.
  const record = { done: true, at: new Date().toISOString(), rows: C().rows, review, ...(C().paper ? { paper: C().paper } : {}), ...(C().activityPaper ? { activityPaper: C().activityPaper } : {}) };
  record.stars = starsOf(record);
  state.lessons[lessonKey(s, n)] = record;
  delete state.current[s];
  save();
  return showResults(s, n, flow.steps.filter((x) => x.kind === "card" || x.kind === "practice" || x.kind === "activity").length);
}

function showResults(s, n, completed, reviewed = false) {
  const Ln = CONTENT[s][n], record = state.lessons[lessonKey(s, n)];
  const text = lessonResultsText(s, n);
  const area = el("textarea", { readonly: "", rows: "10", "aria-label": "Results" });
  // The text holds the readiness score and weak areas, so it stays folded away from the pupil (TR-C30).
  const details = el("details", { class: "grownup" }, el("summary", {}, "Show the text (for a grown-up)"), area);
  area.value = text;
  const status = para("", "muted");
  const next = nextLesson(s);
  const badges = newBadges(), st = streak();
  screen(confetti(), el("div", { class: "done" }, el("div", { class: "done-title" }, reviewed ? T("Review complete") : T("Lesson {n} done", { n })),
    el("div", { class: "done-stars", "aria-label": `${record.stars} of 3 stars` }, [1, 2, 3].map((k) => el("span", { class: k <= record.stars ? "star on" : "star", style: `--k:${k}` }, "★"))),
    para(reviewed ? T("You practised the questions that needed another look.") : Ln.paper_task || Ln.activity?.reflection ? T("You completed {a} questions and a writing task.", { a: completed }) : T("You completed {a} questions.", { a: completed }), "done-sub"),
    st ? para(T("🔥 {a}-day streak", { a: st }), "done-streak") : null),
    badges.map(([, icon, name]) => el("div", { class: "new-badge" }, el("span", { "aria-hidden": "true" }, icon), el("strong", {}, T("New badge: {a}", { a: name })))),
    reviewed ? para(T(record.review.length ? "Some questions still need practice. You can try them again." : "You answered every review item correctly, with help where needed."), "muted") : null,
    record.review.length ? button(T("Practise what was difficult"), () => openReview(s, n), "primary") : null,
    next ? button(T("Next: Lesson {a}", { a: next }), () => openLesson(s, next), record.review.length ? "" : "primary") : para(T("You have done every {a} lesson. Well done!", { a: subjectName(s) }), "strong"),
    button(T("Back to the lessons"), menu, next ? "" : "primary"),
    button(T("All subjects"), home, "link"),
    para("For a grown-up: these results stay on this phone until you copy them.", "muted"),
    button("Copy results", () => copyText(text, status, details, area), ""), status, details);
}

// Start-up is at the end of review.js (pupils: the lesson menu; teachers with ?review: the review list).

// Teacher review mode (2026-10-17): open the app with ?review in the link. A teacher sees every lesson with its answers
// shown, marks each part ✓ OK or ✗ Problem with an optional comment, then sends the review as one message
// (WhatsApp or any app, through the phone's share sheet, or copied). Marks are kept on this phone only; nothing is sent
// unless the teacher sends it. Pupils never see this mode. Every mark carries the item's id, so fixes are exact.
/* global ENGINE, CONTENT, TITLES, LESSONS, SUBJECTS, BUILD, MODE, subjectName */

const REVIEW_KEY = "psalmspreps-review-v1";
const loadReview = () => {
  try { return { name: "", marks: {}, ...JSON.parse(localStorage.getItem(REVIEW_KEY)) }; } catch { return { name: "", marks: {} }; }
};
const review = loadReview();
const saveReview = () => { try { localStorage.setItem(REVIEW_KEY, JSON.stringify(review)); } catch { /* still works, just forgets */ } };
const markKey = (s, n, id) => `${s}:${n}:${id}`;
let RS = Object.keys(SUBJECTS)[0];  // subject shown in review mode

/** Every reviewable part of a lesson, in teaching order: note, cards (with their check), worked example, practice. */
function reviewItems(s, n) {
  const l = CONTENT[s][n];
  const items = [...(l.learn ? [{ id: "learn", kind: "Learn screens" }] : []), { id: "note", kind: "Note (summary)" }];
  for (const c of l.teach.cards) items.push({ id: c.id, kind: "Teach card", card: c });
  items.push({ id: "worked", kind: "Worked example" });
  for (const stage of l.activity?.stages || []) items.push({ id: stage.question.id, kind: `Subject activity · ${stage.title}`, tpl: stage.question });
  if (l.activity?.reflection) items.push({ id: "activity-writing", kind: "Activity writing (self-check only)" });
  if (l.paper_task) items.push({ id: "paper", kind: "Writing task" });
  for (const t of l.questions || []) items.push({ id: t.id, kind: `Practice · level ${t.level}`, tpl: t });
  return items;
}
const lessonCounts = (s, n) => {
  const items = reviewItems(s, n), marks = items.map((it) => review.marks[markKey(s, n, it.id)]).filter(Boolean);
  return { total: items.length, done: marks.length, problems: marks.filter((m) => !m.ok).length };
};

/** One generated question with its answer and working shown. */
function shownQuestion(q, tpl) {
  const out = [el("div", { class: "prompt pre" }, q.prompt || ""), figureBox(q.figure)];
  if (q.sentence) out.push(el("div", { class: "sentence" }, q.sentence));
  if (q.options) {
    out.push(el("ul", { class: "rv-options" }, q.options.map((o, i) => el("li", { class: i === q.correctIndex ? "rv-right" : "" },
      `${i === q.correctIndex ? (q.type === "spot_error" ? "✗ (the wrong one) " : "✓ ") : "• "}${o.text}`,
      o.explain && i !== q.correctIndex ? el("div", { class: "muted" }, `Feedback if chosen: ${o.explain}`) : null))));
  } else if (q.type === "blanks") {
    out.push(para(`Completed working: ${q.answer}`, "strong"));
  } else if (q.type === "numeric") {
    out.push(para(`Answer: ${q.answer}${q.unit ? " " + q.unit : ""}`, "strong"),
      ...q.misconceptions.map((m) => para(`If the pupil types ${m.value}: ${m.explain}`, "muted")));
  } else if (q.type === "cloze") {
    out.push(para(`Accepted answer: ${q.accept.join(" or ")}`, "strong"), ...q.misconceptions.map((m) => para(`If the pupil types ${m.value}: ${m.explain}`, "muted")));
  } else if (q.type === "ordering" || q.type === "word_order") {
    out.push(para(`Shown mixed up: ${q.items.join(" · ")}`, "muted"), para(`Right answer: ${q.answer}`, "strong"));
  }
  out.push(el("div", { class: "example" }, el("div", { class: "kicker" }, "Working shown after a second miss"), el("ol", {}, q.solution.map((x) => el("li", {}, x)))));
  out.push(para(tpl.review === "rule" ? "Answer computed by the app’s rules." : "Answer written by a person: please check it.", "rv-tag"));
  return out;
}

/** The content of one item, generated with `seed` (a new seed shows another example of the same question). */
function itemBody(s, n, it, seed) {
  const l = CONTENT[s][n], lib = libs[s];
  if (it.id === "note") return [el("div", { class: "note" }, ...lines(l.note.text))];
  if (it.id === "learn") {
    return teach.renderLearn(l, lib).pages.flatMap((p) => (p.heading !== undefined ? [el("div", { class: "kicker" }, p.heading), el("div", { class: "note" }, ...lines(p.text)), figureBox(p.figure)] : [
      el("div", { class: "kicker" }, "Key words"), ...p.words.map((k) => para(`${k.word} — ${k.meaning}`)), el("div", { class: "kicker" }, "Examples"), el("ul", {}, p.examples.map((x) => el("li", {}, x))),
      ...(p.mistake ? [el("div", { class: "kicker" }, "Common mistake"), para(`Wrong: ${p.mistake.wrong}`), para(`Right: ${p.mistake.right}`, "strong"), para(p.mistake.why)] : [])]));
  }
  if (it.id === "worked") {
    const w = renderWorked(l.worked_example, lib);
    return [el("div", { class: "strong pre" }, w.problem), figureBox(w.figure), el("ol", {}, w.steps.map((x) => el("li", {}, x))), para(`Answer: ${w.answer}`, "strong")];
  }
  if (it.id === "paper" || it.id === "activity-writing") {
    const p = teach.renderPaper(it.id === "paper" ? l : { paper_task: l.activity.reflection }, lib);
    return [el("div", { class: "pre" }, p.prompt), el("div", { class: "kicker" }, "Model answer"), ...p.model.map((m) => para(m)),
      el("div", { class: "kicker" }, "Self-check list"), el("ul", {}, p.checklist.map((c) => el("li", {}, c)))];
  }
  if (it.card) {
    const c = teach.renderCard(it.card, lib), tpl = teach.cardCheckTemplate(l, it.card);
    return [el("div", { class: "idea" }, c.idea), cardExample(c), el("div", { class: "kicker" }, `Check question (${tpl.id})`),
      ...shownQuestion(template.instantiate(tpl, seed, lib, n), tpl)];
  }
  return shownQuestion(template.instantiate(it.tpl, seed, lib, n), it.tpl);
}

function reviewItem(s, n, it) {
  const key = markKey(s, n, it.id);
  let seed = 1;
  const box = el("section", { class: "rv-item" });
  const draw = () => {
    const m = review.marks[key];
    const note = el("textarea", { rows: "2", class: "rv-note", placeholder: "Comment (what is wrong, or the correction)", "aria-label": `Comment on ${it.id}` });
    note.value = m?.note || "";
    const mark = (ok) => { review.marks[key] = { ok, note: note.value.trim(), at: new Date().toISOString() }; saveReview(); draw(); };
    note.addEventListener("change", () => { if (review.marks[key]) { review.marks[key].note = note.value.trim(); saveReview(); } });
    box.className = `rv-item${m ? (m.ok ? " rv-is-ok" : " rv-is-bad") : ""}`;
    fill(box, [
      el("div", { class: "rv-head" }, el("span", { class: "kicker" }, it.kind), el("code", {}, it.id)),
      ...itemBody(s, n, it, seed),
      it.tpl || it.card ? button("Show another example", () => { seed += 1; draw(); }, "link") : null,
      note,
      el("div", { class: "rv-buttons" }, button("✓ OK", () => mark(true), m?.ok === true ? "primary" : ""), button("✗ Problem", () => mark(false), m?.ok === false ? "rv-bad-on" : "")),
      m ? para(m.ok ? "Marked OK." : "Marked as a problem.", "muted") : null,
    ]);
  };
  draw();
  return box;
}

function reviewLesson(s, n) {
  if (!CONTENT[s]) return withSubject(s, () => reviewLesson(s, n));
  const c = lessonCounts(s, n);
  screen(header(`Review · ${subjectName(s)} · Lesson ${n}`, TITLES[s][n]),
    para(`${c.done} of ${c.total} parts checked${c.problems ? ` · ${c.problems} problem${c.problems === 1 ? "" : "s"}` : ""}. Answers are shown. Mark each part, and add a comment when something is wrong.`, "muted"),
    reviewItems(s, n).map((it) => reviewItem(s, n, it)),
    button("Back to the review list", reviewHome, "primary"));
}

/** The message a teacher sends: every problem with its comment, then the OKs counted per lesson. */
function reviewText() {
  const out = [`Psalms Preps teacher review · ${review.name || "(name not given)"} · app ${BUILD} · ${new Date().toISOString().slice(0, 16).replace("T", " ")}`];
  // In the installed app only the subjects opened so far are on the phone: skip the others (sendReview loads every
  // subject that has marks before building the text).
  for (const s of Object.keys(SUBJECTS).filter((x) => CONTENT[x])) for (const n of LESSONS[s]) {
    const items = reviewItems(s, n).map((it) => [it, review.marks[markKey(s, n, it.id)]]).filter(([, m]) => m);
    if (!items.length) continue;
    const ok = items.filter(([, m]) => m.ok);
    out.push("", `${subjectName(s)} Lesson ${n} (${TITLES[s][n]}): ${items.length} of ${reviewItems(s, n).length} checked, ${items.length - ok.length} problem(s)`);
    for (const [it, m] of items) if (!m.ok || m.note) out.push(`  ${m.ok ? "✓" : "✗"} ${s}:${n}:${it.id}${m.note ? ` — ${m.note}` : ""}`);
  }
  return out.join("\n");
}

async function sendReview(status) {
  const marked = [...new Set(Object.keys(review.marks).map((k) => k.split(":")[0]))].filter((s) => SUBJECTS[s]);
  try { await loadAll(marked); } catch { status.textContent = "Connect to the internet once, then send again."; return; }
  const text = reviewText();
  try {
    if (navigator.share) { await navigator.share({ title: "Teacher review", text }); status.textContent = "Shared."; return; }
  } catch { /* cancelled or not allowed: fall back to copying */ }
  try { await navigator.clipboard.writeText(text); status.textContent = "Copied. Paste it into WhatsApp or a message to Dion."; }
  catch { status.textContent = "Could not copy: select the text below and copy it."; }
}

function reviewHome() {
  if (!CONTENT[RS]) return withSubject(RS, reviewHome);
  // the subjects this teacher has marked are loaded too, so the review text below is complete
  const missing = [...new Set(Object.keys(review.marks).map((k) => k.split(":")[0]))].find((s) => SUBJECTS[s] && !CONTENT[s]);
  if (missing) return withSubject(missing, reviewHome);
  document.documentElement.lang = "en";
  const name = el("input", { type: "text", class: "rv-name", placeholder: "Your name", "aria-label": "Your name", autocomplete: "name" });
  name.value = review.name;
  name.addEventListener("change", () => { review.name = name.value.trim(); saveReview(); });
  const tabs = el("div", { class: "subjects", role: "tablist" }, Object.keys(SUBJECTS).map((id) =>
    el("button", { type: "button", role: "tab", "aria-selected": String(id === RS), class: `subject${id === RS ? " on" : ""}`, onclick: () => { RS = id; reviewHome(); } }, subjectName(id))));
  const rows = LESSONS[RS].map((n) => {
    const c = lessonCounts(RS, n);
    const mark = c.done === c.total ? (c.problems ? "!" : "✓") : c.done ? "…" : String(n);
    return el("button", { type: "button", class: `lesson${c.done === c.total && !c.problems ? " is-done" : ""}`, onclick: () => reviewLesson(RS, n) },
      el("span", { class: "mark", "aria-hidden": "true" }, mark),
      el("span", { class: "lt" }, el("span", { class: "ln" }, `Lesson ${n}`), TITLES[RS][n],
        el("span", { class: "sub" }, `${c.done} of ${c.total} checked${c.problems ? ` · ${c.problems} problem${c.problems === 1 ? "" : "s"}` : ""}`)));
  });
  const status = para("", "muted");
  const area = el("textarea", { readonly: "", rows: "8", "aria-label": "Review text" });
  area.value = reviewText();
  screen(header("Teacher review", "Check the lessons"),
    para("Thank you for reviewing. Open a lesson: every answer is shown. Mark each part ✓ OK or ✗ Problem, and write a comment when something is wrong. Your marks stay on this phone until you send them.", "muted"),
    name, tabs, el("div", { class: "lessons" }, rows),
    button("Send my review", () => sendReview(status), "primary"), status,
    el("details", { class: "grownup" }, el("summary", {}, "Show the review text"), area),
    button("Open the app as a pupil", () => { location.href = location.pathname; }, "link"));
}

// Start: teachers open the link with ?review; everyone else gets the pupil's lesson menu.
if (new URLSearchParams(location.search).has("review")) reviewHome(); else home();

</script>
