nuse.","steps":["c² = {a}² + {b}² = {a * a} + {b * b} = {a * a + b * b}.","c = √{a * a + b * b} = {10} cm."],"answer":"c = {10} cm","checks":[],"figure":"rightTriFig(a, b, 'c')"},"teach":{"cards":[{"id":"c31-1","status":"draft","idea":"Hypotenuse² = (one side)² + (other side)².","vars":{"a":3,"b":4,"c":5},"example":["{a}² + {b}² = {a * a} + {b * b} = {c * c} = {c}²"],"checks":[],"figure":"rightTriFig(a, b, c)","check":{"ref":"m2-31-hyp"}},{"id":"c31-2","status":"draft","idea":"To find a shorter side, subtract: a² = c² − b².","vars":{"a":5,"b":12,"c":13},"example":["{c}² − {b}² = {c * c - b * b} = {a}²"],"checks":[],"check":{"ref":"m2-31-leg"}},{"id":"c31-3","status":"draft","idea":"Converse: if the squares fit c² = a² + b², the triangle is right-angled.","vars":{"a":8,"b":15,"c":17},"example":["{a}² + {b}² = {c}², so it is right-angled."],"checks":[],"check":{"id":"m2-31-conv-card","type":"mcq","level":1,"review":"rule","sources":["triangles"],"vars":{"i":{"int":[0,11]},"k":{"int":[0,1]},"p":{"expr":"tA(i)"},"q":{"expr":"tB(i)"},"r":{"expr":"tC(i) + k"}},"prompt":"A triangle has sides {p} cm, {q} cm and {r} cm. Is it right-angled?","correct":"{isRightTriangle(p, q, r) ? 'Yes' : 'No'}","distractors":[{"text":"Yes","misconception":"w"},{"text":"No","misconception":"w"}],"misconceptions":[{"id":"w","explain":"Compare {r}² = {r * r} with {p}² + {q}² = {p * p + q * q}."}],"solution":["Longest side: {r}. {r}² = {r * r}; {p}² + {q}² = {p * p + q * q}.","{p * p + q * q == r * r ? 'They are equal: it is right-angled.' : 'They are not equal: it is not right-angled.'}","So the answer is {answer}."],"min_distractors":1}}]},"questions":[{"id":"m2-31-hyp","type":"numeric","level":1,"review":"rule","sources":["triangles"],"vars":{"i":{"int":[0,11]},"a":{"expr":"tA(i)"},"b":{"expr":"tB(i)"},"c":{"expr":"tC(i)"}},"prompt":"Find the hypotenuse of this right-angled triangle.","answer":"c","misconceptions":[{"id":"added","wrong":"a + b","explain":"Square the sides first, add, then take the square root."},{"id":"noroot","wrong":"a * a + b * b","explain":"That is c². Take the square root."}],"solution":["c² = {a}² + {b}² = {a * a} + {b * b} = {c * c}.","c = √{c * c} = {answer} cm."],"figure":"rightTriFig(a, b, '?')","unit":"cm"},{"id":"m2-31-leg","type":"numeric","level":1,"review":"rule","sources":["triangles"],"vars":{"i":{"int":[0,11]},"a":{"expr":"tA(i)"},"b":{"expr":"tB(i)"},"c":{"expr":"tC(i)"}},"prompt":"A right-angled triangle has hypotenuse {c} cm and one side {a} cm. Find the other side.","answer":"b","misconceptions":[{"id":"added","wrong":"c * c + a * a","explain":"For a shorter side, subtract the squares."},{"id":"sub","wrong":"c - a","explain":"Square first: {c}² − {a}²."},{"id":"noroot","wrong":"c * c - a * a","explain":"That is b². Take the square root."}],"solution":["b² = {c}² − {a}² = {c * c} − {a * a} = {b * b}.","b = √{b * b} = {answer} cm."],"figure":"rightTriFig(a, '?', c)","unit":"cm"},{"id":"m2-31-conv","type":"mcq","level":2,"review":"rule","sources":["triangles"],"vars":{"i":{"int":[0,11]},"k":{"int":[0,1]},"p":{"expr":"tA(i)"},"q":{"expr":"tB(i)"},"r":{"expr":"tC(i) + k"}},"prompt":"A triangle has sides {p} cm, {q} cm and {r} cm. Is it right-angled?","correct":"{isRightTriangle(p, q, r) ? 'Yes' : 'No'}","distractors":[{"text":"Yes","misconception":"w"},{"text":"No","misconception":"w"}],"misconceptions":[{"id":"w","explain":"Compare {r}² = {r * r} with {p}² + {q}² = {p * p + q * q}."}],"solution":["Longest side: {r}. {r}² = {r * r}; {p}² + {q}² = {p * p + q * q}.","{p * p + q * q == r * r ? 'They are equal: it is right-angled.' : 'They are not equal: it is not right-angled.'}","So the answer is {answer}."],"min_distractors":1},{"id":"m2-31-ladder","type":"numeric","level":3,"review":"rule","sources":["triangles"],"vars":{"i":{"int":[0,11]},"a":{"expr":"tA(i)"},"b":{"expr":"tB(i)"},"c":{"expr":"tC(i)"}},"prompt":"A ladder {c} m long leans against a wall. Its foot is {a} m from the wall. How high up the wall does it reach? ind its height.","answer":"2 * A / b","misconceptions":[{"id":"nodouble","wrong":"A / b","explain":"Multiply the area by {2} first: height = {2} × area ÷ base."}],"solution":["Area = ½ × base × height, so height = {2} × area ÷ base.","{2} × {A} ÷ {b} = {answer} cm."],"where":["(b * h) % 2 == 0"],"unit":"cm"}}]},"questions":[{"id":"m2-32-area","type":"numeric","level":1,"review":"rule","sources":["triangles"],"vars":{"b":{"int":[3,20]},"h":{"int":[2,18]}},"prompt":"A triangle has a base of {b} cm and a height of {h} cm. Find its area.","answer":"b * h / 2","misconceptions":[{"id":"nohalf","wrong":"b * h","explain":"Do not forget the ½: a triangle is half of a rectangle."}],"solution":["Area = ½ × {b} × {h}.","= {answer} cm²."],"where":["(b * h) % 2 == 0"],"unit":"cm²"},{"id":"m2-32-right","type":"numeric","level":1,"review":"rule","sources":["triangles"],"vars":{"i":{"int":[0,11]},"a":{"expr":"tA(i)"},"b":{"expr":"tB(i)"},"c":{"expr":"tC(i)"}},"prompt":"A right-angled triangle has sides {a} cm and {b} cm next to the right angle. Find its area.","answer":"a * b / 2","misconceptions":[{"id":"nohalf","wrong":"a * b","explain":"Take half: ½ × {a} × {b}."},{"id":"hyp","wrong":"a * c / 2","explain":"Use the two sides next to the right angle, not the hypotenuse."}],"solution":["Area = ½ × {a} × {b} = {answer} cm²."],"unit":"cm²"},{"id":"m2-32-height","type":"numeric","level":2,"review":"rule","sources":["triangles"],"vars":{"b":{"int":[4,16]},"h":{"int":[3,15]},"A":{"expr":"b * h / 2"}},"prompt":"A triangle has an area of {A} cm² and a base of {b} cm. Find its height.","answer":"2 * A / b","misconceptions":[{"id":"nodouble","wrong":"A / b","explain":"Multiply the area by {2} first: height = {2} × area ÷ base."}],"solution":["Area = ½ × base × height, so height = {2} × area ÷ base.","{2} × {A} ÷ {b} = {answer} cm."],"where":["(b * h) % 2 == 0"],"unit":"cm"},{"id":"m2-32-house","type":"numeric","level":3,"review":"rule","sources":["triangles"],"vars":{"l":{"int":[6,14]},"w":{ l(a, b, true, false)}"],"checks":[],"check":{"ref":"m2-39-write"}},{"id":"c39-2","status":"draft","idea":"An interval can be read back as an inequality.","vars":{"a":-3,"b":2},"example":["{interval(a, b, false, true)} → {intervalIneq(a, b, false, true)}"],"checks":[],"check":{"ref":"m2-39-read"}},{"id":"c39-3","status":"draft","idea":"∞ always has a round bracket.","vars":{"a":3},"example":["x ≥ {a} → {interval(a, 'inf', true, false)}"],"checks":[],"check":{"id":"m2-39-inf-card","type":"mcq","level":1,"review":"rule","sources":["intervals"],"vars":{"a":{"int":[-8,8]},"ca":{"pick":[true,false]}},"prompt":"Write x {ca ? '≥' : '>'} {a} as an interval.","correct":"{interval(a, 'inf', ca, false)}","distractors":[{"text":"{ca ? '[' : '('}{a}, +∞]","misconception":"inf"},{"text":"{interval('-inf', a, false, ca)}","misconception":"dir"},{"text":"{interval(a, 'inf', !ca, false)}","misconception":"end"}],"misconceptions":[{"id":"inf","explain":"∞ is never reached: it always gets a round bracket."},{"id":"dir","explain":"x is bigger than {a}: the interval goes towards +∞."},{"id":"end","explain":"{ca ? '≥ includes the end: [' : '> leaves the end out: ('}."}],"solution":["x goes from {a} up to +∞; ∞ always gets a round bracket.","So {answer}."]}}]},"questions":[{"id":"m2-39-write","type":"mcq","level":1,"review":"rule","sources":["intervals"],"vars":{"a":{"int":[-6,3]},"w":{"int":[2,7]},"b":{"expr":"a + w"},"ca":{"pick":[true,false]},"cb":{"pick":[true,false]}},"prompt":"Write {intervalIneq(a, b, ca, cb)} as an interval.","correct":"{interval(a, b, ca, cb)}","distractors":[{"text":"{interval(a, b, !ca, cb)}","misconception":"w"},{"text":"{interval(a, b, ca, !cb)}","misconception":"w"},{"text":"{interval(a, b, !ca, !cb)}","misconception":"w"}],"misconceptions":[{"id":"w","explain":"≤ gives a square bracket (end included); \u003c gives a round bracket (end left out)."}],"solution":["{ca ? 'The first end is included: [' : 'The first end is not included: ('}.","{cb ? 'The second en erest"}],"note":{"status":"draft","text":"When you save or borrow money, interest is paid for the use of the money.\nSimple interest: I = P × R × T ÷ 100, where P is the principal (the amount), R the rate per cent per year, T the time in years.\nRearranged: R = 100 × I ÷ (P × T) and T = 100 × I ÷ (P × R).\nWith simple interest, the interest is the same every year.","checks":[]},"worked_example":{"status":"draft","vars":{"P":50000,"R":5,"T":3,"hund":100},"problem":"Find the simple interest on {P} FCFA at {R} % per year for {T} years.","steps":["I = P × R × T ÷ {hund}.","I = {P} × {R} × {T} ÷ {hund} = {simpleInterest(P, R, T)} FCFA."],"answer":"{simpleInterest(P, R, T)} FCFA","checks":[]},"teach":{"cards":[{"id":"c44-1","status":"draft","idea":"I = P × R × T ÷ {hund}.","vars":{"P":20000,"R":10,"T":2,"hund":100},"example":["{P} × {R} × {T} ÷ {hund} = {simpleInterest(P, R, T)}"],"checks":[],"check":{"ref":"m2-44-i"}},{"id":"c44-2","status":"draft","idea":"The interest is the same each year: one year's interest × the number of years.","vars":{"P":30000,"R":5,"T":3},"example":["One year: {simpleInterest(P, R, 1)}; {T} years: {simpleInterest(P, R, T)}"],"checks":[],"check":{"ref":"m2-44-year"}},{"id":"c44-3","status":"draft","idea":"R = {hund} × I ÷ (P × T).","vars":{"P":40000,"T":2,"I":6400,"hund":100},"example":["{hund} × {I} ÷ ({P} × {T}) = {100 * I / (P * T)} %"],"checks":[],"check":{"id":"m2-44-rate-card","type":"numeric","level":1,"review":"rule","sources":["money"],"vars":{"P":{"pick":[20000,50000,80000,100000,150000,200000,500000]},"R":{"int":[2,12]},"T":{"int":[1,5]},"I":{"expr":"simpleInterest(P, R, T)"},"hund":100},"prompt":"{P} FCFA earns {I} FCFA simple interest in {T} years. Find the rate.","answer":"R","misconceptions":[{"id":"no-time","wrong":"R * T","explain":"Divide by the time ({T} years) too."}],"solution":["R = {hund} × I ÷ (P × T).","{hund} × {I} ÷ ({P} × {T}) = {answer} %."],"unit":"%"}}]},"questions":[{"id":"m2-44-i","type":"numeric","level":1,"review":"rule","sources":["money"],"vars":{"P":{"pick":[20000,50000,80000,100000,150000,200000,500000]},"R":{"int":[2,12]},"T":{"int":[1,5]},"hund":100},"prompt":"Find the simple interest on {P} FCFA at {R} % per year for {T} years.","answer":"simpleInterest(P, R, T)","misconceptions":[{"id":"one-year","wrong":"simpleInterest(P, R, 1)","explain":"That is the interest for one year. Multiply by {T} years."},{"id":"amount","wrong":"P + simpleInterest(P, R, T)","explain":"That is the amount (principal + interest). The question asks for the interest."}],"solution":["I = {P} × {R} × {T} ÷ {hund}.","= {answer} FCFA."],"unit":"FCFA"},{"id":"m2-44-year","type":"numeric","level":1,"review":"rule","sources":["money"],"vars":{"P":{"pick":[20000,50000,80000,100000,150000,200000,500000]},"R":{"int":[2,12]},"T":{"int":[1,5]},"hund":100},"prompt":"{P} FCFA is saved at {R} % simple interest. How much interest is earned in one year?","answer":"simpleInterest(P, R, 1)","misconceptions":[{"id":"pct","wrong":"R","explain":"The rate is {R} %: find {R} % of {P}."}],"solution":["I = {P} × {R} × {1} ÷ {hund}.","= {answer} FCFA."],"unit":"FCFA"},{"id":"m2-44-rate","type":"numeric","level":2,"review":"rule","sources":["money"],"vars":{"P":{"pick":[20000,50000,80000,100000,150000,200000,500000]},"R":{"int":[2,12]},"T":{"int":[1,5]},"I":{"expr":"simpleInterest(P, R, T)"},"hund":100},"prompt":"{P} FCFA earns {I} FCFA simple interest in {T} years. Find the rate.","answer":"R","misconceptions":[{"id":"no-time","wrong":"R * T","explain":"Divide by the time ({T} years) too."}],"solution":["R = {hund} × I ÷ (P × T).","{hund} × {I} ÷ ({P} × {T}) = {answer} %."],"unit":"%"},{"id":"m2-44-time","type":"numeric","level":3,"review":"rule","sources":["money"],"vars":{"P":{"pick":[20000,50000,80000,100000,150000,200000,500000]},"R":{"int":[2,12]},"T":{"int":[1,5]},"I":{"expr":"simpleInterest(P, R, T)"},"hund":100},"prompt":"How many years does it take for {P} FCFA to earn {I} FCFA simple interest at {R} % per ye status":"draft","idea":"The diagonals of a parallelogram cut each other in half.","vars":{"d":14},"example":["AC = {d} cm, so AO = {d / 2} cm"],"checks":[],"check":{"id":"m2-49-diag-card","type":"numeric","level":1,"review":"rule","sources":["polygons"],"vars":{"h":{"int":[3,15]},"d":{"expr":"2 * h"}},"prompt":"The diagonals of parallelogram ABCD meet at O. AC = {d} cm. Find AO.","answer":"d / 2","misconceptions":[{"id":"whole","wrong":"d","explain":"O is the midpoint: AO is half of AC."}],"solution":["The diagonals bisect each other: O is the midpoint of [AC].","AO = {d} ÷ {2} = {answer} cm."],"unit":"cm"}}]},"questions":[{"id":"m2-49-adj","type":"numeric","level":1,"review":"rule","sources":["polygons"],"vars":{"a":{"int":[40,140]}},"prompt":"In parallelogram ABCD, Â = {a}°. Find B̂.","answer":"180 - a","misconceptions":[{"id":"equal","wrong":"a","explain":"Â and B̂ are next to each other: they add up to {180}°. Only opposite angles are equal."}],"solution":["Â and B̂ are next to each other.","{180} − {a} = {answer}°."],"where":["a != 90"],"unit":"°"},{"id":"m2-49-opp","type":"numeric","level":1,"review":"rule","sources":["polygons"],"vars":{"a":{"int":[40,140]}},"prompt":"In parallelogram ABCD, B̂ = {a}°. Find D̂.","answer":"a","misconceptions":[{"id":"supp","wrong":"180 - a","explain":"B̂ and D̂ are opposite, not next to each other: they are equal."}],"solution":["B̂ and D̂ are opposite angles.","Opposite angles are equal: D̂ = {answer}°."],"where":["a != 90"],"unit":"°"},{"id":"m2-49-diag","type":"numeric","level":2,"review":"rule","sources":["polygons"],"vars":{"h":{"int":[3,15]},"d":{"expr":"2 * h"}},"prompt":"The diagonals of parallelogram ABCD meet at O. AC = {d} cm. Find AO.","answer":"d / 2","misconceptions":[{"id":"whole","wrong":"d","explain":"O is the midpoint: AO is half of AC."}],"solution":["The diagonals bisect each other: O is the midpoint of [AC].","AO = {d} ÷ {2} = {answer} cm."],"unit":"cm"},{"id":"m2-49-spot","type":"spot_error","level":3,"review":"authored","sources":["polygons"],"prompt":"Which statement is wrong?","pool":{"right":[{"text":"The opposite sides of a parallelogram are equal.","truth":"true"},{"text":"A rectangle has equal diagonals.","truth":"true"},{"text":"The diagonals of a rhombus are perpendicular.","truth":"true"},{"text":"A regular hexagon has six lines of symmetry.","truth":"true"}],"wrong":[{"text":"All the angles of a parallelogram are equal.","truth":"false","explain":"Only opposite angles are equal; angles next to each other add up to 180°."},{"text":"The diagonals of every parallelogram are equal.","truth":"false","explain":"Only a rectangle (or a square) has equal diagonals."},{"text":"A regular pentagon has ten lines of symmetry.","truth":"false","explain":"A regular polygon with n sides has n lines of symmetry: five."}]},"pick":{"right":3,"wrong":1}}]},"50":{"subject":"mathematics","class":"Form 2","lesson_no":50,"language":"en","prerequisites":[49,32],"skills":[{"id":"m2-50","name":"The area of a parallelogram and of a trapezium"}],"note":{"status":"draft","text":"Area of a parallelogram = base × height (the height is perpendicular to the base, not the slanting side).\nArea of a trapezium = ½ × (sum of the parallel sides) × height = ½ (a + b) h.\nExample: a trapezium with parallel sides 9 cm and 5 cm and height 4 cm: ½ × (9 + 5) × 4 = 28 cm².","checks":[]},"worked_example":{"status":"draft","vars":{"a":9,"b":5,"h":4},"problem":"Find the area of a trapezium with parallel sides {a} cm and {b} cm, {h} cm apart.","steps":["Add the parallel sides: {a} + {b} = {a + b}.","½ × {a + b} × {h} = {(a + b) * h / 2} cm²."],"answer":"{(a + b) * h / 2} cm²","checks":[],"figure":"trapeziumFig(a, b, h)"},"teach":{"cards":[{"id":"c50-1","status":"draft","idea":"Parallelogram: base × height.","vars":{"b":8,"h":5},"example":["{b} × {h} = {b * h} cm²"],"checks":[],"figure":"parallelogramFig(b, h)","check":{"ref":"m2-50-par"}},{"id":"c50-2","status":"draft","idea":"Trapezium: ½ × (a + b) × h.","vars":{"a":10,"b":6,"h":5},"example":["½ × ({a} + {b}) × {h} = {(a + b) * h / 2} cm²"],"checks":[],"figure":"trapeziumFig(a, b, h)","check":{"ref":"m2-50-trap"}},{"id":"c50-3","status":"draft","idea":"Use the perpendicular height, not the slanting side.","vars":{},"example":["The dotted line is the height."],"checks":[],"check":{"id":"m2-50-h-card","type":"numeric","level":1,"review":"rule","sources":["polygons"],"vars":{"b":{"int":[4,20]},"h":{"int":[2,15]},"A":{"expr":"b * h"}},"prompt":"A parallelogram has an area of {A} cm² and a base of {b} cm. Find its height.","answer":"h","misconceptions":[{"id":"times","wrong":"A * b","explain":"Divide the area by the base."}],"solution":["Area = base × height, so height = area ÷ base.","{A} ÷ {b} = {answer} cm."],"unit":"cm"}}]},"questions":[{"id":"m2-50-par","type":"numeric","level":1,"review":"rule","sources":["polygons"],"vars":{"b":{"int":[4,20]},"h":{"int":[2,15]}},"prompt":"Find the area of this parallelogram.","answer":"b * h","misconceptions":[{"id":"half","wrong":"b * h / 2","explain":"That is a triangle's formula. A parallelogram is base × height (no ½)."}],"solution":["Area = base × height.","{b} × {h} = {answer} cm²."],"figure":"parallelogramFig(b, h)","unit":"cm²"},{"id":"m2-50-trap","type":"numeric","level":1,"review":"rule","sources":["polygons"],"vars":{"a":{"int":[6,20]},"b":{"int":[2,15]},"h":{"int":[2,12]}},"prompt":"Find the area of this trapezium.","answer":"(a + b) * h / 2","misconceptions":[{"id":"nohalf","wrong":"(a + b) * h","explain":"Take half: ½ × (a + b) × h."},{"id":"product","wrong":"a * b * h / 2","explain":"Add the parallel sides, do not multiply them."}],"solution":["Add the parallel sides: {a} + {b} = {a + b}.","½ × {a + b} × {h} = {answer} cm²."],"where":["b \u003c a","((a + b) * h) % 2 == 0"],"figure":"trapeziumFig(a, b, h)","unit":"cm²"},{"id":"m2-50-h","type":"numeric","level":2,"review":"rule","sources":["polygons"],"vars":{"b":{"int":[4,20]},"h":{"int":[2,15]},"A":{"expr":"b * h"}},"prompt":"A parallelogram has an area of {A} cm² and a base of {b} cm. Find its height.","answer":"h","misconceptions":[{"id":"times","wrong":"A * b","explain":"Divide the area by the base."}],"solution":["Area = base × height, so height = area ÷ base.","{A} ÷ {b} = {answer} cm."],"unit":"cm"},{"id":"m2-50-field","type":"numeric","level":3,"review":"rule","sources":["polygons"],"vars":{"a":{"int":[20,60]},"b":{"int":[10,40]},"h":{"int":[10,30]},"c":{"pick":[50,100,150,200]}},"prompt":"A field is a trapezium. Its parallel sides are {a} m and {b} m, {h} m apart. Seed costs {c} FCFA per square metre. How much to sow the field?","answer":"(a + b) * h / 2 * c","misconceptions":[{"id":"nohalf","wrong":"(a + b) * h * c","explain":"The trapezium's area needs the ½."}],"solution":["Area: ½ × ({a} + {b}) × {h} = {(a + b) * h / 2} m².","Cost: {(a + b) * h / 2} × {c} = {answer} FCFA."],"where":["b \u003c a","((a + b) * h) % 2 == 0"],"unit":"FCFA"}]},"51":{"subject":"mathematics","class":"Form 2","lesson_no":51,"language":"en","prerequisites":[48],"skills":[{"id":"m2-51","name":"Point and line symmetry"}],"note":{"status":"draft","text":"A figure has line symmetry (an axis of symmetry) if folding it along the line makes the two halves match. A square has 4 lines of symmetry, a rectangle 2, an equilateral triangle 3, a regular polygon with n sides n.\nA figure has point symmetry (central symmetry) if a half turn (180°) about a point leaves it unchanged: parallelograms (and so rectangles, rhombuses, squares) and circles have it; triangles do not.\nOn a grid: the image of a point by reflection in the vertical line x = k is at the same height, the same distance on the other side: x′ = 2k − x.\nBy point symmetry about centre C, the image of M is M′ such that C is the midpoint of [MM′].","checks":[]},"worked_example":{"status":"draft","vars":{"x":1,"y":3,"k":3},"problem":"Find the image of A({x}, {y}) by reflection in the line x = {k}.","steps":["A is {k - x} units to the left of the line.","Its image is {k - x} units to the right: x′ = {k} + {k - x} = {reflectX(x, k)}; y stays {y}."],"answer":"A′({reflectX(x, k)}, {y})","checks":[],"figure":"coordPlane([['A', x, y], ['A′', reflectX(x, k), y]])"},"teach":{"cards":[{"id":"c51-1","status":"draft","idea":"A line of symmetry folds the figure onto itself.","vars":{"s":"rectangle"},"example":["A {s} has {symLines(s)} lines of symmetry."],"checks":[],"check":{"ref":"m2-51-lines"}},{"id":"c51-2","status":"draft","idea":"Point symmetry: a half turn about a point leaves the figure unchanged.","vars":{},"example":["Every parallelogram has point symmetry about the meeting point of its diagonals."],"checks":[],"check":{"ref":"m2-51-point"}},{"id":"c51-3","status":"draft","idea":"Reflection in x = k: the image is the same distance on the other side.","vars":{"x":-2,"y":1,"k":1},"example":["({x}, {y}) → ({reflectX(x, k)}, {y}) in x = {k}"],"checks":[],"check":{"id":"m2-51-reflect-card","type":"numeric","level":1,"review":"rule","sources":["symmetry"],"vars":{"x":{"int":[-5,5]},"y":{"int":[-4,4]},"k":{"int":[-2,2]}},"prompt":"Find the x-coordinate of the image of A({x}, {y}) by reflection in the line x = {k}.","answer":"reflectX(x, k)","misconceptions":[{"id":"negated","wrong":"-x","explain":"Reflecting in x = {k} is not just changing the sign (that is only for x = {0}).","when":"k != 0"}],"solution":["A is {abs(k - x)} units from the line.","Its image is {abs(k - x)} units on the other side: x′ = {answer}."],"where":["x != k","abs(reflectX(x, k)) \u003c= 5"],"signed":true,"figure":"coordPlane([['A', x, y]])"}}]},"questions":[{"id":"m2-51-lines","type":"numeric","level":1,"review":"rule","sources":["symmetry"],"vars":{"s":{"pick":["square","rectangle","rhombus","parallelogram","isosceles trapezium","kite","equilateral triangle","isosceles triangle","scalene triangle"]}},"prompt":"How many lines of symmetry has {aOrAn(s)}?","answer":"symLines(s)","misconceptions":[{"id":"diag","wrong":"symLines(s) + 2","explain":"Check each line: the diagonals of a rectangle or parallelogram are not lines of symmetry.","when":"s == 'rectangle' || s == 'parallelogram'"}],"solution":["Fold the {s} in your mind along each possible line.","{aOrAn(s)} has {answer}."]},{"id":"m2-51-point","type":"mcq","level":1,"review":"rule","sources":["symmetry"],"vars":{"s":{"pick":["square","rectangle","rhombus","parallelogram","isosceles trapezium","kite","equilateral triangle","isosceles triangle","scalene triangle"]}},"prompt":"Has {aOrAn(s)} point symmetry?","correct":"{hasPointSym(s) ? 'Yes' : 'No'}","distractors":[{"text":"{hasPointSym(s) ? 'No' : 'Yes'}","misconception":"w"}],"misconceptions":[{"id":"w","explain":"{hasPointSym(s) ? 'Every parallelogram, and so this ' + s + ', looks the same after a half turn.' : 'After a half turn the ' + s + ' points the other way.'}"}],"solution":["Turn the {s} half a turn about its centre: {hasPointSym(s) ? 'it looks the same' : 'it does not look the same'}.","So the answer is {answer}."],"min_distractors":1},{"id":"m2-51-reflect","type":"numeric","level":2,"review":"rule","sources":["symmetry"],"vars":{"x":{"int":[-5,5]},"y":{"int":[-4,4]},"k":{"int":[-2,2]}},"prompt":"Find the x-coordinate of the image of A({x}, {y}) by reflection in the line x = {k}.","answer":"reflectX(x, k)","misconceptions":[{"id":"negated","wrong":"-x","explain":"Reflecting in x = {k} is not just changing the sign (that is only for x = {0}).","when":"k != 0"}],"solution":["A is {abs(k - x)} units from the line.","Its image is {abs(k - x)} units on the other side: x′ = {answer}."],"where":["x != k","abs(reflectX(x, k)) \u003c= 5"],"signed":true,"figure":"coordPlane([['A', x, y]])"},{"id":"m2-51-half","type":"numeric","level":3,"review":"rule","sources":["symmetry"],"vars":{"x":{"int":[-4,4]},"y":{"int":[-4,4]},"a":{"int":[-2,2]},"b":{"int":[-2,2]}},"prompt":"M has coordinates ({x}, {y}). Find the coordinates of its image M′ by point symmetry about C({a}, {b}). Give the x-coordinate of M′.","answer":"halfTurn(x, a)","misconceptions":[{"id":"origin","wrong":"-x","explain":"The centre is C, not the origin: x′ = {2} × {a} − {x}.","when":"a != 0"},{"id":"half","wrong":"a + (a - x) / 2","explain":"Go the whole distance again beyond C, not half."}],"solution":["C is the midpoint of [MM′], so x′ = {2} × {a} − {x}.","x′ = {answer}."],"where":["x != a","abs(halfTurn(x, a)) \u003c= 5","abs(halfTurn(y, b)) \u003c= 5"],"signed":true,"figure":"coordPlane([['M', x, y], ['C', a, b]])"}]},"52":{"subject":"mathematics","class":"Form 2","lesson_no":52,"language":"en","prerequisites":[51],"skills":[{"id":"m2-52","name":"Properties kept by symmetry"}],"note":{"status":"draft","text":"A reflection (line symmetry) and a half turn (point symmetry) do not change the size or shape of a figure. They keep (conserve):\n• distances (lengths): A′B′ = AB;\n• angles: the image of a 40° angle is a 40° angle;\n• shapes: the image of a triangle is an equal (congruent) triangle;\n• parallelism: parallel lines have parallel images;\n• orthogonality: perpendicular lines have perpendicular images;\n• alignment: points on a line have images on a line.","checks":[]},"worked_example":{"status":"draft","vars":{"l":5,"a":40},"problem":"Triangle A′B′C′ is the image of ABC by a reflection. AB = {l} cm and Â = {a}°. Find A′B′ and Â′.","steps":["A reflection keeps lengths: A′B′ = AB = {l} cm.","It keeps angles: Â′ = Â = {a}°."],"answer":"A′B′ = {l} cm, Â′ = {a}°","checks":[]},"teach":{"cards":[{"id":"c52-1","status":"draft","idea":"Symmetry keeps lengths.","vars":{"l":6},"example":["AB = {l} cm, so A′B′ = {l} cm."],"checks":[],"check":{"ref":"m2-52-len"}},{"id":"c52-2","status":"draft","idea":"Symmetry keeps angles.","vars":{"a":55},"example":["B̂ = {a}°, so B̂′ = {a}°."],"checks":[],"check":{"ref":"m2-52-angle"}},{"id":"c52-3","status":"draft","idea":"Symmetry keeps parallel and perpendicular lines, and points on a line.","vars":{},"example":["If (AB) ∥ (CD), then (A′B′) ∥ (C′D′)."],"checks":[],"ch ndicular lines.","truth":"true"},{"text":"The image of three points on a line by a half turn is three points on a line.","truth":"true"},{"text":"The image of two parallel lines by a reflection is two parallel lines.","truth":"true"}],"wrong":[{"text":"The image of a square by a reflection can be a rectangle that is not a square.","truth":"false","explain":"Symmetry keeps lengths, so all four sides stay equal."},{"text":"The image of an angle of 30° by a half turn is an angle of 150°.","truth":"false","explain":"Symmetry keeps angles: it is still 30°."},{"text":"The image of a segment of 4 cm by a reflection is a segment of 8 cm.","truth":"false","explain":"Symmetry keeps lengths: still 4 cm."}]},"pick":{"right":1,"wrong":2}},{"id":"m2-52-spot","type":"spot_error","level":3,"review":"authored","sources":["symmetry"],"prompt":"Which statement is wrong?","pool":{"right":[{"text":"A reflection keeps lengths.","truth":"true"},{"text":"A half turn keeps angles.","truth":"true"},{"text":"The image of a square by a reflection is a square.","truth":"true"},{"text":"Images of parallel lines are parallel.","truth":"true"}],"wrong":[{"text":"A reflection doubles lengths.","truth":"false","explain":"A reflection keeps lengths."},{"text":"The image of a right angle by a half turn can be 120°.","truth":"false","explain":"Symmetry keeps angles: a right angle stays a right angle."},{"text":"Points on a line can have images that are not on a line.","truth":"false","explain":"Symmetry keeps alignment."}]},"pick":{"right":3,"wrong":1}}]},"53":{"subject":"mathematics","class":"Form 2","lesson_no":53,"language":"en","prerequisites":[29,31],"skills":[{"id":"m2-53","name":"The circumscribed circle of a triangle"}],"note":{"status":"draft","text":"The circumscribed circle of a triangle passes through its three vertices. Its centre O is where the three perpendicular bisectors of the sides meet (the circumcentre): O is the same distance from A, B and C.\nTo draw it: draw two perpendicular bisectors; where they cross is O; the radius is OA.\nIn a right-angled triangle, the centre is the midpoint of the hypotenuse, and the radius is half the hypotenuse.\nExample: a right-angled triangle with sides 6, 8, 10 cm has a circumscribed circle of radius 5 cm.","checks":[]},"worked_example":{"status":"draft","vars":{"a":6,"b":8,"c":10},"problem":"A right-angled triangle has sides {a} cm and {b} cm next to the right angle. Find the radius of its circumscribed circle.","steps":["Hypotenuse: √({a}² + {b}²) = {c} cm.","The centre is the midpoint of the hypotenuse: radius = {c} ÷ {2} = {c / 2} cm."],"answer":"{c / 2} cm","checks":[]},"teach":{"cards":[{"id":"c53-1","status":"draft","idea":"The circumcentre is where the perpendicular bisectors meet.","vars":{},"example":["It is the same distance from the three vertices."],"checks":[],"check":{"ref":"m2-53-centre"}},{"id":"c53-2","status":"draft","idea":"Right-angled triangle: the centre is the midpoint of the hypotenuse.","vars":{"c":13},"example":["Hypotenuse {c} cm → radius {c / 2} cm"],"checks":[],"check":{"ref":"m2-53-hyp"}},{"id":"c53-3","status":"draft","idea":"Find the hypotenuse with Pythagoras first.","vars":{"a":5,"b":12,"c":13},"example":["{a}, {b} → {c} → radius {c / 2}"],"checks":[],"check":{"id":"m2-53-legs-card","type":"numeric","level":1,"review":"rule","sources":["circles"],"vars":{"i":{"int":[0,11]},"a":{"expr":"tA(i)"},"b":{"expr":"tB(i)"},"c":{"expr":"tC(i)"}},"prompt":"A right-angled triangle has sides {a} cm and {b} cm next to the right angle. Find the radius of its circumscribed circle.","answer":"c / 2","misconceptions":[{"id":"diam","wrong":"c","explain":"That is the diameter (the hypotenuse). Halve it."},{"id":"leg","wrong":"b / 2","explain":"The diameter is the hypotenuse, not a shorter side."}],"solution":["Hypotenuse: √({a * a} + {b * b}) = {c} cm.","Radius = {c} ÷ {2} = {answer} cm."],"unit":"cm"}}]},"questions":[{"id":"m2-53-centre","type":"mcq","level":1,"review":"authored","sources":["circles"],"vars":{"X":{"pick":[{"q":"Where is the centre of the circumscribed circle of a triangle?","r":"where the perpendicular bisectors of the sides meet","w":["where the medians meet","where the heights meet","where the angle bisectors meet"],"e":["That is the centroid.","That is the orthocentre.","That is the centre of the inscribed circle."],"y":"Every point of a perpendicular bisector is the same distance from both ends of the side."},{"q":"Where is the centre of the circumscribed circle of a right-angled triangle?","r":"at the midpoint of the hypotenuse","w":["at the right-angle vertex","outside the triangle","at the midpoint of the shortest side"],"e":["The right-angle vertex is on the circle.","For a right-angled triangle it is on the hypotenuse.","It is the midpoint of the longest side."],"y":"The hypotenuse is a diameter of the circle."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"m2-53-hyp","type":"numeric","level":1,"review":"rule","sources":["circles"],"vars":{"i":{"int":[0,11]},"a":{"expr":"tA(i)"},"b":{"expr":"tB(i)"},"c":{"expr":"tC(i)"}},"prompt":"A right-angled triangle has a hypotenuse of {c} cm. Find the radius of its circumscribed circle.","answer":"c / 2","misconceptions":[{"id":"diam","wrong":"c","explain":"The hypotenuse is the diameter; the radius is half of it."}],"solution":["The hypotenuse is a diameter.","Radius = {c} ÷ {2} = {answer} cm."],"unit":"cm"},{"id":"m2-53-legs","type":"numeric","level":2,"review":"rule","sources":["circles"],"vars":{"i":{"int":[0,11]},"a":{"expr":"tA(i)"},"b":{"expr":"tB(i)"},"c":{"expr":"tC(i)"}},"prompt":"A right-angled triangle has sides {a} cm and {b} cm next to the right angle. Find the radius of its circumscribed circle.","answer":"c / 2","misconceptions":[{"id":"diam","wrong":"c","explain":"That is the diameter (the hypotenuse). Halve it."},{"id":"leg","wrong":"b / 2","explain":"The diameter is the hypotenuse, not a shorter side."}],"solution":["Hypotenuse: √({a * a} + {b * b}) = {c} cm.","Radius = {c} ÷ {2} = {answer} cm."],"unit":"cm"},{"id":"m2-53-spot","type":"spot_error","level":3,"review":"authored","sources":["circles"],"prompt":"Which statement is wrong?","pool":{"right":[{"text":"The circumscribed circle passes through the three vertices.","truth":"true"},{"text":"The circumcentre is the same distance from A, B and C.","truth":"true"},{"text":"In a right-angled triangle the hypotenuse is a diameter of the circumscribed circle.","truth":"true"},{"text":"Two perpendicular bisectors are enough to find the circumcentre.","truth":"true"}],"wrong":[{"text":"The circumcentre is always inside the triangle.","truth":"false","explain":"For an obtuse triangle it is outside; for a right-angled one it is on the hypotenuse."},{"text":"The circumcentre is where the medians meet.","truth":"false","explain":"The medians meet at the centroid."}]},"pick":{"right":3,"wrong":1}}]},"54":{"subject":"mathematics","class":"Form 2","lesson_no":54,"language":"en","prerequisites":[53],"skills":[{"id":"m2-54","name":"The relative positions of two circles"}],"note":{"status":"draft","text":"Two circles with radii r and R (R ≥ r) and distance d between their centres can be:\n• separate (outside each other): d > R + r;\n• touching externally (one point): d = R + r;\n• intersecting in two points: R − r \u003c d \u003c R + r;\n• touching internally (one point, one inside the other): d = R − r;\n• one inside the other without touching: d \u003c R − r (concentric when d = 0).\nCompare d with R + r and with R − r.","checks":[]},"worked_example":{"status":"draft","vars":{"R":5,"r":3,"d":7},"problem":"Circles with radii {R} cm and {r} cm have centres {d} cm apart. What is their position?","steps":["R + r = {R + r} and R − r = {R - r}.","{R - r} \u003c {d} \u003c {R + r}: they intersect in two points."],"answer":"{circlesPos(R, r, d)}","checks":[]},"teach":{"cards":[{"id":"c54-1","status":"draft","idea":"d = R + r: touching externally.","vars":{"R":4,"r":2},"example":["{R} + {r} = {R + r} = d"],"checks":[],"check":{"ref":"m2-54-touch"}},{"id":"c54-2","status":"draft","idea":"d = R − r: touching internally.","vars":{"R":6,"r":2},"example":["{R} − {r} = {R - r} = d"],"checks":[],"check":{"id":"m2-54-inner-card","type":"numeric","level":1,"review":"rule","sources":["circles"],"vars":{"r1":{"int":[4,15]},"r2":{"int":[1,10]}},"prompt":"Two circles with radii {r1} cm and {r2} cm touch internally. How far apart are their centres?","answer":"r1 - r2","misconceptions":[{"id":"outer","wrong":"r1 + r2","explain":"That is for touching externally. Internally, subtract."}],"solution":["Touching internally: d = R − r.","{r1} − {r2} = {answer} cm."],"where":["r1 > r2"],"unit":"cm"}},{"id":"c54-3","status":"draft","idea":"Compare d with R + r and R − r to name the position.","vars":{},"example":["R − r \u003c d \u003c R + r: intersecting."],"checks":[],"check":{"ref":"m2-54-name"}}]},"questions":[{"id":"m2-54-name","type":"mcq","level":1,"review":"rule","sources":["circles"],"vars":{"r1":{"int":[3,9]},"r2":{"int":[1,5]},"k":{"int":[0,4]},"d":{"expr":"k == 0 ? r1 + r2 + 2 : k == 1 ? r1 + r2 : k == 2 ? r1 + r2 - 1 : k == 3 ? r1 - r2 : r1 - r2 - 1"}},"prompt":"Two circles have radii {r1} cm and {r2} cm. Their centres are {d} cm apart. What is their position?","correct":"{circlesPos(r1, r2, d)}","distractors":[{"text":"separate (outside each other)","misconception":"s"},{"text":"touching externally","misconception":"te"},{"text":"intersecting in two points","misconception":"i"},{"text":"touching internally","misconception":"ti"},{"text":"one inside the other","misconception":"in"}],"misconceptions":[{"id":"s","explain":"Separate needs d > {r1 + r2}."},{"id":"te","explain":"Touching externally needs d = {r1 + r2} exactly."},{"id":"i","explain":"Intersecting needs {r1 - r2} \u003c d \u003c {r1 + r2}."},{"id":"ti","explain":"Touching internally needs d = {r1 - r2} exactly."},{"id":"in","explain":"One inside the other needs d \u003c {r1 - r2}."}],"solution":["R + r = {r1 + r2}, R − r = {r1 - r2}, d = {d}.","So they are {answer}."],"where":["r1 > r2","d > 0"],"min_distractors":3},{"id":"m2-54-touch","type":"numeric","level":1,"review":"rule","sources":["circles"],"vars":{"r1":{"int":[2,12]},"r2":{"int":[1,10]}},"prompt":"Two circles with radii {r1} cm and {r2} cm touch externally. How far apart are their centres?","answer":"r1 + r2","misconceptions":[{"id":"inner","wrong":"abs(r1 - r2)","explain":"That is for touching internally. Externally, add the radii."}],"solution":["Touching externally: d = R + r.","{r1} + {r2} = {answer} cm."],"unit":"cm"},{"id":"m2-54-inner","type":"numeric","level":2,"review":"rule","sources":["circles"],"vars":{"r1":{"int":[4,15]},"r2":{"int":[1,10]}},"prompt":"Two circles with radii {r1} cm and {r2} cm touch internally. How far apart are their centres?","answer":"r1 - r2","misconceptions":[{"id":"outer","wrong":"r1 + r2","explain":"That is for touching externally. Internally, subtract."}],"solution":["Touching internally: d = R − r.","{r1} − {r2} = {answer} cm."],"where":["r1 > r2"],"unit":"cm"},{"id":"m2-54-range","type":"numeric","level":3,"review":"rule","sources":["circles"],"vars":{"r1":{"int":[3,12]},"r2":{"int":[2,9]}},"prompt":"Two circles have radii {r1} cm and {r2} cm and intersect in two points. The distance between their centres is a whole number of centimetres. What is the largest it can be?","answer":"r1 + r2 - 1","misconceptions":[{"id":"touch","wrong":"r1 + r2","explain":"At d = {r1 + r2} they only touch; they must be closer to cross in two points."}],"solution":["To intersect: d \u003c R + r = {r1 + r2}.","The largest whole number below {r1 + r2} is {answer} cm."],"where":["r1 > r2"],"unit":"cm"}]}},"f2-english":{"33":{"subject":"english-language","class":"Form 2","lesson_no":33,"language":"en","prerequisites":[],"skills":[{"id":"e2-33","name":"Talking about insecurity and crime; reading about a safer quarter"}],"note":{"status":"draft","text":"Text: A safer quarter\nLast year, Mbengwi quarter lived in fear. Thieves broke into shops at night, and two pupils were nearly kidnapped on their way home. Parents stopped sending children to evening studies. Then the quarter head called a meeting. The people agreed to light the streets, to form a vigilance group of volunteers who walk round the quarter at night, and to report every suspect to the police instead of beating him. The police opened a small post near the market. Six months later, crime had fallen sharply. \"Security is everybody's business,\" said the quarter head. \"We protect each other, and we let the law do its work.\"\n\nUseful words: theft, burglary (breaking into a house or shop), kidnapping (taking a person by force), a suspect (a person thought to be guilty), a vigilance group (volunteers who keep watch), to report a crime, the police, justice.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"In the text, what three things did the people agree to do?","steps":["Find the meeting in the text.","They agreed to light the streets, to form a vigilance group, and to report suspects to the police instead of beating them."],"answer":"light the streets; form a vigilance group; report suspects to the police","checks":[]},"teach":{"cards":[{"id":"c33-1","status":"draft","idea":"Crime words: theft, burglary, kidnapping, suspect, report.","vars":{},"example":["Burglary means breaking into a house or shop to steal."],"checks":[],"check":{"ref":"e2-33-words"}},{"id":"c33-2","status":"draft","idea":"Answer questions with the exact information from the text.","vars":{},"example":["Who called the meeting? The quarter head."],"checks":[],"check":{"ref":"e2-33-text"}},{"id":"c33-3","status":"draft","idea":"The main idea is the lesson of the whole text.","vars":{},"example":["Security is everybody's business, and the law must do its work."],"checks":[],"check":{"id":"e2-33-idea-card","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"what is the main idea?","r":"people working together, with the police, can make a quarter safe","w":["thieves are stronger than the police","children must stay at home forever","people should punish suspects themselves"],"e":["Crime fell when people worked together.","Evening studies were the problem only at first.","They agreed to report suspects, not beat them."],"y":"“Security is everybody's business.”"},{"q":"why did they report suspects instead of beating them?","r":"to let the law do its work","w":["because the suspects were their friends","because the police were far away","because beating is too tiring"],"e":["The text does not say that.","The police opened a post near the market.","That is not the reason."],"y":"“We let the law do its work.”"}]}},"prompt":"Text “A safer quarter”: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"e2-33-words","type":"mcq","level":1,"review":"authored","sources":["vocabulary"],"vars":{"X":{"pick":[{"q":"What is burglary?","r":"breaking into a house or shop to steal","w":["taking a person by force","shouting at night","a meeting of the quarter"],"e":["That is kidnapping.","That is noise, not a crime word here.","That is a meeting."],"y":"Burglars break in to steal."},{"q":"What is a suspect?","r":"a person thought to be guilty of a crime","w":["a police officer","a person who was robbed","a judge"],"e":["The police arrest suspects."," the meeting.","truth":"false","explain":"Crime fell sharply."}]},"pick":{"right":3,"wrong":1}}]},"34":{"subject":"english-language","class":"Form 2","lesson_no":34,"language":"en","prerequisites":[33],"skills":[{"id":"e2-34","name":"Idiomatic expressions"}],"note":{"status":"draft","text":"An idiom is a group of words whose meaning is different from the meanings of the separate words. “He is behind bars” does not mean he is standing behind some bars: it means he is in prison.\n• caught red-handed: caught while doing something wrong\n• behind bars: in prison\n• on the run: running away from the police\n• take the law into your own hands: punish someone yourself instead of going to the police\n• keep an eye on: watch carefully\n• turn a blind eye: pretend not to see something wrong\n• break the law: do something illegal\n• cry wolf: give a false alarm\nLearn idioms as whole expressions, and use them in the right situation.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"What does “The thief was caught red-handed” mean?","steps":["“Caught red-handed” is an idiom: we cannot read it word by word.","It means caught while doing something wrong."],"answer":"The thief was caught while he was stealing.","checks":[]},"teach":{"cards":[{"id":"c34-1","status":"draft","idea":"An idiom means more than its words.","vars":{},"example":["“Behind bars” means in prison."],"checks":[],"check":{"ref":"e2-34-mean"}},{"id":"c34-2","status":"draft","idea":"Choose the idiom that fits the situation.","vars":{},"example":["Do not take the law into your own hands: call the police."],"checks":[],"check":{"ref":"e2-34-use"}},{"id":"c34-3","status":"draft","idea":"Some idioms warn or advise.","vars":{},"example":["Keep an eye on your bag in the market."],"checks":[],"check":{"id":"e2-34-match-card","type":"matching","level":1,"review":"authored","sources":["vocabulary"],"prompt":"Match each idiom to its meaning.","pool":[{"left":"on the run","right":"running away from the pol :3,"review":"authored","sources":["grammar-tenses"],"prompt":"Which sentence has a mistake with the auxiliary?","pool":{"right":[{"text":"Does your brother walk to school?","truth":"true"},{"text":"They have called the police.","truth":"true"},{"text":"She is watching the market.","truth":"true"},{"text":"You must lock the door.","truth":"true"}],"wrong":[{"text":"He do not know the suspect.","truth":"false","explain":"With he, use does: He does not know."},{"text":"We has finished our homework.","truth":"false","explain":"With we, use have."},{"text":"You must to stay inside.","truth":"false","explain":"After must, no “to”: You must stay."},{"text":"Is they coming tomorrow?","truth":"false","explain":"With they, use are."}]},"pick":{"right":3,"wrong":1}}]},"36":{"subject":"english-language","class":"Form 2","lesson_no":36,"language":"en","prerequisites":[33],"skills":[{"id":"e2-36","name":"Writing an informal letter to a friend"}],"note":{"status":"draft","text":"An informal letter is written to a friend or a relative, in a friendly style.\nLayout: your address and the date at the top right; “Dear + first name,” on the left; an opening paragraph (greetings, why you write); one or two body paragraphs (your news); a closing paragraph (best wishes, ask for a reply); a friendly ending (Your friend, / With love,) and your first name.\nUse everyday language and contractions (I'm, don't), but write correct sentences.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Plan a letter to your friend about the meeting that made your quarter safer.","steps":["Top right: your address and the date.","Dear Tabe, — I hope you are well. I am writing to tell you good news from our quarter.","Body: the problem (thefts), the meeting, what people agreed to do, the result.","Closing: Greet your family for me and write back soon. Your friend, Ngum"],"answer":"Address and date → Dear … → opening → news → closing → Your friend, + name","checks":[]},"teach":{"cards":[{"id":"c36-1","status":"draft","idea":"The address and the date go at the top right.","vars":{},"example":["P.O. Box …, Bamenda — {12} March"],"checks":[],"check":{"ref":"e2-36-order"}},{"id":"c36-2","status":"draft","idea":"Start with “Dear + first name,” and a friendly opening.","vars":{},"example":["Dear Tabe, I hope you and your family are well."],"checks":[],"check":{"ref":"e2-36-order"}},{"id":"c36-3","status":"draft","idea":"End with a friendly closing and your first name.","vars":{},"example":["Write back soon. Your friend, Ngum"],"checks":[],"check":{"ref":"e2-36-order"}}]},"questions":[{"id":"e2-36-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the parts of the informal letter in order.","items":[{"text":"Box 214, Bamenda, 12 March"},{"text":"Dear Tabe,"},{"text":"I hope you are well. I am writing to tell you good news."},{"text":"Our quarter is now safe because everybody helps."},{"text":"Write back soon."},{"text":"Your friend, Ngum"}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write an informal letter (about 150 words) in your exercise book to a friend in another town. Tell him or her how people in your quarter fight insecurity. Use the layout of an informal letter.","model":["Box 214, Bamenda\n12 March\n\nDear Tabe,\n\nI hope you and your family are well. I am writing to tell you some good news from our quarter.\n\nLast year thieves broke into shops almost every week, and we were afraid to go out at night. Then our quarter head called a meeting. We agreed to put lights in the streets and to form a vigilance group. My father and other volunteers now walk round the quarter at night, and they call the police when they see a suspect. Nobody beats suspects any more: we let the law do its work.\n\nNow the market is busy again in the evening and I go to evening studies without fear.\n\nGreet your parents for me and write back soon.\n\nYour friend,\nNgum"],"checklist":["My address and the date are at the top right.","I began with “Dear + first name,”.","My opening paragraph greets my friend and says why I am writing.","My body paragraphs give my news in order.","I closed with good wishes and asked for a reply.","I ended with “Your friend,” and my first name.","My sentences start with capitals and end with full stops."]}},"37":{"subject":"english-language","class":"Form 2","lesson_no":37,"language":"en","prerequisites":[],"skills":[{"id":"e2-37","name":"Talking about rights; reading about young parliamentarians"}],"note":{"status":"draft","text":"Text: The Children's Parliament\nEvery year, children chosen from schools all over Cameroon meet as members of the Children's Parliament. Like real members of parliament, they debate and vote. This year, Junior Parliamentarian Ayuk Mary spoke about the right to education: \"Some girls stop school because they must work at home or marry too young. Every child has the right to go to school, to be healthy, to be protected from violence and to be heard.\" Another young parliamentarian reminded the house that rights come with duties: \"We must respect our parents and teachers, study hard and protect the environment.\" At the end, the children sent their proposals to the Minister.\n\nA right is something every person should have or be allowed to do (to go to school, to be protected). A duty is something we must do (to respect others, to obey the law). ","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Name two rights and two duties from the text.","steps":["Rights: “to go to school, to be healthy, to be protected from violence and to be heard”.","Duties: “respect our parents and teachers, study hard and protect the environment”."],"answer":"rights: education, protection; duties: respect, studying hard","checks":[]},"teach":{"cards":[{"id":"c37-1","status":"draft","idea":"A right is what a child should have; a duty is what a child must do.","vars":{},"example":["Right: to go to school. Duty: to study hard."],"checks":[],"check":{"ref":"e2-37-right"}},{"id":"c37-2","status":"draft","idea":"Find the answer in the text and quote it.","vars":{},"example":["Who spoke about education? Ayuk Mary."],"checks":[],"check":{"ref":"e2-37-text"}},{"id":"c37-3","status":"draft","idea":"Rights come with duties.","vars":{},"example":["The right to education comes with the duty to study."],"checks":[],"check":{"id":"e2-37-idea-card","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"what is the main message?","r":"children have rights, and those rights come with duties","w":["children should not go to school","only adults have rights","girls must marry young"],"e":["The text defends education.","The text is about children's rights.","The text speaks against early marriage."],"y":"Both speeches together give the message."},{"q":"how is the Children's Parliament like the real parliament?","r":"the members debate and vote","w":["the members are paid","the members are adults","it makes the laws of the country"],"e":["The text does not say that.","The members are children.","It sends proposals; it does not make laws."],"y":"“Like real members of parliament, they debate and vote.”"}]}},"prompt":"Text “The Children's Parliament”: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"e2-37-right","type":"mcq","level":1,"review":"authored","sources":["vocabulary"],"vars":{"X":{"pick":[{"q":"to go to school","r":"a right","w":["a duty","a crime","a punishment"],"e":["It is something every child should have.","It is not a crime.","It is not a punishment."],"y":"Education is a right of every child."},{"q":"to respect your teachers","r":"  rights and duties go together."],"checks":[],"check":{"ref":"e2-40-order"}}]},"questions":[{"id":"e2-40-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the parts of the text in order.","items":[{"text":"The rights and duties of the girl child"},{"text":"Like every child, a girl has rights and duties."},{"text":"First, a girl has the right to go to school and to be protected."},{"text":"However, she also has duties: to respect others and to study hard."},{"text":"In conclusion, rights and duties go together."}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write a text of about 150 words in your exercise book: “The rights and duties of the girl child”. Give a title, an introduction, one paragraph on rights, one on duties and a conclusion.","model":["The rights and duties of the girl child\n\nLike every child, a girl has rights, and these rights come with duties.\n\nFirst, a girl has the right to go to school, just like a boy. She has the right to good health care and to be protected from violence and from early marriage. She also has the right to give her opinion on matters that concern her.\n\nHowever, she also has duties. She must respect her parents, her teachers and her elders. She must study hard and help at home, and, like everybody, she must protect the environment.\n\nIn conclusion, when a girl's rights are respected and she carries out her duties, she grows into a responsible woman who helps her community."],"checklist":["I wrote a title.","My introduction says what the text is about.","One paragraph is about rights, with examples.","One paragraph is about duties, with examples.","I used linking words (first, also, however, in conclusion).","My conclusion gives my opinion.","My sentences are correct and punctuated."]}},"41":{"subject":"english-language","class":"Form 2","lesson_no":41,"language":"en","prerequisites":[],"skills":[{"id":"e2-41","name":"Accessing public health services; reading about a visit to the health centre"}],"note":{"status":"draft","text":"Text: At the health centre\nWhen Bih's little brother had a high fever, their mother took him to the integrated health centre near their village. First, a nurse wrote his name in the register and took his temperature and weight. Then they waited their turn to see the nurse in charge, who examined the boy. A quick test in the laboratory showed malaria. The nurse explained the treatment: tablets three times a day for three days, plenty of water, and sleeping under a treated mosquito net. Bih's mother paid at the cash desk, collected the medicine at the pharmacy and booked a check-up for the following week. On the way out, a poster reminded them that children's vaccinations are given free every Tuesday.\n\nSteps of a visit: registration, waiting, consultation, laboratory test, payment, pharmacy, follow-up visit.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Put the steps of the visit in order.","steps":["Find the order words in the text: first, then, …","Registration → consultation → laboratory test → payment → pharmacy → check-up booking."],"answer":"registration, consultation, test, payment, pharmacy, check-up","checks":[]},"teach":{"cards":[{"id":"c41-1","status":"draft","idea":"A visit to a health centre has steps: register, wait, consult, test, pay, collect medicine.","vars":{},"example":["First the nurse writes your name in the register."],"checks":[],"check":{"ref":"e2-41-steps"}},{"id":"c41-2","status":"draft","idea":"Find details in the text: who, what, when.","vars":{},"example":["The test showed malaria."],"checks":[],"check":{"ref":"e2-41-text"}},{"id":"c41-3","status":"draft","idea":"Health words: consultation, laboratory, pharmacy, register, follow-up.","vars":{},"example":["The pharmacy is where you collect medicine."],"checks":[],"check":{"id":"e2-41-words-card","type":"matching","level":1,"review":"authored","sources":["vocabulary"],"prompt":"Matc d."},{"text":"Boil or treat your drinking water and keep it covered."},{"text":"Drink clean water and protect your family."}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write three health slogans in your exercise book. Then choose one and develop it into a paragraph of about 100 words: give the reason, examples, and end with an imperative.","model":["Slogans: “Clean hands, healthy life.” “Sleep under a net, keep malaria away.” “Clean water, healthy life.”\n\nClean hands, healthy life! Our hands touch many things every day: money, door handles, toilets and food. They carry germs that cause diarrhoea, cholera and coughs. Washing our hands with soap and clean water removes most of these germs. We should wash them before eating, before cooking, after the toilet and after caring for a sick person. It takes less than a minute and costs very little, but it can save a life. Wash your hands often, and teach your little brothers and sisters to do the same."],"checklist":["I wrote three short slogans.","My paragraph starts with the slogan.","I explained why (the reason).","I gave examples or facts.","I ended with an imperative.","My sentences are correct and punctuated."]}},"45":{"subject":"english-language","class":"Form 2","lesson_no":45,"language":"en","prerequisites":[],"skills":[{"id":"e2-45","name":"Talking about postal services; reading about sending a parcel"}],"note":{"status":"draft","text":"Text: A parcel for Grandma\nNkeng wanted to send a parcel of clothes to her grandmother in Kumbo. She went to the post office. At the counter, the clerk weighed the parcel and told her the price. Nkeng wrote the address clearly: her grandmother's name, the P.O. Box number and the town. She also wrote her own address on the back, so that the parcel could come back if it was not delivered. She paid, received a receipt with a tracking number, and bought stamps for two letters. The clerk explained that express mail is faster but costs more. A week later, Grandma phoned: the parcel had arrived safely.\n\nPostal services: sending letters and parcels, selling stamps, renting post office boxes (P.O. Box), express mail, sending and receiving money. Words: counter, clerk, sender, addressee (who receives it), receipt, tracking number.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Why did Nkeng write her own address on the back?","steps":["Find the sentence about her own address.","“so that the parcel could come back if it was not delivered”"],"answer":"So that the parcel could be returned if it was not delivered.","checks":[]},"teach":{"cards":[{"id":"c45-1","status":"draft","idea":"The post office sends letters and parcels, sells stamps and rents boxes.","vars":{},"example":["You buy stamps at the post office counter."],"checks":[],"check":{"ref":"e2-45-words"}},{"id":"c45-2","status":"draft","idea":"The sender sends; the addressee receives.","vars":{},"example":["Nkeng is the sender; her grandmother is the addressee."],"checks":[],"check":{"ref":"e2-45-text"}},{"id":"c45-3","status":"draft","idea":"A receipt and a tracking number prove that you sent the parcel.","vars":{},"example":["With the tracking number you can follow the parcel."],"checks":[],"check":{"id":"e2-45-idea-card","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"what is the difference between express mail and ordinary mail?","r":"express mail is faster but costs more","w":["express mail is cheaper","ordinary mail is faster","there is no difference"],"e":["It costs more.","Express is faster.","The clerk explained a difference."],"y":"The clerk explained it."},{"q":"why is a tracking number useful?","r":"it lets you follow where the parcel is","w":["it makes the parcel lighter","it replaces the address","it pays for the parcel"],"e":["It does not change the weight.","You still need the address.","You pay at the counter."],"y":"You can check the parcel's journey with it."}]}},"prompt"  names of organisations are proper nouns.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Find the proper nouns: “Last january, nkeng sent a parcel from buea to her aunt in kumbo.”","steps":["Names of a month, a person and towns are proper nouns.","January, Nkeng, Buea, Kumbo need capital letters."],"answer":"January, Nkeng, Buea, Kumbo","checks":[]},"teach":{"cards":[{"id":"c47-1","status":"draft","idea":"A proper noun names one particular person, place or thing.","vars":{},"example":["Kumbo is a proper noun; town is a common noun."],"checks":[],"check":{"ref":"e2-47-kind"}},{"id":"c47-2","status":"draft","idea":"Proper nouns always start with a capital letter.","vars":{},"example":["Monday, March, Cameroon, Mount Cameroon"],"checks":[],"check":{"ref":"e2-47-cap"}},{"id":"c47-3","status":"draft","idea":"Common nouns start with a small letter inside a sentence.","vars":{},"example":["She went to the post office in Kumbo."],"checks":[],"check":{"id":"e2-47-spot-card","type":"spot_error","level":1,"review":"authored","sources":["grammar-tenses"],"prompt":"Which sentence has a capital-letter mistake?","pool":{"right":[{"text":"Nkeng lives in Bafoussam.","truth":"true"},{"text":"The post office closes on Saturday.","truth":"true"},{"text":"We crossed the Wouri bridge.","truth":"true"},{"text":"My uncle is a postman.","truth":"true"}],"wrong":[{"text":"We travelled to limbe in july.","truth":"false","explain":"Limbe and July are proper nouns: capital letters."},{"text":"The Post Office is near the Market.","truth":"false","explain":"post office and market are common nouns here: small letters."},{"text":"my friend ayuk sent a letter.","truth":"false","explain":"My (start of the sentence) and Ayuk need capitals."}]},"pick":{"right":3,"wrong":1}}}]},"questions":[{"id":"e2-47-kind","type":"mcq","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"q":"Nkeng sent a parcel.","r":"Nkeng","w":["sent","parcel","a"],"e":["That is a :"A report gives facts about something that happened or was studied. Layout: a title; To (who receives it), From (who writes it), Date; an introduction (the purpose); the findings (what you saw or found, in paragraphs or points); recommendations (what should be done). Use formal language and the past tense for what happened.\nA poster advertises a service or gives a message. It has a short heading, a picture idea, a few key facts (what, where, when, how much), and contact details. Use few words and large letters.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Plan a report to the principal on a health problem in the school.","steps":["Title: Report on hand washing in our school. To: the Principal. From: the Health Club. Date.","Introduction: purpose of the report.","Findings: few water points, no soap, many pupils do not wash their hands.","Recommendations: more water points, soap every week, a hand-washing campaign."],"answer":"title → To/From/Date → introduction → findings → recommendations","checks":[]},"teach":{"cards":[{"id":"c48-1","status":"draft","idea":"A report gives facts: introduction, findings, recommendations.","vars":{},"example":["Recommendation: put soap at every water point."],"checks":[],"check":{"ref":"e2-48-order"}},{"id":"c48-2","status":"draft","idea":"A report has To, From and Date at the top.","vars":{},"example":["To: the Principal; From: the Health Club"],"checks":[],"check":{"ref":"e2-48-order"}},{"id":"c48-3","status":"draft","idea":"A poster is short: heading, key facts, contact.","vars":{},"example":["FAST DELIVERY! Parcels in {24} hours. Call …"],"checks":[],"check":{"ref":"e2-48-order"}}]},"questions":[{"id":"e2-48-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the parts of the report in order.","items":[{"text":"Report on hand washing in our school"},{"text":"To: the Principal; From: the Health Club"},{"text":"This report describes how pupils wash their hands."},{"text":"We found only two water points and no soap."},{"text":"We recommend more water points and soap every week."}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write in your exercise book a short report (about 120 words) to your principal on a health problem in your school, with a title, To/From/Date, an introduction, findings and recommendations. Then design a poster advertising a parcel delivery service.","model":["Report on hand washing in our school\nTo: the Principal\nFrom: the Health Club\nDate: 14 May\n\nIntroduction: This report describes how pupils wash their hands at school.\n\nFindings: We visited the school compound during break for one week. There are only two water points for 900 pupils, and there is no soap. Most pupils eat without washing their hands. Three classes had pupils absent with diarrhoea last month.\n\nRecommendations: We recommend more water points, soap at every point each week, and a hand-washing campaign led by the Health Club.\n\nPoster: FAST AND SAFE DELIVERY — Parcels anywhere in the region in 48 hours — Visit our office near the main market — Call 6xx xx xx xx"],"checklist":["My report has a title.","I wrote To, From and Date.","My introduction gives the purpose.","My findings are facts.","My recommendations say what should be done.","My poster has a heading, key facts and contact details."]}},"49":{"subject":"english-language","class":"Form 2","lesson_no":49,"language":"en","prerequisites":[],"skills":[{"id":"e2-49","name":"Talking about banks and their services; listening to a dialogue at the bank"}],"note":{"status":"draft","text":"Text: Opening an account\nMr Fonyuy: Good morning. I would like to open a savings account for my daughter.\nBank clerk: Good morning, sir. You need your identity card, her birth certificate, two passport photographs and a first deposit.\nMr Fonyuy: Will the money earn interest?\nBank clerk: Yes, a savings account earns a little interest every year. You can deposit money at any time and withdraw it at the counter or with a bank card at the ATM.\nMr Fonyuy: Can I also send money to my brother in Garoua?\nBank clerk: Of course. We do transfers between our branches, and you can also use mobile money.\n\nKinds of banks: commercial banks (accounts, loans, transfers), savings banks and microfinance institutions (savings and small loans), the central bank (BEAC, the Bank of Central African States, which issues the CFA franc). Words: deposit (put in), withdraw (take out), loan, interest, ATM.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"What does Mr Fonyuy need to open the account?","steps":["Find the clerk's first answer.","Identity card, birth certificate, two passport photographs and a first deposit."],"answer":"ID card, birth certificate, two photos, a first deposit","checks":[]},"teach":{"cards":[{"id":"c49-1","status":"draft","idea":"Deposit = put money in; withdraw = take money out.","vars":{},"example":["She deposited her savings and withdrew some at the ATM."],"checks":[],"check":{"ref":"e2-49-words"}},{"id":"c49-2","status":"draft","idea":"Banks keep money safe, give loans and send money.","vars":{},"example":["A loan is money borrowed from the bank."],"checks":[],"check":{"ref":"e2-49-text"}},{"id":"c49-3","status":"draft","idea":"A savings account earns interest.","vars":{},"example":["The money grows a little each year."],"checks":[],"check":{"id":"e2-49-idea-card","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"Which bank issues the CFA franc in Central Africa?","r":"BEAC, the Bank of Central African States","w":["a microfinance institution","a savings bank","the post office"],"e":["They give small loans.","It keeps savings.","It is not a bank."],"y":"BEAC is the central bank."},{"q":"Why does a savings account help a family?","r":"the money is kept safe and earns interest","w":["the bank keeps the money for ever","the money cannot be withdrawn","it is free money"],"e":["You can withdraw it.","You can withdraw it at any time.","It is your own money."],"y":"Safe savings that grow a little."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"e2-49-words","type":"matching","level":1,"review":"authored","sources":["vocabulary"],"prompt":"Match each banking word to its meaning.","pool":[{"left":"to deposit","right":"to put money into an account"},{"left":"to withdraw","right":"to take money out of an account"},{"left":"a loan","right":"money borrowed that must be paid back"},{"left":"interest","right":"extra money paid on savings or loans"},{"left":"a transfer","right":"sending money from one account to another"}],"pick":4},{"id":"e2-49-text","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"what kind of account does Mr Fonyuy want?","r":"a savings account for his daughter","w":["a loan for himself","a current account for his shop","a mobile money account"],"e":["He does not ask for a loan.","He wants it for his daughter.","Mobile money is mentioned later."],"y":"“I would like to open a savings account for my daughter.”"},{"q":"where can money be withdrawn?","r":"at the counter or at the ATM with a bank card","w":["only at the post office","only in Garoua","nowhere"],"e":["The text does not say that.","Garoua is about the transfer.","The clerk names two ways."],"y":"The clerk explains it."},{"q":"how can he send money to his brother?","r":"by a transfer between branches or by mobile money","w":["by post only","he cannot","by giving it to the clerk to carry"],"e":["The text does not say that.","The clerk says “Of course.”","The text does not say that."], uthored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"My uncle gave me a good ___ of advice.","a":"piece","w":["bag","glass"],"e":["We say a piece of advice.","A glass is for drinks."]},{"s":"We bought a ___ of rice at the market.","a":"bag","w":["piece","glass"],"e":["Rice comes in bags.","A glass is for drinks."]},{"s":"Please give me a ___ of water.","a":"glass","w":["bag","piece"],"e":["Water is drunk from a glass.","We do not say a piece of water."]}]}},"prompt":"Choose the right unit.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]}}]},"questions":[{"id":"e2-51-kind","type":"mcq","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"q":"money","r":"uncountable","w":["countable","both","a proper noun"],"e":["We do not say “two moneys”.","Money has no plural.","It is a common noun."],"y":"We count coins or notes, not “moneys”."},{"q":"coin","r":"countable","w":["uncountable","never plural","a proper noun"],"e":["One coin, two coins.","It has a plural: coins.","It is a common noun."],"y":"One coin, two coins."},{"q":"advice","r":"uncountable","w":["countable","always plural","a proper noun"],"e":["We say “a piece of advice”.","It has no plural.","It is a common noun."],"y":"We say “some advice”."},{"q":"account","r":"countable","w":["uncountable","never plural","a proper noun"],"e":["One account, two accounts.","It has a plural.","It is a common noun."],"y":"One account, two accounts."}]}},"prompt":"Is “{X.q}” countable or uncountable?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":" rue"},{"text":"There is a little money left.","truth":"true"},{"text":"He gave me a piece of advice.","truth":"true"}],"wrong":[{"text":"The clerk gave us many informations.","truth":"false","explain":"Information is uncountable: a lot of information."},{"text":"How much customers came today?","truth":"false","explain":"Customers is countable: How many."},{"text":"I bought two breads.","truth":"false","explain":"Bread is uncountable: two loaves of bread."}]},"pick":{"right":3,"wrong":1}}]},"52":{"subject":"english-language","class":"Form 2","lesson_no":52,"language":"en","prerequisites":[49,51],"skills":[{"id":"e2-52","name":"Writing about the activities and importance of banks"}],"note":{"status":"draft","text":"To describe activities: say what happens and who does it, in the present simple (The clerk checks the identity card. Customers queue at the counter.).\nTo write about importance: give reasons with linking words: firstly, secondly, also, moreover, finally, therefore.\nPlan: introduction (what a bank is); paragraph on activities (deposits, withdrawals, loans, transfers); paragraph on importance (safety, savings, loans for businesses, paying bills); conclusion.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Plan an essay on the activities and importance of banks.","steps":["Introduction: a bank keeps and lends money.","Activities: deposits, withdrawals, loans, transfers, foreign exchange.","Importance: money is safe, savings grow, businesses borrow to grow, salaries are paid.","Conclusion: banks help families and the country."],"answer":"introduction → activities → importance → conclusion","checks":[]},"teach":{"cards":[{"id":"c52-1","status":"draft","idea":"Describe activities in the present simple.","vars":{},"example":["Customers deposit money at the counter."],"checks":[],"check":{"ref":"e2-52-order"}},{"id":"c52-2","status":"draft","idea":"Give reasons with firstly, secondly, moreover, finally.","vars":{},"example":["Firstly, money is safe in a bank."],"checks":[],"check":{"ref":"e2-52-order"}},{"id":"c52-3","status":"draft","idea":"End with a conclusion that sums up.","vars":{},"example":["Therefore, banks help families and the country."],"checks":[],"check":{"ref":"e2-52-order"}}]},"questions":[{"id":"e2-52-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the sentences of the essay in order.","items":[{"text":"A bank is a business that keeps and lends money."},{"text":"Every day, customers deposit and withdraw money at the counter."},{"text":"Firstly, banks keep our money safe."},{"text":"Moreover, they lend money to people who want to start a business."},{"text":"Therefore, banks help families and the whole country."}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write an essay of about 150 words in your exercise book: “The activities and importance of banks”. Use an introduction, a paragraph on activities, a paragraph on importance and a conclusion.","model":["A bank is a business that keeps people's money safely and lends money to those who need it.\n\nEvery day, many activities take place in a bank. Customers queue at the counters to deposit or withdraw money. Clerks check identity cards and count notes. Some customers ask for loans to build houses or start businesses, while others transfer money to relatives in other towns. Many people use the ATM outside.\n\nBanks are very important. Firstly, money kept in a bank is safe from thieves and fire. Secondly, savings earn interest. Moreover, loans help people to start businesses, which create jobs. Finally, companies pay their workers' salaries through banks.\n\nTherefore, banks help families and the whole country to develop."],"checklist":["My introduction says what a bank is.","I described activities in the present simple.","I gave reasons with linking words.","I wrote a conclusion.","My paragraphs each have one main idea."]}},"53":{"subject":"english-language","class":"Form 2","lesson_no":53,"language":"en","prerequisites":[],"skills":[{"id":"e2-53","name":"Talking about sporting infrastructure; reading about new stadiums"}],"note":{"status":"draft","text":"Text: New stadiums for Cameroon\nWhen Cameroon hosted the Africa Cup of Nations in 2022, new stadiums were built, such as the Olembe stadium in Yaoundé and the Japoma stadium in Douala, and older ones were renovated. Besides the main pitch, these sports complexes have training grounds, changing rooms, a medical centre and stands for thousands of spectators. But good infrastructure must be maintained: grass must be cut and watered, seats repaired and toilets cleaned. Many young people also need small facilities near their homes: a basketball court in the quarter, a handball court at school, a running track. \"A stadium is not only for big matches,\" says a coach in Buea. \"It is where talents grow.\"\n\nSporting infrastructure means the buildings and grounds for sport: stadiums, pitches, courts, tracks, swimming pools, gymnasiums. They need maintenance (care and repairs).","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Name three facilities of a sports complex from the text.","steps":["Find the sentence that begins “Besides the main pitch”.","training grounds, changing rooms, a medical centre, stands"],"answer":"training grounds, changing rooms, a medical centre","checks":[]},"teach":{"cards":[{"id":"c53-1","status":"draft","idea":"Infrastructure for sport: stadiums, pitches, courts, tracks, pools.","vars":{},"example":["A basketball court in the quarter."],"checks":[],"check":{"ref":"e2-53-words"}},{"id":"c53-2","status":"draft","idea":"Find details in the text.","vars":{},"example":["The Japoma stadium is in Douala."],"checks":[],"check":{"ref":"e2-53-text"}},{"id":"c53-3","status":"draft","idea":"Infrastructure must be maintained.","vars":{},"example":["Grass cut and watered, seats repaired."],"checks":[],"check":{"id":"e2-53-idea-card","type":"m prove."},{"q":"what do young people need near their homes?","r":"small facilities like courts and tracks","w":["only big stadiums","more spectators","new hospitals"],"e":["The text asks for small facilities.","The text does not say that.","The text is about sport."],"y":"A basketball court, a handball court, a running track."}]}},"prompt":"Text “New stadiums for Cameroon”: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-53-spot","type":"spot_error","level":3,"review":"authored","sources":["reading-texts"],"prompt":"Text “New stadiums for Cameroon”. Which statement is wrong?","pool":{"right":[{"text":"The Japoma stadium is in Douala.","truth":"true"},{"text":"The sports complexes have changing rooms.","truth":"true"},{"text":"Infrastructure must be maintained.","truth":"true"},{"text":"Young people need courts near their homes.","truth":"true"}],"wrong":[{"text":"The stadiums need no maintenance.","truth":"false","explain":"The text says grass must be cut, seats repaired, toilets cleaned."},{"text":"The coach says a stadium is only for big matches.","truth":"false","explain":"He says it is not only for big matches."},{"text":"The Olembe stadium is in Buea.","truth":"false","explain":"It is in Yaoundé."}]},"pick":{"right":3,"wrong":1}}]},"54":{"subject":"english-language","class":"Form 2","lesson_no":54,"language":"en","prerequisites":[53],"skills":[{"id":"e2-54","name":"Kinds of sporting infrastructure and facilities"}],"note":{"status":"draft","text":"Each sport has its place: football and rugby are played on a pitch (a field); basketball, volleyball, handball and tennis on a court; swimming in a pool; running on a track; boxing in a ring; gymnastics in a gymnasium (gym).\nA
