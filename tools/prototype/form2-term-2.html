onceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-54-spot","type":"spot_error","level":3,"review":"authored","sources":["vocabulary"],"prompt":"Which sentence is wrong?","pool":{"right":[{"text":"Football is played on a pitch.","truth":"true"},{"text":"Boxers fight in a ring.","truth":"true"},{"text":"Spectators sit in the stands.","truth":"true"},{"text":"Tennis is played on a court.","truth":"true"}],"wrong":[{"text":"Swimmers race on a court.","truth":"false","explain":"Swimmers race in a pool."},{"text":"The groundsman controls the match.","truth":"false","explain":"The referee controls the match; the groundsman looks after the pitch."},{"text":"Basketball is played in a pool.","truth":"false","explain":"Basketball is played on a court."}]},"pick":{"right":3,"wrong":1}}]},"55":{"subject":"english-language","class":"Form 2","lesson_no":55,"language":"en","prerequisites":[],"skills":[{"id":"e2-55","name":"Pronouns"}],"note":{"status":"draft","text":"A pronoun replaces a noun so that we do not repeat it.\n• Subject pronouns (before the verb): I, you, he, she, it, we, they — She plays handball.\n• Object pronouns (after a verb or a preposition): me, you, him, her, it, us, them — The coach chose her. Come with us.\n• Possessive pronouns (stand alone): mine, yours, his, hers, ours, theirs — This ball is mine. (Possessive adjectives come before a noun: my ball.)\n• Reflexive pronouns (the same person as the subject): myself, yourself, himself, herself, itself, ourselves, yourselves, themselves — He hurt himself.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Replace the nouns: “Ayuk gave the ball to Ngum and Tabe. The ball belongs to Ayuk.”","steps":["Ayuk → He; the ball → it; Ngum and Tabe → them.","He gave it to them. It is his."],"answer":"He gave it to them. It is his.","checks":[]},"teach":{"cards":[{"id":"c55-1","status":"draft","idea":"Subject pronoun before the verb; object pronoun after it.","vars":{},"example":["They watched him."],"checks":[],"check":{"ref":"e2-55-obj"}},{"id":"c55-2","status":"draft","idea":"Possessive pronouns stand alone: mine, yours, his, hers, ours, theirs.","vars":{},"example":["This racket is hers."],"checks":[],"check":{"ref":"e2-55-poss"}},{"id":"c55-3","status":"draft","idea":"Reflexive pronouns end in -self or -selves.","vars":{},"example":["We enjoyed ourselves."],"checks":[],"check":{"id":"e2-55-ref-card","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"The goalkeeper hurt ___ during the match.","a":"himself","w":["hisself","him"],"e":["The correct form is himself.","The subject and object are the same person: himself."]},{"s":"We enjoyed ___ at the stadium.","a":"ourselves","w":["ourself","us"],"e":["With we, the form is ourselves.","Use the reflexive: ourselves."]},{"s":"The players trained by ___.","a":"themselves","w":["theirselves","them"],"e":["The correct form is themselves.","Use the reflexive: themselves."]}]}},"prompt":"Choose the reflexive pronoun.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]}}]},"questions":[{"id":"e2-55-obj","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"The coach called Bih and ___.","a":"me","w":["I","my"],"e":["After a verb, use the object pronoun: me.","“My” needs a noun after it."]},{"s":"___ trained every evening for the match.","a":"We","w":["Us","Our"],"e":["Before the verb, use the subject pronoun: We.","“Our” needs a noun after it."]},{"s":"The referee showed ___ a yellow card. (Tabe)","a":"him","w":["he","his"],"e":["After the verb, use the object pronoun.","“His” shows possession."]},{"s":"Give the ball to ___. (the girls)","a":"them","w":["they","their"],"e":["After “to”, use the object pronoun.","“Their” needs a noun after it."]}]}},"prompt":"Choose the correct pronoun.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-55-poss","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"This jersey is not yours; it is ___.","a":"mine","w":["my","me"],"e":["“My” needs a noun after it.","“Me” is an object pronoun."]},{"s":"The red ball belongs to Ngum. It is ___.","a":"hers","w":["her","she"],"e":["“Her” needs a noun after it here.","“She” is a subject pronoun."]},{"s":"Our team won; the cup is ___.","a":"ours","w":["our","us"],"e":["“Our” needs a noun after it.","“Us” is an object pronoun."]}]}},"prompt":"Choose the possessive pronoun.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-55-ref","type":"cloze","level":2,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"The goalkeeper hurt ___ during the match.","a":"himself","w":["hisself","him"],"e":["The correct form is himself.","The subject and object are the same person: himself."]},{"s":"We enjoyed ___ at the stadium.","a":"ourselves","w":["ourself","us"],"e":["With we, the form is ourselves.","Use the reflexive: ourselves."]},{"s":"The players trained by ___.","a":"themselves","w":["theirselves","them"],"e":["The correct form is themselves.","Use the reflexive: themselves."]}]}},"prompt":"Choose the reflexive pronoun.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-55-spot","type":"spot_error","level":3,"review":"authored","sources":["grammar-tenses"],"prompt":"Which sentence has a pronoun mistake?","pool":{"right":[{"text":"She plays basketball with us.","truth":"true"},{"text":"This ball is mine.","truth":"true"},{"text":"They prepared themselves for the race.","truth":"true"},{"text":"The coach praised him.","truth":"true"}],"wrong":[{"text":"Me and Tabe went to the stadium.","truth":"false","explain":"As a subject, use I: Tabe and I went."},{"text":"The trophy is our's.","truth":"false","explain":"Possessive pronouns have no apostrophe: ours."},{"text":"He hurt hisself.","truth":"false","explain":"The correct form is himself."}]},"pick":{"right":3,"wrong":1}}]},"56":{"subject":"english-language","class":"Form 2","lesson_no":56,"language":"en","prerequisites":[53,54],"skills":[{"id":"e2-56","name":"Describing a sports facility; writing an expository essay"}],"note":{"status":"draft","text":"To describe a place, go from the general to the details and use place words: in front of, behind, on the left, around, opposite. Use adjectives and the present tense.\nAn expository essay explains a topic with facts and reasons, not a story: introduction (the topic and why it matters); body paragraphs (one idea each: uses, benefits, problems, solutions); conclusion.\nLinking words: firstly, in addition, for example, however, as a result, in conclusion.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Plan an expository essay: “The importance of sports infrastructure in my town”.","steps":["Introduction: our town has a stadium and some courts; they matter.","Body: they keep young people healthy; they bring jobs and visitors; they need maintenance.","Conclusion: the town should maintain them and build small courts in the quarters."],"answer":"introduction → body (one idea per paragraph) → conclusion","checks":[]},"teach":{"cards":[{"id":"c56-1","status":"draft","idea":"Describe from the general to the details, with place words.","vars":{},"example":["In front of the stands is a green pitch."],"checks":[],"check":{"ref":"e2-56-order"}},{"id":"c56-2","status":"draft","idea":"An expository essay explains with facts and reasons.","vars":{},"example":["Firstly, sport keeps young people healthy."],"checks":[],"check":{"ref":"e2-56-order"}},{"id":"c56-3","status":"draft","idea":"One idea per body paragraph.","vars":{},"example":["Paragraph on health; paragraph on jobs."],"checks":[],"check":{"ref":"e2-56-order"}}]},"questions":[{"id":"e2-56-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the sentences of the essay in order.","items":[{"text":"Our town has a stadium and two basketball courts."},{"text":"Firstly, these facilities keep young people healthy and busy."},{"text":"In addition, matches bring visitors and money to the town."},{"text":"However, the pitch is badly maintained."},{"text":"In conclusion, we must look after our sports infrastructure."}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"In your exercise book, describe a sports facility you know (about 80 words), then write an expository essay of about 150 words: “The importance of sports infrastructure in my town”.","model":["Description: Our school sports ground lies behind the classrooms. In the middle is a large football pitch with white lines and two goal posts. Around it runs a red track. On the left there is a basketball court with a cement floor, and opposite it a small shed where the equipment is kept.\n\nEssay: Our town has a stadium and two basketball courts. These facilities are very important. Firstly, they keep young people healthy and away from bad company. In addition, matches bring visitors, and traders sell food and drinks. For example, during the inter-school games the stadium is full every afternoon. However, the pitch has holes and the toilets do not work. As a result, some games are cancelled. In conclusion, our council should maintain the stadium and build more courts in the quarters."],"checklist":["My description goes from general to details.","I used place words.","My essay has an introduction, body paragraphs and a conclusion.","Each body paragraph has one idea.","I used linking words.","My essay explains; it does not tell a story."]}},"57":{"subject":"english-language","class":"Form 2","lesson_no":57,"language":"en","prerequisites":[],"skills":[{"id":"e2-57","name":"Talking about refuse disposal; reading about rubbish collection"}],"note":{"status":"draft","text":"Text: Who will collect the rubbish?\nIn our town, the council's trucks collect refuse from large bins along the main roads. But many quarters have no bins, so people throw their rubbish into gutters, rivers or empty plots. When it rains, the blocked gutters overflow and flood the houses. Some people burn their rubbish, and the smoke makes children cough. The trucks are too few and they sometimes do not come for a week. Last month, the youths of our quarter organised a clean-up campaign. They cleared the gutters, put up signs saying \"No dumping\", and asked the council to place a bin at the junction. Now every family carries its rubbish there in a closed bag.\n\nWords: refuse (rubbish, garbage), a bin, a dump, to dispose of, a gutter, to overflow, a clean-up campaign, biodegradable, recycling.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"What problems does rubbish cause in the text?","steps":["Find what happens when people throw rubbish anywhere or burn it.","Blocked gutters overflow and flood houses; smoke makes children cough."],"answer":"floods from blocked gutters; smoke that makes children cough","checks":[]},"teach":{"cards":[{"id":"c57-1","status":"draft","idea":"Refuse means rubbish; to dispose of it means to get rid of it.","vars":{},"example":["Dispose of your refuse in a bin."],"checks":[],"check":{"ref":"e2-57-words"}},{"id":"c57-2","status":"draft","idea":"Find causes and effects in the text.","vars":{},"example":["Blocked gutters (cause) → floods (effect)."],"checks":[],"check":{"ref":"e2-57-text"}},{"id":"c57-3","status":"draft","idea":"The youths found solutions: clean-up, signs, a bin.","vars":{},"example":["“No dumping” signs."],"checks":[],"check":{"id":"e2-57-idea-card","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"what is the main lesson?","r":"people can solve the rubbish problem by working together with the council","w":["burning rubbish is the best solution","only the council can do anything","rubbish causes no problems"],"e":["The smoke makes children cough.","The youths acted themselves.","It causes floods and smoke."],"y":"The youths and the council together found a solution."},{"q":"why is burning rubbish a bad idea?","r":"the smoke harms people's health","w":["it is too slow","it is illegal to light fires","it makes the gutters overflow"],"e":["The text speaks about health.","The text does not say that.","Blocked gutters do that."],"y":"“the smoke makes children cough.”"}]}},"prompt":"Text “Who will collect the rubbish?”: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"e2-57-words","type":"mcq","level":1,"review":"authored","sources":["vocabulary"],"vars":{"X":{"pick":[{"q":"What is refuse?","r":"rubbish or garbage","w":["a refusal","a kind of truck","rain water"],"e":["Here refuse (stress on RE-) means rubbish.","Trucks collect it.","That is different."],"y":"Refuse is another word for rubbish."},{"q":"What does “to dispose of” mean?","r":"to get rid of","w":["to buy","to keep","to clean"],"e":["That is the opposite.","That is the opposite.","Cleaning is different."],"y":"Dispose of your rubbish properly."},{"q":"What is a clean-up campaign?","r":"an organised effort by people to clean a place","w":["a football match","a political meeting","a kind of bin"],"e":["It is about cleaning.","It is about cleaning.","A bin is a container."],"y":"People work together to clean."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-57-text","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"why do gutters overflow?","r":"they are blocked with rubbish","w":["the trucks drive in them","they are too wide","children play in them"],"e":["The text does not say that.","The text does not say that.","The text does not say that."],"y":"Rubbish blocks the gutters."},{"q":"what did the youths ask the council for?","r":"a bin at the junction","w":["more money","a new school","a football pitch"],"e":["The text does not say that.","The text does not say that.","The text does not say that."],"y":"They asked for a bin at the junction."}]}},"prompt":"Text “Who will collect the rubbish?”: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-57-idea","type":"mcq","level":2,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"what is the main lesson?","r":"people can solve the rubbish problem by working together with the council","w":["burning rubbish is the best solution","only the council can do anything","rubbish causes no problems"],"e":["The smoke makes children cough.","The youths acted themselves.","It causes floods and smoke."],"y":"The youths and the council together found a solution."},{"q":"why is burning rubbish a bad idea?","r":"the smoke harms people's health","w":["it is too slow","it is illegal to light fires","it makes the gutters overflow"],"e":["The text speaks about health.","The text does not say that.","Blocked gutters do that."],"y":"“the smoke makes children cough.”"}]}},"prompt":"Text “Who will collect the rubbish?”: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-57-spot","type":"spot_error","level":3,"review":"authored","sources":["reading-texts"],"prompt":"Text “Who will collect the rubbish?”. Which statement is wrong?","pool":{"right":[{"text":"The council's trucks collect refuse from bins.","truth":"true"},{"text":"Some people burn their rubbish.","truth":"true"},{"text":"The youths cleared the gutters.","truth":"true"},{"text":"Families now take rubbish to the bin in closed bags.","truth":"true"}],"wrong":[{"text":"Every quarter has many bins.","truth":"false","explain":"Many quarters have no bins."},{"text":"The trucks come every day without fail.","truth":"false","explain":"They sometimes do not come for a week."},{"text":"The youths threw rubbish into the river.","truth":"false","explain":"They organised a clean-up."}]},"pick":{"right":3,"wrong":1}}]},"58":{"subject":"english-language","class":"Form 2","lesson_no":58,"language":"en","prerequisites":[],"skills":[{"id":"e2-58","name":"Punctuation (1)"}],"note":{"status":"draft","text":"• Capital letter: at the start of a sentence and for proper nouns.\n• Full stop (.): at the end of a statement.\n• Question mark (?): at the end of a direct question.\n• Exclamation mark (!): after a strong feeling or a sharp order: What a dirty street! Stop!\n• Comma (,): between items in a list (paper, plastic and glass), after an introductory word (However, …), around a name in direct address (Ayuk, come here.).\n• Apostrophe (’): for a missing letter (don't, it's = it is) and for possession (the council's trucks, the youths' campaign).","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Punctuate: “ayuk did you see the councils truck it didnt come”","steps":["Capital A; comma after the name in direct address; question mark.","Possession: council's; contraction: didn't."],"answer":"Ayuk, did you see the council's truck? It didn't come.","checks":[]},"teach":{"cards":[{"id":"c58-1","status":"draft","idea":"A statement ends with a full stop; a question with a question mark.","vars":{},"example":["Where is the bin? It is at the junction."],"checks":[],"check":{"ref":"e2-58-end"}},{"id":"c58-2","status":"draft","idea":"Commas separate items in a list.","vars":{},"example":["paper, plastic and glass"],"checks":[],"check":{"ref":"e2-58-comma"}},{"id":"c58-3","status":"draft","idea":"The apostrophe shows a missing letter or possession.","vars":{},"example":["don't; the council's truck"],"checks":[],"check":{"id":"e2-58-apos-card","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"The ___ trucks are too few.","a":"council's","w":["councils","councils'"],"e":["One council owns the trucks: council's.","One council, so the apostrophe goes before s."]},{"s":"___ raining: bring the rubbish inside.","a":"It's","w":["Its","Its'"],"e":["It's = it is.","That form does not exist."]},{"s":"We ___ burn rubbish.","a":"don't","w":["dont","do'nt"],"e":["The apostrophe replaces the o of not.","The apostrophe goes where the letter is missing."]}]}},"prompt":"Choose the correct form.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions": ucks today. (there is + singular, there are + plural)\n• one, you, they: for people in general: One should not litter. You never know. They say the council will buy new trucks.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Choose it or there: “___ is dangerous to burn plastic.” “___ are three bins in our street.”","steps":["The first introduces an idea: It is dangerous …","The second says that things exist: There are three bins."],"answer":"It … There …","checks":[]},"teach":{"cards":[{"id":"c59-1","status":"draft","idea":"It for weather, time and to introduce an idea.","vars":{},"example":["It is important to sort rubbish."],"checks":[],"check":{"ref":"e2-59-it"}},{"id":"c59-2","status":"draft","idea":"There is / there are say that something exists.","vars":{},"example":["There are two bins."],"checks":[],"check":{"ref":"e2-59-there"}},{"id":"c59-3","status":"draft","idea":"One, you, they can mean people in general.","vars":{},"example":["One should not litter."],"checks":[],"check":{"id":"e2-59-one-card","type":"mcq","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"q":"One should not throw rubbish in the street.","r":"people in general","w":["one particular person","the speaker only","a number"],"e":["It is a general rule.","It is for everyone.","Here one is a pronoun."],"y":"One means anybody."},{"q":"They say the council will buy new trucks.","r":"people in general","w":["the council members","the trucks","the speaker"],"e":["They here is not a group we can name.","Trucks do not speak.","The speaker is not they."],"y":"They say = people say."}]}},"prompt":"In “{X.q}”, who is the pronoun about?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"e2-59-it","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"___ is raining, so the gutters are full.","a":"It","w":["There","One"],"e":["Weather uses it.","One is for people in general."]},{"s":"___ is important to wash your hands.","a":"It","w":["There","They"],"e":["It introduces the idea.","They is not used to introduce an idea."]},{"s":"___ is six o'clock: the truck is late.","a":"It","w":["There","One"],"e":["Time uses it.","One is for people in general."]}]}},"prompt":"Choose the impersonal pronoun.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-59-there","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"___ a big bin at the market.","a":"There is","w":["There are","It is"],"e":["One bin: there is.","To say something exists, use there."]},{"s":"___ many plastic bags in the river.","a":"There are","w":["There is","It are"],"e":["Many bags: there are.","That form is wrong."]}]}},"prompt":"Choose the correct words.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-59-one","type":"mcq","level":2,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"q":"One should not throw rubbish in the street.","r":"people in general","w":["one particular person","the speaker only","a number"],"e":["It is a general rule.","It is for everyone.","Here one is a pronoun."],"y":"One means anybody."},{"q":"They say the council will buy new trucks.","r":"people in general","w":["the council members","the trucks","the speaker"],"e":["They here is not a group we can name.","Trucks do not speak.","T  cut grass and collect plastic.","Result: fewer mosquitoes, no floods, a beautiful quarter.","Conclusion: everyone should take part."],"answer":"topic sentence → supporting sentences → concluding sentence","checks":[]},"teach":{"cards":[{"id":"c60-1","status":"draft","idea":"Start with a topic sentence that gives the main idea.","vars":{},"example":["Human investment keeps our quarter clean."],"checks":[],"check":{"ref":"e2-60-order"}},{"id":"c60-2","status":"draft","idea":"Support it with reasons and examples.","vars":{},"example":["We clear the gutters every month."],"checks":[],"check":{"ref":"e2-60-order"}},{"id":"c60-3","status":"draft","idea":"End with a concluding sentence.","vars":{},"example":["Everyone should take part."],"checks":[],"check":{"ref":"e2-60-order"}}]},"questions":[{"id":"e2-60-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the sentences of the paragraph in order.","items":[{"text":"Human investment keeps our quarter clean and healthy."},{"text":"On the last Saturday of each month we clear the gutters."},{"text":"We also cut the grass and collect plastic bags."},{"text":"As a result, there are fewer mosquitoes and no floods."},{"text":"Everyone should take part in this work."}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write a paragraph of about 100 words in your exercise book on “Human investment” or “Keeping our environment clean”.","model":["Human investment keeps our quarter clean and healthy. On the last Saturday of each month, men, women and children come out with hoes, brooms and wheelbarrows. We clear the gutters, cut the tall grass and collect plastic bags from the roadside. The youths carry the rubbish to the bin at the junction. As a result, there are fewer mosquitoes and the gutters no longer overflow when it rains. Our quarter is also more beautiful, and visitors notice it. Human investment costs no money, but it needs everybody's effort. Everyone should take part."],"checklist":["My paragraph has one main idea.","I began with a topic sentence.","I gave reasons and examples.","I used linking words.","I ended with a concluding sentence."]}},"61":{"subject":"english-language","class":"Form 2","lesson_no":61,"language":"en","prerequisites":[],"skills":[{"id":"e2-61","name":"Talking about progress in science; reading about telehealth"}],"note":{"status":"draft","text":"Text: A hospital in my bedroom\nWhen my grandfather's heart problem came back, we did not travel to the city. A nurse from the health centre brought a small machine and attached it to his chest. The recording was sent by phone to a heart specialist three hundred kilometres away, who read it within an hour and changed his medicine. This is telehealth: using phones, computers and the internet to give health care at a distance. In some big hospitals, robots now help surgeons to operate with great precision, and computers help doctors to read X-rays. But machines do not replace people: the nurse still came to our house, explained everything and held my grandfather's hand.\n\nWords: technology, invention, a robot, telehealth (telemedicine), a specialist, a device, at a distance, precision.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"What is telehealth, according to the text?","steps":["Find the sentence that begins “This is telehealth”.","Using phones, computers and the internet to give health care at a distance."],"answer":"health care at a distance using phones, computers and the internet","checks":[]},"teach":{"cards":[{"id":"c61-1","status":"draft","idea":"Telehealth gives health care at a distance with phones and computers.","vars":{},"example":["A specialist far away reads a recording."],"checks":[],"check":{"ref":"e2-61-words"}},{"id":"c61-2","status":"draft","idea":"Robots help surgeons; computers help read X-rays.","vars":{},"example":["Robots operate with great precision."],"checks":[],"check":{"ref":"e2-61-text"}},{" gs)?","r":"bark (of a tree) / bark (of a dog)","w":["sea / see","write / right","big / large"],"e":["They are spelt differently: homophones.","They are spelt differently: homophones.","They mean the same: synonyms."],"y":"Same spelling and sound, different meanings."},{"q":"Which pair are homophones (same sound, different spelling)?","r":"hear / here","w":["bank / bank","ring / ring","hot / cold"],"e":["Same spelling: homonyms.","Same spelling: homonyms.","Opposite meanings: antonyms."],"y":"They sound the same but are spelt differently."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-62-spot","type":"spot_error","level":3,"review":"authored","sources":["vocabulary"],"prompt":"Which statement is wrong?","pool":{"right":[{"text":"“Bank” can mean the side of a river.","truth":"true"},{"text":"Homonyms are spelt the same.","truth":"true"},{"text":"We use the context to find the meaning of a homonym.","truth":"true"},{"text":"“Spring” can be a season.","truth":"true"}],"wrong":[{"text":"Homonyms are always spelt differently.","truth":"false","explain":"Homonyms are spelt the same; homophones are spelt differently."},{"text":"“Sea” and “see” are homonyms.","truth":"false","explain":"They are homophones (different spelling)."},{"text":"“Bark” has only one meaning.","truth":"false","explain":"It is the covering of a tree, or the sound of a dog."}]},"pick":{"right":3,"wrong":1}}]},"63":{"subject":"english-language","class":"Form 2","lesson_no":63,"language":"en","prerequisites":[],"skills":[{"id":"e2-63","name":"The indefinite and definite articles"}],"note":{"status":"draft","text":"Indefinite articles: a / an, for one thing that is not yet known: a robot, an invention.\nUse an before a vowel SOUND, a before a consonant SOUND: an engineer, an hour (h is silent), an honest man; but a university, a uniform, a European (they start with the sound /j/), a one-way street.\nDefinite article: the, for something already known or the only one: I saw a robot. The robot was carrying medicine. The sun, the internet, the best doctor.\nNo article before most uncountable nouns used in general (Science is useful) or before names of people, towns and countries (Cameroon, Buea).","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Choose a or an: ___ hour, ___ university, ___ engineer.","steps":["Listen to the first sound: hour starts with a vowel sound (h is silent) → an.","university starts with /j/ → a. engineer starts with a vowel sound → an."],"answer":"an hour, a university, an engineer","checks":[]},"teach":{"cards":[{"id":"c63-1","status":"draft","idea":"Use an before a vowel sound, a before a consonant sound.","vars":{},"example":["{article('hour')} hour, {article('university')} university"],"checks":[],"check":{"ref":"e2-63-aan"}},{"id":"c63-2","status":"draft","idea":"Use the for something already mentioned or the only one.","vars":{},"example":["I bought a phone. The phone is new."],"checks":[],"check":{"ref":"e2-63-the"}},{"id":"c63-3","status":"draft","idea":"No article before names of people, towns and countries.","vars":{},"example":["She studied in Buea, in Cameroon."],"checks":[],"check":{"id":"e2-63-none-card","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"My cousin lives in ___ Douala.","a":"∅","w":["the","a"],"e":["No article before a town's name.","No article before a town's name."]},{"s":"___ science helps us to live longer.","a":"∅","w":["The","A"],"e":["Science in general takes no article.","Science is uncountable: no a."]},{"s":"We use ___ internet to talk to the doctor.","a":"the","w":["∅","an"],"e":["We say the internet.","We say the internet."]}]}},"prompt":"Choose the article, or ∅ for no article.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]}}]},"questions":[{"id":"e2-63-aan","type":"cloze","level":1,"review":"rule","sources":["grammar-tenses"],"vars":{"w":{"pick":["hour","university","umbrella","uniform","egg","robot","honest man","European doctor","onion","hospital","engineer","year","invention","useful machine","old computer"]}},"prompt":"Choose a or an.","text":"The scientist showed us ___ {w}.","answer":"article(w)","choices":[{"text":"{article(w) == 'a' ? 'an' : 'a'}","misconception":"sound"},{"text":"the","misconception":"the"}],"misconceptions":[{"id":"sound","explain":"Listen to the first sound of “{w}”: {article(w) == 'an' ? 'it is a vowel sound' : 'it is a consonant sound'}."},{"id":"the","explain":"We do not know which one yet: it is the first time we mention it, so use a or an."}]},{"id":"e2-63-the","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"I saw a robot in the hospital. ___ robot was carrying medicine.","a":"The","w":["A","An"],"e":["The robot is already known: the.","Robot starts with a consonant, and it is already known."]},{"s":"___ sun gives us light and heat.","a":"The","w":["A","An"],"e":["There is only one sun: the.","There is only one sun: the."]},{"s":"She is ___ best student in our class.","a":"the","w":["a","an"],"e":["With best (a superlative), use the.","With best, use the."]}]}},"prompt":"Choose the article.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-63-none","type":"cloze","level":2,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"My cousin lives in ___ Douala.","a":"∅","w":["the","a"],"e":["No article before a town's name.","No article before a town's name."]},{"s":"___ science helps us to live longer.","a":"∅","w":["The","A"],"e":["Science in general takes no article.","Science is uncountable: no a."]},{"s":"We use ___ internet to talk to the doctor.","a":"the","w":["∅","an"],"e":["We say the internet.","We say the internet."]}]}},"prompt":"Choose the article, or ∅ for no article.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-63-spot","type":"spot_error","level":3,"review":"authored","sources":["grammar-tenses"],"prompt":"Which sentence has an article mistake?","pool":{"right":[{"text":"An engineer repaired the machine.","truth":"true"},{"text":"She waited for an hour.","truth":"true"},{"text":"A university opened in our town.","truth":"true"},{"text":"The internet is useful.","truth":"true"}],"wrong":[{"text":"He wore an uniform.","truth":"false","explain":"Uniform starts with the sound /j/: a uniform."},{"text":"She is a honest woman.","truth":"false","explain":"The h is silent: an honest woman."},{"text":"They live in the Cameroon.","truth":"false","explain":"No article before Cameroon."}]},"pick":{"right":3,"wrong":1}}]},"64":{"subject":"english-language","class":"Form 2","lesson_no":64,"language":"en","prerequisites":[61],"skills":[{"id":"e2-64","name":"Writing a biography of a scientist"}],"note":{"status":"draft","text":"A biography is the story of a person's life written by someone else. It is in the third person (he, she) and mostly in the simple past.\nPlan: birth and early life (where, when, family); education; the invention or discovery (what it is, why it matters); later life and honours; why you admire the person.\nUse time words: in 1847, as a child, later, after that, finally. Check facts in a book or ask your teacher.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Plan a biography of a scientist.","steps":["Early life: born in …, family, childhood interest.","Education: school, university.","Invention or discovery: what, when, why it matters.","Later life and honours.","Why I admire him or her."],"answer":"early life → education → invention → later life → opinion","checks":[]},"teach":{"cards":[{"id":"c64-1","status":"draft","idea":"A biography is in the third person and the simple past.","vars":{},"example":["She was born in a small village."],"checks":[],"check":{"ref":"e2-64-order"}},{"id":"c64-2","status":"draft","idea":"Follow the order of the person's life.","vars":{},"example":["Early life → education → work"],"checks":[],"check":{"ref":"e2-64-order"}},{"id":"c64-3","status":"draft","idea":"Explain why the invention matters.","vars":{},"example":["It lets doctors read heart tests from far away."],"checks":[],"check":{"ref":"e2-64-order"}}]},"questions":[{"id":"e2-64-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the parts of the biography in order.","items":[{"text":"Arthur Zang was born in Cameroon and loved electronics as a boy."},{"text":"He studied computer engineering at university."},{"text":"He invented the Cardiopad, a tablet that sends heart tests to doctors far away."},{"text":"His invention has received international awards."},{"text":"I admire him because he used science to help patients in villages."}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write a biography (about 150 words) in your exercise book of a scientist or inventor you admire. Follow the order of his or her life and explain the importance of the invention or discovery.","model":["Arthur Zang is a Cameroonian engineer. As a boy he loved taking radios apart to see how they worked. He studied computer engineering at university in Yaoundé.\n\nWhile he was a student, he saw that many patients with heart problems lived far from a heart specialist. He decided to help them. He invented the Cardiopad, a touch-screen tablet that records a patient's heart test in a village health centre and sends it to a specialist in the city.\n\nHis invention has won international prizes, and it is used in several health centres. I admire him because he used science to bring care to people who live far from big hospitals."],"checklist":["My biography is in the third person.","I used the simple past for his or her life.","I followed the order of the person's life.","I explained why the invention or discovery matters.","I said why I admire the person."]}},"65":{"subject":"english-language","class":"Form 2","lesson_no":65,"language":"en","prerequisites":[],"skills":[{"id":"e2-65","name":"Talking about climate change; reading about global warming and natural hazards"}],"note":{"status":"draft","text":"Text: A warmer world\nThe Earth is getting warmer. When we burn wood, petrol and coal, and when forests are cut down, more carbon dioxide stays in the air and traps the sun's heat, like the glass of a greenhouse. This is global warming. It changes the climate: the rains come late or too heavily, the dry season gets longer and hotter, and storms become stronger. In the north of Cameroon, droughts dry up wells and crops; elsewhere, heavy rains cause floods and landslides that destroy homes. We can all help: plant trees, save energy, avoid burning bushes and rubbish, and walk or share transport when we can.\n\nWords: climate (the usual weather of a place over many years), global warming, carbon dioxide, the greenhouse effect, a drought (a long time without rain), a flood, a landslide, a natural hazard (a natural danger), to adapt.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"What causes global warming, according to the text?","steps":["Find what puts more carbon dioxide in the air.","Burning wood, petrol and coal, and cutting down forests."],"answer":"burning fuels and cutting down forests","checks":[]},"teach":{"cards":[{"id":"c65-1","status":"draft","idea":"Global warming: more carbon dioxide traps heat, and the Earth gets warmer.","vars":{},"example":["Like the glass of a greenhouse."],"checks":[],"check":{"ref":"e2-65-words"}},{"id":"c65-2","status":"draft","idea":"Natural hazards: droughts, floods, landslides, storms.","vars":{},"example":["A drought is a long time without rain."],"checks":[],"check":{"ref":"e2-65-text"}},{"id":"c65-3","status":"draft","idea":"Everyone can help: plant trees, save energy, stop burning bushes.","vars":{},"example":["Plant a tree this rainy season."],"checks":[],"check":{"id":"e2-65-idea-card","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"what is the main message?","r":"people cause global warming, and people can help to reduce it","w":["nothing can be done","only rich countries feel it","global warming is good for crops"],"e":["The text lists actions.","The text gives examples in Cameroon.","Droughts destroy crops."],"y":"The text ends with what we can do."},{"q":"which action helps against global warming?","r":"planting trees","w":["burning bushes","cutting forests","burning rubbish"],"e":["That adds carbon dioxide.","That adds carbon dioxide.","That adds smoke."],"y":"Trees take in carbon dioxide."}]}},"prompt":"Text “A warmer world”: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"e2-65-words","type":"matching","level":1,"review":"authored","sources":["vocabulary"],"prompt":"Match each word to its meaning.","pool":[{"left":"climate","right":"the usual weather of a place over many years"},{"left":"a drought","right":"a long time without rain"}, s, expulsions.","Solutions: clubs, counsellors, reporting, school rules, parents' involvement.","Conclusion: everyone must act."],"answer":"introduction → causes → consequences → solutions → conclusion","checks":[]},"teach":{"cards":[{"id":"c72-1","status":"draft","idea":"Plan: problem, causes, consequences, solutions, conclusion.","vars":{},"example":["Causes: drugs and bad company."],"checks":[],"check":{"ref":"e2-72-order"}},{"id":"c72-2","status":"draft","idea":"Use complex sentences.","vars":{},"example":["Because some pupils take drugs, they become aggressive."],"checks":[],"check":{"ref":"e2-72-order"}},{"id":"c72-3","status":"draft","idea":"End with your opinion and a call to act.","vars":{},"example":["Therefore, everyone must report violence."],"checks":[],"check":{"ref":"e2-72-order"}}]},"questions":[{"id":"e2-72-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the sentences of the essay in order.","items":[{"text":"Violence and drugs are a growing problem in some schools."},{"text":"Firstly, some pupils take drugs because they want to look strong."},{"text":"As a result, they become aggressive and bully others."},{"text":"However, clubs and counsellors can help."},{"text":"Therefore, everyone must report violence at once."}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write an essay of about 180 words in your exercise book: “Violence and criminality in our schools: causes, consequences and solutions”.","model":["Violence and criminality are a growing problem in some of our schools. Fights, bullying, theft and drug abuse make many pupils afraid.\n\nThere are several causes. Firstly, some pupils take drugs because they think drugs make them strong. Secondly, bad company and violent films teach them that force is normal. Moreover, large classes make it hard for teachers to watch every pupil.\n\nThe consequences are serious. Victims are injured or frightened, and some stop coming to school. The culprits are suspended or expelled, and their results fall.\n\nHowever, there are solutions. Schools should have counsellors and anti-drug clubs, and the rules must be applied fairly. Parents should know their children's friends. Above all, pupils must report every case of violence.\n\nTherefore, if everyone acts, our schools can again be places of peace and learning."],"checklist":["My introduction presents the problem.","I gave causes, consequences and solutions in separate paragraphs.","I used complex sentences (because, although, if).","I used linking words.","My conclusion gives my opinion."]}},"73":{"subject":"english-language","class":"Form 2","lesson_no":73,"language":"en","prerequisites":[],"skills":[{"id":"e2-73","name":"Talking about pollution: types, causes and consequences"}],"note":{"status":"draft","text":"Text: An invisible enemy\nPollution is the presence of harmful substances in the air, water or soil. In our cities, old vehicles and generators release thick smoke; factories pour waste water into rivers; plastic bags block gutters and choke animals; and loud music and horns cause noise pollution. The consequences are serious: coughs and asthma, diarrhoea and cholera from dirty water, fewer fish, poorer soils and stress. Pollution can be reduced: services can check vehicle exhaust, factories can treat their waste water, families can sort and recycle rubbish, and everybody can use fewer plastic bags. Pollution is an enemy we often do not see until it makes us ill.\n\nTypes of pollution: air, water, land (soil) and noise pollution.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Give one cause and one consequence of water pollution from the text.","steps":["Cause: factories pour waste water into rivers.","Consequence: diarrhoea and cholera from dirty water, and fewer fish."],"answer":"factory waste water → diarrhoea, cholera, fewer fish","checks":[]},"teach":{"cards":[{"id":"c73-1","status":"draft","idea":"Four types of pollution: air, water, land, noise.","vars":{},"example":["Loud horns cause noise pollution."],"checks":[],"check":{"ref":"e2-73-type"}},{"id":"c73-2","status":"draft","idea":"Causes and consequences of pollution.","vars":{},"example":["Smoke (cause) → coughs and asthma (consequence)."],"checks":[],"check":{"ref":"e2-73-text"}},{"id":"c73-3","status":"draft","idea":"Pollution can be reduced by everyone.","vars":{},"example":["Use fewer plastic bags."],"checks":[],"check":{"id":"e2-73-idea-card","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"why does the writer call pollution an “invisible enemy”?","r":"we often do not notice it until it makes us ill","w":["it cannot hurt us","it only exists at night","it is a person"],"e":["It causes illness.","The text does not say that.","It is a comparison."],"y":"“an enemy we often do not see until it makes us ill.”"},{"q":"which action reduces pollution?","r":"sorting and recycling rubbish","w":["burning plastic","using more generators","pouring waste into rivers"],"e":["That adds smoke.","That adds smoke and noise.","That pollutes water."],"y":"The text lists sorting and recycling."}]}},"prompt":"Text “An invisible enemy”: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"e2-73-type","type":"mcq","level":1,"review":"authored","sources":["vocabulary"],"vars":{"X":{"pick":[{"q":"Smoke from old generators","r":"air pollution","w":["water pollution","land pollution","noise pollution"],"e":["Smoke goes into the air.","Smoke goes into the air.","Smoke is not a sound."],"y":"Smoke pollutes the air."},{"q":"A factory pours waste into a river","r":"water pollution","w":["air po ubstances in the environment."],"checks":[],"check":{"ref":"e2-76-order"}},{"id":"c76-2","status":"draft","idea":"Use relative clauses to add information.","vars":{},"example":["Factories which pour waste into rivers kill fish."],"checks":[],"check":{"ref":"e2-76-order"}},{"id":"c76-3","status":"draft","idea":"End with a call to act.","vars":{},"example":["Therefore, each of us must reduce, reuse and recycle."],"checks":[],"check":{"ref":"e2-76-order"}}]},"questions":[{"id":"e2-76-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the sentences of the essay in order.","items":[{"text":"Pollution is the presence of harmful substances in the environment."},{"text":"Firstly, vehicles which are old release thick smoke."},{"text":"As a result, many children suffer from coughs."},{"text":"However, we can reduce pollution by recycling."},{"text":"Therefore, each of us must act now."}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write an essay of about 180 words in your exercise book: “Pollution, an enemy of the environment”.","model":["Pollution is the presence of harmful substances in the air, water or soil. It is an enemy which attacks our health and our environment.\n\nThere are several types of pollution. Firstly, old vehicles and generators release smoke which pollutes the air. Secondly, factories which pour waste into rivers pollute the water. Moreover, plastic bags which people throw away pollute the land, and loud music causes noise pollution.\n\nAs a result, many people suffer from coughs and asthma, while dirty water brings cholera. Fish die and soils become poor.\n\nHowever, we can fight this enemy. We should reduce, reuse and recycle our waste, use fewer plastic bags and plant trees. Factories must treat their waste water.\n\nTherefore, each of us must act now, because a clean environment means a healthy life."],"checklist":["My introduction defines pollution.","I wrote about causes, c /** A saved lesson in progress is kept only if its flow is usable; a damaged one is dropped, never a blank page. */
const usable = (c) => c && c.flow && Array.isArray(c.flow.steps) && Array.isArray(c.rows) && Number.isInteger(c.lesson);
const cleanCurrent = (cur) => Object.fromEntries(Object.entries(cur || {}).filter(([, c]) => usable(c)));
function upgrade(s) {
  if (s.v === 2) return { ...fresh(), ...s, current: cleanCurrent(s.current) };
  if (s.v !== 1) return fresh();
  const lessons = Object.fromEntries(Object.entries(s.lessons || {}).map(([n, x]) => [`maths:${n}`, x]));
  return { ...fresh(), readiness: s.readiness || null, lessons, current: cleanCurrent({ maths: s.current }) };
}
function load() {
  try {

    return s ? upgrade(s) : fresh();

}

/** A label for the pupil: in French inside a French lesson, otherwise English. {x} are filled from v. */
const inFrench = (s) => s === "french" || s === "f2-french" || s === "f2-francais-intensif";
const T = (text, v = {}) => ((inFrench(S) && FR[text]) || text).replace(/\{(\w)\}/g, (_, k) => v[k]);

// ---------------------------------------------------------------- one question, any type
/** A typed answer box (numbers or words): Enter or "Check" submits; the engine picks the keyboard. */
function answerBox(q, finish, inline = false) {
  const input = el("input", { type: "text", inputmode: inputModeFor(q), autocomplete: "off", autocorrect: "off", autocapitalize: "off",
    spellcheck: "false", "aria-label": T("Your answer"), class: inline ? "blank-input" : "" });
  const go = () => { const v = normaliseInput(input.value, q); if (v) finish(v); };
  input.addEventListener("keydown", (e) => e.key === "Enter" && go());
  setTimeout(() => input.focus(), 50);
  return { input, check: button(T("Check"), go, "primary") };
}

/** Cloze: the sentence with its blank inline. Typed: a box in the gap. Choose: a dotted gap, options below. */
function clozeSentence(q, box = null) {
  const [before, after] = q.sentence.split("___");
  return el("div", { class: "sentence" }, before, box || el("span", { class: "blank", "aria-label": "blank" }, " "), after);
}

/** Word order: tap a word to place it; tap a placed word to send it back. The final . ? or ! is fixed. */
function wordOrder(q, finish) {
  const placed = [];
  const line = el("div", { class: "built", "aria-live": "polite" });
  const pool = el("div", { class: "tiles" });
  const done = button(T("Check"), () => placed.length === q.items.length && finish([...placed]), "primary");
  const redraw = () => {
    line.replaceChildren(...(placed.length
      ? [...placed.map((i, k) => button(q.items[i], () => { placed.splice(k, 1); redraw(); }, "tile placed")), ...(q.end ? [el("span", { class: "end" }, q.end)] : [])]
      : [el("span", { class: "muted" }, T("Tap the words below."))]));
    fill(pool, q.items.map((t, i) => (placed.includes(i) ? null : button(t, () => { placed.push(i); redraw(); }, "tile"))));
    done.disabled = placed.length !== q.items.length;
  };
  redraw();
  return [para(T("Tap a word to add it. Tap a word in your sentence to take it out."), "muted"), line, pool, done];
}

/** Matching: tap a left item, then a right item, to pair them; tap a pair to undo it. */
function matching(q, finish) {
  const pairOf = q.left.map(() => null);  // left index → right index
  let picked = null;
  const done = button(T("Check"), () => pairOf.every((r) => r !== null) && finish([...pairOf]), "primary");
  const wrap = el("div", {});
  const redraw = () => {
    const rightUsed = new Map(pairOf.map((r, l) => [r, l]).filter(([r]) => r !== null));
    const badge = (n) => el("span", { class: "badge", "aria-hidden": "true" }, String(n + 1));
    const lefts = q.left.map((t, i) => {
      const paired = pairOf[i] !== null;
      return button([paired ? badge(i) : null, t], () => {
        if (paired) pairOf[i] = null; else picked = picked === i ? null : i;
        redraw();
      }, `match${paired ? " paired" : ""}${picked === i ? " picked" : ""}`);
    });
    const rights = q.right.map((t, r) => {
      const l = rightUsed.get(r);
      return button([l !== undefined ? badge(l) : null, t], () => {
        if (l !== undefined) pairOf[l] = null;
        else if (picked !== null) { pairOf[picked] = r; picked = null; }
        redraw();
      }, `match${l !== undefined ? " paired" : ""}${picked !== null && l === undefined ? " ready" : ""}`);
    });
    wrap.replaceChildren(el("div", { class: "match-cols" }, el("div", { class: "col" }, ...lefts), el("div", { class: "col" }, ...rights)));
    done.disabled = pairOf.some((r) => r === null);
  };
  redraw();
  return [para(T("Tap an item on the left, then its partner on the right. Tap a pair to undo it."), "muted"), wrap, done];
}

/** Sorting (matching with groups): tap a word, then tap its group; tap a word inside a group to take it out. */
function sorting(q, finish) {
  const groupOf = q.left.map(() => null);
  let picked = null;
  const done = button(T("Check"), () => groupOf.every((g) => g !== null) && finish([...groupOf]), "primary");
  const wrap = el("div", {});
  const redraw = () => {
    const loose = q.left.map((t, i) => (groupOf[i] === null ? button(t, () => { picked = picked === i ? null : i; redraw(); }, `tile${picked === i ? " picked" : ""}`) : null));
    const groups = q.right.map((g, gi) => el("div", { class: `group${picked !== null ? " ready" : ""}`, role: "button", tabindex: "0",
      onclick: (e) => { if (e.target.closest(".tile") || picked === null) return; groupOf[picked] = gi; picked = null; redraw(); },
      onkeydown: (e) => { if ((e.key === "Enter" || e.key === " ") && picked !== null) { e.preventDefault(); groupOf[picked] = gi; picked = null; redraw(); } } },
      el("div", { class: "group-name" }, g),
      el("div", { class: "tiles" }, ...q.left.map((t, i) => (groupOf[i] === gi ? button(t, () => { groupOf[i] = null; redraw(); }, "tile placed") : null)))));
    wrap.replaceChildren(el("div", { class: "tiles" }, ...loose), ...groups);
    done.disabled = groupOf.some((g) => g === null);
  };
  redraw();
  return [para(T("Tap a word, then tap its group. Tap a word in a group to take it out."), "muted"), wrap, done];
}

/** Shows q; calls onAnswer({result, ms}) when the pupil answers or presses "I don't know". */
function askQuestion(q, { kicker, title, onAnswer, bar = null, back = null }) {
  const t0 = performance.now();
  const finish = (response) => onAnswer({ result: check(q, response), ms: Math.round(performance.now() - t0) });
  const body = [bar, header(kicker, title), el("div", { class: "prompt" }, q.prompt), figureBox(q.figure)];
  if (q.type === "blanks") {
    // a step-by-step line: one small box per blank, all checked together (2026-10-19)
    const inputs = q.answers.map((_, i) => el("input", { type: "text", inputmode: "numeric", autocomplete: "off", class: "blank-input", "aria-label": T("Box {a}", { a: i + 1 }) }));
    const go = () => { const v = inputs.map((x) => normaliseInput(x.value, q)); if (v.every(Boolean)) finish(v); else inputs[v.findIndex((x) => !x)].focus(); };
    inputs.forEach((x, i) => x.addEventListener("keydown", (e) => { if (e.key === "Enter") (i < inputs.length - 1 && !inputs[i + 1].value ? inputs[i + 1].focus() : go()); }));
    setTimeout(() => inputs[0].focus(), 50);
    body.push(para(T("Fill in each box, then check."), "muted"),
      el("div", { class: "sentence blanks" }, q.parts.flatMap((p, i) => (i < inputs.length ? [p, inputs[i]] : [p]))), button(T("Check"), go, "primary"));
  } else if (q.type === "numeric") {
    const { input, check: go } = answerBox(q, finish);
    body.push(el("div", { class: "answer" }, input, q.unit ? el("span", { class: "unit" }, q.unit) : null), go);
  } else if (q.type === "cloze" && q.mode === "type") {
    const { input, check: go } = answerBox(q, finish, true);
    body.push(clozeSentence(q, input), go);
  } else if (q.type === "cloze") {
    body.push(clozeSentence(q), el("div", { class: "options" }, q.options.map((o, i) => button(o.text, () => finish(i), "option"))));
  } else if (q.type === "mcq" || q.type === "spot_error") {
    if (q.type === "spot_error") body.push(para(T("Tap the one that is wrong."), "muted"));
    body.push(el("div", { class: "options" }, q.options.map((o, i) => button(o.text, () => finish(i), "option"))));
  } else if (q.type === "ordering") {
    const chosen = [];
    const list = el("ol", { class: "chosen" });
    const pool = el("div", { class: "options" });
    const redraw = () => {
      list.replaceChildren(...chosen.map((i) => el("li", {}, q.items[i])));
      fill(pool, q.items.map((t, i) => (chosen.includes(i) ? null : button(t, () => { chosen.push(i); redraw(); }, "option"))));
      if (chosen.length === q.items.length) finish([...chosen]);
    };
    body.push(para(T("Tap them in order."), "muted"), list, pool, button(T("Start again"), () => { chosen.length = 0; redraw(); }, "link"));
    redraw();
  } else if (q.type === "word_order") {
    body.push(...wordOrder(q, finish));
  } else if (q.type === "matching") {
    body.push(...(q.groups ? sorting(q, finish) : matching(q, finish)));
  }
  body.push(button(T("I don't know"), () => finish(DONT_KNOW), "idk"), back);
  screen(...body);
}

const recordOf = (q, r, ms, phase) => ({
  phase, id: q.id, level: q.level, result: r.correct ? "right" : r.dontKnow ? "idk" : "wrong",
  seconds: Math.round(ms / 100) / 10, misconception: r.misconception?.id || "",
});

// ---------------------------------------------------------------- 1. first visit: readiness check (Primary 6 maths)
function start() {
  withSubject("maths", () => screen(

    toMenu(),
  ));
}

// No feedback during the check, and no score at the end (TR-C19, approved 2026-10-03):
// the pupil sees a neutral "Let's start"; scores and weak areas appear only in "Copy results".
function readinessQ(qs, i, rows) {
  if (i >= qs.length) return readinessDone(rows);
  askQuestion(qs[i], {
    bar: progress(i + 1, qs.length), kicker: "Getting ready", title: "Primary School maths",
    onAnswer: ({ result, ms }) => {
      rows.push({ ...recordOf(qs[i], result, ms, "readiness"), template: qs[i].id, correct: result.correct });
      readinessQ(qs, i + 1, rows);
    },
  });
}

function readinessDone(rows) {

const classesHere = () => [...new Set(Object.keys(SUBJECTS).map(classOf))];
const form = () => (classesHere().includes(state.form) ? state.form : classesHere()[0]);
const inClass = (c) => Object.keys(SUBJECTS).filter((s) => classOf(s) === c);

// Each subject's colour (dark enough for white text: contrast 4.5:1 or more) and icon.
const STYLE = {
  maths: ["#1d4ed8", "🔢"], english: ["#6d28d9", "📖"], physics: ["#b45309", "⚡"], chemistry: ["#0f766e", "🧪"], geography: ["#2e7d32", "🌍"],

};

// Lesson content is loaded one subject at a time in the installed app (subjects/<id>.js); the single-file copy has
// everything already. withSubject() shows the screen as soon as the subject is ready.
const loading = {};
function loadSubject(s) {
  if (CONTENT[s]) return Promise.resolve();
  if (!loading[s]) loading[s] = new Promise((ok, fail) => {
    const tag = document.createElement("script");
    tag.src = `subjects/${s}.js?v=${VERSIONS[s] || BUILD}`;  // the file's content fingerprint: new lessons, new address
    tag.onload = () => (CONTENT[s] ? ok() : fail(new Error("empty")));
    tag.onerror = () => { delete loading[s]; tag.remove(); fail(new Error("offline")); };
    document.head.append(tag);
  });
  return loading[s];
}
function withSubject(s, show) {
  if (CONTENT[s]) return show();
  screen(header(`${iconOf(s)} ${subjectName(s)}`, "Getting the lessons ready…"), para("This takes a moment the first time.", "muted"));
  loadSubject(s).then(show, () => screen(header(`${iconOf(s)} ${subjectName(s)}`, "No connection"),
    para("These lessons are not saved on this phone yet. Connect to the internet once, then they will work offline.", "muted"),
    button("Try again", () => withSubject(s, show), "primary"), button("Back to all subjects", home, "link")));
}
const loadAll = (list) => Promise.all(list.map(loadSubject));

// ---- days, streak, stars, badges (all on this phone only)
const dayOf = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayNum = (s) => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 86400000);
/** Marks today as a learning day (called on every answer in a lesson). */
function recordDay() {
  state.days = state.days || [];
  const t = dayOf();
  if (state.days[state.days.length - 1] !== t) state.days.push(t);
}
/** Learning days in the current run; a run survives up to two days off in a row. 0 if the last learning day was too long ago. */
function streak() {
  const days = [...new Set(state.days || [])].map(dayNum).sort((a, b) => a - b);
  if (!days.length || dayNum(dayOf()) - days[days.length - 1] > 3) return 0;
  let n = 1;
  for (let i = days.length - 1; i > 0 && days[i] - days[i - 1] <= 3; i--) n++;
  return n;
}
/** Stars for a finished lesson: 3 if at least 80% of first tries were right, 2 if at least half, otherwise 1. */
function starsOf(r) {
  if (!r?.done) return 0;
  if (r.stars) return r.stars;
  const first = r.rows.filter((x) => x.phase === "practice" && x.attempt === 1);
  const asked = first.length || r.rows.filter((x) => x.attempt === 1).length;
  if (!asked) return 3;
  const right = (first.length ? first : r.rows.filter((x) => x.attempt === 1)).filter((x) => x.result === "right").length / asked;
  return right >= 0.8 ? 3 : right >= 0.5 ? 2 : 1;
}
const doneIn = (s) => LESSONS[s].filter((n) => state.lessons[lessonKey(s, n)]?.done);
const totalDone = () => Object.keys(SUBJECTS).reduce((t, s) => t + doneIn(s).length, 0);
const totalStars = () => Object.keys(SUBJECTS).reduce((t, s) => t + doneIn(s).reduce((u, n) => u + starsOf(state.lessons[lessonKey(s, n)]), 0), 0);
const starText = (k) => "★".repeat(k) + "☆".repeat(3 - k);
const BADGES = [
  ["first", "🎉", "First lesson", "Finish one lesson", () => totalDone() >= 1],
  ["five", "📚", "Bookworm", "Finish 5 lessons", () => totalDone() >= 5],
  ["ten", "🏅", "Ten lessons", "Finish 10 lessons", () => totalDone() >= 10],

  ["stars30", "⭐", "Star collector", "Collect 30 stars", () => totalStars() >= 30],
  ["stars100", "🌠", "Star shower", "Collect 100 stars", () => totalStars() >= 100],
  ["explorer", "🌈", "Explorer", "Finish a lesson in every subject of your class", () => inClass(form()).every((s) => doneIn(s).length)],
  ...Object.keys(SUBJECTS).map((s) => [`all-${s}`, iconOf(s), `All of ${subjectName(s)}`, `Finish every ${subjectName(s)} lesson`, () => doneIn(s).length === LESSONS[s].length]),
];
/** Badges earned now that were not earned before; they are kept for ever once earned. */
function newBadges() {
  state.badges = state.badges || {};
  const fresh = BADGES.filter(([id, , , , ok]) => !state.badges[id] && ok());
  for (const [id] of fresh) state.badges[id] = dayOf();
  if (fresh.length) save();
  return fresh;
}
