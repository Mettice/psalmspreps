nuse.","steps":["c² = {a}² + {b}² = {a * a} + {b * b} = {a * a + b * b}.","c = √{a * a + b * b} = {10} cm."],"answer":"c = {10} cm","checks":[],"figure":"rightTriFig(a, b, 'c')"},"teach":{"cards":[{"id":"c31-1","status":"draft","idea":"Hypotenuse² = (one side)² + (other side)².","vars":{"a":3,"b":4,"c":5},"example":["{a}² + {b}² = {a * a} + {b * b} = {c * c} = {c}²"],"checks":[],"figure":"rightTriFig(a, b, c)","check":{"ref":"m2-31-hyp"}},{"id":"c31-2","status":"draft","idea":"To find a shorter side, subtract: a² = c² − b².","vars":{"a":5,"b":12,"c":13},"example":["{c}² − {b}² = {c * c - b * b} = {a}²"],"checks":[],"check":{"ref":"m2-31-leg"}},{"id":"c31-3","status":"draft","idea":"Converse: if the squares fit c² = a² + b², the triangle is right-angled.","vars":{"a":8,"b":15,"c":17},"example":["{a}² + {b}² = {c}², so it is right-angled."],"checks":[],"check":{"id":"m2-31-conv-card","type":"mcq","level":1,"review":"rule","sources":["triangles"],"vars":{"i":{"int":[0,11]},"k":{"int":[0,1]},"p":{"expr":"tA(i)"},"q":{"expr":"tB(i)"},"r":{"expr":"tC(i) + k"}},"prompt":"A triangle has sides {p} cm, {q} cm and {r} cm. Is it right-angled?","correct":"{isRightTriangle(p, q, r) ? 'Yes' : 'No'}","distractors":[{"text":"Yes","misconception":"w"},{"text":"No","misconception":"w"}],"misconceptions":[{"id":"w","explain":"Compare {r}² = {r * r} with {p}² + {q}² = {p * p + q * q}."}],"solution":["Longest side: {r}. {r}² = {r * r}; {p}² + {q}² = {p * p + q * q}.","{p * p + q * q == r * r ? 'They are equal: it is right-angled.' : 'They are not equal: it is not right-angled.'}","So the answer is {answer}."],"min_distractors":1}}]},"questions":[{"id":"m2-31-hyp","type":"numeric","level":1,"review":"rule","sources":["triangles"],"vars":{"i":{"int":[0,11]},"a":{"expr":"tA(i)"},"b":{"expr":"tB(i)"},"c":{"expr":"tC(i)"}},"prompt":"Find the hypotenuse of this right-angled triangle.","answer":"c","misconceptions":[{"id":"added","wrong":"a + b","explain":"Square the sides first, add, then take ludes the end: [' : '> leaves the end out: ('}."}],"solution":["x goes from {a} up to +∞; ∞ always gets a round bracket.","So {answer}."]}]},"40":{"subject":"mathematics","class":"Form 2","lesson_no":40,"language":"en","prerequisites":[],"skills":[{"id":"m2-40","name":"Direct proportion"}],"note":{"status":"draft","text":"Two quantities are in direct proportion when they increase in the same ratio: twice as many → twice the cost. Their quotient is constant (y = kx).\nUnitary method: find the value of ONE first, then multiply. If 4 exercise books cost 1 200 FCFA, one costs 1 200 ÷ 4 = 300 FCFA, so 7 cost 7 × 300 = 2 100 FCFA.\nIn a table of direct proportion, every y ÷ x gives the same number.","checks":[]},"worked_example":{"status":"draft","vars":{"k":4,"P":1200,"m":7},"problem":"{k} exercise books cost {P} FCFA. How much do {m} cost?","steps":["One book: {P} ÷ {k} = {P / k} FCFA.","{m} books: {m} × {P / k} = {m * P / k} FCFA."],"answer":"{m * P / k} FCFA","checks":[]},"teach":{"cards":[{"id":"c40-1","status":"draft","idea":"Unitary method: find the value of one, then multiply.","vars":{"k":5,"P":1000,"m":3},"example":["{k} cost {P}, so one costs {P / k} and {m} cost {m * P / k}."],"checks":[],"check":{"ref":"m2-40-cost"}},{"id":"c40-2","status":"draft","idea":"In direct proportion, y ÷ x is the same for every pair.","vars":{"a":2,"b":5,"c":3},"example":["{a} → {a * c}, {b} → {b * c}: each time × {c}."],"checks":[],"check":{"ref":"m2-40-table"}},{"id":"c40-3","status":"draft","idea":"A recipe scales the same way: multiply every amount by the same number.","vars":{"s":4,"g":300,"t":6},"example":["For {s} people {g} g; for {t} people {g * t / s} g."],"checks":[],"check":{"id":"m2-40-recipe-card","type":"numeric","level":1,"review":"rule","sources":["proportion"],"vars":{"s":{"pick":[2,4,5,6,8]},"q":{"int":[40,120]},"g":{"expr":"s * q"},"t":{"int":[3,15]}},"prompt":"A recipe for {s} people uses {g} g of rice. How much rice for {t} people?","answer":"g * t / s","miscon erest"}],"note":{"status":"draft","text":"When you save or borrow money, interest is paid for the use of the money.\nSimple interest: I = P × R × T ÷ 100, where P is the principal (the amount), R the rate per cent per year, T the time in years.\nRearranged: R = 100 × I ÷ (P × T) and T = 100 × I ÷ (P × R).\nWith simple interest, the interest is the same every year.","checks":[]},"worked_example":{"status":"draft","vars":{"P":50000,"R":5,"T":3,"hund":100},"problem":"Find the simple interest on {P} FCFA at {R} % per year for {T} years.","steps":["I = P × R × T ÷ {hund}.","I = {P} × {R} × {T} ÷ {hund} = {simpleInterest(P, R, T)} FCFA."],"answer":"{simpleInterest(P, R, T)} FCFA","checks":[]},"teach":{"cards":[{"id":"c44-1","status":"draft","idea":"I = P × R × T ÷ {hund}.","vars":{"P":20000,"R":10,"T":2,"hund":100},"example":["{P} × {R} × {T} ÷ {hund} = {simpleInterest(P, R, T)}"],"checks":[],"check":{"ref":"m2-44-i"}},{"id":"c44-2","status":"draft","idea":"The interest is the same each year: one year's interest × the number of years.","vars":{"P":30000,"R":5,"T":3},"example":["One year: {simpleInterest(P, R, 1)}; {T} years: {simpleInterest(P, R, T)}"],"checks":[],"check":{"ref":"m2-44-year"}},{"id":"c44-3","status":"draft","idea":"R = {hund} × I ÷ (P × T).","vars":{"P":40000,"T":2,"I":6400,"hund":100},"example":["{hund} × {I} ÷ ({P} × {T}) = {100 * I / (P * T)} %"],"checks":[],"check":{"id":"m2-44-rate-card","type":"numeric","level":1,"review":"rule","sources":["money"],"vars":{"P":{"pick":[20000,50000,80000,100000,150000,200000,500000]},"R":{"int":[2,12]},"T":{"int":[1,5]},"I":{"expr":"simpleInterest(P, R, T)"},"hund":100},"prompt":"{P} FCFA earns {I} FCFA simple interest in {T} years. Find the rate.","answer":"R","misconceptions":[{"id":"no-time","wrong":"R * T","explain":"Divide by the time ({T} years) too."}],"solution":["R = {hund} × I ÷ (P × T).","{hund} × {I} ÷ ({P} × {T}) = {answer} %."],"unit":"%"}}]},"questions":[{"id":"m2-44-i","type":"numeric","level":1,"review":"rule","sources":["money"],"vars":{"P":{"pick":[20000,50000,80000,100000,150000,200000,500000]},"R":{"int":[2,12]},"T":{"int":[1,5]},"hund":100},"prompt":"Find the simple interest on {P} FCFA at {R} % per year for {T} years.","answer":"simpleInterest(P, R, T)","misconceptions":[{"id":"one-year","wrong":"simpleInterest(P, R, 1)","explain":"That is the interest for one year. Multiply by {T} years."},{"id":"amount","wrong":"P + simpleInterest(P, R, T)","explain":"That is the amount (principal + interest). The question asks for the interest."}],"solution":["I = {P} × {R} × {T} ÷ {hund}.","= {answer} FCFA."],"unit":"FCFA"},{"id":"m2-44-year","type":"numeric","level":1,"review":"rule","sources":["money"],"vars":{"P":{"pick":[20000,50000,80000,100000,150000,200000,500000]},"R":{"int":[2,12]},"T":{"int":[1,5]},"hund":100},"prompt":"{P} FCFA is saved at {R} % simple interest. How much interest is earned in one year?","answer":"simpleInterest(P, R, 1)","misconceptions":[{"id":"pct","wrong":"R","explain":"The rate is {R} %: find {R} % of {P}."}],"solution":["I = {P} × {R} × {1} ÷ {hund}.","= {answer} FCFA."],"unit":"FCFA"},{"id":"m2-44-rate","type":"numeric","level":2,"review":"rule","sources":["money"],"vars":{"P":{"pick":[20000,50000,80000,100000,150000,200000,500000]},"R":{"int":[2,12]},"T":{"int":[1,5]},"I":{"expr":"simpleInterest(P, R, T)"},"hund":100},"prompt":"{P} FCFA earns {I} FCFA simple interest in {T} years. Find the rate.","answer":"R","misconceptions":[{"id":"no-time","wrong":"R * T","explain":"Divide by the time ({T} years) too."}],"solution":["R = {hund} × I ÷ (P × T).","{hund} × {I} ÷ ({P} × {T}) = {answer} %."],"unit":"%"},{"id":"m2-44-time","type":"numeric","level":3,"review":"rule","sources":["money"],"vars":{"P":{"pick":[20000,50000,80000,100000,150000,200000,500000]},"R":{"int":[2,12]},"T":{"int":[1,5]},"I":{"expr":"simpleInterest(P, R, T)"},"hund":100},"prompt":"How many years does it take for {P} FCFA to earn {I} FCFA simple interest at {R} % per ye "unit":"FCFA"}]},"47":{"subject":"mathematics","class":"Form 2","lesson_no":47,"language":"en","prerequisites":[40],"skills":[{"id":"m2-47","name":"Currency exchange"}],"note":{"status":"draft","text":"An exchange rate tells how much one currency is worth in another. Example: 1 euro (€) = 656 FCFA (the CFA franc is tied to the euro at about 656 FCFA).\nEuros → FCFA: multiply by the rate. FCFA → euros: divide by the rate.\nBanks and exchange offices often take a commission (a percentage) for changing money.\nIn this lesson the rate is always given in the question: rates for other currencies (US dollar, naira) change every day.","checks":[]},"worked_example":{"status":"draft","vars":{"r":656,"e":50},"problem":"{1} € = {r} FCFA. Change {e} € into FCFA and {r * 10} FCFA into euros.","steps":["{e} × {r} = {e * r} FCFA.","{r * 10} ÷ {r} = {10} €."],"answer":"{e * r} FCFA; {10} €","checks":[]},"teach":{"cards":[{"id":"c47-1","status":"draft","idea":"Foreign money → FCFA: multiply by the rate.","vars":{"r":655,"e":20},"example":["{e} € × {r} = {e * r} FCFA"],"checks":[],"check":{"ref":"m2-47-to"}},{"id":"c47-2","status":"draft","idea":"FCFA → foreign money: divide by the rate.","vars":{"r":655,"f":6550},"example":["{f} FCFA ÷ {r} = {f / r} €"],"checks":[],"check":{"ref":"m2-47-from"}},{"id":"c47-3","status":"draft","idea":"A commission of p % is taken off the money changed.","vars":{"p":2,"f":65500},"example":["{p} % of {f} = {f * p / 100} FCFA"],"checks":[],"check":{"id":"m2-47-comm-card","type":"numeric","level":1,"review":"rule","sources":["money"],"vars":{"r":{"pick":[650,655,656,660]},"e":{"pick":[10,20,50,100,150,200,500]},"p":{"pick":[1,2,4,5]}},"prompt":"1 € = {r} FCFA. An exchange office takes a {p} % commission. How many FCFA do you receive for {e} €?","answer":"e * r * (100 - p) / 100","misconceptions":[{"id":"nocomm","wrong":"e * r","explain":"Take the commission off."}],"solution":["Without commission: {e} × {r} = {e * r} FCFA.","Commission: {p} % of {e * r} = ission: {p} % of {e * r} = {e * r * p / 100} FCFA.","You receive {e * r} − {e * r * p / 100} = {answer} FCFA."],"where":["isInt(e * r * p / 100)"],"unit":"FCFA"}]},"48":{"subject":"mathematics","class":"Form 2","lesson_no":48,"language":"en","prerequisites":[28],"skills":[{"id":"m2-48","name":"Polygons"}],"note":{"status":"draft","text":"A polygon is a closed figure with straight sides. Names: triangle (3 sides), quadrilateral (4), pentagon (5), hexagon (6), heptagon (7), octagon (8), nonagon (9), decagon (10), dodecagon (12).\nSpecial quadrilaterals: a trapezium has one pair of parallel sides; a parallelogram has two pairs.\nA regular polygon has all its sides equal and all its angles equal (regular hexagon, regular octagon).\nThe interior angles of a polygon with n sides add up to (n − 2) × 180°: a pentagon 540°, a hexagon 720°.","checks":[]},"worked_example":{"status":"draft","vars":{"n":6},"problem":"Find the sum of the interior angles of a hexagon, and each angle of a regular hexagon.","steps":["A hexagon has {n} sides: ({n} − {2}) × {180} = {angleSum(n)}°.","Regular: {angleSum(n)} ÷ {n} = {interiorRegular(n)}°."],"answer":"{angleSum(n)}° and {interiorRegular(n)}°","checks":[],"figure":"regularFig(n)"},"teach":{"cards":[{"id":"c48-1","status":"draft","idea":"Polygons are named by their number of sides.","vars":{"n":5},"example":["{n} sides: a {polyName(n)}."],"checks":[],"figure":"regularFig(n)","check":{"ref":"m2-48-name"}},{"id":"c48-2","status":"draft","idea":"Angle sum = (n − {2}) × {180}°.","vars":{},"example":["Pentagon: ({5} − {2}) × {180} = {angleSum(5)}°"],"checks":[],"check":{"ref":"m2-48-sum"}},{"id":"c48-3","status":"draft","idea":"A regular polygon: equal sides and equal angles.","vars":{},"example":["Regular octagon: {angleSum(8)} ÷ {8} = {interiorRegular(8)}°"],"checks":[],"figure":"regularFig(8)","check":{"id":"m2-48-reg-card","type":"numeric","level":1,"review":"rule","sources":["polygons"],"vars":{"n":{"pick":[4,5,6,8,9,10,12]}},"prompt":"Find iew":"authored","sources":["polygons"],"prompt":"Which statement is wrong?","pool":{"right":[{"text":"The opposite sides of a parallelogram are equal.","truth":"true"},{"text":"A rectangle has equal diagonals.","truth":"true"},{"text":"The diagonals of a rhombus are perpendicular.","truth":"true"},{"text":"A regular hexagon has six lines of symmetry.","truth":"true"}],"wrong":[{"text":"All the angles of a parallelogram are equal.","truth":"false","explain":"Only opposite angles are equal; angles next to each other add up to 180°."},{"text":"The diagonals of every parallelogram are equal.","truth":"false","explain":"Only a rectangle (or a square) has equal diagonals."},{"text":"A regular pentagon has ten lines of symmetry.","truth":"false","explain":"A regular polygon with n sides has n lines of symmetry: five."}]},"pick":{"right":3,"wrong":1}}]},"50":{"subject":"mathematics","class":"Form 2","lesson_no":50,"language":"en","prerequisites":[49,32],"skills":[{"id":"m2-50","name":"The area of a parallelogram and of a trapezium"}],"note":{"status":"draft","text":"Area of a parallelogram = base × height (the height is perpendicular to the base, not the slanting side).\nArea of a trapezium = ½ × (sum of the parallel sides) × height = ½ (a + b) h.\nExample: a trapezium with parallel sides 9 cm and 5 cm and height 4 cm: ½ × (9 + 5) × 4 = 28 cm².","checks":[]},"worked_example":{"status":"draft","vars":{"a":9,"b":5,"h":4},"problem":"Find the area of a trapezium with parallel sides {a} cm and {b} cm, {h} cm apart.","steps":["Add the parallel sides: {a} + {b} = {a + b}.","½ × {a + b} × {h} = {(a + b) * h / 2} cm²."],"answer":"{(a + b) * h / 2} cm²","checks":[],"figure":"trapeziumFig(a, b, h)"},"teach":{"cards":[{"id":"c50-1","status":"draft","idea":"Parallelogram: base × height.","vars":{"b":8,"h":5},"example":["{b} × {h} = {b * h} cm²"],"checks":[],"figure":"parallelogramFig(b, h)","check":{"ref":"m2-50-par"}},{"id":"c50-2","status":"draft","idea":"Trapezium: ½ × (a + b) × h.", ,"prompt":"A parallelogram has an area of {A} cm² and a base of {b} cm. Find its height.","answer":"h","misconceptions":[{"id":"times","wrong":"A * b","explain":"Divide the area by the base."}],"solution":["Area = base × height, so height = area ÷ base.","{A} ÷ {b} = {answer} cm."],"unit":"cm"},{"id":"m2-50-field","type":"numeric","level":3,"review":"rule","sources":["polygons"],"vars":{"a":{"int":[20,60]},"b":{"int":[10,40]},"h":{"int":[10,30]},"c":{"pick":[50,100,150,200]}},"prompt":"A field is a trapezium. Its parallel sides are {a} m and {b} m, {h} m apart. Seed costs {c} FCFA per square metre. How much to sow the field?","answer":"(a + b) * h / 2 * c","misconceptions":[{"id":"nohalf","wrong":"(a + b) * h * c","explain":"The trapezium's area needs the ½."}],"solution":["Area: ½ × ({a} + {b}) × {h} = {(a + b) * h / 2} m².","Cost: {(a + b) * h / 2} × {c} = {answer} FCFA."],"where":["b \u003c a","((a + b) * h) % 2 == 0"],"unit":"FCFA"}]},"51":{"subject":"mathematics","class":"Form 2","lesson_no":51,"language":"en","prerequisites":[48],"skills":[{"id":"m2-51","name":"Point and line symmetry"}],"note":{"status":"draft","text":"A figure has line symmetry (an axis of symmetry) if folding it along the line makes the two halves match. A square has 4 lines of symmetry, a rectangle 2, an equilateral triangle 3, a regular polygon with n sides n.\nA figure has point symmetry (central symmetry) if a half turn (180°) about a point leaves it unchanged: parallelograms (and so rectangles, rhombuses, squares) and circles have it; triangles do not.\nOn a grid: the image of a point by reflection in the vertical line x = k is at the same height, the same distance on the other side: x′ = 2k − x.\nBy point symmetry about centre C, the image of M is M′ such that C is the midpoint of [MM′].","checks":[]},"worked_example":{"status":"draft","vars":{"x":1,"y":3,"k":3},"problem":"Find the image of A({x}, {y}) by reflection in the line x = {k}.","steps":["A is {k - x} units to the left of the line.","Its image is {k - x} units to the right: x′ = {k} + {k - x} = {reflectX(x, k)}; y stays {y}."],"answer":"A′({reflectX(x, k)}, {y})","checks":[],"figure":"coordPlane([['A', x, y], ['A′', reflectX(x, k), y]])"},"teach":{"cards":[{"id":"c51-1","status":"draft","idea":"A line of symmetry folds the figure onto itself.","vars":{"s":"rectangle"},"example":["A {s} has {symLines(s)} lines of symmetry."],"checks":[],"check":{"ref":"m2-51-lines"}},{"id":"c51-2","status":"draft","idea":"Point symmetry: a half turn about a point leaves the figure unchanged.","vars":{},"example":["Every parallelogram has point symmetry about the meeting point of its diagonals."],"checks":[],"check":{"ref":"m2-51-point"}},{"id":"c51-3","status":"draft","idea":"Reflection in x = k: the image is the same distance on the other side.","vars":{"x":-2,"y":1,"k":1},"example":["({x}, {y}) → ({reflectX(x, k)}, {y}) in x = {k}"],"checks":[],"check":{"id":"m2-51-reflect-card","type":"numeric","level":1,"review":"rule","sources":["symmetry"],"vars":{"x":{"int":[-5,5]},"y":{"int":[-4,4]},"k":{"int":[-2,2]}},"prompt":"Find the x-coordinate of the image of A({x}, {y}) by reflection in the line x = {k}.","answer":"reflectX(x, k)","misconceptions":[{"id":"negated","wrong":"-x","explain":"Reflecting in x = {k} is not just changing the sign (that is only for x = {0}).","when":"k != 0"}],"solution":["A is {abs(k - x)} units from the line.","Its image is {abs(k - x)} units on the other side: x′ = {answer}."],"where":["x != k","abs(reflectX(x, k)) \u003c= 5"],"signed":true,"figure":"coordPlane([['A', x, y]])"}}]},"questions":[{"id":"m2-51-lines","type":"numeric","level":1,"review":"rule","sources":["symmetry"],"vars":{"s":{"pick":["square","rectangle","rhombus","parallelogram","isosceles trapezium","kite","equilateral triangle","isosceles triangle","scalene triangle"]}},"prompt":"How many lines of symmetry has {aOrAn(s)}?","answer":"symLines(s)","misconceptions":[{"id":"diag","wrong":"symLines(s) + 2","explain":"Check each line: the diagonals of a rectangle or parallelogram are not lines of symmetry.","when":"s == 'rectangle' || s == 'parallelogram'"}],"solution":["Fold the {s} in your mind along each possible line.","{aOrAn(s)} has {answer}."]},{"id":"m2-51-point","type":"mcq","level":1,"review":"rule","sources":["symmetry"],"vars":{"s":{"pick":["square","rectangle","rhombus","parallelogram","isosceles trapezium","kite","equilateral triangle","isosceles triangle","scalene triangle"]}},"prompt":"Has {aOrAn(s)} point symmetry?","correct":"{hasPointSym(s) ? 'Yes' : 'No'}","distractors":[{"text":"{hasPointSym(s) ? 'No' : 'Yes'}","misconception":"w"}],"misconceptions":[{"id":"w","explain":"{hasPointSym(s) ? 'Every parallelogram, and so this ' + s + ', looks the same after a half turn.' : 'After a half turn the ' + s + ' points the other way.'}"}],"solution":["Turn the {s} half a turn about its centre: {hasPointSym(s) ? 'it looks the same' : 'it does not look the same'}.","So the answer is {answer}."],"min_distractors":1},{"id":"m2-51-reflect","type":"numeric","level":2,"review":"rule","sources":["symmetry"],"vars":{"x":{"int":[-5,5]},"y":{"int":[-4,4]},"k":{"int":[-2,2]}},"prompt":"Find the x-coordinate of the image of A({x}, {y}) by reflection in the line x = {k}.","answer":"reflectX(x, k)","misconceptions":[{"id":"negated","wrong":"-x","explain":"Reflecting in x = {k} is not just changing the sign (that is only for x = {0}).","when":"k != 0"}],"solution":["A is {abs(k - x)} units from the line.","Its image is {abs(k - x)} units on the other side: x′ = {answer}."],"where":["x != k","abs(reflectX(x, k)) \u003c= 5"],"signed":true,"figure":"coordPlane([['A', x, y]])"},{"id":"m2-51-half","type":"numeric","level":3,"review":"rule","sources":["symmetry"],"vars":{"x":{"int":[-4,4]},"y":{"int":[-4,4]},"a":{"int":[-2,2]},"b":{"int":[-2,2]}},"prompt":"M has coordinates ({x}, {y}). Find the coordinates of its image M′ by point symmetry about C({a}, {b}). Give the x-coordinate of M′.","answer":"halfTurn(x, a)","misconceptions":[{"id":"origin","wrong":"-x","explain":"The centre is C, not the origin: x′ = {2} × {a} − {x}.","when":"a != 0"},{"id":"half","wrong":"a + (a - x) / 2","explain":"Go the whole distance again beyond C, not half."}],"solution":["C is the midpoint of [MM′], so x′ = {2} × {a} − {x}.","x′ = {answer}."],"where":["x != a","abs(halfTurn(x, a)) \u003c= 5","abs(halfTurn(y, b)) \u003c= 5"],"signed":true,"figure":"coordPlane([['M', x, y], ['C', a, b]])"}]},"52":{"subject":"mathematics","class":"Form 2","lesson_no":52,"language":"en","prerequisites":[51],"skills":[{"id":"m2-52","name":"Properties kept by symmetry"}],"note":{"status":"draft","text":"A reflection (line symmetry) and a half turn (point symmetry) do not change the size or shape of a figure. They keep (conserve):\n• distances (lengths): A′B′ = AB;\n• angles: the image of a 40° angle is a 40° angle;\n• shapes: the image of a triangle is an equal (congruent) triangle;\n• parallelism: parallel lines have parallel images;\n• orthogonality: perpendicular lines have perpendicular images;\n• alignment: points on a line have images on a line.","checks":[]},"worked_example":{"status":"draft","vars":{"l":5,"a":40},"problem":"Triangle A′B′C′ is the image of ABC by a reflection. AB = {l} cm and Â = {a}°. Find A′B′ and Â′.","steps":["A reflection keeps lengths: A′B′ = AB = {l} cm.","It keeps angles: Â′ = Â = {a}°."],"answer":"A′B′ = {l} cm, Â′ = {a}°","checks":[]},"teach":{"cards":[{"id":"c52-1","status":"draft","idea":"Symmetry keeps lengths.","vars":{"l":6},"example":["AB = {l} cm, so A′B′ = {l} cm."],"checks":[],"check":{"ref":"m2-52-len"}},{"id":"c52-2","status":"draft","idea":"Symmetry keeps angles.","vars":{"a":55},"example":["B̂ = {a}°, so B̂′ = {a}°."],"checks":[],"check":{"ref":"m2-52-angle"}},{"id":"c52-3","status":"draft","idea":"Symmetry keeps parallel and perpendicular lines, and points on a line.","vars":{},"example":["If (AB) ∥ (CD), then (A′B′) ∥ (C′D′)."],"checks":[],"check":{"id":"m2-52-what-card","type":"mcq","level":1,"review":"authored","sources":["symmetry"],"prompt":"Which statement is true?","pool":{"right":[{"text":"The image of two perpendicular lines by a reflection is two perpendicular lines.","truth":"true"},{"text":"The image of three points on a line by a half turn is three points on a line.","truth":"true"},{"text":"The image of two parallel lines by a reflection is two parallel lines.","truth":"true"}],"wrong":[{"text":"The image of a square by a reflection can be a rectangle that is not a square.","truth":"false","explain":"Symmetry keeps lengths, so all four sides stay equal."},{"text":"The image of an angle of 30° by a half turn is an angle of 150°.","truth":"false","explain":"Symmetry keeps angles: it is still 30°."},{"text":"The image of a segment of 4 cm by a reflection is a segment of 8 cm.","truth":"false","explain":"Symmetry keeps lengths: still 4 cm."}]},"pick":{"right":1,"wrong":2}}}]},"questions":[{"id":"m2-52-len","type":"numeric","level":1,"review":"rule","sources":["symmetry"],"vars":{"l":{"int":[2,15]}},"prompt":"[A′B′] is the image of [AB] by point symmetry. AB = {l} cm. Find A′B′.","answer":"l","misconceptions":[{"id":"double","wrong":"2 * l","explain":"The image is the same size: point symmetry does not stretch."}],"solution":["Point symmetry keeps lengths.","A′B′ = {answer} cm."],"unit":"cm"},{"id":"m2-52-angle","type":"numeric","level":1,"review":"rule","sources":["symmetry"],"vars":{"a":{"int":[20,150]}},"prompt":"Triangle A′B′C′ is the image of ABC by a reflection. B̂ = {a}°. Find B̂′.","answer":"a","misconceptions":[{"id":"supp","wrong":"180 - a","explain":"A reflection keeps angles: the image angle is equal."}],"solution":["A reflection keeps angles.","B̂′ = {answer}°."],"unit":"°"},{"id":"m2-52-what","type":"mcq","level":2,"review":"authored","sources":["symmetry"],"prompt":"Which statement is true?","pool":{"right":[{"text":"The image of two perpendicular lines by a reflection is two perpendicular lines.","truth":"true"},{"text":"The image of three points on a line by a half turn is three points on a line.","truth":"true"},{"text":"The image of two parallel lines by a reflection is two parallel lines.","truth":"true"}],"wrong":[{"text":"The image of a square by a reflection can be a rectangle that is not a square.","truth":"false","explain":"Symmetry keeps lengths, so all four sides stay equal."},{"text":"The image of an angle of 30° by a half turn is an angle of 150°.","truth":"false","explain":"Symmetry keeps angles: it is still 30°."},{"text":"The image of a segment of 4 cm by a reflection is a segment of 8 cm.","truth":"false","explain":"Symmetry keeps lengths: still 4 cm."}]},"pick":{"right":1,"wrong":2}},{"id":"m2-52-spot","type":"spot_error","level":3,"review":"authored","sources":["symmetry"],"prompt":"Which statement is wrong?","pool":{"right":[{"text":"A reflection keeps lengths.","truth":"true"},{"text":"A half turn keeps angles.","truth":"true"},{"text":"The image of a square by a reflection is a square.","truth":"true"},{"text":"Images of parallel lines are parallel.","truth":"true"}],"wrong":[{"text":"A reflection doubles lengths.","truth":"false","explain":"A reflection keeps lengths."},{"text":"The image of a right angle by a half turn can be 120°.","truth":"false","explain":"Symmetry keeps angles: a right angle stays a right angle."},{"text":"Points on a line can have images that are not on a line.","truth":"false","explain":"Symmetry keeps alignment."}]},"pick":{"right":3,"wrong":1}}]},"53":{"subject":"mathematics","class":"Form 2","lesson_no":53,"language":"en","prerequisites":[29,31],"skills":[{"id":"m2-53","name":"The circumscribed circle of a triangle"}],"note":{"status":"draft","text":"The circumscribed circle of a triangle passes through its three vertices. Its centre O is where the three perpendicular bisectors of the sides meet (the circumcentre): O is the same distance from A, B and C.\nTo draw it: draw two perpendicular bisectors; where they cross is O; the radius is OA.\nIn a right-angled triangle, the centre is the midpoint of the hypotenuse, and the radius is half the hypotenuse.\nExample: a right-angled triangle with sides 6, 8, 10 cm has a circumscribed circle of radius 5 cm.","checks":[]},"worked_example":{"status":"draft","vars":{"a":6,"b":8,"c":10},"problem":"A right-angled triangle has sides {a} cm and {b} cm next to the right angle. Find the radius of its circumscribed circle.","steps":["Hypotenuse: √({a}² + {b}²) = {c} cm.","The centre is the midpoint of the hypotenuse: radius = {c} ÷ {2} = {c / 2} cm."],"answer":"{c / 2} cm","checks":[]},"teach":{"cards":[{"id":"c53-1","status":"draft","idea":"The circumcentre is where the perpendicular bisectors meet.","vars":{},"example":["It is the same distance from the three vertices."],"checks":[],"check":{"ref":"m2-53-centre"}},{"id":"c53-2","status":"draft","idea":"Right-angled triangle: the centre is the midpoint of the hypotenuse.","vars":{"c":13},"example":["Hypotenuse {c} cm → radius {c / 2} cm"],"checks":[],"check":{"ref":"m2-53-hyp"}},{"id":"c53-3","status":"draft","idea":"Find the hypotenuse with Pythagoras first.","vars":{"a":5,"b":12,"c":13},"example":["{a}, {b} → {c} → radius {c / 2}"],"checks":[],"check":{"id":"m2-53-legs-card","type":"numeric","level":1,"review":"rule","sources":["circles"],"vars":{"i":{"int":[0,11]},"a":{"expr":"tA(i)"},"b":{"expr":"tB(i)"},"c":{"expr":"tC(i)"}},"prompt":"A right-angled triangle has sides {a} cm and {b} cm next to the right angle. Find the radius of its circumscribed circle.","answer":"c / 2","misconceptions":[{"id":"diam","wrong":"c","explain":"That is the diameter (the hypotenuse). Halve it."},{"id":"leg","wrong":"b / 2","explain":"The diameter is the hypotenuse, not a shorter side."}],"solution":["Hypotenuse: √({a * a} + {b * b}) = {c} cm.","Radius = {c} ÷ {2} = {answer} cm."],"unit":"cm"}}]},"questions":[{"id":"m2-53-centre","type":"mcq","level":1,"review":"authored","sources":["circles"],"vars":{"X":{"pick":[{"q":"Where is the centre of the circumscribed circle of a triangle?","r":"where the perpendicular bisectors of the sides meet","w":["where the medians meet","where the heights meet","where the angle bisectors meet"],"e":["That is the centroid.","That is the orthocentre.","That is the centre of the inscribed circle."],"y":"Every point of a perpendicular bisector is the same distance from both ends of the side."},{"q":"Where is the centre of the circumscribed circle of a right-angled triangle?","r":"at the midpoint of the hypotenuse","w":["at the right-angle vertex","outside the triangle","at the midpoint of the shortest side"],"e":["The right-angle vertex is on the circle.","For a right-angled triangle it is on the hypotenuse.","It is the midpoint of the longest side."],"y":"The hypotenuse is a diameter of the circle."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"m2-53-hyp","type":"numeric","level":1,"review":"rule","sources":["circles"],"vars":{"i":{"int":[0,11]},"a":{"expr":"tA(i)"},"b":{"expr":"tB(i)"},"c":{"expr":"tC(i)"}},"prompt":"A right-angled triangle has a hypotenuse of {c} cm. Find the radius of its circumscribed circle.","answer":"c / 2","misconceptions":[{"id":"diam","wrong":"c","explain":"The hypotenuse is the diameter; the radius is half of it."}],"solution":["The hypotenuse is a diameter.","Radius = {c} ÷ {2} = {answer} cm."],"unit":"cm"},{"id":"m2-53-legs","type":"numeric","level":2,"review":"rule","sources":["circles"],"vars":{"i":{"int":[0,11]},"a":{"expr":"tA(i)"},"b":{"expr":"tB(i)"},"c":{"expr":"tC(i)"}},"prompt":"A right-angled triangle has sides {a} cm and {b} cm next to the right angle. Find the radius of its circumscribed circle.","answer":"c / 2","misconceptions":[{"id":"diam","wrong":"c","explain":"That is the diameter (the hypotenuse). Halve it."},{"id":"leg","wrong":"b / 2","explain":"The diameter is the hypotenuse, not a shorter side."}],"solution":["Hypotenuse: √({a * a} + {b * b}) = {c} cm.","Radius = {c} ÷ {2} = {answer} cm."],"unit":"cm"},{"id":"m2-53-spot","type":"spot_error","level":3,"review":"authored","sources":["circles"],"prompt":"Which statement is wrong?","pool":{"right":[{"text":"The circumscribed circle passes through the three vertices.","truth":"true"},{"text":"The circumcentre is the same distance from A, B and C.","truth":"true"},{"text":"In a right-angled triangle the hypotenuse is a diameter of the circumscribed circle.","truth":"true"},{"text":"Two perpendicular bisectors are enough to find the circumcentre.","truth":"true"}],"wrong":[{"text":"The circumcentre is always inside the triangle.","truth":"false","explain":"For an obtuse triangle it is outside; for a right-angled one it is on the hypotenuse."},{"text":"The circumcentre is where the medians meet.","truth":"false","explain":"The medians meet at the centroid."}]},"pick":{"right":3,"wrong":1}}]},"54":{"subject":"mathematics","class":"Form 2","lesson_no":54,"language":"en","prerequisites":[53],"skills":[{"id":"m2-54","name":"The relative positions of two circles"}],"note":{"status":"draft","text":"Two circles with radii r and R (R ≥ r) and distance d between their centres can be:\n• separate (outside each other): d > R + r;\n• touching externally (one point): d = R + r;\n• intersecting in two points: R − r \u003c d \u003c R + r;\n• touching internally (one point, one inside the other): d = R − r;\n• one inside the other without touching: d \u003c R − r (concentric when d = 0).\nCompare d with R + r and with R − r.","checks":[]},"worked_example":{"status":"draft","vars":{"R":5,"r":3,"d":7},"problem":"Circles with radii {R} cm and {r} cm have centres {d} cm apart. What is their position?","steps":["R + r = {R + r} and R − r = {R - r}.","{R - r} \u003c {d} \u003c {R + r}: they intersect in two points."],"answer":"{circlesPos(R, r, d)}","checks":[]},"teach":{"cards":[{"id":"c54-1","status":"draft","idea":"d = R + r: touching externally.","vars":{"R":4,"r":2},"example":["{R} + {r} = {R + r} = d"],"checks":[],"check":{"ref":"m2-54-touch"}},{"id":"c54-2","status":"draft","idea":"d = R − r: touching internally.","vars":{"R":6,"r":2},"example":["{R} − {r} = {R - r} = d"],"checks":[],"check":{"id":"m2-54-inner-card","type":"numeric","level":1,"review":"rule","sources":["circles"],"vars":{"r1":{"int":[4,15]},"r2":{"int":[1,10]}},"prompt":"Two circles with radii {r1} cm and {r2} cm touch internally. How far apart are their centres?","answer":"r1 - r2","misconceptions":[{"id":"outer","wrong":"r1 + r2","explain":"That is for touching externally. Internally, subtract."}],"solution":["Touching internally: d = R − r.","{r1} − {r2} = {answer} cm."],"where":["r1 > r2"],"unit":"cm"}},{"id":"c54-3","status":"draft","idea":"Compare d with R + r and R − r to name the position.","vars":{},"example":["R − r \u003c d \u003c R + r: intersecting."],"checks":[],"check":{"ref":"m2-54-name"}}]},"questions":[{"id":"m2-54-name","type":"mcq","level":1,"review":"rule","sources":["circles"],"vars":{"r1":{"int":[3,9]},"r2":{"int":[1,5]},"k":{"int":[0,4]},"d":{"expr":"k == 0 ? r1 + r2 + 2 : k == 1 ? r1 + r2 : k == 2 ? r1 + r2 - 1 : k == 3 ? r1 - r2 : r1 - r2 - 1"}},"prompt":"Two circles have radii {r1} cm and {r2} cm. Their centres are {d} cm apart. What is their position?","correct":"{circlesPos(r1, r2, d)}","distractors":[{"text":"separate (outside each other)","misconception":"s"},{"text":"touching externally","misconception":"te"},{"text":"intersecting in two points","misconception":"i"},{"text":"touching internally","misconception":"ti"},{"text":"one inside the other","misconception":"in"}],"misconceptions":[{"id":"s","explain":"Separate needs d > {r1 + r2}."},{"id":"te","explain":"Touching externally needs d = {r1 + r2} exactly."},{"id":"i","explain":"Intersecting needs {r1 - r2} \u003c d \u003c {r1 + r2}."},{"id":"ti","explain":"Touching internally needs d = {r1 - r2} exactly."},{"id":"in","explain":"One inside the other needs d \u003c {r1 - r2}."}],"solution":["R + r = {r1 + r2}, R − r = {r1 - r2}, d = {d}.","So they are {answer}."],"where":["r1 > r2","d > 0"],"min_distractors":3},{"id":"m2-54-touch","type":"numeric","level":1,"review":"rule","sources":["circles"],"vars":{"r1":{"int":[2,12]},"r2":{"int":[1,10]}},"prompt":"Two circles with radii {r1} cm and {r2} cm touch externally. How far apart are their centres?","answer":"r1 + r2","misconceptions":[{"id":"inner","wrong":"abs(r1 - r2)","explain":"That is for touching internally. Externally, add the radii."}],"solution":["Touching externally: d = R + r.","{r1} + {r2} = {answer} cm."],"unit":"cm"},{"id":"m2-54-inner","type":"numeric","level":2,"review":"rule","sources":["circles"],"vars":{"r1":{"int":[4,15]},"r2":{"int":[1,10]}},"prompt":"Two circles with radii {r1} cm and {r2} cm touch internally. How far apart are their centres?","answer":"r1 - r2","misconceptions":[{"id":"outer","wrong":"r1 + r2","explain":"That is for touching externally. Internally, subtract."}],"solution":["Touching internally: d = R − r.","{r1} − {r2} = {answer} cm."],"where":["r1 > r2"],"unit":"cm"},{"id":"m2-54-range","type":"numeric","level":3,"review":"rule","sources":["circles"],"vars":{"r1":{"int":[3,12]},"r2":{"int":[2,9]}},"prompt":"Two circles have radii {r1} cm and {r2} cm and intersect in two points. The distance between their centres is a whole number of centimetres. What is the largest it can be?","answer":"r1 + r2 - 1","misconceptions":[{"id":"touch","wrong":"r1 + r2","explain":"At d = {r1 + r2} they only touch; they must be closer to cross in two points."}],"solution":["To intersect: d \u003c R + r = {r1 + r2}.","The largest whole number below {r1 + r2} is {answer} cm."],"where":["r1 > r2"],"unit" const { check, DONT_KNOW, renderWorked, normaliseInput, inputModeFor } = template;
const L0 = () => CONTENT.maths[0];  // Maths is loaded before the readiness check starts

// ---------------------------------------------------------------- saved progress (this browser only)
// v2 { readiness: {score, rows, at} | null, subject,
//      lessons: {"maths:3": {done, at, rows, review, paper?}}, current: {maths?: {lesson, flow, rows, paper?}, english?: …} }
// v1 (Maths only, 2026-10-05) had lessons keyed by number and one current lesson; it is upgraded in place.
const KEY = "psalmspreps-maths-v1";  // kept so existing progress survives the upgrade
const fresh = () => ({ v: 2, readiness: null, subject: "maths", lessons: {}, current: {} });
/** A saved lesson in progress is kept only if its flow is usable; a damaged one is dropped, never a blank page. */
const usable = (c) => c && c.flow && Array.isArray(c.flow.steps) && Array.isArray(c.rows) && Number.isInteger(c.lesson);
const cleanCurrent = (cur) => Object.fromEntries(Object.entries(cur || {}).filter(([, c]) => usable(c)));
function upgrade(s) {
  if (s.v === 2) return { ...fresh(), ...s, current: cleanCurrent(s.current) };
  if (s.v !== 1) return fresh();
  const lessons = Object.fromEntries(Object.entries(s.lessons || {}).map(([n, x]) => [`maths:${n}`, x]));
  return { ...fresh(), readiness: s.readiness || null, lessons, current: cleanCurrent({ maths: s.current }) };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    return s ? upgrade(s) : fresh();
  } catch { return fresh(); }  // private mode, blocked storage or a broken value: start fresh
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* still works, just forgets */ } };
const state = load();
const newSeed = () => Math.floor(Math.random() * 1e6);  // a new set of numbers each time a lesson starts
const lessonKey = (subject, n) => `${subject}:${n}`;

const app = document.getElementById("app");
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k.startsWith("on") ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};
/** Replaces the page. The wrapper is new each time, so its entrance animation replays (off under reduced motion). */
const screen = (...kids) => {
  app.replaceChildren(el("div", { class: "screen" }, ...kids.flat().filter((k) => k != null)));
  window.scrollTo(0, 0);
};
/** Replaces a node's children, skipping empty slots (a placed tile leaves null behind; it must not show as "null"). */
const fill = (node, kids) => node.replaceChildren(...kids.filter((k) => k != null));
const button = (label, onclick, cls = "") => el("button", { type: "button", class: cls, onclick }, label);
const para = (t, cls = "") => el("p", { class: cls }, t);
const lines = (text) => text.split("\n").map((l) => (l.trim() ? para(l) : null));
const header = (kicker, title) => el("header", {}, el("div", { class: "kicker" }, kicker), el("h1", {}, title));
/** Progress bar: a filled segment plus "2 / 13". */
const progress = (cur, total) => el("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(cur) },
  el("div", { class: "track" }, el("div", { class: "fill", style: `width:${Math.round((100 * cur) / total)}%` })),
  el("span", { class: "count" }, `${cur} / ${total}`));
/** A drawing made by the engine from the question's own numbers (an SVG string from our library, never from input). */
const figureBox = (svg) => {
  if (!svg) return null;
  const box = el("div", { class: "figure" });
  box.innerHTML = svg;
  return box;
};
const checkIcon = () => {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("class", "tick"); svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", "M5 12.5l4.5 4.5L19 7.5");
  svg.append(path);
  return svg;
};

/** A label for the pupil: in French inside a French lesson, otherwise English. {x} are filled from v. */
const inFrench = (s) => s === "french" || s === "f2-french" || s === "f2-francais-intensif";
const T = (text, v = {}) => ((inFrench(S) && FR[text]) || text).replace(/\{(\w)\}/g, (_, k) => v[k]);

// ---------------------------------------------------------------- one question, any type
/** A typed answer box (numbers or words): Enter or "Check" submits; the engine picks the keyboard. */
function answerBox(q, finish, inline = false) {
  const input = el("input", { type: "text", inputmode: inputModeFor(q), autocomplete: "off", autocorrect: "off", autocapitalize: "off",
    spellcheck: "false", "aria-label": T("Your answer"), class: inline ? "blank-input" : "" });
  const go = () => { const v = normaliseInput(input.value, q); if (v) finish(v); };
  input.addEventListener("keydown", (e) => e.key === "Enter" && go());
  setTimeout(() => input.focus(), 50);
  return { input, check: button(T("Check"), go, "primary") };
}

/** Cloze: the sentence with its blank inline. Typed: a box in the gap. Choose: a dotted gap, options below. */
function clozeSentence(q, box = null) {
  const [before, after] = q.sentence.split("___");
  return el("div", { class: "sentence" }, before, box || el("span", { class: "blank", "aria-label": "blank" }, " "), after);
}

/** Word order: tap a word to place it; tap a placed word to send it back. The final . ? or ! is fixed. */
function wordOrder(q, finish) {
  const placed = [];
  const line = el("div", { class: "built", "aria-live": "polite" });
  const pool = el("div", { class: "tiles" });
  const done = button(T("Check"), () => placed.length === q.items.length && finish([...placed]), "primary");
  const redraw = () => {
    line.replaceChildren(...(placed.length
      ? [...placed.map((i, k) => button(q.items[i], () => { placed.splice(k, 1); redraw(); }, "tile placed")), ...(q.end ? [el("span", { class: "end" }, q.end)] : [])]
      : [el("span", { class: "muted" }, T("Tap the words below."))]));
    fill(pool, q.items.map((t, i) => (placed.includes(i) ? null : button(t, () => { placed.push(i); redraw(); }, "tile"))));
    done.disabled = placed.length !== q.items.length;
  };
  redraw();
  return [para(T("Tap a word to add it. Tap a word in your sentence to take it out."), "muted"), line, pool, done];
}

/** Matching: tap a left item, then a right item, to pair them; tap a pair to undo it. */
function matching(q, finish) {
  const pairOf = q.left.map(() => null);  // left index → right index
  let picked = null;
  const done = button(T("Check"), () => pairOf.every((r) => r !== null) && finish([...pairOf]), "primary");
  const wrap = el("div", {});
  const redraw = () => {
    const rightUsed = new Map(pairOf.map((r, l) => [r, l]).filter(([r]) => r !== null));
    const badge = (n) => el("span", { class: "badge", "aria-hidden": "true" }, String(n + 1));
    const lefts = q.left.map((t, i) => {
      const paired = pairOf[i] !== null;
      return button([paired ? badge(i) : null, t], () => {
        if (paired) pairOf[i] = null; else picked = picked === i ? null : i;
        redraw();
      }, `match${paired ? " paired" : ""}${picked === i ? " picked" : ""}`);
    });
    const rights = q.right.map((t, r) => {
      const l = rightUsed.get(r);
      return button([l !== undefined ? badge(l) : null, t], () => {
        if (l !== undefined) pairOf[l] = null;
        else if (picked !== null) { pairOf[picked] = r; picked = null; }
        redraw();
      }, `match${l !== undefined ? " paired" : ""}${picked !== null && l === undefined ? " ready" : ""}`);
    });
    wrap.replaceChildren(el("div", { class: "match-cols" }, el("div", { class: "col" }, ...lefts), el("div", { class: "col" }, ...rights)));
    done.disabled = pairOf.some((r) => r === null);
  };
  redraw();
  return [para(T("Tap an item on the left, then its partner on the right. Tap a pair to undo it."), "muted"), wrap, done];
}

/** Sorting (matching with groups): tap a word, then tap its group; tap a word inside a group to take it out. */
function sorting(q, finish) {
  const groupOf = q.left.map(() => null);
  let picked = null;
  const done = button(T("Check"), () => groupOf.every((g) => g !== null) && finish([...groupOf]), "primary");
  const wrap = el("div", {});
  const redraw = () => {
    const loose = q.left.map((t, i) => (groupOf[i] === null ? button(t, () => { picked = picked === i ? null : i; redraw(); }, `tile${picked === i ? " picked" : ""}`) : null));
    const groups = q.right.map((g, gi) => el("div", { class: `group${picked !== null ? " ready" : ""}`, role: "button", tabindex: "0",
      onclick: (e) => { if (e.target.closest(".tile") || picked === null) return; groupOf[picked] = gi; picked = null; redraw(); },
      onkeydown: (e) => { if ((e.key === "Enter" || e.key === " ") && picked !== null) { e.preventDefault(); groupOf[picked] = gi; picked = null; redraw(); } } },
      el("div", { class: "group-name" }, g),
      el("div", { class: "tiles" }, ...q.left.map((t, i) => (groupOf[i] === gi ? button(t, () => { groupOf[i] = null; redraw(); }, "tile placed") : null)))));
    wrap.replaceChildren(el("div", { class: "tiles" }, ...loose), ...groups);
    done.disabled = groupOf.some((g) => g === null);
  };
  redraw();
  return [para(T("Tap a word, then tap its group. Tap a word in a group to take it out."), "muted"), wrap, done];
}

/** Shows q; calls onAnswer({result, ms}) when the pupil answers or presses "I don't know". */
function askQuestion(q, { kicker, title, onAnswer, bar = null, back = null }) {
  const t0 = performance.now();
  const finish = (response) => onAnswer({ result: check(q, response), ms: Math.round(performance.now() - t0) });
  const body = [bar, header(kicker, title), el("div", { class: "prompt" }, q.prompt), figureBox(q.figure)];
  if (q.type === "blanks") {
    // a step-by-step line: one small box per blank, all checked together (2026-10-19)
    const inputs = q.answers.map((_, i) => el("input", { type: "text", inputmode: "numeric", autocomplete: "off", class: "blank-input", "aria-label": T("Box {a}", { a: i + 1 }) }));
    const go = () => { const v = inputs.map((x) => normaliseInput(x.value, q)); if (v.every(Boolean)) finish(v); else inputs[v.findIndex((x) => !x)].focus(); };
    inputs.forEach((x, i) => x.addEventListener("keydown", (e) => { if (e.key === "Enter") (i < inputs.length - 1 && !inputs[i + 1].value ? inputs[i + 1].focus() : go()); }));
    setTimeout(() => inputs[0].focus(), 50);
    body.push(para(T("Fill in each box, then check."), "muted"),
      el("div", { class: "sentence blanks" }, q.parts.flatMap((p, i) => (i < inputs.length ? [p, inputs[i]] : [p]))), button(T("Check"), go, "primary"));
  } else if (q.type === "numeric") {
    const { input, check: go } = answerBox(q, finish);
    body.push(el("div", { class: "answer" }, input, q.unit ? el("span", { class: "unit" }, q.unit) : null), go);
  } else if (q.type === "cloze" && q.mode === "type") {
    const { input, check: go } = answerBox(q, finish, true);
    body.push(clozeSentence(q, input), go);
  } else if (q.type === "cloze") {
    body.push(clozeSentence(q), el("div", { class: "options" }, q.options.map((o, i) => button(o.text, () => finish(i), "option"))));
  } else if (q.type === "mcq" || q.type === "spot_error") {
    if (q.type === "spot_error") body.push(para(T("Tap the one that is wrong."), "muted"));
    body.push(el("div", { class: "options" }, q.options.map((o, i) => button(o.text, () => finish(i), "option"))));
  } else if (q.type === "ordering") {
    const chosen = [];
    const list = el("ol", { class: "chosen" });
    const pool = el("div", { class: "options" });
    const redraw = () => {
      list.replaceChildren(...chosen.map((i) => el("li", {}, q.items[i])));
      fill(pool, q.items.map((t, i) => (chosen.includes(i) ? null : button(t, () => { chosen.push(i); redraw(); }, "option"))));
      if (chosen.length === q.items.length) finish([...chosen]);
    };
    body.push(para(T("Tap them in order."), "muted"), list, pool, button(T("Start again"), () => { chosen.length = 0; redraw(); }, "link"));
    redraw();
  } else if (q.type === "word_order") {
    body.push(...wordOrder(q, finish));
  } else if (q.type === "matching") {
    body.push(...(q.groups ? sorting(q, finish) : matching(q, finish)));
  }
  body.push(button(T("I don't know"), () => finish(DONT_KNOW), "idk"), back);
  screen(...body);
}

const recordOf = (q, r, ms, phase) => ({
  phase, id: q.id, level: q.level, result: r.correct ? "right" : r.dontKnow ? "idk" : "wrong",
  seconds: Math.round(ms / 100) / 10, misconception: r.misconception?.id || "",
});
// On every lesson screen, the answer screens included (2026-10-19), so the pupil can always leave; the flow is saved.
const toMenu = () => button(T("Back to the lessons"), menu, "link");

// ---------------------------------------------------------------- 1. first visit: readiness check (Primary 6 maths)
function start() {
  withSubject("maths", () => screen(
    header("Form One", "Before we start"),
    ...lines(L0().note.text),
    para("Nothing you type leaves this phone. There is no name to enter.", "muted"),
    button("Start the check", () => readinessQ(readiness.buildReadiness(L0(), newSeed(), libs.maths), 0, []), "primary"),
    toMenu(),
  ));
}

// No feedback during the check, and no score at the end (TR-C19, approved 2026-10-03):
// the pupil sees a neutral "Let's start"; scores and weak areas appear only in "Copy results".
function readinessQ(qs, i, rows) {
  if (i >= qs.length) return readinessDone(rows);
  askQuestion(qs[i], {
    bar: progress(i + 1, qs.length), kicker: "Getting ready", title: "Primary School maths",
    onAnswer: ({ result, ms }) => {
      rows.push({ ...recordOf(qs[i], result, ms, "readiness"), template: qs[i].id, correct: result.correct });
      readinessQ(qs, i + 1, rows);
    },
  });
}

function readinessDone(rows) {
  state.readiness = { score: readiness.scoreReadiness(L0(), rows), rows, at: new Date().toISOString() };
  save();
  screen(
    header("Thank you", "Let's start"),
    para("Now we begin Form One, one small idea at a time."),
    button("See the Maths lessons", () => { state.subject = "maths"; save(); menu(); }, "primary"),
  );
}

// ---------------------------------------------------------------- 2. home, subjects, streaks, stars and badges
// Design of 2026-10-17 (Dion: "colourful and interactive, with streaks"): a home screen with the streak, stars and
// one coloured tile per subject; each subject shows its lessons as a path. Streaks are forgiving (ghost towns, power
// cuts, no data): up to two days off in a row never break a streak.
const subj = () => state.subject in SUBJECTS ? state.subject : Object.keys(SUBJECTS)[0];
// Classes (Form 2, 2026-10-17): Form One stays the default; a pupil picks a class on the home screen. A Form 2
// subject's id starts with "f2-" and keeps its own progress ("f2-maths:5").
const classOf = (s) => CLASS_OF[s] || "form-1";
const classesHere = () => [...new Set(Object.keys(SUBJECTS).map(classOf))];
const form = () => (classesHere().includes(state.form) ? state.form : classesHere()[0]);
const inClass = (c) => Object.keys(SUBJECTS).filter((s) => classOf(s) === c);
/** "Maths" for Form One (as before), "Form Two Maths" for another class. */
const subjectName = (s) => (classOf(s) === "form-1" ? SUBJECTS[s] : `${CLASSES[classOf(s)]} ${SUBJECTS[s]}`);
const nextLesson = (s) => LESSONS[s].find((n) => !state.lessons[lessonKey(s, n)]?.done);
const inProgress = (s) => { const c = state.current[s]; return c && !teach.isDone(c.flow) ? c : null; };

// Each subject's colour (dark enough for white text: contrast 4.5:1 or more) and icon.
const STYLE = {
  maths: ["#1d4ed8", "🔢"], english: ["#6d28d9", "📖"], physics: ["#b45309", "⚡"], chemistry: ["#0f766e", "🧪"], geography: ["#2e7d32", "🌍"],
  "home-economics": ["#b42318", "🍲"], history: ["#7c4a1e", "🏛️"], biology: ["#3f7d20", "🌱"], "computer-science": ["#334e9c", "💻"], french: ["#ad1457", "💬"], accounting: ["#556b2f", "🧾"], "francais-intensif": ["#6a1b9a", "📖"],
};
const styleOf = (s) => STYLE[s] || STYLE[s.replace(/^f2-/, "")];  // a Form 2 subject looks like its Form One subject
const colourOf = (s) => (styleOf(s) || ["#1f6f4a"])[0];
const iconOf = (s) => (styleOf(s) || ["", "📘"])[1];
const tinted = (s, ...kids) => { const e = el(...kids); e.style.setProperty("--subj", colourOf(s)); return e; };

// Lesson content is loaded one subject at a time in the installed app (subjects/<id>.js); the single-file copy has
// everything already. withSubject() shows the screen as soon as the subject is ready.
const loading = {};
function loadSubject(s) {
  if (CONTENT[s]) return Promise.resolve();
  if (!loading[s]) loading[s] = new Promise((ok, fail) => {
    const tag = document.createElement("script");
    tag.src = `subjects/${s}.js?v=${VERSIONS[s] || BUILD}`;  // the file's content fingerprint: new lessons, new address
    tag.onload = () => (CONTENT[s] ? ok() : fail(new Error("empty")));
    tag.onerror = () => { delete loading[s]; tag.remove(); fail(new Error("offline")); };
    document.head.append(tag);
  });
  return loading[s];
}
function withSubject(s, show) {
  if (CONTENT[s]) return show();
  screen(header(`${iconOf(s)} ${subjectName(s)}`, "Getting the lessons ready…"), para("This takes a moment the first time.", "muted"));
  loadSubject(s).then(show, () => screen(header(`${iconOf(s)} ${subjectName(s)}`, "No connection"),
    para("These lessons are not saved on this phone yet. Connect to the internet once, then they will work offline.", "muted"),
    button("Try again", () => withSubject(s, show), "primary"), button("Back to all subjects", home, "link")));
}
const loadAll = (list) => Promise.all(list.map(loadSubject));

// ---- days, streak, stars, badges (all on this phone only)
const dayOf = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayNum = (s) => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 86400000);
/** Marks today as a learning day (called on every answer in a lesson). */
function recordDay() {
  state.days = state.days || [];
  const t = dayOf();
  if (state.days[state.days.length - 1] !== t) state.days.push(t);
}
/** Learning days in the current run; a run survives up to two days off in a row. 0 if the last learning day was too long ago. */
function streak() {
  const days = [...new Set(state.days || [])].map(dayNum).sort((a, b) => a - b);
  if (!days.length || dayNum(dayOf()) - days[days.length - 1] > 3) return 0;
  let n = 1;
  for (let i = days.length - 1; i > 0 && days[i] - days[i - 1] <= 3; i--) n++;
  return n;
}
/** Stars for a finished lesson: 3 if at least 80% of first tries were right, 2 if at least half, otherwise 1. */
function starsOf(r) {
  if (!r?.done) return 0;
  if (r.stars) return r.stars;
  const first = r.rows.filter((x) => x.phase === "practice" && x.attempt === 1);
  const asked = first.length || r.rows.filter((x) => x.attempt === 1).length;
  if (!asked) return 3;
  const right = (first.length ? first : r.rows.filter((x) => x.attempt === 1)).filter((x) => x.result === "right").length / asked;
  return right >= 0.8 ? 3 : right >= 0.5 ? 2 : 1;
}
const doneIn = (s) => LESSONS[s].filter((n) => state.lessons[lessonKey(s, n)]?.done);

/** Opens lesson n: carries on a saved, unfinished flow, otherwise starts it fresh. */
function openLesson(s, n) {

    state.current[s] = { lesson: n, flow: teach.startTeach(CONTENT[s][n], newSeed()), rows: [], at: new Date().toISOString() };

/** Starts lesson n again from its first card: clears its saved run (stars, answers) and any unfinished flow,

function resetLesson(s, n) {
  if (!confirm(`Start Lesson ${n} again from the beginning?\nYour stars and saved answers for this lesson will be cleared.`)) return;
  delete state.lessons[lessonKey(s, n)];

/** A flow saved mid-feedback resumes on a question: "retry" → the fresh variant, "reveal" → the next step. */
const resumable = (flow) => (flow.phase === "retry" || flow.phase === "reveal" ? teach.nextPhase(flow) : flow);

const cardExample = (c) => el("div", { class: "example" }, el("div", { class: "kicker" }, T("Example")), ...c.example.map((t) => para(t)), figureBox(c.figure));
const hintBlock = (q) => (q.hint ? el("div", { class: "hint" }, el("strong", {}, T("Hint: ")), q.hint) : null);

/** Every screen of a lesson goes through here, so the flow is saved at each step. */
function lesson(flow, previous = null) {
  C().flow = flow;
  save();
  if (teach.isDone(flow)) return results(flow);
  const Ln = L(), n = N();
  const step = flow.steps[flow.step];
  const nCards = Ln.teach.cards.length;
  const nPractice = flow.steps.filter((s) => s.kind === "practice").length;
  const practiceNo = flow.steps.slice(0, flow.step + 1).filter((s) => s.kind === "practice").length;
  const kicker = step.kind === "card" ? T("Lesson {n} · Idea {a} of {b}", { n, a: step.card + 1, b: nCards }) : T("Lesson {n} · Practice {a} of {b}", { n, a: practiceNo, b: nPractice });
  const go = (next, prev = null) => () => lesson(next, prev);
  const bar = progress(flow.step + 1, flow.steps.length);

  if (step.kind === "card" && flow.phase === "idea") {
    const c = teach.renderCard(Ln.teach.cards[step.card], LIB());
    return screen(bar, header(kicker, TITLES[S][n]), el("div", { class: "idea" }, c.idea), cardExample(c),
      button(T("I'm ready for a question"), go(teach.nextPhase(flow)), "primary"), toMenu());
  }
  if (step.kind === "card" || step.kind === "practice") {
    const q = teach.itemQuestion(Ln, flow, LIB(), previous);
    return askQuestion(q, {
      bar, kicker, back: toMenu(), title: q.type === "blanks" ? T("Step by step") : flow.attempt ? T("A new question") : step.kind === "card" ? T("Quick check") : T("Level {a}", { a: q.level }),
      onAnswer: ({ result, ms }) => {
        C().rows.push({ ...recordOf(q, result, ms, step.kind), card: step.kind === "card" ? Ln.teach.cards[step.card].id : "", attempt: flow.attempt + 1 });
        recordDay();
        const next = teach.answerItem(flow, result, ms);
        C().flow = next;
        save();
        if (next.phase === "reveal") return reveal(q, next, kicker, bar, result);
        if (next.phase === "retry") return retry(q, result, next, kicker, bar);
        // Teach mode only: green flash + check icon (readiness shows no right/wrong cues).
        return screen(bar, el("div", { class: "fb good flash", role: "status" }, checkIcon(), el("strong", {}, T("Correct!")),
          // 517 typed for 51₇: right, with a gentle word that the base is not typed
          result.baseTyped ? para(`Well done. You don't need to type the base: ${q.answer} is enough (the small ${q.base} only shows it is base ${q.base}).`) : null),

    });

      button(T(Ln.paper_task ? "Now write" : "Now practise"), go(teach.nextPhase(flow)), "primary"), toMenu());
  }

  if (step.kind === "note") {
    return screen(bar, header(T("Lesson {n} · Summary", { n }), TITLES[S][n]), el("div", { class: "note" }, ...lines(Ln.note.text)),
      button(T("Finish"), go(teach.nextPhase(flow)), "primary"));
  }
}

/**
 * Writing lessons: the task → the pupil writes in the exercise book → "I've written it" → model answer and a

 */
function paperTask(flow, bar) {
  const p = teach.renderPaper(L(), LIB()), n = N();

  const write = () => screen(bar, header(`Lesson ${n} · Your turn to write`, "Write in your exercise book"),
    el("div", { class: "idea pre" }, p.prompt),

  const review = () => {
    const boxes = p.checklist.map((item, i) => {
      const box = el("input", { type: "checkbox", id: `tick${i}` });
      box.checked = !!ticks[i];
      box.addEventListener("change", () => { ticks[i] = box.checked; C().paper = { written: true, ticks }; save(); });
      return el("label", { class: "tickrow", for: `tick${i}` }, box, el("span", {}, item));
    });

      para("Look at your own writing. Tick each thing you did.", "strong"),

/**
 * First miss, then a fresh variant (asked step by step when the template has a scaffold). Since 2026-10-19:
 *  - "I don't know": the hint, then this question's own working, one step per tap, then a new question;
 *  - a wrong answer: what the mistake was (a known misconception when the answer matches one), then for computed
 *    questions "one like it": another variant of the same shape with its working, so the example fits the question.
 */
function retry(q, result, flow, kicker, bar) {
  const step = flow.steps[flow.step];
  const again = (seen) => button(T("Try a new question"), () => lesson(teach.nextPhase(flow), seen), "primary");
  const workingBox = (title, x, list) => el("div", { class: "example" }, el("div", { class: "kicker" }, title), el("div", { class: "strong pre" }, x.prompt), figureBox(x.figure), list);
  if (result.dontKnow && q.solution?.length) {
    const list = el("ol", { "aria-live": "polite" }), tail = el("div", {});
    let shown = 0;
    const more = () => {
      list.append(el("li", {}, q.solution[shown++]));
      fill(tail, [shown < q.solution.length ? button(T("Show the next step"), more, "primary") : again(q)]);
    };
    screen(bar, header(kicker, T("Let's try again")),
      el("div", { class: "fb soft", role: "status" }, el("strong", {}, T("That's fine. Let's look at it together."))),
      hintBlock(q), workingBox(T("Here is how to do this one"), q, list), tail, toMenu());
    return more();
  }
  const wrongPairs = result.wrongPairs?.length
    ? para(T(result.wrongPairs.length === 1 ? "This one is not right yet: {a}." : "These are not right yet: {a}.", { a: result.wrongPairs.map((i) => q.left[i]).join(", ") })) : null;
  const box = result.dontKnow
    // "I don't know" on a question without written working: the hint and the worked example (spec §4)
    ? el("div", { class: "fb soft", role: "status" }, el("strong", {}, T("That's fine. Let's look at it together.")))
    : el("div", { class: "fb bad shake", role: "status" }, el("strong", {}, T("✗ Not quite")),
      result.misconception?.explain ? para(result.misconception.explain) : wrongPairs || para(T("Look at the example again, then try a new question.")));
  const like = result.dontKnow ? null : teach.exampleLike(L(), flow, LIB(), q);
  const help = like ? [workingBox(T("Here is one like it"), like, el("ol", {}, like.solution.map((s) => el("li", {}, s))))]
    : step.kind === "card" ? [result.dontKnow ? hintBlock(q) : null, cardExample(teach.renderCard(L().teach.cards[step.card], LIB()))]
    : result.dontKnow ? [hintBlock(q), workedBlock()] : [];
  screen(bar, header(kicker, T("Let's try again")), box, ...help, again(like ? [q, like] : q), toMenu());
}

/** Second miss: the correct answer with full working, then move on (marked "needs review"). */
function reveal(q, flow, kicker, bar, result) {
  const shown = q.type === "matching" ? T("Here are the right answers.")
    : T("The answer is: {a}", { a: `${q.answer}${q.base ? LIB().sub(q.base) : ""}${q.unit ? " " + q.unit : ""}` });  // 51₇, not 51
  screen(bar, header(kicker, T("Here is how to do it")),
    el("div", { class: result.dontKnow ? "fb soft" : "fb bad shake", role: "status" }, el("strong", {}, shown)),
    el("div", { class: "example" }, el("div", { class: "kicker" }, T("Full working")), el("ol", {}, q.solution.map((s) => el("li", {}, s)))),
    para(T("We will come back to this one later."), "muted"),
    button(T("Continue"), () => lesson(teach.nextPhase(flow)), "primary"), toMenu());
}

/** A simple CSS confetti burst: each piece gets a direction, spin, colour and delay. Hidden under reduced motion. */
function confetti() {
  const colours = ["#1f6f4a", "#e0a526", "#2f6fd6", "#d0473b", "#7c4dbd", "#2aa198"];
  const box = el("div", { class: "confetti", "aria-hidden": "true" });
  for (let i = 0; i < 28; i++) {
    const angle = (Math.PI * 2 * i) / 28 + Math.random() * 0.3, dist = 90 + Math.random() * 90;
    box.append(el("i", { style: `--x:${Math.round(Math.cos(angle) * dist)}px;--y:${Math.round(Math.sin(angle) * dist - 40)}px;` +
      `--r:${Math.round(Math.random() * 540 - 270)}deg;--c:${colours[i % colours.length]};--d:${Math.round(Math.random() * 120)}ms` }));
  }
  return box;
}

}
function lessonText(s, n, r) {
  const cards = r.rows.filter((x) => x.phase === "card"), practice = r.rows.filter((x) => x.phase === "practice");
  const secs = r.rows.reduce((t, x) => t + x.seconds, 0);
  const out = [`${subjectName(s)} Lesson ${n} (${TITLES[s][n]}) · ${r.at.slice(0, 16).replace("T", " ")} · ${Math.round(secs)}s · "I don't know" ${count(r.rows, "idk")}`,
    `  cards: ${count(cards, "right")} right, ${count(cards, "wrong")} wrong, ${count(cards, "idk")} IDK · practice: ${count(practice, "right")} right, ${count(practice, "wrong")} wrong, ${count(practice, "idk")} IDK`,
    `  needs review (missed twice): ${r.review.join(", ") || "none"}`];
  if (r.paper) {
    const items = teach.renderPaper(CONTENT[s][n], libs[s]).checklist;
    out.push(`  paper task (not marked; self-check by the pupil): ${r.paper.ticks.filter(Boolean).length} of ${items.length} ticked`,
      ...items.map((t, i) => `    ${r.paper.ticks[i] ? "[x]" : "[ ]"} ${t}`));

}

function allResultsText() {
  const out = [stamp(), ...readinessText()];
  const tables = [...(state.readiness?.rows || []).map(row)];
  for (const s of Object.keys(SUBJECTS)) {
    const done = LESSONS[s].filter((n) => state.lessons[lessonKey(s, n)]?.done);
    out.push(`${subjectName(s)}: lessons done ${done.length} of ${LESSONS[s].length}`, ...done.flatMap((n) => lessonText(s, n, state.lessons[lessonKey(s, n)])));
    tables.push(...done.flatMap((n) => state.lessons[lessonKey(s, n)].rows.map(row)));
  }
  return [...out, "", TABLE_HEAD, ...tables].join("\n");
}

async function copyText(text, status, details = null, area = null) {
  try { await navigator.clipboard.writeText(text); status.textContent = "Copied. Paste it into WhatsApp or a message."; }
  catch {
    if (details && area) { details.open = true; area.select(); document.execCommand("copy"); status.textContent = "Copied (or select the text below and copy it)."; }
    else status.textContent = "Could not copy on this phone.";
  }
}

function results(flow) {
  const s = S, n = N(), Ln = L();
  const review = teach.needsReview(flow).map((x) => (x.kind === "card" ? Ln.teach.cards[x.card].id : x.template));
  // The latest finished run of a lesson replaces the previous one.
  const record = { done: true, at: new Date().toISOString(), rows: C().rows, review, ...(C().paper ? { paper: C().paper } : {}) };
  record.stars = starsOf(record);
  state.lessons[lessonKey(s, n)] = record;
  delete state.current[s];
  save();
  const text = lessonResultsText(s, n);
  const area = el("textarea", { readonly: "", rows: "10", "aria-label": "Results" });
  // The text holds the readiness score and weak areas, so it stays folded away from the pupil (TR-C30).
  const details = el("details", { class: "grownup" }, el("summary", {}, "Show the text (for a grown-up)"), area);
  area.value = text;
  const status = para("", "muted");
  const completed = flow.steps.filter((x) => x.kind === "card" || x.kind === "practice").length;
  const next = nextLesson(s);
  const badges = newBadges(), st = streak();
  screen(confetti(), el("div", { class: "done" }, el("div", { class: "done-title" }, T("Lesson {n} done", { n })),
    el("div", { class: "done-stars", "aria-label": `${record.stars} of 3 stars` }, [1, 2, 3].map((k) => el("span", { class: k <= record.stars ? "star on" : "star", style: `--k:${k}` }, "★"))),
    para(Ln.paper_task ? `You completed ${completed} questions and a writing task.` : T("You completed {a} questions.", { a: completed }), "done-sub"),
    st ? para(T("🔥 {a}-day streak", { a: st }), "done-streak") : null),
    badges.map(([, icon, name]) => el("div", { class: "new-badge" }, el("span", { "aria-hidden": "true" }, icon), el("strong", {}, T("New badge: {a}", { a: name })))),
    next ? button(T("Next: Lesson {a}", { a: next }), () => openLesson(s, next), "primary") : para(T("You have done every {a} lesson. Well done!", { a: subjectName(s) }), "strong"),
    button(T("Back to the lessons"), menu, next ? "" : "primary"),
    button(T("All subjects"), home, "link"),
    para("For a grown-up: these results stay on this phone until you copy them.", "muted"),
    button("Copy results", () => copyText(text, status, details, area), ""), status, details);
}

// Start-up is at the end of review.js (pupils: the lesson menu; teachers with ?review: the review list).

// Teacher review mode (2026-10-17): open the app with ?review in the link. A teacher sees every lesson with its answers
// shown, marks each part ✓ OK or ✗ Problem with an optional comment, then sends the review as one message
// (WhatsApp or any app, through the phone's share sheet, or copied). Marks are kept on this phone only; nothing is sent
// unless the teacher sends it. Pupils never see this mode. Every mark carries the item's id, so fixes are exact.
/* global ENGINE, CONTENT, TITLES, LESSONS, SUBJECTS, BUILD, MODE, subjectName */

const REVIEW_KEY = "psalmspreps-review-v1";
const loadReview = () => {
  try { return { name: "", marks: {}, ...JSON.parse(localStorage.getItem(REVIEW_KEY)) }; } catch { return { name: "", marks: {} }; }
};
const review = loadReview();
const saveReview = () => { try { localStorage.setItem(REVIEW_KEY, JSON.stringify(review)); } catch { /* still works, just forgets */ } };
const markKey = (s, n, id) => `${s}:${n}:${id}`;
let RS = Object.keys(SUBJECTS)[0];  // subject shown in review mode

/** Every reviewable part of a lesson, in teaching order: note, cards (with their check), worked example, practice. */
function reviewItems(s, n) {
  const l = CONTENT[s][n];
  const items = [{ id: "note", kind: "Note (summary)" }];
  for (const c of l.teach.cards) items.push({ id: c.id, kind: "Teach card", card: c });
  items.push({ id: "worked", kind: "Worked example" });
  if (l.paper_task) items.push({ id: "paper", kind: "Writing task" });
  for (const t of l.questions || []) items.push({ id: t.id, kind: `Practice · level ${t.level}`, tpl: t });
  return items;
}
const lessonCounts = (s, n) => {
  const items = reviewItems(s, n), marks = items.map((it) => review.marks[markKey(s, n, it.id)]).filter(Boolean);
  return { total: items.length, done: marks.length, problems: marks.filter((m) => !m.ok).length };
};

/** One generated question with its answer and working shown. */
function shownQuestion(q, tpl) {
  const out = [el("div", { class: "prompt pre" }, q.prompt || ""), figureBox(q.figure)];
  if (q.sentence) out.push(el("div", { class: "sentence" }, q.sentence));
  if (q.options) {
    out.push(el("ul", { class: "rv-options" }, q.options.map((o, i) => el("li", { class: i === q.correctIndex ? "rv-right" : "" },
      `${i === q.correctIndex ? (q.type === "spot_error" ? "✗ (the wrong one) " : "✓ ") : "• "}${o.text}`,
      o.explain && i !== q.correctIndex ? el("div", { class: "muted" }, `Feedback if chosen: ${o.explain}`) : null))));
  } else if (q.type === "numeric") {
    out.push(para(`Answer: ${q.answer}${q.unit ? " " + q.unit : ""}`, "strong"),
      ...q.misconceptions.map((m) => para(`If the pupil types ${m.value}: ${m.explain}`, "muted")));
  } else if (q.type === "cloze") {
    out.push(para(`Accepted answer: ${q.accept.join(" or ")}`, "strong"), ...q.misconceptions.map((m) => para(`If the pupil types ${m.value}: ${m.explain}`, "muted")));
  } else if (q.type === "ordering" || q.type === "word_order") {
    out.push(para(`Shown mixed up: ${q.items.join(" · ")}`, "muted"), para(`Right answer: ${q.answer}`, "strong"));
  }
  out.push(el("div", { class: "example" }, el("div", { class: "kicker" }, "Working shown after a second miss"), el("ol", {}, q.solution.map((x) => el("li", {}, x)))));
  out.push(para(tpl.review === "rule" ? "Answer computed by the app’s rules." : "Answer written by a person: please check it.", "rv-tag"));
  return out;
}

/** The content of one item, generated with `seed` (a new seed shows another example of the same question). */
function itemBody(s, n, it, seed) {
  const l = CONTENT[s][n], lib = libs[s];
  if (it.id === "note") return [el("div", { class: "note" }, ...lines(l.note.text))];
  if (it.id === "worked") {
    const w = renderWorked(l.worked_example, lib);
    return [el("div", { class: "strong pre" }, w.problem), figureBox(w.figure), el("ol", {}, w.steps.map((x) => el("li", {}, x))), para(`Answer: ${w.answer}`, "strong")];
  }
  if (it.id === "paper") {
    const p = teach.renderPaper(l, lib);
    return [el("div", { class: "pre" }, p.prompt), el("div", { class: "kicker" }, "Model answer"), ...p.model.map((m) => para(m)),
      el("div", { class: "kicker" }, "Self-check list"), el("ul", {}, p.checklist.map((c) => el("li", {}, c)))];
  }
  if (it.card) {
    const c = teach.renderCard(it.card, lib), tpl = teach.cardCheckTemplate(l, it.card);
    return [el("div", { class: "idea" }, c.idea), cardExample(c), el("div", { class: "kicker" }, `Check question (${tpl.id})`),
      ...shownQuestion(template.instantiate(tpl, seed, lib, n), tpl)];
  }
  return shownQuestion(template.instantiate(it.tpl, seed, lib, n), it.tpl);
}

function reviewItem(s, n, it) {
  const key = markKey(s, n, it.id);
  let seed = 1;
  const box = el("section", { class: "rv-item" });
  const draw = () => {
    const m = review.marks[key];
    const note = el("textarea", { rows: "2", class: "rv-note", placeholder: "Comment (what is wrong, or the correction)", "aria-label": `Comment on ${it.id}` });
    note.value = m?.note || "";
    const mark = (ok) => { review.marks[key] = { ok, note: note.value.trim(), at: new Date().toISOString() }; saveReview(); draw(); };
    note.addEventListener("change", () => { if (review.marks[key]) { review.marks[key].note = note.value.trim(); saveReview(); } });
    box.className = `rv-item${m ? (m.ok ? " rv-is-ok" : " rv-is-bad") : ""}`;
    fill(box, [
      el("div", { class: "rv-head" }, el("span", { class: "kicker" }, it.kind), el("code", {}, it.id)),
      ...itemBody(s, n, it, seed),
      it.tpl || it.card ? button("Show another example", () => { seed += 1; draw(); }, "link") : null,
      note,
      el("div", { class: "rv-buttons" }, button("✓ OK", () => mark(true), m?.ok === true ? "primary" : ""), button("✗ Problem", () => mark(false), m?.ok === false ? "rv-bad-on" : "")),
      m ? para(m.ok ? "Marked OK." : "Marked as a problem.", "muted") : null,
    ]);
  };
  draw();
  return box;
}

function reviewLesson(s, n) {
  if (!CONTENT[s]) return withSubject(s, () => reviewLesson(s, n));
  const c = lessonCounts(s, n);
  screen(header(`Review · ${subjectName(s)} · Lesson ${n}`, TITLES[s][n]),
    para(`${c.done} of ${c.total} parts checked${c.problems ? ` · ${c.problems} problem${c.problems === 1 ? "" : "s"}` : ""}. Answers are shown. Mark each part, and add a comment when something is wrong.`, "muted"),
    reviewItems(s, n).map((it) => reviewItem(s, n, it)),
    button("Back to the review list", reviewHome, "primary"));
}

/** The message a teacher sends: every problem with its comment, then the OKs counted per lesson. */
function reviewText() {
  const out = [`Psalms Preps teacher review · ${review.name || "(name not given)"} · app ${BUILD} · ${new Date().toISOString().slice(0, 16).replace("T", " ")}`];
  // In the installed app only the subjects opened so far are on the phone: skip the others (sendReview loads every
  // subject that has marks before building the text).
  for (const s of Object.keys(SUBJECTS).filter((x) => CONTENT[x])) for (const n of LESSONS[s]) {
    const items = reviewItems(s, n).map((it) => [it, review.marks[markKey(s, n, it.id)]]).filter(([, m]) => m);
    if (!items.length) continue;
    const ok = items.filter(([, m]) => m.ok);
    out.push("", `${subjectName(s)} Lesson ${n} (${TITLES[s][n]}): ${items.length} of ${reviewItems(s, n).length} checked, ${items.length - ok.length} problem(s)`);
    for (const [it, m] of items) if (!m.ok || m.note) out.push(`  ${m.ok ? "✓" : "✗"} ${s}:${n}:${it.id}${m.note ? ` — ${m.note}` : ""}`);
  }
  return out.join("\n");
}

async function sendReview(status) {
  const marked = [...new Set(Object.keys(review.marks).map((k) => k.split(":")[0]))].filter((s) => SUBJECTS[s]);
  try { await loadAll(marked); } catch { status.textContent = "Connect to the internet once, then send again."; return; }
  const text = reviewText();
  try {
    if (navigator.share) { await navigator.share({ title: "Teacher review", text }); status.textContent = "Shared."; return; }
  } catch { /* cancelled or not allowed: fall back to copying */ }
  try { await navigator.clipboard.writeText(text); status.textContent = "Copied. Paste it into WhatsApp or a message to Dion."; }
  catch { status.textContent = "Could not copy: select the text below and copy it."; }
}

function reviewHome() {
  if (!CONTENT[RS]) return withSubject(RS, reviewHome);
  // the subjects this teacher has marked are loaded too, so the review text below is complete
  const missing = [...new Set(Object.keys(review.marks).map((k) => k.split(":")[0]))].find((s) => SUBJECTS[s] && !CONTENT[s]);
  if (missing) return withSubject(missing, reviewHome);
  document.documentElement.lang = "en";
  const name = el("input", { type: "text", class: "rv-name", placeholder: "Your name", "aria-label": "Your name", autocomplete: "name" });
  name.value = review.name;
  name.addEventListener("change", () => { review.name = name.value.trim(); saveReview(); });
  const tabs = el("div", { class: "subjects", role: "tablist" }, Object.keys(SUBJECTS).map((id) =>
    el("button", { type: "button", role: "tab", "aria-selected": String(id === RS), class: `subject${id === RS ? " on" : ""}`, onclick: () => { RS = id; reviewHome(); } }, subjectName(id))));
  const rows = LESSONS[RS].map((n) => {
    const c = lessonCounts(RS, n);
    const mark = c.done === c.total ? (c.problems ? "!" : "✓") : c.done ? "…" : String(n);
    return el("button", { type: "button", class: `lesson${c.done === c.total && !c.problems ? " is-done" : ""}`, onclick: () => reviewLesson(RS, n) },
      el("span", { class: "mark", "aria-hidden": "true" }, mark),
      el("span", { class: "lt" }, el("span", { class: "ln" }, `Lesson ${n}`), TITLES[RS][n],
        el("span", { class: "sub" }, `${c.done} of ${c.total} checked${c.problems ? ` · ${c.problems} problem${c.problems === 1 ? "" : "s"}` : ""}`)));
  });
  const status = para("", "muted");
  const area = el("textarea", { readonly: "", rows: "8", "aria-label": "Review text" });
  area.value = reviewText();
  screen(header("Teacher review", "Check the lessons"),
    para("Thank you for reviewing. Open a lesson: every answer is shown. Mark each part ✓ OK or ✗ Problem, and write a comment when something is wrong. Your marks stay on this phone until you send them.", "muted"),
    name, tabs, el("div", { class: "lessons" }, rows),
    button("Send my review", () => sendReview(status), "primary"), status,
    el("details", { class: "grownup" }, el("summary", {}, "Show the review text"), area),
    button("Open the app as a pupil", () => { location.href = location.pathname; }, "link"));
}

// Start: teachers open the link with ?review; everyone else gets the pupil's lesson menu.
if (new URLSearchParams(location.search).has("review")) reviewHome(); else home();

</script>
