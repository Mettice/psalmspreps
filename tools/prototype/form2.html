"Tap the words in the right order.","answer":"{X.a}","accept":["{X.b}"]},{"id":"e2-1-spot","type":"spot_error","level":3,"review":"authored","sources":["reading-texts"],"prompt":"One sentence has a mistake. Which one?","pool":{"right":[{"text":"I travel to Limbe by bus.","truth":"true"},{"text":"She goes to school on foot.","truth":"true"},{"text":"How much is the fare?","truth":"true"},{"text":"We travelled by train last year.","truth":"true"},{"text":"How long does the journey take?","truth":"true"}],"wrong":[{"text":"He goes to school by foot.","truth":"false","explain":"Walking is on foot, not by foot."},{"text":"We travelled to Douala by the train.","truth":"false","explain":"After by there is no the: by train."},{"text":"How long is the fare?","truth":"false","explain":"The fare is money: How much is the fare?"},{"text":"I came here with taxi.","truth":"false","explain":"We say by taxi."}]},"pick":{"right":3,"wrong":1}}]},"2":{"subject":"english-language","class":"Form 2","lesson_no":2,"language":"en","prerequisites":[1],"skills":[{"id":"e2-2","name":"Travel words and basic spelling rules"}],"note":{"status":"draft","text":"Travel words: a journey (going from one place to another), the departure (leaving), the arrival (coming), the destination (the place you are going to), the timetable (the times of buses or trains), a passenger, the fare, a ticket, luggage, a delay (being late).\nSpelling rules when we add an ending:\n• A word ending in silent e drops the e before -ing: ride → riding, arrive → arriving (but not before -s: arrives).\n• One short vowel + one consonant, stressed at the end: double it: stop → stopping, plan → planned. British English also doubles l: travel → travelling.\n• Consonant + y changes y to i: carry → carries, carried; but vowel + y keeps the y: journey → journeys, delay → delayed.\n• A word ending in -ie changes ie to y before -ing: lie → lying.","checks":[]},"worked_example":{"status":"draft","vars":{"a":"travel","b":"arrive","c":"journey"},"problem":"Add -ing to {a} and {b}, and write the plural of {c}.","steps":["{a} ends in one vowel + l: British English doubles the l: {ing(a)}.","{b} ends in a silent e: drop the e: {ing(b)}.","{c} ends in a vowel + y: keep the y and add s: {plural(c)}."],"answer":"{ing(a)}, {ing(b)}, {plural(c)}","checks":["ing(a) == 'travelling' && ing(b) == 'arriving' && plural(c) == 'journeys'"]},"teach":{"cards":[{"id":"c2-1","status":"draft","idea":"The words of a journey: you leave at the departure time and reach your destination at the arrival time.","vars":{},"example":["Departure: seven o'clock, from Buea. Destination: Bamenda.","Arrival: two o'clock. A delay means the bus is late."],"checks":[],"check":{"ref":"e2-2-words"}},{"id":"c2-2","status":"draft","idea":"Drop a silent e before -ing: ride → riding.","vars":{"v":"ride","w":"arrive"},"example":["{v} → {ing(v)}","{w} → {ing(w)}"],"checks":[],"check":{"id":"e2-2-c2","type":"cloze","level":1,"review":"rule","sources":["spelling-rules"],"vars":{"v":{"pick":["ride","arrive","drive","leave","take","make","come","use","move","write"]}},"prompt":"Write the -ing form of the verb.","text":"{v} → ___","answer":"ing(v)","misconceptions":[{"id":"kept-e","wrong":"v + 'ing'","explain":"Drop the silent e before -ing: {ing(v)}."}]}},{"id":"c2-3","status":"draft","idea":"Double the last consonant after one short stressed vowel: stop → stopping, plan → planned. British English doubles l too: travel → travelling.","vars":{"v":"stop","w":"travel"},"example":["{v} → {ing(v)}, {past(v)}","{w} → {ing(w)}, {past(w)}"],"checks":[],"check":{"ref":"e2-2-double"}},{"id":"c2-4","status":"draft","idea":"Consonant + y: change y to i before -es or -ed. Vowel + y: keep the y.","vars":{},"example":["carry → {thirdPerson('carry')}, {past('carry')}","journey → {plural('journey')}; delay → {past('delay')}"],"checks":[],"check":{"ref":"e2-2-y"}}]},"questions":[{"id":"e2-2-words","type":"matching","level":1,"review":"authored","sources":["vocabulary"],"prompt":"Match each travel word to its meaning.","pool":[{"left":"departure","right":"the time a bus, train or plane leaves"},{"left":"arrival","right":"the time a bus, train or plane comes in"},{"left":"destination","right":"the place you are travelling to"},{"left":"timetable","right":"a list of the times buses or trains leave and arrive"},{"left":"delay","right":"a time when something is late"},{"left":"journey","right":"going from one place to another"},{"left":"ticket","right":"a paper that shows you have paid to travel"}],"pick":4},{"id":"e2-2-double","type":"cloze","level":1,"review":"rule","sources":["spelling-rules"],"vars":{"v":{"pick":["stop","plan","travel","run","sit","swim","shop","cancel","begin","get"]}},"prompt":"Write the -ing form of the verb.","text":"{v} → ___","answer":"ing(v)","misconceptions":[{"id":"single","wrong":"v + 'ing'","explain":"Double the last consonant after one short stressed vowel: {ing(v)}."}]},{"id":"e2-2-y","type":"cloze","level":1,"review":"authored","sources":["spelling-rules"],"vars":{"X":{"pick":[{"s":"Tabe ___ his sister's bag.","a":"carries","w":["carrys","carryes"],"e":["Consonant + y: change y to i and add -es.","Change the y to i: carries."]},{"s":"The bus was ___ by the rain.","a":"delayed","w":["delaied","delayd"],"e":["Vowel + y: keep the y and add -ed.","Add -ed: delayed."]},{"s":"We made two long ___ last year.","a":"journeys","w":["journies","journeyes"],"e":["Vowel + y: keep the y and add s.","Just add s: journeys."]},{"s":"My mother ___ about the late bus.","a":"worries","w":["worrys","worryes"],"e":["Consonant + y: change y to i and add -es.","Change the y to i: worries."]},{"s":"She ___ at her aunt's house every holiday.","a":"stays","w":["staies","stayes"],"e":["Vowel + y: keep the y: stays.","Just add s: stays."]},{"s":"The children ___ to catch the bus.","a":"hurried","w":["hurryed","hurred"],"e":["Consonant + y: change y to i before -ed.","Keep the i: hurried."]}]}},"prompt":"Choose the correct spelling.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-2-use","type":"cloze","level":2,"review":"authored","sources":["vocabulary"],"vars":{"X":{"pick":[{"s":"Our ___ is Kribi: that is where we are going.","a":"destination","w":["departure","fare"],"e":["Departure is leaving.","The fare is the money you pay."]},{"s":"Check the ___ to see when the next train leaves.","a":"timetable","w":["luggage","passenger"],"e":["Luggage is bags.","A passenger is a traveller."]},{"s":"There was a long ___ because of an accident on the road.","a":"delay","w":["arrival","ticket"],"e":["Arrival is coming in.","A ticket shows you have paid."]},{"s":"The ___ of the plane is at 10:30, so we must be at the airport by nine.","a":"departure","w":["destination","journey"],"e":["The destination is the place you go to.","The journey is the whole trip."]},{"s":"Put your ___ under the seat, please.","a":"luggage","w":["fare","timetable"],"e":["The fare is money.","A timetable is a list of times."]}]}},"prompt":"Choose the word that fits.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-2-spot","type":"spot_error","level":3,"review":"authored","sources":["spelling-rules"],"prompt":"One word is spelt wrongly. Which sentence has it?","pool":{"right":[{"text":"We are travelling to Bamenda.","truth":"true"},{"text":"The bus is arriving now.","truth":"true"},{"text":"She carries a heavy bag.","truth":"true"},{"text":"Our journeys were long.","truth":"true"},{"text":"The ticket office is closing.","truth":"true"}],"wrong":[{"text":"We are traveling to Bamenda.","truth":"false","explain":"British English, used in Cameroon, doubles the l: travelling."},{"text":"The b raft","idea":"With he, she, it or one person or thing, the Simple Present verb takes -s or -es.","vars":{"v":"take","c":"the bus"},"example":["I {v} {c}.","My uncle {thirdPerson(v)} {c}."],"checks":[],"check":{"ref":"e2-3-form"}},{"id":"c3-2","status":"draft","idea":"Timetables and facts are in the Simple Present too.","vars":{},"example":["The train to Douala leaves at nine.","The sun rises in the east."],"checks":[],"check":{"id":"e2-3-c2","type":"mcq","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"q":"The bus leaves at six every morning.","r":"It is a timetable.","w":["It is happening now.","It happened yesterday.","It will happen once."],"e":["“Every morning” shows a fixed time, not now.","Yesterday needs the past.","It happens every morning."],"y":"A fixed time of a bus is a timetable."},{"q":"Water boils at one hundred degrees.","r":"It is a fact.","w":["It is happening now.","It is a plan for tomorrow.","It happened last week."],"e":["It is always true, not only now.","It is always true.","It is always true, not past."],"y":"It is always true: a fact."},{"q":"My sister walks to school every day.","r":"It is a habit.","w":["It is happening now.","It is a timetable.","It happened once."],"e":["“Every day” shows a habit.","It is what a person does regularly.","“Every day” means many times."],"y":"Something she does every day is a habit."},{"q":"The market opens at seven on Saturdays.","r":"It is a timetable.","w":["It is a habit of one person.","It is happening now.","It happened yesterday."],"e":["It is a fixed time for everyone.","It is a fixed time, not now.","It is not past."],"y":"A fixed opening time is a timetable."},{"q":"Cows eat grass.","r":"It is a fact.","w":["It is happening now.","It is a timetable.","It happened last year."],"e":["It is always true.","There is no time in it.","It is always true."],"y":"It is always true: a fact."}]}},"prompt":"Why is “{X.q}” in the Simple Present?","correct":"{X.r}","distractors" ","c":"a bicycle"},{"v":"watch","c":"the news"},{"v":"study","c":"in the evening"},{"v":"fix","c":"motorbikes"},{"v":"pay","c":"the fare"},{"v":"have","c":"breakfast at six"}]}},"prompt":"Write the verb in the Simple Present.","text":"{S.t} ___ {V.c} every day. ({V.v})","answer":"presentFor(S.s, V.v)","misconceptions":[{"id":"no-s","wrong":"V.v","explain":"With {S.m} the verb takes -s or -es: {presentFor(S.s, V.v)}.","when":"presentFor(S.s, V.v) != V.v"},{"id":"extra-s","wrong":"thirdPerson(V.v)","explain":"With {S.m}, the verb has no -s: {V.v}.","when":"presentFor(S.s, V.v) == V.v"}]},{"id":"e2-3-neg","type":"cloze","level":1,"review":"rule","sources":["grammar-tenses"],"vars":{"S":{"pick":[{"t":"I","m":"I","s":{"text":"I","person":1,"plural":false}},{"t":"You","m":"you","s":{"text":"you","person":2,"plural":false}},{"t":"We","m":"we","s":{"text":"we","person":1,"plural":true}},{"t":"They","m":"they","s":{"text":"they","person":3,"plural":true}},{"t":"He","m":"he","s":{"text":"he","person":3,"plural":false}},{"t":"She","m":"she","s":{"text":"she","person":3,"plural":false}},{"t":"Bih","m":"Bih","s":{"text":"Bih","person":3,"plural":false}},{"t":"Ayuk","m":"Ayuk","s":{"text":"Ayuk","person":3,"plural":false}},{"t":"My mother","m":"my mother","s":{"text":"my mother","person":3,"plural":false}},{"t":"Our teacher","m":"our teacher","s":{"text":"our teacher","person":3,"plural":false}},{"t":"Tabe and Ndi","m":"Tabe and Ndi","s":{"text":"Tabe and Ndi","person":3,"plural":true}},{"t":"My cousins","m":"my cousins","s":{"text":"my cousins","person":3,"plural":true}}]},"V":{"pick":[{"v":"take","c":"the bus to school"},{"v":"catch","c":"a taxi at the junction"},{"v":"wash","c":"the car on Saturdays"},{"v":"carry","c":"the luggage"},{"v":"go","c":"to the market"},{"v":"ride","c":"a bicycle"},{"v":"watch","c":"the news"},{"v":"study","c":"in the evening"},{"v":"fix","c":"motorbikes"},{"v":"pay","c":"the fare"},{"v":"have","c":"breakfast at six"}]}},"prompt":"Choose the word that fits.","text":"{S.t} ___ {V.v} {V.c}.","answer":"dontFor(S.s)","choices":[{"text":"don't","misconception":"dont"},{"text":"doesn't","misconception":"doesnt"},{"text":"isn't","misconception":"isnt"}],"misconceptions":[{"id":"dont","explain":"Don't goes with I, you, we and they."},{"id":"doesnt","explain":"Doesn't goes with he, she and it (one person or thing)."},{"id":"isnt","explain":"With an action verb like {V.v}, use don't or doesn't."}],"show":3},{"id":"e2-3-adverb","type":"word_order","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"a":"She always takes a taxi to work.","b":"She always takes a taxi to work."},{"a":"The bus is never late.","b":"The bus is never late."},{"a":"We usually walk to school.","b":"We usually walk to school."},{"a":"My father often travels to Yaoundé.","b":"My father often travels to Yaoundé."},{"a":"They sometimes miss the bus.","b":"They sometimes miss the bus."},{"a":"The train is always full on Fridays.","b":"The train is always full on Fridays."}]}},"prompt":"Tap the words in the right order. Put the adverb in its place.","answer":"{X.a}","accept":["{X.b}"]},{"id":"e2-3-does","type":"cloze","level":2,"review":"rule","sources":["grammar-tenses"],"vars":{"S":{"pick":[{"t":"I","m":"I","s":{"text":"I","person":1,"plural":false}},{"t":"You","m":"you","s":{"text":"you","person":2,"plural":false}},{"t":"We","m":"we","s":{"text":"we","person":1,"plural":true}},{"t":"They","m":"they","s":{"text":"they","person":3,"plural":true}},{"t":"He","m":"he","s":{"text":"he","person":3,"plural":false}},{"t":"She","m":"she","s":{"text":"she","person":3,"plural":false}},{"t":"Bih","m":"Bih","s":{"text":"Bih","person":3,"plural":false}},{"t":"Ayuk","m":"Ayuk","s":{"text":"Ayuk","person":3,"plural":false}},{"t":"My mother","m":"my mother","s":{"text":"my mother","person":3,"plural":false}},{"t":"Our teacher","m":"our teacher","s":{"text":"our teacher","person":3,"plural":false}},{"t":"Tabe and Ndi","m":"Tabe and Ndi","s":{"text":"Tabe and Ndi","person":3,"plural":true}},{"t":"My cousins","m":"my cousins","s":{"text":"my cousins","person":3,"plural":true}}]},"V":{"pick":[{"v":"take","c":"the bus to school"},{"v":"catch","c":"a taxi at the junction"},{"v":"wash","c":"the car on Saturdays"},{"v":"carry","c":"the luggage"},{"v":"go","c":"to the market"},{"v":"ride","c":"a bicycle"},{"v":"watch","c":"the news"},{"v":"study","c":"in the evening"},{"v":"fix","c":"motorbikes"},{"v":"pay","c":"the fare"},{"v":"have","c":"breakfast at six"}]}},"prompt":"Choose the word that starts the question.","text":"___ {S.m} {V.v} {V.c}?","answer":"doFor(S.s) == 'does' ? 'Does' : 'Do'","choices":[{"text":"Do","misconception":"do"},{"text":"Does","misconception":"does"},{"text":"Is","misconception":"is"}],"misconceptions":[{"id":"do","explain":"Do goes with I, you, we and they."},{"id":"does","explain":"Does goes with he, she and it."},{"id":"is","explain":"With an action verb, the question uses do or does."}],"where":["S.t != 'I'"],"show":3},{"id":"e2-3-spot","type":"spot_error","level":3,"review":"authored","sources":["grammar-tenses"],"prompt":"One sentence has a mistake. Which one?","pool":{"right":[{"text":"My brother takes the bus every day.","truth":"true"},{"text":"The train leaves at nine.","truth":"true"},{"text":"Does she walk to school?","truth":"true"},{"text":"We never travel at night.","truth":"true"},{"text":"I want a window seat.","truth":"true"},{"text":"Mr Tanyi doesn't drive at night.","truth":"true"}],"wrong":[{"text":"She don't like long journeys.","truth":"false","explain":"With she, use doesn't."},{"text":"Does he takes a taxi?","truth":"false","explain":"After does, the verb has no -s: Does he take a taxi?"},{"text":"The bus late is never.","truth":"false","explain":"Never goes after is: The bus is never late."},{"text":"I am knowing the driver.","truth":"false","explain":"Know is a state verb: I know the driver."},{"text":"My uncle drive a lorry.","truth":"false","explain":"With ourney.","That closes the paragraph."],"y":"It says what the whole paragraph is about."},{"r":"My journey to Kribi by bus was long but exciting.","w":["After that we ate.","Kribi has a beach.","The driver was called Tanyi."],"e":["That is a detail.","That is about the town, not the journey.","That is a small detail."],"y":"It names the journey and gives the main idea."},{"r":"Last month my family took a bus from Limbe to Yaoundé.","w":["First we bought tickets.","Yaoundé is the capital.","I was very tired at the end."],"e":["That is the first detail, not the topic.","That is not about the journey.","That is a closing sentence."],"y":"It tells who travelled, where and how."}]}},"prompt":"Which sentence is the best topic sentence for a paragraph about a bus journey?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}},{"id":"c4-2","status":"draft","idea":"Sequence words show the order of events: first, then, after that, later, finally.","vars":{},"example":["First I bought a ticket. Then I found a seat.","After that the bus left. Finally we arrived."],"checks":[],"check":{"ref":"e2-4-order"}},{"id":"c4-3","status":"draft","idea":"A story about a past journey is in the Simple Past.","vars":{},"example":["I {past('go')} to the motor park and {past('buy')} a ticket.","The bus {past('leave')} at eight and we {past('arrive')} at noon."],"checks":[],"check":{"id":"e2-4-c3","type":"cloze","level":1,"review":"rule","sources":["grammar-tenses"],"vars":{"v":{"pick":["go","travel","ride","drive","come","fly","walk","hurry"]}},"prompt":"Write the verb in the Simple Past.","text":"Last week we ___ to Limbe by bus. ({v})","answer":"past(v)","misconceptions":[{"id":"present","wrong":"v","explain":"The journey was last week: use the past, {past(v)}."},{"id":"ed","wrong":"v + 'ed'","explain":"Check the past form: {past(v)}."}]}}]},"questions":[{"id":"e2-4-order","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the sentences of the paragraph in order.","items":[{"text":"Last Saturday I travelled to Bamenda by bus"},{"text":"First I bought my ticket at the agency"},{"text":"Then the conductor loaded my bag"},{"text":"After that the bus left the park"},{"text":"Finally we arrived in the afternoon"}],"order":"as_written"}],"paper_task":{"status":"draft","vars":{},"prompt":"Write one paragraph (six to eight sentences) in your exercise book about a journey you made by bus. Start with a topic sentence, give the events in order with sequence words, use the Simple Past, and end with how you felt.","model":["Last December I travelled from Kumba to Douala by bus. First my father took me to the motor park and bought my ticket. Then the conductor put my bag on the roof and I found a seat by the window. After that the bus left, and I watched the plantations go past. On the way we stopped at a checkpoint, and later at a market where I bought groundnuts. Finally we arrived in Douala in the evening. I was tired, but I was happy to see my cousins waiting for me."],"checklist":["My paragraph starts with a topic sentence.","The events are in the order they happened.","I used sequence words (first, then, after that, finally).","My verbs are in the Simple Past.","I wrote by bus, by taxi (not by the bus).","My last sentence closes the paragraph.","Every sentence starts with a capital letter and ends with a full stop."]}},"5":{"subject":"english-language","class":"Form 2","lesson_no":5,"language":"en","prerequisites":[],"skills":[{"id":"e2-5","name":"Health professionals; reading an interview with a dentist"}],"note":{"status":"draft","text":"Health professionals are people trained to care for our health:\n• a doctor treats illnesses; a nurse cares for patients and helps the doctor;\n• a dentist cares for teeth and gums; an optician tests eyes for glasses;\n• a pharmacist prepares and sells medicines; a midwife helps women give birth;\n• a physiotherapist helps people move again after an injury.\nIn the interview, a journalist asked a dentist questions. The dentist said we should visit a dentist twice a year, that sugar causes tooth decay, and that we should brush in the morning and before we sleep.\nAt a clinic, say what is wrong: “I have a toothache.” “My eyes hurt when I read.” The professional may ask: “How long have you had it?”","checks":[]},"worked_example":{"status":"draft","vars":{"n":"Manka"},"problem":"{n} has a toothache. Write what she says to the receptionist, and what the dentist may ask her.","steps":["To the receptionist: “Good morning. I have a toothache. Can I see the dentist, please?”","The dentist asks where and how long: “Which tooth hurts? How long have you had the pain?”","{n} answers clearly: “The back tooth on the left. Since Monday.”"],"answer":"“I have a toothache. Can I see the dentist, please?” — “Which tooth hurts? How long have you had the pain?”","checks":[]},"teach":{"cards":[{"id":"c5-1","status":"draft","idea":"Read the interview between a journalist and a dentist.","vars":{},"example":["Journalist: Good morning, doctor. What does a dentist do?","Dentist: I take care of people's teeth and gums. I check them, clean them, fill holes and sometimes take out bad teeth.","Journalist: How often should we visit a dentist?","Dentist: Twice a year, even when nothing hurts. A small problem is easier to treat.","Journalist: What causes tooth decay?","Dentist: Sugar. Sweets and soft drinks feed the germs that make holes in our teeth. Brush in the morning and before you sleep."],"checks":[],"check":{"id":"e2-5-c1","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"How often should we visit a dentist?","r":"twice a year","w":["once a week","only when a tooth hurts","every day"],"e":["The dentist did not say once a week.","The dentist said to go even when nothing hurts.","The dentist said twice a year."],"y":"The dentist said twice a year."},{"q":"What causes tooth decay?","r":"sugar","w":["water","brushing","fruit"],"e":["The dentist did not talk about water.","Brushing protects teeth.","The dentist said sugar."],"y":"The dentist said sugar feeds the germs that make holes."},{"q":"When should we brush our teeth?","r":"in the morning and before we sleep","w":["only after lunch","once a week","only when they hurt"],"e":["The dentist said morning and night.","The dentist said every morning and night.","We brush to keep them healthy."],"y":"The dentist said in the morning and before you sleep."},{"q":"Who asked the questions?","r":"the journalist","w":["the dentist","a nurse","a patient"],"e":["The dentist answered.","There is no nurse in the interview.","There is no patient in the interview."],"y":"The journalist asked; the dentist answered."}]}},"prompt":"From the interview: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}},{"id":"c5-2","status":"draft","idea":"Each health professional has a special job.","vars":{},"example":["A dentist cares for teeth; an optician tests eyes.","A pharmacist sells medicines; a midwife helps women give birth."],"checks":[],"check":{"ref":"e2-5-who"}},{"id":"c5-3","status":"draft","idea":"At a clinic, say clearly what is wrong, and answer the questions.","vars":{},"example":["“I have a headache.” “My ear hurts.”","“How long have you had it?” — “Since yesterday.”"],"checks":[],"check":{"ref":"e2-5-say"}}]},"questions":[{"id":"e2-5-who","type":"matching","level":1,"review":"authored","sources":["vocabulary"],"prompt":"Match each health professional to the job.","pool":[{"left":"dentist","right":"cares for teeth and gums"},{"left":"optician","right":"tests eyes and makes glasses"},{"left":"pharmacist","right":"prepares and sells medicines"},{"left":"midwife","right":"helps women give birth"},{"left":"nurse","right":"cares for patients and helps the doctor"},{"left":"physiotherapist","right":"helps people move again after an injury"}],"pick":4},{"id":"e2-5-say","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"Your tooth hurts.","r":"I have a toothache.","w":["I have a headache.","I have a stomach ache.","My ear is fine."],"e":["A headache is in the head.","A stomach ache is in the stomach.","That does not say what is wrong."],"y":"A pain in a tooth is a toothache."},{"q":"The nurse asks how long you have had the pain.","r":"Since Monday.","w":["In my head.","Yes, please.","Two tablets."],"e":["That answers Where.","That does not answer How long.","That is about medicine."],"y":"How long asks about time: since Monday."},{"q":"You want to see the dentist.","r":"Can I see the dentist, please?","w":["Give me the dentist.","Dentist, come here.","I want dentist now."],"e":["That is not polite.","That is not polite.","That is not polite or correct."],"y":"Can I …, please? is polite."},{"q":"The doctor asks where it hurts. Your stomach hurts.","r":"Here, in my stomach.","w":["Since yesterday.","I am fine, thank you.","At the pharmacy."],"e":["That answers How long.","That does not say where it hurts.","That is a place in town."],"y":"Where asks about the place on your body."}]}},"prompt":"You are at the clinic. {X.q} What do you say?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}"," "explain":"With they, use are."},{"text":"She is siting near the window.","truth":"false","explain":"Double the t: sitting."}]},"pick":{"right":3,"wrong":1}}]},"9":{"subject":"english-language","class":"Form 2","lesson_no":9,"language":"en","prerequisites":[],"skills":[{"id":"e2-9","name":"Talking about pandemics and contagious diseases; reading about an outbreak"}],"note":{"status":"draft","text":"A contagious disease passes from one person to another, for example cholera, measles, tuberculosis and COVID-19. An epidemic is when many people in one area catch a disease at the same time; a pandemic is an epidemic that spreads across many countries, like COVID-19 in 2020.\nIn the text, cholera spread through dirty water and food. The sick lost water through diarrhoea and vomiting. They were treated with oral rehydration salts (ORS) and in hospital. Families boiled their water, washed their hands with soap and used latrines.\nMalaria is a serious illness, but it is not contagious: mosquitoes carry it from person to person, so we sleep under a mosquito net.\nTalking about illness: “What are the symptoms?” “How does it spread?” “How can we prevent it?”","checks":[]},"worked_example":{"status":"draft","vars":{"d":"cholera"},"problem":"Answer three questions about {d} from the text: How does it spread? What are the symptoms? How can we prevent it?","steps":["How it spreads: people drink dirty water or eat food that is not clean.","Symptoms: watery diarrhoea and vomiting, so the body loses water.","Prevention: boil or treat drinking water, wash hands with soap, use latrines."],"answer":"It spreads through dirty water and food; it causes diarrhoea and vomiting; we prevent it with clean water, handwashing and latrines.","checks":[]},"teach":{"cards":[{"id":"c9-1","status":"draft","idea":"Read the text about a cholera outbreak.","vars":{},"example":["Last rainy season there was an outbreak of cholera in a town near the coast. Cholera is a contagious disease: it spreads when peo usty wind, the harmattan, blows from the Sahara.\nThe weather is unpredictable: we cannot always know what it will do.\nTalking about the weather:\n• What's the weather like today? — It's sunny / cloudy / rainy / windy / foggy.\n• It's raining. It's going to rain. The sky is clear.\n• What's the temperature? — About thirty degrees.\nUse it as the subject: “It is hot.” “It rained all night.”","checks":[]},"worked_example":{"status":"draft","vars":{"t":"Buea"},"problem":"Describe the weather in {t} on a day that changes: a bright morning and a stormy afternoon.","steps":["Use it as the subject: It was sunny and warm in the morning, and the sky was clear.","Say what changed: In the afternoon dark clouds came, and it began to rain heavily.","Add a detail: There was thunder and lightning, and the roads were muddy."],"answer":"It was sunny in the morning, but in the afternoon it rained heavily, with thunder and lightning.","checks":[]},"teach":{"cards":[{"id":"c13-1","status":"draft","idea":"Read the text about the seasons in Cameroon.","vars":{},"example":["Cameroon has two main seasons: the rainy season and the dry season. In the south, the rains are heavy, and on some days a sunny morning ends with a thunderstorm in the afternoon.","In the north, the dry season is long and hot. From about November to February, a dry, dusty wind called the harmattan blows from the Sahara. The sky looks grey, and people's lips and skin become dry.","Farmers watch the weather closely. If the first rains come late, the crops suffer. That is why people say the weather is unpredictable: we cannot always know what it will do."],"checks":[],"check":{"id":"e2-13-c1","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"What are the two main seasons in Cameroon?","r":"the rainy season and the dry season","w":["summer and winter","spring and autumn","the hot season and the snowy season"],"e":["The text does not talk about summer and winter.","The text names the rainy season and the dry season.","There is no snowy season in the text."],"y":"The text says the rainy season and the dry season."},{"q":"What is the harmattan?","r":"a dry, dusty wind","w":["a heavy rain","a kind of crop","a thunderstorm"],"e":["The harmattan is dry.","It is a wind.","Thunderstorms come in the south in the rains."],"y":"The text says the harmattan is a dry, dusty wind from the Sahara."},{"q":"Where does the harmattan come from?","r":"the Sahara","w":["the sea","the mountains of the south","the forest"],"e":["The text says the Sahara.","The text says the Sahara.","The text says the Sahara."],"y":"It blows from the Sahara."},{"q":"Why do farmers watch the weather closely?","r":"If the first rains come late, the crops suffer.","w":["They like the harmattan.","They want to travel.","The sky is grey."],"e":["The text does not say that.","The text does not talk about travel.","That is about the harmattan, not the reason."],"y":"Late rains make the crops suffer."}]}},"prompt":"From the text about the seasons: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}},{"id":"c13-2","status":"draft","idea":"Ask “What's the weather like?” and answer with It is + an adjective.","vars":{},"example":["What's the weather like? — It's windy and cloudy.","It's raining now. It's going to rain later."],"checks":[],"check":{"ref":"e2-13-reply"}},{"id":"c13-3","status":"draft","idea":"Unpredictable means we cannot always say what will happen.","vars":{},"example":["The weather is unpredictable: a sunny morning can end with a storm.","A predictable bus comes at the same time every day."],"checks":[],"check":{"ref":"e2-13-meaning"}}]},"questions":[{"id":"e2-13-reply","type":"mcq","level": rompt":"One sentence has a mistake. Which one?","pool":{"right":[{"text":"It is raining heavily.","truth":"true"},{"text":"It was windy yesterday.","truth":"true"},{"text":"What's the weather like today?","truth":"true"},{"text":"The harmattan is a dry wind.","truth":"true"},{"text":"It's going to rain this afternoon.","truth":"true"}],"wrong":[{"text":"It raining since morning.","truth":"false","explain":"The verb needs is or has been: It has been raining since morning."},{"text":"How is the weather like?","truth":"false","explain":"Say: What is the weather like? or How is the weather?"},{"text":"Yesterday it is very hot.","truth":"false","explain":"Yesterday is past: it was very hot."}]},"pick":{"right":3,"wrong":1}}]},"14":{"subject":"english-language","class":"Form 2","lesson_no":14,"language":"en","prerequisites":[13],"skills":[{"id":"e2-14","name":"Weather words"}],"note":{"status":"draft","text":"Weather words:\n• Rain: a drizzle (light rain), a shower (short rain), a downpour (very heavy rain), a thunderstorm (rain with thunder and lightning).\n• Wind: a breeze (a gentle wind), a gale (a very strong wind), the harmattan (a dry, dusty wind).\n• Sky: clear, cloudy, overcast (completely grey), foggy or misty (you cannot see far).\n• Temperature: scorching (very hot), warm, cool, chilly (a little cold).\n• Humid means the air is warm and wet. A drought is a long time with no rain. A flood is when water covers dry land.\nNouns and adjectives: sun → sunny, cloud → cloudy, rain → rainy, wind → windy, fog → foggy, storm → stormy.","checks":[]},"worked_example":{"status":"draft","vars":{"a":"sun","b":"fog","c":"wind"},"problem":"Make the weather adjectives from {a}, {b} and {c}, and use one in a sentence.","steps":["Add -y. A short word ending in one vowel + one consonant doubles it: {a} → sunny, {b} → foggy.","Otherwise just add -y: {c} → windy.","Sentence: It was so foggy on the mountain that we could not see the road."],"answer":"sunny, foggy, windy","checks":[]},"teach":{"cards":[{"id":"c14-1","status":"draft","idea":"Rain can be light (a drizzle), short (a shower), very heavy (a downpour) or stormy (a thunderstorm).","vars":{},"example":["A drizzle hardly wets your clothes.","In a downpour, the gutters overflow."],"checks":[],"check":{"ref":"e2-14-rain"}},{"id":"c14-2","status":"draft","idea":"Add -y to a weather noun to make an adjective: rain → rainy. Double a final consonant after one short vowel: sun → sunny.","vars":{},"example":["cloud → cloudy, wind → windy","sun → sunny, fog → foggy"],"checks":[],"check":{"id":"e2-14-c2","type":"cloze","level":1,"review":"authored","sources":["vocabulary"],"vars":{"X":{"pick":[{"s":"It is very ___ today; take your hat.","a":"sunny","w":["suny","sunnie"],"e":["Double the n: sunny.","Add -y: sunny."]},{"s":"We could not see the road: it was ___.","a":"foggy","w":["fogy","fogged"],"e":["Double the g: foggy.","The adjective is foggy."]},{"s":"The sky is grey and ___.","a":"cloudy","w":["cloudly","clouddy"],"e":["Add -y: cloudy.","Do not double the d: cloudy."]},{"s":"It is ___; hold on to your umbrella.","a":"windy","w":["windly","winddy"],"e":["Add -y: windy.","Do not double the d: windy."]},{"s":"The night was ___, with thunder and lightning.","a":"stormy","w":["stormly","stormmy"],"e":["Add -y: stormy.","Do not double the m: stormy."]}]}},"prompt":"Choose the correct adjective.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]}},{"id":"c14-3","status":"draft","idea":"Humid means warm and wet air. A drought is a long time with no rain; a flood is water over dry land.","vars":{},"example":["Douala is hot and humid.","After the downpour there was a flood in the street."],"checks":[],"check":{"ref":"e2-14-words"}}]},"questions":[{"id":"e2-14-rain","type":"matching","level":1,"review":"authored","sources":["vocabulary"],"prompt":"Match each word to its meaning.","pool":[{"left":"drizzle","right":"very light rain"},{"left":"downpour","right":"very heavy rain"},{"left":"shower","right":"a short fall of rain"},{"left":"thunderstorm","right":"rain with thunder and lightning"},{"left":"breeze","right":"a gentle wind"},{"left":"gale","right":"a very strong wind"}],"pick":4},{"id":"e2-14-words","type":"matching","level":1,"review":"authored","sources":["vocabulary"],"prompt":"Match each word to its meaning.","pool":[{"left":"humid","right":"warm and wet air"},{"left":"drought","right":"a long time with no rain"},{"left":"flood","right":"water covering dry land"},{"left":"chilly","right":"a little cold"},{"left":"scorching","right":"very hot"},{"left":"overcast","right":"a sky that is completely grey"}],"pick":4},{"id":"e2-14-use","type":"cloze","level":2,"review":"authored","sources":["vocabulary"],"vars":{"X":{"pick":[{"s":"There was no rain for six months; the ___ killed the maize.","a":"drought","w":["flood","drizzle"],"e":["A flood is too much water.","A drizzle is light rain."]},{"s":"It's only a ___; you don't need an umbrella.","a":"drizzle","w":["downpour","gale"],"e":["A downpour is very heavy rain.","A gale is a strong wind."]},{"s":"A cool ___ came from the sea in the evening.","a":"breeze","w":["drought","gale"],"e":["A drought is a time with no rain.","A gale is very strong, not cool and gentle."]},{"s":"The river overflowed and caused a ___.","a":"flood","w":["drought","breeze"],"e":["A drought means no water.","A breeze is a wind."]},{"s":"Wear a sweater: the morning is ___.","a":"chilly","w":["scorching","humid"],"e":["Scorching is very hot.","Humid is warm and wet."]}]}},"prompt":"Choose the word that fits.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-14-spot","type":"spot_error","level":3,"review":"authored","sources":["vocabulary"],"prompt":"One sentence uses a weather word wrongly. Which one?","pool":{"right":[{"text":"The downpour flooded the road.","truth":"true"},{"text":"A gentle breeze cooled the room.","truth":"true"},{"text":"Douala is hot and humid.","truth":"true"},{"text":"The drought dried the wells.","truth":"true"},{"text":"It was foggy on the mountain.","truth":"true"}],"wrong":[{"text":"The drizzle was so heavy that the bridge broke.","truth":"false","explain":"A drizzle is very light rain; heavy rain is a downpour."},{"text":"We had a flood because it did not rain for months.","truth":"false","explain":"No rain for months is a drought."},{"text":"It is scorching, so wear a warm sweater.","truth":"false","explain":"Scorching means very hot."},{"text":"It is very suny today.","truth":"false","explain":"Double the n: sunny."}]},"pick":{"right":3,"wrong":1}}]},"15":{"subject":"english-language","class":"Form 2","lesson_no":15,"language":"en","prerequisites":[11],"skills":[{"id":"e2-15","name":"The Present Perfect tense"}],"note":{"status":"draft","text":"We use the Present Perfect for:\n• past actions whose result matters now: “It has rained, so the ground is wet.”\n• experiences, with ever and never: “Have you ever seen snow?” — “No, I have never seen snow.”\n• actions that started in the past and go on now, with since and for: “It has rained since Monday.” “I have lived here for two years.”\nForm: have / has + past participle. I have seen, she has seen. Participles: visit → visited, see → seen, eat → eaten, write → written, go → gone.\nNegative: haven't / hasn't: “He hasn't finished yet.” Questions: “Have you finished?” — “Yes, I have.”\nSince + a point in time (since Monday, since 2020); for + a length of time (for three days).\nDo not use it with a finished time: say “I saw him yesterday”, not “I have seen him yesterday”.","checks":[]},"worked_example":{"status":"draft","vars":{"n":"Bih","v":"lose","c":"her umbrella"},"problem":"Write in the Present P } will {v} {c} {t}. / {n} won't {v} {c} {t}. / Will {n} {v} {c} {t}?","checks":[]},"teach":{"cards":[{"id":"c19-1","status":"draft","idea":"The Simple Future is will + the base verb, the same for every person.","vars":{},"example":["I will call you tonight.","She will call you tonight. (not: will calls)"],"checks":[],"check":{"ref":"e2-19-will"}},{"id":"c19-2","status":"draft","idea":"Use going to for a plan already made, or for something we can see coming.","vars":{},"example":["I'm going to visit my aunt on Saturday. (a plan)","Look at those clouds! It's going to rain."],"checks":[],"check":{"ref":"e2-19-which"}},{"id":"c19-3","status":"draft","idea":"Shall I and Shall we make offers and suggestions.","vars":{},"example":["Shall I open the window?","Shall we go to the market together?"],"checks":[],"check":{"id":"e2-19-c3","type":"mcq","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"r":"Shall I carry your bag?","w":["Will it rain tomorrow?","I'm going to buy a phone.","She won't come."],"e":["That asks about the weather.","That is a plan.","That is a negative statement."],"y":"Shall I …? offers help."},{"r":"Shall I call a taxi for you?","w":["The taxi will be late.","Is the taxi coming?","I'm going to take a taxi."],"e":["That is a prediction.","That is a question about the taxi.","That is a plan."],"y":"Shall I …? offers help."},{"r":"Shall I lend you my charger?","w":["My charger is broken.","Will you buy a charger?","I won't lend it."],"e":["That is a statement.","That asks about the other person.","That is a refusal."],"y":"Shall I …? offers help."}]}},"prompt":"Which sentence is an offer to help?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"q _no":20,"language":"en","prerequisites":[18,19],"skills":[{"id":"e2-20","name":"Writing about online shopping"}],"note":{"status":"draft","text":"Online shopping means buying goods on the internet, with a phone or a computer, and getting them delivered or collecting them.\nSteps: choose a shop or app, look at the products and prices, put what you want in the cart (basket), order, pay (by mobile money or card, or cash on delivery), and wait for the delivery.\nAdvantages: you can shop at any time, compare prices and avoid travelling.\nDangers: some sellers are dishonest; the goods may be different from the photo; never share your PIN or password.\nWriting good sentences: one idea per sentence, a capital letter and a full stop, linking words (first, then, but, because, so).","checks":[]},"worked_example":{"status":"draft","vars":{"s":"a school bag"},"problem":"Write three sentences about ordering {s} online.","steps":["Say what you do first: First, I chose {s} on a shopping app and compared the prices.","Then: Then I ordered it and paid by mobile money.","Add an advantage or a warning with because or but: It was easy because I did not travel, but I checked that the seller was honest."],"answer":"First, I chose {s} on a shopping app. Then I ordered it and paid by mobile money. It was easy because I did not travel.","checks":[]},"teach":{"cards":[{"id":"c20-1","status":"draft","idea":"Online shopping: choose, put in the cart, order, pay, then receive the delivery.","vars":{},"example":["I put a pair of shoes in the cart.","The delivery came two days later."],"checks":[],"check":{"ref":"e2-20-steps"}},{"id":"c20-2","status":"draft","idea":"Shopping online has advantages and dangers. Never share your PIN or password.","vars":{},"example":["Advantage: you can compare prices at home.","Danger: some sellers are dishonest."],"checks":[],"check":{"id":"e2-20-c2","type":"mcq","level":1,"review":"authored","sources":["writing-skills"],"vars":{"X":{"pick":[{"q":"Which is an advantage of online shopping?","r":"You can compare prices without travelling.","w":["Some sellers are dishonest.","The goods may not look like the photo.","Thieves may ask for your PIN."],"e":["That is a danger.","That is a danger.","That is a danger."],"y":"Comparing prices at home is an advantage."},{"q":"Which is a danger of online shopping?","r":"The goods may be different from the photo.","w":["You can shop at night.","You do not need to travel.","You can compare prices."],"e":["That is an advantage.","That is an advantage.","That is an advantage."],"y":"Goods that do not match the photo are a danger."},{"q":"A message asks for your mobile money PIN to send you a prize. What should you do?","r":"Never share it.","w":["Send it quickly.","Send half of it.","Send it to a friend first."],"e":["Thieves use PINs to steal money.","Never share any part of it.","Never share it with anyone."],"y":"Your PIN is secret: never share it."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}},{"id":"c20-3","status":"draft","idea":"Join ideas with linking words: first, then, but, because, so.","vars":{},"example":["I ordered a book online because it was cheaper.","It came late, so I complained."],"checks":[],"check":{"ref":"e2-20-link"}}]},"questions":[{"id":"e2-20-steps","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the steps of online shopping in order.","items":[{"text":"Choose a shop or an app"},{"text":"Look at the products and prices"},{"text":"Put what you want in the cart"},{"text":"Order and pay"},{"text":"Receive the delivery"}],"order":"as_written"},{"id":"e2-20-link","type":"cloze","level":1,"review":"authored","sources":["writing-skills"],"vars":{"X":{"pick":[{"s":"I bought the bag online ___ it was cheaper than in the market.","a":"because","w":["but","so"],"e":["The second part gives a reason: because.","The second part gives a reason, not a result."]},{"s":"The shoes were too small, ___ I sent them back.","a":"so","w":["because","but"],"e":["Sending them back is a result: so.","Sending them back is a result, not a contrast."]},{"s":"Online shopping is easy, ___ some sellers are dishonest.","a":"but","w":["so","because"],"e":["The second part is a contrast: but.","The second part is a contrast: but."]},{"s":"___, I chose the phone. Then I paid for it.","a":"First","w":["Finally","But"],"e":["The first step: First.","But joins contrasting ideas."]}]}},"prompt":"Choose the linking word that fits.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]}],"paper_task":{"status":"draft","vars":{},"prompt":"Write six sentences in your exercise book about online shopping: what you would buy, the steps you would follow, one advantage and one danger. Use at least three linking words (first, then, because, but, so).","model":["I would like to buy a dictionary online.","First, I would choose a trusted shopping app and compare the prices.","Then I would put the dictionary in the cart and order it.","I would pay by mobile money, but I would never share my PIN.","Online shopping is useful because I do not have to travel to the city.","However, the book may be late, so I would keep the seller's phone number."],"checklist":["I wrote six sentences.","I said what I would buy.","I gave the steps in order.","I gave one advantage and one danger.","I used at least three linking words.","Each sentence has one main idea.","Each sentence starts with a capital letter and ends with a full stop."]}},"21":{"subject":"english-language","class":"Form 2","lesson_no":21,"language":"en","prerequisites":[],"skills":[{"id":"e2-21","name":"Humanitarian and community services; reading an interview"}],"note":{"status":"draft","text":"Humanitarian work helps people who suffer, for example after a flood, a fire or a war, or people who are poor or sick. Community service is work we do for free for the people around us: cleaning the market, visiting the sick, planting trees.\nPicture talk: describe what people are doing (“A nurse is giving an injection”), then say why it helps.\nIn the interview, Dr Nkeng works in a village health centre every Saturday. With volunteers, nurses, students and the Red Cross, he gives free check-ups and vaccinations. Mama Ndum could not pay, but he treated her leg, and she was grateful.\nUseful phrases: “I would like to help.” “Can I volunteer?” “Thank you for your help.”","checks":[]},"worked_example":{"status":"draft","vars":{"n":"Tanyi"},"problem":"{n}'s class wants to help old people in their quarter. Write two sentences about what they can do and why.","steps":["Say the action: We can fetch water and clean the compound for old people who live alone.","Say why it helps: This is community service: it makes their life easier and shows we care."],"answer":"We can fetch water and clean the compound for old people; it makes their life easier and shows we care.","checks":[]},"teach":{"cards":[{"id":"c21-1","status":"draft","idea":"Read the interview at a village health centre.","vars":{},"example":["Reporter: Doctor, why do you work in the village health centre every Saturday?","Dr Nkeng: Many people here cannot travel to town. Volunteers and I give free check-ups and vaccinations.","Reporter: Who helps you?","Dr Nkeng: Nurses, students and the Red Cross. Some families donate food for the patients.","Reporter: Mama Ndum, what did the doctor do for you?","Mama Ndum: He treated my leg after my fall. I could not pay, but he helped me anyway. I am very grateful."],"checks":[],"check":{"id":"e2-21-c1","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"When does Dr Nkeng work in the village?","r":"every Saturday","w":["every day","once a year","only at night"],"e":["He said every Saturday.","He said every Saturday.","He said every Saturday."],"y":"He works there every Saturday."},{"q":"Why does he work there?","r":"Many people cannot travel to town.","w":["He lives in the village.","He is paid a lot.","The town has no hospital."],"e":["He did not say that.","The check-ups are free.","He did not say that."],"y":"He said many people cannot travel to town."},{"q":"Who donates food?","r":"some families","w":["the Red Cross","the reporter","Dr Nkeng"],"e":["The Red Cross helps with the work.","The reporter asks questions.","He gives check-ups."],"y":"He said some families donate food for the patients."},{"q":"How does Mama Ndum feel?","r":"grateful","w":["angry","afraid","bored"],"e":["She thanks the doctor.","She is thankful.","She is thankful."],"y":"She said: I am very grateful."}]}},"prompt":"From the interview: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}},{"id":"c21-2","status":"draft","idea":"Humanitarian work helps people who suffer; community service is free work for the people around us.","vars":{},"example":["After the flood, the Red Cross gave food and blankets.","Our class cleaned the market on Saturday."],"checks":[],"check":{"ref":"e2-21-which"}},{"id":"c21-3","status":"draft","idea":"In a picture talk, say what people are doing, then why it helps.","vars":{},"example":["“Volunteers are giving out food.”","“This helps families who lost their homes.”"],"checks":[],"check":{"ref":"e2-21-picture"}}]},"questions":[{"id":"e2-21-which","type":"mcq","l fect.","text":"When {X.a}, they ___ {X.c}. ({X.v})","answer":"'had ' + participle(X.v)","misconceptions":[{"id":"past","wrong":"past(X.v)","explain":"This action came first: had + the past participle, had {participle(X.v)}."},{"id":"had-past","wrong":"'had ' + past(X.v)","explain":"After had, use the past participle: {participle(X.v)}.","when":"past(X.v) != participle(X.v)"},{"id":"have","wrong":"'have ' + participle(X.v)","explain":"It is in the past: had, not have."}]},{"id":"e2-24-first","type":"mcq","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"q":"When I got to the stop, the bus had left.","r":"The bus left.","w":["I got to the stop.","Both at the same time.","Nothing happened."],"e":["had left is the earlier action.","had left shows the bus left earlier.","Both actions happened."],"y":"The Past Perfect (had left) is the earlier action."},{"q":"The volunteers had cleaned the hall before the guests arrived.","r":"The volunteers cleaned the hall.","w":["The guests arrived.","Both at the same time.","The guests cleaned the hall."],"e":["had cleaned is the earlier action.","before shows an order.","The volunteers cleaned it."],"y":"had cleaned came first."},{"q":"By the time the doctor came, the nurse had given first aid.","r":"The nurse gave first aid.","w":["The doctor came.","Both at the same time.","The doctor gave first aid."],"e":["had given is the earlier action.","By the time shows an order.","The nurse gave it."],"y":"had given came first."},{"q":"We had eaten when Dad came home.","r":"We ate.","w":["Dad came home.","Both at the same time.","Dad ate."],"e":["had eaten is the earlier action.","had eaten shows we ate first.","We ate."],"y":"had eaten came first."}]}},"prompt":"“{X.q}” Which action happened first?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id ing together without violence and with respect.\nIts advantages: people feel safe, children go to school, trade grows, and the community works together.\nIn the talk, Christians and Muslims, Anglophones and Francophones share the same market, school and water point. When two families quarrelled about a fence, the quarter head helped them talk; they apologised and shared the cost.\nUseful phrases:\n• Disagreeing politely: “I see your point, but …” “I'm afraid I don't agree.”\n• Apologising: “I'm sorry. It was my fault.” Accepting: “That's all right.”\n• Solving a problem: “Let's talk about it calmly.” “Why don't we share it?”","checks":[]},"worked_example":{"status":"draft","vars":{"n":"Ayuk","m":"Bih"},"problem":"{n} and {m} both want the same seat in class. Write what they can say to solve the problem peacefully.","steps":["{n} disagrees politely: “I see your point, but I sat here first.”","{m} suggests a solution: “Why don't we take turns? You today, me tomorrow.”","They agree and apologise: “That's fair. Sorry I shouted.” — “That's all right.”"],"answer":"They speak calmly, disagree politely, suggest taking turns and apologise.","checks":[]},"teach":{"cards":[{"id":"c25-1","status":"draft","idea":"Read this short talk. (In class you would listen to it.)","vars":{},"example":["In our quarter live Christians and Muslims, Anglophones and Francophones, and people from many tribes. We speak different languages at home, but we share the same market, school and water point.","Living together in peace means respecting other people's beliefs and customs, even when they are different from ours. When we disagree, we talk calmly and listen to each other.","Last year two families quarrelled about a fence. The quarter head invited them to talk. Each family explained, they apologised to each other, and they agreed to share the cost of a new fence."],"checks":[],"check":{"id":"e2-25-c1","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{ uestions":[{"id":"e2-25-say","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"disagree","r":"I see your point, but I don't agree.","w":["You are stupid.","Shut up!","That is rubbish."],"e":["That insults the person.","That is rude.","That is rude."],"y":"Say you understand, then give your view."},{"q":"apologise","r":"I'm sorry. It was my fault.","w":["It's your problem.","I don't care.","You started it."],"e":["That blames the other person.","That is not an apology.","That blames the other person."],"y":"Say sorry and accept that you were wrong."},{"q":"suggest a solution","r":"Why don't we share it?","w":["Give it to me now!","I'll take it, end of story.","Go away."],"e":["That is an order.","That does not solve the problem fairly.","That is rude."],"y":"Why don't we …? suggests a fair solution."},{"q":"ask someone to calm down","r":"Let's talk about it calmly.","w":["Stop shouting, idiot!","Fight me!","Leave my quarter!"],"e":["That insults the person.","That makes things worse.","That is unkind."],"y":"Invite the person to talk calmly."}]}},"prompt":"Which is the most polite way to {X.q}?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-25-reply","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"I'm sorry I broke your pen.","r":"That's all right. Accidents happen.","w":["You must pay me now!","I will break yours.","Go away."],"e":["That refuses the apology.","That causes a new problem.","That is unkind."],"y":"Accept the apology kindly."},{"q":"I don't agree with you.","r":"That's fine. Tell me what you think.","w":["You are wrong, keep quiet.","Then we are enemies.","Nobody asked you."],"e":["That stops the conversation.","Disagreeing does not make enemies.","That is rude."],"y":"Listen to the other view."},{"q":"Why don't we take turns?","r":"Good idea. You go first.","w":["No, it's mine.","I'll tell the teacher.","Turns are for babies."],"e":["That refuses a fair solution.","That is not needed for a fair idea.","That is unkind."],"y":"Accept a fair solution."}]}},"prompt":"Someone says: “{X.q}” What is the kindest reply?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-25-ideas","type":"mcq","level":2,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"Which is an advantage of living together in peace?","r":"Trade grows because people feel safe.","w":["Everyone speaks the same language.","There are no festivals.","Schools close."],"e":["People can keep different languages.","Peace does not stop festivals.","Schools stay open in peace."],"y":"When people feel safe, trade grows."},{"q":"What does it mean to respect someone's customs?","r":"To accept them even if they are different from ours.","w":["To copy them all.","To laugh at them.","To stop them."],"e":["Respect does not mean copying.","Laughing at them is disrespectful.","Stopping them is not respect."],"y":"Respect means accepting, not mocking or stopping."},{"q":"Two neighbours quarrel about a goat. What is the best first step?","r":"Talk calmly and listen to each other.","w":["Fight","Kill the goat","Insult each other"],"e":["Fighting makes it worse.","That makes it worse.","Insults make it worse."],"y":"Talking calmly is the first step to peace."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"
