":"Give and take are opposites."}]},"pick":{"right":3,"wrong":1}}]},"27":{"subject":"english-language","class":"Form 2","lesson_no":27,"language":"en","prerequisites":[11,15],"skills":[{"id":"e2-27","name":"Regular and irregular verbs"}],"note":{"status":"draft","text":"Every verb has three main forms: the base (go), the simple past (went) and the past participle (gone), used after have, has and had.\nRegular verbs add -ed for both: visit, visited, visited. Spelling: stop → stopped, carry → carried, arrive → arrived, travel → travelled.\nIrregular verbs change in their own way, and must be learnt:\n• all three the same: put, put, put; cut, cut, cut;\n• past = participle: buy, bought, bought; bring, brought, brought; leave, left, left;\n• all three different: go, went, gone; see, saw, seen; write, wrote, written; begin, began, begun; speak, spoke, spoken.\nUse the simple past alone (I saw), and the participle after have, has or had (I have seen, she had gone).","checks":[]},"worked_example":{"status":"draft","vars":{"v":"write","w":"visit"},"problem":"Give the three forms of {v} and {w}, and use the participle of {v} in a sentence.","steps":["{w} is regular: {w}, {past(w)}, {participle(w)}.","{v} is irregular: {v}, {past(v)}, {participle(v)}.","After has: “Bih has {participle(v)} a letter to her uncle.”"],"answer":"{w}, {past(w)}, {participle(w)}; {v}, {past(v)}, {participle(v)}","checks":["participle(v) == 'written'"]},"teach":{"cards":[{"id":"c27-1","status":"draft","idea":"Regular verbs add -ed for the simple past and the past participle.","vars":{"v":"visit","w":"carry"},"example":["{v}, {past(v)}, {participle(v)}","{w}, {past(w)}, {participle(w)}"],"checks":[],"check":{"ref":"e2-27-regular"}},{"id":"c27-2","status":"draft","idea":"Irregular verbs have their own forms. Learn them in groups.","vars":{},"example":["buy, {past('buy')}, {participle('buy')} (past = participle)","go, {past('go')}, {participle('go')} (all different)"],"checks":[],"check":{"ref":"e2-27-past"}},{"id":"c27-3","status":"draft","idea":"Use the participle after have, has or had; use the simple past alone.","vars":{},"example":["I {past('see')} the film yesterday.","I have {participle('see')} the film."],"checks":[],"check":{"ref":"e2-27-part"}},{"id":"c27-4","status":"draft","idea":"Some verbs are regular and some irregular; check a verb list when you are not sure.","vars":{},"example":["regular: play, {past('play')}","irregular: speak, {past('speak')}, {participle('speak')}"],"checks":[],"check":{"id":"e2-27-c4","type":"cloze","level":1,"review":"rule","sources":["grammar-tenses"],"vars":{"v":{"pick":["visit","stop","carry","arrive","travel","plan","study","play","clean","hurry","go","see","take","write","eat","buy","bring","begin","speak","break","give","know","leave","sing","drink"]}},"prompt":"Is the verb regular or irregular?","text":"{v} is ___.","answer":"isIrregular(v) ? 'irregular' : 'regular'","choices":[{"text":"regular","misconception":"reg"},{"text":"irregular","misconception":"irr"}],"misconceptions":[{"id":"reg","explain":"{v} does not add -ed: its past is {past(v)}."},{"id":"irr","explain":"{v} just adds -ed: {past(v)}."}],"show":2}}]},"questions":[{"id":"e2-27-regular","type":"cloze","level":1,"review":"rule","sources":["grammar-tenses"],"vars":{"v":{"pick":["visit","stop","carry","arrive","travel","plan","study","play","clean","hurry"]}},"prompt":"Write the simple past.","text":"{v} → ___","answer":"past(v)","misconceptions":[{"id":"plain","wrong":"v + 'ed'","explain":"Check the spelling: {past(v)}."}]},{"id":"e2-27-past","type":"cloze","level":1,"review":"rule","sources":["grammar-tenses"],"vars":{"v":{"pick":["go","see","take","write","eat","buy","bring","begin","speak","break","give","know","leave","sing","drink"]}},"prompt":"Write the simple past.","text":"{v} → ___","answer":"past(v)","misconceptions":[{"id":"ed","wrong":"v + 'ed'","explain":"{v} is irregular: {past(v)}."},{"id":"participle","wrong":"participle(v)","explain":"That is the participle; the simple past is {past(v)}.","when":"past(v) != participle(v)"}]},{"id":"e2-27-part","type":"cloze","level":1,"review":"rule","sources":["grammar-tenses"],"vars":{"v":{"pick":["go","see","take","write","eat","buy","bring","begin","speak","break","give","know","leave","sing","drink"]}},"prompt":"Write the past participle.","text":"I have ___ ({v})","answer":"participle(v)","misconceptions":[{"id":"past","wrong":"past(v)","explain":"After have, use the participle: {participle(v)}.","when":"past(v) != participle(v)"},{"id":"ed","wrong":"v + 'ed'","explain":"{v} is irregular: {participle(v)}."}]},{"id":"e2-27-forms","type":"matching","level":2,"review":"rule","sources":["grammar-tenses"],"prompt":"Match each verb to its past participle.","pool":[{"left":"go","right":"gone"},{"left":"see","right":"seen"},{"left":"write","right":"written"},{"left":"begin","right":"begun"},{"left":"eat","right":"eaten"},{"left":"speak","right":"spoken"},{"left":"break","right":"broken"},{"left":"drink","right":"drunk"},{"left":"give","right":"given"}],"pick":5},{"id":"e2-27-spot","type":"spot_error","level":3,"review":"authored","sources":["grammar-tenses"],"prompt":"One sentence has a wrong verb form. Which one?","pool":{"right":[{"text":"Mum saw a snake in the farm.","truth":"true"},{"text":"She has written to her uncle.","truth":"true"},{"text":"We sold all the oranges.","truth":"true"},{"text":"The visitors had eaten.","truth":"true"},{"text":"He brought his book.","truth":"true"}],"wrong":[{"text":"I have saw the match.","truth":"false","explain":"After have, use the participle: I have seen."},{"text":"She writed a letter.","truth":"false","explain":"Write is irregular: she wrote."},{"text":"We buyed some bread.","truth":"false","explain":"Buy is irregular: we bought."},{"text":"They had went home.","truth":"false","explain":"After had, use the participle: had gone."}]},"pick":{"right":3,"wrong":1}}]},"28":{"subject":"english-language","class":"Form 2","lesson_no":28,"language":"en","prerequisites":[25],"skills":[{"id":"e2-28","name":"Writing about cultural diversity and tolerance"}],"note":{"status":"draft","text":"Cultural diversity means many different cultures living side by side: languages, religions, foods, dances, dress and festivals. Cameroon has more than two hundred ethnic groups, two official languages (English and French) and many religions.\nTolerance means accepting people whose ideas, beliefs or customs are different from ours, and treating them with respect.\nWriting a short composition:\n• Introduction: say what cultural diversity is.\n• Body: give examples, then explain why tolerance matters (peace, friendship, learning from each other).\n• Conclusion: say what we can do (learn a greeting in another language, share food, invite friends to our festivals).\nUse linking words: for example, also, however, because, so, in conclusion.","checks":[]},"worked_example":{"status":"draft","vars":{"t":"my school"},"problem":"Plan three short paragraphs on cultural diversity in {t}.","steps":["Introduction: In {t} there are pupils from many tribes, who speak different languages and follow different religions.","Body: For example, we eat achu, ndolé and koki at the school fair. Tolerance matters because it keeps us friends.","Conclusion: In conclusion, we should learn from each other, for example by learning greetings in other languages."],"answer":"Introduction (what diversity is) → body (examples and why tolerance matters) → conclusion (what we can do).","checks":[]},"teach":{"cards":[{"id":"c28-1","status":"draft","idea":"Cultural diversity means many cultures together; tolerance means accepting and respecting differences.","vars":{},"example":["Diversity: many languages, foods and festivals.","Tolerance: I respect my friend's religion even if it is not mine."],"checks":[],"check":{"id":"e2-28-c1","type":"mcq","level":1,"review":"authored","sources":["writing-skills"],"vars":{"X":{"pick":[{"q":"Which sentence shows tolerance?","r":"I respect my friend's religion, even though it is not mine.","w":["My language is the only good one.","I laugh at people who dress differently.","I don't eat with people from other tribes."],"e":["That rejects other languages.","Laughing at differences is not tolerance.","That excludes people."],"y":"Respecting a different religion is tolerance."},{"q":"Which sentence describes cultural diversity?","r":"Our class has pupils who speak eight different languages.","w":["Everybody in our town is the same.","We all eat the same food every day.","Nobody has a festival."],"e":["Diversity means differences.","Diversity means variety.","Festivals are part of culture."],"y":"Many languages in one class is cultural diversity."},{"q":"Which is a good way to show tolerance?","r":"Learn a greeting in a classmate's language.","w":["Make fun of their accent.","Refuse to sit with them.","Tell them to change religion."],"e":["That is mocking.","That excludes them.","That does not respect their beliefs."],"y":"Learning their greeting shows respect."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}},{"id":"c28-2","status":"draft","idea":"A composition has an introduction, a body and a conclusion.","vars":{},"example":["Introduction: what the topic is.","Body: examples and reasons. Conclusion: what we should do."],"checks":[],"check":{"ref":"e2-28-parts"}},{"id":"c28-3","status":"draft","idea":"Linking words join ideas: for example, also, however, because, so, in conclusion.","vars":{},"example":["We eat different foods, for example achu and ndolé.","In conclusion, tolerance keeps the peace."],"checks":[],"check":{"ref":"e2-28-link"}}]},"questions":[{"id":"e2-28-parts","type":"ordering","level":1,"review":"authored","sources":["writing-skills"],"prompt":"Put the parts of the composition in order.","items":[{"text":"Cameroon has many cultures, languages and religions"},{"text":"For example, in my class we speak Bakweri, Bamileke, Fulfulde and Pidgin"},{"text":"Tolerance is important because it helps us live in peace"},{"text":"In conclusion, we should respect and learn from each other"}],"order":"as_written"},{"id":"e2-28-link","type":"cloze","level":1,"review":"authored","sources":["writing-skills"],"vars":{"X":{"pick":[{"s":"We have many festivals, ___ the Ngondo and the Nguon.","a":"for example","w":["however","so"],"e":["The festivals that follow are examples.","Examples follow, not a result."]},{"s":"Our languages are different; ___, we understand each other in English.","a":"however","w":["for example","because"],"e":["The idea is a contrast: however.","The idea is a contrast, not a reason."]},{"s":"We respect each other ___ we want to live in peace.","a":"because","w":["however","for example"],"e":["A reason follows: because.","A reason follows, not an example."]},{"s":"___, diversity makes our country rich.","a":"In conclusion","w":["For example","Because"],"e":["This sums up: in conclusion.","Because needs a reason after it."]}]}},"prompt":"Choose the linking word that fits.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]}],"paper_task":{"status":"draft","vars":{},"prompt":"Write a short composition of three paragraphs (about one hundred and twenty words) on the topic “Cultural diversity and tolerance in my community”. Use an introduction, a body with examples, and a conclusion, and at least three linking words.","model":["My community is like a small Cameroon. People from many tribes live here: Bakweri, Bamileke, Bassa, Fulani and others. We speak different languages and follow different religions.","For example, at the end of the year our school holds a cultural day. Pupils wear their traditional dress, sing and share food such as achu, ndolé and kilishi. Tolerance is important because it helps us to live in peace. However, some people still laugh at other people's accents, and this hurts.","In conclusion, diversity makes us rich. We should respect each other's beliefs, learn new greetings and invite our friends to our festivals."],"checklist":["My composition has three paragraphs: introduction, body, conclusion.","I explained what cultural diversity is.","I gave at least two examples from my community.","I explained why tolerance matters.","I used at least three linking words.","I did not insult or make fun of any group.","I checked my spelling and punctuation."]}},"29":{"subject":"english-language","class":"Form 2","lesson_no":29,"language":"en","prerequisites":[],"skills":[{"id":"e2-29","name":"Special days, national days and public holidays"}],"note":{"status":"draft","text":"Public holidays in Cameroon include New Year's Day (1 January), Youth Day (11 February), Labour Day (1 May), National Day (20 May), Assumption Day (15 August) and Christmas Day (25 December), and religious holidays whose dates change: Good Friday, Ascension Day, Eid al-Fitr (the end of Ramadan) and Eid al-Adha (the Feast of the Ram).\nOn National Day we celebrate the unity of Cameroon; on Youth Day young people march; on Labour Day workers march.\nSpecial family days: birthdays, weddings, naming ceremonies.\nTalking about holidays: “What do you do on National Day?” — “I march with my school.” “Happy New Year!” “Merry Christmas!” “Happy birthday!”\nNames of holidays begin with capital letters.","checks":[]},"worked_example":{"status":"draft","vars":{"d":"Youth Day","m":"February"},"problem":"Write three sentences about {d}: when it is, what people do, and what you say.","steps":["When: {d} is in {m}.","What people do: Pupils and students march past the grandstand, and there are speeches and games.","What you say: “Happy {d}!”"],"answer":"{d} is in {m}. Pupils march past the grandstand. People say “Happy {d}!”","checks":[]},"teach":{"cards":[{"id":"c29-1","status":"draft","idea":"Read the dialogue about National Day.","vars":{},"example":["Tabe: Why is there no school on Thursday?","Manka: It's the twentieth of May, National Day. We celebrate the unity of Cameroon.","Tabe: Are you going to march?","Manka: Yes, our school will march past the grandstand. Then my family will have a big lunch.","Tabe: I marched on Youth Day in February. Which holiday do you like best?","Manka: Christmas! But I also enjoy the Feast of the Ram with my Muslim neighbours."],"checks":[],"check":{"id":"e2-29-c1","type":"mcq","level":1,"review":"authored","sources":["reading-texts"],"vars":{"X":{"pick":[{"q":"Why is there no school on Thursday?","r":"It is National Day.","w":["It is Christmas.","It is Youth Day.","The teachers are ill."],"e":["Christmas is in December.","Youth Day was in February.","The dialogue says it is National Day."],"y":"Manka says it is the twentieth of May, National Day."},{"q":"What do people celebrate on National Day?","r":"the unity of Cameroon","w":["the New Year","the end of Ramadan","the workers"],"e":["That is New Year's Day.","That is Eid al-Fitr.","That is Labour Day."],"y":"Manka says we celebrate the unity of Cameroon."},{"q":"When did Tabe march?","r":"on Youth Day","w":["on National Day","at Christmas","on Labour Day"],"e":["Manka will march on National Day.","The dialogue does not say that.","The dialogue does not say that."],"y":"Tabe says he marched on Youth Day in February."},{"q":"Which holiday does Manka like best?","r":"Christmas","w":["Youth Day","National Day","Labour Day"],"e":["Tabe marched on Youth Day.","She talks about it, but likes Christmas best.","She does not mention it."],"y":"Manka says: Christmas!"}]}},"prompt":"From the dialogue: {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}},{"id":"c29-2","status":"draft","idea":"Each national day has its own date and meaning.","vars":{},"example":["National Day, the {20} of May: the unity of Cameroon.","Youth Day, the {11} of February: young people march."],"checks":[],"check":{"ref":"e2-29-days"}},{"id":"c29-3","status":"draft","idea":"Use the right greeting for each special day. Names of holidays start with capital letters.","vars":{},"example":["“Merry Christmas!” “Happy New Year!”","“Happy birthday!” “Happy Youth Day!”"],"checks":[],"check":{"ref":"e2-29-greet"}}]},"questions":[{"id":"e2-29-days","type":"matching","level":1,"review":"authored","sources":["cameroon-holidays"],"prompt":"Match each holiday to its date.","pool":[{"left":"New Year's Day","right":"1 January"},{"left":"Youth Day","right":"11 February"},{"left":"Labour Day","right":"1 May"},{"left":"National Day","right":"20 May"},{"left":"Assumption Day","right":"15 August"},{"left":"Christmas Day","right":"25 December"}],"pick":4},{"id":"e2-29-greet","type":"mcq","level":1,"review":"authored","sources":["cameroon-holidays"],"vars":{"X":{"pick":[{"q":"on 25 December","r":"Merry Christmas!","w":["Happy birthday!","Good luck!","Get well soon!"],"e":["That is for someone's birthday.","That is for an exam.","That is for someone who is ill."],"y":"On Christmas Day we say Merry Christmas!"},{"q":"on 1 January","r":"Happy New Year!","w":["Merry Christmas!","Congratulations on your wedding!","Good night!"],"e":["That is for 25 December.","That is for a wedding.","That is at bedtime."],"y":"On 1 January we say Happy New Year!"},{"q":"to a friend on her birthday","r":"Happy birthday!","w":["Happy New Year!","Merry Christmas!","Rest in peace."],"e":["That is for 1 January.","That is for 25 December.","That is for someone who has died."],"y":"On a birthday we say Happy birthday!"},{"q":"to Muslim neighbours on Eid al-Fitr","r":"Eid Mubarak! Happy feast!","w":["Merry Christmas!","Happy birthday!","Good luck in your exam!"],"e":["Christmas is a Christian feast.","It is not a birthday.","That is for an exam."],"y":"On Eid we wish a happy feast: Eid Mubarak!"}]}},"prompt":"What do you say {X.q}?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-29-meaning","type":"mcq","level":2,"review":"authored","sources":["cameroon-holidays"],"vars":{"X":{"pick":[{"q":"On which day do workers march?","r":"Labour Day","w":["Youth Day","National Day","Christmas Day"],"e":["On Youth Day young people march.","National Day celebrates unity.","Christmas is a religious feast."],"y":"Labour Day is the workers' day."},{"q":"Which holiday celebrates the unity of Cameroon?","r":"National Day","w":["Labour Day","Assumption Day","New Year's Day"],"e":["Labour Day is for workers.","Assumption Day is a Christian feast.","New Year's Day starts the year."],"y":"National Day, 20 May, celebrates unity."},{"q":"Which holiday marks the end of Ramadan?","r":"Eid al-Fitr","w":["Eid al-Adha","Good Friday","Youth Day"],"e":["Eid al-Adha is the Feast of the Ram.","Good Friday is a Christian holiday.","Youth Day is a national holiday."],"y":"Eid al-Fitr ends the fasting month of Ramadan."},{"q":"Why do the dates of Good Friday and Eid change every year?","r":"They follow religious calendars.","w":["The government forgets them.","They are not real holidays.","Schools choose them."],"e":["That is not the reason.","They are public holidays.","Schools do not choose them."],"y":"Religious holidays follow the Christian and Islamic calendars."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-29-spot","type":"spot_error","level":3,"review":"authored","sources":["cameroon-holidays"],"prompt":"One sentence has a mistake. Which one?","pool":{"right":[{"text":"National Day is on 20 May.","truth":"true"},{"text":"We say Merry Christmas on 25 December.","truth":"true"},{"text":"Assumption Day is on 15 August.","truth":"true"},{"text":"Workers march on Labour Day.","truth":"true"},{"text":"Eid al-Fitr ends Ramadan.","truth":"true"}],"wrong":[{"text":"We celebrated national day with a march.","truth":"false","explain":"Names of holidays start with capital letters: National Day."},{"text":"Youth Day is on 25 December.","truth":"false","explain":"Youth Day is on 11 February; 25 December is Christmas."},{"text":"Labour Day is the feast of the Ram.","truth":"false","explain":"Labour Day is for workers; the Feast of the Ram is Eid al-Adha."}]},"pick":{"right":3,"wrong":1}}]},"30":{"subject":"english-language","class":"Form 2","lesson_no":30,"language":"en","prerequisites":[],"skills":[{"id":"e2-30","name":"Word formation: prefixes and suffixes"}],"note":{"status":"draft","text":"We can make new words by adding a part at the beginning (a prefix) or at the end (a suffix).\nPrefixes change the meaning: un- (unhappy), dis- (disagree), im- (impossible, before m and p), in- (incorrect), re- (rewrite: write again), mis- (misunderstand: understand wrongly).\nSuffixes change the kind of word:\n• verb → noun: celebrate → celebration, govern → government, decorate → decoration, enjoy → enjoyment, sing → singer;\n• adjective → noun: happy → happiness, kind → kindness, free → freedom;\n• noun → adjective: care → careful (with care) or careless (without care), peace → peaceful, joy → joyful, nation → national;\n• adjective → adverb: quick → quickly, happy → happily.\nSpelling: y after a consonant becomes i (happy → happiness), and a final e often drops before -ion (celebrate → celebration).","checks":[]},"worked_example":{"status":"draft","vars":{"a":"celebrate","b":"peace","c":"kind"},"problem":"Make a noun from {a}, an adjective from {b} and a noun from {c}, and use them in one sentence.","steps":["{a} + -ion, dropping the e: celebration.","{b} + -ful: peaceful. {c} + -ness: kindness.","“The National Day celebration was peaceful, and everyone showed kindness.”"],"answer":"celebration, peaceful, kindness","checks":[]},"teach":{"cards":[{"id":"c30-1","status":"draft","idea":"A prefix goes at the beginning and changes the meaning: un-, dis-, im-, re-, mis-.","vars":{},"example":["happy → unhappy; agree → disagree","possible → impossible; write → rewrite"],"checks":[],"check":{"ref":"e2-30-prefix"}},{"id":"c30-2","status":"draft","idea":"Suffixes -ion, -ment and -ness make nouns.","vars":{},"example":["celebrate → celebration; govern → government","kind → kindness; happy → happiness"],"checks":[],"check":{"ref":"e2-30-noun"}},{"id":"c30-3","status":"draft","idea":"Suffixes -ful, -less and -al make adjectives; -ly makes adverbs.","vars":{},"example":["care → careful, careless; nation → national","quick → quickly"],"checks":[],"check":{"ref":"e2-30-adj"}}]},"questions":[{"id":"e2-30-prefix","type":"mcq","level":1,"review":"authored","sources":["word-formation"],"vars":{"X":{"pick":[{"q":"not happy","r":"unhappy","w":["dishappy","imhappy","rehappy"],"e":["Happy takes un-.","Im- goes before m and p.","Re- means again."],"y":"un- + happy = unhappy."},{"q":"not agree","r":"disagree","w":["unagree","imagree","misagree"],"e":["Agree takes dis-.","Im- goes before m and p.","Mis- means wrongly."],"y":"dis- + agree = disagree."},{"q":"not possible","r":"impossible","w":["unpossible","dispossible","inpossible"],"e":["Before p we use im-.","Possible takes im-.","Before p, in- becomes im-."],"y":"im- + possible = impossible."},{"q":"write again","r":"rewrite","w":["miswrite","unwrite","diswrite"],"e":["Mis- means wrongly.","Un- means not.","Dis- means not."],"y":"re- means again: rewrite."},{"q":"understand wrongly","r":"misunderstand","w":["disunderstand","reunderstand","ununderstand"],"e":["Dis- means not.","Re- means again.","That is not a word."],"y":"mis- means wrongly: misunderstand."},{"q":"not correct","r":"incorrect","w":["uncorrect","discorrect","imcorrect"],"e":["Correct takes in-.","Correct takes in-.","Im- goes before m and p."],"y":"in- + correct = incorrect."}]}},"prompt":"Which word means “{X.q}”?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-30-noun","type":"cloze","level":1,"review":"authored","sources":["word-formation"],"vars":{"X":{"pick":[{"s":"The Youth Day ___ was colourful. (celebrate)","a":"celebration","w":["celebrate","celebrated"],"e":["After the, we need a noun: celebration.","That is a verb form."]},{"s":"The ___ built a new road. (govern)","a":"government","w":["governing","governed"],"e":["We need a noun: government.","That is a verb form."]},{"s":"Her ___ made everyone smile. (kind)","a":"kindness","w":["kindly","kinder"],"e":["Kindly is an adverb.","Kinder compares; we need a noun."]},{"s":"We fought for our ___. (free)","a":"freedom","w":["freely","freeness"],"e":["Freely is an adverb.","The noun is freedom."]},{"s":"The children's ___ filled the hall. (happy)","a":"happiness","w":["happyness","happily"],"e":["Y becomes i: happiness.","Happily is an adverb."]}]}},"prompt":"Choose the noun that fits.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-30-kind","type":"mcq","level":2,"review":"authored","sources":["word-formation"],"vars":{"X":{"pick":[{"q":"a noun","r":"celebration","w":["celebrate","peaceful","quickly"],"e":["Celebrate is a verb.","Peaceful is an adjective.","Quickly is an adverb."],"y":"-ion makes a noun."},{"q":"an adjective","r":"careless","w":["carelessly","care","carelessness"],"e":["-ly makes an adverb.","Care is a noun or a verb.","-ness makes a noun."],"y":"-less makes an adjective."},{"q":"an adverb","r":"happily","w":["happiness","happy","unhappy"],"e":["-ness makes a noun.","Happy is an adjective.","Unhappy is an adjective."],"y":"-ly makes an adverb."},{"q":"a noun","r":"government","w":["govern","governed","national"],"e":["Govern is a verb.","Governed is a verb form.","National is an adjective."],"y":"-ment makes a noun."}]}},"prompt":"Which word is {X.q}?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"e2-30-adj","type":"cloze","level":1,"review":"authored","sources":["word-formation"],"vars":{"X":{"pick":[{"s":"Be ___ when you cross the road. (care)","a":"careful","w":["careless","carefully"],"e":["Careless means without care.","After be, use an adjective: careful."]},{"s":"He lost his keys again; he is so ___. (care)","a":"careless","w":["careful","caring"],"e":["Losing keys shows no care: careless.","Caring means kind to others."]},{"s":"We want a ___ country. (peace)","a":"peaceful","w":["peaceless","peacefully"],"e":["Peaceless is not used.","Before a noun, use an adjective: peaceful."]},{"s":"The ___ anthem is sung on 20 May. (nation)","a":"national","w":["nationful","nationly"],"e":["The adjective is national.","The adjective is national."]},{"s":"She ran ___ to catch the bus. (quick)","a":"quickly","w":["quick","quickness"],"e":["To say how she ran, use the adverb quickly.","Quickness is a noun."]}]}},"prompt":"Choose the word that fits.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-30-spot","type":"spot_error","level":3,"review":"authored","sources":["word-formation"],"prompt":"One word is formed wrongly. Which sentence has it?","pool":{"right":[{"text":"The celebration was peaceful.","truth":"true"},{"text":"I disagree with you.","truth":"true"},{"text":"That answer is incorrect.","truth":"true"},{"text":"Her kindness helped us.","truth":"true"},{"text":"Please rewrite your essay.","truth":"true"}],"wrong":[{"text":"The test was unpossible.","truth":"false","explain":"Before p we use im-: impossible."},{"text":"We enjoyed the decorateion.","truth":"false","explain":"Drop the e: decoration."},{"text":"His happyness was clear.","truth":"false","explain":"Y becomes i: happiness."},{"text":"I misagree with your idea.","truth":"false","explain":"The opposite of agree is disagree."}]},"pick":{"right":3,"wrong":1}}]},"31":{"subject":"english-language","class":"Form 2","lesson_no":31,"language":"en","prerequisites":[],"skills":[{"id":"e2-31","name":"Modals and polite expressions"}],"note":{"status":"draft","text":"Modal verbs go before a base verb and add a meaning:\n• can: ability or permission — “I can swim.” “Can I go out?”\n• could: a more polite request, or past ability — “Could you help me, please?” “I could read at five.”\n• may: polite permission or possibility — “May I come in?” “It may rain.”\n• must: strong obligation — “You must wear a uniform.” mustn't: it is forbidden.\n• should: advice — “You should rest.”\n• would: polite offers and requests — “Would you like some tea?” “Would you open the window, please?”\nAfter a modal, use the base verb with no to and no -s: “She can swim” (not “she cans” or “can to swim”).\nPolite expressions: please, thank you, excuse me, I'm sorry, “Would you mind …?”","checks":[]},"worked_example":{"status":"draft","vars":{"n":"the principal"},"problem":"Make three polite requests to {n}: to come in, to borrow a book, and to leave early.","steps":["Permission to enter: “May I come in, please?”","Borrowing: “Could I borrow this book, please?”","Leaving early, with a reason: “Would it be possible for me to leave early? My mother is ill.”"],"answer":"May I come in, please? / Could I borrow this book, please? / Would it be possible for me to leave early?","checks":[]},"teach":{"cards":[{"id":"c31-1","status":"draft","idea":"After a modal (can, could, may, must, should, would), use the base verb: no to, no -s.","vars":{},"example":["She can sing. (not: cans sing, can to sing)","You should rest."],"checks":[],"check":{"ref":"e2-31-form"}},{"id":"c31-2","status":"draft","idea":"Each modal has its own meaning: must for obligation, should for advice, may for permission.","vars":{},"example":["You must wear a uniform. (rule)","You should drink water. (advice)"],"checks":[],"check":{"ref":"e2-31-which"}},{"id":"c31-3","status":"draft","idea":"Could, may and would make requests and offers more polite.","vars":{},"example":["Could you help me, please?","Would you like some tea?"],"checks":[],"check":{"ref":"e2-31-polite"}}]},"questions":[{"id":"e2-31-form","type":"cloze","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"s":"My sister can ___ very well.","a":"sing","w":["sings","to sing"],"e":["After can, no -s: sing.","After can, no to: sing."]},{"s":"You should ___ your homework now.","a":"do","w":["to do","does"],"e":["After should, no to: do.","After should, use the base verb: do."]},{"s":"Pupils must ___ on time.","a":"arrive","w":["arrives","to arrive"],"e":["After must, use the base verb: arrive.","After must, no to."]},{"s":"He may ___ late today.","a":"come","w":["comes","coming"],"e":["After may, use the base verb: come.","After may, use the base verb: come."]},{"s":"Would you ___ the door, please?","a":"open","w":["opening","to open"],"e":["After would, use the base verb: open.","After would, no to."]}]}},"prompt":"Choose the correct form.","text":"{X.s}","answer":"X.a","choices":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]},{"id":"e2-31-which","type":"mcq","level":1,"review":"authored","sources":["grammar-tenses"],"vars":{"X":{"pick":[{"q":"“You ___ wear your uniform to school. It is the rule.”","r":"must","w":["may","could","would"],"e":["May is permission, not a rule.","Could is a polite request.","Would is for offers."],"y":"A rule is an obligation: must."},{"q":"“You look tired. You ___ go to bed early.”","r":"should","w":["must not","may not","can't"],"e":["That forbids it.","That refuses permission.","That says it is impossible."],"y":"Advice uses should."},{"q":"“___ I come in, sir?”","r":"May","w":["Must","Should","Would"],"e":["Must is obligation.","Should is advice.","Would is for offers."],"y":"Polite permission: May I …?"},{"q":"“You ___ smoke in the hospital. It is forbidden.”","r":"mustn't","w":["should","can","may"],"e":["Should gives advice to do it.","Can allows it.","May allows it."],"y":"Forbidden: mustn't."},{"q":"“I ___ swim when I was six.”","r":"could","w":["must","should","may"],"e":["Must is obligation.","Should is advice.","May is permission."],"y":"Past ability: could."}]}},"prompt":"Which modal fits? {X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconception  and many children who need help with school.","Paragraph two (actions): Young people can do a lot to make {t} a better place.","Each topic sentence is followed by examples and reasons, with should, can and linking words."],"answer":"Problems and why we should help → what young people can do, with examples.","checks":[]},"teach":{"cards":[{"id":"c32-1","status":"draft","idea":"Each paragraph starts with a topic sentence; the other sentences support it.","vars":{},"example":["Topic: “Young people can make our town cleaner.”","Support: “For example, we can clean the gutters every month.”"],"checks":[],"check":{"id":"e2-32-c1","type":"mcq","level":1,"review":"authored","sources":["writing-skills"],"vars":{"X":{"pick":[{"r":"Young people can do a lot to improve our community.","w":["For example, we can plant trees.","The gutters are blocked.","Finally, we went home."],"e":["That is a supporting example.","That is a problem, not the topic of this paragraph.","That is not about the topic."],"y":"It states the main idea of the paragraph."},{"r":"There are many ways in which the youth can help our quarter.","w":["Also, we can help old people.","I like football.","Our school is big."],"e":["That is a supporting idea.","That is off the topic.","That is off the topic."],"y":"It states the main idea of the paragraph."}]}},"prompt":"Which sentence is the best topic sentence for a paragraph about what young people can do?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}},{"id":"c32-2","status":"draft","idea":"Use should and can to make suggestions.","vars":{},"example":["Young people should avoid drugs.","We can help younger children with their homework."],"checks":[],"check":{"ref":"e2-32-modal"}},{"id":
