eptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"}]}],"paper_task":{"status":"draft","vars":{},"prompt":"Write two paragraphs in your exercise book on the topic “How young people can improve life in their community”. In the first paragraph describe the problems; in the second, say what young people can do, with examples. Use should or can, and at least three linking words.","model":["Our community has many problems. The gutters are often blocked with rubbish, so the streets flood when it rains. Some children cannot read well because nobody helps them at home, and some old people live alone. Young people should help, because this is our home and our future.","There are many things young people can do. First, we can organise a clean-up campaign every month to clear the gutters and the market. In addition, older pupils can teach younger children to read after school. We can also visit old people and fetch water for them. Finally, we should avoid drugs and violence and be good examples. If we work together, our community will be cleaner, safer and happier."],"checklist":["I wrote two paragraphs.","Each paragraph starts with a topic sentence.","Paragraph one describes problems; paragraph two gives actions with examples.","I used should or can.","I used at least three linking words.","I ended with a strong closing sentence.","I checked capital letters, full stops and spelling."]}}},"f2-physics":{"1":{"subject":"physics","class":"Form 2","lesson_no":1,"language":"en","prerequisites":[],"skills":[{"id":"p2-1","name":"Data: why we collect it and how"}],"note":{"status":"draft","text":"Data are the facts and measurements we collect in an experiment. Scientists need data as evidence: a conclusion must be based on what was observed.\n• Qualitative data describe with words: colour, smell, “the water became cloudy”.\n• Quantitative data are numbers with units: 25 °C, 3.2 cm, 45 s.\nRecord data in a table. Each column heading gives the quantity and its unit, for example “Time (s)”, so the unit is not written in every box.\nRepeat each measurement (for example three times) and find the mean: add the readings and divide by how many there are. A reading that is very different from the others is anomalous: check it, repeat it, and leave it out of the mean.","checks":[]},"worked_example":{"status":"draft","vars":{"a":12.4,"b":12.6,"c":12.5,"n":3},"problem":"Bih times a ball rolling down a ramp three times: {a} s, {b} s and {c} s. Find the mean time.","steps":["Add the readings: {a} + {b} + {c} = {a + b + c} s.","Divide by the number of readings, {n}: {a + b + c} ÷ {n} = {mean([a, b, c])} s."],"answer":"The mean time is {mean([a, b, c])} s.","checks":["mean([a, b, c]) == 12.5"]},"teach":{"cards":[{"id":"c1-1","status":"draft","idea":"Qualitative data are descriptions in words; quantitative data are measurements with numbers and units.","vars":{"t":40},"example":["Qualitative: “the solution turned blue”.","Quantitative: “the temperature rose to {t} °C”."],"checks":[],"check":{"ref":"p2-1-kind"}},{"id":"c1-2","status":"draft","idea":"To find the mean of repeated readings, add them and divide by how many there are.","vars":{"a":20,"b":22,"c":21,"n":3},"example":["Readings {readings([a, b, c])}: ({a} + {b} + {c}) ÷ {n} = {mean([a, b, c])}."],"checks":[],"check":{"ref":"p2-1-mean"}},{"id":"c1-3","status":"draft","idea":"An anomalous reading is very different from the others. Repeat it, and leave it out of the mean.","vars":{"a":15,"b":16,"c":14,"d":29},"example":["Readings {readings([a, b, c, d])}: {d} is anomalous.","Mean of the others: {mean([a, b, c])}."],"checks":[],"check":{"ref":"p2-1-odd"}},{"id":"c1-4","status":"draft","idea":"In a results table, put the unit in the column heading, not in every box.","vars":{"a":12,"b":13,"c":12},"example":["Heading: “Length (cm)”, then just the numbers.","Heading: “Time (s)”, then {a}, {b}, {c}."],"checks":[],"check":{"id":"p2-1-c4","type":"mcq","level":1,"review":"authored","sources":["scientific-method"],"vars":{"X":{"pick":[{"q":"times measured in seconds","r":"Time (s)","w":["Seconds","Time","s (Time)"],"e":["Give the quantity, then the unit in brackets.","Add the unit in brackets: Time (s).","Quantity first, then the unit: Time (s)."],"y":"Quantity, then the unit in brackets."},{"q":"masses measured in grams","r":"Mass (g)","w":["Grams","Mass","g"],"e":["Give the quantity, then the unit.","Add the unit: Mass (g).","Give the quantity too: Mass (g)."],"y":"Quantity, then the unit in brackets."},{"q":"temperatures in degrees Celsius","r":"Temperature (°C)","w":["°C","Temperature","Hotness (°C)"],"e":["Give the quantity too.","Add the unit: Temperature (°C).","The quantity is temperature."],"y":"Quantity, then the unit in brackets."},{"q":"lengths in centimetres","r":"Length (cm)","w":["cm","Length","Centimetres long"],"e":["Give the quantity too.","Add the unit: Length (cm).","Quantity, then unit in brackets."],"y":"Quantity, then the unit in brackets."}]}},"prompt":"Which is the best column heading for {X.q}?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"p2-1-kind","type":"matching","level":1,"review":"authored","sources":["scientific-method"],"prompt":"Sort the data: qualitative or quantitative?","pool":[{"left":"the liquid turned milky","right":"qualitative"},{"left":"a strong smell of gas","right":"qualitative"},{"left":"the leaf is dark green","right":"qualitative"},{"left":"the metal felt rough","right":"qualitative"},{"left":"a length of 15.2 cm","right":"quantitative"},{"left":"a temperature of 37 °C","right":"quantitative"},{"left":"a mass of 250 g","right":"quantitative"},{"left":"a time of 45 s","right":"quantitative"}],"pick":4,"groups":true,"group_order":["qualitative","quantitative"]},{"id":"p2-1-mean","type":"numeric","level":1,"review":"rule","sources":["scientific-method"],"vars":{"a":{"int":[10,40]},"d1":{"int":[-2,2]},"d2":{"int":[-2,2]},"b":{"expr":"a + d1"},"c":{"expr":"a + d2"},"n":3},"prompt":"The readings are {readings([a, b, c])}. What is their mean?","answer":"mean([a, b, c])","misconceptions":[{"id":"sum","wrong":"a + b + c","explain":"That is the total. Divide it by {n}."},{"id":"middle","wrong":"max(a, max(b, c))","explain":"The mean is not the largest reading: add them and divide by {n}.","when":"max(a, max(b, c)) != mean([a, b, c])"}],"solution":["Add: {a} + {b} + {c} = {a + b + c}.","Divide by the number of readings: {a + b + c} ÷ {n} = {answer}."],"where":["isInt((a + b + c) / 3)"]},{"id":"p2-1-odd","type":"mcq","level":1,"review":"rule","sources":["scientific-method"],"vars":{"a":{"int":[20,40]},"b":{"expr":"a + 1"},"c":{"expr":"a - 1"},"x":{"expr":"a + 9"},"R":{"sample":["[a, b, c, x]",4]}},"prompt":"The readings are {readings(R)}. Which reading is anomalous?","correct":"{x}","distractors":[{"text":"{a}","misconception":"a"},{"text":"{b}","misconception":"b"},{"text":"{c}","misconception":"c"}],"misconceptions":[{"id":"a","explain":"{a} is close to {b} and {c}."},{"id":"b","explain":"{b} is close to {a} and {c}."},{"id":"c","explain":"{c} is close to {a} and {b}."}],"solution":["{x} is far from the other readings ({a}, {b} and {c}).","So {answer} is the anomalous reading."]},{"id":"p2-1-why","type":"mcq","level":2,"review":"authored","sources":["scientific-method"],"vars":{"X":{"pick":[{"q":"Why do scientists repeat a measurement several times?","r":"To check it and make the result more reliable.","w":["To make the numbers bigger.","Because the first reading is always wrong.","To use up time."],"e":["Repeating does not change the size of the result.","The first reading may be right; repeating checks it.","That is not a reason."],"y":"Repeats show mistakes and give a more reliable mean."},{"q":"Why is data needed in an experiment?","r":"It is the evidence for the conclusion.","w":["It makes the report longer.","Teachers like numbers.","It replaces the method."],"e":["Length is not the reason.","That is not the reason.","The method is still needed."],"y":"A conclusion must be based on data."},{"q":"What should you do with an anomalous reading?","r":"Check it, repeat it, and leave it out of the mean.","w":["Keep it and make the others match.","Change it to look right.","Use only that reading."],"e":["Never change good readings.","Never change data.","It is the odd one out."],"y":"An anomalous reading is checked and left out of the mean."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"p2-1-clean","type":"numeric","level":3,"review":"rule","sources":["scientific-method"],"vars":{"a":{"int":[20,40]},"b":{"expr":"a + 2"},"c":{"expr":"a + 1"},"x":{"expr":"a + 12"},"n":3,"R":{"sample":["[a, b, c, x]",4]}},"prompt":"The readings are {readings(R)}. Leave out the anomalous reading and find the mean of the others.","answer":"mean([a, b, c])","misconceptions":[{"id":"with-odd","wrong":"mean([a, b, c, x])","explain":"That includes the anomalous reading {x}; leave it out."}],"solution":["{x} is anomalous: it is far from the others.","Mean of the others: ({a} + {b} + {c}) ÷ {n} = {answer}."]}]},"2":{"subject":"physics","class":"Form 2","lesson_no":2,"language":"en","prerequisites":[1],"skills":[{"id":"p2-2","name":"Interpreting data and drawing conclusions"}],"note":{"status":"draft","text":"To interpret data, look for a pattern, often on a graph.\n• The quantity we change goes along the bottom (x-axis); the quantity we measure goes up the side (y-axis).\n• Read a value: go up from the x value to the line, then across to the y-axis.\n• The trend: as x increases, y increases, decreases or stays the same. A straight line through 0 means y is proportional to x: double x, double y.\n• The rate of increase is how much y goes up for each 1 unit of x.\nA conclusion answers the question of the experiment using the data: “As the time increases, the distance increases steadily.” It must not claim more than the data show.","checks":[]},"worked_example":{"status":"draft","vars":{"k":4,"x":3},"problem":"A trolley's distance is measured every second: {readings([0, k, 2 * k, 3 * k, 4 * k])} m at the times {readings([0, 1, 2, 3, 4])} s. Describe the trend and find the distance at {x} s.","steps":["Each second the distance increases by the same amount, {k} m: the trend is a steady increase.","At {x} s the distance is {x} × {k} = {x * k} m."],"answer":"Steady increase of {k} m each second; {x * k} m at {x} s.","checks":["x * k == 12"],"figure":"lineGraph([0, 1, 2, 3, 4], [0, k, 2 * k, 3 * k, 4 * k], 'time (s)', 'distance (m)')"},"teach":{"cards":[{"id":"c2-1","status":"draft","idea":"To read a graph, go up from the x value to the line, then across to the y-axis.","vars":{"k":5,"x":2},"example":["At {x} s, go up to the line and across: {x * k} m."],"checks":[],"figure":"lineGraph([0, 1, 2, 3, 4], [0, k, 2 * k, 3 * k, 4 * k], 'time (s)', 'distance (m)')","check":{"ref":"p2-2-read"}},{"id":"c2-2","status":"draft","idea":"The trend tells what happens to y as x increases: it increases, decreases or stays the same.","vars":{},"example":["A line going up from left to right: y increases.","A line going down: y decreases."],"checks":[],"check":{"ref":"p2-2-trend"}},{"id":"c2-3","status":"draft","idea":"A conclusion uses the data to answer the question, without claiming more than the data show.","vars":{},"example":["Good: “As the mass increases, the stretch increases.”","Too much: “Every spring in the world stretches the same.”"],"checks":[],"check":{"ref":"p2-2-conclude"}}]},"questions":[{"id":"p2-2-read","type":"numeric","level":1,"review":"rule","sources":["scientific-method"],"vars":{"k":{"pick":[2,3,4,5,10]},"xs":{"expr":"[0, 1, 2, 3, 4, 5]"},"x":{"int":[1,5]}},"prompt":"The graph shows the distance travelled by a trolley. What distance has it travelled after {x} s?","answer":"x * k","misconceptions":[{"id":"swap","wrong":"x","explain":"{x} is the time; read the distance on the side axis."}],"solution":["Go up from {x} s to the line, then across to the distance axis.","The distance is {answer} m."],"unit":"m","figure":"lineGraph(xs, [0, k, 2 * k, 3 * k, 4 * k, 5 * k], 'time (s)', 'distance (m)')"},{"id":"p2-2-trend","type":"mcq","level":1,"review":"authored","sources":["scientific-method"],"vars":{"T":{"pick":[["The longer a pot of water is heated, the higher its temperature.","the temperature increases with time","the temperature decreases with time","the temperature stays the same","The temperature goes up as time goes on."],["The further a torch is from a wall, the dimmer the light on the wall.","the brightness decreases with distance","the brightness increases with distance","the brightness stays the same","The light gets dimmer as the distance grows."],["The more mass hung on a spring, the longer the spring.","the length increases with mass","the length decreases with mass","the length stays the same","The spring gets longer as the mass grows."],["As a hot drink cools in a room, its temperature falls.","the temperature decreases with time","the temperature increases with time","the temperature stays the same","The temperature goes down as time goes on."]]}},"prompt":"{T[0]} What is the trend?","correct":"{T[1]}","distractors":[{"text":"{T[2]}","misconception":"w1"},{"text":"{T[3]}","misconception":"w2"}],"misconceptions":[{"id":"w1","explain":"Read the description again: {T[4]}"},{"id":"w2","explain":"Something changes: {T[4]}"}],"solution":["{T[4]}","So the trend is: {answer}."],"show":3},{"id":"p2-2-rate","type":"numeric","level":2,"review":"rule","sources":["scientific-method"],"vars":{"k":{"pick":[2,3,4,5,10]},"xs":{"expr":"[0, 1, 2, 3, 4, 5]"},"one":1,"two":2},"prompt":"From the graph, by how many metres does the distance increase each second?","answer":"k","misconceptions":[{"id":"total","wrong":"5 * k","explain":"That is the total after five seconds; the increase each second is {k} m."}],"solution":["Read two points: at {one} s the distance is {k} m, at {two} s it is {2 * k} m.","The increase each second is {2 * k} − {k} = {answer} m."],"unit":"m","figure":"lineGraph(xs, [0, k, 2 * k, 3 * k, 4 * k, 5 * k], 'time (s)', 'distance (m)')"},{"id":"p2-2-conclude","type":"mcq","level":1,"review":"authored","sources":["scientific-method"],"prompt":"A pupil heated water and recorded that its temperature rose by the same amount every minute. Which conclusion is best?","pool":{"right":[{"text":"As the heating time increases, the temperature of the water increases steadily.","truth":"true"},{"text":"The temperature of the water rose at a steady rate while it was heated.","truth":"true"}],"wrong":[{"text":"Water boils at every temperature.","truth":"false","explain":"The data do not show that."},{"text":"All liquids heat up at the same rate as water.","truth":"false","explain":"Only water was tested: the data cannot say that."},{"text":"The temperature went down while heating.","truth":"false","explain":"The data show it went up."},{"text":"Heating water is dangerous.","truth":"false","explain":"That does not answer the question from the data."}]},"pick":{"right":1,"wrong":2}},{"id":"p2-2-proportional","type":"numeric","level":3,"review":"rule","sources":["scientific-method"],"vars":{"k":{"int":[2,9]},"t":{"int":[2,6]},"two":2},"prompt":"Distance is proportional to time in this experiment: in {t} s the trolley goes {t * k} m. How far does it go in {2 * t} s?","answer":"2 * t * k","misconceptions":[{"id":"added","wrong":"t * k + 2","explain":"Proportional means multiply: double the time gives double the distance."}],"solution":["Proportional: double the time, double the distance.","{t * k} × {two} = {answer} m."],"unit":"m"}]},"3":{"subject":"physics","class":"Form 2","lesson_no":3,"language":"en","prerequisites":[2],"skills":[{"id":"p2-3","name":"Predicting and evaluating"}],"note":{"status":"draft","text":"Predicting: when data follow a pattern, we can predict new values.\n• Inside the range measured, read the value from the line (interpolation).\n• Beyond the range, continue the pattern (extrapolation), carefully: the pattern may change.\nA fair test changes one variable only:\n• the independent variable is the one we change;\n• the dependent variable is the one we measure;\n• the controlled variables are kept the same.\nEvaluating an experiment: Were the readings repeatable? Was the test fair? What could cause errors (reaction time with a stopwatch, reading a scale at an angle)? How could it be improved (repeat readings, use a more precise instrument, take more readings)?","checks":[]},"worked_example":{"status":"draft","vars":{"k":3,"n":6,"g":100},"problem":"A spring stretches {k} cm for every {g} g hung on it, up to {5 * g} g. Predict the stretch for {n * g} g, and say why the prediction may be wrong.","steps":["Continue the pattern: {n} × {k} = {n * k} cm.","{n * g} g is beyond the range measured: the spring may stop stretching evenly, so this is only a prediction."],"answer":"About {n * k} cm, but the pattern may change beyond the range measured.","checks":["n * k == 18"]},"teach":{"cards":[{"id":"c3-1","status":"draft","idea":"If the pattern adds the same amount each time, continue it to predict the next value.","vars":{"a":10,"d":5},"example":["{readings([a, a + d, a + 2 * d, a + 3 * d])} …: next {a + 4 * d}."],"checks":[],"check":{"ref":"p2-3-next"}},{"id":"c3-2","status":"draft","idea":"In a fair test, change one variable, measure one, and keep all the others the same.","vars":{},"example":["Changed: the height of the ramp. Measured: the time.","Kept the same: the ball, the ramp length, the surface."],"checks":[],"check":{"ref":"p2-3-var"}},{"id":"c3-3","status":"draft","idea":"To improve an experiment: repeat readings, use more precise instruments, take more readings.","vars":{},"example":["Timing by hand has a reaction-time error.","Repeat and find the mean to reduce it."],"checks":[],"check":{"ref":"p2-3-improve"}}]},"questions":[{"id":"p2-3-next","type":"numeric","level":1,"review":"rule","sources":["scientific-method"],"vars":{"a":{"int":[3,20]},"d":{"int":[2,6]}},"prompt":"A plant's height is measured each week: {readings([a, a + d, a + 2 * d, a + 3 * d])} cm. Predict the height next week if the pattern continues.","answer":"a + 4 * d","misconceptions":[{"id":"diff","wrong":"d","explain":"{d} cm is the growth each week; add it to the last height."}],"solution":["It grows {d} cm each week.","{a + 3 * d} + {d} = {answer} cm."],"unit":"cm"},{"id":"p2-3-var","type":"matching","level":1,"review":"authored","sources":["scientific-method"],"prompt":"In an experiment on how the height of a ramp affects the time a ball takes to roll down it, sort the variables.","pool":[{"left":"the height of the ramp","right":"changed (independent)"},{"left":"the time taken","right":"measured (dependent)"},{"left":"the same ball each time","right":"kept the same (controlled)"},{"left":"the same length of ramp","right":"kept the same (controlled)"},{"left":"the same surface on the ramp","right":"kept the same (controlled)"}],"pick":4,"groups":true,"group_order":["changed (independent)","measured (dependent)","kept the same (controlled)"]},{"id":"p2-3-between","type":"numeric","level":2,"review":"rule","sources":["scientific-method"],"vars":{"k":{"pick":[2,4,6,8,10]},"m":{"pick":[100,200,400]}},"prompt":"A spring stretches {k} cm with {m} g and {2 * k} cm with {2 * m} g, evenly. What is its stretch with {m + m / 2} g?","answer":"k + k / 2","solution":["The stretch is proportional: halfway between {m} g and {2 * m} g gives halfway between {k} cm and {2 * k} cm.","{k} + {k / 2} = {answer} cm."],"unit":"cm"},{"id":"p2-3-improve","type":"mcq","level":1,"review":"authored","sources":["scientific-method"],"vars":{"X":{"pick":[{"q":"Ayuk times one swing of a pendulum with a stopwatch. What is the best way to improve his result?","r":"Time 10 swings and divide by 10.","w":["Time it once very fast.","Guess the time.","Use a ruler."],"e":["One quick reading has a large reaction-time error.","Guessing is not measuring.","A ruler measures length, not time."],"y":"Timing many swings makes the reaction-time error small compared with the total."},{"q":"Bih's three readings are very different from each other. What should she do?","r":"Repeat the measurement and check for mistakes.","w":["Keep only the biggest.","Make up a new reading.","Stop the experiment."],"e":["Choosing the biggest is not fair.","Never make up data.","Find out why first."],"y":"Readings that disagree must be checked and repeated."},{"q":"A pupil reads a measuring cylinder from above. What error can this cause?","r":"a parallax error","w":["a zero error","a reaction-time error","no error"],"e":["A zero error is when an instrument does not start at zero.","Reaction time is about timing.","Reading at an angle gives a wrong value."],"y":"Reading at an angle gives a parallax error: read at eye level."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"p2-3-spot","type":"spot_error","level":3,"review":"authored","sources":["scientific-method"],"prompt":"Which statement about a fair test is wrong?","pool":{"right":[{"text":"Change only one variable at a time.","truth":"true"},{"text":"Keep the controlled variables the same.","truth":"true"},{"text":"Repeat readings and take the mean.","truth":"true"},{"text":"Measure the dependent variable.","truth":"true"}],"wrong":[{"text":"Change two variables at once to save time.","truth":"false","explain":"Then you cannot tell which change caused the result."},{"text":"Use a different ball for each height of the ramp.","truth":"false","explain":"The ball must stay the same: it is a controlled variable."},{"text":"Leave out readings you do not like.","truth":"false","explain":"Only anomalous readings, after checking, may be left out."}]},"pick":{"right":3,"wrong":1}}]},"4":{"subject":"physics","class":"Form 2","lesson_no":4,"language":"en","prerequisites":[],"skills":[{"id":"p2-4","name":"Base physical quantities, their units and instruments"}],"note":{"status":"draft","text":"A physical quantity is something we can measure, with a number and a unit. The SI system has seven base quantities; in Form 2 we use five:\n• length: metre (m), measured with a ruler, metre rule or tape measure;\n• mass: kilogram (kg), measured with a balance;\n• time: second (s), measured with a stopwatch or clock;\n• temperature: kelvin (K), measured with a thermometer (we also use °C);\n• electric current: ampere (A), measured with an ammeter.\n(The other two are the amount of substance, mole, and luminous intensity, candela.)\nOther quantities are derived from these: area (m²), volume (m³), speed (m/s), density (kg/m³).\nPrefixes: kilo- = 1000 (1 km = 1000 m), centi- = one hundredth (100 cm = 1 m), milli- = one thousandth (1000 mm = 1 m).","checks":[]},"worked_example":{"status":"draft","vars":{"a":2.5,"b":350},"problem":"Write {a} km in metres and {b} cm in metres.","steps":["Kilo means a thousand: {a} km = {a} × {factor('km', 'm')} = {convertUnit(a, 'km', 'm')} m.","Centi means one hundredth: {b} cm = {b} ÷ {factor('m', 'cm')} = {convertUnit(b, 'cm', 'm')} m."],"answer":"{convertUnit(a, 'km', 'm')} m and {convertUnit(b, 'cm', 'm')} m","checks":[]},"teach":{"cards":[{"id":"c4-1","status":"draft","idea":"Each base quantity has an SI unit.","vars":{},"example":["length: metre (m); mass: kilogram (kg); time: second (s)","temperature: kelvin (K); current: ampere (A)"],"checks":[],"check":{"ref":"p2-4-unit"}},{"id":"c4-2","status":"draft","idea":"Each quantity has its instrument.","vars":{},"example":["mass: a balance; time: a stopwatch","current: an ammeter; temperature: a thermometer"],"checks":[],"check":{"ref":"p2-4-tool"}},{"id":"c4-3","status":"draft","idea":"Prefixes: kilo- is a thousand times; centi- a hundredth; milli- a thousandth.","vars":{},"example":["1 km = {factor('km', 'm')} m; 1 m = {factor('m', 'cm')} cm","1 kg = {factor('kg', 'g')} g; 1 g = {factor('g', 'mg')} mg"],"checks":[],"check":{"ref":"p2-4-convert"}}]},"questions":[{"id":"p2-4-unit","type":"matching","level":1,"review":"authored","sources":["measurement"],"prompt":"Match each base quantity to its SI unit.","pool":[{"left":"length","right":"metre (m)"},{"left":"mass","right":"kilogram (kg)"},{"left":"time","right":"second (s)"},{"left":"temperature","right":"kelvin (K)"},{"left":"electric current","right":"ampere (A)"}],"pick":4},{"id":"p2-4-tool","type":"matching","level":1,"review":"authored","sources":["measurement"],"prompt":"Match each quantity to the instrument that measures it.","pool":[{"left":"mass","right":"a balance"},{"left":"time","right":"a stopwatch"},{"left":"electric current","right":"an ammeter"},{"left":"temperature","right":"a thermometer"},{"left":"length","right":"a metre rule"},{"left":"volume of a liquid","right":"a measuring cylinder"}],"pick":4},{"id":"p2-4-convert","type":"numeric","level":1,"review":"rule","sources":["measurement"],"vars":{"U":{"pick":[["km","m"],["m","cm"],["kg","g"],["g","kg"],["cm","m"],["m","mm"],["mm","cm"],["g","mg"]]},"v":{"pick":[2,3.5,4,12,250,750,1500]}},"prompt":"Convert {v} {U[0]} to {U[1]}.","answer":"convertUnit(v, U[0], U[1])","misconceptions":[{"id":"wrong-way","wrong":"convertUnit(v, U[1], U[0])","explain":"Check the direction: smaller units means a bigger number."}],"solution":["1 {U[0]} = {factor(U[0], U[1])} {U[1]}.","{v} {U[0]} = {v} × {factor(U[0], U[1])} = {answer} {U[1]}."]},{"id":"p2-4-which","type":"mcq","level":2,"review":"authored","sources":["measurement"],"vars":{"X":{"pick":[{"q":"Which of these is NOT a base quantity?","r":"speed","w":["length","mass","time"],"e":["Length is a base quantity (metre).","Mass is a base quantity (kilogram).","Time is a base quantity (second)."],"y":"Speed is derived: distance ÷ time."},{"q":"Which unit is a derived unit?","r":"m/s","w":["kg","s","A"],"e":["The kilogram is a base unit.","The second is a base unit.","The ampere is a base unit."],"y":"m/s comes from metres and seconds: it is derived."},{"q":"What is the SI unit of mass?","r":"the kilogram","w":["the gram","the newton","the litre"],"e":["The gram is smaller; the SI base unit is the kilogram.","The newton measures force.","The litre measures volume."],"y":"The SI unit of mass is the kilogram."},{"q":"Which instrument measures electric current?","r":"an ammeter","w":["a thermometer","a balance","a stopwatch"],"e":["A thermometer measures temperature.","A balance measures mass.","A stopwatch measures time."],"y":"An ammeter measures current in amperes."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"p2-4-time","type":"numeric","level":3,"review":"rule","sources":["measurement"],"vars":{"m":{"pick":[45,90,20,15,30]},"sixty":60},"prompt":"A football match lasts {m} minutes. How many seconds is that?","answer":"m * 60","misconceptions":[{"id":"hundred","wrong":"m * 100","explain":"A minute has {sixty} seconds, not a hundred."}],"solution":["One minute is {sixty} seconds.","{m} × {sixty} = {answer} s."],"unit":"s"}]},"5":{"subject":"physics","class":"Form 2","lesson_no":5,"language":"en","prerequisites":[4],"skills":[{"id":"p2-5","name":"Speed: definition, units and measurement"}],"note":{"status":"draft","text":"Speed is the distance travelled in one unit of time. Speed = distance ÷ time.\nUnits: metres per second (m/s), the SI unit, or kilometres per hour (km/h) for vehicles.\nA car at 60 km/h would travel 60 km in one hour.\nConverting: 1 km/h = 1000 m ÷ 3600 s, so divide km/h by 3.6 to get m/s: 72 km/h = 20 m/s. Multiply m/s by 3.6 to get km/h.\nMeasuring speed: mark a distance with a tape measure, time the object over it with a stopwatch, then divide. This gives the average speed: the object may go faster and slower along the way.\nA speedometer shows a vehicle's speed at each moment.","checks":[]},"worked_example":{"status":"draft","vars":{"d":100,"t":20},"problem":"Ewane runs {d} m in {t} s. What is his average speed?","steps":["Speed = distance ÷ time.","Speed = {d} ÷ {t} = {d / t} m/s."],"answer":"{d / t} m/s","checks":["d / t == 5"]},"teach":{"cards":[{"id":"c5-1","status":"draft","idea":"Speed is the distance travelled each second (or each hour): distance ÷ time.","vars":{"d":60,"t":12},"example":["{d} m in {t} s: {d} ÷ {t} = {d / t} m/s."],"checks":[],"check":{"ref":"p2-5-speed"}},{"id":"c5-2","status":"draft","idea":"Speed is in m/s or km/h. Divide km/h by {k} to get m/s.","vars":{"v":36,"k":3.6},"example":["{v} km/h = {v} ÷ {k} = {kmhToMs(v)} m/s."],"checks":[],"check":{"ref":"p2-5-convert"}},{"id":"c5-3","status":"draft","idea":"To measure speed, measure a distance and the time taken, then divide. This gives the average speed.","vars":{},"example":["Tape measure for the distance, stopwatch for the time.","A speedometer shows the speed at each moment."],"checks":[],"check":{"ref":"p2-5-measure"}}]},"questions":[{"id":"p2-5-speed","type":"numeric","level":1,"review":"rule","sources":["speed"],"vars":{"t":{"int":[5,40]},"v":{"int":[2,12]},"d":{"expr":"t * v"}},"prompt":"A cyclist travels {d} m in {t} s. What is the average speed?","answer":"d / t","misconceptions":[{"id":"times","wrong":"d * t","explain":"Divide the distance by the time, do not multiply."},{"id":"upside","wrong":"t / d","explain":"Speed is distance ÷ time, not time ÷ distance."}],"solution":["Speed = distance ÷ time.","{d} ÷ {t} = {answer} m/s."],"unit":"m/s"},{"id":"p2-5-convert","type":"numeric","level":1,"review":"rule","sources":["speed"],"vars":{"v":{"pick":[18,36,54,72,90,108,126,144]},"k":3.6},"prompt":"Convert {v} km/h to m/s.","answer":"kmhToMs(v)","misconceptions":[{"id":"times","wrong":"msToKmh(v)","explain":"To go from km/h to m/s, divide by {k}."}],"solution":["Divide by {k}: 1 km/h = {1000} m ÷ {3600} s.","{v} ÷ {k} = {answer} m/s."],"unit":"m/s"},{"id":"p2-5-measure","type":"mcq","level":1,"review":"authored","sources":["speed"],"vars":{"X":{"pick":[{"q":"Which two instruments do you need to measure the speed of a runner?","r":"a tape measure and a stopwatch","w":["a balance and a thermometer","a ruler and a balance","an ammeter and a clock"],"e":["Those measure mass and temperature.","A balance measures mass.","An ammeter measures current."],"y":"Speed needs a distance and a time."},{"q":"What does a speedometer show?","r":"the speed at each moment","w":["the average speed of the whole trip","the distance only","the time only"],"e":["Distance ÷ total time gives the average speed.","That is an odometer.","That is a clock."],"y":"A speedometer shows the speed at that moment."},{"q":"What is the SI unit of speed?","r":"metre per second (m/s)","w":["kilometre (km)","second (s)","kilogram (kg)"],"e":["That is a unit of length.","That is a unit of time.","That is a unit of mass."],"y":"Speed is distance per time: m/s."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"p2-5-kmh","type":"numeric","level":2,"review":"rule","sources":["speed"],"vars":{"h":{"int":[2,6]},"v":{"pick":[40,45,50,60,70,80]},"d":{"expr":"h * v"}},"prompt":"A bus travels {d} km in {h} hours. What is its average speed in km/h?","answer":"d / h","misconceptions":[{"id":"times","wrong":"d * h","explain":"Divide the distance by the time."}],"solution":["Speed = distance ÷ time.","{d} ÷ {h} = {answer} km/h."],"unit":"km/h"},{"id":"p2-5-back","type":"numeric","level":3,"review":"rule","sources":["speed"],"vars":{"v":{"pick":[5,10,15,20,25,30]},"k":3.6},"prompt":"A car moves at {v} m/s. What is its speed in km/h?","answer":"msToKmh(v)","misconceptions":[{"id":"divide","wrong":"kmhToMs(v)","explain":"From m/s to km/h, multiply by {k}."}],"solution":["Multiply m/s by {k} to get km/h.","{v} × {k} = {answer} km/h."],"unit":"km/h"}]},"6":{"subject":"physics","class":"Form 2","lesson_no":6,"language":"en","prerequisites":[5],"skills":[{"id":"p2-6","name":"Calculating distance, time and speed"}],"note":{"status":"draft","text":"The formula v = d/t links speed (v), distance (d) and time (t).\n• Speed: v = d ÷ t.\n• Distance: d = v × t.\n• Time: t = d ÷ v.\nA triangle helps: d on top, v and t at the bottom. Cover the one you want.\nUse matching units: m and s give m/s; km and h give km/h. Convert first if they do not match (for example minutes to hours).\nExample: a bus at 60 km/h for 3 h travels 60 × 3 = 180 km. To travel 150 km at 50 km/h takes 150 ÷ 50 = 3 h.","checks":[]},"worked_example":{"status":"draft","vars":{"v":60,"t":30,"sixty":60},"problem":"A taxi travels at {v} km/h for {t} minutes. How far does it go?","steps":["Units must match: {t} minutes = {t} ÷ {sixty} = {t / sixty} h.","d = v × t = {v} × {t / sixty} = {v * t / sixty} km."],"answer":"{v * t / sixty} km","checks":["v * t / sixty == 30"]},"teach":{"cards":[{"id":"c6-1","status":"draft","idea":"Distance = speed × time.","vars":{"v":8,"t":15},"example":["{v} m/s for {t} s: {v} × {t} = {v * t} m."],"checks":[],"check":{"ref":"p2-6-distance"}},{"id":"c6-2","status":"draft","idea":"Time = distance ÷ speed.","vars":{"d":150,"v":50},"example":["{d} km at {v} km/h: {d} ÷ {v} = {d / v} h."],"checks":[],"check":{"ref":"p2-6-time"}},{"id":"c6-3","status":"draft","idea":"Make the units match before you calculate: change minutes to hours, or km to m.","vars":{"m":30,"sixty":60,"k":2},"example":["{m} minutes = {m / sixty} h.","{k} km = {convertUnit(k, 'km', 'm')} m."],"checks":[],"check":{"id":"p2-6-units-card","type":"numeric","level":1,"review":"rule","sources":["speed"],"vars":{"v":{"pick":[30,40,60,90,120]},"m":{"pick":[15,20,30,45]},"sixty":60},"prompt":"A motorbike travels at {v} km/h for {m} minutes. How many kilometres does it travel?","answer":"v * m / 60","misconceptions":[{"id":"no-convert","wrong":"v * m","explain":"Change the minutes to hours first."}],"solution":["Change minutes to hours: {m} min = {m / sixty} h.","d = {v} × {m / sixty} = {answer} km."],"where":["isInt(v * m / 60)"],"unit":"km"}}]},"questions":[{"id":"p2-6-distance","type":"numeric","level":1,"review":"rule","sources":["speed"],"vars":{"v":{"int":[5,30]},"t":{"int":[10,60]}},"prompt":"A train moves at {v} m/s for {t} s. How far does it travel?","answer":"v * t","misconceptions":[{"id":"divide","wrong":"v / t","explain":"Distance = speed × time: multiply."}],"solution":["d = v × t.","{v} × {t} = {answer} m."],"unit":"m"},{"id":"p2-6-time","type":"numeric","level":1,"review":"rule","sources":["speed"],"vars":{"v":{"pick":[40,50,60,80]},"t":{"int":[2,6]},"d":{"expr":"v * t"}},"prompt":"A bus travels {d} km at {v} km/h. How many hours does the journey take?","answer":"d / v","misconceptions":[{"id":"times","wrong":"d * v","explain":"Time = distance ÷ speed."}],"solution":["t = d ÷ v.","{d} ÷ {v} = {answer} h."],"unit":"h"},{"id":"p2-6-units","type":"numeric","level":2,"review":"rule","sources":["speed"],"vars":{"v":{"pick":[30,40,60,90,120]},"m":{"pick":[15,20,30,45]},"sixty":60},"prompt":"A motorbike travels at {v} km/h for {m} minutes. How many kilometres does it travel?","answer":"v * m / 60","misconceptions":[{"id":"no-convert","wrong":"v * m","explain":"Change the minutes to hours first."}],"solution":["Change minutes to hours: {m} min = {m / sixty} h.","d = {v} × {m / sixty} = {answer} km."],"where":["isInt(v * m / 60)"],"unit":"km"},{"id":"p2-6-trip","type":"numeric","level":3,"review":"rule","sources":["speed"],"vars":{"t1":{"int":[1,3]},"t2":{"int":[1,3]},"v1":{"pick":[40,50,60,80]},"v2":{"pick":[40,60,70,80]},"d1":{"expr":"v1 * t1"},"d2":{"expr":"v2 * t2"}},"prompt":"Mrs Fon drives {d1} km in {t1} h, then {d2} km in {t2} h. What is her average speed for the whole trip?","answer":"(d1 + d2) / (t1 + t2)","misconceptions":[{"id":"mean-speeds","wrong":"(v1 + v2) / 2","explain":"Do not average the two speeds: divide the total distance by the total time.","when":"(v1 + v2) / 2 != (d1 + d2) / (t1 + t2)"}],"solution":["Total distance: {d1} + {d2} = {d1 + d2} km. Total time: {t1} + {t2} = {t1 + t2} h.","Average speed = {d1 + d2} ÷ {t1 + t2} = {answer} km/h."],"where":["isInt((d1 + d2) / (t1 + t2))","v1 != v2"],"unit":"km/h"}]},"7":{"subject":"physics","class":"Form 2","lesson_no":7,"language":"en","prerequisites":[4],"skills":[{"id":"p2-7","name":"Density: definition, units and measurement"}],"note":{"status":"draft","text":"Density is the mass of one unit of volume of a substance. Density = mass ÷ volume (ρ = m/V).\nUnits: g/cm³ (grams per cubic centimetre) or kg/m³. 1 g/cm³ = 1000 kg/m³. Water: 1 g/cm³.\nMeasuring density:\n• mass with a balance;\n• volume of a regular solid: length × width × height;\n• volume of an irregular solid (a stone): by displacement. Read the water in a measuring cylinder, put the stone in, read again: the volume of the stone is the difference.\nAn object less dense than water floats; a denser one sinks. Iron (7.9 g/cm³) sinks; wood (about 0.6 g/cm³) floats.","checks":[]},"worked_example":{"status":"draft","vars":{"m":60,"a":50,"b":70},"problem":"A stone has a mass of {m} g. Water in a measuring cylinder rises from {a} cm³ to {b} cm³ when the stone is put in. Find its density.","steps":["Volume of the stone = {b} − {a} = {b - a} cm³.","Density = {m} ÷ {b - a} = {density(m, b - a)} g/cm³."],"answer":"{density(m, b - a)} g/cm³: it sinks in water.","checks":["density(m, b - a) == 3"],"figure":"displacement(a, b)"},"teach":{"cards":[{"id":"c7-1","status":"draft","idea":"Density = mass ÷ volume.","vars":{"m":80,"v":40},"example":["{m} g in {v} cm³: {m} ÷ {v} = {density(m, v)} g/cm³."],"checks":[],"check":{"ref":"p2-7-density"}},{"id":"c7-2","status":"draft","idea":"The volume of an irregular solid is found by displacement: the rise of the water level.","vars":{"a":40,"b":56},"example":["Before {a} mL, after {b} mL: volume {b - a} cm³."],"checks":[],"figure":"displacement(a, b)","check":{"ref":"p2-7-displace"}},{"id":"c7-3","status":"draft","idea":"Less dense than water (1 g/cm³): it floats. Denser: it sinks.","vars":{"c":0.25,"al":2.7},"example":["Cork {c} g/cm³: floats.","Aluminium {al} g/cm³: sinks."],"checks":[],"check":{"ref":"p2-7-float"}}]},"questions":[{"id":"p2-7-density","type":"numeric","level":1,"review":"rule","sources":["measurement"],"vars":{"v":{"int":[5,40]},"d":{"pick":[0.5,0.8,1.5,2,2.5,3,4,8]},"m":{"expr":"round(v * d, 1)"}},"prompt":"A block has a mass of {m} g and a volume of {v} cm³. What is its density?","answer":"density(m, v)","misconceptions":[{"id":"upside","wrong":"density(v, m)","explain":"Density is mass ÷ volume.","when":"density(v, m) != d"},{"id":"times","wrong":"m * v","explain":"Divide the mass by the volume."}],"solution":["Density = mass ÷ volume.","{m} ÷ {v} = {answer} g/cm³."],"where":["density(m, v) == d"],"unit":"g/cm³"},{"id":"p2-7-displace","type":"numeric","level":1,"review":"rule","sources":["measurement"],"vars":{"a":{"pick":[30,40,50,60]},"r":{"pick":[6,8,10,12,14,16,20]},"b":{"expr":"a + r"}},"prompt":"Water in a measuring cylinder is at {a} mL. A stone is put in and the level rises to {b} mL. What is the volume of the stone?","answer":"b - a","misconceptions":[{"id":"after","wrong":"b","explain":"That is the level with the stone; subtract the level before."}],"solution":["Volume of the stone = the rise in level.","{b} − {a} = {answer} cm³."],"unit":"cm³","figure":"displacement(a, b)"},{"id":"p2-7-float","type":"mcq","level":1,"review":"authored","sources":["measurement"],"vars":{"X":{"pick":[["Cork",0.25],["Dry wood",0.6],["Ice",0.92],["Palm oil",0.91],["Iron",7.9],["Aluminium",2.7],["Glass",2.5],["Copper",8.9],["Stone",2.6]]},"one":1},"prompt":"{X[0]} has a density of {X[1]} g/cm³. In water it …","correct":"{X[1] \u003c 1 ? 'floats' : 'sinks'}","distractors":[{"text":"{X[1] \u003c 1 ? 'sinks' : 'floats'}","misconception":"flip"}],"misconceptions":[{"id":"flip","explain":"Compare with water, {one} g/cm³: less dense floats, denser sinks."}],"solution":["Water has a density of {one} g/cm³.","{X[1]} is {X[1] \u003c 1 ? 'less' : 'more'} than {one}, so it {answer}."],"show":2},{"id":"p2-7-mass","type":"numeric","level":2,"review":"rule","sources":["measurement"],"vars":{"d":7.9,"v":{"int":[2,20]}},"prompt":"Iron has a density of {d} g/cm³. What is the mass of {v} cm³ of iron?","answer":"round(d * v, 1)","misconceptions":[{"id":"divide","wrong":"round(v / d, 2)","explain":"Mass = density × volume: multiply."}],"solution":["Mass = density × volume.","{d} × {v} = {answer} g."],"unit":"g"},{"id":"p2-7-stone","type":"numeric","level":3,"review":"rule","sources":["measurement"],"vars":{"a":{"pick":[30,40,50]},"r":{"pick":[10,12,15,20,25]},"b":{"expr":"a + r"},"d":{"pick":[2,2.4,2.6,3]},"m":{"expr":"d * r"}},"prompt":"A stone of mass {m} g is put in a cylinder of water. The level rises from {a} mL to {b} mL. What is the stone's density?","answer":"density(m, b - a)","misconceptions":[{"id":"level","wrong":"density(m, b)","explain":"Use the volume of the stone, {b - a} cm³, not the water level."}],"solution":["Volume = {b} − {a} = {b - a} cm³.","Density = {m} ÷ {b - a} = {answer} g/cm³."],"where":["isInt(m)"],"unit":"g/cm³","figure":"displacement(a, b)"}]},"8":{"subject":"physics","class":"Form 2","lesson_no":8,"language":"en","prerequisites":[],"skills":[{"id":"p2-8","name":"The physical states of matter"}],"note":{"status":"draft","text":"Matter is anything that has mass and takes up space. It exists in three main states:\n• solid: stone, ice, wood, iron, salt;\n• liquid: water, palm oil, petrol, milk, kerosene;\n• gas: air, oxygen, steam (water vapour), cooking gas, carbon dioxide.\nThe same substance can exist in all three states: ice (solid), water (liquid), steam (gas).\nA substance changes state when it is heated or cooled: melting (solid → liquid), evaporation or boiling (liquid → gas), condensation (gas → liquid), freezing (liquid → solid), sublimation (solid → gas, for example naphthalene balls).","checks":[]},"worked_example":{"status":"draft","vars":{"s":"water"},"problem":"Name the three states of {s} and the change of state from each one to the next when it is heated.","steps":["Solid: ice. Heating it: melting, it becomes liquid water.","Liquid: water. Heating it more: boiling, it becomes steam.","Gas: steam (water vapour)."],"answer":"ice → (melting) → water → (boiling) → steam","checks":[]},"teach":{"cards":[{"id":"c8-1","status":"draft","idea":"Matter has three main states: solid, liquid and gas.","vars":{},"example":["Solid: stone. Liquid: palm oil.","Gas: the air we breathe."],"checks":[],"check":{"ref":"p2-8-sort"}},{"id":"c8-2","status":"draft","idea":"One substance can exist in all three states.","vars":{},"example":["Ice, water and steam are all water.","Candle wax: solid, then liquid when it melts."],"checks":[],"check":{"ref":"p2-8-same"}},{"id":"c8-3","status":"draft","idea":"Heating or cooling changes the state: melting, boiling, condensation, freezing, sublimation.","vars":{},"example":["solid → liquid: {processName('solid', 'liquid')}","gas → liquid: {processName('gas', 'liquid')}"],"checks":[],"check":{"ref":"p2-8-change"}}]},"questions":[{"id":"p2-8-sort","type":"matching","level":1,"review":"authored","sources":["matter"],"prompt":"Sort each substance by its state at room temperature.","pool":[{"left":"stone","right":"solid"},{"left":"salt","right":"solid"},{"left":"iron nail","right":"solid"},{"left":"ice cube","right":"solid"},{"left":"palm oil","right":"liquid"},{"left":"kerosene","right":"liquid"},{"left":"milk","right":"liquid"},{"left":"petrol","right":"liquid"},{"left":"air","right":"gas"},{"left":"oxygen","right":"gas"},{"left":"steam","right":"gas"},{"left":"cooking gas","right":"gas"}],"pick":6,"groups":true,"group_order":["solid","liquid","gas"]},{"id":"p2-8-same","type":"mcq","level":1,"review":"authored","sources":["matter"],"vars":{"X":{"pick":[{"q":"What is water in the solid state called?","r":"ice","w":["steam","vapour","rain"],"e":["Steam is water as a gas.","Vapour is water as a gas.","Rain is liquid water."],"y":"Solid water is ice."},{"q":"What is water in the gas state called?","r":"steam (water vapour)","w":["ice","dew","frost"],"e":["Ice is solid.","Dew is liquid water.","Frost is solid ice."],"y":"Water as a gas is steam or water vapour."},{"q":"Candle wax that melts becomes …","r":"a liquid","w":["a gas","a harder solid","nothing"],"e":["Melting gives a liquid.","Melting makes it liquid.","The wax is still there."],"y":"Melting changes a solid into a liquid."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"p2-8-change","type":"mcq","level":1,"review":"rule","sources":["matter"],"vars":{"C":{"pick":[["solid","liquid"],["liquid","solid"],["liquid","gas"],["gas","liquid"],["solid","gas"]]}},"prompt":"What is the change from {C[0]} to {C[1]} called?","correct":"{processName(C[0], C[1])}","distractors":[{"text":"melting","misconception":"w"},{"text":"freezing","misconception":"w"},{"text":"evaporation","misconception":"w"},{"text":"condensation","misconception":"w"},{"text":"sublimation","misconception":"w"}],"misconceptions":[{"id":"w","explain":"That is a different change: {C[0]} → {C[1]} is {processName(C[0], C[1])}."}],"solution":["{C[0]} → {C[1]} is {answer}."]},{"id":"p2-8-life","type":"mcq","level":2,"review":"authored","sources":["matter"],"vars":{"X":{"pick":[{"q":"Wet clothes dry on a line.","r":"evaporation","w":["condensation","melting","freezing"],"e":["Condensation turns gas into liquid.","Melting turns solid into liquid.","Freezing turns liquid into solid."],"y":"The water in the clothes becomes vapour."},{"q":"Drops form on the outside of a cold bottle of water.","r":"condensation","w":["evaporation","melting","sublimation"],"e":["Evaporation turns liquid into gas.","Nothing solid melts here.","Sublimation turns solid into gas."],"y":"Water vapour in the air cools and becomes liquid."},{"q":"Shea butter becomes runny in the hot sun.","r":"melting","w":["freezing","condensation","boiling"],"e":["Freezing is liquid → solid.","Condensation is gas → liquid.","Boiling is liquid → gas."],"y":"A solid becomes liquid: melting."},{"q":"Naphthalene balls in a wardrobe get smaller without becoming liquid.","r":"sublimation","w":["melting","evaporation","freezing"],"e":["Melting would make a liquid.","Evaporation starts from a liquid.","Freezing makes a solid."],"y":"Solid → gas directly is sublimation."}]}},"prompt":"{X.q} Which change of state is this?","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1 "id":"p2-13","name":"The action of electrical energy on materials"}],"note":{"status":"draft","text":"When an electric current passes through a material it can produce:\n• a heating effect: the wire gets hot (electric iron, hot plate, kettle, water heater, fuse);\n• a lighting effect: a thin wire glows (filament bulb), or a lamp gives light (LED, fluorescent tube);\n• a magnetic effect: a coil of wire with current becomes a magnet (electromagnet, electric bell, motor, loudspeaker);\n• a chemical effect: current breaks down some liquids (electrolysis); it is used for electroplating and for charging batteries.\nA fuse is a thin wire that melts if the current is too big, to protect the circuit.\nElectrical energy is converted into other forms: heat, light, movement, sound.","checks":[]},"worked_example":{"status":"draft","vars":{"d":"an electric kettle"},"problem":"Which effect of electric current does {d} use, and what energy change happens?","steps":["The current passes through a heating element, which gets very hot: the heating effect.","Electrical energy is changed into heat energy, which boils the water."],"answer":"The heating effect: electrical energy → heat.","checks":[]},"teach":{"cards":[{"id":"c13-1","status":"draft","idea":"Current can heat, give light, make a magnet, or cause chemical change.","vars":{},"example":["An iron uses the heating effect.","A bell uses the magnetic effect."],"checks":[],"check":{"ref":"p2-13-effect"}},{"id":"c13-2","status":"draft","idea":"A fuse melts when the current is too big, and so protects the circuit.","vars":{},"example":["A fuse is a thin wire.","Too much current heats it until it melts."],"checks":[],"check":{"ref":"p2-13-fuse"}},{"id":"c13-3","status":"draft","idea":"Devices change electrical energy into other forms: heat, light, movement, sound.","vars":{},"example":["Fan: electrical → movement.","Radio: electrical → sound."],"checks":[],"check":{"id":"p2-13-energy-card","type":"mcq","level":1,"review":"authored","sou  particles at the hot end vibrate faster and pass the energy to their neighbours. Metals conduct heat best, because they also have free electrons that carry energy.\nExperiment: fix drops of wax along rods of copper, aluminium, iron and glass and heat one end of each: the wax melts furthest along the copper rod first.\nOrder (best conductor first): copper, aluminium, iron, … glass, wood, plastic.\nElectrical conduction: a current flows only in a closed circuit made of conductors. In metals, electrons carry the current. Put a material in a circuit with a cell and a bulb: if the bulb lights, the material conducts.","checks":[]},"worked_example":{"status":"draft","vars":{"m":"a steel spoon"},"problem":"Ngwa leaves {m} in a pot of hot soup. After a while the handle is hot. Explain.","steps":["The spoon touches the hot soup at one end.","Its particles there vibrate faster and pass the energy along the spoon: conduction.","Steel is a metal, a good conductor, so the handle soon gets hot."],"answer":"Heat is conducted along the metal spoon to the handle.","checks":[]},"teach":{"cards":[{"id":"c14-1","status":"draft","idea":"In conduction, energy passes from particle to particle; the material does not move.","vars":{},"example":["The handle of a metal spoon in hot tea gets hot.","The spoon stays where it is."],"checks":[],"check":{"ref":"p2-14-what"}},{"id":"c14-2","status":"draft","idea":"Metals conduct heat best; copper is better than aluminium, which is better than iron.","vars":{},"example":["Wax melts first along the copper rod.","Glass and wood conduct poorly."],"checks":[],"check":{"ref":"p2-14-order"}},{"id":"c14-3","status":"draft","idea":"Electric current flows only in a closed circuit of conductors.","vars":{},"example":["A bulb lights when a metal key closes the circuit.","A plastic pen leaves the bulb off."],"checks":[],"check":{"ref":"p2-14-circuit"}}]},"questions":[{"id":"p2-14-what","type":"mcq","level":1,"review":"authored","sources":["heat-electricity"],"va ium {formula('NH4')}"],"checks":[],"check":{"id":"k2-7-ate-card","type":"mcq","level":1,"review":"authored","sources":["symbols-valency"],"vars":{"X":{"pick":[{"q":"Which radical is positive?","r":"ammonium, NH₄","w":["nitrate, NO₃","sulfate, SO₄","hydroxide, OH"],"e":["Nitrate is negative.","Sulfate is negative.","Hydroxide is negative."],"y":"Ammonium is the common positive radical."},{"q":"What do the radicals sulfate, nitrate and carbonate all contain?","r":"oxygen","w":["hydrogen","chlorine","sodium"],"e":["They have no hydrogen.","They have no chlorine.","They have no sodium."],"y":"Names ending in -ate contain oxygen."},{"q":"Which formula needs brackets?","r":"Ca(OH)₂","w":["NaOH","KNO₃","CaCO₃"],"e":["One hydroxide: no brackets.","One nitrate: no brackets.","One carbonate: no brackets."],"y":"Two hydroxide radicals: (OH)₂."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"k2-7-match","type":"matching","level":1,"review":"authored","sources":["symbols-valency"],"prompt":"Match each radical to its formula.","pool":[{"left":"hydroxide","right":"OH"},{"left":"nitrate","right":"NO₃"},{"left":"sulfate","right":"SO₄"},{"left":"carbonate","right":"CO₃"},{"left":"phosphate","right":"PO₄"},{"left":"ammonium","right":"NH₄"},{"left":"hydrogencarbonate","right":"HCO₃"}],"pick":4},{"id":"k2-7-valency","type":"numeric","level":1,"review":"rule","sources":["symbols-valency"],"vars":{"r":{"pick":["OH","NO3","HCO3","SO4","CO3","PO4","NH4"]}},"prompt":"What is the valency of the {partName(r)} radical, {formula(r)}?","answer":"valency(r)","misconceptions":[{"id":"atoms","wrong":"totalAtoms(r)","explain":"Valency is the combining power, not the number of atoms. e ammonium radical is NH₄."}]},"pick":{"right":3,"wrong":1}}]},"8":{"subject":"chemistry","class":"Form 2","lesson_no":8,"language":"en","prerequisites":[3,7],"skills":[{"id":"k2-8","name":"Valency of elements and radicals"}],"note":{"status":"draft","text":"Valency is the combining power of an element or radical: the number of hydrogen atoms (or other atoms of valency 1) it can combine with.\nFor elements, the valency comes from the outer electrons:\n• groups 1, 2, 3 (metals): valency 1, 2, 3 (they lose these electrons);\n• group 4: valency 4;\n• groups 5, 6, 7 (non-metals): valency 3, 2, 1 (8 minus the outer electrons);\n• group 8 (noble gases): valency 0, they hardly combine.\nExamples: Na 1, Mg 2, Al 3, C 4, N 3, O 2, Cl 1. Hydrogen has valency 1.\nSome metals have more than one valency (iron 2 or 3; copper 1 or 2): the name shows it, iron(III) oxide.","checks":[]},"worked_example":{"status":"draft","vars":{"z":16,"eight":8},"problem":"Find the valency of sulfur (atomic number {z}) from its electron arrangement.","steps":["Arrangement: {shells(z)}, so {outerElectrons(z)} outer electrons (group {groupOf(z)}).","A non-metal: valency = {eight} − {outerElectrons(z)} = {eight - outerElectrons(z)}."],"answer":"Valency {eight - outerElectrons(z)}.","checks":["eight - outerElectrons(z) == 2"]},"teach":{"cards":[{"id":"c8-1","status":"draft","idea":"Valency is the combining power: how many hydrogen atoms an atom can hold.","vars":{},"example":["Oxygen holds two H: H₂O, valency {valency('O')}.","Chlorine holds one H: HCl, valency {valency('Cl')}."],"checks":[],"check":{"ref":"k2-8-element"}},{"id":"c8-2","status":"draft","idea":"Metals in groups {'1, 2, 3'} have valency {'1, 2, 3'}; non-metals in groups {'5, 6, 7'} have valency {'3, 2, 1'}.","vars":{"m":12,"n":7},"example":["Mg (group {groupOf(m)}): valency {valency('Mg')}","N (group {groupOf(n)}): valency {valency('N')}"],"checks":[],"check":{"ref":"k2-8-group"}},{"id":"c8-3","status":"draft","idea":"Noble gases have a f ,"note":{"status":"draft","text":"A chemical formula shows which elements are in a substance and how many atoms of each are in one unit of it.\n• The small number after a symbol counts the atoms of that element: H₂O has 2 hydrogen atoms and 1 oxygen atom.\n• No number means one atom.\n• A number after a bracket multiplies everything inside: Ca(OH)₂ has 1 Ca, 2 O and 2 H.\n• A big number in front counts whole units: 3H₂O means three water molecules (6 H and 3 O).\nElements: one kind of atom (O₂, Fe). Compounds: two or more elements joined (H₂O, NaCl).","checks":[]},"worked_example":{"status":"draft","vars":{"f":"Al2(SO4)3"},"problem":"How many atoms of each element are in {formula(f)}, and how many atoms in total?","steps":["Al₂: {atomCount(f, 'Al')} aluminium atoms.","(SO₄) three times: {atomCount(f, 'S')} sulfur and {atomCount(f, 'O')} oxygen atoms.","Total: {totalAtoms(f)} atoms."],"answer":"{atomList(f)}; {totalAtoms(f)} atoms in all.","checks":["totalAtoms(f) == 17"]},"teach":{"cards":[{"id":"c9-1","status":"draft","idea":"The small number after a symbol counts that element's atoms; no number means one.","vars":{"f":"H2SO4"},"example":["{formula(f)}: {atomList(f)}."],"checks":[],"check":{"ref":"k2-9-count"}},{"id":"c9-2","status":"draft","idea":"A number after a bracket multiplies everything inside the bracket.","vars":{"f":"Ca(OH)2"},"example":["{formula(f)}: {atomList(f)}."],"checks":[],"check":{"ref":"k2-9-bracket"}},{"id":"c9-3","status":"draft","idea":"An element has one kind of atom; a compound has two or more elements.","vars":{},"example":["Element: {formula('O2')}.","Compound: {formula('CO2')}."],"checks":[],"check":{"ref":"k2-9-kind"}}]},"questions":[{"id":"k2-9-count","type":"numeric","level":1,"review":"rule","sources":["symbols-valency"],"vars":{"f":{"pick":["H2O","CO2","CaCO3","H2SO4","NH3","C6H12O6","KNO3","Na2CO3","MgO","Al2O3"]},"e":{"expr":"symbolsIn(f)[symbolsIn(f).length - 1]"}},"prompt":"How many {nameOf(e)} atoms are in one unit of {formula(f)}?","answer":"atomCount(f, e)","solution":["{formula(f)}: {atomList(f)}.","So {answer} {nameOf(e)} atoms."]},{"id":"k2-9-bracket","type":"numeric","level":1,"review":"rule","sources":["symbols-valency"],"vars":{"f":{"pick":["Ca(OH)2","Al2(SO4)3","Mg(NO3)2","Ca3(PO4)2","(NH4)2SO4"]},"e":{"pick":["O","H","N"]}},"prompt":"How many {nameOf(e)} atoms are in one unit of {formula(f)}?","answer":"atomCount(f, e)","misconceptions":[{"id":"no-multiply","wrong":"atomCount(f, e) / (f == 'Al2(SO4)3' ? 3 : 2)","explain":"Multiply by the number after the bracket.","when":"isInt(atomCount(f, e) / (f == 'Al2(SO4)3' ? 3 : 2))"}],"solution":["The number after the bracket multiplies everything inside it.","{formula(f)}: {atomList(f)}, so {answer}."],"where":["atomCount(f, e) > 0"]},{"id":"k2-9-kind","type":"mcq","level":1,"review":"rule","sources":["symbols-valency"],"vars":{"f":{"pick":["O2","N2","Fe","Cu","H2","Cl2","H2O","NaCl","CO2","MgO","NH3"]}},"prompt":"Is {formula(f)} an element or a compound?","correct":"{elementCount(f) == 1 ? 'an element' : 'a compound'}","distractors":[{"text":"{elementCount(f) == 1 ? 'a compound' : 'an element'}","misconception":"flip"}],"misconceptions":[{"id":"flip","explain":"Count the different elements: one kind of atom is an element; two or more is a compound."}],"solution":["{formula(f)} contains {elementCount(f) == 1 ? 'only ' + nameOf(symbolsIn(f)[0]) : elementNames(f)}.","So it is {answer}."],"show":2},{"id":"k2-9-total","type":"numeric","level":2,"review":"rule","sources":["symbols-valency"],"vars":{"f":{"pick":["H2O","CO2","NaCl","CaCO3","H2SO4","NaOH","Ca(OH)2","Al2O3","MgO","HCl","NH3","C6H12O6","Al2(SO4)3","KNO3","CuSO4","Na2CO3"]}},"prompt":"How many atoms in total are in one unit of {formula(f)}?","answer":"totalAtoms(f)","misconceptions":[{"id":"elements","wrong":"elementCount(f)","explain":"That counts the elements; count every atom.","when":"elementCount(f) != totalAtoms(f)"}],"solution":["{formula(f)}: {atomList(f)}.","Total: {answ ,"language":"en","prerequisites":[6],"skills":[{"id":"k2-13","name":"The periodic table: brief history and purpose"}],"note":{"status":"draft","text":"Chemists looked for a way to classify the elements, to study them more easily and to predict their properties.\n• Döbereiner (1829) noticed groups of three similar elements (triads), such as lithium, sodium and potassium.\n• Newlands (1864) arranged elements by mass and saw that every eighth element was similar (the law of octaves).\n• Mendeleev (1869) arranged the elements in order of atomic mass, put elements with similar properties in the same column, and left gaps for elements not yet discovered. He predicted their properties, and when they were found (such as gallium and germanium) he was right.\n• Today the elements are arranged in order of atomic number (Moseley, 1913).\nPurpose: to classify elements and to predict their properties and reactions.","checks":[]},"worked_example":{"status":"draft","vars":{"m":"Mendeleev"},"problem":"Why was {m}'s table so useful?","steps":["He put elements with similar properties in the same column.","He left gaps for unknown elements and predicted their properties; later discoveries matched his predictions."],"answer":"It classified the elements and correctly predicted elements not yet discovered.","checks":[]},"teach":{"cards":[{"id":"c13-1","status":"draft","idea":"The periodic table classifies the elements, so we can study them and predict their properties.","vars":{},"example":["Similar elements are in the same column.","Lithium, sodium and potassium are alike."],"checks":[],"check":{"ref":"k2-13-purpose"}},{"id":"c13-2","status":"draft","idea":"Mendeleev arranged elements by atomic mass and left gaps for undiscovered elements.","vars":{},"example":["He predicted the properties of gallium and germanium before they were found."],"checks":[],"check":{"ref":"k2-13-who"}},{"id":"c13-3","status":"draft","idea":"The modern table is in order of atomic number, not atomic mass.","vars ."],"checks":[],"check":{"ref":"k2-17-alkali"}},{"id":"c17-2","status":"draft","idea":"Halogens get less reactive down the group.","vars":{},"example":["Fluorine is the most reactive.","Iodine is the least reactive of the four."],"checks":[],"check":{"ref":"k2-17-halogen"}},{"id":"c17-3","status":"draft","idea":"A more reactive halogen pushes a less reactive one out of its compound.","vars":{},"example":["Chlorine + potassium iodide → potassium chloride + iodine.","Iodine cannot push out chlorine."],"checks":[],"check":{"id":"k2-17-displace-card","type":"mcq","level":1,"review":"authored","sources":["periodic-table"],"vars":{"X":{"pick":[{"q":"Chlorine is bubbled into potassium iodide solution. What happens?","r":"Iodine is pushed out, because chlorine is more reactive.","w":["Nothing, because iodine is more reactive.","Chlorine is pushed out.","Potassium becomes a gas."],"e":["Chlorine is more reactive than iodine.","Chlorine displaces iodine, not the reverse.","Potassium stays in the compound."],"y":"A more reactive halogen displaces a less reactive one."},{"q":"Why is potassium more reactive than sodium?","r":"Its outer electron is further from the nucleus, so it is lost more easily.","w":["It has fewer shells.","It is a halogen.","It has a full outer shell."],"e":["It has more shells.","It is an alkali metal.","It has one outer electron."],"y":"Further from the nucleus, the electron is held less tightly."},{"q":"Why do noble gases not react?","r":"Their outer shell is full.","w":["They are too heavy.","They are metals.","They have no electrons."],"e":["Mass is not the reason.","They are non-metals.","They have electrons."],"y":"A full outer shell is stable."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["  reproduction.","That describes asexual reproduction.","Flowering plants need flowers for it."],"y":"Variation helps a species survive changes."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"b2-1-why","type":"mcq","level":1,"review":"authored","sources":["plant-reproduction"],"vars":{"X":{"pick":[{"q":"Why do living things need to reproduce?","r":"so that their species does not die out","w":["to grow taller","to get more food","to make oxygen"],"e":["Growth is not reproduction.","Feeding is not reproduction.","That is photosynthesis."],"y":"Reproduction replaces individuals that die."},{"q":"What is reproduction?","r":"making new individuals of the same kind","w":["making food from sunlight","taking in oxygen","removing waste"],"e":["That is photosynthesis.","That is respiration.","That is excretion."],"y":"Reproduction produces offspring."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"b2-1-kind","type":"matching","level":1,"review":"authored","sources":["plant-reproduction"],"prompt":"Sort the examples: sexual or asexual reproduction?","pool":[{"left":"planting a banana sucker","right":"asexual"},{"left":"an onion bulb making new bulbs","right":"asexual"},{"left":"planting a cassava stem cutting","right":"asexual"},{"left":"a potato tuber sprouting","right":"asexual"},{"left":"growing maize from seeds","right":"sexual"},{"left":"pollen ferti "truth":"true"}],"wrong":[{"text":"Asexual reproduction needs two sex cells.","truth":"false","explain":"Asexual reproduction has no sex cells."},{"text":"Offspring of sexual reproduction are always identical.","truth":"false","explain":"They vary: they are not identical."},{"text":"A banana sucker is sexual reproduction.","truth":"false","explain":"A sucker comes from one parent: asexual."}]},"pick":{"right":3,"wrong":1}}]},"2":{"subject":"biology","class":"Form 2","lesson_no":2,"language":"en","prerequisites":[1],"skills":[{"id":"b2-2","name":"Natural vegetative multiplication"}],"note":{"status":"draft","text":"Vegetative propagation is asexual reproduction from a part of the plant that is not a flower (a stem, root or leaf). It happens naturally through special organs:\n• bulb: a short stem with fleshy leaves storing food (onion, garlic);\n• corm: a short swollen underground stem (cocoyam);\n• rhizome: a horizontal underground stem (ginger, spear grass);\n• stem tuber: a swollen underground stem tip with buds called eyes (Irish potato);\n• root tuber: a swollen root (sweet potato);\n• sucker: a shoot from the base of the stem (banana, plantain);\n• runner (stolon): a stem growing along the ground (some grasses);\n• leaves: buds on the leaf edge grow into plantlets (Bryophyllum).\nMost of these organs store food, which feeds the new plant.","checks":[]},"worked_example":{"status":"draft","vars":{"p":"Irish potato"},"problem":"How does an {p} reproduce naturally without seeds?","steps":["An Irish potato is a stem tuber: a swollen underground stem full of stored food.","Its buds (eyes) grow into new shoots, using the stored food, and each forms a new plant."],"answer":"By stem tubers: the buds (eyes) grow into new plants.","checks":[]},"teach":{"cards":[{"id":"c2-1","status":"draft","idea":"Vegetative propagation grows new plants from stems, roots or leaves, not from seeds.","vars":{},"example":["A banana sucker becomes a new banana plant.","A ginger rhizome grows n.","pool":[{"left":"onion","right":"bulb"},{"left":"garlic","right":"bulb"},{"left":"cocoyam","right":"corm"},{"left":"ginger","right":"rhizome"},{"left":"Irish potato","right":"stem tuber"},{"left":"sweet potato","right":"root tuber"},{"left":"banana","right":"sucker"},{"left":"plantain","right":"sucker"},{"left":"Bryophyllum","right":"leaf buds"},{"left":"spear grass","right":"rhizome"}],"pick":4},{"id":"b2-2-store","type":"mcq","level":1,"review":"authored","sources":["plant-reproduction"],"vars":{"X":{"pick":[{"q":"What is an Irish potato?","r":"a stem tuber","w":["a root tuber","a bulb","a seed"],"e":["A root tuber is a swollen root, like sweet potato.","A bulb has fleshy leaves, like onion.","It is not a seed."],"y":"It is a swollen stem with buds (eyes)."},{"q":"What is a sweet potato?","r":"a root tuber","w":["a stem tuber","a corm","a rhizome"],"e":["Sweet potato is a swollen root.","A corm is a short swollen stem.","A rhizome is a horizontal stem."],"y":"It is a swollen root."},{"q":"Why do most vegetative organs contain stored food?","r":"to feed the new plant until it can make its own food","w":["to attract insects","to make seeds","to keep the soil wet"],"e":["That is the job of petals.","Seeds come from flowers.","That is not their job."],"y":"Stored food feeds the young shoots."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"b2-2-leaf","type":"mcq","level":2,"review":"authored","sources":["plant-reproduction"],"vars":{"X":{"pick":[{"q":"Which plant forms new plantlets on the edges of its leaves?","r":"Bryophyllum","w":["maize","mango","groundnut"],"e":["Maize grows from seeds.","Mango grows from seeds or grafts.","Groundnut grows from seeds."],"y":"Bryophyllum has buds on its leaf edges."},{"q":"Banana and plantain reproduce naturally by …","r":"suckers","w":["seeds","bulbs","leaves"],"e":["Cultivated bananas have no good seeds.","They have no bulbs.","Their leaves do not make plantlets."],"y":"Suckers grow from the base of the stem."},{"q":"Spear grass is hard to get rid of because it spreads by …","r":"underground rhizomes","w":["bulbs","fruits","flowers only"],"e":["It has no bulbs.","It spreads mainly by rhizomes.","Its rhizomes spread it."],"y":"Pieces of rhizome left in the soil grow again."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"b2-2-spot","type":"spot_error","level":3,"review":"authored","sources":["plant-reproduction"],"prompt":"Which statement is wrong?","pool":{"right":[{"text":"Onion reproduces by bulbs.","truth":"true"},{"text":"Ginger has a rhizome.","truth":"true"},{"text":"Cocoyam has a corm.","truth":"true"},{"text":"Plantain reproduces by suckers.","truth":"true"}],"wrong":[{"text":"Sweet potato is a stem tuber.","truth":"false","explain":"Sweet potato is a root tuber; Irish potato is a stem tuber."},{"text":"Vegetative propagation uses flowers.","truth":"false","explain":"It uses stems, roots or leaves, not flowers."},{"text":"A bulb is a swollen root.","truth":"false","explain":"A bulb is a short stem with fleshy leaves."}]},"pick":{"right":3,"wrong":1}}]},"3":{"subject":"biology","class":"Form 2","lesson_no":3,"language":"en","prerequisites":[2],"skills":[{"id":"b2-3","name":"Artificial vegetative propagation"}],"note":{"status":"draft","text":"Farmers and gardeners use vegetative propagation on purpose:\n• Cuttings: a piece of stem is planted and grows roots (cassava, sugarcane, hibiscus, Irish potato pieces with an eye).\n• Grafting: a shoot (the scion) of a good variety is joined onto a rooted plant (the stock), and they grow together (mango, orange, avocado).\n• Budding: like grafting, but with a single bud (oranges, roses).\n• Layering: a low branch is bent and covered with soil; when it has roots it is cut off.\n• Marcotting (air layering): a ring of bark is removed and the place is wrapped in moist soil while still on the tree.\n• Tissue culture: tiny pieces are grown in a laboratory to make thousands of identical plants.\nThe scion gives the fruit quality; the stock gives strong roots.","checks":[]},"worked_example":{"status":"draft","vars":{"t":"mango"},"problem":"A farmer has a {t} tree with big sweet fruits and a young {t} seedling with strong roots. How can he get the good fruits quickly on a strong plant?","steps":["Graft: cut a shoot (the scion) from the tree with good fruits.","Join it onto the seedling (the stock) and tie them so they grow together.","The plant will have the strong roots of the stock and the good fruits of the scion."],"answer":"By grafting the good variety (scion) onto the seedling (stock).","checks":[]},"teach":{"cards":[{"id":"c3-1","status":"draft","idea":"A cutting is a piece of stem planted to grow a new plant.","vars":{},"example":["Cassava is grown from stem cuttings.","Sugarcane too."],"checks":[],"check":{"ref":"b2-3-method"}},{"id":"c3-2","status":"draft","idea":"In grafting, a scion from a good plant is joined onto a stock with good roots.","vars":{},"example":["Scion: gives the fruit.","Stock: gives the roots."],"checks":[],"check":{"ref":"b2-3-graft"}},{"id":"c3-3","status":"draft","idea":"Layering and marcotting make a branch grow roots before it is cut off.","vars":{},"example":["Layering: branch bent into the soil.","Marcotting: soil wrapped round the branch on the tree."],"checks":[],"check":{"id":"b2-3-crop-card","type":"mcq","level":1,"review":"authored","sources":["plant-reproduction" oil; leaves grow upwards."},{"text":"Flood the pots with water every hour.","truth":"false","explain":"Water lightly: flooding makes the organs rot."},{"text":"Plantlets grow from the Bryophyllum leaf stalk only.","truth":"false","explain":"They grow from the notches on the leaf edge."}]},"pick":{"right":3,"wrong":1}}]},"5":{"subject":"biology","class":"Form 2","lesson_no":5,"language":"en","prerequisites":[3],"skills":[{"id":"b2-5","name":"Experiment 2: practising artificial vegetative propagation"}],"note":{"status":"draft","text":"Aim: to grow new plants from stem cuttings.\nMaterials: healthy mature stems of cassava (or hibiscus), a sharp cutlass or knife, a nursery bed or pots with moist soil.\nMethod:\n1. Choose a healthy, mature stem from a good plant.\n2. Cut pieces about 20–25 cm long, each with several nodes (buds), with a slanting cut.\n3. Plant each piece the right way up (buds pointing up), slanted, with about two thirds in the soil.\n4. Water regularly and protect from animals.\n5. Observe for three to four weeks and record when roots and shoots appear.\nResults: roots grow from the nodes under the soil; shoots grow from the buds above it.\nConclusion: a piece of stem with nodes can grow into a whole new plant, identical to its parent.","checks":[]},"worked_example":{"status":"draft","vars":{"c":"cassava"},"problem":"Why must a {c} cutting have nodes, and why is it planted the right way up?","steps":["New roots and shoots grow from the nodes (buds); a piece without nodes cannot grow.","Buds pointing up grow into shoots towards the light; upside down, the cutting grows poorly or dies."],"answer":"Nodes carry the buds; the right way up lets shoots grow upwards.","checks":[]},"teach":{"cards":[{"id":"c5-1","status":"draft","idea":"Choose a healthy, mature stem, and cut pieces with several nodes.","vars":{},"example":["The nodes carry buds.","Use a sharp blade and a slanting cut."],"checks":[],"check":{"ref":"b2-5-steps"}},{"id":"c5-2","status":"draft","id
