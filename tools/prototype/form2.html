ick":[{"q":"Why must each cutting have nodes?","r":"Roots and shoots grow from the nodes.","w":["Nodes make it heavier.","Nodes store water only.","Nodes are not needed."],"e":["Weight is not the reason.","They carry buds.","Without nodes, nothing grows."],"y":"Nodes carry the buds."},{"q":"Which stem should you choose for cuttings?","r":"a healthy, mature stem","w":["a diseased stem","a very young green tip","a dry dead stem"],"e":["Disease is passed on.","It is too soft and rots.","It cannot grow."],"y":"A healthy mature stem has stored food and good buds."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"b2-5-result","type":"mcq","level":2,"review":"authored","sources":["plant-reproduction"],"vars":{"X":{"pick":[{"q":"Where do the roots of a cassava cutting grow from?","r":"the nodes under the soil","w":["the cut top","the leaves","the seeds"],"e":["The top stays above the soil.","The cutting has no leaves at first.","No seeds are involved."],"y":"Roots grow from the buried nodes."},{"q":"How will the new cassava plants compare with the parent?","r":"They will be identical to it.","w":["They will all be different.","They will be smaller for ever.","They will be a different crop."],"e":["Vegetative propagation gives clones.","They grow normally.","They are cassava."],"y":"Cuttings make clones of the parent."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"b2-5-spot","type":"spot_error","level":3,"review":"authored","sources":["plant-reproduction"],"prompt":"Which step is wrong?","pool":{"right":[{"text":"Choose a healthy, mature stem.","truth":"true"},{"text":"Cut pieces with several nodes.","truth":"true"},{"text":"Plant the cuttings slanted.","truth":"true"},{"text":"Water them regularly.","truth":"true"}],"wrong":[{"text":"Plant the cuttings upside down.","truth":"false","explain":"Buds must point upwards."},{"text":"Use pieces without any nodes.","truth":"false","explain":"Without nodes no roots or shoots grow."},{"text":"Take cuttings from a diseased plant.","truth":"false","explain":"Diseases would be passed on."}]},"pick":{"right":3,"wrong":1}}]},"6":{"subject":"biology","class":"Form 2","lesson_no":6,"language":"en","prerequisites":[2,3],"skills":[{"id":"b2-6","name":"Advantages and disadvantages of vegetative propagation"}],"note":{"status":"draft","text":"Advantages:\n• The new plants are identical to the parent, so good qualities (big fruits, sweetness, resistance) are kept.\n• It is faster: plants mature and bear fruit sooner than from seeds.\n• It works for plants with no good seeds (banana, plantain, cassava).\n• The stored food helps the new plant survive bad conditions.\nDisadvantages:\n• No variation: if a disease attacks, all the plants may be destroyed.\n• Diseases of the parent are passed on (cassava mosaic in cuttings).\n• New plants grow close to the parent: overcrowding and competition.\n• Organs are bulky and heavy to store and carry, and they can rot.","checks":[]},"worked_example":{"status":"draft","vars":{"c":"cassava"},"problem":"A farmer grows all his {c} from cuttings of one plant. Give one advantage and one danger.","steps":["Advantage: all the plants keep the good qualities of the parent and grow quickly.","Danger: they are identical, so a disease such as cassava mosaic could destroy them all, and an infected parent passes it on."],"answer":"Advantage: good qualities kept; danger: no variation, diseases spread to all.","checks":[]},"teach":{"cards":[{"id":"c6-1","status":"draft","idea":"Vegetative propagation keeps the parent's good qualities and is faster than seeds.","vars":{},"example":["A grafted orange tree bears fruit sooner.","Its fruits are as sweet as the parent's."],"checks":[],"check":{"ref":"b2-6-sort"}},{"id":"c6-2","status":"draft","idea":"Its main danger is no variation: one disease can destroy every plant.","vars":{},"example":["Diseases in the parent are passed on in cuttings."],"checks":[],"check":{"ref":"b2-6-why"}},{"id":"c6-3","status":"draft","idea":"New plants grow close to the parent, so they compete for light, water and minerals.","vars":{},"example":["Suckers crowd round a banana plant."],"checks":[],"check":{"id":"b2-6-crowd-card","type":"mcq","level":1,"review":"authored","sources":["plant-reproduction"],"vars":{"X":{"pick":[{"q":"Why should a farmer separate banana suckers from the parent plant?","r":"To avoid overcrowding and competition.","w":["To make them identical.","To give them seeds.","To stop photosynthesis."],"e":["They are already identical.","Bananas do not need seeds.","Plants need photosynthesis."],"y":"Crowded plants compete for light, water and minerals."},{"q":"Why should cuttings be taken only from healthy plants?","r":"Diseases of the parent are passed on.","w":["Healthy plants have no nodes.","Diseased plants grow faster.","It does not matter."],"e":["Healthy plants have nodes.","Diseased plants do not grow better.","It matters a lot."],"y":"A sick parent gives sick offspring."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"b2-6-sort","type":"matching","level":1,"review":"authored","s te":{"status":"draft","text":"The flower is the organ of sexual reproduction of flowering plants. Its parts, from outside to inside:\n• sepals (green): protect the flower bud; together they form the calyx;\n• petals (often coloured and scented): attract insects; together they form the corolla;\n• stamens, the male parts: each has a filament holding up an anther, which makes pollen grains (male sex cells);\n• carpels (pistil), the female part: the stigma receives pollen, the style joins it to the ovary, and the ovary contains ovules (with the female sex cells).\nAll these parts sit on the receptacle, at the top of the flower stalk.\nA flower with both stamens and carpels is bisexual (hibiscus); some flowers have only one sex (maize has separate male and female flowers).","checks":[]},"worked_example":{"status":"draft","vars":{"k":4057},"problem":"In the drawing, the anther is labelled {bioLetter(k, 8, 2)}. What does it do, and which part holds it up?","steps":["The anther is the top of the stamen: it makes pollen grains, the male sex cells.","It is held up by the filament, labelled {bioLetter(k, 8, 3)}."],"answer":"It makes pollen; the filament ({bioLetter(k, 8, 3)}) holds it up.","checks":[],"figure":"flower(k)"},"teach":{"cards":[{"id":"c7-1","status":"draft","idea":"The male part of a flower is the stamen: an anther on a filament. The anther makes pollen.","vars":{"k":0},"example":["Stamen = anther + filament.","Pollen grains carry the male sex cells."],"checks":[],"figure":"flower(k)","check":{"ref":"b2-7-label"}},{"id":"c7-2","status":"draft","idea":"The female part is the carpel: stigma, style and ovary. The ovary contains the ovules.","vars":{},"example":["The stigma receives pollen.","Ovules become seeds."],"checks":[],"check":{"ref":"b2-7-job"}},{"id":"c7-3","status":"draft","idea":"Sepals protect the bud; petals attract insects.","vars":{},"example":["Sepals are usually green.","Petals are often brightly coloured and scented."],"checks":[],"check":{"id":"b2 {"text":"Pollination moves pollen to a stigma.","truth":"true"},{"text":"Insect-pollinated flowers have nectar.","truth":"true"},{"text":"Maize is wind-pollinated.","truth":"true"},{"text":"Cross-pollination gives more variation.","truth":"true"}],"wrong":[{"text":"Wind-pollinated flowers have large colourful petals.","truth":"false","explain":"They are small and dull; colourful petals attract insects."},{"text":"Pollination is the joining of sex cells.","truth":"false","explain":"That is fertilisation; pollination is the transfer of pollen."},{"text":"Wind-pollinated flowers have sticky pollen.","truth":"false","explain":"Their pollen is light and smooth."}]},"pick":{"right":3,"wrong":1}}]},"9":{"subject":"biology","class":"Form 2","lesson_no":9,"language":"en","prerequisites":[7],"skills":[{"id":"b2-9","name":"Experiment 3: dissecting a flower"}],"note":{"status":"draft","text":"Aim: to identify the parts of a flower.\nMaterials: a large flower (hibiscus or flamboyant), a sharp razor blade or scalpel, a hand lens, white paper, glue or tape.\nMethod:\n1. Count and remove the sepals, from the outside.\n2. Remove the petals, one by one.\n3. Remove the stamens and look at an anther with the hand lens; touch it to see the pollen.\n4. Cut the ovary across (or along) with the blade and look at the ovules with the hand lens.\n5. Stick each kind of part on the paper and label it; draw the flower cut in half.\nSafety: cut away from your fingers; wash your hands afterwards.\nA good biological drawing: a title, clear single lines, no shading, label lines that do not cross, and the magnification.","checks":[]},"worked_example":{"status":"draft","vars":{"k":777},"problem":"After cutting a flower in half, Ngwa sees small round bodies inside a swollen part at the base of the style. What are they?","steps":["The swollen part at the base of the style is the ovary.","The small round bodies inside it are the ovules, which become seeds after fertilisation."],"answer":"Ovules, inside t e.","truth":"true"},{"text":"Use clear single lines.","truth":"true"},{"text":"Label lines must not cross.","truth":"true"},{"text":"State the magnification.","truth":"true"}],"wrong":[{"text":"Shade the drawing heavily.","truth":"false","explain":"Do not shade a biological drawing."},{"text":"Draw label lines that cross each other.","truth":"false","explain":"Label lines must not cross."},{"text":"Use arrows with colours instead of labels.","truth":"false","explain":"Use straight label lines and words."}]},"pick":{"right":3,"wrong":1}}]},"13":{"subject":"biology","class":"Form 2","lesson_no":13,"language":"en","prerequisites":[8],"skills":[{"id":"b2-13","name":"Sexual reproduction in plants: fertilisation"}],"note":{"status":"draft","text":"Fertilisation is the joining of a male sex cell with a female sex cell.\nIn a flowering plant:\n1. After pollination, a pollen grain on the stigma grows a pollen tube.\n2. The tube grows down through the style to the ovary and enters an ovule through the micropyle.\n3. A male nucleus from the pollen tube joins (fuses) with the egg cell nucleus in the ovule: this is fertilisation. The result is a zygote.\nAfter fertilisation (the fate of the parts):\n• the zygote grows into the embryo; the ovule becomes the seed; its coverings become the seed coat (testa);\n• the ovary becomes the fruit and its wall the fruit wall (pericarp);\n• petals, stamens, stigma and style wither and fall off.","checks":[]},"worked_example":{"status":"draft","vars":{"f":"a bean flower"},"problem":"Describe what happens in {f} from the moment a pollen grain lands on the stigma until a seed forms.","steps":["The pollen grain grows a pollen tube down the style into the ovary.","The tube enters an ovule through the micropyle, and a male nucleus fuses with the egg nucleus: fertilisation, forming a zygote.","The zygote becomes the embryo, the ovule the seed, and the ovary the pod (fruit)."],"answer":"Pollen tube → fusion of male and egg nuclei → zygote → embryo inside a seed, ovary → fruit.","checks":[]},"teach":{"cards":[{"id":"c13-1","status":"draft","idea":"A pollen tube grows from the stigma down the style to an ovule.","vars":{},"example":["It enters the ovule through the micropyle."],"checks":[],"check":{"ref":"b2-13-order"}},{"id":"c13-2","status":"draft","idea":"Fertilisation is the fusion of a male nucleus with the egg nucleus, forming a zygote.","vars":{},"example":["Pollination comes first; fertilisation follows."],"checks":[],"check":{"ref":"b2-13-what"}},{"id":"c13-3","status":"draft","idea":"After fertilisation the ovule becomes a seed and the ovary a fruit.","vars":{},"example":["Zygote → embryo.","Petals and stamens wither."],"checks":[],"check":{"id":"b2-13-fate-card","type":"matching","level":1,"review":"authored","sources":["seeds"],"prompt":"What does each part become after fertilisation?","pool":[{"left":"ovule","right":"seed"},{"left":"ovary","right":"fruit"},{"left":"ovary wall","right":"fruit wall (pericarp)"},{"left":"zygote","right":"embryo"},{"left":"integuments of the ovule","right":"seed coat (testa)"},{"left":"petals and stamens","right":"wither and fall off"}],"pick":4}}]},"questions":[{"id":"b2-13-order","type":"ordering","level":1,"review":"authored","sources":["seeds"],"prompt":"Put the stages in order.","items":[{"text":"Pollen lands on the stigma"},{"text":"A pollen tube grows down the style"},{"text":"The tube enters an ovule through the micropyle"},{"text":"A male nucleus fuses with the egg nucleus"},{"text":"The ovule becomes a seed"}],"order":"as_written"},{"id":"b2-13-what","type":"mcq","level":1,"review":"authored","sources":["seeds"],"vars":{"X":{"pick":[{"q":"What is fertilisation in a flowering plant?","r":"the fusion of a male nucleus with the egg nucleus","w":["the transfer of pollen to a stigma","the spreading of seeds","the opening of the flower"],"e":["That is pollination.","That is dispersal.","That is not fertilisation."],"y":"Two sex cells join."},{"q":"What is formed when the nuclei fuse?","r":"a zygote","w":["a pollen grain","a petal","a stigma"],"e":["Pollen comes from anthers.","Petals are not formed by fusion.","The stigma was already there."],"y":"The fertilised egg is a zygote."},{"q":"Which happens first?","r":"pollination","w":["fertilisation","seed formation","fruit ripening"],"e":["Fertilisation needs pollen first.","Seeds form after fertilisation.","That comes last."],"y":"Pollen must arrive before fertilisation."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"b2-13-fate","type":"matching","level":2,"review":"authored","sources":["seeds"],"prompt":"What does each part become after fertilisation?","pool":[{"left":"ovule","right":"seed"},{"left":"ovary","right":"fruit"},{"left":"ovary wall","right":"fruit wall (pericarp)"},{"left":"zygote","right":"embryo"},{"left":"integuments of the ovule","right":"seed coat (testa)"},{"left":"petals and stamens","right":"wither and fall off"}],"pick":4},{"id":"b2-13-spot","type":"spot_error","level":3,"review":"authored","sources":["seeds"],"prompt":"Which statement is wrong?","pool":{"right":[{"text":"The pollen tube grows down the style.","truth":"true"},{"text":"The zygote becomes the embryo.","truth":"true"},{"text":"The ovary becomes the fruit.","truth":"true"},{"text":"Petals wither after fertilisation.","truth":"true"}],"wrong":[{"text":"The ovule becomes the fruit.","truth":"false","explain":"The ovule becomes the seed; the ovary becomes the fruit."},{"text":"Fertilisation happens before pollination.","truth":"false","explain":"Pollination comes first."},{"text":"The pollen tube enters the ovule through the anther.","truth":"false","explain":"It enters through the micropyle."}]},"pick":{"right":3,"wrong":1}}]},"14":{"subject":"biology","class":"Form 2","lesson_no":14,"language":"en","prerequisites":[13],"skills":[{"id":"b2-14","name":"Sexual reproduction in plants: the seed"}],"note":{"status":"draft","text":"A seed is a fertilised ovule. It contains a young plant (the embryo) and a store of food, inside a protective coat.\nStructure of a bean seed:\n• testa (seed coat): protects the seed;\n• hilum: the scar where the seed was attached to the pod;\n• micropyle: a tiny hole near the hilum that lets in water;\n• two cotyledons: seed leaves that store food;\n• embryo: the plumule (grows into the shoot) and the radicle (grows into the root).\nBean, groundnut: two cotyledons (dicotyledons). Maize: one cotyledon (monocotyledon), with food stored in the endosperm.\nImportance of seeds: they grow into new plants; they can wait (stay dormant) until conditions are good; they are food for people and animals (maize, beans, groundnuts) and give oils (palm kernel, groundnut).","checks":[]},"worked_example":{"status":"draft","vars":{"k":321},"problem":"Ayuk soaks a bean seed and opens it. Which parts form the embryo, and what does each become?","steps":["The embryo is the young plant between the cotyledons.","The plumule ({bioLetter(k, 6, 4)} in the drawing) grows into the shoot; the radicle ({bioLetter(k, 6, 5)}) grows into the root."],"answer":"The plumule (shoot) and the radicle (root).","checks":[],"figure":"beanSeed(k)"},"teach":{"cards":[{"id":"c14-1","status":"draft","idea":"A seed has a coat (testa), stored food (cotyledons) and an embryo (plumule and radicle).","vars":{"k":0},"example":["The testa protects.","The cotyledons feed the embryo."],"checks":[],"figure":"beanSeed(k)","check":{"ref":"b2-14-label"}},{"id":"c14-2","status":"draft","idea":"Each part of the seed has a job.","vars":{},"example":["Micropyle: lets in water.","Radicle: becomes the root."],"checks":[],"check":{"ref":"b2-14-job"}},{"id":"c14-3","status":"draft","idea":"Bean ha ":{"right":[{"text":"The testa protects the seed.","truth":"true"},{"text":"The radicle grows into the root.","truth":"true"},{"text":"Bean has two cotyledons.","truth":"true"},{"text":"The micropyle lets in water.","truth":"true"}],"wrong":[{"text":"The plumule grows into the root.","truth":"false","explain":"The plumule grows into the shoot; the radicle into the root."},{"text":"Maize has two cotyledons.","truth":"false","explain":"Maize has one cotyledon."},{"text":"The hilum stores food for the embryo.","truth":"false","explain":"The hilum is a scar; the cotyledons store food."}]},"pick":{"right":3,"wrong":1}}]},"15":{"subject":"biology","class":"Form 2","lesson_no":15,"language":"en","prerequisites":[14],"skills":[{"id":"b2-15","name":"Seed and fruit dispersal"}],"note":{"status":"draft","text":"Dispersal is the spreading of seeds and fruits away from the parent plant.\nWhy it matters: it prevents overcrowding and competition for light, water and minerals; it lets plants colonise new places; it lowers the spread of disease between parent and young.\nAgents of dispersal:\n• wind: light seeds, hairs, wings (kapok, Combretum, orchids);\n• water: fruits that float, with fibrous or waterproof coats (coconut, raffia);\n• animals: fleshy, tasty fruits eaten and the seeds dropped or passed out (mango, guava, pawpaw), or hooks that stick to fur and clothes (Bidens, Desmodium);\n• self (explosive): pods that dry, split and throw the seeds (beans, pea, castor).","checks":[]},"worked_example":{"status":"draft","vars":{"f":"a mango"},"problem":"How is the seed of {f} dispersed, and why is this useful?","steps":["Mango is a fleshy, sweet fruit: animals and people eat it and drop the stone far from the tree.","The new tree then grows away from the parent, without competing with it for light, water and minerals."],"answer":"By animals (and people); it avoids overcrowding and competition.","checks":[]},"teach":{"cards":[{"id":"c15-1","status":"draft","idea":"Dispersal spreads s us":"draft","text":"Aim: to compare epigeal and hypogeal germination.\nMaterials: bean seeds and maize grains soaked overnight, two pots or a box with moist soil, water, a ruler.\nMethod:\n1. Plant the bean seeds and the maize grains about 2 cm deep in moist soil, in two separate rows.\n2. Water lightly every day and keep the soil warm.\n3. After one week, then every two days, dig up one seedling of each and look where the cotyledons are.\n4. Measure the height of the shoots and draw the seedlings.\nResults: the bean's hook-shaped shoot pushes the cotyledons above the soil, where they turn green (epigeal). The maize shoot grows up straight inside a protective sheath (the coleoptile), and the grain stays under the soil (hypogeal).","checks":[]},"worked_example":{"status":"draft","vars":{"b":"bean","m":"maize"},"problem":"After ten days, where are the cotyledons of the {b} and the {m} seedlings, and what does this show?","steps":["The {b}'s cotyledons are above the soil and green: epigeal germination.","The {m} grain, with its cotyledon, is still under the soil: hypogeal germination."],"answer":"{b}: epigeal; {m}: hypogeal.","checks":[]},"teach":{"cards":[{"id":"c18-1","status":"draft","idea":"Plant soaked bean and maize seeds in moist soil and observe them every two days.","vars":{},"example":["Dig up one seedling of each to look at it."],"checks":[],"check":{"ref":"b2-18-steps"}},{"id":"c18-2","status":"draft","idea":"In bean, the cotyledons come above the soil and turn green.","vars":{},"example":["The shoot is hook-shaped as it pushes up."],"checks":[],"check":{"ref":"b2-18-bean"}},{"id":"c18-3","status":"draft","idea":"In maize, the grain stays below the soil.","vars":{},"example":["The shoot grows up inside a sheath (the coleoptile)."],"checks":[],"check":{"id":"b2-18-maize-card","type":"mcq","level":1,"review":"authored","sources":["seeds"],"vars":{"X":{"pick":[{"q":"Where is the maize grain after its shoot appears?","r":"still under the soil","w":["above the s ght":3,"wrong":1}}]},"19":{"subject":"biology","class":"Form 2","lesson_no":19,"language":"en","prerequisites":[17],"skills":[{"id":"b2-19","name":"Experiment 5: the conditions needed for germination"}],"note":{"status":"draft","text":"Aim: to show that seeds need water, oxygen and warmth to germinate.\nSet up four test tubes, each with a few soaked bean seeds:\n• A: moist cotton wool, open to the air, warm room (the control: every condition present);\n• B: dry cotton wool, warm room (no water);\n• C: seeds covered with boiled and cooled water and a layer of oil on top (no oxygen);\n• D: moist cotton wool, in a refrigerator (no warmth).\nLeave them for about a week.\nResults: only the seeds in A germinate.\nConclusion: seeds need water, oxygen and a suitable temperature. Each tube lacks one condition: comparing it with A shows that condition is needed.","checks":[]},"worked_example":{"status":"draft","vars":{"t":"C"},"problem":"Why is the water in tube {t} boiled, and why is oil poured on top?","steps":["Boiling drives the dissolved air (oxygen) out of the water.","The layer of oil stops air from dissolving back in.","So tube {t} has water and warmth but no oxygen."],"answer":"To remove oxygen and keep it out, so the tube tests whether oxygen is needed.","checks":[]},"teach":{"cards":[{"id":"c19-1","status":"draft","idea":"Each test tube lacks one condition; tube A has all of them and is the control.","vars":{},"example":["B: no water. C: no oxygen. D: too cold."],"checks":[],"check":{"ref":"b2-19-tube"}},{"id":"c19-2","status":"draft","idea":"Only the seeds with water, oxygen and warmth germinate.","vars":{},"example":["Only tube A germinates."],"checks":[],"check":{"ref":"b2-19-result"}},{"id":"c19-3","status":"draft","idea":"The control shows that the seeds could germinate when nothing is missing.","vars":{},"example":["Without a control, we could not tell whether the seeds were dead."],"checks":[],"check":{"id":"b2-19-control-card","type":"mcq","level":1,"review //      lessons: {"maths:3": {done, at, rows, review, paper?}}, current: {maths?: {lesson, flow, rows, paper?}, english?: …} }
// v1 (Maths only, 2026-10-05) had lessons keyed by number and one current lesson; it is upgraded in place.
const KEY = "psalmspreps-maths-v1";  // kept so existing progress survives the upgrade
const fresh = () => ({ v: 2, readiness: null, subject: "maths", lessons: {}, current: {} });
/** A saved lesson in progress is kept only if its flow is usable; a damaged one is dropped, never a blank page. */
const usable = (c) => c && c.flow && Array.isArray(c.flow.steps) && Array.isArray(c.rows) && Number.isInteger(c.lesson);
const cleanCurrent = (cur) => Object.fromEntries(Object.entries(cur || {}).filter(([, c]) => usable(c)));
function upgrade(s) {
  if (s.v === 2) return { ...fresh(), ...s, current: cleanCurrent(s.current) };
  if (s.v !== 1) return fresh();
  const lessons = Object.fromEntries(Object.entries(s.lessons || {}).map(([n, x]) => [`maths:${n}`, x]));
  return { ...fresh(), readiness: s.readiness || null, lessons, current: cleanCurrent({ maths: s.current }) };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    return s ? upgrade(s) : fresh();
  } catch { return fresh(); }  // private mode, blocked storage or a broken value: start fresh
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* still works, just forgets */ } };
const state = load();
const newSeed = () => Math.floor(Math.random() * 1e6);  // a new set of numbers each time a lesson starts
const lessonKey = (subject, n) => `${subject}:${n}`;

const app = document.getElementById("app");
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k.startsWith("on") ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};
/** Replaces the page. The wrapper is new each time, so its entrance animation replays (off under reduced motion). */
const screen = (...kids) => {
  app.replaceChildren(el("div", { class: "screen" }, ...kids.flat().filter((k) => k != null)));
  window.scrollTo(0, 0);
};
/** Replaces a node's children, skipping empty slots (a placed tile leaves null behind; it must not show as "null"). */
const fill = (node, kids) => node.replaceChildren(...kids.filter((k) => k != null));
const button = (label, onclick, cls = "") => el("button", { type: "button", class: cls, onclick }, label);
const para = (t, cls = "") => el("p", { class: cls }, t);
const lines = (text) => text.split("\n").map((l) => (l.trim() ? para(l) : null));
const header = (kicker, title) => el("header", {}, el("div", { class: "kicker" }, kicker), el("h1", {}, title));
/** Progress bar: a filled segment plus "2 / 13". */
const progress = (cur, total) => el("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(cur) },
  el("div", { class: "track" }, el("div", { class: "fill", style: `width:${Math.round((100 * cur) / total)}%` })),
  el("span", { class: "count" }, `${cur} / ${total}`));
/** A drawing made by the engine from the question's own numbers (an SVG string from our library, never from input). */
const figureBox = (svg) => {
  if (!svg) return null;
  const box = el("div", { class: "figure" });
  box.innerHTML = svg;
  return box;
};
const checkIcon = () => {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("class", "tick"); svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", "M5 12.5l4.5 4.5L19 7.5");
  svg.append(path);
  return svg;
};

/** A label for the pupil: in French inside a French lesson, otherwise English. {x} are filled from v. */
const T = (text, v = {}) => ((S === "french" && FR[text]) || text).replace(/\{(\w)\}/g, (_, k) => v[k]);

// ---------------------------------------------------------------- one question, any type
/** A typed answer box (numbers or words): Enter or "Check" submits; the engine picks the keyboard. */
function answerBox(q, finish, inline = false) {
  const input = el("input", { type: "text", inputmode: inputModeFor(q), autocomplete: "off", autocorrect: "off", autocapitalize: "off",
    spellcheck: "false", "aria-label": T("Your answer"), class: inline ? "blank-input" : "" });
  const go = () => { const v = normaliseInput(input.value, q); if (v) finish(v); };
  input.addEventListener("keydown", (e) => e.key === "Enter" && go());
  setTimeout(() => input.focus(), 50);
  return { input, check: button(T("Check"), go, "primary") };
}

/** Cloze: the sentence with its blank inline. Typed: a box in the gap. Choose: a dotted gap, options below. */
function clozeSentence(q, box = null) {
  const [before, after] = q.sentence.split("___");
  return el("div", { class: "sentence" }, before, box || el("span", { class: "blank", "aria-label": "blank" }, " "), after);
}

/** Word order: tap a word to place it; tap a placed word to send it back. The final . ? or ! is fixed. */
function wordOrder(q, finish) {
  const placed = [];
  const line = el("div", { class: "built", "aria-live": "polite" });
  const pool = el("div", { class: "tiles" });
  const done = button(T("Check"), () => placed.length === q.items.length && finish([...placed]), "primary");
  const redraw = () => {
    line.replaceChildren(...(placed.length
      ? [...placed.map((i, k) => button(q.items[i], () => { placed.splice(k, 1); redraw(); }, "tile placed")), ...(q.end ? [el("span", { class: "end" }, q.end)] : [])]
      : [el("span", { class: "muted" }, T("Tap the words below."))]));
    fill(pool, q.items.map((t, i) => (placed.includes(i) ? null : button(t, () => { placed.push(i); redraw(); }, "tile"))));
    done.disabled = placed.length !== q.items.length;
  };
  redraw();
  return [para(T("Tap a word to add it. Tap a word in your sentence to take it out."), "muted"), line, pool, done];
}

/** Matching: tap a left item, then a right item, to pair them; tap a pair to undo it. */
function matching(q, finish) {
  const pairOf = q.left.map(() => null);  // left index → right index
  let picked = null;
  const done = button(T("Check"), () => pairOf.every((r) => r !== null) && finish([...pairOf]), "primary");
  const wrap = el("div", {});
  const redraw = () => {
    const rightUsed = new Map(pairOf.map((r, l) => [r, l]).filter(([r]) => r !== null));
    const badge = (n) => el("span", { class: "badge", "aria-hidden": "true" }, String(n + 1));
    const lefts = q.left.map((t, i) => {
      const paired = pairOf[i] !== null;
      return button([paired ? badge(i) : null, t], () => {
        if (paired) pairOf[i] = null; else picked = picked === i ? null : i;
        redraw();
      }, `match${paired ? " paired" : ""}${picked === i ? " picked" : ""}`);
    });
    const rights = q.right.map((t, r) => {
      const l = rightUsed.get(r);
      return button([l !== undefined ? badge(l) : null, t], () => {
        if (l !== undefined) pairOf[l] = null;
        else if (picked !== null) { pairOf[picked] = r; picked = null; }
        redraw();
      }, `match${l !== undefined ? " paired" : ""}${picked !== null && l === undefined ? " ready" : ""}`);
    });
    wrap.replaceChildren(el("div", { class: "match-cols" }, el("div", { class: "col" }, ...lefts), el("div", { class: "col" }, ...rights)));
    done.disabled = pairOf.some((r) => r === null);
  };
  redraw();
  return [para(T("Tap an item on the left, then its partner on the right. Tap a pair to undo it."), "muted"), wrap, done];
}

/** Sorting (matching with groups): tap a word, then tap its group; tap a word inside a group to take it out. */
function sorting(q, finish) {
  const groupOf = q.left.map(() => null);
  let picked = null;
  const done = button(T("Check"), () => groupOf.every((g) => g !== null) && finish([...groupOf]), "primary");
  const wrap = el("div", {});
  const redraw = () => {
    const loose = q.left.map((t, i) => (groupOf[i] === null ? button(t, () => { picked = picked === i ? null : i; redraw(); }, `tile${picked === i ? " picked" : ""}`) : null));
    const groups = q.right.map((g, gi) => el("div", { class: `group${picked !== null ? " ready" : ""}`, role: "button", tabindex: "0",
      onclick: (e) => { if (e.target.closest(".tile") || picked === null) return; groupOf[picked] = gi; picked = null; redraw(); },
      onkeydown: (e) => { if ((e.key === "Enter" || e.key === " ") && picked !== null) { e.preventDefault(); groupOf[picked] = gi; picked = null; redraw(); } } },
      el("div", { class: "group-name" }, g),
      el("div", { class: "tiles" }, ...q.left.map((t, i) => (groupOf[i] === gi ? button(t, () => { groupOf[i] = null; redraw(); }, "tile placed") : null)))));
    wrap.replaceChildren(el("div", { class: "tiles" }, ...loose), ...groups);
    done.disabled = groupOf.some((g) => g === null);
  };
  redraw();
  return [para(T("Tap a word, then tap its group. Tap a word in a group to take it out."), "muted"), wrap, done];
}

/** Shows q; calls onAnswer({result, ms}) when the pupil answers or presses "I don't know". */
function askQuestion(q, { kicker, title, onAnswer, bar = null, back = null }) {
  const t0 = performance.now();
  const finish = (response) => onAnswer({ result: check(q, response), ms: Math.round(performance.now() - t0) });
  const body = [bar, header(kicker, title), el("div", { class: "prompt" }, q.prompt), figureBox(q.figure)];
  if (q.type === "numeric") {
    const { input, check: go } = answerBox(q, finish);
    body.push(el("div", { class: "answer" }, input, q.unit ? el("span", { class: "unit" }, q.unit) : null), go);
  } else if (q.type === "cloze" && q.mode === "type") {
    const { input, check: go } = answerBox(q, finish, true);
    body.push(clozeSentence(q, input), go);
  } else if (q.type === "cloze") {
    body.push(clozeSentence(q), el("div", { class: "options" }, q.options.map((o, i) => button(o.text, () => finish(i), "option"))));
  } else if (q.type === "mcq" || q.type === "spot_error") {
    if (q.type === "spot_error") body.push(para(T("Tap the one that is wrong."), "muted"));
    body.push(el("div", { class: "options" }, q.options.map((o, i) => button(o.text, () => finish(i), "option"))));
  } else if (q.type === "ordering") {
    const chosen = [];
    const list = el("ol", { class: "chosen" });
    const pool = el("div", { class: "options" });
    const redraw = () => {
      list.replaceChildren(...chosen.map((i) => el("li", {}, q.items[i])));
      fill(pool, q.items.map((t, i) => (chosen.includes(i) ? null : button(t, () => { chosen.push(i); redraw(); }, "option"))));
      if (chosen.length === q.items.length) finish([...chosen]);
    };
    body.push(para(T("Tap them in order."), "muted"), list, pool, button(T("Start again"), () => { chosen.length = 0; redraw(); }, "link"));
    redraw();
  } else if (q.type === "word_order") {
    body.push(...wordOrder(q, finish));
  } else if (q.type === "matching") {
    body.push(...(q.groups ? sorting(q, finish) : matching(q, finish)));
  }
  body.push(button(T("I don't know"), () => finish(DONT_KNOW), "idk"), back);
  screen(...body);
}

const recordOf = (q, r, ms, phase) => ({
  phase, id: q.id, level: q.level, result: r.correct ? "right" : r.dontKnow ? "idk" : "wrong",
  seconds: Math.round(ms / 100) / 10, misconception: r.misconception?.id || "",
});
const toMenu = () => button(T("Back to the lessons"), menu, "link");

// ---------------------------------------------------------------- 1. first visit: readiness check (Primary 6 maths)
function start() {
  withSubject("maths", () => screen(
    header("Form One", "Before we start"),
    ...lines(L0().note.text),
    para("Nothing you type leaves this phone. There is no name to enter.", "muted"),
    button("Start the check", () => readinessQ(readiness.buildReadiness(L0(), newSeed(), libs.maths), 0, []), "primary"),
    toMenu(),
  ));
}

// No feedback during the check, and no score at the end (TR-C19, approved 2026-10-03):
// the pupil sees a neutral "Let's start"; scores and weak areas appear only in "Copy results".
function readinessQ(qs, i, rows) {
  if (i >= qs.length) return readinessDone(rows);
  askQuestion(qs[i], {
    bar: progress(i + 1, qs.length), kicker: "Getting ready", title: "Primary School maths",
    onAnswer: ({ result, ms }) => {
      rows.push({ ...recordOf(qs[i], result, ms, "readiness"), template: qs[i].id, correct: result.correct });
      readinessQ(qs, i + 1, rows);
    },
  });
}

function readinessDone(rows) {
  state.readiness = { score: readiness.scoreReadiness(L0(), rows), rows, at: new Date().toISOString() };
  save();
  screen(
    header("Thank you", "Let's start"),
    para("Now we begin Form One, one small idea at a time."),
    button("See the Maths lessons", () => { state.subject = "maths"; save(); menu(); }, "primary"),
  );
}

// ---------------------------------------------------------------- 2. home, subjects, streaks, stars and badges
// Design of 2026-10-17 (Dion: "colourful and interactive, with streaks"): a home screen with the streak, stars and
// one coloured tile per subject; each subject shows its lessons as a path. Streaks are forgiving (ghost towns, power
// cuts, no data): up to two days off in a row never break a streak.
const subj = () => state.subject in SUBJECTS ? state.subject : Object.keys(SUBJECTS)[0];
// Classes (Form 2, 2026-10-17): Form One stays the default; a pupil picks a class on the home screen. A Form 2
// subject's id starts with "f2-" and keeps its own progress ("f2-maths:5").
const classOf = (s) => CLASS_OF[s] || "form-1";
const classesHere = () => [...new Set(Object.keys(SUBJECTS).map(classOf))];
const form = () => (classesHere().includes(state.form) ? state.form : classesHere()[0]);
const inClass = (c) => Object.keys(SUBJECTS).filter((s) => classOf(s) === c);
/** "Maths" for Form One (as before), "Form Two Maths" for another class. */
const subjectName = (s) => (classOf(s) === "form-1" ? SUBJECTS[s] : `${CLASSES[classOf(s)]} ${SUBJECTS[s]}`);
const nextLesson = (s) => LESSONS[s].find((n) => !state.lessons[lessonKey(s, n)]?.done);
const inProgress = (s) => { const c = state.current[s]; return c && !teach.isDone(c.flow) ? c : null; };

// Each subject's colour (dark enough for white text: contrast 4.5:1 or more) and icon.
const STYLE = {
  maths: ["#1d4ed8", "🔢"], english: ["#6d28d9", "📖"], physics: ["#b45309", "⚡"], chemistry: ["#0f766e", "🧪"], geography: ["#2e7d32", "🌍"],
  "home-economics": ["#b42318", "🍲"], history: ["#7c4a1e", "🏛️"], biology: ["#3f7d20", "🌱"], "computer-science": ["#334e9c", "💻"], french: ["#ad1457", "💬"],
};
const styleOf = (s) => STYLE[s] || STYLE[s.replace(/^f2-/, "")];  // a Form 2 subject looks like its Form One subject
const colourOf = (s) => (styleOf(s) || ["#1f6f4a"])[0];
const iconOf = (s) => (styleOf(s) || ["", "📘"])[1];
const tinted = (s, ...kids) => { const e = el(...kids); e.style.setProperty("--subj", colourOf(s)); return e; };

// Lesson content is loaded one subject at a time in the installed app (subjects/<id>.js); the single-file copy has
// everything already. withSubject() shows the screen as soon as the subject is ready.
const loading = {};
function loadSubject(s) {
  if (CONTENT[s]) return Promise.resolve();
  if (!loading[s]) loading[s] = new Promise((ok, fail) => {
    const tag = document.createElement("script");
    tag.src = `subjects/${s}.js?v=${BUILD}`;
    tag.onload = () => (CONTENT[s] ? ok() : fail(new Error("empty")));
    tag.onerror = () => { delete loading[s]; tag.remove(); fail(new Error("offline")); };
    document.head.append(tag);
  });
  return loading[s];
}
function withSubject(s, show) {
  if (CONTENT[s]) return show();
  screen(header(`${iconOf(s)} ${subjectName(s)}`, "Getting the lessons ready…"), para("This takes a moment the first time.", "muted"));
  loadSubject(s).then(show, () => screen(header(`${iconOf(s)} ${subjectName(s)}`, "No connection"),
    para("These lessons are not saved on this phone yet. Connect to the internet once, then they will work offline.", "muted"),
    button("Try again", () => withSubject(s, show), "primary"), button("Back to all subjects", home, "link")));
}
const loadAll = (list) => Promise.all(list.map(loadSubject));

// ---- days, streak, stars, badges (all on this phone only)
const dayOf = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayNum = (s) => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 86400000);
/** Marks today as a learning day (called on every answer in a lesson). */
function recordDay() {
  state.days = state.days || [];
  const t = dayOf();
  if (state.days[state.days.length - 1] !== t) state.days.push(t);
}
/** Learning days in the current run; a run survives up to two days off in a row. 0 if the last learning day was too long ago. */
function streak() {
  const days = [...new Set(state.days || [])].map(dayNum).sort((a, b) => a - b);
  if (!days.length || dayNum(dayOf()) - days[days.length - 1] > 3) return 0;
  let n = 1;
  for (let i = days.length - 1; i > 0 && days[i] - days[i - 1] <= 3; i--) n++;
  return n;
}
/** Stars for a finished lesson: 3 if at least 80% of first tries were right, 2 if at least half, otherwise 1. */
function starsOf(r) {
  if (!r?.done) return 0;
  if (r.stars) return r.stars;
  const first = r.rows.filter((x) => x.phase === "practice" && x.attempt === 1);
  const asked = first.length || r.rows.filter((x) => x.attempt === 1).length;
  if (!asked) return 3;
  const right = (first.length ? first : r.rows.filter((x) => x.attempt === 1)).filter((x) => x.result === "right").length / asked;
  return right >= 0.8 ? 3 : right >= 0.5 ? 2 : 1;
}
const doneIn = (s) => LESSONS[s].filter((n) => state.lessons[lessonKey(s, n)]?.done);
const totalDone = () => Object.keys(SUBJECTS).reduce((t, s) => t + doneIn(s).length, 0);
const totalStars = () => Object.keys(SUBJECTS).reduce((t, s) => t + doneIn(s).reduce((u, n) => u + starsOf(state.lessons[lessonKey(s, n)]), 0), 0);
const starText = (k) => "★".repeat(k) + "☆".repeat(3 - k);
const BADGES = [
  ["first", "🎉", "First lesson", "Finish one lesson", () => totalDone() >= 1],
  ["five", "📚", "Bookworm", "Finish 5 lessons", () => totalDone() >= 5],
  ["ten", "🏅", "Ten lessons", "Finish 10 lessons", () => totalDone() >= 10],
  ["twentyfive", "🏆", "Champion", "Finish 25 lessons", () => totalDone() >= 25],
  ["fifty", "👑", "Fifty!", "Finish 50 lessons", () => totalDone() >= 50],
  ["streak3", "🔥", "On fire", "A 3-day streak", () => streak() >= 3],
  ["streak7", "🌟", "One week", "A 7-day streak", () => streak() >= 7],
  ["streak14", "💪", "Two weeks", "A 14-day streak", () => streak() >= 14],
  ["stars30", "⭐", "Star collector", "Collect 30 stars", () => totalStars() >= 30],
  ["stars100", "🌠", "Star shower", "Collect 100 stars", () => totalStars() >= 100],
  ["explorer", "🌈", "Explorer", "Finish a lesson in every subject of your class", () => inClass(form()).every((s) => doneIn(s).length)],
  ...Object.keys(SUBJECTS).map((s) => [`all-${s}`, iconOf(s), `All of ${subjectName(s)}`, `Finish every ${subjectName(s)} lesson`, () => doneIn(s).length === LESSONS[s].length]),
];
/** Badges earned now that were not earned before; they are kept for ever once earned. */
function newBadges() {
  state.badges = state.badges || {};
  const fresh = BADGES.filter(([id, , , , ok]) => !state.badges[id] && ok());
  for (const [id] of fresh) state.badges[id] = dayOf();
  if (fresh.length) save();
  return fresh;

// ---------------------------------------------------------------- 3. teach mode
let S = "maths";                            // the subject of the lesson on screen
const C = () => state.current[S];
const L = () => CONTENT[S][C().lesson];
const N = () => C().lesson;
const LIB = () => libs[S];

/** Opens lesson n: carries on a saved, unfinished flow, otherwise starts it fresh. */
function openLesson(s, n) {
  withSubject(s, () => {
    S = s;
    document.documentElement.lang = s === "french" ? "fr" : "en";  // screen readers read French lessons in French
    const cur = state.current[s];
    if (cur?.lesson === n && !teach.isDone(cur.flow)) { cur.at = new Date().toISOString(); return lesson(resumable(cur.flow)); }
    state.current[s] = { lesson: n, flow: teach.startTeach(CONTENT[s][n], newSeed()), rows: [], at: new Date().toISOString() };
    save();
    lesson(state.current[s].flow);
  });
}
/** A flow saved mid-feedback resumes on a question: "retry" → the fresh variant, "reveal" → the next step. */
const resumable = (flow) => (flow.phase === "retry" || flow.phase === "reveal" ? teach.nextPhase(flow) : flow);

const workedBlock = () => {
  const w = renderWorked(L().worked_example, LIB());
  return el("div", { class: "example" }, el("div", { class: "kicker" }, T("Worked example")), el("div", { class: "strong pre" }, w.problem),
    figureBox(w.figure), el("ol", {}, w.steps.map((s) => el("li", {}, s))), para(T("Answer: {a}", { a: w.answer }), "strong"));
};
const cardExample = (c) => el("div", { class: "example" }, el("div", { class: "kicker" }, T("Example")), ...c.example.map((t) => para(t)), figureBox(c.figure));
const hintBlock = (q) => (q.hint ? el("div", { class: "hint" }, el("strong", {}, T("Hint: ")), q.hint) : null);

/** Every screen of a lesson goes through here, so the flow is saved at each step. */
function lesson(flow, previous = null) {
  C().flow = flow;
  save();
  if (teach.isDone(flow)) return results(flow);
  const Ln = L(), n = N();
  const step = flow.steps[flow.step];
  const nCards = Ln.teach.cards.length;
  const nPractice = flow.steps.filter((s) => s.kind === "practice").length;
  const practiceNo = flow.steps.slice(0, flow.step + 1).filter((s) => s.kind === "practice").length;
  const kicker = step.kind === "card" ? T("Lesson {n} · Idea {a} of {b}", { n, a: step.card + 1, b: nCards }) : T("Lesson {n} · Practice {a} of {b}", { n, a: practiceNo, b: nPractice });
  const go = (next, prev = null) => () => lesson(next, prev);
  const bar = progress(flow.step + 1, flow.steps.length);

  if (step.kind === "card" && flow.phase === "idea") {
    const c = teach.renderCard(Ln.teach.cards[step.card], LIB());
    return screen(bar, header(kicker, TITLES[S][n]), el("div", { class: "idea" }, c.idea), cardExample(c),
      button(T("I'm ready for a question"), go(teach.nextPhase(flow)), "primary"), toMenu());
  }
  if (step.kind === "card" || step.kind === "practice") {
    const q = teach.itemQuestion(Ln, flow, LIB(), previous);
    return askQuestion(q, {
      bar, kicker, back: toMenu(), title: flow.attempt ? T("A new question") : step.kind === "card" ? T("Quick check") : T("Level {a}", { a: q.level }),
      onAnswer: ({ result, ms }) => {
        C().rows.push({ ...recordOf(q, result, ms, step.kind), card: step.kind === "card" ? Ln.teach.cards[step.card].id : "", attempt: flow.attempt + 1 });
        recordDay();
        const next = teach.answerItem(flow, result, ms);
        C().flow = next;
        save();
        if (next.phase === "reveal") return reveal(q, next, kicker, bar, result);
        if (next.phase === "retry") return retry(q, result, next, kicker, bar);
        // Teach mode only: green flash + check icon (readiness shows no right/wrong cues).
        return screen(bar, el("div", { class: "fb good flash", role: "status" }, checkIcon(), el("strong", {}, T("Correct!"))), button(T("Next"), go(next), "primary"));
      },
    });
  }
  if (step.kind === "worked_example") {
    return screen(bar, header(T("Lesson {n} · Worked example", { n }), T("Follow each step")), workedBlock(),
      button(T(Ln.paper_task ? "Now write" : "Now practise"), go(teach.nextPhase(flow)), "primary"), toMenu());
  }
  if (step.kind === "paper") return paperTask(flow, bar);
  if (step.kind === "note") {
    return screen(bar, header(T("Lesson {n} · Summary", { n }), TITLES[S][n]), el("div", { class: "note" }, ...lines(Ln.note.text)),
      button(T("Finish"), go(teach.nextPhase(flow)), "primary"));
  }
}

/**
 * Writing lessons: the task → the pupil writes in the exercise book → "I've written it" → model answer and a
 * self-check list. The ticks are kept for the parent summary only; the app does not mark the writing (TR-E25).
 */
function paperTask(flow, bar) {
  const p = teach.renderPaper(L(), LIB()), n = N();
  const ticks = C().paper?.ticks || p.checklist.map(() => false);
  const write = () => screen(bar, header(`Lesson ${n} · Your turn to write`, "Write in your exercise book"),
    el("div", { class: "idea pre" }, p.prompt),
    para("Take your time. When you have finished writing, tap the button.", "muted"),
    button("I've written it", () => { C().paper = { written: true, ticks }; save(); review(); }, "primary"), toMenu());
  const review = () => {
    const boxes = p.checklist.map((item, i) => {
      const box = el("input", { type: "checkbox", id: `tick${i}` });
      box.checked = !!ticks[i];
      box.addEventListener("change", () => { ticks[i] = box.checked; C().paper = { written: true, ticks }; save(); });
      return el("label", { class: "tickrow", for: `tick${i}` }, box, el("span", {}, item));
    });
    screen(bar, header(`Lesson ${n} · Check your writing`, "Compare with this example"),
      el("div", { class: "example" }, el("div", { class: "kicker" }, "An example answer"), ...p.model.map((m) => para(m))),
      para("Look at your own writing. Tick each thing you did.", "strong"),
      el("div", { class: "ticks" }, boxes),
      para("There is no score for writing. A grown-up can look at your exercise book.", "muted"),
      button("Done", () => lesson(teach.nextPhase(flow)), "primary"));
  };
  return C().paper?.written ? review() : write();
}

/** First miss: feedback without the answer, then a fresh variant. */
function retry(q, result, flow, kicker, bar) {
  const step = flow.steps[flow.step];
  const wrongPairs = result.wrongPairs?.length
    ? para(T(result.wrongPairs.length === 1 ? "This one is not right yet: {a}." : "These are not right yet: {a}.", { a: result.wrongPairs.map((i) => q.left[i]).join(", ") })) : null;
  const box = result.dontKnow
    // "I don't know": no misconception feedback, only the hint and the worked example (spec §4)
    ? el("div", { class: "fb soft", role: "status" }, el("strong", {}, T("That's fine. Let's look at it together.")))
    : el("div", { class: "fb bad shake", role: "status" }, el("strong", {}, T("✗ Not quite")),
      result.misconception?.explain ? para(result.misconception.explain) : wrongPairs || para(T("Look at the example again, then try a new question.")));
  const help = step.kind === "card"
    ? [result.dontKnow ? hintBlock(q) : null, cardExample(teach.renderCard(L().teach.cards[step.card], LIB()))]
    : result.dontKnow ? [hintBlock(q), workedBlock()] : [];
  screen(bar, header(kicker, T("Let's try again")), box, ...help, button(T("Try a new question"), () => lesson(teach.nextPhase(flow), q), "primary"));
}

/** Second miss: the correct answer with full working, then move on (marked "needs review"). */
function reveal(q, flow, kicker, bar, result) {
  const shown = q.type === "matching" ? T("Here are the right answers.") : T("The answer is: {a}", { a: `${q.answer}${q.unit ? " " + q.unit : ""}` });
  screen(bar, header(kicker, T("Here is how to do it")),
    el("div", { class: result.dontKnow ? "fb soft" : "fb bad shake", role: "status" }, el("strong", {}, shown)),
    el("div", { class: "example" }, el("div", { class: "kicker" }, T("Full working")), el("ol", {}, q.solution.map((s) => el("li", {}, s)))),
    para(T("We will come back to this one later."), "muted"),
    button(T("Continue"), () => lesson(teach.nextPhase(flow)), "primary"));
}

// ---------------------------------------------------------------- 4. results + copy
/** A simple CSS confetti burst: each piece gets a direction, spin, colour and delay. Hidden under reduced motion. */
function confetti() {
  const colours = ["#1f6f4a", "#e0a526", "#2f6fd6", "#d0473b", "#7c4dbd", "#2aa198"];
  const box = el("div", { class: "confetti", "aria-hidden": "true" });
  for (let i = 0; i < 28; i++) {
    const angle = (Math.PI * 2 * i) / 28 + Math.random() * 0.3, dist = 90 + Math.random() * 90;
    box.append(el("i", { style: `--x:${Math.round(Math.cos(angle) * dist)}px;--y:${Math.round(Math.sin(angle) * dist - 40)}px;` +
      `--r:${Math.round(Math.random() * 540 - 270)}deg;--c:${colours[i % colours.length]};--d:${Math.round(Math.random() * 120)}ms` }));
  }
  return box;
}

const count = (rows, k) => rows.filter((r) => r.result === k).length;
const row = (x) => `${x.phase}\t${x.card ? x.card + "#" + x.attempt : x.attempt ? "#" + x.attempt : ""}\t${x.id}\tL${x.level}\t${x.result}\t${x.seconds}s\t${x.misconception}`;
const TABLE_HEAD = "phase\tcard#try\ttemplate\tlevel\tresult\ttime\tmisconception";

function readinessText() {
  const r = state.readiness?.score;
  return [`Readiness (not shown to the pupil): ${r ? `${r.right}/${r.asked} (${r.percent}%) · ${state.readiness.at.slice(0, 10)}` : "not done"}`,
    ...(r ? Object.values(r.areas).map((a) => `  ${a.name}: ${a.right}/${a.asked}${a.weak ? " · WEAK" : ""}`) : [])];
}
function lessonText(s, n, r) {
  const cards = r.rows.filter((x) => x.phase === "card"), practice = r.rows.filter((x) => x.phase === "practice");
  const secs = r.rows.reduce((t, x) => t + x.seconds, 0);
  const out = [`${subjectName(s)} Lesson ${n} (${TITLES[s][n]}) · ${r.at.slice(0, 16).replace("T", " ")} · ${Math.round(secs)}s · "I don't know" ${count(r.rows, "idk")}`,
    `  cards: ${count(cards, "right")} right, ${count(cards, "wrong")} wrong, ${count(cards, "idk")} IDK · practice: ${count(practice, "right")} right, ${count(practice, "wrong")} wrong, ${count(practice, "idk")} IDK`,
    `  needs review (missed twice): ${r.review.join(", ") || "none"}`];
  if (r.paper) {
    const items = teach.renderPaper(CONTENT[s][n], libs[s]).checklist;
    out.push(`  paper task (not marked; self-check by the pupil): ${r.paper.ticks.filter(Boolean).length} of ${items.length} ticked`,
      ...items.map((t, i) => `    ${r.paper.ticks[i] ? "[x]" : "[ ]"} ${t}`));
  }
  return out;
}
const stamp = () => `Form One prototype ${BUILD} · ${new Date().toISOString().slice(0, 16).replace("T", " ")}`;

function lessonResultsText(s, n) {
  const r = state.lessons[lessonKey(s, n)];
  return [stamp(), ...readinessText(), ...lessonText(s, n, r), "", TABLE_HEAD, ...r.rows.map(row)].join("\n");
}
function allResultsText() {
  const out = [stamp(), ...readinessText()];
  const tables = [...(state.readiness?.rows || []).map(row)];
  for (const s of Object.keys(SUBJECTS)) {
    const done = LESSONS[s].filter((n) => state.lessons[lessonKey(s, n)]?.done);
    out.push(`${subjectName(s)}: lessons done ${done.length} of ${LESSONS[s].length}`, ...done.flatMap((n) => lessonText(s, n, state.lessons[lessonKey(s, n)])));
    tables.push(...done.flatMap((n) => state.lessons[lessonKey(s, n)].rows.map(row)));
  }
  return [...out, "", TABLE_HEAD, ...tables].join("\n");
}

async function copyText(text, status, details = null, area = null) {
  try { await navigator.clipboard.writeText(text); status.textContent = "Copied. Paste it into WhatsApp or a message."; }
  catch {
    if (details && area) { details.open = true; area.select(); document.execCommand("copy"); status.textContent = "Copied (or select the text below and copy it)."; }
    else status.textContent = "Could not copy on this phone.";
  }
}

function results(flow) {

  record.stars = starsOf(record);
  state.lessons[lessonKey(s, n)] = record;
  delete state.current[s];
  save();
  const text = lessonResultsText(s, n);

    st ? para(T("🔥 {a}-day streak", { a: st }), "done-streak") : null),
    badges.map(([, icon, name]) => el("div", { class: "new-badge" }, el("span", { "aria-hidden": "true" }, icon), el("strong", {}, T("New badge: {a}", { a: name })))),
    next ? button(T("Next: Lesson {a}", { a: next }), () => openLesson(s, next), "primary") : para(T("You have done every {a} lesson. Well done!", { a: subjectName(s) }), "strong"),
    button(T("Back to the lessons"), menu, next ? "" : "primary"),
    button(T("All subjects"), home, "link"),
    para("For a grown-up: these results stay on this phone until you copy them.", "muted"),
    button("Copy results", () => copyText(text, status, details, area), ""), status, details);

// Start-up is at the end of review.js (pupils: the lesson menu; teachers with ?review: the review list).

// Teacher review mode (2026-10-17): open the app with ?review in the link. A teacher sees every lesson with its answers
// shown, marks each part ✓ OK or ✗ Problem with an optional comment, then sends the review as one message
// (WhatsApp or any app, through the phone's share sheet, or copied). Marks are kept on this phone only; nothing is sent
// unless the teacher sends it. Pupils never see this mode. Every mark carries the item's id, so fixes are exact.
/* global ENGINE, CONTENT, TITLES, LESSONS, SUBJECTS, BUILD, MODE, subjectName */

const REVIEW_KEY = "psalmspreps-review-v1";
const loadReview = () => {
  try { return { name: "", marks: {}, ...JSON.parse(localStorage.getItem(REVIEW_KEY)) }; } catch { return { name: "", marks: {} }; }
};
const review = loadReview();
const saveReview = () => { try { localStorage.setItem(REVIEW_KEY, JSON.stringify(review)); } catch { /* still works, just forgets */ } };
const markKey = (s, n, id) => `${s}:${n}:${id}`;
let RS = Object.keys(SUBJECTS)[0];  // subject shown in review mode

/** Every reviewable part of a lesson, in teaching order: note, cards (with their check), worked example, practice. */
function reviewItems(s, n) {
  const l = CONTENT[s][n];
  const items = [{ id: "note", kind: "Note (summary)" }];
  for (const c of l.teach.cards) items.push({ id: c.id, kind: "Teach card", card: c });
  items.push({ id: "worked", kind: "Worked example" });
  if (l.paper_task) items.push({ id: "paper", kind: "Writing task" });
  for (const t of l.questions || []) items.push({ id: t.id, kind: `Practice · level ${t.level}`, tpl: t });
  return items;
}
const lessonCounts = (s, n) => {
  const items = reviewItems(s, n), marks = items.map((it) => review.marks[markKey(s, n, it.id)]).filter(Boolean);
  return { total: items.length, done: marks.length, problems: marks.filter((m) => !m.ok).length };
};

/** One generated question with its answer and working shown. */
function shownQuestion(q, tpl) {
  const out = [el("div", { class: "prompt pre" }, q.prompt || ""), figureBox(q.figure)];
  if (q.sentence) out.push(el("div", { class: "sentence" }, q.sentence));
  if (q.options) {
    out.push(el("ul", { class: "rv-options" }, q.options.map((o, i) => el("li", { class: i === q.correctIndex ? "rv-right" : "" },
      `${i === q.correctIndex ? (q.type === "spot_error" ? "✗ (the wrong one) " : "✓ ") : "• "}${o.text}`,
      o.explain && i !== q.correctIndex ? el("div", { class: "muted" }, `Feedback if chosen: ${o.explain}`) : null))));
  } else if (q.type === "numeric") {
    out.push(para(`Answer: ${q.answer}${q.unit ? " " + q.unit : ""}`, "strong"),
      ...q.misconceptions.map((m) => para(`If the pupil types ${m.value}: ${m.explain}`, "muted")));
  } else if (q.type === "cloze") {
    out.push(para(`Accepted answer: ${q.accept.join(" or ")}`, "strong"), ...q.misconceptions.map((m) => para(`If the pupil types ${m.value}: ${m.explain}`, "muted")));
  } else if (q.type === "ordering" || q.type === "word_order") {
    out.push(para(`Shown mixed up: ${q.items.join(" · ")}`, "muted"), para(`Right answer: ${q.answer}`, "strong"));
  }
  out.push(el("div", { class: "example" }, el("div", { class: "kicker" }, "Working shown after a second miss"), el("ol", {}, q.solution.map((x) => el("li", {}, x)))));
  out.push(para(tpl.review === "rule" ? "Answer computed by the app’s rules." : "Answer written by a person: please check it.", "rv-tag"));
  return out;
}

/** The content of one item, generated with `seed` (a new seed shows another example of the same question). */
function itemBody(s, n, it, seed) {
  const l = CONTENT[s][n], lib = libs[s];
  if (it.id === "note") return [el("div", { class: "note" }, ...lines(l.note.text))];
  if (it.id === "worked") {
    const w = renderWorked(l.worked_example, lib);
    return [el("div", { class: "strong pre" }, w.problem), figureBox(w.figure), el("ol", {}, w.steps.map((x) => el("li", {}, x))), para(`Answer: ${w.answer}`, "strong")];
  }
  if (it.id === "paper") {
    const p = teach.renderPaper(l, lib);
    return [el("div", { class: "pre" }, p.prompt), el("div", { class: "kicker" }, "Model answer"), ...p.model.map((m) => para(m)),
      el("div", { class: "kicker" }, "Self-check list"), el("ul", {}, p.checklist.map((c) => el("li", {}, c)))];
  }
  if (it.card) {
    const c = teach.renderCard(it.card, lib), tpl = teach.cardCheckTemplate(l, it.card);
    return [el("div", { class: "idea" }, c.idea), cardExample(c), el("div", { class: "kicker" }, `Check question (${tpl.id})`),
      ...shownQuestion(template.instantiate(tpl, seed, lib, n), tpl)];
  }
  return shownQuestion(template.instantiate(it.tpl, seed, lib, n), it.tpl);
}

function reviewItem(s, n, it) {
  const key = markKey(s, n, it.id);
  let seed = 1;
  const box = el("section", { class: "rv-item" });
  const draw = () => {
    const m = review.marks[key];
    const note = el("textarea", { rows: "2", class: "rv-note", placeholder: "Comment (what is wrong, or the correction)", "aria-label": `Comment on ${it.id}` });
    note.value = m?.note || "";
    const mark = (ok) => { review.marks[key] = { ok, note: note.value.trim(), at: new Date().toISOString() }; saveReview(); draw(); };
    note.addEventListener("change", () => { if (review.marks[key]) { review.marks[key].note = note.value.trim(); saveReview(); } });
    box.className = `rv-item${m ? (m.ok ? " rv-is-ok" : " rv-is-bad") : ""}`;
    fill(box, [
      el("div", { class: "rv-head" }, el("span", { class: "kicker" }, it.kind), el("code", {}, it.id)),
      ...itemBody(s, n, it, seed),
      it.tpl || it.card ? button("Show another example", () => { seed += 1; draw(); }, "link") : null,
      note,
      el("div", { class: "rv-buttons" }, button("✓ OK", () => mark(true), m?.ok === true ? "primary" : ""), button("✗ Problem", () => mark(false), m?.ok === false ? "rv-bad-on" : "")),
      m ? para(m.ok ? "Marked OK." : "Marked as a problem.", "muted") : null,
    ]);
  };
  draw();
  return box;
}

function reviewLesson(s, n) {
  if (!CONTENT[s]) return withSubject(s, () => reviewLesson(s, n));
  const c = lessonCounts(s, n);
  screen(header(`Review · ${subjectName(s)} · Lesson ${n}`, TITLES[s][n]),
    para(`${c.done} of ${c.total} parts checked${c.problems ? ` · ${c.problems} problem${c.problems === 1 ? "" : "s"}` : ""}. Answers are shown. Mark each part, and add a comment when something is wrong.`, "muted"),
    reviewItems(s, n).map((it) => reviewItem(s, n, it)),
    button("Back to the review list", reviewHome, "primary"));
}

/** The message a teacher sends: every problem with its comment, then the OKs counted per lesson. */
function reviewText() {
  const out = [`Psalms Preps teacher review · ${review.name || "(name not given)"} · app ${BUILD} · ${new Date().toISOString().slice(0, 16).replace("T", " ")}`];
  // In the installed app only the subjects opened so far are on the phone: skip the others (sendReview loads every
  // subject that has marks before building the text).
  for (const s of Object.keys(SUBJECTS).filter((x) => CONTENT[x])) for (const n of LESSONS[s]) {
    const items = reviewItems(s, n).map((it) => [it, review.marks[markKey(s, n, it.id)]]).filter(([, m]) => m);
    if (!items.length) continue;
    const ok = items.filter(([, m]) => m.ok);
    out.push("", `${subjectName(s)} Lesson ${n} (${TITLES[s][n]}): ${items.length} of ${reviewItems(s, n).length} checked, ${items.length - ok.length} problem(s)`);
    for (const [it, m] of items) if (!m.ok || m.note) out.push(`  ${m.ok ? "✓" : "✗"} ${s}:${n}:${it.id}${m.note ? ` — ${m.note}` : ""}`);
  }
  return out.join("\n");
}

async function sendReview(status) {
  const marked = [...new Set(Object.keys(review.marks).map((k) => k.split(":")[0]))].filter((s) => SUBJECTS[s]);
  try { await loadAll(marked); } catch { status.textContent = "Connect to the internet once, then send again."; return; }
  const text = reviewText();
  try {
    if (navigator.share) { await navigator.share({ title: "Teacher review", text }); status.textContent = "Shared."; return; }
  } catch { /* cancelled or not allowed: fall back to copying */ }
  try { await navigator.clipboard.writeText(text); status.textContent = "Copied. Paste it into WhatsApp or a message to Dion."; }
  catch { status.textContent = "Could not copy: select the text below and copy it."; }
}

function reviewHome() {
  if (!CONTENT[RS]) return withSubject(RS, reviewHome);
  // the subjects this teacher has marked are loaded too, so the review text below is complete
  const missing = [...new Set(Object.keys(review.marks).map((k) => k.split(":")[0]))].find((s) => SUBJECTS[s] && !CONTENT[s]);
  if (missing) return withSubject(missing, reviewHome);
  document.documentElement.lang = "en";
  const name = el("input", { type: "text", class: "rv-name", placeholder: "Your name", "aria-label": "Your name", autocomplete: "name" });
  name.value = review.name;
  name.addEventListener("change", () => { review.name = name.value.trim(); saveReview(); });
  const tabs = el("div", { class: "subjects", role: "tablist" }, Object.keys(SUBJECTS).map((id) =>
    el("button", { type: "button", role: "tab", "aria-selected": String(id === RS), class: `subject${id === RS ? " on" : ""}`, onclick: () => { RS = id; reviewHome(); } }, subjectName(id))));
  const rows = LESSONS[RS].map((n) => {
    const c = lessonCounts(RS, n);
    const mark = c.done === c.total ? (c.problems ? "!" : "✓") : c.done ? "…" : String(n);
    return el("button", { type: "button", class: `lesson${c.done === c.total && !c.problems ? " is-done" : ""}`, onclick: () => reviewLesson(RS, n) },
      el("span", { class: "mark", "aria-hidden": "true" }, mark),
      el("span", { class: "lt" }, el("span", { class: "ln" }, `Lesson ${n}`), TITLES[RS][n],
        el("span", { class: "sub" }, `${c.done} of ${c.total} checked${c.problems ? ` · ${c.problems} problem${c.problems === 1 ? "" : "s"}` : ""}`)));
  });
  const status = para("", "muted");
  const area = el("textarea", { readonly: "", rows: "8", "aria-label": "Review text" });
  area.value = reviewText();
  screen(header("Teacher review", "Check the lessons"),
    para("Thank you for reviewing. Open a lesson: every answer is shown. Mark each part ✓ OK or ✗ Problem, and write a comment when something is wrong. Your marks stay on this phone until you send them.", "muted"),
    name, tabs, el("div", { class: "lessons" }, rows),
    button("Send my review", () => sendReview(status), "primary"), status,
    el("details", { class: "grownup" }, el("summary", {}, "Show the review text"), area),
    button("Open the app as a pupil", () => { location.href = location.pathname; }, "link"));
}

// Start: teachers open the link with ?review; everyone else gets the pupil's lesson menu.
if (new URLSearchParams(location.search).has("review")) reviewHome(); else home();

</script>
</body>
</html>
