c} to {v}."}],"solution":["He gets more money, so add {c} to {v}.","He has {answer} francs."]}}]},"questions":[{"id":"m2-15-less","type":"mcq","level":1,"review":"rule","sources":["algebra-language"],"vars":{"k":{"int":[2,20]},"v":{"pick":["x","y","n","a","p","t"]}},"prompt":"Write “{k} less than {v}” as an expression.","correct":"{v} − {k}","distractors":[{"text":"{k} − {v}","misconception":"backwards"},{"text":"{v} + {k}","misconception":"added"},{"text":"{k}{v}","misconception":"times"}],"misconceptions":[{"id":"backwards","explain":"Start from {v} and take {k} away: {v} − {k}."},{"id":"added","explain":"“Less than” means subtract."},{"id":"times","explain":"{k}{v} means {k} × {v}; “less than” means subtract."}],"solution":["“{k} less than {v}” means start from {v} and take away {k}.","So the expression is {answer}."]},{"id":"m2-15-square","type":"mcq","level":1,"review":"rule","sources":["algebra-language"],"vars":{"v":{"pick":["x","y","n","a","p","t"]},"two":2},"prompt":"Which expression means “the square of {v}”?","correct":"{v}²","distractors":[{"text":"{two}{v}","misconception":"double"},{"text":"{v} + {two}","misconception":"plus"},{"text":"{v} ÷ {two}","misconception":"half"}],"misconceptions":[{"id":"double","explain":"{two}{v} means {two} × {v}, twice {v}. The square is {v} × {v}."},{"id":"plus","explain":"The square is {v} × {v}, not {v} + {two}."},{"id":"half","explain":"The square is {v} × {v}."}],"solution":["The square of {v} is {v} × {v}.","It is written {answer}."],"show":3},{"id":"m2-15-match","type":"matching","level":2,"review":"rule","sources":["algebra-language"],"vars":{"k":{"int":[3,9]},"v":{"pick":["x","y","n","a","p","t"]},"two":2},"prompt":"Match each phrase to its expression.","pool":[{"left":"{k} more than {v}","right":"{v} + {k}"},{"left":"{k} less than {v}","right":"{v} − {k}"},{"left":"{k} times {v}","right":"{k}{v}"},{"left":"{v} divided by {k}","right":"{v} ÷ {k}"},{"left":"the square of {v}","right":"{v}²"},{"left":"{k} more than twice {v}","right":"{two}{v} + {k}"}],"pick":4},{"id":"m2-15-story","type":"mcq","level":2,"review":"rule","sources":["algebra-language"],"vars":{"v":{"pick":["x","y","n","a","p","t"]},"n":{"int":[3,12]}},"prompt":"A teacher shares {v} pencils equally among {n} pupils. How many pencils does each pupil get?","correct":"{v} ÷ {n}","distractors":[{"text":"{n}{v}","misconception":"times"},{"text":"{v} − {n}","misconception":"minus"},{"text":"{n} ÷ {v}","misconception":"backwards"}],"misconceptions":[{"id":"times","explain":"{n}{v} means {n} × {v}; sharing means dividing."},{"id":"minus","explain":"Each pupil gets a share, so divide, do not subtract."},{"id":"backwards","explain":"Divide the pencils, {v}, by the number of pupils, {n}: {v} ÷ {n}."}],"solution":["Sharing equally means dividing the {v} pencils by {n}.","Each pupil gets {answer} pencils."]},{"id":"m2-15-perimeter","type":"mcq","level":3,"review":"rule","sources":["algebra-language"],"vars":{"v":{"pick":["x","y","n","a","p","t"]},"w":{"int":[3,12]},"two":2},"prompt":"A rectangle has length {v} cm and width {w} cm. Which expression gives its perimeter in cm?","correct":"{two}{v} + {2 * w}","distractors":[{"text":"{v} + {w}","misconception":"half"},{"text":"{two}{v} + {w}","misconception":"one-width"},{"text":"{w}{v}","misconception":"area"},{"text":"{v} + {2 * w}","misconception":"one-length"}],"misconceptions":[{"id":"half","explain":"That is only one length and one width; the perimeter goes all the way round."},{"id":"one-width","explain":"There are two widths: {w} + {w} = {2 * w}."},{"id":"area","explain":"{w}{v} is the area (length × width), not the perimeter."},{"id":"one-length","explain":"There are two lengths: {v} + {v} = {two}{v}."}],"solution":["The perimeter is length + width + length + width.","{v} + {w} + {v} + {w} = {answer}"]}]},"16":{"subject":"mathematics","class":"Form 2","lesson_no":16,"language":"en","prerequisites":[15],"skills":[{"id":"m2-16","name":"Variables, terms, constant and coefficients"}],"note":{"status":"draft","text":"Look at the expression 5x + 3y − 7.\n• The variables are the letters, x and y: they stand for numbers that can change.\n• The terms are the parts joined by + and −: 5x, 3y and −7. The sign in front belongs to the term.\n• A coefficient is the number in front of a letter: the coefficient of x is 5 and the coefficient of y is 3.\n• The constant term has no letter: here it is −7.\nHidden ones: in x − y + 4, the coefficient of x is 1 (x = 1x) and the coefficient of y is −1 (−y = −1y).","checks":[]},"worked_example":{"status":"draft","vars":{"a":4,"b":-2,"c":9,"one":1},"problem":"For the expression {poly([a, 'x'], [b, 'y'], [one, 'z'], [c, ''])}, name the variables, the terms, each coefficient and the constant term.","steps":["The variables are the letters: x, y and z.","The terms are {mono(a, 'x')}, {mono(b, 'y')}, z and {c}.","The coefficients: {a} for x, {b} for y, and {one} for z (z = {one}z).","The constant term is the term with no letter: {c}."],"answer":"Variables x, y, z; coefficients {a}, {b}, {one}; constant term {c}.","checks":["b \u003c 0"]},"teach":{"cards":[{"id":"c16-1","status":"draft","idea":"The variables of an expression are its letters.","vars":{"a":5,"b":3,"c":-7},"example":["In {poly([a, 'x'], [b, 'y'], [c, ''])}, the variables are x and y."],"checks":[],"check":{"id":"m2-16-c1","type":"mcq","level":1,"review":"rule","sources":["algebra-language"],"vars":{"a":{"int":[-9,9]},"b":{"int":[-9,9]},"c":{"int":[-20,20]},"V":{"pick":[["x","y"],["a","b"],["m","n"],["p","q"]]}},"prompt":"Which are the variables in {poly([a, V[0]], [b, V[1]], [c, ''])}?","correct":"{V[0]} and {V[1]}","distractors":[{"text":"{a} and {b}","misconception":"coef"},{"text":"{c}","misconception":"const"},{"text":"{mono(a, V[0])} and {mono(b, V[1])}","misconception":"terms"}],"misconceptions":[{"id":"coef","explain":"{a} and {b} are the coefficients, the numbers in front of the letters."},{"id":"const","explain":"{c} is the constant term: it has no letter."},{"id":"terms","explain":"Those are terms. The variables are just the letters."}],"solution":["The variables are the letters.","In {poly([a, V[0]], [b, V[1]], [c, ''])} they are {answer}."],"where":["a != 0 && b != 0 && c != 0","abs(a) != 1 && abs(b) != 1","a != b"]}},{"id":"c16-2","status":"draft","idea":"Terms are the parts of an expression joined by + and −. The sign in front belongs to the term.","vars":{"a":5,"b":3,"c":-7},"example":["{poly([a, 'x'], [b, 'y'], [c, ''])} has three terms: {mono(a, 'x')}, {mono(b, 'y')} and {c}."],"checks":[],"check":{"ref":"m2-16-terms"}},{"id":"c16-3","status":"draft","idea":"The coefficient of a letter is the number in front of it, with its sign. x has coefficient {one} and −x has coefficient −{one}.","vars":{"a":5,"b":-4,"one":1},"example":["In {poly([a, 'x'], [b, 'y'])}: the coefficient of x is {a}, of y is {b}.","In {poly([one, 'x'], [-one, 'y'])}: the coefficient of x is {one}, of y is {-one}."],"checks":[],"check":{"ref":"m2-16-coef"}},{"id":"c16-4","status":"draft","idea":"The constant term has no letter. Keep its sign.","vars":{"a":2,"c":-9},"example":["In {poly([a, 'x'], [c, ''])}, the constant term is {c}."],"checks":[],"check":{"ref":"m2-16-const"}}]},"questions":[{"id":"m2-16-terms","type":"numeric","level":1,"review":"rule","sources":["algebra-language"],"vars":{"a":{"int":[-9,9]},"b":{"pick":[0,-3,2,5,-7]},"d":{"pick":[0,0,4,-6]},"c":{"pick":[0,-8,3,10]}},"prompt":"How many terms are there in {poly([a, 'x'], [b, 'y'], [d, 'z'], [c, ''])}?","answer":"(a != 0 ? 1 : 0) + (b != 0 ? 1 : 0) + (d != 0 ? 1 : 0) + (c != 0 ? 1 : 0)","misconceptions":[{"id":"letters","wrong":"(b != 0 ? 1 : 0) + (d != 0 ? 1 : 0) + 1","explain":"Count every part joined by + or −, including the constant term.","when":"c != 0"}],"solution":["The terms are the parts joined by + and −.","{poly([a, 'x'], [b, 'y'], [d, 'z'], [c, ''])} has {answer} terms."],"where":["a != 0"]},{"id":"m2-16-coef","type":"numeric","level":1,"review":"rule","sources":["algebra-language"],"vars":{"a":{"int":[-9,9]},"b":{"int":[-9,9]},"c":{"int":[-20,20]},"V":{"pick":[["x","y"],["a","b"],["m","n"],["p","q"]]}},"prompt":"What is the coefficient of {V[1]} in {poly([a, V[0]], [b, V[1]], [c, ''])}?","answer":"b","misconceptions":[{"id":"sign","wrong":"-b","explain":"Keep the sign in front of the term: {mono(b, V[1])}."},{"id":"other","wrong":"a","explain":"{a} is the coefficient of {V[0]}."}],"solution":["The coefficient is the number in front of {V[1]}, with its sign.","In {mono(b, V[1])} it is {answer}."],"where":["a != 0 && b != 0 && c != 0","abs(a) != 1 && abs(b) != 1","a != b"],"signed":true},{"id":"m2-16-const","type":"numeric","level":1,"review":"rule","sources":["algebra-language"],"vars":{"a":{"int":[-9,9]},"b":{"int":[-9,9]},"c":{"int":[-20,20]},"V":{"pick":[["x","y"],["a","b"],["m","n"],["p","q"]]}},"prompt":"What is the constant term of {poly([a, V[0]], [b, V[1]], [c, ''])}?","answer":"c","misconceptions":[{"id":"sign","wrong":"-c","explain":"Keep the sign in front of the number: the constant term is {c}."},{"id":"coef","wrong":"a","explain":"{a} is a coefficient; the constant term has no letter."}],"solution":["The constant term is the term with no letter, with its sign.","It is {answer}."],"where":["a != 0 && b != 0 && c != 0","abs(a) != 1 && abs(b) != 1","a != b"],"signed":true},{"id":"m2-16-build","type":"mcq","level":2,"review":"rule","sources":["algebra-language"],"vars":{"k":{"int":[-9,9]},"c":{"int":[-12,12]}},"prompt":"Which expression has coefficient of x equal to {k} and constant term {c}?","correct":"{poly([k, 'x'], [c, ''])}","distractors":[{"text":"{poly([c, 'x'], [k, ''])}","misconception":"swapped"},{"text":"{poly([k, 'x'], [-c, ''])}","misconception":"sign"},{"text":"{poly([-k, 'x'], [c, ''])}","misconception":"sign2"}],"misconceptions":[{"id":"swapped","explain":"The coefficient goes in front of x and the constant term stands alone."},{"id":"sign","explain":"The constant term is {c}: check its sign."},{"id":"sign2","explain":"The coefficient of x is {k}: check its sign."}],"solution":["The coefficient of x is the number in front of x: {mono(k, 'x')}.","The constant term is {c}.","So the expression is {answer}."],"where":["k != 0 && c != 0 && abs(k) != 1 && k != c && k != -c"]},{"id":"m2-16-hidden","type":"numeric","level":3,"review":"rule","sources":["algebra-language"],"vars":{"a":{"int":[-9,9]},"b":{"int":[-9,9]},"c":{"int":[-20,20]},"V":{"pick":[["x","y"],["a","b"],["m","n"],["p","q"]]},"s":{"pick":[1,-1]},"one":1,"z":0},"prompt":"What is the coefficient of {V[0]} in {poly([b, V[1]], [s, V[0]], [c, ''])}?","answer":"s","misconceptions":[{"id":"zero","wrong":"0","explain":"There is a term with {V[0]}, so the coefficient is not {z}: {mono(s, V[0])} = {s}{V[0]}.","when":"true"},{"id":"sign","wrong":"-s","explain":"Keep the sign in front of the term."}],"solution":["{mono(s, V[0])} means {s} × {V[0]}: a letter on its own has coefficient {one}, with the sign in front of it.","So the coefficient of {V[0]} is {answer}."],"where":["a != 0 && b != 0 && c != 0","abs(a) != 1 && abs(b) != 1","a != b"],"signed":true}]},"17":{"subject":"mathematics","class":"Form 2","lesson_no":17,"language":"en","prerequisites":[16],"skills":[{"id":"m2-17","name":"Like and unlike terms"}],"note":{"status":"draft","text":"Like terms have exactly the same letters, each with the same power. Only the coefficients may differ.\nLike: 3x and −5x; 2ab and 7ba (ab = ba: the order of the letters does not matter); 4x² and x².\nUnlike: 3x and 3y (different letters); 2x and 2x² (different powers); 5 and 5x (one has no letter).\nLike terms can be added or subtracted by adding or subtracting their coefficients: 3x + 5x = 8x, 7y − 2y = 5y.\nUnlike terms cannot be joined: 3x + 5y stays as it is (it is not 8xy).","checks":[]},"worked_example":{"status":"draft","vars":{"a":6,"b":-4,"c":3},"problem":"Group the terms {mono(a, 'x')}, {mono(c, 'y')}, {mono(b, 'x')} and {mono(c, 'x²')} into like terms, and add the like terms.","steps":["{mono(a, 'x')} and {mono(b, 'x')} both have the letter x on its own: they are like terms.","{mono(c, 'y')} has a different letter, and {mono(c, 'x²')} has x squared: they are unlike the others.","{mono(a, 'x')} + {br(b)}x: add the coefficients, {a} + {br(b)} = {a + b}, so the sum is {mono(a + b, 'x')}."],"answer":"{mono(a + b, 'x')}, {mono(c, 'y')} and {mono(c, 'x²')}","checks":["a + b == 2"]},"teach":{"cards":[{"id":"c17-1","status":"draft","idea":"Like terms have the same letters with the same powers. Only the numbers in front may change.","vars":{"a":3,"b":-5},"example":["{mono(a, 'x')} and {mono(b, 'x')} are like terms.","{mono(a, 'x')} and {mono(a, 'y')} are unlike: the letters are different."],"checks":[],"check":{"id":"m2-17-c1","type":"mcq","level":1,"review":"rule","sources":["like-terms"],"vars":{"a":{"int":[2,9]},"b":{"int":[-9,9]},"v":{"pick":["x","y","p"]},"w":{"pick":["a","b","q"]}},"prompt":"Which term is a like term of {mono(a, v)}?","correct":"{mono(b, v)}","distractors":[{"text":"{mono(a, w)}","misconception":"letter"},{"text":"{mono(a, v + '²')}","misconception":"power"},{"text":"{a}","misconception":"number"}],"misconceptions":[{"id":"letter","explain":"{mono(a, w)} has the letter {w}, not {v}."},{"id":"power","explain":"{mono(a, v + '²')} has {v} squared: the power is different."},{"id":"number","explain":"{a} has no letter, so it is not like {mono(a, v)}."}],"solution":["A like term has the same letter, {v}, with the same power.","{answer} has {v} on its own, so it is like {mono(a, v)}."],"where":["b != a && b != 0 && abs(b) != 1"]}},{"id":"c17-2","status":"draft","idea":"The power matters: x and x² are unlike terms, because x² means x × x.","vars":{"a":2,"b":7},"example":["{mono(a, 'x')} and {mono(a, 'x²')} are unlike.","{mono(a, 'x²')} and {mono(b, 'x²')} are like."],"checks":[],"check":{"ref":"m2-17-sort"}},{"id":"c17-3","status":"draft","idea":"The order of the letters does not matter: ab and ba are the same, so {mono(a, 'ab')} and {mono(b, 'ba')} are like terms.","vars":{"a":2,"b":7},"example":["{mono(a, 'ab')} and {mono(b, 'ba')} are like terms.","{mono(a, 'ab')} and {mono(b, 'a')} are not."],"checks":[],"check":{"id":"m2-17-c3","type":"mcq","level":1,"review":"authored","sources":["like-terms"],"vars":{"a":{"int":[2,9]},"b":{"int":[2,9]}},"prompt":"Which pair are like terms?","pool":{"right":[{"text":"{mono(a, 'ab')} and {mono(b, 'ba')}","truth":"true"},{"text":"{mono(a, 'xy')} and {mono(b, 'yx')}","truth":"true"},{"text":"{mono(a, 'pq')} and {mono(b, 'qp')}","truth":"true"}],"wrong":[{"text":"{mono(a, 'ab')} and {mono(b, 'a')}","truth":"false","explain":"{mono(b, 'a')} has only the letter a; {mono(a, 'ab')} has a and b."},{"text":"{mono(a, 'xy')} and {mono(b, 'x²y')}","truth":"false","explain":"x²y has x squared; xy has x on its own."},{"text":"{mono(a, 'pq')} and {mono(a, 'p')}","truth":"false","explain":"{mono(a, 'p')} has only the letter p."},{"text":"{mono(a, 'x')} and {mono(a, 'y')}","truth":"false","explain":"The letters are different."}]},"pick":{"right":1,"wrong":2},"where":["a != b"]}},{"id":"c17-4","status":"draft","idea":"To add or subtract like terms, add or subtract their coefficients and keep the letters.","vars":{"a":3,"b":5,"c":7,"d":2},"example":["{mono(a, 'x')} + {mono(b, 'x')} = {mono(a + b, 'x')}","{mono(c, 'y')} − {mono(d, 'y')} = {mono(c - d, 'y')}"],"checks":[],"check":{"ref":"m2-17-add"}}]},"questions":[{"id":"m2-17-add","type":"mcq","level":1,"review":"rule","sources":["like-terms"],"vars":{"a":{"int":[2,12]},"b":{"int":[2,12]},"v":{"pick":["x","y","a","m","t"]}},"prompt":"Simplify {mono(a, v)} + {mono(b, v)}.","correct":"{mono(a + b, v)}","distractors":[{"text":"{mono(a * b, v)}","misconception":"times"},{"text":"{mono(a + b, v + '²')}","misconception":"power"},{"text":"{a + b}","misconception":"drop"}],"misconceptions":[{"id":"times","explain":"Add the coefficients, do not multiply them."},{"id":"power","explain":"Adding does not change the power: {v} stays {v}."},{"id":"drop","explain":"Keep the letter: {a + b}{v}."}],"solution":["{mono(a, v)} and {mono(b, v)} are like terms: add the coefficients.","{a} + {b} = {a + b}, so the answer is {answer}."],"where":["a * b != a + b"]},{"id":"m2-17-sort","type":"matching","level":1,"review":"rule","sources":["like-terms"],"vars":{"a":{"int":[2,9]},"b":{"int":[2,9]},"c":{"int":[2,9]}},"prompt":"Sort the terms into groups of like terms.","pool":[{"left":"{mono(a, 'x')}","right":"x terms"},{"left":"{mono(-b, 'x')}","right":"x terms"},{"left":"{mono(c, 'x')}","right":"x terms"},{"left":"{mono(b, 'y')}","right":"y terms"},{"left":"{mono(-a, 'y')}","right":"y terms"},{"left":"{mono(c, 'y')}","right":"y terms"},{"left":"{mono(a, 'x²')}","right":"x² terms"},{"left":"{mono(b, 'x²')}","right":"x² terms"},{"left":"{mono(-c, 'x²')}","right":"x² terms"}],"pick":6,"groups":true,"group_order":["x terms","y terms","x² terms"],"where":["a != b && b != c && a != c"]},{"id":"m2-17-sub","type":"mcq","level":2,"review":"rule","sources":["like-terms"],"vars":{"a":{"int":[2,15]},"b":{"int":[2,15]},"v":{"pick":["x","y","ab","p"]}},"prompt":"Simplify {mono(a, v)} − {mono(b, v)}.","correct":"{mono(a - b, v)}","distractors":[{"text":"{mono(a + b, v)}","misconception":"added"},{"text":"{mono(b - a, v)}","misconception":"sign"},{"text":"{a - b}","misconception":"drop"}],"misconceptions":[{"id":"added","explain":"It is a subtraction: {a} − {b}."},{"id":"sign","explain":"Start from {a} and take away {b}: {a - b}."},{"id":"drop","explain":"Keep the letters: {mono(a - b, v)}."}],"solution":["Like terms: subtract the coefficients.","{a} − {b} = {a - b}, so the answer is {answer}."],"where":["a != b","a - b != 1 && a - b != -1"]},{"id":"m2-17-spot","type":"spot_error","level":3,"review":"rule","sources":["like-terms"],"vars":{"a":{"int":[2,9]},"b":{"int":[2,9]}},"prompt":"Which statement is false?","pool":{"right":[{"text":"{mono(a, 'x')} + {mono(b, 'x')} = {mono(a + b, 'x')}","truth":"true"},{"text":"{mono(a, 'ab')} + {mono(b, 'ba')} = {mono(a + b, 'ab')}","truth":"true"},{"text":"{mono(a, 'x')} and {mono(b, 'x²')} are unlike terms","truth":"true"},{"text":"{mono(a + b, 'y')} − {mono(b, 'y')} = {mono(a, 'y')}","truth":"true"}],"wrong":[{"text":"{mono(a, 'x')} + {mono(b, 'y')} = {mono(a + b, 'xy')}","truth":"false","explain":"x and y are unlike terms: {mono(a, 'x')} + {mono(b, 'y')} cannot be joined."},{"text":"{mono(a, 'x')} + {mono(b, 'x')} = {mono(a + b, 'x²')}","truth":"false","explain":"Adding like terms keeps the power: {mono(a + b, 'x')}."},{"text":"{mono(a, 'x')} and {mono(b, 'x²')} are like terms","truth":"false","explain":"x and x² have different powers, so they are unlike."}]},"pick":{"right":3,"wrong":1},"where":["a != b"]}]},"18":{"subject":"mathematics","class":"Form 2","lesson_no":18,"language":"en","prerequisites":[17],"skills":[{"id":"m2-18","name":"Simplifying expressions"}],"note":{"status":"draft","text":"To simplify an expression, collect the like terms:\n1. Find the like terms (underline each kind in a different way).\n2. Add or subtract their coefficients, keeping the sign in front of each term.\n3. Write the result with the letters in alphabetical order and the constant last.\nExample: 3x + 2y + 5x − y = 3x + 5x + 2y − y = 8x + y.\nWith numbers: 5x − 3 − 2x + 7 = 3x + 4. Terms that cancel disappear: 4y + 3 − 4y = 3.\nMultiplying terms: multiply the numbers, then the letters: 3 × 2x = 6x, 2a × 3b = 6ab, a × a = a².","checks":[]},"worked_example":{"status":"draft","vars":{"a":5,"b":3,"c":-2,"d":-4,"e":7},"problem":"Simplify {mono(a, 'x')} + {mono(b, 'y')} {c \u003c 0 ? '−' : '+'} {mono(abs(c), 'x')} + {e} {d \u003c 0 ? '−' : '+'} {mono(abs(d), 'y')}.","steps":["The x terms: {mono(a, 'x')} and {mono(c, 'x')}. The y terms: {mono(b, 'y')} and {mono(d, 'y')}. The constant: {e}.","x: {a} + {br(c)} = {a + c}. y: {b} + {br(d)} = {b + d}.","Result: {poly([a + c, 'x'], [b + d, 'y'], [e, ''])}."],"answer":"{poly([a + c, 'x'], [b + d, 'y'], [e, ''])}","checks":["b + d == -1"]},"teach":{"cards":[{"id":"c18-1","status":"draft","idea":"Collect the like terms: group them, then add their coefficients.","vars":{"a":3,"b":2,"c":5,"d":-1},"example":["{poly([a, 'x'], [b, 'y'], [c, 'x'], [d, 'y'])} = {poly([a + c, 'x'], [b + d, 'y'])}"],"checks":[],"check":{"ref":"m2-18-collect"}},{"id":"c18-2","status":"draft","idea":"Constants are like terms too. Take the sign in front of each term with it.","vars":{"a":5,"b":-3,"c":-2,"d":7},"example":["{poly([a, 'x'], [b, ''], [c, 'x'], [d, ''])} = {poly([a + c, 'x'], [b + d, ''])}"],"checks":[],"check":{"ref":"m2-18-const"}},{"id":"c18-3","status":"draft","idea":"To multiply terms, multiply the numbers, then put the letters together. A letter times itself is its square.","vars":{"a":3,"b":2},"example":["{a} × {mono(b, 'x')} = {mono(a * b, 'x')}","{mono(a, 'a')} × {mono(b, 'b')} = {mono(a * b, 'ab')}","a × a = a²"],"checks":[],"check":{"id":"m2-18-c3","type":"mcq","level":1,"review":"rule","sources":["simplify"],"vars":{"a":{"int":[2,9]},"b":{"int":[2,9]},"v":{"pick":["a","m","p"]},"w":{"pick":["b","n","q"]}},"prompt":"Simplify {mono(a, v)} × {mono(b, w)}.","correct":"{mono(a * b, v + w)}","distractors":[{"text":"{mono(a + b, v + w)}","misconception":"added"},{"text":"{a * b}","misconception":"drop"},{"text":"{mono(a, v)}{mono(b, w)}","misconception":"together"}],"misconceptions":[{"id":"added","explain":"Multiply the numbers, do not add them: {a} × {b} = {a * b}."},{"id":"drop","explain":"Keep the letters: {v}{w}."},{"id":"together","explain":"Multiply the numbers: {a} × {b} = {a * b}, and write the number first."}],"solution":["Multiply the numbers: {a} × {b} = {a * b}.","Put the letters together: {v}{w}. The answer is {answer}."],"where":["a * b != a + b"]}}]},"questions":[{"id":"m2-18-collect","type":"mcq","level":1,"review":"rule","sources":["simplify"],"vars":{"a":{"int":[2,9]},"b":{"int":[2,9]},"c":{"int":[-9,9]},"d":{"int":[-9,9]}},"prompt":"Simplify {poly([a, 'x'], [b, 'y'], [c, 'x'], [d, 'y'])}.","correct":"{poly([a + c, 'x'], [b + d, 'y'])}","distractors":[{"text":"{mono(a + b + c + d, 'xy')}","misconception":"all"},{"text":"{poly([a + c, 'x'], [b - d, 'y'])}","misconception":"sign"},{"text":"{poly([a + b, 'x'], [c + d, 'y'])}","misconception":"order"}],"misconceptions":[{"id":"all","explain":"x and y terms are unlike: they cannot be joined into one term."},{"id":"sign","explain":"Keep the sign in front of each y term: {b} + {br(d)} = {b + d}."},{"id":"order","explain":"Add only like terms: the x terms together and the y terms together."}],"solution":["x terms: {a} + {br(c)} = {a + c}.","y terms: {b} + {br(d)} = {b + d}.","So the answer is {answer}."],"where":["c != 0 && d != 0","a + c != 0 && b + d != 0","d \u003c 0 || c \u003c 0","a + b != a + c","a + b + c + d != 0"]},{"id":"m2-18-const","type":"mcq","level":1,"review":"rule","sources":["simplify"],"vars":{"a":{"int":[2,9]},"b":{"int":[-9,9]},"c":{"int":[-9,9]},"d":{"int":[-9,9]},"v":{"pick":["x","y","a","n"]}},"prompt":"Simplify {poly([a, v], [b, ''], [c, v], [d, ''])}.","correct":"{poly([a + c, v], [b + d, ''])}","distractors":[{"text":"{poly([a + c, v], [b - d, ''])}","misconception":"sign"},{"text":"{mono(a + b + c + d, v)}","misconception":"all"},{"text":"{poly([a - c, v], [b + d, ''])}","misconception":"sign2"}],"misconceptions":[{"id":"sign","explain":"Keep the sign in front of each number: {b} + {br(d)} = {b + d}."},{"id":"all","explain":"The numbers have no letter, so they are not like the {v} terms."},{"id":"sign2","explain":"Keep the sign in front of each {v} term: {a} + {br(c)} = {a + c}."}],"solution":["{v} terms: {a} + {br(c)} = {a + c}.","Numbers: {b} + {br(d)} = {b + d}.","So the answer is {answer}."],"where":["b != 0 && c != 0 && d != 0","a + c != 0 && b + d != 0","c != 0","b - d != b + d","a - c != a + c"]},{"id":"m2-18-three","type":"mcq","level":2,"review":"rule","sources":["simplify"],"vars":{"a":{"int":[2,9]},"b":{"int":[-9,9]},"c":{"int":[-9,9]},"d":{"int":[-9,9]},"e":{"int":[-9,9]},"f":{"int":[-9,9]}},"prompt":"Simplify {poly([a, 'a'], [b, 'b'], [c, ''], [d, 'a'], [e, 'b'], [f, ''])}.","correct":"{poly([a + d, 'a'], [b + e, 'b'], [c + f, ''])}","distractors":[{"text":"{poly([a + d, 'a'], [b + e, 'b'], [c - f, ''])}","misconception":"sign"},{"text":"{poly([a + d, 'a'], [b - e, 'b'], [c + f, ''])}","misconception":"sign2"},{"text":"{poly([a + d + b + e, 'ab'], [c + f, ''])}","misconception":"join"}],"misconceptions":[{"id":"sign","explain":"Keep the sign in front of each number: {c} + {br(f)} = {c + f}."},{"id":"sign2","explain":"Keep the sign in front of each b term: {b} + {br(e)} = {b + e}."},{"id":"join","explain":"a terms and b terms are unlike: they cannot be joined."}],"solution":["a terms: {a} + {br(d)} = {a + d}. b terms: {b} + {br(e)} = {b + e}. Numbers: {c} + {br(f)} = {c + f}.","So the answer is {answer}."],"where":["b != 0 && c != 0 && d != 0 && e != 0 && f != 0","a + d != 0 && b + e != 0 && c + f != 0","f != 0 && e != 0","a + d + b + e != 0"]},{"id":"m2-18-mul","type":"mcq","level":2,"review":"rule","sources":["simplify"],"vars":{"a":{"int":[2,9]},"b":{"int":[2,9]},"v":{"pick":["x","y","a","t"]}},"prompt":"Simplify {mono(a, v)} × {mono(b, v)}.","correct":"{mono(a * b, v + '²')}","distractors":[{"text":"{mono(a * b, v)}","misconception":"power"},{"text":"{mono(a + b, v + '²')}","misconception":"added"},{"text":"{mono(a + b, v)}","misconception":"both"}],"misconceptions":[{"id":"power","explain":"{v} × {v} is {v}², not {v}."},{"id":"added","explain":"Multiply the numbers: {a} × {b} = {a * b}."},{"id":"both","explain":"This is a product, not a sum."}],"solution":["Multiply the numbers: {a} × {b} = {a * b}.","{v} × {v} = {v}². The answer is {answer}."],"where":["a * b != a + b"]},{"id":"m2-18-perimeter","type":"mcq","level":3,"review":"rule","sources":["simplify"],"vars":{"a":{"int":[1,5]},"b":{"int":[1,9]},"c":{"int":[2,6]},"d":{"int":[-6,-1]},"e":{"int":[1,4]},"f":{"int":[1,9]}},"prompt":"The sides of a triangle are ({poly([a, 'x'], [b, ''])}) cm, ({poly([c, 'x'], [d, ''])}) cm and ({poly([e, 'x'], [f, ''])}) cm. Which expression gives its perimeter?","correct":"({poly([a + c + e, 'x'], [b + d + f, ''])}) cm","distractors":[{"text":"({poly([a + c + e, 'x'], [b - d + f, ''])}) cm","misconception":"sign"},{"text":"{mono(a + b + c + d + e + f, 'x')} cm","misconception":"all"},{"text":"({poly([a * c * e, 'x'], [b + d + f, ''])}) cm","misconception":"times"}],"misconceptions":[{"id":"sign","explain":"Keep the sign of each number: {b} + {br(d)} + {br(f)} = {b + d + f}."},{"id":"all","explain":"The numbers are not like the x terms: keep them apart."},{"id":"times","explain":"The perimeter adds the sides: add the coefficients, {a} + {c} + {e}."}],"solution":["Perimeter = the three sides added.","x terms: {a} + {c} + {e} = {a + c + e}. Numbers: {b} + {br(d)} + {br(f)} = {b + d + f}.","Perimeter = {answer}."],"where":["b + d + f != 0","a * c * e != a + c + e","b - d + f != b + d + f"]}]},"19":{"subject":"mathematics","class":"Form 2","lesson_no":19,"language":"en","prerequisites":[18,2],"skills":[{"id":"m2-19","name":"Substitution: finding the value of an expression"}],"note":{"status":"draft","text":"To find the value of an expression, replace each letter by its number (substitute), then work it out. Multiply and divide before you add and subtract.\n3x + 2 when x = 4: 3 × 4 + 2 = 12 + 2 = 14.\nPut a negative number in brackets: 2a − b when a = 3 and b = −1: 2 × 3 − (−1) = 6 + 1 = 7.\nTwo letters next to each other are multiplied: 5xy when x = 2 and y = 3 is 5 × 2 × 3 = 30.\nPowers come first: x² when x = −3 is (−3)² = 9. And 3x² means 3 × x², so when x = 2 it is 3 × 4 = 12.\nSimplify first when you can: 3x + 2y − x + y = 2x + 3y.","checks":[]},"worked_example":{"status":"draft","vars":{"a":3,"b":-2,"c":5},"problem":"Find the value of {mono(a, 'x²')} − {c}y when x = {b} and y = {b}.","steps":["Substitute, with brackets for the negative number: {a} × {br(b)}² − {c} × {br(b)}.","Power first: {br(b)}² = {b * b}, so {a} × {b * b} = {a * b * b}.","{c} × {br(b)} = {c * b}.","{a * b * b} − {br(c * b)} = {a * b * b} + {-c * b} = {a * b * b - c * b}."],"answer":"The value is {a * b * b - c * b}.","checks":["a * b * b - c * b == 22"]},"teach":{"cards":[{"id":"c19-1","status":"draft","idea":"Substitute: replace the letter by its number, then work out, multiplying before adding.","vars":{"a":3,"b":2,"x":4},"example":["{mono(a, 'x')} + {b} when x = {x}: {a} × {x} + {b} = {a * x} + {b} = {a * x + b}."],"checks":[],"check":{"ref":"m2-19-one"}},{"id":"c19-2","status":"draft","idea":"When a letter stands for a negative number, put the number in brackets.","vars":{"a":4,"b":7,"x":-3},"example":["{mono(a, 'x')} + {b} when x = {x}: {a} × {br(x)} + {b} = {a * x} + {b} = {a * x + b}."],"checks":[],"check":{"ref":"m2-19-neg"}},{"id":"c19-3","status":"draft","idea":"Letters written next to each other are multiplied.","vars":{"k":5,"x":2,"y":3},"example":["{k}xy when x = {x} and y = {y}: {k} × {x} × {y} = {k * x * y}."],"checks":[],"check":{"id":"m2-19-c3","type":"numeric","level":1,"review":"rule","sources":["substitution"],"vars":{"k":{"int":[2,6]},"a":{"int":[-5,6]},"b":{"int":[2,6]}},"prompt":"Find the value of {k}ab when a = {a} and b = {b}.","answer":"k * a * b","misconceptions":[{"id":"added","wrong":"k + a + b","explain":"ab means a × b: multiply, do not add."},{"id":"sign","wrong":"-(k * a * b)","explain":"Check the sign: {k} × {br(a)} × {b} = {k * a * b}."}],"solution":["{k}ab means {k} × a × b.","{k} × {br(a)} × {br(b)} = {answer}"],"where":["a != 0 && a != 1"],"signed":true}},{"id":"c19-4","status":"draft","idea":"Work out powers before multiplying. A negative number squared is positive.","vars":{"x":-3,"a":2},"example":["x² when x = {x}: {br(x)}² = {x * x}.","{a}x² when x = {x}: {a} × {x * x} = {a * x * x} (not ({a} × {br(x)})²)."],"checks":[],"check":{"id":"m2-19-c4","type":"numeric","level":1,"review":"rule","sources":["substitution"],"vars":{"x":{"int":[-9,-2]},"two":2},"prompt":"Find the value of x² when x = {x}.","answer":"x * x","misconceptions":[{"id":"negative","wrong":"-(x * x)","explain":"A negative number times a negative number is positive: {br(x)} × {br(x)} = {x * x}."},{"id":"double","wrong":"2 * x","explain":"x² means x × x, not {two} × x."}],"solution":["Substitute with brackets: {br(x)}².","{br(x)} × {br(x)} = {answer}"]}}]},"questions":[{"id":"m2-19-one","type":"numeric","level":1,"review":"rule","sources":["substitution"],"vars":{"a":{"int":[2,9]},"b":{"int":[1,20]},"x":{"int":[2,12]}},"prompt":"Find the value of {mono(a, 'x')} + {b} when x = {x}.","answer":"a * x + b","misconceptions":[{"id":"joined","wrong":"num(str(a) + str(x)) + b","explain":"{a}x means {a} × x, so {a} × {x} = {a * x}, not {a}{x}."},{"id":"added-first","wrong":"a * (x + b)","explain":"Multiply first, then add: {a} × {x} = {a * x}, then + {b}."}],"solution":["Substitute: {a} × {x} + {b}.","{a * x} + {b} = {answer}"]},{"id":"m2-19-neg","type":"numeric","level":1,"review":"rule","sources":["substitution"],"vars":{"a":{"int":[2,9]},"b":{"int":[-15,15]},"x":{"int":[-9,-1]}},"prompt":"Find the value of {poly([a, 'x'], [b, ''])} when x = {x}.","answer":"a * x + b","misconceptions":[{"id":"sign","wrong":"a * -x + b","explain":"x is negative: {a} × {br(x)} = {a * x}."}],"solution":["Substitute, with brackets: {a} × {br(x)} {b \u003c 0 ? '−' : '+'} {abs(b)}.","{a * x} {b \u003c 0 ? '−' : '+'} {abs(b)} = {answer}"],"where":["b != 0"],"signed":true},{"id":"m2-19-two","type":"numeric","level":2,"review":"rule","sources":["substitution"],"vars":{"p":{"int":[2,7]},"q":{"int":[-7,7]},"a":{"int":[-6,6]},"b":{"int":[-6,6]}},"prompt":"Find the value of {poly([p, 'a'], [q, 'b'])} when a = {a} and b = {b}.","answer":"p * a + q * b","misconceptions":[{"id":"sign","wrong":"p * a - q * b","explain":"Keep the sign of each term and put negative numbers in brackets."}],"solution":["Substitute: {p} × {br(a)} {q \u003c 0 ? '−' : '+'} {abs(q)} × {br(b)}.","{p * a} {q \u003c 0 ? '−' : '+'} {abs(q * b)} = {answer}"],"where":["q != 0 && abs(q) != 1 && a != 0 && b != 0","a \u003c 0 || b \u003c 0"],"signed":true},{"id":"m2-19-square","type":"numeric","level":2,"review":"rule","sources":["substitution"],"vars":{"a":{"int":[2,5]},"c":{"int":[1,20]},"x":{"int":[-6,-2]}},"prompt":"Find the value of {mono(a, 'x²')} + {c} when x = {x}.","answer":"a * x * x + c","misconceptions":[{"id":"square-all","wrong":"(a * x) * (a * x) + c","explain":"Only x is squared: {a}x² = {a} × x²."},{"id":"negative","wrong":"-(a * x * x) + c","explain":"{br(x)}² is positive: {x * x}."}],"solution":["Power first: {br(x)}² = {x * x}.","{a} × {x * x} + {c} = {a * x * x} + {c} = {answer}"]},{"id":"m2-19-formula","type":"numeric","level":3,"review":"rule","sources":["substitution"],"vars":{"l":{"int":[5,30]},"w":{"int":[2,20]},"two":2},"prompt":"The perimeter of a rectangle is P = 2(l + w). Find P when l = {l} cm and w = {w} cm.","answer":"2 * (l + w)","misconceptions":[{"id":"no-brackets","wrong":"2 * l + w","explain":"Work out the brackets first: {two} × ({l} + {w})."},{"id":"area","wrong":"l * w","explain":"That is the area, l × w. The perimeter is {two}(l + w)."}],"solution":["Brackets first: l + w = {l} + {w} = {l + w}.","P = {two} × {l + w} = {answer} cm."],"where":["w \u003c l"],"unit":"cm"},{"id":"m2-19-simplify","type":"numeric","level":3,"review":"rule","sources":["substitution"],"vars":{"a":{"int":[2,9]},"b":{"int":[2,9]},"c":{"int":[-5,5]},"d":{"int":[-5,5]},"x":{"int":[-4,5]},"y":{"int":[-4,5]}},"prompt":"Simplify {poly([a, 'x'], [b, 'y'], [c, 'x'], [d, 'y'])}, then find its value when x = {x} and y = {y}.","answer":"(a + c) * x + (b + d) * y","misconceptions":[{"id":"no-signs","wrong":"(a + abs(c)) * x + (b + abs(d)) * y","explain":"Keep the sign in front of each term when you collect.","when":"c \u003c 0 || d \u003c 0"}],"solution":["Simplify: {poly([a, 'x'], [b, 'y'], [c, 'x'], [d, 'y'])} = {poly([a + c, 'x'], [b + d, 'y'])}.","Substitute: {a + c} × {br(x)} + {b + d} × {br(y)} = {(a + c) * x} + {br((b + d) * y)} = {answer}"],"where":["c != 0 && d != 0 && a + c > 0 && b + d > 0","x != 0 && y != 0","x \u003c 0 || y \u003c 0"],"signed":true}]},"20":{"subject":"mathematics","class":"Form 2","lesson_no":20,"language":"en","prerequisites":[19],"skills":[{"id":"m2-20","name":"Expanding brackets: a(b + c)"}],"note":{"status":"draft","text":"To expand a bracket, multiply every term inside by the term outside: a(b + c) = ab + ac.\n3(x + 4) = 3 × x + 3 × 4 = 3x + 12. Do not stop after the first term: 3(x + 4) is not 3x + 4.\nWith a minus inside: 5(2y − 3) = 10y − 15.\nWith a negative number outside, every sign inside changes: −2(x − 3) = −2x + 6, because (−2) × (−3) = 6.\nWith a letter outside: x(x + 4) = x² + 4x.\nExpand, then simplify: 3(x + 2) + 2(x − 1) = 3x + 6 + 2x − 2 = 5x + 4.","checks":[]},"worked_example":{"status":"draft","vars":{"a":3,"b":2,"c":2,"d":-1},"problem":"Expand and simplify {bracket(a, [1, 'x'], [b, ''])} + {bracket(c, [1, 'x'], [d, ''])}.","steps":["{bracket(a, [1, 'x'], [b, ''])} = {a} × x + {a} × {b} = {poly([a, 'x'], [a * b, ''])}.","{bracket(c, [1, 'x'], [d, ''])} = {c} × x + {c} × {br(d)} = {poly([c, 'x'], [c * d, ''])}.","Collect like terms: {poly([a, 'x'], [a * b, ''], [c, 'x'], [c * d, ''])} = {poly([a + c, 'x'], [a * b + c * d, ''])}."],"answer":"{poly([a + c, 'x'], [a * b + c * d, ''])}","checks":["a * b + c * d == 4"]},"teach":{"cards":[{"id":"c20-1","status":"draft","idea":"Multiply every term inside the bracket by the number outside.","vars":{"a":3,"b":4},"example":["{bracket(a, [1, 'x'], [b, ''])} = {a} × x + {a} × {b} = {poly([a, 'x'], [a * b, ''])}"],"checks":[],"check":{"ref":"m2-20-pos"}},{"id":"c20-2","status":"draft","idea":"A minus sign inside the bracket stays: multiply, and keep the minus.","vars":{"a":5,"b":2,"c":3},"example":["{bracket(a, [b, 'y'], [-c, ''])} = {a} × {b}y − {a} × {c} = {poly([a * b, 'y'], [-a * c, ''])}"],"checks":[],"check":{"ref":"m2-20-minus"}},{"id":"c20-3","status":"draft","idea":"A negative number outside changes every sign inside.","vars":{"a":-2,"b":-3},"example":["{bracket(a, [1, 'x'], [b, ''])} = {br(a)} × x + {br(a)} × {br(b)} = {poly([a, 'x'], [a * b, ''])}"],"checks":[],"check":{"id":"m2-20-c3","type":"mcq","level":1,"review":"rule","sources":["expansion"],"vars":{"a":{"int":[-9,-2]},"b":{"int":[-9,9]},"v":{"pick":["x","y","a","n"]}},"prompt":"Expand {bracket(a, [1, v], [b, ''])}.","correct":"{poly([a, v], [a * b, ''])}","distractors":[{"text":"{poly([a, v], [-a * b, ''])}","misconception":"sign"},{"text":"{poly([-a, v], [a * b, ''])}","misconception":"sign1"},{"text":"{poly([a, v], [b, ''])}","misconception":"first-only"}],"misconceptions":[{"id":"sign","explain":"{br(a)} × {br(b)} = {a * b}: check the sign of the second term."},{"id":"sign1","explain":"{br(a)} × {v} = {mono(a, v)}: the first term is negative."},{"id":"first-only","explain":"Multiply the second term too: {br(a)} × {br(b)} = {a * b}."}],"solution":["Multiply each term by {br(a)}: {br(a)} × {v} = {mono(a, v)} and {br(a)} × {br(b)} = {a * b}.","So the answer is {answer}."],"where":["b != 0 && abs(b) != 1","a * b != b"]}},{"id":"c20-4","status":"draft","idea":"A letter outside multiplies each term too: x × x = x².","vars":{"b":4},"example":["{bracket('x', [1, 'x'], [b, ''])} = x × x + x × {b} = {poly([1, 'x²'], [b, 'x'])}"],"checks":[],"check":{"id":"m2-20-c4","type":"mcq","level":1,"review":"rule","sources":["expansion"],"vars":{"b":{"int":[2,9]},"two":2},"prompt":"Expand x(x + {b}).","correct":"{poly([1, 'x²'], [b, 'x'])}","distractors":[{"text":"{poly([1, 'x²'], [b, ''])}","misconception":"constant"},{"text":"{poly([two, 'x'], [b, 'x'])}","misconception":"double"},{"text":"{poly([1, 'x'], [b, 'x'])}","misconception":"no-square"}],"misconceptions":[{"id":"constant","explain":"x × {b} = {b}x: the second term has the letter x."},{"id":"double","explain":"x × x = x², not {two}x."},{"id":"no-square","explain":"x × x = x², not x."}],"solution":["x × x = x² and x × {b} = {b}x.","So x(x + {b}) = {answer}."]}}]},"questions":[{"id":"m2-20-pos","type":"mcq","level":1,"review":"rule","sources":["expansion"],"vars":{"a":{"int":[2,9]},"b":{"int":[2,12]},"v":{"pick":["x","y","a","n","p"]}},"prompt":"Expand {bracket(a, [1, v], [b, ''])}.","correct":"{poly([a, v], [a * b, ''])}","distractors":[{"text":"{poly([a, v], [b, ''])}","misconception":"first-only"},{"text":"{poly([1, v], [a * b, ''])}","misconception":"second-only"},{"text":"{mono(a + a * b, v)}","misconception":"joined"}],"misconceptions":[{"id":"first-only","explain":"Multiply the second term too: {a} × {b} = {a * b}."},{"id":"second-only","explain":"Multiply the first term too: {a} × {v} = {mono(a, v)}."},{"id":"joined","explain":"{mono(a, v)} and {a * b} are unlike terms: they cannot be joined."}],"solution":["Multiply each term by {a}: {a} × {v} = {mono(a, v)} and {a} × {b} = {a * b}.","So the answer is {answer}."]},{"id":"m2-20-minus","type":"mcq","level":1,"review":"rule","sources":["expansion"],"vars":{"a":{"int":[2,9]},"b":{"int":[2,6]},"c":{"int":[1,9]},"v":{"pick":["x","y","a","t"]}},"prompt":"Expand {bracket(a, [b, v], [-c, ''])}.","correct":"{poly([a * b, v], [-a * c, ''])}","distractors":[{"text":"{poly([a * b, v], [a * c, ''])}","misconception":"sign"},{"text":"{poly([a * b, v], [-c, ''])}","misconception":"first-only"},{"text":"{poly([a + b, v], [-a * c, ''])}","misconception":"added"}],"misconceptions":[{"id":"sign","explain":"Keep the minus: {a} × ({-c}) = {-a * c}."},{"id":"first-only","explain":"Multiply the second term too: {a} × {c} = {a * c}."},{"id":"added","explain":"Multiply, do not add: {a} × {mono(b, v)} = {mono(a * b, v)}."}],"solution":["{a} × {mono(b, v)} = {mono(a * b, v)} and {a} × ({-c}) = {-a * c}.","So the answer is {answer}."],"where":["a * b != a + b"]},{"id":"m2-20-neg","type":"mcq","level":2,"review":"rule","sources":["expansion"],"vars":{"a":{"int":[-7,-2]},"b":{"int":[2,5]},"c":{"int":[-9,9]}},"prompt":"Expand {bracket(a, [b, 'x'], [c, ''])}.","correct":"{poly([a * b, 'x'], [a * c, ''])}","distractors":[{"text":"{poly([a * b, 'x'], [-a * c, ''])}","misconception":"sign"},{"text":"{poly([-a * b, 'x'], [a * c, ''])}","misconception":"sign1"},{"text":"{poly([a * b, 'x'], [c, ''])}","misconception":"first-only"}],"misconceptions":[{"id":"sign","explain":"{br(a)} × {br(c)} = {a * c}: check the sign."},{"id":"sign1","explain":"{br(a)} × {mono(b, 'x')} = {mono(a * b, 'x')}: check the sign."},{"id":"first-only","explain":"Multiply the second term too."}],"solution":["{br(a)} × {mono(b, 'x')} = {mono(a * b, 'x')} and {br(a)} × {br(c)} = {a * c}.","So the answer is {answer}."],"where":["c != 0 && abs(c) != 1"]},{"id":"m2-20-letter","type":"mcq","level":2,"review":"rule","sources":["expansion"],"vars":{"k":{"int":[2,7]},"b":{"int":[2,9]},"v":{"pick":["x","y","a"]}},"prompt":"Expand {mono(k, v)}({v} + {b}).","correct":"{poly([k, v + '²'], [k * b, v])}","distractors":[{"text":"{poly([k, v + '²'], [k * b, ''])}","misconception":"constant"},{"text":"{poly([k, v], [k * b, v])}","misconception":"no-square"},{"text":"{poly([k, v + '²'], [b, v])}","misconception":"partly"}],"misconceptions":[{"id":"constant","explain":"{mono(k, v)} × {b} = {mono(k * b, v)}: it keeps the letter."},{"id":"no-square","explain":"{v} × {v} = {v}²."},{"id":"partly","explain":"Multiply the number too: {mono(k, v)} × {b} = {mono(k * b, v)}."}],"solution":["{mono(k, v)} × {v} = {mono(k, v + '²')} and {mono(k, v)} × {b} = {mono(k * b, v)}.","So the answer is {answer}."],"where":["k != b"]},{"id":"m2-20-simplify","type":"mcq","level":3,"review":"rule","sources":["expansion"],"vars":{"a":{"int":[2,6]},"b":{"int":[1,9]},"c":{"int":[2,6]},"d":{"int":[-9,-1]}},"prompt":"Expand and simplify {bracket(a, [1, 'x'], [b, ''])} + {bracket(c, [1, 'x'], [d, ''])}.","correct":"{poly([a + c, 'x'], [a * b + c * d, ''])}","distractors":[{"text":"{poly([a + c, 'x'], [b + d, ''])}","misconception":"first-only"},{"text":"{poly([a + c, 'x'], [a * b - c * d, ''])}","misconception":"sign"},{"text":"{poly([a * c, 'x'], [a * b + c * d, ''])}","misconception":"times"}],"misconceptions":[{"id":"first-only","explain":"Multiply each number inside by the number outside: {a} × {b} and {c} × {br(d)}."},{"id":"sign","explain":"{c} × {br(d)} = {c * d}: keep the sign."},{"id":"times","explain":"Add the x terms: {a}x + {c}x = {a + c}x."}],"solution":["{bracket(a, [1, 'x'], [b, ''])} = {poly([a, 'x'], [a * b, ''])} and {bracket(c, [1, 'x'], [d, ''])} = {poly([c, 'x'], [c * d, ''])}.","Collect: {poly([a, 'x'], [a * b, ''], [c, 'x'], [c * d, ''])} = {answer}."],"where":["a * b + c * d != 0","a * c != a + c","c * d != 0"]}]},"21":{"subject":"mathematics","class":"Form 2","lesson_no":21,"language":"en","prerequisites":[19],"skills":[{"id":"m2-21","name":"Solving simple linear equations"}],"note":{"status":"draft","text":"An equation says that two expressions are equal, for example 2x + 3 = 11. The solution is the value of x that makes it true.\nTo solve, do the same thing to both sides, to get x on its own:\n• x + 5 = 12: subtract 5 from both sides, x = 7.\n• x − 4 = 9: add 4 to both sides, x = 13.\n• 3x = 18: divide both sides by 3, x = 6.\n• x ÷ 4 = 3: multiply both sides by 4, x = 12.\nTwo steps: 2x + 3 = 11. Subtract 3: 2x = 8. Divide by 2: x = 4.\nAlways check: put your answer back in. 2 × 4 + 3 = 11 ✓.","checks":[]},"worked_example":{"status":"draft","vars":{"a":3,"b":7,"c":22},"problem":"Solve {poly([a, 'x'], [b, ''])} = {c}, and check the answer.","steps":["Subtract {b} from both sides: {mono(a, 'x')} = {c} − {b} = {c - b}.","Divide both sides by {a}: x = {c - b} ÷ {a} = {(c - b) / a}.","Check: {a} × {(c - b) / a} + {b} = {a * (c - b) / a} + {b} = {c} ✓"],"answer":"x = {(c - b) / a}","checks":["(c - b) / a == 5"]},"teach":{"cards":[{"id":"c21-1","status":"draft","idea":"The solution of an equation is the number that makes both sides equal.","vars":{"a":2,"b":3,"s":4},"example":["Is x = {s} a solution of {poly([a, 'x'], [b, ''])} = {a * s + b}? {a} × {s} + {b} = {a * s + b}: yes."],"checks":[],"check":{"id":"m2-21-c1","type":"mcq","level":1,"review":"rule","sources":["equations"],"vars":{"a":{"int":[2,6]},"b":{"int":[1,12]},"s":{"int":[1,9]},"e":{"pick":[0,0,1,-1,2]},"t":{"expr":"s + e"}},"prompt":"Is x = {t} a solution of {poly([a, 'x'], [b, ''])} = {a * s + b}?","correct":"{t == s ? 'Yes' : 'No'}","distractors":[{"text":"{t == s ? 'No' : 'Yes'}","misconception":"flip"}],"misconceptions":[{"id":"flip","explain":"Put x = {t} in: {a} × {br(t)} + {b} = {a * t + b}, and the right side is {a * s + b}."}],"solution":["Put x = {t} in: {a} × {br(t)} + {b} = {a * t + b}.","{t == s ? 'That is equal to the right side' : 'That is not ' + fmt(a * s + b)}, so the answer is {answer}."],"show":2}},{"id":"c21-2","status":"draft","idea":"To undo adding, subtract from both sides. To undo subtracting, add to both sides.","vars":{"a":5,"b":12,"c":9},"example":["x + {a} = {b}: subtract {a}, x = {b - a}.","x − {a} = {c}: add {a}, x = {c + a}."],"checks":[],"check":{"ref":"m2-21-add"}},{"id":"c21-3","status":"draft","idea":"To undo multiplying, divide both sides. To undo dividing, multiply both sides.","vars":{"a":3,"s":6},"example":["{mono(a, 'x')} = {a * s}: divide by {a}, x = {s}.","x ÷ {a} = {s}: multiply by {a}, x = {a * s}."],"checks":[],"check":{"ref":"m2-21-mul"}},{"id":"c21-4","status":"draft","idea":"With two steps, undo the adding or subtracting first, then the multiplying.","vars":{"a":2,"b":3,"s":4},"example":["{poly([a, 'x'], [b, ''])} = {a * s + b}: subtract {b}, {mono(a, 'x')} = {a * s}; divide by {a}, x = {s}."],"checks":[],"check":{"id":"m2-21-c4","type":"numeric","level":1,"review":"rule","sources":["equations"],"vars":{"a":{"int":[2,5]},"b":{"int":[1,9]},"s":{"int":[1,9]}},"prompt":"Solve {poly([a, 'x'], [b, ''])} = {a * s + b}.","answer":"s","misconceptions":[{"id":"divide-first","wrong":"(a * s + b) / a","explain":"Undo the + {b} first, then divide.","when":"isInt((a * s + b) / a)"},{"id":"one-step","wrong":"a * s","explain":"That is {mono(a, 'x')}. Now divide by {a}."}],"solution":["Subtract {b} from both sides: {mono(a, 'x')} = {a * s}.","Divide both sides by {a}: x = {answer}."]}}]},"questions":[{"id":"m2-21-add","type":"numeric","level":1,"review":"rule","sources":["equations"],"vars":{"a":{"int":[-15,15]},"s":{"int":[-10,20]}},"prompt":"Solve {poly([1, 'x'], [a, ''])} = {s + a}.","answer":"s","misconceptions":[{"id":"wrong-way","wrong":"s + 2 * a","explain":"Do the opposite: {a \u003c 0 ? 'add' : 'subtract'} {abs(a)} to get x on its own."}],"solution":["{a \u003c 0 ? 'Add ' + fmt(-a) + ' to' : 'Subtract ' + a + ' from'} both sides.","x = {s + a} {a \u003c 0 ? '+' : '−'} {abs(a)} = {answer}"],"where":["a != 0","s != 0"],"signed":true},{"id":"m2-21-mul","type":"numeric","level":1,"review":"rule","sources":["equations"],"vars":{"a":{"int":[-9,9]},"s":{"int":[-9,12]}},"prompt":"Solve {mono(a, 'x')} = {a * s}.","answer":"s","misconceptions":[{"id":"subtracted","wrong":"a * s - a","explain":"{mono(a, 'x')} means {a} × x: divide by {a}, do not subtract."},{"id":"sign","wrong":"-s","explain":"Check the sign: {a * s} ÷ {br(a)} = {s}."}],"solution":["Divide both sides by {a}.","x = {a * s} ÷ {br(a)} = {answer}"],"where":["abs(a) > 1","s != 0 && s != 1"],"signed":true},{"id":"m2-21-div","type":"numeric","level":2,"review":"rule","sources":["equations"],"vars":{"a":{"int":[2,9]},"s":{"int":[-9,12]}},"prompt":"Solve x ÷ {a} = {s}.","answer":"a * s","misconceptions":[{"id":"divided","wrong":"s / a","explain":"Undo dividing by multiplying both sides by {a}.","when":"isInt(s / a)"}],"solution":["Multiply both sides by {a}.","x = {s} × {a} = {answer}"],"where":["s != 0"],"signed":true},{"id":"m2-21-two","type":"numeric","level":2,"review":"rule","sources":["equations"],"vars":{"a":{"int":[2,9]},"b":{"int":[-20,20]},"s":{"int":[-6,12]}},"prompt":"Solve {poly([a, 'x'], [b, ''])} = {a * s + b}.","answer":"s","misconceptions":[{"id":"one-step","wrong":"a * s","explain":"That is {mono(a, 'x')}: now divide by {a}."},{"id":"wrong-way","wrong":"(a * s + 2 * b) / a","explain":"Do the opposite of {b \u003c 0 ? '− ' + fmt(-b) : '+ ' + fmt(b)}.","when":"isInt((a * s + 2 * b) / a)"}],"solution":["{b \u003c 0 ? 'Add ' + fmt(-b) + ' to' : 'Subtract ' + fmt(b) + ' from'} both sides: {mono(a, 'x')} = {a * s}.","Divide both sides by {a}: x = {answer}."],"where":["b != 0 && s != 0"],"signed":true},{"id":"m2-21-story","type":"numeric","level":3,"review":"rule","sources":["equations"],"vars":{"a":{"int":[2,9]},"b":{"int":[1,20]},"s":{"int":[2,15]}},"prompt":"Bih thinks of a number. She multiplies it by {a}, then subtracts {b}. The answer is {a * s - b}. What was her number?","answer":"s","misconceptions":[{"id":"backwards","wrong":"(a * s - b - b) / a","explain":"Undo − {b} by adding {b}, not subtracting.","when":"isInt((a * s - 2 * b) / a)"},{"id":"one-step","wrong":"a * s","explain":"That is {a} times the number: divide by {a}."}],"solution":["Call the number x: {poly([a, 'x'], [-b, ''])} = {a * s - b}.","Add {b}: {mono(a, 'x')} = {a * s}.","Divide by {a}: x = {answer}."]},{"id":"m2-21-both","type":"numeric","level":3,"review":"rule","sources":["equations"],"vars":{"a":{"int":[3,9]},"c":{"int":[1,7]},"s":{"int":[-6,9]},"b":{"int":[-12,12]},"d":{"expr":"(a - c) * s + b"}},"prompt":"Solve {poly([a, 'x'], [b, ''])} = {poly([c, 'x'], [d, ''])}.","answer":"s","misconceptions":[{"id":"added-x","wrong":"(d - b) / (a + c)","explain":"Take the x terms to one side by subtracting {mono(c, 'x')}, not adding.","when":"isInt((d - b) / (a + c))"}],"solution":["Subtract {mono(c, 'x')} from both sides: {poly([a - c, 'x'], [b, ''])} = {d}.","{b \u003c 0 ? 'Add ' + fmt(-b) + ' to' : 'Subtract ' + fmt(b) + ' from'} both sides: {mono(a - c, 'x')} = {d - b}.","Divide by {a - c}: x = {answer}."],"where":["a > c","b != 0 && s != 0 && d != 0"],"signed":true}]},"22":{"subject":"mathematics","class":"Form 2","lesson_no":22,"language":"en","prerequisites":[2],"skills":[{"id":"m2-22","name":"Inequalities: the signs \u003c, >, ≤ and ≥"}],"note":{"status":"draft","text":"An inequality compares two numbers or expressions that may not be equal.\n• \u003c means “is less than”: 3 \u003c 7.   • > means “is greater than”: 7 > 3.\n• ≤ means “is less than or equal to”. • ≥ means “is greater than or equal to”.\nThe point of the sign always points to the smaller number.\nWith negative numbers, look at the number line: −5 \u003c −2, because −5 is further left.\nx \u003c 3 means x can be any number less than 3 (but not 3). x ≥ 3 means 3 or any number above it.\nWords: “at least 18” means ≥ 18; “at most 40” means ≤ 40; “more than 5” means > 5; “fewer than 10” means \u003c 10.","checks":[]},"worked_example":{"status":"draft","vars":{"a":-4,"b":-1,"k":3},"problem":"Put the right sign, \u003c or >, between {a} and {b}. Then say whether x = {k} satisfies x ≥ {k}.","steps":["On the number line {a} is to the left of {b}, so {a} is smaller: {a} \u003c {b}.","x ≥ {k} means “x is greater than or equal to {k}”. {k} is equal to {k}, so x = {k} satisfies it."],"answer":"{a} \u003c {b}, and yes, x = {k} satisfies x ≥ {k}.","checks":["a \u003c b"]},"teach":{"cards":[{"id":"c22-1","status":"draft","idea":"The sign \u003c means “is less than” and > means “is greater than”. The point always faces the smaller number.","vars":{"a":3,"b":7},"example":["{a} \u003c {b}: {a} is less than {b}.","{b} > {a}: {b} is greater than {a}."],"checks":[],"check":{"ref":"m2-22-compare"}},{"id":"c22-2","status":"draft","idea":"≤ and ≥ also allow the two sides to be equal.","vars":{"k":5},"example":["x ≤ {k}: x can be {k}, or any number less than {k}.","x \u003c {k}: x can be any number less than {k}, but not {k}."],"checks":[],"check":{"id":"m2-22-c2","type":"mcq","level":1,"review":"rule","sources":["inequalities"],"vars":{"op":{"pick":["\u003c",">","≤","≥"]},"k":{"int":[-6,8]},"v":{"expr":"op == '\u003c' ? k - 2 : (op == '>' ? k + 3 : k)"},"w":{"expr":"op == '\u003c' || op == '≤' ? k + 2 : k - 2"},"u":{"expr":"op == '≤' ? k + 5 : k - 5"}},"prompt":"Which value of x satisfies {ineq('x', op, k)}?","correct":"{v}","distractors":[{"text":"{w}","misconception":"other"},{"text":"{op == '\u003c' || op == '>' ? k : u}","misconception":"edge"}],"misconceptions":[{"id":"other","explain":"{w} is not {opWords(op)} {k}."},{"id":"edge","explain":"{op == '\u003c' || op == '>' ? 'The sign ' + op + ' does not include ' + fmt(k) + ' itself.' : fmt(u) + ' is not ' + opWords(op) + ' ' + fmt(k) + '.'}"}],"solution":["{ineq('x', op, k)} means x is {opWords(op)} {k}.","{answer} is {opWords(op)} {k}, so it works."],"show":3}},{"id":"c22-3","status":"draft","idea":"Words become signs: “at least” is ≥, “at most” is ≤, “more than” is >, “fewer than” or “less than” is \u003c.","vars":{"a":18,"b":40},"example":["“At least {a} pupils”: number ≥ {a}.","“At most {b} kg”: mass ≤ {b}."],"checks":[],"check":{"ref":"m2-22-words"}},{"id":"c22-4","status":"draft","idea":"With negative numbers, the number further left on the number line is smaller.","vars":{"a":-5,"b":-2,"c":1},"example":["{a} \u003c {b}: {a} is further left.","{c} > {a}: every positive number is greater than every negative number."],"checks":[],"figure":"numberLine(-6, 2, [['P', a], ['Q', b]])","check":{"ref":"m2-22-negative"}}]},"questions":[{"id":"m2-22-compare","type":"cloze","level":1,"review":"rule","sources":["inequalities"],"vars":{"a":{"int":[0,50]},"b":{"int":[0,50]}},"prompt":"Choose the sign that makes the statement true.","text":"{a} ___ {b}","answer":"a \u003c b ? '\u003c' : '>'","choices":[{"text":"\u003c","misconception":"lt"},{"text":">","misconception":"gt"},{"text":"=","misconception":"eq"}],"misconceptions":[{"id":"lt","explain":"\u003c means “is less than”, but {a} is greater than {b}."},{"id":"gt","explain":"> means “is greater than”, but {a} is less than {b}."},{"id":"eq","explain":"{a} and {b} are not equal."}],"where":["a != b"]},{"id":"m2-22-negative","type":"cloze","level":1,"review":"rule","sources":["inequalities"],"vars":{"a":{"int":[-12,5]},"b":{"int":[-12,5]}},"prompt":"Choose the sign that makes the statement true.","text":"{a} ___ {b}","answer":"a \u003c b ? '\u003c' : '>'","choices":[{"text":"\u003c","misconception":"lt"},{"text":">","misconception":"gt"},{"text":"=","misconception":"eq"}],"misconceptions":[{"id":"lt","explain":"On the number line {a} is to the right of {b}, so {a} is greater."},{"id":"gt","explain":"On the number line {a} is to the left of {b}, so {a} is smaller."},{"id":"eq","explain":"{a} and {b} are not equal."}],"where":["a != b","a \u003c 0 && b \u003c 0 || a * b \u003c 0"]},{"id":"m2-22-words","type":"mcq","level":1,"review":"rule","sources":["inequalities"],"vars":{"k":{"int":[5,60]},"W":{"pick":[["A class must have at least {k} pupils.","≥","at least"],["A bag can hold at most {k} kg.","≤","at most"],["More than {k} people came to the meeting.",">","more than"],["Fewer than {k} cars were in the park.","\u003c","fewer than"]]}},"prompt":"{W[0]} Which inequality says this, with n for the number?","correct":"{ineq('n', W[1], k)}","distractors":[{"text":"{ineq('n', flipOp(W[1]), k)}","misconception":"flip"},{"text":"{ineq('n', W[1] == '≥' || W[1] == '≤' ? strictOp(W[1]) : looseOp(W[1]), k)}","misconception":"edge"}],"misconceptions":[{"id":"flip","explain":"The sign points the wrong way: “{W[2]}” means {opWords(W[1])}."},{"id":"edge","explain":"{W[1] == '≥' || W[1] == '≤' ? 'The number ' + fmt(k) + ' itself is allowed, so use ' + W[1] + '.' : 'The number ' + fmt(k) + ' itself is not allowed, so use ' + W[1] + '.'}"}],"solution":["“{W[2]}” means {opWords(W[1])}.","So the inequality is {answer}."],"show":3},{"id":"m2-22-read","type":"mcq","level":2,"review":"rule","sources":["inequalities"],"vars":{"op":{"pick":["\u003c",">","≤","≥"]},"k":{"int":[-10,20]}},"prompt":"How do you read {ineq('x', op, k)}?","correct":"x is {opWords(op)} {k}","distractors":[{"text":"x is {opWords(flipOp(op))} {k}","misconception":"flip"},{"text":"x is {opWords(op == '\u003c' || op == '>' ? looseOp(op) : strictOp(op))} {k}","misconception":"edge"}],"misconceptions":[{"id":"flip","explain":"The point of the sign faces the smaller side: {op} means {opWords(op)}."},{"id":"edge","explain":"{op == '\u003c' || op == '>' ? 'With ' + op + ' the number ' + fmt(k) + ' itself is not included.' : 'With ' + op + ' the number ' + fmt(k) + ' itself is included.'}"}],"solution":["The sign {op} means “{opWords(op)}”.","So {ineq('x', op, k)} reads: {answer}."],"show":3},{"id":"m2-22-which","type":"mcq","level":2,"review":"rule","sources":["inequalities"],"vars":{"op":{"pick":["\u003c",">","≤","≥"]},"k":{"int":[-8,8]},"d":{"int":[1,6]},"v":{"expr":"op == '\u003c' || op == '≤' ? k - d : k + d"},"w1":{"expr":"op == '\u003c' || op == '≤' ? k + d : k - d"},"w2":{"expr":"op == '\u003c' || op == '≤' ? k + d + 3 : k - d - 3"},"w3":{"expr":"op == '\u003c' || op == '≤' ? k + 1 : k - 1"}},"prompt":"Which of these numbers satisfies {ineq('x', op, k)}?","correct":"{v}","distractors":[{"text":"{w1}","misconception":"w1"},{"text":"{w2}","misconception":"w2"},{"text":"{op == '\u003c' || op == '>' ? k : w3}","misconception":"edge"}],"misconceptions":[{"id":"w1","explain":"{w1} is not {opWords(op)} {k}."},{"id":"w2","explain":"{w2} is not {opWords(op)} {k}."},{"id":"edge","explain":"{op == '\u003c' || op == '>' ? 'The sign ' + op + ' leaves out ' + fmt(k) + ' itself.' : fmt(w3) + ' is not ' + opWords(op) + ' ' + fmt(k) + '.'}"}],"solution":["{ineq('x', op, k)} means x is {opWords(op)} {k}.","Only {answer} is {opWords(op)} {k}."],"where":["w3 != w1 && w3 != w2"]},{"id":"m2-22-spot","type":"spot_error","level":3,"review":"rule","sources":["inequalities"],"vars":{"a":{"int":[-9,-5]},"b":{"int":[-4,-1]},"c":{"int":[1,9]}},"prompt":"Which statement is false?","pool":{"right":[{"text":"{a} \u003c {b}","truth":"a \u003c b"},{"text":"{c} > {a}","truth":"c > a"},{"text":"{b} ≤ {b}","truth":"b \u003c= b"},{"text":"{c} ≥ {b}","truth":"c >= b"}],"wrong":[{"text":"{a} > {b}","truth":"a > b","explain":"{a} is further left on the number line, so {a} \u003c {b}."},{"text":"{b} \u003c {b}","truth":"b \u003c b","explain":"A number is not less than itself; {b} ≤ {b} is true."},{"text":"{a} ≥ {c}","truth":"a >= c","explain":"{a} is negative and {c} is positive, so {a} \u003c {c}."}]},"pick":{"right":3,"wrong":1}}]},"23":{"subject":"mathematics","class":"Form 2","lesson_no":23,"language":"en","prerequisites":[21,22],"skills":[{"id":"m2-23","name":"Solving linear inequalities"}],"note":{"status":"draft","text":"Solve an inequality like an equation, doing the same thing to both sides:\n• Adding or subtracting the same number keeps the sign: x + 3 \u003c 7 gives x \u003c 4.\n• Multiplying or dividing by a positive number keeps the sign: 2x ≥ 10 gives x ≥ 5.\n• Multiplying or dividing by a negative number turns the sign round: −3x \u003c 6 gives x > −2. (Check: x = 0 works, because −3 × 0 = 0 \u003c 6.)\nTwo steps: 2x + 1 > 9. Subtract 1: 2x > 8. Divide by 2: x > 4.\nThe whole-number solutions can be listed: if x \u003c 4 and x is a natural number, x can be 0, 1, 2 or 3.","checks":[]},"worked_example":{"status":"draft","vars":{"a":3,"b":2,"c":14,"one":1},"problem":"Solve {poly([a, 'x'], [b, ''])} ≤ {c}, then list the natural numbers that satisfy it.","steps":["Subtract {b} from both sides: {mono(a, 'x')} ≤ {c - b}.","Divide both sides by {a}, a positive number, so the sign stays: x ≤ {(c - b) / a}.","The natural numbers that are less than or equal to {(c - b) / a}: {solutionsIn(0, (c - b) / a, '≤', (c - b) / a)}."],"answer":"x ≤ {(c - b) / a}: x = {solutionsIn(0, (c - b) / a, '≤', (c - b) / a)}","checks":["(c - b) / a == 4"]},"teach":{"cards":[{"id":"c23-1","status":"draft","idea":"Adding or subtracting the same number on both sides keeps the inequality sign.","vars":{"a":3,"b":7},"example":["x + {a} \u003c {b}: subtract {a}, x \u003c {b - a}."],"checks":[],"check":{"ref":"m2-23-add"}},{"id":"c23-2","status":"draft","idea":"Dividing both sides by a positive number keeps the sign.","vars":{"a":2,"k":5},"example":["{mono(a, 'x')} ≥ {a * k}: divide by {a}, x ≥ {k}."],"checks":[],"check":{"ref":"m2-23-mul"}},{"id":"c23-3","status":"draft","idea":"Dividing both sides by a negative number turns the sign round.","vars":{"a":-3,"k":-2,"one":1},"example":["{mono(a, 'x')} \u003c {a * k}: divide by {br(a)} and turn the sign: x > {k}.","Check with x = {k + one}: {a} × {br(k + one)} = {a * (k + one)}, which is less than {a * k}."],"checks":[],"check":{"id":"m2-23-c3","type":"mcq","level":1,"review":"rule","sources":["inequalities"],"vars":{"a":{"int":[-6,-2]},"k":{"int":[-6,6]},"op":{"pick":["\u003c",">","≤","≥"]}},"prompt":"Solve {mono(a, 'x')} {op} {a * k}.","correct":"{ineq('x', flipOp(op), k)}","distractors":[{"text":"{ineq('x', op, k)}","misconception":"kept"},{"text":"{ineq('x', flipOp(op), -k)}","misconception":"sign"}],"misconceptions":[{"id":"kept","explain":"You divided by a negative number, {br(a)}: the sign must turn round."},{"id":"sign","explain":"{a * k} ÷ {br(a)} = {k}: check the sign of the number."}],"solution":["Divide both sides by {br(a)}, a negative number, so the sign turns round.","{answer}"],"where":["k != 0"],"show":3}},{"id":"c23-4","status":"draft","idea":"The whole-number solutions of an inequality can be listed.","vars":{"k":4},"example":["x \u003c {k} with x a natural number: x = {solutionsIn(0, k, '\u003c', k)}."],"checks":[],"check":{"id":"m2-23-c4","type":"mcq","level":1,"review":"rule","sources":["inequalities"],"vars":{"op":{"pick":["\u003c","≤"]},"k":{"int":[2,6]},"z":0},"prompt":"x is a natural number (0, 1, 2, …) and {ineq('x', op, k)}. Which list gives all the possible values of x?","correct":"{solutionsIn(0, k, op, k)}","distractors":[{"text":"{solutionsIn(0, k, op == '\u003c' ? '≤' : '\u003c', k)}","misconception":"edge"},{"text":"{solutionsIn(1, k, op, k)}","misconception":"zero"}],"misconceptions":[{"id":"edge","explain":"{op == '\u003c' ? 'The sign \u003c leaves out ' + fmt(k) + '.' : 'The sign ≤ includes ' + fmt(k) + '.'}"},{"id":"zero","explain":"{z} is a natural number too, and it is {opWords(op)} {k}."}],"solution":["{ineq('x', op, k)} means x is {opWords(op)} {k}, and natural numbers start at {z}.","So x = {answer}."],"show":3}}]},"questions":[{"id":"m2-23-add","type":"mcq","level":1,"review":"rule","sources":["inequalities"],"vars":{"b":{"int":[-9,9]},"c":{"int":[-10,15]},"op":{"pick":["\u003c",">","≤","≥"]}},"prompt":"Solve x {b \u003c 0 ? '−' : '+'} {abs(b)} {op} {c}.","correct":"{ineq('x', op, c - b)}","distractors":[{"text":"{ineq('x', op, c + b)}","misconception":"wrong-way"},{"text":"{ineq('x', flipOp(op), c - b)}","misconception":"flip"}],"misconceptions":[{"id":"wrong-way","explain":"Do the opposite: {b \u003c 0 ? 'add ' + fmt(-b) : 'subtract ' + fmt(b)}."},{"id":"flip","explain":"Adding or subtracting never turns the sign round."}],"solution":["{b \u003c 0 ? 'Add ' + fmt(-b) + ' to' : 'Subtract ' + fmt(b) + ' from'} both sides; the sign stays.","{answer}"],"where":["b != 0"],"show":3},{"id":"m2-23-mul","type":"mcq","level":1,"review":"rule","sources":["inequalities"],"vars":{"a":{"int":[2,9]},"k":{"int":[-8,10]},"op":{"pick":["\u003c",">","≤","≥"]}},"prompt":"Solve {mono(a, 'x')} {op} {a * k}.","correct":"{ineq('x', op, k)}","distractors":[{"text":"{ineq('x', flipOp(op), k)}","misconception":"flip"},{"text":"{ineq('x', op, a * k - a)}","misconception":"subtracted"}],"misconceptions":[{"id":"flip","explain":"{a} is positive, so the sign stays the same."},{"id":"subtracted","explain":"{mono(a, 'x')} means {a} × x: divide by {a}."}],"solution":["Divide both sides by {a}, a positive number: the sign stays.","{answer}"],"where":["k != 0"],"show":3},{"id":"m2-23-two","type":"mcq","level":2,"review":"rule","sources":["inequalities"],"vars":{"a":{"int":[2,6]},"b":{"int":[-12,12]},"k":{"int":[-5,9]},"op":{"pick":["\u003c",">","≤","≥"]}},"prompt":"Solve {poly([a, 'x'], [b, ''])} {op} {a * k + b}.","correct":"{ineq('x', op, k)}","distractors":[{"text":"{ineq('x', flipOp(op), k)}","misconception":"flip"},{"text":"{ineq('x', op, a * k)}","misconception":"one-step"},{"text":"{ineq('x', op, k + 2 * b / a)}","misconception":"wrong-way"}],"misconceptions":[{"id":"flip","explain":"You divided by a positive number: the sign stays."},{"id":"one-step","explain":"That is {mono(a, 'x')}: now divide by {a}."},{"id":"wrong-way","explain":"Undo {b \u003c 0 ? '− ' + fmt(-b) : '+ ' + fmt(b)} by doing the opposite."}],"solution":["{b \u003c 0 ? 'Add ' + fmt(-b) + ' to' : 'Subtract ' + fmt(b) + ' from'} both sides: {mono(a, 'x')} {op} {a * k}.","Divide by {a} (positive, the sign stays): {answer}."],"where":["b != 0","isInt(2 * b / a)","k + 2 * b / a != a * k"]},{"id":"m2-23-neg","type":"mcq","level":2,"review":"rule","sources":["inequalities"],"vars":{"a":{"int":[-5,-2]},"b":{"int":[1,12]},"k":{"int":[-6,6]},"op":{"pick":["\u003c",">","≤","≥"]}},"prompt":"Solve {mono(a, 'x')} + {b} {op} {a * k + b}.","correct":"{ineq('x', flipOp(op), k)}","distractors":[{"text":"{ineq('x', op, k)}","misconception":"kept"},{"text":"{ineq('x', flipOp(op), -k)}","misconception":"sign"},{"text":"{ineq('x', op, -k)}","misconception":"both"}],"misconceptions":[{"id":"kept","explain":"Dividing by a negative number turns the sign round."},{"id":"sign","explain":"{a * k} ÷ {br(a)} = {k}: check the sign."},{"id":"both","explain":"Turn the sign round, and check the number: {a * k} ÷ {br(a)} = {k}."}],"solution":["Subtract {b}: {mono(a, 'x')} {op} {a * k}.","Divide by {br(a)}, a negative number, and turn the sign round: {answer}."],"where":["k != 0"]},{"id":"m2-23-list","type":"mcq","level":3,"review":"rule","sources":["inequalities"],"vars":{"a":{"int":[2,5]},"b":{"int":[-9,9]},"k":{"int":[-2,3]},"op":{"pick":["\u003c",">","≤","≥"]},"lo":{"expr":"k - 3"},"hi":{"expr":"k + 3"}},"prompt":"x is a whole number from {lo} to {hi}. Which values satisfy {poly([a, 'x'], [b, ''])} {op} {a * k + b}?","correct":"{solutionsIn(lo, hi, op, k)}","distractors":[{"text":"{solutionsIn(lo, hi, op == '\u003c' || op == '>' ? looseOp(op) : strictOp(op), k)}","misconception":"edge"},{"text":"{solutionsIn(lo, hi, flipOp(op), k)}","misconception":"flip"}],"misconceptions":[{"id":"edge","explain":"{op == '\u003c' || op == '>' ? 'The sign ' + op + ' leaves out ' + fmt(k) + '.' : 'The sign ' + op + ' includes ' + fmt(k) + '.'}"},{"id":"flip","explain":"Those are the values on the other side of {k}."}],"solution":["Solve: {mono(a, 'x')} {op} {a * k}, so {ineq('x', op, k)}.","From {lo} to {hi}, the values with {ineq('x', op, k)} are {answer}."],"where":["b != 0"],"show":3},{"id":"m2-23-largest","type":"numeric","level":3,"review":"rule","sources":["inequalities"],"vars":{"a":{"int":[2,6]},"b":{"int":[-10,10]},"c":{"int":[5,40]},"ceil1":{"expr":"isInt((c - b) / a) ? (c - b) / a - 1 : floor((c - b) / a)"}},"prompt":"What is the largest whole number x such that {poly([a, 'x'], [b, ''])} \u003c {c}?","answer":"ceil1","misconceptions":[{"id":"edge","wrong":"(c - b) / a","explain":"x must be less than {(c - b) / a}, so x cannot be {(c - b) / a} itself.","when":"isInt((c - b) / a)"},{"id":"round-up","wrong":"floor((c - b) / a) + 1","explain":"x must be less than {round((c - b) / a, 2)}: round down.","when":"!isInt((c - b) / a)"}],"solution":["{b \u003c 0 ? 'Add ' + fmt(-b) + ' to' : 'Subtract ' + fmt(b) + ' from'} both sides: {mono(a, 'x')} \u003c {c - b}.","Divide by {a}: x \u003c {(c - b) / a}.","The largest whole number less than {(c - b) / a} is {answer}."],"where":["b != 0","c - b > a"]}]},"24":{"subject":"mathematics","class":"Form 2","lesson_no":24,"language":"en","prerequisites":[22,23],"skills":[{"id":"m2-24","name":"Showing inequalities on the number line"}],"note":{"status":"draft","text":"The solutions of an inequality can be shown on a number line.\n• A circle marks the end number. A filled circle (●) means the end number is included (≤ or ≥). An open circle (○) means it is not included (\u003c or >).\n• A thick line with an arrow shows all the other solutions: to the right for > and ≥, to the left for \u003c and ≤.\nx > 2: open circle at 2, arrow to the right. x ≤ −1: filled circle at −1, arrow to the left.\nTo show the solutions of 2x + 1 ≥ 7, solve first (x ≥ 3), then draw a filled circle at 3 and an arrow to the right.","checks":[]},"worked_example":{"status":"draft","vars":{"k":-1,"a":2,"b":3},"problem":"Solve {poly([a, 'x'], [b, ''])} \u003c {a * k + b} and describe how to show the solutions on a number line.","steps":["Subtract {b}: {mono(a, 'x')} \u003c {a * k}. Divide by {a}: x \u003c {k}.","The sign \u003c does not include {k}: draw an open circle at {k}.","Less than means to the left: draw a thick line from the circle with an arrow to the left."],"answer":"x \u003c {k}: open circle at {k}, arrow to the left.","checks":["a * k + b == 1"],"figure":"ineqLine('\u003c', k)"},"teach":{"cards":[{"id":"c24-1","status":"draft","idea":"A filled circle means the end number is included (≤, ≥). An open circle means it is not (\u003c, >).","vars":{"k":2},"example":["x ≥ {k}: filled circle at {k}.","x > {k}: open circle at {k}."],"checks":[],"figure":"ineqLine('≥', k)","check":{"id":"m2-24-c1","type":"mcq","level":1,"review":"rule","sources":["inequalities"],"vars":{"op":{"pick":["\u003c",">","≤","≥"]},"k":{"int":[-6,6]}},"prompt":"In the drawing of {ineq('x', op, k)} on a number line, what is the circle at {k} like?","correct":"{op == '≤' || op == '≥' ? 'filled' : 'open'}","distractors":[{"text":"{op == '≤' || op == '≥' ? 'open' : 'filled'}","misconception":"flip"}],"misconceptions":[{"id":"flip","explain":"{op == '≤' || op == '≥' ? 'The sign ' + op + ' includes ' + fmt(k) + ', so the circle is filled.' : 'The sign ' + op + ' does not include ' + fmt(k) + ', so the circle is open.'}"}],"solution":["{op == '≤' || op == '≥' ? 'The sign ' + op + ' includes ' + fmt(k) : 'The sign ' + op + ' does not include ' + fmt(k)}.","So the circle is {answer}."],"show":2}},{"id":"c24-2","status":"draft","idea":"The arrow points to the solutions: right for > and ≥, left for \u003c and ≤.","vars":{"k":1},"example":["x > {k}: arrow to the right.","x ≤ {k}: arrow to the left."],"checks":[],"figure":"ineqLine('>', k)","check":{"ref":"m2-24-read"}},{"id":"c24-3","status":"draft","idea":"To show the solutions of an inequality, solve it first, then draw the circle and the arrow.","vars":{"a":2,"b":1,"k":3},"example":["{poly([a, 'x'], [b, ''])} ≥ {a * k + b} gives x ≥ {k}: filled circle at {k}, arrow to the right."],"checks":[],"figure":"ineqLine('≥', k)","check":{"ref":"m2-24-describe"}}]},"questions":[{"id":"m2-24-read","type":"mcq","level":1,"review":"rule","sources":["inequalities"],"vars":{"op":{"pick":["\u003c",">","≤","≥"]},"k":{"int":[-5,5]}},"prompt":"Which inequality is shown on the number line?","correct":"{ineq('x', op, k)}","distractors":[{"text":"{ineq('x', flipOp(op), k)}","misconception":"flip"},{"text":"{ineq('x', op == '\u003c' || op == '>' ? looseOp(op) : strictOp(op), k)}","misconception":"edge"},{"text":"{ineq('x', op == '\u003c' || op == '>' ? looseOp(flipOp(op)) : strictOp(flipOp(op)), k)}","misconception":"both"}],"misconceptions":[{"id":"flip","explain":"Look at the arrow: it points to the {op == '>' || op == '≥' ? 'right' : 'left'}."},{"id":"edge","explain":"Look at the circle: it is {op == '≤' || op == '≥' ? 'filled' : 'open'}."},{"id":"both","explain":"Look at the arrow and at the circle."}],"solution":["The circle at {k} is {op == '≤' || op == '≥' ? 'filled, so ' + fmt(k) + ' is included' : 'open, so ' + fmt(k) + ' is not included'}.","The arrow points to the {op == '>' || op == '≥' ? 'right (greater numbers)' : 'left (smaller numbers)'}.","So the drawing shows {answer}."],"figure":"ineqLine(op, k)"},{"id":"m2-24-integers","type":"mcq","level":2,"review":"rule","sources":["inequalities"],"vars":{"op":{"pick":["\u003c",">","≤","≥"]},"k":{"int":[-4,4]}},"prompt":"The number line shows the solutions of an inequality. Which whole numbers from {k - 3} to {k + 3} are solutions?","correct":"{solutionsIn(k - 3, k + 3, op, k)}","distractors":[{"text":"{solutionsIn(k - 3, k + 3, op == '\u003c' || op == '>' ? looseOp(op) : strictOp(op), k)}","misconception":"edge"},{"text":"{solutionsIn(k - 3, k + 3, flipOp(op), k)}","misconception":"flip"}],"misconceptions":[{"id":"edge","explain":"Look at the circle at {k}: it is {op == '≤' || op == '≥' ? 'filled, so ' + fmt(k) + ' is a solution' : 'open, so ' + fmt(k) + ' is not a solution'}."},{"id":"flip","explain":"The arrow points to the {op == '>' || op == '≥' ? 'right' : 'left'}: those are the solutions."}],"solution":["The drawing shows {ineq('x', op, k)}.","From {k - 3} to {k + 3}, these numbers satisfy it: {answer}."],"figure":"ineqLine(op, k)","show":3},{"id":"m2-24-describe","type":"mcq","level":1,"review":"rule","sources":["inequalities"],"vars":{"op":{"pick":["\u003c",">","≤","≥"]},"k":{"int":[-6,6]}},"prompt":"How do you show {ineq('x', op, k)} on a number line?","correct":"{(op == '≤' || op == '≥' ? 'a filled' : 'an open') + ' circle at ' + fmt(k) + ' and an arrow to the ' + (op == '>' || op == '≥' ? 'right' : 'left')}","distractors":[{"text":"{(op == '≤' || op == '≥' ? 'an open' : 'a filled') + ' circle at ' + fmt(k) + ' and an arrow to the ' + (op == '>' || op == '≥' ? 'right' : 'left')}","misconception":"circle"},{"text":"{(op == '≤' || op == '≥' ? 'a filled' : 'an open') + ' circle at ' + fmt(k) + ' and an arrow to the ' + (op == '>' || op == '≥' ? 'left' : 'right')}","misconception":"arrow"},{"text":"{(op == '≤' || op == '≥' ? 'an open' : 'a filled') + ' circle at ' + fmt(k) + ' and an arrow to the ' + (op == '>' || op == '≥' ? 'left' : 'right')}","misconception":"both"}],"misconceptions":[{"id":"circle","explain":"The circle: {op == '≤' || op == '≥' ? 'filled, because ' + op + ' includes ' + fmt(k) : 'open, because ' + op + ' does not include ' + fmt(k)}."},{"id":"arrow","explain":"The arrow points to the solutions: {op == '>' || op == '≥' ? 'right' : 'left'}."},{"id":"both","explain":"Check both the circle and the arrow."}],"solution":["{op == '≤' || op == '≥' ? 'The sign includes ' + fmt(k) + ': filled circle' : 'The sign does not include ' + fmt(k) + ': open circle'}.","{op == '>' || op == '≥' ? 'Greater numbers are to the right' : 'Smaller numbers are to the left'}.","So: {answer}."]},{"id":"m2-24-solve","type":"mcq","level":3,"review":"rule","sources":["inequalities"],"vars":{"a":{"int":[2,5]},"b":{"int":[-9,9]},"k":{"int":[-4,4]},"op":{"pick":["\u003c",">","≤","≥"]}},"prompt":"The number line shows the solutions of one of these inequalities. Which one?","correct":"{poly([a, 'x'], [b, ''])} {op} {a * k + b}","distractors":[{"text":"{poly([a, 'x'], [b, ''])} {flipOp(op)} {a * k + b}","misconception":"flip"},{"text":"{poly([a, 'x'], [b, ''])} {op} {a * (k + 1) + b}","misconception":"number"},{"text":"{poly([a, 'x'], [b, ''])} {op == '\u003c' || op == '>' ? looseOp(op) : strictOp(op)} {a * k + b}","misconception":"edge"}],"misconceptions":[{"id":"flip","explain":"That inequality solves to {ineq('x', flipOp(op), k)}: the arrow would point the other way."},{"id":"number","explain":"That inequality solves to {ineq('x', op, k + 1)}: the circle would be at {k + 1}."},{"id":"edge","explain":"Look at the circle: {op == '≤' || op == '≥' ? 'filled, so the sign must include ' + fmt(k) : 'open, so the sign must not include ' + fmt(k)}."}],"solution":["The drawing shows {ineq('x', op, k)}.","Solve {answer}: {b \u003c 0 ? 'add ' + fmt(-b) : 'subtract ' + fmt(b)} and divide by {a} to get {ineq('x', op, k)}."],"where":["b != 0"],"figure":"ineqLine(op, k)"}]}},"f2-english":{"1":{"subject":"english-language","class":"Form 2","lesson_no":1,"language":"en","prerequisites":[],"skills":[{"id":"e2-1","name":"Talking about means of transport; reading about a journey"}],"note":{"status":"draft","text":"Ngwa travelled from Buea to Bamenda last Saturday. He bought a ticket at the agency office in the motor park. The bus left at seven o'clock. The driver checked every passenger's seat belt and the conductor loaded the luggage. The bus stopped at a checkpoint and at a roadside market. They arrived in the afternoon, and Ngwa's uncle was waiting for him.\nTalking about transport:\n• How do you travel to Bamenda? — I travel by bus. (by bus, by taxi, by train, by plane; but on foot)\n• How long does the journey take? — About six hours.\n• How much is the fare? — Five thousand francs.\nPublic transport is transport everyone can pay to use: buses, taxis, trains, ferries, planes.","checks":[]},"worked_example":{"status":"draft","vars":{"n":"Bih","t":"taxi","p":"Limbe"},"problem":"{n} goes to {p} every Saturday by {t}. Write two questions about her journey and her answers.","steps":["To ask about the means of transport, use How: “How do you go to {p}?” — “I go by {t}.”","To ask about time, use How long: “How long does the journey take?” — “About half an hour.”","Remember: by + the means of transport, with no a or the (by {t}); but on foot."],"answer":"“How do you go to {p}?” — “I go by {t}.” “How long does the journey take?” — “About half an hour.”","checks":[]},"teach":{"cards":[{"id":"c1-1","status":"draft","idea":"Read the text about Ngwa's journey. It answers: who, where, how, when and what happened.","vars":{},"example":["Ngwa travelled from Buea to Bamenda last Saturday. He went to the motor park early in the morning and bought a ticket at the agency office.","The bus left at seven o'clock. The driver checked that every passenger wore a seat belt, and the conductor put the luggage on the roof.","The road was good, but the bus stopped at a police checkpoint and for a short break at a roadside market, where Ngwa bought roasted plantains.","They arrived in Bamenda in the afternoon. Ngwa was tired but happy: his uncle was waiting for him at the park."],"checks":[],"check":{"id":"e2-1-c1","type":"mcq","level":1,"review":"authored","sources":["reading-text
