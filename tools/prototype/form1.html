},{"id":"m12-taxi-stops","type":"numeric","level":2,"vars":{"L":{"letters":3},"P":{"expr":"L[0]"},"Q":{"expr":"L[1]"},"R":{"expr":"L[2]"},"a":{"int":[2,40]},"b":{"int":[2,40]}},"where":"a != b","prompt":"Taxi stops {P}, {Q} and {R} are on a straight road, with {Q} between {P} and {R}. {P}{Q} = {a} km and {Q}{R} = {b} km. Find {P}{R}.","answer":"a + b","unit":"km","verify":"answer - a == b && answer > a && answer > b","misconceptions":[{"id":"difference","wrong":"abs(a - b)","explain":"{Q} is between {P} and {R}, so {P}{R} = {P}{Q} + {Q}{R}."}],"solution":["{Q} is between {P} and {R}, so {P}{R} = {P}{Q} + {Q}{R}.","{a} + {b} = {a + b} km."]},{"id":"m12-test","type":"mcq","level":3,"show":2,"vars":{"L":{"letters":3},"P":{"expr":"L[0]"},"Q":{"expr":"L[1]"},"R":{"expr":"L[2]"},"a":{"int":[2,20]},"b":{"int":[2,20]},"yes":{"pick":[true,false]},"gap":{"int":[1,"2 * min(a, b) - 1"]},"c":{"expr":"yes ? a + b : a + b - gap"}},"prompt":"{P}{Q} = {a} cm, {Q}{R} = {b} cm and {P}{R} = {c} cm. Is {Q} on the segment [{P}{R}]?","correct":"{a + b == c ? 'Yes' : 'No'}","distractors":[{"text":"Yes","misconception":"no-check"},{"text":"No","misconception":"no-check"}],"verify":"(answer == 'Yes') == (a + b == c) && c > abs(a - b)","misconceptions":[{"id":"no-check","explain":"Check the sum: {P}{Q} + {Q}{R} = {a} + {b} = {a + b} cm, and {P}{R} = {c} cm. {Q} is on [{P}{R}] only when the two are equal."}],"solution":["{P}{Q} + {Q}{R} = {a} + {b} = {a + b} cm, and {P}{R} = {c} cm.","{a + b == c ? 'They are equal, so ' + Q + ' is on [' + P + R + '].' : 'They are not equal, so ' + Q + ' is not on [' + P + R + '].'}","Answer: {answer}"]}]},"13":{"subject":"mathematics","class":"Form 1","lesson_no":13,"language":"en","prerequisites":[3],"note":{"status":"draft","text":"Length tells us how long something is. The distance between two points is the length of the straight segment that joins them.\n\nThe main unit of length is the metre (m). Each unit is ten times bigger than the next one on its right:\nkm   hm   dam   m   dm   cm   mm\nSo 1 km = 1000 m, 1 m = 100 cm and 1 cm = 10 mm.\n\nTo change to a smaller unit, multiply by 10 for each step to the right:\n3.5 km = 3500 m (three steps: × 1000).\nTo change to a bigger unit, divide by 10 for each step to the left:\n45 cm = 0.45 m (two steps: ÷ 100).\n\nAlways check your answer: a smaller unit gives a bigger number. A taxi trip of 12 km is 12 000 m.","checks":["convert(1, 'km', 'm') == 1000","convert(1, 'm', 'cm') == 100","convert(1, 'cm', 'mm') == 10","convert(3.5, 'km', 'm') == 3500","unitExp('km') - unitExp('m') == 3","convert(45, 'cm', 'm') == 0.45","unitExp('m') - unitExp('cm') == 2","convert(12, 'km', 'm') == 12000"]},"worked_example":{"status":"draft","vars":{"v":2.4,"u1":"km","u2":"m","ten":10},"problem":"Ayuk walks {v} {u1} to school every morning. How many metres is that?","steps":["Write the units in order: km, hm, dam, m. From {u1} to {u2} is {unitExp(u1) - unitExp(u2)} steps to the right, towards smaller units.","Each step multiplies by {ten}, so multiply by {ten ^ (unitExp(u1) - unitExp(u2))}.","{v} × {ten ^ (unitExp(u1) - unitExp(u2))} = {convert(v, u1, u2)}.","Check: {u2} is a smaller unit than {u1}, so the number must get bigger. {convert(v, u1, u2)} is bigger than {v}."],"answer":"{v} {u1} = {convert(v, u1, u2)} {u2}","checks":["convert(convert(v, u1, u2), u2, u1) == v","convert(v, u1, u2) > v"]},"teach":{"cards":[{"id":"c13-1","status":"draft","idea":"Units of length, from the biggest to the smallest: km, hm, dam, m, dm, cm, mm. Each unit is ten times the next one.","vars":{"one":1},"example":["{one} km = {convert(one, 'km', 'hm')} hm, {one} hm = {convert(one, 'hm', 'dam')} dam, {one} dam = {convert(one, 'dam', 'm')} m","{one} m = {convert(one, 'm', 'dm')} dm, {one} dm = {convert(one, 'dm', 'cm')} cm, {one} cm = {convert(one, 'cm', 'mm')} mm"],"checks":["convert(one, 'km', 'mm') == 1000000"],"check":{"ref":"m13-order"}},{"id":"c13-2","status":"draft","idea":"To change to a smaller unit, multiply by {10} for each step. The number gets bigger.","vars":{"v":3,"u1":"km","u2":"m"},"example":["From {u1} to {u2}: {unitExp(u1) - unitExp(u2)} steps, so × {10 ^ (unitExp(u1) - unitExp(u2))}.","{v} {u1} = {convert(v, u1, u2)} {u2}"],"checks":["convert(v, u1, u2) == v * 1000"],"check":{"ref":"m13-how-many"}},{"id":"c13-3","status":"draft","idea":"To change to a bigger unit, divide by {10} for each step. The number gets smaller.","vars":{"v":450,"u1":"cm","u2":"m"},"example":["From {u1} to {u2}: {unitExp(u2) - unitExp(u1)} steps, so ÷ {10 ^ (unitExp(u2) - unitExp(u1))}.","{v} {u1} = {convert(v, u1, u2)} {u2}"],"checks":["convert(v, u1, u2) == v / 100"],"check":{"id":"c13-3-check","type":"numeric","level":1,"unit":"km","vars":{"k":{"int":[2,30]}},"prompt":"Convert {k * 1000} m to km.","answer":"k","verify":"convert(answer, 'km', 'm') == k * 1000","misconceptions":[{"id":"wrong-direction","wrong":"k * 1000 * 1000","explain":"km is a bigger unit than m, so the number gets smaller: divide by 1000."}],"solution":["km is a bigger unit than m, so divide by {1000}.","{k * 1000} ÷ {1000} = {k} km."]}}]},"questions":[{"id":"m13-how-many","type":"mcq","level":1,"vars":{"p":{"pick":[{"big":"km","small":"m"},{"big":"m","small":"cm"},{"big":"m","small":"mm"},{"big":"cm","small":"mm"},{"big":"km","small":"dam"},{"big":"m","small":"dm"},{"big":"hm","small":"m"},{"big":"dm","small":"mm"}]},"d":{"expr":"unitExp(p.big) - unitExp(p.small)"}},"prompt":"How many {p.small} are there in 1 {p.big}?","correct":"{10 ^ d}","distractors":[{"text":"{10 ^ (d + 1)}","misconception":"steps"},{"text":"{10 ^ (d - 1)}","misconception":"steps","when":"d > 1"},{"text":"{10 ^ (d + 2)}","misconception":"steps"},{"text":"{10 * d}","misconception":"times-steps","when":"d > 1"}],"verify":"convert(1, p.big, p.small) == 10 ^ d","misconceptions":[{"id":"steps","explain":"In the list km hm dam m dm cm mm, {p.small} is {plural(d, 'step', 'steps')} after {p.big}, so multiply by 10 {d == 1 ? 'once' : plural(d, 'time', 'times')}: {10 ^ d}."},{"id":"times-steps","explain":"Each step multiplies by 10, so {d} steps multiply by {10 ^ d}, not by {10 * d}."}],"solution":["In the list km hm dam m dm cm mm, {p.small} is {plural(d, 'step', 'steps')} after {p.big}.","Each step multiplies by {10}: {10 ^ d}."]},{"id":"m13-convert","type":"numeric","level":2,"vars":{"u1":{"pick":["km","hm","dam","m","dm","cm","mm"]},"u2":{"pick":["km","hm","dam","m","dm","cm","mm"]},"v":{"int":[2,950]}},"where":["u1 != u2","abs(unitExp(u1) - unitExp(u2)) \u003c= 3"],"prompt":"Convert {v} {u1} to {u2}.","answer":"convert(v, u1, u2)","unit":"{u2}","verify":"convert(answer, u2, u1) == v","misconceptions":[{"id":"wrong-direction","wrong":"convert(v, u2, u1)","explain":"{u2} is a {unitExp(u2) \u003c unitExp(u1) ? 'smaller' : 'bigger'} unit than {u1}, so the number must get {unitExp(u2) \u003c unitExp(u1) ? 'bigger: multiply' : 'smaller: divide'}."},{"id":"one-step-short","wrong":"unitExp(u1) > unitExp(u2) ? v * 10 ^ (unitExp(u1) - unitExp(u2) - 1) : convert(v, u1, u2) * 10","when":"abs(unitExp(u1) - unitExp(u2)) >= 2","explain":"Count every step between {u1} and {u2}, including dam, dm and the others: there are {abs(unitExp(u1) - unitExp(u2))} steps."}],"solution":["From {u1} to {u2} is {plural(abs(unitExp(u1) - unitExp(u2)), 'step', 'steps')} {unitExp(u1) > unitExp(u2) ? 'to a smaller unit, so multiply' : 'to a bigger unit, so divide'} by {10 ^ abs(unitExp(u1) - unitExp(u2))}.","{v} {unitExp(u1) > unitExp(u2) ? '×' : '÷'} {10 ^ abs(unitExp(u1) - unitExp(u2))} = {convert(v, u1, u2)} {u2}"]},{"id":"m13-order","type":"ordering","level":1,"vars":{"us":{"sample":["['km', 'hm', 'dam', 'm', 'dm', 'cm', 'mm']",4]}},"prompt":"Order these units from the biggest to the smallest.","items":[{"text":"{us[0]}","key":"unitExp(us[0])"},{"text":"{us[1]}","key":"unitExp(us[1])"},{"text":"{us[2]}","key":"unitExp(us[2])"},{"text":"{us[3]}","key":"unitExp(us[3])"}],"order":"desc"},{"id":"m13-trip","type":"numeric","level":3,"vars":{"a":{"int":[1,15]},"b":{"int":[50,950]}},"prompt":"Ebai travels {a} km by taxi, then walks {b} m to his house. How far does he travel in total, in metres?","answer":"a * 1000 + b","unit":"m","verify":"answer == convert(a, 'km', 'm') + b","misconceptions":[{"id":"added-units","wrong":"a + b","explain":"Change {a} km to metres first: {a} km = {a * 1000} m. Then add {b} m."},{"id":"wrong-factor","wrong":"a * 100 + b","explain":"1 km = 1000 m, not 100 m."}],"solution":["{a} km = {a} × {1000} = {a * 1000} m.","Total: {a * 1000} + {b} = {a * 1000 + b} m."]}]},"14":{"subject":"mathematics","class":"Form 1","lesson_no":14,"language":"en","prerequisites":[11,13],"note":{"status":"draft","text":"A line segment [AB] is the part of a line between A and B. Its length is written AB, without brackets.\n\nThe midpoint M of [AB] is the point of [AB] that is at the same distance from A and from B.\n\nMidpoint property: if M is the midpoint of [AB], then M is on [AB] and AM = MB = AB ÷ 2. For example, if AB = 10 cm, then AM = MB = 5 cm.\n\nConverse: if M is on [AB] and AM = MB, then M is the midpoint of [AB].\n\nBe careful: both conditions are needed. A point can be at the same distance from A and from B without being on [AB]. Then it is not the midpoint.\n\nTo find the midpoint with a ruler: measure AB, divide by 2, and mark that length from A.","checks":["10 / 2 == 5"]},"worked_example":{"status":"draft","vars":{"a":3,"b":11,"two":2},"problem":"On a ruler, A is at the {a} cm mark and B is at the {b} cm mark. At which mark is the midpoint M of [AB], and what is AM?","steps":["AB = {b} − {a} = {b - a} cm.","AM = AB ÷ {two} = {b - a} ÷ {two} = {(b - a) / two} cm.","M is {(b - a) / two} cm after A: {a} + {(b - a) / two} = {a + (b - a) / two}, so M is at the {a + (b - a) / two} cm mark.","Check: MB = {b} − {a + (b - a) / two} = {b - (a + (b - a) / two)} cm, which equals AM."],"answer":"M is at the {a + (b - a) / two} cm mark, and AM = {(b - a) / two} cm.","checks":["a + (b - a) / two == (a + b) / two","b - (a + (b - a) / two) == (b - a) / two"]},"teach":{"cards":[{"id":"c14-1","status":"draft","idea":"On a ruler, the length of a segment is the difference between its two marks.","vars":{"a":3,"b":11},"example":["A is at {a} cm and B is at {b} cm.","AB = {b} − {a} = {b - a} cm."],"checks":["b - a == 8"],"check":{"id":"c14-1-check","type":"numeric","level":1,"unit":"cm","vars":{"a":{"int":[1,15]},"d":{"int":[2,20]},"b":{"expr":"a + d"}},"prompt":"On a ruler, A is at the {a} cm mark and B is at the {b} cm mark. Find AB.","answer":"b - a","verify":"answer + a == b","misconceptions":[{"id":"added","wrong":"a + b","explain":"The length is the difference between the marks: {b} − {a}."}],"solution":["AB = {b} − {a} = {b - a} cm."]}},{"id":"c14-2","status":"draft","idea":"The midpoint M of [AB] is the point of [AB] exactly in the middle: AM = MB = AB ÷ {2}.","vars":{"d":10,"two":2},"example":["AB = {d} cm, so AM = MB = {d} ÷ {two} = {d / two} cm."],"checks":["d / two + d / two == d"],"check":{"ref":"m14-half"}},{"id":"c14-3","status":"draft","idea":"Converse: if M is on [AB] and AM = MB, then M is the midpoint. Both conditions are needed: a point away from [AB] can also have MA = MB.","vars":{},"example":["M on [AB] and AM = MB → M is the midpoint.","MA = MB but M not on [AB] → M is not the midpoint."],"checks":[],"check":{"id":"c14-3-check","type":"mcq","level":1,"show":2,"review":"authored","sources":["midpoint"],"vars":{"f":{"pick":[{"text":"M is on [AB] and AM = MB.","ans":"Yes"},{"text":"MA = MB, but M is not on [AB].","ans":"No"}]}},"prompt":"{f.text} Is M the midpoint of [AB]?","correct":"{f.ans}","distractors":[{"text":"Yes","misconception":"both"},{"text":"No","misconception":"both"}],"misconceptions":[{"id":"both","explain":"M is the midpoint only when it is on [AB] AND AM = MB."}],"solution":["The midpoint needs both: M on [AB] AND AM = MB.","Answer: {answer}"]}}]},"questions":[{"id":"m14-half","type":"numeric","level":1,"vars":{"d":{"int":[2,40]}},"prompt":"M is the midpoint of [AB] and AB = {d} cm. Find AM.","answer":"d / 2","unit":"cm","verify":"answer * 2 == d","misconceptions":[{"id":"whole-length","wrong":"d","explain":"M is in the middle, so AM is half of AB: {d} ÷ 2."},{"id":"doubled","wrong":"2 * d","explain":"AM is part of AB, so it is shorter than AB: {d} ÷ 2."}],"solution":["M is the midpoint, so AM = AB ÷ {2}.","{d} ÷ {2} = {d / 2} cm."]},{"id":"m14-double","type":"numeric","level":2,"vars":{"x":{"int":[2,30]}},"prompt":"M is the midpoint of [AB] and MB = {x} cm. Find AB.","answer":"2 * x","unit":"cm","verify":"answer / 2 == x","misconceptions":[{"id":"same-length","wrong":"x","explain":"MB is only half of AB. AB = AM + MB = {x} + {x}."},{"id":"halved","wrong":"x / 2","explain":"AB is the whole segment, so it is longer than MB: AB = 2 × {x}."}],"solution":["MB is half of AB, so AB = {2} × MB.","{2} × {x} = {2 * x} cm."]},{"id":"m14-ruler","type":"numeric","level":2,"vars":{"a":{"int":[1,20]},"h":{"int":[1,10]},"b":{"expr":"a + 2 * h"}},"where":"a != h","prompt":"On a ruler, A is at the {a} cm mark and B is at the {b} cm mark. At which mark is the midpoint of [AB]?","answer":"(a + b) / 2","verify":"answer - a == b - answer","misconceptions":[{"id":"half-length","wrong":"(b - a) / 2","explain":"{(b - a) / 2} cm is the length AM. The midpoint is {(b - a) / 2} cm after A: {a} + {(b - a) / 2}."},{"id":"half-of-end","wrong":"b / 2","when":"b % 2 == 0","explain":"Start from A's mark, not from 0: {a} + {(b - a) / 2}."}],"solution":["AB = {b} − {a} = {b - a} cm, and half of it is {(b - a) / 2} cm.","The midpoint is {(b - a) / 2} cm after A: {a} + {(b - a) / 2} = {(a + b) / 2}."]},{"id":"m14-converse","sources":["midpoint"],"type":"mcq","level":3,"review":"authored","vars":{"x":{"int":[2,15]}},"prompt":"MA = MB = {x} cm. Can you be sure that M is the midpoint of [AB]?","correct":"No: M must also be on [AB].","distractors":[{"text":"Yes, because MA = MB.","misconception":"one-condition"},{"text":"Yes, because {x} is a whole number.","misconception":"irrelevant"},{"text":"No: the midpoint is never at the same distance from A and B.","misconception":"property"}],"misconceptions":[{"id":"one-condition","explain":"Many points are at the same distance from A and B (all the points of the perpendicular bisector). Only the one on [AB] is the midpoint."},{"id":"irrelevant","explain":"The size of the number does not matter. Check whether M is on [AB]."},{"id":"property","explain":"The midpoint is always at the same distance from A and B. But being at the same distance is not enough on its own."}],"solution":["Every point of the perpendicular bisector of [AB] has MA = MB, but only one of them is on [AB].","Answer: {answer}"]},{"id":"m14-spot","type":"spot_error","level":3,"vars":{"h":{"int":[2,20]},"d":{"expr":"2 * h"}},"prompt":"M is the midpoint of [AB] and AB = {d} cm. One statement is false. Which one?","pool":{"right":[{"text":"AM = {d / 2} cm","truth":"d / 2 * 2 == d"},{"text":"MB = {d / 2} cm","truth":"d - d / 2 == d / 2"},{"text":"AM + MB = {d} cm","truth":"d / 2 + d / 2 == d"}],"wrong":[{"text":"AM = {d} cm","truth":"d == d / 2","explain":"AM is half of AB: {d / 2} cm."},{"text":"AM = {d * 2} cm","truth":"d * 2 == d / 2","explain":"AM is half of AB, not double: {d / 2} cm."},{"text":"AM + MB = {d / 2} cm","truth":"d / 2 + d / 2 == d / 2","explain":"AM + MB is the whole segment: {d} cm."}]},"pick":{"right":3,"wrong":1}}]},"15":{"subject":"mathematics","class":"Form 1","lesson_no":15,"language":"en","prerequisites":[14],"note":{"status":"draft","text":"The perpendicular bisector of [AB] is the line that cuts [AB] at its midpoint and makes a right angle (90°) with it. 'Perpendicular' means 'at a right angle'; 'bisector' means 'it cuts into two equal parts'.\n\nProperty: every point on the perpendicular bisector of [AB] is at the same distance from A and from B. If P is on it, then PA = PB.\nConverse: if PA = PB, then P is on the perpendicular bisector of [AB].\n\nTo construct it with a ruler and compasses:\n1. Open the compasses to more than half of AB.\n2. Put the point on A and draw an arc above and below [AB].\n3. With the same opening, put the point on B and draw arcs that cut the first two.\n4. Join the two crossing points with your ruler.\nThe line you draw cuts [AB] at its midpoint.","checks":[]},"worked_example":{"status":"draft","vars":{"d":7,"r":5,"two":2},"problem":"AB = {d} cm. Choose a compass opening to construct the perpendicular bisector of [AB], and find where it cuts [AB].","steps":["The opening must be more than half of AB: {d} ÷ {two} = {d / two} cm.","{r} cm is more than {d / two} cm, so an opening of {r} cm works.","With the point on A and then on B, draw arcs of radius {r} cm above and below [AB]. Join the two crossing points.","Each crossing point C is {r} cm from A and {r} cm from B: CA = CB, so C is on the perpendicular bisector.","The line cuts [AB] at its midpoint I, with AI = IB = {d / two} cm."],"answer":"Use an opening of {r} cm. The perpendicular bisector cuts [AB] at I, with AI = IB = {d / two} cm.","checks":["r > d / two","r \u003c= d"]},"teach":{"cards":[{"id":"c15-1","status":"draft","idea":"The perpendicular bisector of [AB] is the line that cuts [AB] at its midpoint and makes a right angle with it.","vars":{},"example":["'Perpendicular' means at a right angle. 'Bisector' means it cuts into two equal parts.","It passes through the midpoint I of [AB], so AI = IB."],"checks":[],"check":{"id":"c15-1-check","type":"mcq","level":1,"review":"authored","sources":["perpendicular-bisector"],"prompt":"The perpendicular bisector of [AB] passes through:","correct":"the midpoint of [AB]","distractors":[{"text":"the point A","misconception":"end-point"},{"text":"the point B","misconception":"end-point"},{"text":"no point of [AB]","misconception":"misses"}],"misconceptions":[{"id":"end-point","explain":"It cuts [AB] in the middle, so it passes through the midpoint, not through A or B."},{"id":"misses","explain":"It cuts [AB]: it passes through the midpoint."}],"solution":["It cuts [AB] into two equal parts, at a right angle.","So it passes through {answer}."]}},{"id":"c15-2","status":"draft","idea":"Every point of the perpendicular bisector of [AB] is at the same distance from A and from B.","vars":{"x":6},"example":["P is on the perpendicular bisector of [AB] and PA = {x} cm.","So PB = {x} cm too."],"checks":[],"check":{"ref":"m15-equal"}},{"id":"c15-3","status":"draft","idea":"To construct it, open the compasses to more than half of AB, draw arcs from A and from B, and join the two crossing points.","vars":{"d":8,"r":5,"two":2},"example":["AB = {d} cm. Half of AB is {d} ÷ {two} = {d / two} cm.","An opening of {r} cm is more than {d / two} cm, so the arcs cross at two points."],"checks":["r > d / two"],"check":{"id":"c15-3-check","type":"mcq","level":1,"vars":{"d":{"int":[4,16]}},"prompt":"AB = {d} cm. To construct the perpendicular bisector, the compass opening must be more than:","correct":"{d / 2} cm","distractors":[{"text":"{d} cm","misconception":"half"},{"text":"{2 * d} cm","misconception":"half"},{"text":"{d / 4} cm","misconception":"half"}],"verify":"answer == fmt(d / 2) + ' cm'","misconceptions":[{"id":"half","explain":"The arcs from A and B cross only if the opening is more than half of AB: {d} ÷ 2 = {d / 2} cm."}],"solution":["Half of AB: {d} ÷ {2} = {d / 2} cm.","The opening must be more than {answer}."]}}]},"questions":[{"id":"m15-equal","type":"numeric","level":1,"vars":{"x":{"int":[2,30]}},"prompt":"P is on the perpendicular bisector of [AB] and PA = {x} cm. Find PB.","answer":"x","unit":"cm","verify":"answer == x","misconceptions":[{"id":"halved","wrong":"x / 2","explain":"Every point on the perpendicular bisector is at the same distance from A and from B: PB = PA = {x} cm."},{"id":"doubled","wrong":"2 * x","explain":"PB is not PA + PA. Every point on the perpendicular bisector is at the same distance from A and B."}],"solution":["Every point of the perpendicular bisector is at the same distance from A and from B.","So PB = PA = {x} cm."]},{"id":"m15-opening","type":"mcq","level":2,"vars":{"d":{"int":[6,16]},"r":{"int":["floor(d / 2) + 1","d"]}},"prompt":"AB = {d} cm. Which compass opening can you use to construct the perpendicular bisector of [AB]?","correct":"{r} cm","distractors":[{"text":"{d / 2} cm","misconception":"exactly-half"},{"text":"{floor(d / 2) - 1} cm","misconception":"too-small"},{"text":"{floor(d / 2) - 2} cm","misconception":"too-small"},{"text":"1 cm","misconception":"too-small","when":"floor(d / 2) - 2 > 1"}],"verify":"r > d / 2","misconceptions":[{"id":"exactly-half","explain":"With exactly half of AB ({d / 2} cm), the arcs only touch at the midpoint: you get one point, not two."},{"id":"too-small","explain":"The arcs from A and from B only cross if the opening is more than half of AB, that is more than {d / 2} cm."}],"solution":["The opening must be more than half of AB: {d} ÷ {2} = {d / 2} cm.","Of the openings shown, only {answer} is more than {d / 2} cm."]},{"id":"m15-steps","sources":["perpendicular-bisector"],"type":"ordering","level":2,"review":"authored","prompt":"Put the steps for constructing the perpendicular bisector of [AB] in order.","items":[{"text":"Open the compasses to more than half of AB."},{"text":"Put the point on A and draw an arc above and below [AB]."},{"text":"With the same opening, put the point on B and draw arcs that cut the first two."},{"text":"Join the two crossing points with a ruler."}],"order":"as_written"},{"id":"m15-cut","type":"numeric","level":2,"vars":{"d":{"int":[4,30]}},"prompt":"The perpendicular bisector of [AB] cuts [AB] at I. AB = {d} cm. Find AI.","answer":"d / 2","unit":"cm","verify":"answer * 2 == d","misconceptions":[{"id":"whole-length","wrong":"d","explain":"The perpendicular bisector cuts [AB] at its midpoint, so AI is half of AB: {d} ÷ 2."}],"solution":["The perpendicular bisector cuts [AB] at its midpoint, so AI = AB ÷ {2}.","{d} ÷ {2} = {d / 2} cm."]},{"id":"m15-spot","sources":["perpendicular-bisector"],"type":"spot_error","level":3,"review":"authored","vars":{"x":{"int":[2,20]}},"prompt":"One of these statements is false. Which one?","pool":{"right":[{"text":"If P is on the perpendicular bisector of [AB] and PA = {x} cm, then PB = {x} cm.","truth":"true"},{"text":"The perpendicular bisector of [AB] passes through the midpoint of [AB].","truth":"true"},{"text":"The perpendicular bisector of [AB] makes a right angle with [AB].","truth":"true"}],"wrong":[{"text":"If PA = {x} cm and PB = {x + 1} cm, then P is on the perpendicular bisector of [AB].","truth":"x == x + 1","explain":"P is on the perpendicular bisector only if PA = PB. Here {x} ≠ {x + 1}."},{"text":"The perpendicular bisector of [AB] passes through A.","truth":"false","explain":"It passes through the midpoint of [AB], not through A."}]},"pick":{"right":3,"wrong":1}}]},"16":{"subject":"mathematics","class":"Form 1","lesson_no":16,"language":"en","prerequisites":[11,15],"note":{"status":"draft","review":"Pending (Dion, 2026-10-02): check the meaning of 'orthogonal' against the pupil's exercise book before approval.","text":"Two lines on a flat surface (a plane) either meet or never meet.\n• Parallel lines never meet, however far you extend them, like the two rails of a railway. We write (d) // (d′).\n• Perpendicular lines meet at a right angle (90°), like the corner of your exercise book. We write (d) ⊥ (d′).\n• Orthogonal also means 'at a right angle'. In a plane, orthogonal lines and perpendicular lines are the same thing.\n\nProperties of lines in a plane:\n• Through a point not on (d), there is exactly one line parallel to (d) and exactly one line perpendicular to (d).\n• If (d₁) // (d₂) and (d₂) // (d₃), then (d₁) // (d₃).\n• If (d₁) ⊥ (d₃) and (d₂) ⊥ (d₃), then (d₁) // (d₂).\n• If (d₁) // (d₂) and (d₃) ⊥ (d₁), then (d₃) ⊥ (d₂).","checks":["lineRule('//', '//') == '//'","lineRule('⊥', '⊥') == '//'","lineRule('//', '⊥') == '⊥'"]},"worked_example":{"status":"draft","vars":{"r1":"⊥","r2":"⊥"},"problem":"(L) ⊥ (M) and (N) ⊥ (M). What can you say about (L) and (N)? A fourth line (K) is perpendicular to (L): what can you say about (K) and (N)?","steps":["(L) and (N) are both perpendicular to the same line, (M).","Two lines perpendicular to the same line are parallel: (L) {lineRule(r1, r2)} (N).","(K) ⊥ (L) and (L) // (N). A line perpendicular to one of two parallel lines is perpendicular to the other: (K) {lineRule(lineRule(r1, r2), '⊥')} (N)."],"answer":"(L) {lineRule(r1, r2)} (N) and (K) {lineRule(lineRule(r1, r2), '⊥')} (N).","checks":["lineRule(r1, r2) == '//'","lineRule('//', '⊥') == '⊥'"]},"teach":{"cards":[{"id":"c16-1","status":"draft","idea":"Parallel lines never meet, however far you extend them. We write (d) // (d′).","vars":{},"example":["The two long edges of your ruler are parallel."],"checks":[],"check":{"ref":"m16-symbol"}},{"id":"c16-2","status":"draft","idea":"Perpendicular lines meet at a right angle. We write (d) ⊥ (d′). Orthogonal also means 'at a right angle': in a plane, orthogonal lines and perpendicular lines are the same.","vars":{},"example":["The two edges at a corner of your exercise book are perpendicular."],"checks":[],"check":{"id":"c16-2-check","type":"mcq","level":1,"review":"authored","sources":["line-symbols"],"vars":{"f":{"pick":[{"d":"meet at a right angle","a":"perpendicular"},{"d":"never meet","a":"parallel"}]}},"prompt":"Two lines in a plane {f.d}. They are:","correct":"{f.a}","distractors":[{"text":"parallel","misconception":"words"},{"text":"perpendicular","misconception":"words"},{"text":"the same line","misconception":"words"}],"show":3,"misconceptions":[{"id":"words","explain":"Parallel lines never meet. Perpendicular (orthogonal) lines meet at a right angle."}],"solution":["Parallel lines never meet; perpendicular (orthogonal) lines meet at a right angle.","Lines that {f.d} are {answer}."]}},{"id":"c16-3","status":"draft","idea":"Through a point that is not on a line (d), there is exactly one line parallel to (d) and exactly one line perpendicular to (d).","vars":{},"example":["Two lines perpendicular to the same line are parallel.","A line perpendicular to one of two parallel lines is perpendicular to the other."],"checks":["lineRule('⊥', '⊥') == '//' && lineRule('//', '⊥') == '⊥'"],"check":{"ref":"m16-through-point"}}]},"questions":[{"id":"m16-symbol","sources":["line-symbols"],"type":"mcq","level":1,"review":"authored","vars":{"f":{"pick":[{"s":"(d) // (d′)","m":"(d) and (d′) are parallel."},{"s":"(d) ⊥ (d′)","m":"(d) and (d′) are perpendicular."}]}},"prompt":"What does {f.s} mean?","correct":"{f.m}","distractors":[{"text":"(d) and (d′) are parallel.","misconception":"symbols"},{"text":"(d) and (d′) are perpendicular.","misconception":"symbols"},{"text":"(d) and (d′) are the same line.","misconception":"symbols"},{"text":"(d) and (d′) meet, but not at a right angle.","misconception":"symbols"}],"misconceptions":[{"id":"symbols","explain":"// means parallel (never meet). ⊥ means perpendicular (meet at a right angle)."}],"solution":["// means parallel: the lines never meet. ⊥ means perpendicular: they meet at a right angle.","So {f.s} means: {answer}"]},{"id":"m16-deduce","type":"mcq","level":2,"vars":{"L":{"letters":3},"X":{"expr":"L[0]"},"Y":{"expr":"L[1]"},"Z":{"expr":"L[2]"},"r1":{"pick":["//","⊥"]},"r2":{"pick":["//","⊥"]}},"prompt":"({X}) {r1} ({Y}) and ({Z}) {r2} ({X}). What can you say about ({Z}) and ({Y})?","correct":"({Z}) {lineRule(r1, r2)} ({Y})","distractors":[{"text":"({Z}) {lineRule(r1, r2) == '//' ? '⊥' : '//'} ({Y})","misconception":"rule"},{"text":"({Z}) and ({Y}) are the same line.","misconception":"rule"},{"text":"Nothing can be said about ({Z}) and ({Y}).","misconception":"rule"}],"misconceptions":[{"id":"rule","explain":"{r1 == '⊥' && r2 == '⊥' ? 'Two lines perpendicular to the same line are parallel.' : r1 == '//' && r2 == '//' ? 'Two lines parallel to the same line are parallel.' : 'If two line "subject":"english-language","class":"Form 1","lesson_no":1,"language":"en","prerequisites":[],"skills":[{"id":"e1","name":"Introducing oneself and others"}],"note":{"status":"draft","text":"When we meet someone for the first time, we greet and introduce ourselves.\n• Greet: “Good morning.” “Good afternoon.” “Good evening.” With friends: “Hello” or “Hi”.\n• Introduce yourself: “My name is Bih. I am from Kumbo. I am in Form One.”\n• Introduce another person: “This is my friend Ayuk.” “Mummy, meet Tabe, my classmate.”\n• Reply: “Nice to meet you.” “Nice to meet you too.” “Pleased to meet you.”\n• Ask: “What is your name?” “Where are you from?” “How are you?”\nWith an older person or a teacher, greet first, add “sir” or “madam”, and use “Good morning” rather than “Hi”.","checks":[]},"worked_example":{"status":"draft","vars":{"a":"Ayuk","b":"Bih","c":"Tabe"},"problem":"On the first day of school, {a} meets a new classmate, {b}. {a} is with his friend {c}. What do they say?","steps":["Greet: {a}: “Good morning.”","Give your name and one fact: {a}: “My name is {a}. I am from Mamfe.”","The other person greets back and gives her name: {b}: “Good morning, {a}. My name is {b}. I am from Kumbo.”","Introduce your friend: {a}: “{b}, this is my friend {c}.”","Reply politely: {b}: “Nice to meet you, {c}.” {c}: “Nice to meet you too.”"],"answer":"Greet → give your name → introduce the other person → reply politely.","checks":[]},"teach":{"cards":[{"id":"c1-1","status":"draft","idea":"To introduce yourself, greet first, then give your name and one or two facts about you.","vars":{"name":"Bih","town":"Kumbo"},"example":["“Good morning. My name is {name}. I am from {town}. I am in Form One.”"],"checks":[],"check":{"id":"c1-1-check","type":"mcq","level":1,"review":"authored","sources":["introductions"],"vars":{"n":{"pick":["Enow","Mih","Ashu","Ebai","Manyi"]},"t":{"pick":["Buea","Kumbo","Mamfe","Limbe","Wum"]}},"prompt":"Which is the best way to introduce yourself to a new classmate?","pool":{"right":[{"text":"“Hello, my name is {n}. I am from {t}.”","truth":"true"}],"wrong":[{"text":"“My name {n}. From {t}.”","truth":"false","explain":"Use full sentences: “My name is …”, “I am from …”."},{"text":"“Goodbye. I am {n}.”","truth":"false","explain":"“Goodbye” is for leaving, not for meeting someone."},{"text":"“What is your name? Nice to meet you too.”","truth":"false","explain":"Give your own name first; “Nice to meet you too” is a reply."},{"text":"“Hey you! Where are you from?”","truth":"false","explain":"“Hey you!” is not polite. Greet and give your name first."}]},"pick":{"right":1,"wrong":3}}},{"id":"c1-2","status":"draft","idea":"To introduce another person, say “This is …” and add who the person is.","vars":{"a":"Ayuk","b":"Tabe","c":"Bih"},"example":["{a}: “{b}, this is my cousin {c}. She is in Form One too.”"],"checks":[],"check":{"id":"c1-2-check","type":"cloze","level":1,"review":"authored","sources":["introductions"],"show":3,"vars":{"x":{"pick":["Mih","Ewane","Ndip","Akwen"]},"y":{"pick":["friend","cousin","classmate","brother"]}},"prompt":"Choose the words that fit.","text":"Mummy, ___ my {y} {x}.","answer":"'this is'","choices":[{"text":"he is","misconception":"pronoun"},{"text":"it is","misconception":"it"},{"text":"there is","misconception":"there"}],"misconceptions":[{"id":"pronoun","explain":"To introduce someone, we say “This is …”, not “He is …”."},{"id":"it","explain":"“It” is for things, not people. Say “This is …”."},{"id":"there","explain":"“There is” tells that something exists. To introduce someone, say “This is …”."}]}},{"id":"c1-3","status":"draft","idea":"When someone is introduced to you, answer politely and use the person's name.","vars":{"b":"Bih","c":"Tabe"},"example":["{c}: “Nice to meet you, {b}.” {b}: “Nice to meet you too.”"],"checks":[],"check":{"ref":"e1-reply"}},{"id":"c1-4","status":"draft","idea":"Greet by the time of day: Good morning (before midday), Good afternoon (after midday), Good evening (in the evening). “Good night” is for leaving, not for greeting.","vars":{},"example":["Before school: “Good morning, madam.”","After school, at about four o'clock: “Good afternoon, sir.”"],"checks":[],"check":{"ref":"e1-greet"}}]},"questions":[{"id":"e1-reply","type":"mcq","level":1,"review":"authored","sources":["introductions"],"vars":{"x":{"pick":[{"line":"Hello, my name is Enow.","right":"Hello, Enow. My name is Mih.","w":["Goodbye, Enow.","I am fine, thank you.","Yes, it is."],"why":"When someone tells you their name, greet them by name and give your own name."},{"line":"Nice to meet you.","right":"Nice to meet you too.","w":["I am twelve years old.","Thank you, goodbye.","Yes, I am."],"why":"The polite reply to “Nice to meet you” is “Nice to meet you too.”"},{"line":"What is your name?","right":"My name is Ndi.","w":["I am from Wum.","I am fine.","Nice to meet you too."],"why":"“What is your name?” asks for a name: “My name is …”."},{"line":"Where are you from?","right":"I am from Buea.","w":["My name is Ashu.","I am in Form One.","Good afternoon."],"why":"“Where are you from?” asks for a place: “I am from …”."},{"line":"How are you?","right":"I am fine, thank you. And you?","w":["I am from Limbe.","My name is Ebai.","Nice to meet you too."],"why":"“How are you?” asks how you feel: “I am fine, thank you.”"},{"line":"This is my sister Manyi.","right":"Hello, Manyi. Nice to meet you.","w":["This is my sister too.","I am fine, thank you.","Goodbye, Manyi."],"why":"When someone is introduced to you, greet them by name and say “Nice to meet you.”"}]}},"prompt":"Someone says: “{x.line}” What is the best reply?","correct":"{x.right}","distractors":[{"text":"{x.w[0]}","misconception":"off"},{"text":"{x.w[1]}","misconception":"off"},{"text":"{x.w[2]}","misconception":"off"}],"misconceptions":[{"id":"off","explain":"That answer does not fit what was said. {x.why}"}],"solution":["“{x.line}” → “{answer}”","{x.why}"]},{"id":"e1-greet","type":"cloze","level":1,"review":"authored","so ns, plantains, bread, oil, salt, soap, toothbrush, toothpaste, bucket, blanket, mattress, sandals, uniform.\nSpelling conventions:\n• Use a capital letter for the names of people and places, for days and months, and for the word I: Ayuk, Bamenda, Monday, October.\n• Start every sentence with a capital letter.\n• Do not use a capital letter for ordinary words in the middle of a sentence: rice, soap, market.\n• Learn words that are often misspelt: Wednesday, February, vegetables, necessary, toothpaste.\n• Clothes are what we wear; cloths are pieces of cloth.\nCheck every word you write. A dictionary can help.","checks":[]},"worked_example":{"status":"draft","vars":{"wrong":"on wensday, my mother bought sope and bred at the market in kumba."},"problem":"Correct the capital letters and the spelling: “{wrong}”","steps":["A sentence starts with a capital letter: On.","Days of the week take a capital letter, and this one is spelt Wednesday.","Kumba is the name of a town, so it takes a capital letter: Kumba.","Ordinary words stay small, but check their spelling: soap, bread, market."],"answer":"On Wednesday, my mother bought soap and bread at the market in Kumba.","checks":[]},"teach":{"cards":[{"id":"c2-1","status":"draft","idea":"Basic daily needs are things we cannot live well without: food, water, clothing and shelter. Soap, sleep and health care are needs too.","vars":{},"example":["Food: rice, beans, plantains, bread.","Clothing: a shirt, a uniform, sandals.","Keeping clean: soap, a toothbrush, toothpaste."],"checks":[],"check":{"ref":"e2-sort"}},{"id":"c2-2","status":"draft","idea":"Names of people and towns, days, months and the word I always start with a capital letter. So does every sentence.","vars":{},"example":["Ayuk went to Bamenda on Saturday.","In October, I buy a new uniform."],"checks":[],"check":{"ref":"e2-capital"}},{"id":"c2-3","status":"draft","idea":"Some everyday words are often misspelt. Learn them carefully.","vars":{},"example":["Wednesday, Februa rry people and goods from one place to another.\n• By road: car, taxi, bus, motorbike, lorry, bicycle.\n• By water: canoe, boat, ship, ferry.\n• By rail: train.\n• By air: plane, helicopter.\nWe say: “I go to school by taxi”, “by bus”, “by motorbike”. But: “I go on foot” or “I walk to school”.\nTo talk about a journey, ask and answer:\n• How do you travel to Bamenda? — I travel by bus.\n• How long does it take? — About one hour.\n• How much is the fare? — It is one thousand francs.\nStay safe: wear a helmet on a motorbike and a seat belt in a car.","checks":[]},"worked_example":{"status":"draft","vars":{"n":"Ayuk","f":"Ewane","t":"taxi","town":"Buea"},"problem":"{f} asks {n} how he comes to school. {n} takes a {t} from his house. Write their short conversation.","steps":["{f} asks with “How”: “How do you come to school?”","{n} answers with by + the means of transport: “I come by {t}.”","{f} asks about the time: “How long does it take?” — “About twenty minutes.”","If {n} walked, he would say “on foot”, not “by foot”."],"answer":"“How do you come to school?” — “I come by {t}.”","checks":[]},"teach":{"cards":[{"id":"c13-1","status":"draft","idea":"Means of transport move by road, by water, by rail or by air.","vars":{},"example":["Road: taxi, bus, motorbike. Water: canoe, ship.","Rail: train. Air: plane."],"checks":[],"check":{"ref":"e13-sort"}},{"id":"c13-2","status":"draft","idea":"Say “by” + the means of transport, with no a or the: by bus, by taxi, by train. But: on foot.","vars":{},"example":["I go to school by motorbike.","Mih goes to school on foot."],"checks":[],"check":{"ref":"e13-by"}},{"id":"c13-3","status":"draft","idea":"Ask about a journey with How (which transport), How long (time), How much (money) and Where (place).","vars":{"town":"Bamenda"},"example":["How do you travel to {town}? — I travel by bus.","How much is the fare? — It is one thousand francs."],"checks":[],"check":{"ref":"e13-reply"}}]},"questions":[{"id":"e13-sort","type":"matching","level" {"id":"e15","name":"The Present Perfect tense"}],"note":{"status":"draft","text":"We use the Present Perfect tense for past actions that are linked to now: “I have finished my homework.” (It is done now.) “Ayuk has lost his pen.” (He does not have it now.)\nForm: have / has + past participle. I, you, we, they have; he, she, it has.\nRegular verbs: the past participle is the same as the past: cook → cooked.\nIrregular verbs have their own form: go → gone, eat → eaten, see → seen, write → written, take → taken, buy → bought.\nUseful words: ever, never, already, just, yet. “Have you ever eaten koki?” “I have never seen the sea.” “Has Bih finished yet?”\nNegative: haven't / hasn't + participle. Question: Have / Has + subject + participle?\nWith a finished time (yesterday, last week), use the Simple Past: “I saw him yesterday.”","checks":[]},"worked_example":{"status":"draft","vars":{"v":"sweep","c":"the yard"},"problem":"Mother asks Ayuk if the yard is clean. Ayuk swept it this morning. Answer for him with the Present Perfect: “Yes, I ({v}) {c}.”","steps":["The subject is I, so we use have.","{v} is irregular: its past participle is {participle(v)}.","There is no finished time word (like yesterday), and the result is now: the yard is clean."],"answer":"Yes, I have {participle(v)} {c}.","checks":["participle(v) == 'swept'"]},"teach":{"cards":[{"id":"c15-1","status":"draft","idea":"The Present Perfect links a past action to now. Form: have or has + the past participle.","vars":{},"example":["I have {participle('finish')} my homework. (It is done now.)","Ayuk has {participle('lose')} his pen. (He does not have it now.)"],"checks":[],"check":{"ref":"e15-havehas"}},{"id":"c15-2","status":"draft","idea":"Regular verbs: the participle is the -ed form. Irregular verbs have their own participle.","vars":{},"example":["cook → {participle('cook')}, carry → {participle('carry')}","go → {participle('go')}, eat → {participle('eat')}, write → {participle('write')}"],"checks":[],"check rst}","Date of birth (dd/mm/yyyy): {ddmmyyyy(d, m, y)}","Place of birth: {place}","Class: Form One","Name of parent or guardian: {guardian}","Signature: M. {sur}","Dear Akwen, please come to my birthday party on Saturday at three o'clock at our house in Mamfe. Please reply by Thursday. Your friend, {first}."],"checklist":["My surname is in BLOCK LETTERS.","My date of birth is day, then month, then year.","No line is empty.","My signature is the way I always sign.","My invitation says who, what, when and where.","My invitation asks my friend to reply.","I checked my capital letters and spelling."],"checks":[]}}},"physics":{"1":{"subject":"physics","class":"Form 1","lesson_no":1,"language":"en","prerequisites":[],"skills":[{"id":"p1","name":"Science and its branches"}],"note":{"status":"draft","text":"Science is knowledge about the natural world that we get by observing carefully, asking questions and testing our ideas with experiments.\nThe three main branches of science are:\n• Physics: matter and energy: forces, motion, heat, light, sound, electricity.\n• Chemistry: what substances are made of and how they change into new substances.\n• Biology: living things: plants, animals and people.\nOther branches study the Earth and the sky: Geology (rocks), Meteorology (weather) and Astronomy (planets and stars).\nScience helps us in daily life: medicines, electricity, phones, clean water and better farming all come from science.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Ndi wants to know why the water in a black pot gets hot faster in the sun than the water in a white pot. Which branch of science studies this?","steps":["The question is about heat, which is a form of energy.","Energy, heat, light and motion are studied in Physics."],"answer":"Physics.","checks":[]},"teach":{"cards":[{"id":"pc1-1","status":"draft","idea":"Science is knowledge we get by observing, asking questions and testing ideas with experiments.","vars":{},"example":["A farmer sees that maize grows better where there is manure. A scientist tests it: two plots, one with manure, one without."],"checks":[],"check":{"id":"pc1-1-check","type":"mcq","level":1,"review":"authored","sources":["science"],"vars":{},"prompt":"Which sentence describes science?","pool":{"right":[{"text":"Science is knowledge we get by observing and testing our ideas.","truth":"true"}],"wrong":[{"text":"Science is a list of facts we must believe without checking.","truth":"false","explain":"Scientists check their ideas with observations and experiments."},{"text":"Science is only done by people in big laboratories.","truth":"false","explain":"Anyone who observes carefully and tests ideas is doing science, even at home or on a farm."},{"text":"Science is the same thing as magic.","truth":"false","explain":"Science explains things by observing and testing, not by magic."}]},"pick":{"right":1,"wrong":3}}},{"id":"pc1-2","status":"draft","idea":"The three main branches: Physics (matter and energy), Chemistry (substances and how they change), Biology (living things).","vars":{},"example":["A rolling ball: Physics. Rusting iron: Chemistry. A growing plant: Biology."],"checks":[],"check":{"ref":"p1-branch"}},{"id":"pc1-3","status":"draft","idea":"Other branches study the Earth and the sky: Geology (rocks), Meteorology (weather), Astronomy (planets and stars).","vars":{},"example":["The rocks of Mount Cameroon: Geology. The rainy season: Meteorology. The Moon: Astronomy."],"checks":[],"check":{"ref":"p1-which"}}]},"questions":[{"id":"p1-branch","type":"matching","level":1,"review":"authored","sources":["science"],"prompt":"Match each branch of science with what it studies.","pick":4,"pool":[{"left":"Physics","right":"matter, energy, forces and motion"},{"left":"Chemistry","right":"substances and how they change"},{"left":"Biology","right":"living things"},{"left":"Geology","right":"rocks and the Earth's crust"},{"left":"Meteorology","right":"weather"},{"left":"Astronomy","right":"planets and stars"}]},{"id":"p1-which","type":"mcq","level":1,"review":"authored","sources":["science"],"vars":{"x":{"pick":[{"t":"how plants make their food","a":"Biology","why":"Plants are living things: Biology."},{"t":"how the heart pumps blood","a":"Biology","why":"The heart is part of a living body: Biology."},{"t":"why iron rusts","a":"Chemistry","why":"Rusting changes iron into a new substance: Chemistry."},{"t":"what table salt is made of","a":"Chemistry","why":"What substances are made of is Chemistry."},{"t":"how fast a taxi moves","a":"Physics","why":"Motion and speed are part of Physics."},{"t":"how sound travels through the air","a":"Physics","why":"Sound is a form of energy: Physics."},{"t":"the rocks of Mount Cameroon","a":"Geology","why":"Rocks and the Earth's crust are studied in Geology."},{"t":"the planets and the stars","a":"Astronomy","why":"Planets and stars are studied in Astronomy."},{"t":"tomorrow's weather in Buea","a":"Meteorology","why":"Weather is studied in Meteorology."}]}},"prompt":"A scientist studies {x.t}. Which branch of science is this?","correct":"{x.a}","distractors":[{"text":"Physics","misconception":"other"},{"text":"Chemistry","misconception":"other"},{"text":"Biology","misconception":"other"},{"text":"Geology","misconception":"other"},{"text":"Astronomy","misconception":"other"},{"text":"Meteorology","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Not this branch. Think: is it about energy and motion, substances, living things, rocks, weather or the sky?"}],"solution":["{x.why}","Answer: {answer}."]},{"id":"p1-true","type":"mcq","level":2,"review":"authored","sources":["science"],"vars":{},"prompt":"Which sentence is true?","pool":{"right":[{"text":"Physics, Chemistry and Biology are the three main branches of science.","truth":"true"},{"text":"Medicines, electricity and phones all came from science.","truth":"true"},{"text":"A scientist tests an idea before saying it is true.","truth":"true"}],"wro g discovered penicillin (1928), the first antibiotic.\n• Arthur Zang, a Cameroonian engineer, created the Cardiopad (about 2011), a tablet that records heart tests and sends them to a doctor.\nScience is done by people everywhere, including in Cameroon. You can be one of them.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"A nurse in a village health centre records a patient's heart test on a tablet and sends it to a heart doctor in Yaoundé. Which discovery made this possible, and who made it?","steps":["The tablet that records heart tests and sends them is the Cardiopad.","It was created by Arthur Zang, a Cameroonian engineer."],"answer":"The Cardiopad, created by Arthur Zang.","checks":[]},"teach":{"cards":[{"id":"pc2-1","status":"draft","idea":"Many great discoveries changed daily life: the telephone, electricity from generators, aeroplanes and medicines.","vars":{},"example":["Bell → the telephone. Faraday → electricity from magnets. Fleming → penicillin."],"checks":[],"check":{"ref":"p2-match"}},{"id":"pc2-2","status":"draft","idea":"Each discovery helps people in a different way: to talk, to travel, to have light and power, to stay healthy.","vars":{},"example":["Penicillin cures infections. The telephone carries our voice far away."],"checks":[],"check":{"id":"pc2-2-check","type":"mcq","level":1,"review":"authored","sources":["scientists"],"vars":{},"prompt":"Which discovery lets people talk to each other across long distances?","pool":{"right":[{"text":"the telephone","truth":"true"}],"wrong":[{"text":"penicillin","truth":"false","explain":"Penicillin cures infections."},{"text":"the aeroplane","truth":"false","explain":"The aeroplane lets people travel by air."},{"text":"the laws of motion","truth":"false","explain":"The laws of motion help engineers design machines and vehicles."}]},"pick":{"right":1,"wrong":3}}},{"id":"pc2-3","status":"draft","idea":"Science is done everywhere, including in Cameroon: Arthur Zang created the Cardiopa [k[2]]}","key":"[1687, 1876, 1831, 1898, 1928, 1903][k[2]]"},{"text":"{['Isaac Newton: the laws of motion and gravity', 'Alexander Graham Bell: the telephone', 'Michael Faraday: how to make electricity with magnets (the dynamo)', 'Marie Curie: radioactivity (with radium and polonium)', 'Alexander Fleming: penicillin (the first antibiotic)', 'the Wright brothers: the first powered aeroplane flight'][k[3]]}","key":"[1687, 1876, 1831, 1898, 1928, 1903][k[3]]"}]},{"id":"p2-spot","type":"spot_error","level":3,"review":"authored","sources":["scientists"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"Alexander Graham Bell made the telephone.","truth":"true"},{"text":"Alexander Fleming discovered penicillin.","truth":"true"},{"text":"Michael Faraday showed how to make electricity with magnets.","truth":"true"},{"text":"Arthur Zang created the Cardiopad.","truth":"true"}],"wrong":[{"text":"Isaac Newton made the first aeroplane.","truth":"false","explain":"Newton described motion and gravity. The first powered flight was by the Wright brothers."},{"text":"Marie Curie made the telephone.","truth":"false","explain":"Marie Curie studied radioactivity. The telephone was made by Bell."}]},"pick":{"right":3,"wrong":1}}]},"3":{"subject":"physics","class":"Form 1","lesson_no":3,"language":"en","prerequisites":[1],"skills":[{"id":"p3","name":"Physics and its branches"}],"note":{"status":"draft","text":"Physics is the branch of science that studies matter and energy and how they act on each other.\nSome branches of physics:\n• Mechanics: forces and motion (a rolling ball, a lever, a moving car).\n• Heat: temperature and how heat moves (a hot iron, a cooking pot).\n• Optics: light (mirrors, lenses, rainbows).\n• Sound (acoustics): how sound is made and travels (drums, echoes).\n• Electricity and magnetism: batteries, bulbs, wires, magnets, compasses.\nPhysics is all around us: in a taxi's brakes, a solar lamp, a radio and a phone.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"At night, Ayuk switches on a solar lamp that was charged in the sun during the day. Which branches of physics explain this?","steps":["The solar panel turns sunlight into electricity, which charges the battery: Electricity.","The lamp then gives out light: Optics."],"answer":"Electricity (the battery and panel) and Optics (the light).","checks":[]},"teach":{"cards":[{"id":"pc3-1","status":"draft","idea":"Physics studies matter and energy: forces, motion, heat, light, sound, electricity and magnetism.","vars":{},"example":["A football kicked into the air: forces and motion.","A radio playing music: electricity and sound."],"checks":[],"check":{"id":"pc3-1-check","type":"mcq","level":1,"review":"authored","sources":["physics-branches"],"vars":{},"prompt":"Which question is a physics question?","pool":{"right":[{"text":"Why does a ball roll down a slope?","truth":"true"},{"text":"How does a bulb light up?","truth":"true"}],"wrong":[{"text":"How does a goat digest grass?","truth":"false","explain":"Digestion in an animal is Biology."},{"text":"What is soap made of?","truth":"false","explain":"What substances are made of is Chemistry."},{"text":"Why do maize leaves turn yellow?","truth":"false","explain":"Plant health is Biology."}]},"pick":{"right":1,"wrong":3}}},{"id":"pc3-2","status":"draft","idea":"Mechanics is about forces and motion. Heat is about temperature. Optics is about light.","vars":{},"example":["Brakes stopping a taxi: Mechanics.","A hot iron: Heat. A mirror: Optics."],"checks":[],"check":{"ref":"p3-match"}},{"id":"pc3-3","status":"draft","idea":"Sound (acoustics) is about how sound is made and travels. Electricity and magnetism are about batteries, wires and magnets.","vars":{},"example":["A talking drum: Sound.","A torch: Electricity."],"checks":[],"check":{"ref":"p3-which"}}]},"questions":[{"id":"p3-match","type":"matching","level":1,"review":"authored","sources":["physics-branches"],"prompt":"Match each branch of physics with what it studies.","pick":4,"pool":[{"left":"Mechanics","right":"forces and motion"},{"left":"Heat","right":"temperature and how heat moves"},{"left":"Optics","right":"light, mirrors and lenses"},{"left":"Sound (acoustics)","right":"how sound is made and travels"},{"left":"Electricity and magnetism","right":"batteries, wires and magnets"}]},{"id":"p3-which","type":"mcq","level":1,"review":"authored","sources":["physics-branches"],"vars":{"x":{"pick":[{"t":"how a bicycle moves and stops","a":"Mechanics","why":"Forces and motion: Mechanics."},{"t":"why a metal spoon in hot tea gets hot","a":"Heat","why":"How heat moves: Heat (thermal physics)."},{"t":"how a mirror makes an image","a":"Optics","why":"Light and images: Optics."},{"t":"why a drum makes a loud sound","a":"Sound (acoustics)","why":"Sound: acoustics."},{"t":"how a torch battery lights a bulb","a":"Electricity and magnetism","why":"Batteries and bulbs: electricity."},{"t":"how a compass needle points north","a":"Electricity and magnetism","why":"A compass is a magnet: magnetism."},{"t":"how a lever helps lift a heavy stone","a":"Mechanics","why":"Forces and machines: Mechanics."},{"t":"how light bends in a glass of water","a":"Optics","why":"Light: Optics."}]}},"prompt":"Which branch of physics studies {x.t}?","correct":"{x.a}","distractors":[{"text":"Mechanics","misconception":"other"},{"text":"Heat","misconception":"other"},{"text":"Optics","misconception":"other"},{"text":"Sound (acoustics)","misconception":"other"},{"text":"Electricity and magnetism","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Not this one. Is it about forces and motion, heat, light, sound, or electricity and magnets?"}],"solution":["{x.why}","Answer: {answer}."]},{"id":"p3-sort","type":"matching","level":2,"review":"authored","sources":["physics-branches"],"groups":true,"pick":5,"group_order":["Physics","Chemistry","Biology"],"prompt":"Which branch of science does each question belong to?","pool":[{"left":"Why does a ball roll down a slope?","right":"Physics"},{"left":"How does a bulb light up?","right":"Physics"},{"left":"Why do we hear thunder after lightning?","right":"Physics"},{"left":"What is soap made of?","right":"Chemistry"},{"left":"Why does iron rust?","right":"Chemistry"},{"left":"How does a goat digest grass?","right":"Biology"},{"left":"Why do maize leaves turn yellow?","right":"Biology"}]},{"id":"p3-spot","type":"spot_error","level":3,"review":"authored","sources":["physics-branches"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"Optics studies light and mirrors.","truth":"true"},{"text":"Mechanics studies forces and motion.","truth":"true"},{"text":"A compass works because of magnetism.","truth":"true"},{"text":"Physics studies matter and energy.","truth":"true"}],"wrong":[{"text":"Optics studies sound.","truth":"false","explain":"Optics studies light. Sound is acoustics."},{"text":"Mechanics studies light and colours.","truth":"false","explain":"Mechanics studies forces and motion. Light is optics."}]},"pick":{"right":3,"wrong":1}}]},"4":{"subject":"physics","class":"Form 1","lesson_no":4,"language":"en","prerequisites":[3],"skills":[{"id":"p4","name":"How scientists work"}],"note":{"status":"draft","text":"Physicists observe nature and try to understand it. They work in steps (the scientific method):\n1. Observe something carefully.\n2. Ask a question about it.\n3. Suggest an answer that can be tested (a hypothesis).\n4. Test it with an experiment.\n5. Record and study the results.\n6. Draw a conclusion, and share it.\nA fair test changes only one thing at a time and keeps everything else the same. Scientists measure carefully, repeat experiments, and are honest about their results, even when the results show their idea was wrong.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Tabe wants to know if salt makes water boil faster. How can he make his test fair?","steps":["Use two pots that are the same, with the same amount of water, on the same fire.","Add salt to one pot only: change just one thing.","Measure the time each pot takes to boil.","Repeat the test to check the result."],"answer":"Change only the salt; keep everything else the same, measure, and repeat.","checks":[]},"teach":{"cards":[{"id":"pc4-1","status":"draft","idea":"Scientists work in steps: observe, ask a question, suggest an answer, test it, record the results, conclude.","vars":{},"example":["Observe: the black pot heats faster. Question: does colour matter? Test: two pots in the sun."],"checks":[],"check":{"ref":"p4-steps"}},{"id":"pc4-2","status":"draft","idea":"Each part of an investigation is one of these steps.","vars":{},"example":["“Every ten minutes Bih writes the temperature in a table” is recording the results."],"checks":[],"check":{"ref":"p4-which"}},{"id":"pc4-3","status":"draft","idea":"A fair test changes only one thing at a time and keeps everything else the same.","vars":{},"example":["To test salt, both pots get the same water and the same fire; only one gets salt."],"checks":[],"check":{"id":"pc4-3-check","type":"mcq","level":1,"review":"authored","sources":["method"],"vars":{},"prompt":"In a fair test, how many things do you change at a time?","pool":{"right":[{"text":"only one","truth":"true"}],"wrong":[{"text":"two","truth":"false","explain":"If two things change, you cannot tell which one caused the result."},{"text":"all of them","truth":"false","explain":"Then you cannot tell what caused the result."},{"text":"none","truth":"false","explain":"If nothing changes, there is nothing to test."}]},"pick":{"right":1,"wrong":3}}}]},"questions":[{"id":"p4-steps","type":"ordering","level":1,"review":"authored","sources":["method"],"order":"as_written","vars":{},"prompt":"Put the steps of the scientific method in order.","items":[{"text":"Observe something carefully"},{"text":"Ask a question about it"},{"text":"Suggest an answer to test (a hypothesis)"},{"text":"Test it with an experiment"},{"text":"Record and study the results"},{"text":"Draw a conclusion"}]},{"id":"p4-which","type":"mcq","level":1,"review":"authored","sources":["method"],"vars":{"x":{"pick":[{"t":"Bih notices that water in a black pot gets hot faster than in a white pot.","a":"Observe something carefully","why":"This is the step “Observe something carefully”."},{"t":"Bih asks: “Does the colour of a pot change how fast water heats up?”","a":"Ask a question about it","why":"This is the step “Ask a question about it”."},{"t":"Bih thinks: “Black pots take in more heat from the sun.”","a":"Suggest an answer to test (a hypothesis)","why":"This is the step “Suggest an answer to test (a hypothesis)”."},{"t":"Bih puts the same amount of water in a black pot and a white pot, side by side in the sun.","a":"Test it with an experiment","why":"This is the step “Test it with an experiment”."},{"t":"Every ten minutes Bih reads the thermometer in each pot and writes the temperature in a table.","a":"Record and study the results","why":"This is the step “Record and study the results”."},{"t":"Bih says: “The black pot heated faster, so colour does matter.”","a":"Draw a conclusion","why":"This is the step “Draw a conclusion”."}]}},"prompt":"{x.t}\nWhich step is this?","correct":"{x.a}","distractors":[{"text":"Observe something carefully","misconception":"other"},{"text":"Ask a question about it","misconception":"other"},{"text":"Suggest an answer to test (a hypothesis)","misconception":"other"},{"text":"Test it with an experiment","misconception":"other"},{"text":"Record and study the results","misconception":"other"},{"text":"Draw a conclusion","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Not quite. Is Bih looking, asking, guessing, testing, writing results, or deciding?"}],"solution":["{x.why}","Answer: {answer}."]},{"id":"p4-fair","type":"mcq","level":2,"review":"authored","sources":["method"],"vars":{},"prompt":"Ndi wants to test whether ures temperature."},{"text":"measuring cylinder","truth":"false","explain":"A measuring cylinder measures the volume of a liquid."}]},"pick":{"right":1,"wrong":3}}}]},"questions":[{"id":"p5-match","type":"matching","level":1,"review":"authored","sources":["equipment"],"prompt":"Match each instrument with what it measures.","pick":4,"pool":[{"left":"metre rule","right":"length"},{"left":"measuring tape","right":"length"},{"left":"beam balance","right":"mass"},{"left":"top-pan balance","right":"mass"},{"left":"measuring cylinder","right":"volume of a liquid"},{"left":"stopwatch","right":"time"},{"left":"thermometer","right":"temperature"},{"left":"spring balance (newton meter)","right":"weight (a force)"}],"groups":true},{"id":"p5-choose","type":"mcq","level":1,"review":"authored","sources":["equipment"],"vars":{"x":{"pick":[{"t":"the length of your desk","a":"metre rule","why":"To measure the length of your desk, use a metre rule."},{"t":"the length of the school field","a":"measuring tape","why":"To measure the length of the school field, use a measuring tape."},{"t":"the mass of a stone","a":"beam balance","why":"To measure the mass of a stone, use a beam balance."},{"t":"the volume of some palm oil","a":"measuring cylinder","why":"To measure the volume of some palm oil, use a measuring cylinder."},{"t":"how long a race takes","a":"stopwatch","why":"To measure how long a race takes, use a stopwatch."},{"t":"how hot the water in a pot is","a":"thermometer","why":"To measure how hot the water in a pot is, use a thermometer."},{"t":"the weight of a bag of rice","a":"spring balance (newton meter)","why":"To measure the weight of a bag of rice, use a spring balance (newton meter)."}]}},"prompt":"Which instrument would you use to measure {x.t}?","correct":"{x.a}","distractors":[{"text":"metre rule","misconception":"other"},{"text":"measuring tape","misconception":"other"},{"text":"beam balance","misconception":"other"},{"text":"top-pan balance","misconception":"other"},{ ,{"text":"Carry on with the experiment.","truth":"false","explain":"Stop and report it first."}]},"pick":{"right":1,"wrong":3}}},{"id":"pc6-3","status":"draft","idea":"Electricity and heat can hurt: keep water away from sockets, and do not touch apparatus that has just been heated.","vars":{},"example":["Wait for a heated tripod to cool before moving it."],"checks":[],"check":{"id":"pc6-3-check","type":"mcq","level":1,"review":"authored","sources":["safety"],"vars":{},"prompt":"Which is the safe thing to do?","pool":{"right":[{"text":"Dry your hands before you touch a switch.","truth":"true"}],"wrong":[{"text":"Touch the socket with wet hands to see if it works.","truth":"false","explain":"Water and electricity together can give a dangerous shock."},{"text":"Pick up the hot tripod quickly.","truth":"false","explain":"Heated apparatus can burn you: let it cool first."},{"text":"Pour water on a burning electric wire.","truth":"false","explain":"Water on electricity is dangerous: switch off and call the teacher."}]},"pick":{"right":1,"wrong":3}}}]},"questions":[{"id":"p6-sort","type":"matching","level":1,"review":"authored","sources":["safety"],"groups":true,"pick":6,"group_order":["safe","not safe"],"prompt":"Is each action safe or not safe in the laboratory?","pool":[{"left":"Walk, never run, in the laboratory.","right":"safe"},{"left":"Follow the teacher's instructions.","right":"safe"},{"left":"Tell the teacher at once about any accident or breakage.","right":"safe"},{"left":"Tie back long hair near a flame.","right":"safe"},{"left":"Switch off electricity and gas after use.","right":"safe"},{"left":"Wash your hands after an experiment.","right":"safe"},{"left":"Keep your bag away from the bench and the floor path.","right":"safe"},{"left":"Eat or drink in the laboratory.","right":"not safe"},{"left":"Touch electric sockets with wet hands.","right":"not safe"},{"left":"Pick up broken glass with bare hands.","right":"not safe"},{"left":"Taste a substance to find out what it is.","right":"not safe"},{"left":"Touch apparatus that has just been heated.","right":"not safe"},{"left":"Point a heated test tube at a classmate.","right":"not safe"}]},{"id":"p6-what","type":"mcq","level":2,"review":"authored","sources":["safety"],"vars":{"x":{"pick":[{"t":"A beaker breaks on the floor.","a":"Tell the teacher and do not touch the glass.","why":"Safety first: the teacher must know, and no one should take a risk."},{"t":"Your classmate burns a finger on a hot tripod.","a":"Tell the teacher at once.","why":"Safety first: the teacher must know, and no one should take a risk."},{"t":"You smell gas in the laboratory.","a":"Do not light anything and tell the teacher at once.","why":"Safety first: the teacher must know, and no one should take a risk."},{"t":"You do not understand an instruction.","a":"Ask the teacher before you start.","why":"Safety first: the teacher must know, and no one should take a risk."}]}},"prompt":"{x.t} What should you do?","correct":"{x.a}","distractors":[{"text":"Tell the teacher and do not touch the glass.","misconception":"other"},{"text":"Tell the teacher at once.","misconception":"other"},{"text":"Do not light anything and tell the teacher at once.","misconception":"other"},{"text":"Ask the teacher before you start.","misconception":"other"},{"text":"Carry on with the experiment.","misconception":"other"},{"text":"Hide it so you are not punished.","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Not the best choice here. Read what happened again."}],"solution":["{x.why}","Answer: {answer}."]},{"id":"p6-spot","type":"spot_error","level":3,"review":"authored","sources":["safety"],"vars":{},"prompt":"One rule is wrong. Which one?","pool":{"right":[{"text":"Wash your hands after an experiment.","truth":"true"},{"text":"Keep your bag away from the floor path.","truth":"true"},{"text":"Switch off the gas when you finish.","truth":"true"},{"text":"Walk, never run, in the laboratory.","truth":"true"}] "},{"text":"A radiographer designs bridges.","truth":"false","explain":"A radiographer takes X-ray pictures. Bridges are designed by civil engineers."}]},"pick":{"right":3,"wrong":1}}]},"8":{"subject":"physics","class":"Form 1","lesson_no":8,"language":"en","prerequisites":[5],"skills":[{"id":"p8","name":"Simple measurement"}],"note":{"status":"draft","text":"To measure something is to compare it with a standard unit. A measurement always has a number and a unit: 25 cm, 3 kg, 40 s. A number alone (just “25”) means nothing.\nUse the right instrument: a ruler for length, a balance for mass, a measuring cylinder for the volume of a liquid, a stopwatch for time, a thermometer for temperature.\nRead carefully:\n• Put your eye level with the mark, looking straight at the scale, not from the side (this avoids parallax error).\n• If the object does not start at zero, subtract: length = end reading − start reading.\n• Measure more than once and take the average.","checks":[]},"worked_example":{"status":"draft","vars":{"s":1.5,"e":7.3},"figure":"ruler(s, e)","problem":"How long is the object on the ruler?","steps":["The object starts at {s} cm, not at zero.","It ends at {e} cm.","Length = end − start = {e} − {s} = {e - s} cm."],"answer":"{e - s} cm","checks":["e - s == 5.8"]},"teach":{"cards":[{"id":"pc8-1","status":"draft","idea":"A measurement has a number and a unit. “{k}” alone means nothing; “{k} cm” is a measurement.","vars":{"n":120,"m":25,"k":25},"example":["The table is {n} cm long. The bag of rice has a mass of {m} kg."],"checks":[],"check":{"id":"pc8-1-check","type":"mcq","level":1,"review":"authored","sources":["measurement"],"vars":{"n":{"int":[12,95]}},"prompt":"Which is a complete measurement?","pool":{"right":[{"text":"{n} cm","truth":"true"}],"wrong":[{"text":"{n}","truth":"false","explain":"A measurement needs a unit as well as a number."},{"text":"centimetres","truth":"false","explain":"A unit alone is not a measurement: give the number too."},{"text":"very long","truth":"false","explain":"Words like “very long” are not a measurement: give a number and a unit."}]},"pick":{"right":1,"wrong":3}}},{"id":"pc8-2","status":"draft","idea":"Each quantity has its own instrument: length → ruler, mass → balance, volume of a liquid → measuring cylinder, time → stopwatch, temperature → thermometer.","vars":{},"example":["To time a race, use a stopwatch."],"checks":[],"check":{"ref":"p8-instrument"}},{"id":"pc8-3","status":"draft","idea":"Read a ruler with your eye straight above the mark. If the object does not start at zero, subtract the start reading from the end reading.","vars":{"s":1,"e":7.4},"example":["Start: {s} cm. End: {e} cm.","Length = {e} − {s} = {e - s} cm."],"checks":["e - s == 6.4"],"check":{"ref":"p8-ruler0"},"figure":"ruler(s, e)"}]},"questions":[{"id":"p8-instrument","type":"mcq","level":1,"review":"authored","sources":["measurement"],"vars":{"x":{"pick":[{"t":"length","a":"a ruler or metre rule","why":"Length is measured with a ruler or metre rule."},{"t":"mass","a":"a balance","why":"Mass is measured with a balance."},{"t":"the volume of a liquid","a":"a measuring cylinder","why":"The volume of a liquid is measured with a measuring cylinder."},{"t":"time","a":"a stopwatch","why":"Time is measured with a stopwatch."},{"t":"temperature","a":"a thermometer","why":"Temperature is measured with a thermometer."}]}},"prompt":"Which instrument measures {x.t}?","correct":"{x.a}","distractors":[{"text":"a ruler or metre rule","misconception":"other"},{"text":"a balance","misconception":"other"},{"text":"a measuring cylinder","misconception":"other"},{"text":"a stopwatch","misconception":"other"},{"text":"a thermometer","misconception":"other"}],"misconceptions":[{"id":"other","explain":"That instrument measures a different quantity."}],"solution":["{x.why}","Answer: {answer}."]},{"id":"p8-ruler0","type":"numeric","level":1,"review":"rule","sources":["measurement"],"vars":{"l":{"int":[15,78]},"o":{"pick":["pencil","piece ","truth":"true"},{"text":"volume","truth":"true"},{"text":"speed","truth":"true"},{"text":"area","truth":"true"},{"text":"weight","truth":"true"}],"wrong":[{"text":"love","truth":"false","explain":"Love cannot be measured with an instrument and has no unit."},{"text":"kindness","truth":"false","explain":"Kindness cannot be measured with an instrument and has no unit."},{"text":"beauty","truth":"false","explain":"Beauty cannot be measured with an instrument and has no unit."},{"text":"honesty","truth":"false","explain":"Honesty cannot be measured with an instrument and has no unit."},{"text":"happiness","truth":"false","explain":"Happiness cannot be measured with an instrument and has no unit."},{"text":"fear","truth":"false","explain":"Fear cannot be measured with an instrument and has no unit."},{"text":"anger","truth":"false","explain":"Anger cannot be measured with an instrument and has no unit."},{"text":"courage","truth":"false","explain":"Courage cannot be measured with an instrument and has no unit."}]},"pick":{"right":1,"wrong":3}},{"id":"p9-unit","type":"mcq","level":1,"review":"authored","sources":["quantities"],"vars":{"x":{"pick":[{"t":"length","a":"metre (m)","why":"length can be measured in metre (m)."},{"t":"mass","a":"kilogram (kg)","why":"mass can be measured in kilogram (kg)."},{"t":"time","a":"second (s)","why":"time can be measured in second (s)."},{"t":"volume of a liquid","a":"litre (L)","why":"volume of a liquid can be measured in litre (L)."},{"t":"temperature","a":"degree Celsius (°C)","why":"temperature can be measured in degree Celsius (°C)."}]}},"prompt":"Which unit can be used to measure {x.t}?","correct":"{x.a}","distractors":[{"text":"metre (m)","misconception":"other"},{"text":"kilogram (kg)","misconception":"other"},{"text":"second (s)","misconception":"other"},{"text":"litre (L)","misconception":"other"},{"text":"degree Celsius (°C)","misconception":"other"}],"misconceptions":[{"id":"other","explain":"That unit is for a different q ts come from these: area in m², volume in m³, speed in m/s.\nPrefixes make units bigger or smaller:\n• kilo (k) = 1000: 1 km = 1000 m, 1 kg = 1000 g\n• centi (c) = one hundredth: 1 m = 100 cm\n• milli (m) = one thousandth: 1 m = 1000 mm, 1 g = 1000 mg, 1 L = 1000 mL\nCareful: the SI unit of mass is the kilogram, not the gram.","checks":[]},"worked_example":{"status":"draft","vars":{"v":2.5,"a":"kg","b":"g"},"problem":"A bag of rice has a mass of {v} {a}. What is its mass in {b}?","steps":["Kilo means one thousand: 1 {a} = {factor(a, b)} {b}.","{v} {a} = {v} × {factor(a, b)} = {convertUnit(v, a, b)} {b}."],"answer":"{convertUnit(v, a, b)} {b}","checks":["convertUnit(v, a, b) == 2500"]},"teach":{"cards":[{"id":"pc10-1","status":"draft","idea":"The SI units are used by scientists everywhere: metre for length, kilogram for mass, second for time, kelvin for temperature, ampere for electric current.","vars":{"m":45,"t":12},"example":["Mass of a pupil: about {m} kg. A race: {t} s."],"checks":[],"check":{"ref":"p10-si"}},{"id":"pc10-2","status":"draft","idea":"Each unit has a symbol: metre m, kilogram kg, second s, kelvin K, ampere A. Symbols take no full stop and no s.","vars":{"n":5},"example":["{n} m (not {n} ms, and no full stop after m)."],"checks":[],"check":{"ref":"p10-symbol"}},{"id":"pc10-3","status":"draft","idea":"Prefixes: kilo = {factor('km', 'm')}, centi = one hundredth, milli = one thousandth.","vars":{},"example":["1 km = {factor('km', 'm')} m. 1 m = {factor('m', 'cm')} cm. 1 g = {factor('g', 'mg')} mg."],"checks":[],"check":{"ref":"p10-prefix"}}]},"questions":[{"id":"p10-si","type":"matching","level":1,"review":"authored","sources":["si-units"],"prompt":"Match each quantity with its SI unit.","pick":4,"pool":[{"left":"length","right":"metre"},{"left":"mass","right":"kilogram"},{"left":"time","right":"second"},{"left":"temperature","right":"kelvin"},{"left":"electric current","right":"ampere"}]},{"id":"p10-symbol","type":"matching","level":1,"review":"author
