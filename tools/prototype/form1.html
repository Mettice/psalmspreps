lse","explain":"Lines of longitude run from pole to pole; lines of latitude run east–west."},{"text":"The Equator is at 90°.","truth":"false","explain":"The Equator is 0°; the poles are at 90°."},{"text":"Most of the Earth’s surface is land.","truth":"false","explain":"About 71 % is water."}]},"pick":{"right":3,"wrong":1}}]},"4":{"subject":"geography","class":"Form 1","lesson_no":4,"language":"en","prerequisites":[3],"skills":[{"id":"g4","name":"Maps: marginal information and scale"}],"note":{"status":"draft","text":"A globe is a model of the Earth. It has the right shape, but it is small and hard to carry.\nA map is a flat drawing of the Earth, or of part of it, drawn to scale.\nMarginal information is written around the map, outside its frame:\n• title: what place the map shows;\n• key (legend): what the symbols and colours mean;\n• scale: how map distances compare with real distances;\n• north arrow: which way is north;\n• grid numbers: the numbers of the grid lines.\nThree ways to show a scale:\n• statement: “1 cm represents 1 km”;\n• representative fraction (ratio): 1 : 100 000;\n• linear scale: a line marked in kilometres.\nReal distance: measure on the map in cm, multiply by the scale number, then change cm to km (100 000 cm = 1 km).","checks":[]},"worked_example":{"status":"draft","vars":{"cm":6,"n":50000},"problem":"On a map with scale {ratio(n)}, the road from the school to the market measures {cm} cm. How long is the real road?","steps":["1 cm on the map is {fmt(n)} cm on the ground.","{cm} cm on the map is {cm} × {fmt(n)} = {fmt(cm * n)} cm on the ground.","There are {fmt(factor('km', 'cm'))} cm in 1 km, so {fmt(cm * n)} cm = {fmt(realKm(cm, n))} km."],"answer":"{fmt(realKm(cm, n))} km.","checks":[]},"teach":{"cards":[{"id":"gc4-1","status":"draft","idea":"A globe has the true shape of the Earth but is small and hard to carry. A map is flat: it can show a small place in detail and fit in a bag.","vars":{},"example":["To walk around Bamenda, take a map. To see the whole Earth’s shape, look at a globe."],"checks":[],"check":{"id":"gc4-1-check","type":"mcq","level":1,"review":"authored","sources":["maps"],"vars":{},"prompt":"Which is true about globes and maps?","pool":{"right":[{"text":"A globe shows the true shape of the Earth.","truth":"true"},{"text":"A map can show a small area, such as a town, in detail.","truth":"true"},{"text":"A map is easy to fold and carry.","truth":"true"}],"wrong":[{"text":"A globe is easier to carry than a map.","truth":"false","explain":"A globe is round and bulky; a map can be folded."},{"text":"A map is a model in the shape of a ball.","truth":"false","explain":"That is a globe; a map is flat."},{"text":"A globe can show every street of a town.","truth":"false","explain":"A globe is too small for that; a large-scale map can show streets."}]},"pick":{"right":1,"wrong":3}}},{"id":"gc4-2","status":"draft","idea":"The marginal information around a map helps you read it: title, key, scale, north arrow and grid numbers.","vars":{},"example":["The key tells you that a blue line is a river and a dashed line is a road."],"checks":[],"check":{"ref":"g4-letter"}},{"id":"gc4-3","status":"draft","idea":"A scale can be written in words (“1 cm represents 1 km”), as a ratio ({ratio(n)}), or drawn as a line marked in kilometres.","vars":{"n":50000},"example":["{ratio(n)} means 1 cm on the map is {fmt(n)} cm on the ground."],"checks":[],"check":{"ref":"g4-use"}},{"id":"gc4-4","status":"draft","idea":"To find a real distance: measure in cm on the map, multiply by the scale number, and change cm to km.","vars":{"cm":3,"n":50000},"example":["{cm} cm on a {ratio(n)} map: {cm} × {fmt(n)} = {fmt(cm * n)} cm = {fmt(realKm(cm, n))} km."],"checks":[],"check":{"id":"gc4-4-check","type":"numeric","level":1,"review":"rule","sources":["map-scale"],"vars":{"cm":{"int":[2,15]}},"prompt":"On a map with scale {ratio(100000)}, 1 cm represents 1 km. Two villages are {cm} cm apart on the map. How far apart are they on the ground?","answer":"realKm(cm, 100000)","unit":"km","misconceptions":[{"id":"cm","wrong":"cm * 100000","explain":"That is in centimetres. Change it to kilometres."}],"solution":["Each cm on this map is 1 km on the ground.","{cm} cm on the map = {answer} km."]}}]},"questions":[{"id":"g4-letter","type":"mcq","level":1,"review":"rule","sources":["maps"],"vars":{"k":{"int":[0,119]},"x":{"pick":[{"p":"title","why":"The title tells you what place the map shows."},{"p":"key","why":"The key explains what each symbol and colour means."},{"p":"scale","why":"The scale tells you how a distance on the map compares with the real distance."},{"p":"north arrow","why":"The north arrow shows which way is north."},{"p":"grid numbers","why":"The grid numbers name the grid lines, to help you find places."}]}},"figure":"marginMap(k)","prompt":"What does letter {marginLetter(k, x.p)} point to?","correct":"{x.p}","distractors":[{"text":"title","misconception":"other"},{"text":"key","misconception":"other"},{"text":"scale","misconception":"other"},{"text":"north arrow","misconception":"other"},{"text":"grid numbers","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Look at what is next to the letter: words at the top, a box of symbols, a line marked in km, an arrow with N, or numbers along the frame."}],"solution":["Letter {marginLetter(k, x.p)} points to the {answer}.","{x.why}"]},{"id":"g4-use","type":"mcq","level":1,"review":"authored","sources":["maps"],"vars":{"x":{"pick":[{"t":"what place the map shows","a":"title","why":"The title tells you what place the map shows."},{"t":"what each symbol on the map means","a":"key","why":"The key tells you what each symbol on the map means."},{"t":"how far apart places really are","a":"scale","why":"The scale tells you how far apart places really are."},{"t":"which direction is north","a":"north arrow","why":"The north arrow tells you which direction is north."},{"t":"the numbers of the lines used to find a place","a":"grid numbers","why":"The grid numbers tells you the numbers of the lines used to find a place."}]}},"prompt":"Which part of a map tells you {x.t}?","correct":"{x.a}","distractors":[{"text":"title","misconception":"other"},{"text":"key","misconception":"other"},{"text":"scale","misconception":"other"},{"text":"north arrow","misconception":"other"},{"text":"grid numbers","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Not that part. Read what each part of the marginal information does."}],"solution":["{x.why}","Answer: {answer}."]},{"id":"g4-real","type":"numeric","level":2,"review":"rule","sources":["map-scale"],"vars":{"n":{"pick":[25000,50000,100000,200000,250000,500000]},"cm":{"int":[2,12]}},"prompt":"A map has the scale {ratio(n)}. Two villages are {cm} cm apart on the map. How far apart are they on the ground?","answer":"realKm(cm, n)","unit":"km","misconceptions":[{"id":"m","wrong":"cm * n / 100","explain":"That is in metres. There are 100 000 cm in a kilometre, not 100."},{"id":"nocv","wrong":"cm * n","explain":"That is in centimetres. Divide by 100 000 to get kilometres."}],"solution":["1 cm on the map = {fmt(n)} cm on the ground.","{cm} × {fmt(n)} = {fmt(cm * n)} cm.","{fmt(cm * n)} cm ÷ {fmt(factor('km', 'cm'))} = {answer} km."]},{"id":"g4-rf","type":"mcq","level":2,"review":"rule","sources":["map-scale"],"vars":{"k":{"pick":[1,2,4,5,10]}},"prompt":"On a map, 1 cm represents {k} km. Write this scale as a ratio.","correct":"{ratio(k * 100000)}","distractors":[{"text":"{ratio(k * 1000)}","misconception":"m"},{"text":"{ratio(k * 100)}","misconception":"hundred"},{"text":"{ratio(k * 10000)}","misconception":"zeros"}],"misconceptions":[{"id":"m","explain":"1 km is 1000 metres, but the ratio must use the same unit on both sides: centimetres. 1 km = 100 000 cm."},{"id":"hundred","explain":"1 km = 100 000 cm, not 100 cm."},{"id":"zeros","explain":"Count the zeros: 1 km = 100 000 cm."}],"solution":["Both sides must be in cm: {k} km = {k} × {fmt(factor('km', 'cm'))} = {fmt(k * 100000)} cm.","So the scale is {answer}."]},{"id":"g4-type","type":"mcq","level":2,"review":"authored","sources":["map-scale"],"vars":{"x":{"pick":[{"t":"“1 cm represents 2 km”","a":"a statement scale","why":"“1 cm represents 2 km” is a statement scale."},{"t":"“1 : 50 000”","a":"a representative fraction (ratio)","why":"“1 : 50 000” is a representative fraction (ratio)."},{"t":"“1/100 000”","a":"a representative fraction (ratio)","why":"“1/100 000” is a representative fraction (ratio)."},{"t":"a line divided into kilometres","a":"a linear scale","why":"a line divided into kilometres is a linear scale."},{"t":"“one centimetre to half a kilometre”","a":"a statement scale","why":"“one centimetre to half a kilometre” is a statement scale."}]}},"prompt":"Which kind of scale is {x.t}?","correct":"{x.a}","distractors":[{"text":"a statement scale","misconception":"other"},{"text":"a representative fraction (ratio)","misconception":"other"},{"text":"a linear scale","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Not this kind. Words: statement. Numbers 1 : n: ratio. A line marked in km: linear scale."}],"solution":["{x.why}","Answer: {answer}."],"show":3},{"id":"g4-map","type":"numeric","level":3,"review":"rule","sources":["map-scale"],"vars":{"n":{"pick":[25000,50000,100000,200000,250000,500000]},"cm":{"int":[2,12]},"km":{"expr":"realKm(cm, n)"}},"prompt":"A road is {fmt(km)} km long. How long is it on a map with the scale {ratio(n)}?","answer":"mapCm(km, n)","unit":"cm","misconceptions":[{"id":"times","wrong":"realKm(km, n)","explain":"You multiplied by the scale. Going from the ground to the map, the distance gets smaller: divide."},{"id":"km","wrong":"km * 100000","explain":"That is the real distance in cm. Now divide by the scale number to get the map distance."}],"solution":["{fmt(km)} km = {fmt(km)} × {fmt(factor('km', 'cm'))} = {fmt(km * 100000)} cm on the ground.","On the map: {fmt(km * 100000)} ÷ {fmt(n)} = {answer} cm."]}]},"5":{"subject":"geography","class":"Form 1","lesson_no":5,"language":"en","prerequisites":[4],"skills":[{"id":"g5","name":"Grid references"}],"note":{"status":"draft","text":"Grid lines are numbered lines drawn on a map to help us find places.\n• Eastings are the lines going up and down. Their numbers are along the bottom and grow towards the east.\n• Northings are the lines going across. Their numbers are up the side and grow towards the north.\nA 4-figure grid reference names a square: first the easting of the line on the left of the square, then the northing of the line below it. Remember: “along the corridor, then up the stairs”.\nA 6-figure grid reference names a point: imagine each side of the square cut into ten. Write the easting and the tenths across, then the northing and the tenths up. 253347 means easting 25 and 3 tenths, northing 34 and 7 tenths.","checks":[]},"worked_example":{"status":"draft","vars":{"e0":23,"n0":41},"figure":"gridMap(e0, n0, [['clinic', 2.5, 1.5], ['market', 4.5, 3.5]])","problem":"What is the four-figure grid reference of the clinic?","steps":["Along the corridor: the line on the left of the clinic’s square is easting {e0 + 2}.","Up the stairs: the line below the square is northing {n0 + 1}.","Easting first, then northing."],"answer":"{grid4(e0 + 2, n0 + 1)}","checks":[]},"teach":{"cards":[{"id":"gc5-1","status":"draft","idea":"Eastings are the grid lines going up and down; their numbers are along the bottom. Northings go across; their numbers are up the side.","vars":{},"example":["Eastings grow as you go east (to the right). Northings grow as you go north (up)."],"checks":[],"check":{"id":"gc5-1-check","type":"mcq","level":1,"review":"authored","sources":["grid-ref"],"vars":{},"prompt":"Which sentence is true?","pool":{"right":[{"text":"Eastings are the lines going up and down the map.","truth":"true"},{"text":"Northings are the lines going across the map.","truth":"true"},{"text":"The easting numbers are written along the bottom of the map.","truth":"true"}],"wrong":[{"text":"Eastings are the lines going across the map.","truth":"false","explain":"Lines going across are northings. Eastings go up and down."},{"text":"Northing numbers get bigger towards the south.","truth":"false","explain":"Northing numbers get bigger towards the north."},{"text":"Easting numbers get bigger towards the west.","truth":"false","explain":"Easting numbers get bigger towards the east."}]},"pick":{"right":1,"wrong":3}}},{"id":"gc5-2","status":"draft","idea":"A four-figure grid reference names a square: the easting of the line on its left, then the northing of the line below it.","vars":{},"example":["“Along the corridor, then up the stairs”: easting first, northing second."],"checks":[],"check":{"ref":"g5-four"}},{"id":"gc5-3","status":"draft","idea":"To find a square from its grid reference, go along to the easting, then up to the northing: the square is to the right of and above that corner.","vars":{"e":25,"n":34},"example":["Square {grid4(e, n)}: along to easting {e}, up to northing {n}."],"checks":[],"check":{"ref":"g5-which"}},{"id":"gc5-4","status":"draft","idea":"A six-figure grid reference names a point: easting and tenths across, then northing and tenths up.","vars":{"e":25,"a":3,"n":34,"b":7},"example":["{grid6(e, a, n, b)}: easting {e} and {a} tenths, northing {n} and {b} tenths."],"checks":[],"check":{"id":"gc5-4-check","type":"mcq","level":1,"review":"rule","sources":["grid-ref"],"vars":{"e":{"int":[10,40]},"n":{"int":[10,40]},"a":{"int":[1,9]},"b":{"int":[1,9]}},"where":"e != n","prompt":"In the grid reference {grid6(e, a, n, b)}, which part gives the easting and its tenths?","correct":"{e}{a}","distractors":[{"text":"{n}{b}","misconception":"north"},{"text":"{e}","misconception":"tenths"},{"text":"{a}{n}","misconception":"split"}],"misconceptions":[{"id":"north","explain":"That is the northing. The easting always comes first."},{"id":"tenths","explain":"In a six-figure reference the easting has its tenths: three figures."},{"id":"split","explain":"Split the six figures into two groups of three: easting first, northing second."}],"solution":["Split {grid6(e, a, n, b)} into two groups of three figures.","The first group is the easting with its tenths: {answer}."]}}]},"questions":[{"id":"g5-four","type":"numeric","level":1,"review":"rule","sources":["grid-ref"],"vars":{"e0":{"int":[10,40]},"n0":{"int":[10,40]},"de":{"int":[0,4]},"dn":{"int":[0,4]},"ps":{"sample":["gridPlaces()","3"]}},"figure":"gridMap(e0, n0, [[ps[0], de + 0.5, dn + 0.5], [ps[1], (de + 2) % 5 + 0.5, (dn + 1) % 5 + 0.5], [ps[2], (de + 4) % 5 + 0.5, (dn + 3) % 5 + 0.5]])","prompt":"Give the 4-figure grid reference of the {ps[0]}.","answer":"num(grid4(e0 + de, n0 + dn))","misconceptions":[{"id":"swap","wrong":"num(grid4(n0 + dn, e0 + de))","explain":"You gave the northing first. Easting first: along the corridor, then up the stairs."},{"id":"right","wrong":"num(grid4(e0 + de + 1, n0 + dn))","explain":"Use the easting on the LEFT of the square, not the right."},{"id":"top","wrong":"num(grid4(e0 + de, n0 + dn + 1))","explain":"Use the northing BELOW the square, not above it."}],"solution":["Along the corridor: the line on the left of the {ps[0]}’s square is easting {e0 + de}.","Up the stairs: the line below it is northing {n0 + dn}.","Grid reference: {answer}."]},{"id":"g5-which","type":"mcq","level":1,"review":"rule","sources":["grid-ref"],"vars":{"e0":{"int":[10,40]},"n0":{"int":[10,40]},"de":{"int":[0,4]},"dn":{"int":[0,4]},"ps":{"sample":["gridPlaces()","3"]}},"figure":"gridMap(e0, n0, [[ps[0], de + 0.5, dn + 0.5], [ps[1], (de + 2) % 5 + 0.5, (dn + 1) % 5 + 0.5], [ps[2], (de + 4) % 5 + 0.5, (dn + 3) % 5 + 0.5]])","show":3,"prompt":"Which place is in grid square {grid4(e0 + de, n0 + dn)}?","correct":"{ps[0]}","distractors":[{"text":"{ps[1]}","misconception":"other"},{"text":"{ps[2]}","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Go along to easting {e0 + de} first, then up to northing {n0 + dn}. The square is to the right of and above that corner."}],"solution":["Along to easting {e0 + de}, up to northing {n0 + dn}.","The square to the right of and above that corner holds the {answer}."]},{"id":"g5-rule","type":"mcq","level":2,"review":"authored","sources":["grid-ref"],"vars":{},"prompt":"Which is the right way to give a 4-figure grid reference?","pool":{"right":[{"text":"The easting on the left of the square, then the northing below it.","truth":"true"}],"wrong":[{"text":"The northing below the square, then the easting on its left.","truth":"false","explain":"Easting first: along the corridor, then up the stairs."},{"text":"The easting on the right of the square, then the northing above it.","truth":"false","explain":"Use the lines on the left and below the square."},{"text":"The number of the square counted from the top of the map.","truth":"false","explain":"A grid reference uses the easting and northing numbers."},{"text":"Any two numbers you can see near the place.","truth":"false","explain":"Use the easting on the left of the square, then the northing below it."}]},"pick":{"right":1,"wrong":3}},{"id":"g5-six","type":"mcq","level":2,"review":"rule","sources":["grid-ref"],"vars":{"e0":{"int":[10,40]},"n0":{"int":[10,40]},"de":{"int":[0,4]},"dn":{"int":[0,4]},"ps":{"sample":["gridPlaces()","3"]},"te":{"int":[2,8]},"tn":{"int":[2,8]}},"where":["e0 + de != n0 + dn","abs(te - tn) >= 3"],"figure":"gridMap(e0, n0, [[ps[0], de + te / 10, dn + tn / 10], [ps[1], (de + 2) % 5 + 0.5, (dn + 1) % 5 + 0.5]])","prompt":"Give the 6-figure grid reference of the {ps[0]}.","correct":"{grid6(e0 + de, te, n0 + dn, tn)}","distractors":[{"text":"{grid6(n0 + dn, tn, e0 + de, te)}","misconception":"swap"},{"text":"{grid6(e0 + de, tn, n0 + dn, te)}","misconception":"tenths"},{"text":"{grid6(e0 + de + 1, te, n0 + dn, tn)}","misconception":"right"}],"misconceptions":[{"id":"swap","explain":"That gives the northing first. Easting and its tenths first, then northing and its tenths."},{"id":"tenths","explain":"The tenths are mixed up: the first tenths are across (east), the second tenths are up (north)."},{"id":"right","explain":"Start from the easting on the left of the square, then add the tenths across."}],"solution":["The {ps[0]} is right of easting {e0 + de} by {te} tenths of the square: {e0 + de}{te}.","It is above northing {n0 + dn} by {tn} tenths: {n0 + dn}{tn}.","Grid reference: {answer}."]},{"id":"g5-mistake","type":"mcq","level":3,"review":"authored","sources":["grid-ref"],"vars":{"e0":{"int":[10,40]},"n0":{"int":[10,40]},"de":{"int":[0,4]},"dn":{"int":[0,4]},"ps":{"sample":["gridPlaces()","3"]}},"where":"e0 + de != n0 + dn","figure":"gridMap(e0, n0, [[ps[0], de + 0.5, dn + 0.5], [ps[1], (de + 2) % 5 + 0.5, (dn + 1) % 5 + 0.5], [ps[2], (de + 4) % 5 + 0.5, (dn + 3) % 5 + 0.5]])","prompt":"A pupil says the {ps[0]} is in square {grid4(n0 + dn, e0 + de)}. What mistake was made?","correct":"The northing was given before the easting.","distractors":[{"text":"The easting on the right of the square was used.","misconception":"other"},{"text":"The northing above the square was used.","misconception":"other"},{"text":"There is no mistake: the answer is right.","misconception":"none"}],"misconceptions":[{"id":"other","explain":"Look again: the right answer is {grid4(e0 + de, n0 + dn)}. The same two numbers were used, in the wrong order."},{"id":"none","explain":"The right answer is {grid4(e0 + de, n0 + dn)}: easting first, then northing."}],"solution":["The {ps[0]}’s square has easting {e0 + de} and northing {n0 + dn}: {grid4(e0 + de, n0 + dn)}.","The same numbers were written the other way round. So: {answer}"]}]},"6":{"subject":"geography","class":"Form 1","lesson_no":6,"language":"en","prerequisites":[5],"skills":[{"id":"g6","name":"Reading latitude and longitude"}],"note":{"status":"draft","text":"The position of a place is given by its latitude and its longitude, latitude first: 4°N, 10°E.\nTo read a position on a map:\n1. Find the line of latitude through the place. Is it north (N) or south (S) of the Equator?\n2. Find the line of longitude through the place. Is it east (E) or west (W) of the Prime Meridian?\n3. Write the latitude, then the longitude.\nIf the place is halfway between two lines, its value is halfway between theirs: halfway between 4°N and 6°N is 5°N.\nThe Equator divides the Earth into the Northern and Southern Hemispheres; the Prime Meridian divides it into the Eastern and Western Hemispheres.\nCameroon is in the Northern and Eastern Hemispheres: roughly between 2°N and 13°N, and between 8°E and 16°E.","checks":[]},"worked_example":{"status":"draft","vars":{"a":4,"b":12},"figure":"graticule(0, 8, 2, [['Y', a, b]])","problem":"What is the position of place Y?","steps":["The line of latitude through Y is {lat(a)}: north of the Equator.","The line of longitude through Y is {lon(b)}: east of the Prime Meridian.","Latitude first, then longitude."],"answer":"{latlon(a, b)}","checks":[]},"teach":{"cards":[{"id":"gc6-1","status":"draft","idea":"A position is written latitude first, then longitude, each with its letter: N or S, then E or W.","vars":{"a":4,"b":10},"example":["{latlon(a, b)} means {lat(a)} latitude and {lon(b)} longitude."],"checks":[],"check":{"ref":"g6-read"}},{"id":"gc6-2","status":"draft","idea":"North or south of the Equator gives N or S. East or west of the Prime Meridian gives E or W.","vars":{"a":6},"example":["Below the Equator the latitude is S: {lat(-a)}. Left of the Prime Meridian the longitude is W: {lon(-a)}."],"checks":[],"check":{"ref":"g6-lat"}},{"id":"gc6-3","status":"draft","idea":"A place halfway between two lines has the value halfway between them.","vars":{"a":4},"example":["Halfway between {lat(a)} and {lat(a + 2)} is {lat(a + 1)}."],"checks":[],"check":{"id":"gc6-3-check","type":"mcq","level":1,"review":"rule","sources":["latlon"],"vars":{"a":{"int":[2,20],"step":2}},"prompt":"A place is halfway between the lines {lat(a)} and {lat(a + 2)}. What is its latitude?","correct":"{lat(a + 1)}","distractors":[{"text":"{lat(a)}","misconception":"line"},{"text":"{lat(a + 2)}","misconception":"line"},{"text":"{lat(-(a + 1))}","misconception":"hemi"}],"misconceptions":[{"id":"line","explain":"The place is between the lines, not on one: take the middle value."},{"id":"hemi","explain":"Both lines are north of the Equator, so the place is too: N."}],"solution":["The middle of {a} and {a + 2} is {a + 1}.","Both lines are north of the Equator: {answer}."]}}]},"questions":[{"id":"g6-read","type":"mcq","level":1,"review":"rule","sources":["latlon"],"vars":{"la0":{"int":[-8,4],"step":2},"lo0":{"int":[-10,6],"step":2},"i":{"int":[1,3]},"j":{"int":[1,3]}},"where":["la0 + 2 * i != 0","lo0 + 2 * j != 0","abs(la0 + 2 * i) != abs(lo0 + 2 * j)"],"figure":"graticule(la0, lo0, 2, [['P', la0 + 2 * i, lo0 + 2 * j], ['Q', la0 + 2 * (i % 3 + 1), lo0 + 2 * (j % 3 + 1)]])","prompt":"What is the position of place P?","correct":"{latlon(la0 + 2 * i, lo0 + 2 * j)}","distractors":[{"text":"{latlon(-(la0 + 2 * i), lo0 + 2 * j)}","misconception":"ns"},{"text":"{latlon(la0 + 2 * i, -(lo0 + 2 * j))}","misconception":"ew"},{"text":"{latlon(lo0 + 2 * j, la0 + 2 * i)}","misconception":"swap"}],"misconceptions":[{"id":"ns","explain":"Check N or S: is P above (north of) the Equator or below it?"},{"id":"ew","explain":"Check E or W: is P to the right (east) of the Prime Meridian or to the left?"},{"id":"swap","explain":"Latitude first: read the line going across through P, then the line going up and down."}],"solution":["The line of latitude through P is {lat(la0 + 2 * i)}.","The line of longitude through P is {lon(lo0 + 2 * j)}.","Position: {answer}."]},{"id":"g6-lat","type":"mcq","level":1,"review":"rule","sources":["latlon"],"vars":{"la0":{"int":[-8,4],"step":2},"lo0":{"int":[-10,6],"step":2},"i":{"int":[1,3]},"j":{"int":[1,3]}},"where":["la0 + 2 * i != 0","lo0 + 2 * j != 0","abs(la0 + 2 * i) != abs(lo0 + 2 * j)"],"figure":"graticule(la0, lo0, 2, [['P', la0 + 2 * i, lo0 + 2 * j], ['Q', la0 + 2 * (i % 3 + 1), lo0 + 2 * (j % 3 + 1)]])","prompt":"What is the latitude of place P?","correct":"{lat(la0 + 2 * i)}","distractors":[{"text":"{lat(-(la0 + 2 * i))}","misconception":"ns"},{"text":"{lon(lo0 + 2 * j)}","misconception":"lon"},{"text":"{lat(la0 + 2 * i + 2)}","misconception":"next"}],"misconceptions":[{"id":"ns","explain":"Check N or S: is P north of the Equator or south of it?"},{"id":"lon","explain":"That is the longitude. Latitude is read on the lines going across."},{"id":"next","explain":"That is the next line up. Read the line that passes through P."}],"solution":["The line going across through P is {lat(la0 + 2 * i)}.","Latitude: {answer}."]},{"id":"g6-half","type":"mcq","level":2,"review":"rule","sources":["latlon"],"vars":{"la0":{"int":[-8,4],"step":2},"lo0":{"int":[-10,6],"step":2},"i":{"int":[1,3]},"j":{"int":[1,3]}},"where":["la0 + 2 * i != 0","lo0 + 2 * j != 0","abs(la0 + 2 * i) != abs(lo0 + 2 * j)"],"figure":"graticule(la0, lo0, 2, [['R', la0 + 2 * i - 1, lo0 + 2 * j - 1]])","prompt":"Place R is halfway between grid lines. What is its position?","correct":"{latlon(la0 + 2 * i - 1, lo0 + 2 * j - 1)}","distractors":[{"text":"{latlon(la0 + 2 * i, lo0 + 2 * j)}","misconception":"line"},{"text":"{latlon(-(la0 + 2 * i - 1), lo0 + 2 * j - 1)}","misconception":"ns"},{"text":"{latlon(la0 + 2 * i - 1, -(lo0 + 2 * j - 1))}","misconception":"ew"}],"misconceptions":[{"id":"line","explain":"That is the nearest crossing of lines. R is halfway between lines: take the middle values."},{"id":"ns","explain":"Check N or S against the Equator."},{"id":"ew","explain":"Check E or W against the Prime Meridian."}],"solution":["R is halfway between latitudes {lat(la0 + 2 * i - 2)} and {lat(la0 + 2 * i)}: {lat(la0 + 2 * i - 1)}.","R is halfway between longitudes {lon(lo0 + 2 * j - 2)} and {lon(lo0 + 2 * j)}: {lon(lo0 + 2 * j - 1)}.","Position: {answer}."]},{"id":"g6-hemi","type":"mcq","level":2,"review":"rule","sources":["latlon"],"vars":{"a":{"int":[-60,60]},"b":{"int":[-170,170]}},"where":["a != 0","b != 0"],"prompt":"A place is at {latlon(a, b)}. Which hemispheres is it in?","correct":"{a > 0 ? 'Northern' : 'Southern'} and {b > 0 ? 'Eastern' : 'Western'}","distractors":[{"text":"Northern and Eastern","misconception":"hemi"},{"text":"Northern and Western","misconception":"hemi"},{"text":"Southern and Eastern","misconception":"hemi"},{"text":"Southern and Western","misconception":"hemi"}],"misconceptions":[{"id":"hemi","explain":"N is the Northern Hemisphere and S the Southern; E is the Eastern Hemisphere and W the Western."}],"solution":["{lat(a)}: {a > 0 ? 'N, north' : 'S, south'} of the Equator. {lon(b)}: {b > 0 ? 'E, east' : 'W, west'} of the Prime Meridian.","So: {answer}."]},{"id":"g6-apart","type":"numeric","level":3,"review":"rule","sources":["latlon"],"vars":{"a":{"int":[-30,30]},"b":{"int":[-30,30]}},"where":["a * b \u003c 0"],"prompt":"Town A is at latitude {lat(a)} and town B at {lat(b)}. How many degrees of latitude apart are they?","answer":"abs(a - b)","unit":"°","misconceptions":[{"id":"sub","wrong":"abs(abs(a) - abs(b))","explain":"The towns are on opposite sides of the Equator: add the two latitudes."}],"solution":["One town is north of the Equator and the other south: add.","{abs(a)} + {abs(b)} = {answer}°."]}]},"7":{"subject":"geography","class":"Form 1","lesson_no":7,"language":"en","prerequisites":[3],"skills":[{"id":"g7","name":"Rotation and revolution of the Earth"}],"note":{"status":"draft","text":"The Earth makes two movements.\nRotation: the Earth spins on its axis (an imaginary line through the poles) from west to east, once in about 24 hours: one day.\nEffects of rotation:\n• day and night (the half facing the Sun has day);\n• the Sun seems to rise in the east and set in the west;\n• places on different meridians have different times.\nRevolution: the Earth travels round the Sun in an orbit, once in about 365¼ days: one year. Every four years the extra quarters make a leap year of 366 days, with 29 February.\nEffects of revolution, because the axis is tilted (about 23½°):\n• the seasons;\n• days and nights of different lengths during the year.\nAt the equinoxes (about 21 March and 23 September) day and night are equal everywhere. The solstices are about 21 June and 22 December.","checks":[]},"worked_example":{"status":"draft","vars":{"a":150},"figure":"dayNight(a)","problem":"In the drawing, is it day or night at town T?","steps":["The Sun’s rays come from the left, so the left half of the Earth, facing the Sun, has day.","The right half faces away from the Sun and has night.","T is on the left half."],"answer":"It is {dayOrNight(a)} at T.","checks":[]},"teach":{"cards":[{"id":"gc7-1","status":"draft","idea":"The Earth rotates (spins on its axis) from west to east, once in about {h} hours. This gives day and night.","vars":{"h":24},"example":["The half of the Earth facing the Sun has day; the other half has night."],"checks":[],"check":{"ref":"g7-dn"}},{"id":"gc7-2","status":"draft","idea":"Because the Earth turns from west to east, the Sun seems to rise in the east and set in the west.","vars":{},"example":["In Bertoua the Sun rises before it rises in Buea, because Bertoua is further east."],"checks":[],"check":{"ref":"g7-sort"}},{"id":"gc7-3","status":"draft","idea":"The Earth revolves (travels) round the Sun once in about {d} days: one year. Every fourth year is a leap year of {d2} days.","vars":{"d":"365¼","d2":366,"f":29},"example":["In a leap year February has {f} days."],"checks":[],"check":{"id":"gc7-3-check","type":"mcq","level":1,"review":"authored","sources":["earth-movements"],"vars":{},"prompt":"Which takes about one year?","pool":{"right":[{"text":"one revolution of the Earth round the Sun","truth":"true"}],"wrong":[{"text":"one rotation of the Earth on its axis","truth":"false","explain":"One rotation takes about one day."},{"text":"one spin of the Earth","truth":"false","explain":"A spin (rotation) takes about one day."},{"text":"the time from sunrise to sunset","truth":"false","explain":"That is part of one day."},{"text":"the Moon going round the Earth","truth":"false","explain":"That takes about a month."}]},"pick":{"right":1,"wrong":3}}},{"id":"gc7-4","status":"draft","idea":"The Earth’s axis is tilted. As the Earth revolves, this tilt gives the seasons and days and nights of different lengths.","vars":{},"example":["At the equinoxes, day and night are equal everywhere."],"checks":[],"check":{"id":"gc7-4-check","type":"mcq","level":1,"review":"authored","sources":["earth-movements"],"vars":{},"prompt":"What causes the seasons?","pool":{"right":[{"text":"the revolution of the Earth with its tilted axis","truth":"true"}],"wrong":[{"text":"the rotation of the Earth","truth":"false","explain":"Rotation gives day and night, not seasons."},{"text":"the Moon","truth":"false","explain":"The Moon causes tides, not seasons."},{"text":"clouds covering the Sun","truth":"false","explain":"Clouds change the weather, not the seasons of the year."},{"text":"the Sun moving round the Earth","truth":"false","explain":"The Earth moves round the Sun."}]},"pick":{"right":1,"wrong":3}}}]},"questions":[{"id":"g7-dn","type":"mcq","level":1,"review":"rule","sources":["earth-movements"],"vars":{"a":{"pick":[0,30,45,135,150,180,210,225,315,330]}},"figure":"dayNight(a)","show":2,"prompt":"The Sun’s rays come from the left. Is it day or night at town T?","correct":"{dayOrNight(a)}","distractors":[{"text":"{dayOrNight(a) == 'day' ? 'night' : 'day'}","misconception":"side"}],"misconceptions":[{"id":"side","explain":"The half of the Earth facing the Sun (the left half here) has day; the other half has night."}],"solution":["The left half faces the Sun and has day.","T is on the {dayOrNight(a) == 'day' ? 'left' : 'right'} half: {answer}."]},{"id":"g7-sort","type":"matching","level":1,"review":"authored","sources":["earth-movements"],"groups":true,"pick":6,"group_order":["rotation","revolution"],"prompt":"Sort these: are they about rotation or revolution?","pool":[{"left":"day and night","right":"rotation"},{"left":"takes about 24 hours","right":"rotation"},{"left":"the Sun seems to rise in the east","right":"rotation"},{"left":"different times in different places","right":"rotation"},{"left":"takes about 365¼ days","right":"revolution"},{"left":"the seasons","right":"revolution"},{"left":"leap years","right":"revolution"},{"left":"days longer in some months than others","right":"revolution"}]},{"id":"g7-days","type":"numeric","level":2,"review":"rule","sources":["earth-movements"],"vars":{"y":{"int":[2025,2040]}},"prompt":"How many days are there in the year {y}?","answer":"daysInYear(y)","unit":"days","misconceptions":[{"id":"leap","wrong":"daysInYear(y) == 366 ? 365 : 366","explain":"A leap year comes every four years: the year can be divided exactly by 4. Check {y}."}],"solution":["{y} ÷ {4} = {round(y / 4, 2)}: {isLeap(y) ? 'it divides exactly, so it is a leap year' : 'it does not divide exactly, so it is not a leap year'}.","{y} has {answer} days."]},{"id":"g7-rs","type":"mcq","level":2,"review":"rule","sources":["earth-movements"],"vars":{"a":{"pick":[70,75,80,250,255,260]}},"figure":"dayNight(a)","show":2,"prompt":"The Earth turns in the direction of the arrow. Will town T soon have sunrise or sunset?","correct":"{sunriseOrSunset(a)}","distractors":[{"text":"{sunriseOrSunset(a) == 'sunrise' ? 'sunset' : 'sunrise'}","misconception":"way"}],"misconceptions":[{"id":"way","explain":"Follow the arrow: is T being carried from night into day (sunrise) or from day into night (sunset)?"}],"solution":["T is near the line between day and night.","Following the arrow, T moves {sunriseOrSunset(a) == 'sunrise' ? 'from night into day' : 'from day into night'}: {answer}."]},{"id":"g7-leap","type":"mcq","level":3,"review":"rule","sources":["earth-movements"],"vars":{"y":{"int":[2004,2096],"step":4}},"prompt":"Which of these years is a leap year?","correct":"{y}","distractors":[{"text":"{y + 1}","misconception":"no"},{"text":"{y + 2}","misconception":"no"},{"text":"{y + 3}","misconception":"no"},{"text":"{y - 1}","misconception":"no"}],"misconceptions":[{"id":"no","explain":"A leap year can be divided exactly by 4. This year cannot."}],"solution":["A leap year can be divided exactly by {4}.","{y} ÷ {4} = {y / 4} exactly, so {answer} is a leap year."]},{"id":"g7-spot","type":"spot_error","level":3,"review":"authored","sources":["earth-movements"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"The Earth rotates from west to east.","truth":"true"},{"text":"One rotation takes about 24 hours.","truth":"true"},{"text":"Revolution and the tilted axis cause the seasons.","truth":"true"},{"text":"At the equinoxes, day and night are equal.","truth":"true"},{"text":"A leap year has 366 days.","truth":"true"}],"wrong":[{"text":"The Earth rotates from east to west.","truth":"false","explain":"It rotates from west to east; that is why the Sun seems to rise in the east."},{"text":"The Sun moves round the Earth once a day.","truth":"false","explain":"The Sun only seems to move: the Earth is rotating."},{"text":"Rotation causes the seasons.","truth":"false","explain":"Rotation causes day and night; revolution with the tilted axis causes the seasons."},{"text":"One revolution takes about 24 hours.","truth":"false","explain":"One revolution takes about 365¼ days; one rotation takes about 24 hours."}]},"pick":{"right":3,"wrong":1}}]},"8":{"subject":"geography","class":"Form 1","lesson_no":8,"language":"en","prerequisites":[6,7],"skills":[{"id":"g8","name":"Local time and standard time"}],"note":{"status":"draft","text":"The Earth turns through 360° in 24 hours, so it turns 15° in 1 hour and 1° in 4 minutes.\nLocal time: it is 12 noon at a place when the Sun is highest in its sky. Places on the same meridian have the same local time.\nThe Earth turns from west to east, so places to the east see the Sun first: their time is ahead. Places to the west are behind.\nTo find the local time of a place:\n1. Find the difference in longitude (same side of 0°: subtract; opposite sides: add).\n2. Multiply by 4 minutes.\n3. East: add the time. West: subtract it.\nStandard time: a country uses one time for all its places, the time of one chosen meridian. Cameroon uses West Africa Time, one hour ahead of Greenwich (GMT+1), the time of 15°E.","checks":[]},"worked_example":{"status":"draft","vars":{"t":600,"L":45},"problem":"When it is {clock(t)} at Greenwich ({lon(0)}), what is the local time at a town on {lon(L)}?","steps":["Difference in longitude: {lonDiff(L, 0)}°.","Time difference: {lonDiff(L, 0)} × {minutesPerDegree()} = {timeForDegrees(L)} minutes = {duration(timeForDegrees(L))}.","The town is east of Greenwich, so its time is ahead: add."],"answer":"{clock(localTime(t, 0, L))}","checks":[]},"teach":{"cards":[{"id":"gc8-1","status":"draft","idea":"The Earth turns through {360}° in {24} hours, so it turns {degreesPerHour()}° in 1 hour.","vars":{},"example":["Two places {2 * degreesPerHour()}° apart have a time difference of {duration(120)}."],"checks":[],"check":{"ref":"g8-hours"}},{"id":"gc8-2","status":"draft","idea":"Each degree of longitude makes a difference of {minutesPerDegree()} minutes in time.","vars":{"d":10},"example":["{d}° apart: {d} × {minutesPerDegree()} = {timeForDegrees(d)} minutes."],"checks":[],"check":{"ref":"g8-mins"}},{"id":"gc8-3","status":"draft","idea":"Places to the east see the Sun first, so their local time is ahead. Places to the west are behind.","vars":{},"example":["When the local time is noon in Limbe, it is already after noon in Bertoua, further east."],"checks":[],"check":{"ref":"g8-east"}},{"id":"gc8-4","status":"draft","idea":"Standard time is one time used by a whole country. Cameroon uses West Africa Time: {zone(cam)}.","vars":{"t":540,"cam":15},"example":["When it is {clock(t)} at Greenwich, it is {clock(localTime(t, 0, cam))} in Yaoundé and in Garoua."],"checks":[],"check":{"id":"gc8-4-check","type":"mcq","level":1,"review":"rule","sources":["time-zones"],"vars":{"t":{"int":[360,1020],"step":30}},"show":3,"prompt":"Cameroon uses {zone(15)}. When it is {clock(t)} at Greenwich (GMT), what time is it in Cameroon?","correct":"{clock(t + 60)}","distractors":[{"text":"{clock(t - 60)}","misconception":"way"},{"text":"{clock(t)}","misconception":"same"}],"misconceptions":[{"id":"way","explain":"GMT+1 is ahead of Greenwich: add one hour."},{"id":"same","explain":"Cameroon is not on Greenwich time: it is one hour ahead."}],"solution":["{zone(15)} is one hour ahead of Greenwich.","{clock(t)} + 1 hour = {answer}"]}}]},"questions":[{"id":"g8-hours","type":"numeric","level":1,"review":"rule","sources":["local-time"],"vars":{"k":{"int":[1,10]}},"prompt":"Two places are {k * 15}° of longitude apart. What is the difference in their local times, in hours?","answer":"k","unit":"hours","misconceptions":[{"id":"min","wrong":"timeForDegrees(k * 15)","explain":"That is the difference in minutes. Divide by 60, or divide the degrees by 15."},{"id":"times","wrong":"k * 15 * 15","explain":"Divide by 15, do not multiply: 15° is 1 hour."}],"solution":["{degreesPerHour()}° = 1 hour.","{k * 15} ÷ {degreesPerHour()} = {answer} hours."]},{"id":"g8-mins","type":"numeric","level":1,"review":"rule","sources":["local-time"],"vars":{"d":{"int":[2,40]}},"prompt":"Two places are {d}° of longitude apart. What is the difference in their local times, in minutes?","answer":"timeForDegrees(d)","unit":"minutes","misconceptions":[{"id":"fifteen","wrong":"d * 15","explain":"15 is degrees per hour. For minutes, each degree is 4 minutes."},{"id":"same","wrong":"d","explain":"Each degree is 4 minutes, not 1 minute: multiply by 4."}],"solution":["Each degree = {minutesPerDegree()} minutes.","{d} × {minutesPerDegree()} = {answer} minutes."]},{"id":"g8-east","type":"mcq","level":1,"review":"rule","sources":["local-time"],"vars":{"a":{"int":[-90,90],"step":5},"b":{"int":[-90,90],"step":5}},"where":"a != b","show":3,"prompt":"Town A is at {lon(a)} and town B is at {lon(b)}. Which town’s local time is ahead?","correct":"{a > b ? 'Town A' : 'Town B'}","distractors":[{"text":"{a > b ? 'Town B' : 'Town A'}","misconception":"west"},{"text":"They have the same time.","misconception":"same"}],"misconceptions":[{"id":"west","explain":"That town is further west. The town further east sees the Sun first, so its time is ahead."},{"id":"same","explain":"They are on different meridians, so their local times are different."}],"solution":["{a > b ? 'Town A' : 'Town B'} is further east.","Places further east are ahead: {answer}."]},{"id":"g8-diff","type":"numeric","level":2,"review":"rule","sources":["local-time"],"vars":{"a":{"int":[-90,90],"step":5},"b":{"int":[-90,90],"step":5}},"where":["a != 0","b != 0","a != b","abs(a) != abs(b)"],"prompt":"What is the difference in longitude between {lon(a)} and {lon(b)}?","answer":"lonDiff(a, b)","unit":"°","misconceptions":[{"id":"sub","wrong":"abs(abs(a) - abs(b))","when":"a * b \u003c 0","explain":"One place is east of Greenwich and one is west: add the two longitudes."},{"id":"add","wrong":"abs(a) + abs(b)","when":"a * b > 0","explain":"Both places are on the same side of Greenwich: subtract the smaller longitude from the larger."}],"solution":["{a * b \u003c 0 ? 'Opposite sides of Greenwich: add' : 'Same side of Greenwich: subtract'}.","{a * b \u003c 0 ? abs(a) + ' + ' + abs(b) : max(abs(a), abs(b)) + ' − ' + min(abs(a), abs(b))} = {answer}°."]},{"id":"g8-local","type":"mcq","level":2,"review":"rule","sources":["local-time"],"vars":{"t":{"int":[360,1080],"step":30},"L":{"int":[-75,75],"step":5}},"where":["L != 0","sameDay(localTime(t, 0, L))"],"prompt":"It is {clock(t)} at Greenwich (0°). What is the local time at a place on {lon(L)}?","correct":"{clock(localTime(t, 0, L))}","distractors":[{"text":"{clock(localTime(t, 0, -L))}","misconception":"way"},{"text":"{clock(t + L)}","misconception":"one"},{"text":"{clock(t + 15 * L)}","misconception":"fifteen"}],"misconceptions":[{"id":"way","explain":"Check the direction: east is ahead (add), west is behind (subtract)."},{"id":"one","explain":"Each degree is 4 minutes, not 1 minute."},{"id":"fifteen","explain":"Each degree is 4 minutes. 15 is the number of degrees in one hour."}],"solution":["Difference in longitude: {abs(L)}°. Time: {abs(L)} × {minutesPerDegree()} = {duration(timeForDegrees(abs(L)))}.","{L > 0 ? 'East' : 'West'} of Greenwich: {L > 0 ? 'add' : 'subtract'}. {clock(t)} {L > 0 ? '+' : '−'} {duration(timeForDegrees(abs(L)))} = {answer}"]},{"id":"g8-ab","type":"mcq","level":3,"review":"rule","sources":["local-time"],"vars":{"t":{"int":[360,1080],"step":15},"a":{"int":[-60,60],"step":5},"b":{"int":[-60,60],"step":5}},"where":["a != b","sameDay(localTime(t, a, b))"],"prompt":"It is {clock(t)} at town A ({lon(a)}). What is the local time at town B ({lon(b)})?","correct":"{clock(localTime(t, a, b))}","distractors":[{"text":"{clock(localTime(t, b, a))}","misconception":"way"},{"text":"{clock(t + (b - a))}","misconception":"one"},{"text":"{clock(t + minutesPerDegree() * (b > a ? 1 : -1) * abs(abs(b) - abs(a)))}","misconception":"sub","when":"a * b \u003c 0"}],"misconceptions":[{"id":"way","explain":"Check the direction: if B is east of A, B is ahead (add); if west, B is behind (subtract)."},{"id":"one","explain":"Each degree is 4 minutes, not 1 minute."},{"id":"sub","explain":"A and B are on opposite sides of Greenwich: add their longitudes to find the difference."}],"min_distractors":2,"solution":["Difference in longitude: {lonDiff(a, b)}°. Time: {lonDiff(a, b)} × {minutesPerDegree()} = {duration(timeForDegrees(lonDiff(a, b)))}.","B is {b > a ? 'east' : 'west'} of A: {b > a ? 'add' : 'subtract'}. {clock(t)} {b > a ? '+' : '−'} {duration(timeForDegrees(lonDiff(a, b)))} = {answer}"]}]},"9":{"subject":"geography","class":"Form 1","lesson_no":9,"language":"en","prerequisites":[8],"skills":[{"id":"g9","name":"Time from GMT and time zones"}],"note":{"status":"draft","text":"GMT (Greenwich Mean Time) is the time on the Prime Meridian (0°), which passes through Greenwich in London.\nLocal time from GMT: find the longitude of the place, multiply by 4 minutes, then add for east or subtract for west.\nTime zones: 360° ÷ 24 hours gives 24 zones, each about 15° wide. Each zone uses the time of its standard meridian, a multiple of 15°:\n• 15°E: GMT+1, 30°E: GMT+2, 45°E: GMT+3 …\n• 15°W: GMT−1, 30°W: GMT−2 …\nZone borders often follow country borders, so that a country keeps one time. Very wide countries have several zones.\nThe International Date Line is near 180°. Crossing it, travellers change the date by one day.\nCameroon, Nigeria, Gabon and Chad use GMT+1.","checks":[]},"worked_example":{"status":"draft","vars":{"t":840,"L":-37},"problem":"It is {clock(t)} GMT. What is the local time at a place on {lon(L)}?","steps":["The place is {abs(L)}° west of Greenwich.","{abs(L)} × {minutesPerDegree()} = {timeForDegrees(abs(L))} minutes = {duration(timeForDegrees(abs(L)))}.","West is behind: subtract. {clock(t)} − {duration(timeForDegrees(abs(L)))}."],"answer":"{clock(localTime(t, 0, L))}","checks":[]},"teach":{"cards":[{"id":"gc9-1","status":"draft","idea":"GMT is the time on the Prime Meridian ({lon(0)}) at Greenwich. Times around the world are compared with GMT.","vars":{},"example":["{zone(15)} means one hour ahead of GMT."],"checks":[],"check":{"id":"gc9-1-check","type":"mcq","level":1,"review":"authored","sources":["time-zones"],"vars":{},"prompt":"Where is GMT, Greenwich Mean Time, measured?","pool":{"right":[{"text":"on the Prime Meridian (0°), at Greenwich","truth":"true"}],"wrong":[{"text":"on the Equator","truth":"false","explain":"The Equator is a line of latitude; time is measured from the Prime Meridian."},{"text":"in Yaoundé","truth":"false","explain":"Yaoundé uses GMT+1, one hour ahead of Greenwich."},{"text":"on the International Date Line","truth":"false","explain":"The Date Line is near 180°, on the other side of the Earth from Greenwich."},{"text":"at the North Pole","truth":"false","explain":"GMT is the time on the Prime Meridian at Greenwich."}]},"pick":{"right":1,"wrong":3}}},{"id":"gc9-2","status":"draft","idea":"The world has {24} time zones of about {degreesPerHour()}° each. Each zone uses the time of a standard meridian that is a multiple of {degreesPerHour()}°.","vars":{"m":45},"example":["The zone of {lon(m)} is {zone(m)}."],"checks":[],"check":{"ref":"g9-zone"}},{"id":"gc9-3","status":"draft","idea":"Each {degreesPerHour()}° east of Greenwich is one hour ahead of GMT; each {degreesPerHour()}° west is one hour behind.","vars":{"m":30},"example":["{lon(m)}: {zone(m)}. {lon(-m)}: {zone(-m)}."],"checks":[],"check":{"ref":"g9-ahead"}}]},"questions":[{"id":"g9-zone","type":"mcq","level":1,"review":"rule","sources":["time-zones"],"vars":{"m":{"int":[-150,165],"step":15}},"where":"m != 0","prompt":"A country uses the standard meridian {lon(m)}. What is its time zone?","correct":"{zone(m)}","distractors":[{"text":"{zone(-m)}","misconception":"way"},{"text":"{zone(m + 15)}","misconception":"count"},{"text":"{zone(m - 15)}","misconception":"count"}],"misconceptions":[{"id":"way","explain":"East of Greenwich is ahead (+); west is behind (−)."},{"id":"count","explain":"Divide the longitude by 15 to find the number of hours."}],"solution":["{abs(m)} ÷ {degreesPerHour()} = {abs(m) / degreesPerHour()} hour{abs(m) == 15 ? '' : 's'}, {m > 0 ? 'east: ahead' : 'west: behind'}.","Time zone: {answer}."]},{"id":"g9-ahead","type":"numeric","level":1,"review":"rule","sources":["time-zones"],"vars":{"k":{"int":[1,11]}},"prompt":"A place uses the time of the meridian {lon(15 * k)}. How many hours ahead of GMT is it?","answer":"k","unit":"hours","misconceptions":[{"id":"min","wrong":"timeForDegrees(15 * k)","explain":"That is the difference in minutes. Divide the longitude by 15 for hours."}],"solution":["{degreesPerHour()}° = 1 hour.","{15 * k} ÷ {degreesPerHour()} = {answer} hours ahead."]},{"id":"g9-std","type":"mcq","level":2,"review":"rule","sources":["time-zones"],"vars":{"t":{"int":[360,1080],"step":30},"h":{"int":[-6,6]}},"where":["h != 0","sameDay(t + 60 * h)"],"prompt":"It is {clock(t)} GMT. What is the time in a country that uses {zone(15 * h)}?","correct":"{clock(t + 60 * h)}","distractors":[{"text":"{clock(t - 60 * h)}","misconception":"way"},{"text":"{clock(t)}","misconception":"same"},{"text":"{clock(t + 60 * h + (h > 0 ? 60 : -60))}","misconception":"count"}],"misconceptions":[{"id":"way","explain":"+ means ahead of GMT (add); − means behind (subtract)."},{"id":"same","explain":"Only places on GMT have the same time as Greenwich."},{"id":"count","explain":"Add or subtract exactly the number of hours in the zone name."}],"solution":["{zone(15 * h)}: {abs(h)} hour{abs(h) == 1 ? '' : 's'} {h > 0 ? 'ahead of' : 'behind'} GMT.","{clock(t)} {h > 0 ? '+' : '−'} {duration(60 * abs(h))} = {answer}"]},{"id":"g9-local","type":"mcq","level":2,"review":"rule","sources":["local-time"],"vars":{"t":{"int":[360,1080],"step":30},"L":{"int":[-80,80]}},"where":["L != 0","L % 5 != 0","sameDay(localTime(t, 0, L))"],"prompt":"It is {clock(t)} GMT. What is the local time at a place on {lon(L)}?","correct":"{clock(localTime(t, 0, L))}","distractors":[{"text":"{clock(localTime(t, 0, -L))}","misconception":"way"},{"text":"{clock(t + L)}","misconception":"one"},{"text":"{clock(t + 60 * round(L / 15))}","misconception":"zone"}],"misconceptions":[{"id":"way","explain":"East of Greenwich is ahead (add); west is behind (subtract)."},{"id":"one","explain":"Each degree is 4 minutes, not 1 minute."},{"id":"zone","explain":"That is the standard time of the nearest zone. Local time uses the exact longitude: 4 minutes for each degree."}],"solution":["{abs(L)} × {minutesPerDegree()} = {timeForDegrees(abs(L))} minutes = {duration(timeForDegrees(abs(L)))}.","{L > 0 ? 'East: add' : 'West: subtract'}. {clock(t)} {L > 0 ? '+' : '−'} {duration(timeForDegrees(abs(L)))} = {answer}"]},{"id":"g9-facts","type":"mcq","level":2,"review":"authored","sources":["time-zones"],"vars":{},"prompt":"Which sentence about time zones is true?","pool":{"right":[{"text":"Each time zone is about 15° of longitude wide.","truth":"true"},{"text":"There are 24 time zones, one for each hour of the day.","truth":"true"},{"text":"Cameroon uses GMT+1.","truth":"true"},{"text":"Crossing the International Date Line changes the date.","truth":"true"}],"wrong":[{"text":"Each time zone is 4° wide.","truth":"false","explain":"4 is the number of minutes for one degree. A time zone is about 15° wide."},{"text":"Every country has its own time zone, different from all its neighbours.","truth":"false","explain":"Cameroon, Nigeria, Gabon and Chad all use GMT+1."},{"text":"The International Date Line is at 0°.","truth":"false","explain":"0° is the Prime Meridian. The Date Line is near 180°."},{"text":"Places west of Greenwich are ahead of GMT.","truth":"false","explain":"Places west of Greenwich are behind GMT."}]},"pick":{"right":1,"wrong":3}},{"id":"g9-gmt","type":"mcq","level":3,"review":"rule","sources":["local-time"],"vars":{"t":{"int":[360,1080],"step":30},"L":{"int":[-80,80]}},"where":["L != 0","sameDay(localTime(t, L, 0))"],"prompt":"When the local time at a place on {lon(L)} is {clock(t)}, what time is it at Greenwich (GMT)?","correct":"{clock(localTime(t, L, 0))}","distractors":[{"text":"{clock(localTime(t, 0, L))}","misconception":"way"},{"text":"{clock(t - L)}","misconception":"one"},{"text":"{clock(t)}","misconception":"same"}],"misconceptions":[{"id":"way","explain":"Going from the place back to Greenwich, the direction is reversed: from an eastern place subtract, from a western place add."},{"id":"one","explain":"Each degree is 4 minutes, not 1 minute."},{"id":"same","explain":"The place is not on 0°, so its time is different from GMT."}],"solution":["{abs(L)} × {minutesPerDegree()} = {duration(timeForDegrees(abs(L)))}.","The place is {L > 0 ? 'east' : 'west'} of Greenwich, so Greenwich is {L > 0 ? 'behind: subtract' : 'ahead: add'}. {clock(t)} {L > 0 ? '−' : '+'} {duration(timeForDegrees(abs(L)))} = {answer}"]}]},"10":{"subject":"geography","class":"Form 1","lesson_no":10,"language":"en","prerequisites":[1],"skills":[{"id":"g10","name":"The natural environment and ecosystems"}],"note":{"status":"draft","text":"The environment is everything around us. The natural environment is the part not made by people: land, water, air, plants and animals. Houses, roads and bridges are the built (human-made) environment.\nComponents of the natural environment:\n• living (biotic): plants, animals, people, micro-organisms such as bacteria and fungi;\n• non-living (abiotic): air, water, soil, rocks, sunlight, rain, temperature.\nThe four spheres:\n• lithosphere: rocks and soil;\n• hydrosphere: water (seas, rivers, lakes);\n• atmosphere: the air;\n• biosphere: all living things.\nAn ecosystem is a group of living things and their non-living surroundings in one place, all depending on each other: a forest, a pond, a savanna.\nIn a food chain, green plants (producers) make food using sunlight; animals (consumers) eat plants or other animals.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"A fish pond near Bafoussam has water, mud, sunlight, water plants, frogs and small fish. Sort these into living and non-living components.","steps":["Living things grow, feed and reproduce: water plants, frogs and small fish.","Non-living components: water, mud (soil) and sunlight.","Together they form an ecosystem: the fish need the plants, and the plants need sunlight and water."],"answer":"Living: water plants, frogs, small fish. Non-living: water, mud, sunlight.","checks":[]},"teach":{"cards":[{"id":"gc10-1","status":"draft","idea":"The natural environment is everything around us that is not made by people: land, water, air, plants and animals.","vars":{},"example":["A river is natural. A bridge over it is built by people."],"checks":[],"check":{"id":"gc10-1-check","type":"mcq","level":1,"review":"authored","sources":["environment"],"vars":{},"prompt":"Which of these is part of the natural environment?","pool":{"right":[{"text":"a river","truth":"true"},{"text":"a forest","truth":"true"},{"text":"a mountain","truth":"true"},{"text":"the air","truth":"true"},{"text":"the soil","truth":"true"}],"wrong":[{"text":"a road","truth":"false","explain":"Roads are built by people."},{"text":"a bridge","truth":"false","explain":"Bridges are built by people."},{"text":"a school building","truth":"false","explain":"Buildings are made by people."},{"text":"a market stall","truth":"false","explain":"Market stalls are made by people."}]},"pick":{"right":1,"wrong":3}}},{"id":"gc10-2","status":"draft","idea":"The environment has living (biotic) components, such as plants and animals, and non-living (abiotic) ones, such as air, water and soil.","vars":{},"example":["A goat is living; the grass it eats is living; the rain that falls on the grass is non-living."],"checks":[],"check":{"ref":"g10-sort"}},{"id":"gc10-3","status":"draft","idea":"The Earth has four spheres: lithosphere (rocks and soil), hydrosphere (water), atmosphere (air) and biosphere (living things).","vars":{},"example":["Lake Chad is part of the hydrosphere; Mount Cameroon is part of the lithosphere."],"checks":[],"check":{"ref":"g10-sphere"}},{"id":"gc10-4","status":"draft","idea":"An ecosystem is living things and their surroundings in one place, depending on each other. In a food chain, energy passes from plants to animals.","vars":{},"example":["Grass → grasshopper → frog → snake. Grass is the producer."],"checks":[],"check":{"ref":"g10-producer"}}]},"questions":[{"id":"g10-sort","type":"matching","level":1,"review":"authored","sources":["environment"],"groups":true,"pick":6,"group_order":["living (biotic)","non-living (abiotic)"],"prompt":"Sort these: living or non-living components of the environment?","pool":[{"left":"trees","right":"living (biotic)"},{"left":"grass","right":"living (biotic)"},{"left":"goats","right":"living (biotic)"},{"left":"fish","right":"living (biotic)"},{"left":"bacteria","right":"living (biotic)"},{"left":"mushrooms","right":"living (biotic)"},{"left":"people","right":"living (biotic)"},{"left":"birds","right":"living (biotic)"},{"left":"air","right":"non-living (abiotic)"},{"left":"water","right":"non-living (abiotic)"},{"left":"soil","right":"non-living (abiotic)"},{"left":"rocks","right":"non-living (abiotic)"},{"left":"sunlight","right":"non-living (abiotic)"},{"left":"rain","right":"non-living (abiotic)"},{"left":"temperature","right":"non-living (abiotic)"},{"left":"wind","right":"non-living (abiotic)"}]},{"id":"g10-sphere","type":"matching","level":1,"review":"authored","sources":["environment"],"prompt":"Match each sphere with what it is made of.","pick":4,"pool":[{"left":"lithosphere","right":"rocks and soil"},{"left":"hydrosphere","right":"water: seas, rivers and lakes"},{"left":"atmosphere","right":"the air around the Earth"},{"left":"biosphere","right":"all living things"}]},{"id":"g10-producer","type":"mcq","level":1,"review":"authored","sources":["environment"],"vars":{"c":{"pick":[{"a":"grass","b":"grasshopper","c":"frog","d":"snake"},{"a":"maize","b":"rat","c":"snake","d":"eagle"},{"a":"leaves","b":"caterpillar","c":"bird","d":"cat"},{"a":"water plants","b":"small fish","c":"big fish","d":"heron"},{"a":"grass","b":"grasshopper","c":"lizard","d":"hawk"}]}},"prompt":"In the food chain {c.a} → {c.b} → {c.c} → {c.d}, which is the producer?","correct":"{c.a}","distractors":[{"text":"{c.b}","misconception":"consumer"},{"text":"{c.c}","misconception":"consumer"},{"text":"{c.d}","misconception":"consumer"}],"misconceptions":[{"id":"consumer","explain":"That is an animal: a consumer. The producer is the green plant at the start of the chain."}],"solution":["The producer makes its own food using sunlight: the green plant.","It comes first in the chain: {answer}."]},{"id":"g10-chain","type":"ordering","level":2,"review":"authored","sources":["environment"],"vars":{"c":{"pick":[{"a":"grass","b":"grasshopper","c":"frog","d":"snake"},{"a":"maize","b":"rat","c":"snake","d":"eagle"},{"a":"leaves","b":"caterpillar","c":"bird","d":"cat"},{"a":"water plants","b":"small fish","c":"big fish","d":"heron"},{"a":"grass","b":"grasshopper","c":"lizard","d":"hawk"}]}},"order":"as_written","prompt":"Put this food chain in order, starting with the producer.","items":[{"text":"{c.a}"},{"text":"{c.b}"},{"text":"{c.c}"},{"text":"{c.d}"}]},{"id":"g10-natural","type":"matching","level":2,"review":"authored","sources":["environment"],"groups":true,"pick":6,"group_order":["natural","built by people"],"prompt":"Sort these: natural environment or built by people?","pool":[{"left":"the Sanaga River","right":"natural"},{"left":"a forest","right":"natural"},{"left":"Mount Cameroon","right":"natural"},{"left":"the rain","right":"natural"},{"left":"a waterfall","right":"natural"},{"left":"a tarred road","right":"built by people"},{"left":"a bridge","right":"built by people"},{"left":"a football stadium","right":"built by people"},{"left":"a dam","right":"built by people"},{"left":"a market","right":"built by people"}]},{"id":"g10-eco","type":"mcq","level":2,"review":"authored","sources":["environment"],"vars":{},"prompt":"Which of these is an ecosystem?","pool":{"right":[{"text":"a pond with its plants, fish and frogs","truth":"true"},{"text":"a forest with its trees, animals and soil","truth":"true"},{"text":"a savanna with its grass, animals and rain","truth":"true"}],"wrong":[{"text":"a single goat","truth":"false","explain":"One animal alone is not an ecosystem: an ecosystem is many living things with their surroundings."},{"text":"a bag of rice","truth":"false","explain":"That is a food, not a community of living things with their surroundings."},{"text":"a rock","truth":"false","explain":"A rock alone is a non-living thing, not an ecosystem."},{"text":"a car","truth":"false","explain":"A car is made by people and is not living."}]},"pick":{"right":1,"wrong":3}},{"id":"g10-spot","type":"spot_error","level":3,"review":"authored","sources":["environment"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"Soil and water are non-living components of the environment.","truth":"true"},{"text":"The hydrosphere is all the water on the Earth.","truth":"true"},{"text":"Green plants are producers.","truth":"true"},{"text":"An ecosystem includes living and non-living things.","truth":"true"},{"text":"Bacteria are living things.","truth":"true"}],"wrong":[{"text":"The atmosphere is made of rocks and soil.","truth":"false","explain":"Rocks and soil are the lithosphere; the atmosphere is the air."},{"text":"Animals are producers in a food chain.","truth":"false","explain":"Animals are consumers; green plants are producers."},{"text":"Roads are part of the natural environment.","truth":"false","explain":"Roads are built by people."},{"text":"Sunlight is a living component.","truth":"false","explain":"Sunlight is non-living."}]},"pick":{"right":3,"wrong":1}}]}},"home-economics":{"1":{"subject":"home-economics","class":"Form 1","lesson_no":1,"language":"en","prerequisites":[],"skills":[{"id":"he1","name":"Basic terms in nutrition"}],"note":{"status":"draft","text":"Nutrition is the way the body takes in food and uses it. A nutrient is a substance in food that the body needs (carbohydrates, proteins, fats and oils, vitamins, minerals, water).\nYour diet is the food you usually eat. A balanced diet has all the nutrients in the right amounts.\nMalnutrition means bad nutrition:\n• under-nutrition: not enough food or nutrients (for example kwashiorkor from too little protein, marasmus from too little food);\n• over-nutrition: too much food for a long time, which can lead to obesity;\n• hidden hunger: a lack of vitamins and minerals even when the stomach is full.\nMetabolism is all the chemical processes in the body that turn food into energy and body tissue.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Enow eats a big plate of garri every day but almost never eats fruit, vegetables, beans or fish. He is not hungry. Is his diet balanced? What kind of malnutrition could he have?","steps":["Garri gives energy, but Enow gets few proteins, vitamins and minerals.","So his diet is not balanced.","He is not hungry, but his body lacks vitamins and minerals: this is hidden hunger."],"answer":"No, his diet is not balanced; he could have hidden hunger.","checks":[]},"teach":{"cards":[{"id":"hec1-1","status":"draft","idea":"Nutrition is how the body takes in and uses food. Nutrients are the substances in food the body needs. Your diet is the food you usually eat.","vars":{},"example":["Beans contain the nutrient protein. Rice, beans and vegetables can be part of a good diet."],"checks":[],"check":{"ref":"he1-which"}},{"id":"hec1-2","status":"draft","idea":"Malnutrition is bad nutrition: under-nutrition (too little), over-nutrition (too much) or hidden hunger (missing vitamins and minerals).","vars":{},"example":["A very thin child with too little food has under-nutrition. Eating fried food and sweets every day can lead to obesity."],"checks":[],"check":{"id":"hec1-2-check","type":"mcq","level":1,"review":"authored","sources":["nutrition-terms"],"vars":{},"prompt":"Which is an example of malnutrition?","pool":{"right":[{"text":"a child who is very thin because there is too little food","truth":"true"},{"text":"a person who becomes obese from eating too much","truth":"true"},{"text":"a child who eats enough maize but lacks vitamins","truth":"true"}],"wrong":[{"text":"a child who eats a balanced diet","truth":"false","explain":"A balanced diet has all the nutrients in the right amounts: that is good nutrition."},{"text":"a girl who eats fruit every day","truth":"false","explain":"Fruit gives vitamins: that is good."},{"text":"a boy who drinks clean water","truth":"false","explain":"Clean water is good for health."},{"text":"a family that eats beans, vegetables and rice","truth":"false","explain":"That is a varied, healthy meal."}]},"pick":{"right":1,"wrong":3}}},{"id":"hec1-3","status":"draft","idea":"Metabolism is all the chemical processes that turn food into energy and body tissue.","vars":{},"example":["When you run, your metabolism uses the energy from your food."],"checks":[],"check":{"ref":"he1-match"}}]},"questions":[{"id":"he1-match","type":"matching","level":1,"review":"authored","sources":["nutrition-terms"],"prompt":"Match each word with its meaning.","pick":4,"pool":[{"left":"nutrition","right":"the way the body takes in food and uses it"},{"left":"nutrient","right":"a substance in food that the body needs, such as protein or a vitamin"},{"left":"diet","right":"the food a person usually eats"},{"left":"balanced diet","right":"a diet with all the nutrients in the right amounts"},{"left":"malnutrition","right":"bad nutrition: too little food, too much food or the wrong kinds of food"},{"left":"under-nutrition","right":"not getting enough food or nutrients"},{"left":"over-nutrition","right":"eating more food than the body needs for a long time"},{"left":"hidden hunger","right":"a lack of vitamins and minerals even when the stomach is full"},{"left":"metabolism","right":"all the chemical processes in the body that turn food into energy and body tissue"},{"left":"obesity","right":"being very overweight because of too much body fat"}]},{"id":"he1-which","type":"mcq","level":1,"review":"authored","sources":["nutrition-terms"],"vars":{"x":{"pick":[{"t":"the way the body takes in food and uses it","a":"nutrition","why":"Nutrition: the way the body takes in food and uses it."},{"t":"a substance in food that the body needs, such as protein or a vitamin","a":"nutrient","why":"Nutrient: a substance in food that the body needs, such as protein or a vitami s.","truth":"true"},{"text":"Hidden hunger is a lack of vitamins and minerals.","truth":"true"}],"wrong":[{"text":"Malnutrition only means having too little food.","truth":"false","explain":"Malnutrition also includes over-nutrition and hidden hunger."},{"text":"Metabolism is the name of a food.","truth":"false","explain":"Metabolism is the chemical processes that use food in the body."},{"text":"A person with hidden hunger always feels hungry.","truth":"false","explain":"With hidden hunger the stomach can be full; vitamins and minerals are missing."}]},"pick":{"right":3,"wrong":1}}]},"2":{"subject":"home-economics","class":"Form 1","lesson_no":2,"language":"en","prerequisites":[1],"skills":[{"id":"he2","name":"Factors for good health"}],"note":{"status":"draft","text":"Health is being well in body, mind and in our life with other people, not only being free from disease.\nFactors that keep us healthy:\n• a good diet: a balanced diet, regular meals and clean water;\n• exercise: walking, running, games and sport make the heart, lungs and muscles strong and keep weight right;\n• rest and sleep: the body repairs itself and grows;\n• recreation: games, music, hobbies and time with friends refresh the mind and reduce stress;\n• personal hygiene: washing the body, hands, teeth and clothes;\n• a clean environment: no rubbish or stagnant water near the house;\n• avoiding harmful habits: smoking, alcohol and drugs;\n• going to the health centre for vaccinations and when ill.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Ashu eats well, but he sits in front of the television every evening and goes to bed very late. Which two health factors does he need to improve?","steps":["He does not move his body much: he needs more exercise.","He goes to bed very late: he needs more rest and sleep."],"answer":"Exercise, and rest and sleep.","checks":[]},"teach":{"cards":[{"id":"hec2-1","status":"draft","idea":"Health is being well in body, mind and in our life with other people, not only being free from disease.","vars":{},"example":["A pupil who is not sick but is always sad and alone is not fully healthy."],"checks":[],"check":{"id":"hec2-1-check","type":"mcq","level":1,"review":"authored","sources":["health"],"vars":{},"prompt":"What does “health” mean?","pool":{"right":[{"text":"being well in body, mind and life with others, not only free from disease","truth":"true"}],"wrong":[{"text":"never going to the hospital","truth":"false","explain":"Health is more than that: it includes the mind and life with others."},{"text":"being very strong","truth":"false","explain":"Strength is only one part of health."},{"text":"eating a lot of food","truth":"false","explain":"Too much food can cause obesity."},{"text":"being rich","truth":"false","explain":"Money does not make a person healthy."}]},"pick":{"right":1,"wrong":3}}},{"id":"hec2-2","status":"draft","idea":"A good diet and regular exercise keep the body strong.","vars":{},"example":["Walking to school and playing games are good exercise."],"checks":[],"check":{"ref":"he2-factor"}},{"id":"hec2-3","status":"draft","idea":"Rest, sleep and recreation (games, music, hobbies) refresh the body and the mind.","vars":{},"example":["After a day of lessons, a game of football with friends is recreation."],"checks":[],"check":{"ref":"he2-sort"}}]},"questions":[{"id":"he2-factor","type":"mcq","level":1,"review":"authored","sources":["health"],"vars":{"x":{"pick":[{"t":"Ngozi plays football after school.","a":"exercise","why":"Exercise: Ngozi plays football after school."},{"t":"Ewane goes to bed early and sleeps well.","a":"rest and sleep","why":"Rest and sleep: Ewane goes to bed early and sleeps well."},{"t":"The family eats rice, beans, vegetables and fruit.","a":"a good diet","why":"A good diet: The family eats rice, beans, vegetables and fruit."},{"t":"Bih sings in the choir and plays draughts at the weekend.","a":"recreation","why":"Recreation: Bih sings in the choir and plays draughts at the weekend."},{"t":"Tanyi washes his hands with soap before eating.","a":"personal hygiene","why":"Personal hygiene: Tanyi washes his hands with soap before eating."},{"t":"The class clears the rubbish and stagnant water around the school.","a":"a clean environment","why":"A clean environment: The class clears the rubbish and stagnant water around the school."}]}},"prompt":"Which health factor is this?\n{x.t}","correct":"{x.a}","distractors":[{"text":"exercise","misconception":"other"},{"text":"rest and sleep","misconception":"other"},{"text":"a good diet","misconception":"other"},{"text":"recreation","misconception":"other"},{"text":"personal hygiene","misconception":"other"},{"text":"a clean environment","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Not this one. Read the situation again."}],"solution":["{x.why}","Answer: {answer}."]},{"id":"he2-sort","type":"matching","level":1,"review":"authored","sources":["health"],"prompt":"Sort these habits: good or bad for health?","groups":true,"pick":6,"group_order":["good for health","bad for health"],"pool":[{"left":"sleeping enough every night","right":"good for health"},{"left":"playing games with friends","right":"good for health"},{"left":"washing hands before eating","right":"good for health"},{"left":"drinking clean water","right":"good for health"},{"left":"walking or running often","right":"good for health"},{"left":"eating fruit and vegetables","right":"good for health"},{"left":"smoking","right":"bad for health"},{"left":"drinking alcohol","right":"bad for health"},{"left":"eating sweets all day","right":"bad for health"},{"left":"sleeping very late every night","right":"bad for health"},{"left":"leaving rubbish near the house","right":"bad for health"},{"left":"never doing any exercise","right":"bad for health"}]},{"id":"he2-exercise","type":"mcq","level":2,"review":"authored","sources":["health"],"vars":{},"prompt":"Which is a benefit of regular exercise?","pool":{"right":[{"tex  and life with other people."},{"text":"Smoking is good for the lungs.","truth":"false","explain":"Smoking damages the lungs."},{"text":"Exercise is only for adults.","truth":"false","explain":"Children need exercise too."}]},"pick":{"right":3,"wrong":1}}]},"3":{"subject":"home-economics","class":"Form 1","lesson_no":3,"language":"en","prerequisites":[1],"skills":[{"id":"he3","name":"Nutrients and food groups"}],"note":{"status":"draft","text":"Food contains nutrients:\n• carbohydrates: rice, maize, cassava, yams, plantains, bread;\n• proteins: beans, groundnuts, eggs, fish, meat, milk;\n• fats and oils: palm oil, groundnut oil, butter;\n• vitamins: fruits and vegetables such as oranges, mangoes, pawpaw, carrots, huckleberry;\n• minerals: for example calcium (milk, small fish) and iron (liver, green leaves);\n• water and fibre (roughage) are also needed.\nThe three food groups:\n• energy-giving foods: carbohydrates, fats and oils;\n• body-building foods: proteins;\n• protective foods: vitamins and minerals.\nA balanced meal has food from each group, for example rice, beans with fish, and a green vegetable, with fruit after.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Is this meal balanced: boiled plantains, fried fish and a mango? If not, what could be added?","steps":["Plantains: energy-giving (carbohydrates). The frying oil is also energy-giving.","Fish: body-building (proteins).","Mango: protective (vitamins).","All three groups are there; a green vegetable would add more minerals."],"answer":"Yes, it has all three food groups.","checks":[]},"teach":{"cards":[{"id":"hec3-1","status":"draft","idea":"Each food is rich in certain nutrients: carbohydrates, proteins, fats and oils, vitamins or minerals.","vars":{},"example":["Rice is rich in carbohydrates. Beans are rich in proteins. Oranges are rich in vitamins."],"checks":[],"check":{"ref":"he3-nutrient"}},{"id":"hec3-2","status":"draft","idea":"Foods are put into three groups: energy-givin  and burning it indoors without fresh air is dangerous (carbon monoxide).\nSaving firewood protects forests.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"A family wants a fireplace that uses less firewood and makes less smoke, and they have clay nearby. Which fireplace should they build?","steps":["The three-stone fireplace wastes firewood and is smoky.","An improved mud or clay stove keeps the heat in, so it uses less wood and makes less smoke, and clay is free nearby."],"answer":"An improved (mud or clay) stove.","checks":[]},"teach":{"cards":[{"id":"hec7-1","status":"draft","idea":"The three-stone fireplace: three stones hold the pot over an open fire. Cheap, but it wastes firewood and is smoky.","vars":{},"example":["Much of the heat escapes round the sides of the pot."],"checks":[],"check":{"ref":"he7-which"}},{"id":"hec7-2","status":"draft","idea":"The improved mud stove keeps the heat in with mud or clay walls, so it saves firewood and makes less smoke.","vars":{},"example":["Less firewood means fewer trees cut down."],"checks":[],"check":{"ref":"he7-match"}},{"id":"hec7-3","status":"draft","idea":"The charcoal stove is metal, burns charcoal and can be carried. Use it only where there is fresh air.","vars":{},"example":["Burning charcoal in a closed room can poison people."],"checks":[],"check":{"id":"hec7-3-check","type":"mcq","level":1,"review":"authored","sources":["fireplaces"],"vars":{},"prompt":"Why must a charcoal stove be used only where there is fresh air?","pool":{"right":[{"text":"Burning charcoal gives off a poisonous gas (carbon monoxide).","truth":"true"}],"wrong":[{"text":"Charcoal smells bad.","truth":"false","explain":"The danger is a poisonous gas, carbon monoxide, which has no smell."},{"text":"The stove gets too cold.","truth":"false","explain":"The problem is a poisonous gas, not cold."},{"text":"Charcoal is heavy.","truth":"false","explain":"Weight is not the danger: the gas is."},{"text":"Fresh air makes food ta
