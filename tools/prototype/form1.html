istillation to keep it."}]},"pick":{"right":3,"wrong":1}}]},"16":{"subject":"chemistry","class":"Form 1","lesson_no":16,"language":"en","prerequisites":[13,15],"skills":[{"id":"ch16","name":"Separating liquid–liquid mixtures"}],"note":{"status":"draft","text":"Liquid–liquid mixtures:\n• Immiscible liquids (they form two layers, such as palm oil and water, or kerosene and water): use a separating funnel. Let the layers settle, open the tap and run off the bottom layer; close the tap just as the top layer reaches it.\n• Miscible liquids (they mix completely, such as ethanol and water): use fractional distillation. The liquid with the lower boiling point boils off first and is collected; ethanol (about 78 °C) comes over before water (100 °C).\nFractional distillation is used to get alcohol from fermented palm wine, and in industry to separate crude oil into petrol, kerosene and diesel.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Kerosene and water have been mixed by mistake. How can they be separated?","steps":["Kerosene and water do not mix: they form two layers, with kerosene on top.","Pour the mixture into a separating funnel and let it settle.","Open the tap to run off the water (bottom layer); close it when the kerosene reaches the tap."],"answer":"With a separating funnel.","checks":[]},"teach":{"cards":[{"id":"chc16-1","status":"draft","idea":"Immiscible liquids form layers: separate them with a separating funnel.","vars":{},"example":["Palm oil floats on water; run the water off through the tap."],"checks":[],"check":{"ref":"ch16-method"}},{"id":"chc16-2","status":"draft","idea":"Miscible liquids mix completely: separate them by fractional distillation, using their different boiling points.","vars":{"e":78,"w":100},"example":["Ethanol boils at about {e} °C, water at {w} °C: ethanol comes over first."],"checks":[],"check":{"ref":"ch16-first"}},{"id":"chc16-3","status":"draft","idea":"Fractional distillation is also used for crude oil: petrol, kerosene and diesel boil at different temperatures.","vars":{},"example":["The fractions are collected one after another."],"checks":[],"check":{"id":"chc16-3-check","type":"mcq","level":1,"review":"authored","sources":["separation"],"vars":{},"prompt":"Which method separates ethanol from water?","pool":{"right":[{"text":"fractional distillation","truth":"true"}],"wrong":[{"text":"a separating funnel","truth":"false","explain":"Ethanol and water mix completely: they do not form layers."},{"text":"filtration","truth":"false","explain":"Filtration removes undissolved solids."},{"text":"magnetic separation","truth":"false","explain":"A magnet only attracts iron and some metals."}]},"pick":{"right":1,"wrong":3}}}]},"questions":[{"id":"ch16-method","type":"mcq","level":1,"review":"authored","sources":["separation"],"vars":{"x":{"pick":[{"t":"palm oil and water","a":"separating funnel","why":"palm oil and water: separating funnel."},{"t":"kerosene and water","a":"separating funnel","why":"kerosene and water: separating funnel."},{"t":"ethanol and water","a":"fractional distillation","why":"ethanol and water: fractional distillation."},{"t":"petrol and kerosene from crude oil","a":"fractional distillation","why":"petrol and kerosene from crude oil: fractional distillation."}]}},"prompt":"Which method separates {x.t}?","correct":"{x.a}","distractors":[{"text":"separating funnel","misconception":"other"},{"text":"fractional distillation","misconception":"other"},{"text":"filtration","misconception":"other"},{"text":"sieving","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Ask: do the liquids form layers (separating funnel) or mix completely (fractional distillation)?"}],"solution":["{x.why}","Answer: {answer}."]},{"id":"ch16-first","type":"mcq","level":1,"review":"rule","sources":["separation"],"show":2,"vars":{"p":{"pick":[{"a":"ethanol","ta":78,"b":"water","tb":100},{"a":"water","ta":100,"b":"acetic acid (in vinegar)","tb":118},{"a":"ethanol","t ch17","name":"Separating liquid–gas mixtures"}],"note":{"status":"draft","text":"Some gases dissolve in liquids: carbon dioxide in a soft drink, oxygen in river water (fish breathe it).\nA gas is less soluble when the liquid is warmer or when the pressure falls, so a dissolved gas can be removed by:\n• heating the liquid gently: bubbles of gas come out (warm water holds less gas);\n• shaking or stirring, or lowering the pressure: when you open a soft drink, the pressure drops and the gas fizzes out.\nThe gas can be collected over water in a gas jar or test tube.\nThis is why a soft drink goes “flat” when it is open and warm, and why fish can struggle in water that is too warm.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Why does a warm bottle of soft drink fizz more than a cold one when it is opened?","steps":["The drink has carbon dioxide dissolved in it under pressure.","Opening the bottle lowers the pressure, so gas comes out.","Warm liquid holds less dissolved gas than cold liquid, so even more gas escapes."],"answer":"Warm liquid holds less gas, so more carbon dioxide escapes when the pressure is released.","checks":[]},"teach":{"cards":[{"id":"chc17-1","status":"draft","idea":"Gases can dissolve in liquids: carbon dioxide in a soft drink, oxygen in river water.","vars":{},"example":["Fish use the oxygen dissolved in water."],"checks":[],"check":{"ref":"ch17-which"}},{"id":"chc17-2","status":"draft","idea":"Heating a liquid drives out the dissolved gas: warm water holds less gas.","vars":{},"example":["Bubbles appear in water being heated before it boils."],"checks":[],"check":{"ref":"ch17-heat"}},{"id":"chc17-3","status":"draft","idea":"Lowering the pressure or shaking also lets the gas escape.","vars":{},"example":["Opening a soft drink: the pressure drops and it fizzes."],"checks":[],"check":{"id":"chc17-3-check","type":"mcq","level":1,"review":"authored","sources":["separation"],"vars":{},"prompt":"Why does a soft drink fizz when the bottle is opened?","pool":{"right":[{"text":"The pressure drops, so the dissolved carbon dioxide comes out.","truth":"true"}],"wrong":[{"text":"The drink starts to boil.","truth":"false","explain":"It does not boil; the dissolved gas escapes."},{"text":"Air rushes into the drink.","truth":"false","explain":"The bubbles are carbon dioxide coming out of the drink."},{"text":"The sugar turns into gas.","truth":"false","explain":"The gas was already dissolved: it is carbon dioxide."}]},"pick":{"right":1,"wrong":3}}}]},"questions":[{"id":"ch17-which","type":"mcq","level":1,"review":"authored","sources":["separation"],"vars":{},"prompt":"Which of these is a mixture of a gas dissolved in a liquid?","pool":{"right":[{"text":"a soft drink","truth":"true"},{"text":"river water with oxygen in it","truth":"true"}],"wrong":[{"text":"sand and salt","truth":"false","explain":"That is solid–solid."},{"text":"palm oil and water","truth":"false","explain":"That is liquid–liquid."},{"text":"air","truth":"false","explain":"That is gas–gas."}]},"pick":{"right":1,"wrong":3}},{"id":"ch17-heat","type":"mcq","level":1,"review":"authored","sources":["separation"],"vars":{},"prompt":"How can you remove the dissolved gas from a glass of soft drink?","pool":{"right":[{"text":"Warm it gently and stir it.","truth":"true"}],"wrong":[{"text":"Put it in the fridge.","truth":"false","explain":"Cold liquid holds more gas, not less."},{"text":"Add more sugar.","truth":"false","explain":"Sugar does not remove the gas."},{"text":"Filter it.","truth":"false","explain":"A filter cannot hold back a dissolved gas."}]},"pick":{"right":1,"wrong":3}},{"id":"ch17-fish","type":"mcq","level":2,"review":"authored","sources":["separation"],"vars":{},"prompt":"In the dry season, a fish pond becomes very warm. Why can this harm the fish?","pool":{"right":[{"text":"Warm water holds less dissolved oxygen, so the fish have less to breathe.","truth":"true"}],"wrong":[{"text":"Warm water has more oxygen, which is poisonous.","truth":"false","explain":"Warm water holds less oxygen, not more."},{"text":"The fish get sunburnt.","truth":"false","explain":"The main problem is less dissolved oxygen."},{"text":"Warm water turns into carbon dioxide.","truth":"false","explain":"Water does not turn into carbon dioxide."}]},"pick":{"right":1,"wrong":3}},{"id":"ch17-spot","type":"spot_error","level":3,"review":"authored","sources":["separation"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"Opening a soft drink lowers the pressure.","truth":"true"},{"text":"Fish breathe oxygen dissolved in water.","truth":"true"},{"text":"A dissolved gas can be collected over water.","truth":"true"},{"text":"Warm water holds less dissolved gas than cold water.","truth":"true"}],"wrong":[{"text":"Cold water holds less dissolved gas than warm water.","truth":"false","explain":"It is the other way round: cold water holds more gas."},{"text":"Filtering removes dissolved gas from a drink.","truth":"false","explain":"A filter cannot stop a dissolved gas."}]},"pick":{"right":3,"wrong":1}}]},"18":{"subject":"chemistry","class":"Form 1","lesson_no":18,"language":"en","prerequisites":[13,16],"skills":[{"id":"ch18","name":"Separating gas–gas mixtures"}],"note":{"status":"draft","text":"Air is a mixture of gases: about 78 % nitrogen, 21 % oxygen, almost 1 % argon, and small amounts of carbon dioxide and water vapour.\nGas–gas mixtures can be separated:\n• by fractional distillation of liquid air: air is cooled until it becomes liquid, then warmed slowly; each gas boils off at its own boiling point (nitrogen first, then argon, then oxygen). This gives pure oxygen for hospitals and welding, and nitrogen;\n• by absorption: the mixture is bubbled through a liquid that dissolves or reacts with only one gas. For example, sodium hydroxide solution absorbs carbon dioxide from air; limewater turns milky with carbon dioxide.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Ho es.","truth":"true"},{"text":"Sodium hydroxide solution absorbs carbon dioxide.","truth":"true"},{"text":"Oxygen for hospitals comes from liquid air.","truth":"true"},{"text":"Nitrogen is the largest part of the air.","truth":"true"}],"wrong":[{"text":"Air is a pure substance.","truth":"false","explain":"Air contains several gases that are not joined: it is a mixture."},{"text":"Oxygen makes up most of the air.","truth":"false","explain":"Nitrogen (about 78 %) makes up most of the air."}]},"pick":{"right":3,"wrong":1}}]},"19":{"subject":"chemistry","class":"Form 1","lesson_no":19,"language":"en","prerequisites":[12],"skills":[{"id":"ch19","name":"Elements and their symbols"}],"note":{"status":"draft","text":"An element is a pure substance made of only one kind of atom. It cannot be broken down into simpler substances by chemical means. About 118 elements are known; most are metals.\nEach element has a symbol: one capital letter, or a capital and a small letter. H hydrogen, He helium, C carbon, N nitrogen, O oxygen, Na sodium, Mg magnesium, Al aluminium, S sulfur, Cl chlorine, K potassium, Ca calcium, Fe iron, Cu copper, Zn zinc.\nSome symbols come from Latin names: Na (natrium), K (kalium), Fe (ferrum), Cu (cuprum), Ag silver (argentum), Au gold (aurum), Pb lead (plumbum).\nWrite symbols carefully: Co is cobalt, but CO is carbon monoxide.","checks":[]},"worked_example":{"status":"draft","vars":{"a":"Fe","b":"Na"},"problem":"Why is the symbol for iron {a} and the symbol for sodium {b}?","steps":["They come from the Latin names of the elements.","Iron in Latin is {latinName(a)}: {a}. Sodium is {latinName(b)}: {b}."],"answer":"Iron: {a} (from {latinName(a)}); sodium: {b} (from {latinName(b)}).","checks":["nameOf(a) == 'iron'"]},"teach":{"cards":[{"id":"chc19-1","status":"draft","idea":"An element is made of one kind of atom only and cannot be split into simpler substances by chemical means.","vars":{},"example":["Oxygen, iron, carbon and gold are elements."],"checks":[  filings and sulfur mixed together are a mixture (a magnet pulls out the iron); heated together they react to form iron sulfide, a compound (a magnet no longer pulls it).","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Iron filings and sulfur powder are mixed, then the mixture is heated strongly until it glows. What do you have before and after heating?","steps":["Before: a magnet pulls out the iron; the yellow sulfur stays. It is a mixture.","Heating: the mixture glows: a chemical reaction gives out heat.","After: a black solid, iron sulfide; a magnet does not pull it. It is a compound."],"answer":"Before: a mixture. After: a compound (iron sulfide).","checks":[]},"teach":{"cards":[{"id":"chc21-1","status":"draft","idea":"A mixture can be separated by physical methods; a compound needs a chemical reaction.","vars":{},"example":["Salt water: evaporate. Water itself: only a reaction splits it."],"checks":[],"check":{"ref":"ch21-sort"}},{"id":"chc21-2","status":"draft","idea":"In a mixture each part keeps its properties; a compound has new properties.","vars":{},"example":["Iron + sulfur mixed: a magnet still pulls the iron. Iron sulfide: it does not."],"checks":[],"check":{"ref":"ch21-which"}},{"id":"chc21-3","status":"draft","idea":"A compound has a fixed make-up and fixed melting and boiling points; a mixture does not.","vars":{"b":100},"example":["Water is always H₂O and boils at {b} °C (pure, normal pressure)."],"checks":[],"check":{"id":"chc21-3-check","type":"mcq","level":1,"review":"authored","sources":["compounds"],"vars":{},"prompt":"Which is true of a compound?","pool":{"right":[{"text":"Its elements are always in the same fixed ratio.","truth":"true"}],"wrong":[{"text":"Its parts can be in any amounts.","truth":"false","explain":"That is a mixture."},{"text":"It can be separated with a magnet or a filter.","truth":"false","explain":"That is a mixture."},{"text":"Each part keeps its own properties.","truth":"false","explain":"That is a mixture."}]},"pick":{"right":1,"wrong":3}}}]},"questions":[{"id":"ch21-sort","type":"matching","level":1,"review":"authored","sources":["compounds"],"groups":true,"pick":6,"group_order":["mixture","compound"],"prompt":"Does each sentence describe a mixture or a compound?","pool":[{"left":"its parts can be in any amounts","right":"mixture"},{"left":"its parts keep their own properties","right":"mixture"},{"left":"it can be separated by physical methods","right":"mixture"},{"left":"it melts or boils over a range of temperatures","right":"mixture"},{"left":"its elements are in a fixed ratio","right":"compound"},{"left":"it has new properties, unlike its elements","right":"compound"},{"left":"it can only be split by a chemical reaction","right":"compound"},{"left":"it has a fixed melting and boiling point","right":"compound"}]},{"id":"ch21-which","type":"mcq","level":1,"review":"authored","sources":["compounds"],"vars":{"x":{"pick":[{"t":"iron filings and sulfur stirred together","a":"a mixture","why":"iron filings and sulfur stirred together: a mixture."},{"t":"iron sulfide made by heating iron and sulfur","a":"a compound","why":"iron sulfide made by heating iron and sulfur: a compound."},{"t":"salt water","a":"a mixture","why":"salt water: a mixture."},{"t":"water (H₂O)","a":"a compound","why":"water (H₂O): a compound."},{"t":"air","a":"a mixture","why":"air: a mixture."},{"t":"carbon dioxide (CO₂)","a":"a compound","why":"carbon dioxide (CO₂): a compound."}]}},"prompt":"Is {x.t} a mixture or a compound?","correct":"{x.a}","distractors":[{"text":"a mixture","misconception":"other"},{"text":"a compound","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Ask: are the parts chemically joined in a fixed ratio?"}],"solution":["{x.why}","Answer: {answer}."],"show":2},{"id":"ch21-test","type":"mcq","level":2,"review":"authored","sources":["compounds"],"vars":{},"prompt":"Iron and sulfur have been heated together. How can you show that a compound has formed?","pool":{"right":[{"text":"A magnet no longer pulls out the iron.","truth":"true"}],"wrong":[{"text":"The mixture is still yellow and grey.","truth":"false","explain":"Those are the old properties: a compound has new ones."},{"text":"You can still pick out the sulfur.","truth":"false","explain":"If you can, it is still a mixture."},{"text":"It weighs the same.","truth":"false","explain":"Weighing does not show whether the elements have joined."}]},"pick":{"right":1,"wrong":3}},{"id":"ch21-spot","type":"spot_error","level":3,"review":"authored","sources":["compounds"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"A compound has a fixed composition.","truth":"true"},{"text":"A mixture can be separated by physical methods.","truth":"true"},{"text":"Forming a compound often gives out heat.","truth":"true"},{"text":"Air is a mixture.","truth":"true"}],"wrong":[{"text":"Water can be separated into hydrogen and oxygen by filtering.","truth":"false","explain":"Water is a compound: only a chemical reaction splits it."},{"text":"In a compound, each element keeps its own properties.","truth":"false","explain":"A compound has new properties; each part keeps its properties only in a mixture."}]},"pick":{"right":3,"wrong":1}}]}},"geography":{"1":{"subject":"geography","class":"Form 1","lesson_no":1,"language":"en","prerequisites":[],"skills":[{"id":"g1","name":"What geography is"}],"note":{"status":"draft","text":"Geography is the study of the Earth’s surface: its land, water, air, plants and animals, the people who live on it, and how people and their surroundings affect each other.\nBranches:\n• Physical geography: landforms, rivers, climate, soils, vegetation.\n• Human geography: population, settlements, farming, industry, trade, transport.\n• Practical geography: map reading, fieldwork, graphs and statistics.\nSub-branches include climatology (climate), geomorphology (landforms), hydrology (water), pedology (soils), biogeography, population, settlement, economic and transport geography, and cartography (making maps).\nMethods: observation, interviews, questionnaires, measurement, maps and photographs.\nWhy study it? To understand and protect our environment, to plan farms and towns, to read maps and find our way, and for jobs such as surveyor, weather forecaster and town planner.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"A class visits the Wouri River in Douala. They measure how fast the water flows, and they ask fishermen how much fish they catch. Which branches of geography are they using?","steps":["How fast a river flows is about water: physical geography (hydrology).","Fishing as a way of earning a living is human geography (economic geography).","Measuring and asking questions outside the classroom is fieldwork: practical geography."],"answer":"Physical, human and practical geography together.","checks":[]},"teach":{"cards":[{"id":"gc1-1","status":"draft","idea":"Geography studies the Earth’s surface and the people on it, and how people and their surroundings affect each other.","vars":{},"example":["Why does Buea get more rain than Maroua? Why do people build towns beside rivers? These are geography questions."],"checks":[],"check":{"id":"gc1-1-check","type":"mcq","level":1,"review":"authored","sources":["geography"],"vars":{},"prompt":"Which question is a geography question?","pool":{"right":[{"text":"Why do many people live near the coast?","truth":"true"},{"text":"Why does the north of Cameroon get less rain than the south?","truth":"true"},{"text":"Where are the main roads in Cameroon?","truth":"true"}],"wrong":[{"text":"How do you add fractions?","truth":"false","explain":"That is Mathematics."},{"text":"What is the past tense of “go”?","truth":"false","explain":"That is English."},{"text":"How does the heart pump blood?","truth":"false","explain":"That is Biology."},{"text":"Who was the first president of Cameroon?","truth":"false","explain":"That is History."}]},"pick":{"right":1,"wrong":3}}},{"id":"gc1-2","status":"draft","idea":"Geography has three branches: physical geography (the natural world), human geography (people and what they do) and practical geography (maps and fieldwork).","vars":{},"example":["Hills and rivers: physical. Markets and roads: human. Drawing a map of the school: practical."],"checks":[],"check":{"ref":"g1-which"}},{"id":"gc1-3","status":"draft","idea":"Each branch has sub-branches: climatology studies climate, pedology studies soils, cartography is making maps.","vars":{},"example":["A weather forecaster uses climatology. A map maker uses cartography."],"checks":[],"check":{"ref":"g1-sub"}}]},"questions":[{"id":"g1-which","type":"mcq","level":1,"review":"authored","sources":["geography"],"vars":{"x":{"pick":[{"t":"landforms such as hills and valleys","a":"Physical geography","why":"Physical geography studies landforms such as hills and valleys."},{"t":"rivers and lakes","a":"Physical geography","why":"Physical geography studies rivers and lakes."},{"t":"climate and weather","a":"Physical geography","why":"Physical geography studies climate and weather."},{"t":"soils and vegetation","a":"Physical geography","why":"Physical geography studies soils and vegetation."},{"t":"population and where people live","a":"Human geography","why":"Human geography studies population and where people live."},{"t":"towns and villages","a":"Human geography","why":"Human geography studies towns and villages."},{"t":"farming, industry and trade","a":"Human geography","why":"Human geography studies farming, industry and trade."},{"t":"roads, railways and ports","a":"Human geography","why":"Human geography studies roads, railways and ports."},{"t":"reading and drawing maps","a":"Practical geography","why":"Practical geography studies reading and drawing maps."},{"t":"fieldwork and collecting data","a":"Practical geography","why":"Practical geography studies fieldwork and collecting data."},{"t":"graphs and statistics
