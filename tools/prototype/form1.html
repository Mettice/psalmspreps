h":"true"},{"text":"A spring balance measures weight.","truth":"true"},{"text":"Mass is the same on the Moon as on Earth.","truth":"true"},{"text":"Weight is a force.","truth":"true"}],"wrong":[{"text":"Weight is measured in kilograms.","truth":"false","explain":"Weight is a force, measured in newtons (N). Kilograms measure mass."},{"text":"Mass is smaller on the Moon.","truth":"false","explain":"Mass is the same everywhere. It is weight that is smaller on the Moon."}]},"pick":{"right":3,"wrong":1}}]},"16":{"subject":"physics","class":"Form 1","lesson_no":16,"language":"en","prerequisites":[13],"skills":[{"id":"p16","name":"Volume"}],"note":{"status":"draft","text":"Volume is the space a body takes up. Its SI unit is the cubic metre (m³). We also use cm³, litres (L) and millilitres (mL): 1 L = 1000 mL = 1000 cm³, so 1 mL = 1 cm³; 1 m³ = 1000 L.\n• Liquids: pour into a measuring cylinder; put your eye level with the surface and read at the bottom of the curved surface (the meniscus).\n• Regular solids: volume of a cuboid = length × width × height.\n• Irregular solids (a stone): put water in a measuring cylinder and read it; lower the stone in and read again. Volume of the stone = second reading − first reading (displacement).","checks":[]},"worked_example":{"status":"draft","vars":{"a":40,"b":58},"figure":"displacement(a, b)","problem":"Ewane puts water in a measuring cylinder, then lowers a stone into it. What is the volume of the stone?","steps":["Before: the bottom of the meniscus is at {a} mL.","After: it is at {b} mL.","Volume of the stone = {b} − {a} = {b - a} mL = {b - a} cm³."],"answer":"{b - a} cm³","checks":["b - a == 18"]},"teach":{"cards":[{"id":"pc16-1","status":"draft","idea":"Volume is the space a body takes up. 1 L = {factor('L', 'mL')} mL = {factor('L', 'cm³')} cm³, so 1 mL = 1 cm³.","vars":{"v":500},"example":["A {v} mL bottle of water holds {convertUnit(v, 'mL', 'cm³')} cm³ of water."],"checks":[],"check":{"ref":"p16-convert1"}},{"id":"pc16-2","status":"draft","idea":"Read a measuring cylinder with your eye level with the surface, at the bottom of the curve (the meniscus).","vars":{"v":46},"example":["The bottom of the meniscus is on {v} mL."],"checks":[],"check":{"ref":"p16-cyl"},"figure":"cylinder(v)"},{"id":"pc16-3","status":"draft","idea":"A cuboid: volume = length × width × height.","vars":{"l":5,"w":4,"h":3},"example":["A box {l} cm × {w} cm × {h} cm: {l} × {w} × {h} = {cuboid(l, w, h)} cm³."],"checks":[],"check":{"ref":"p16-cuboid"}},{"id":"pc16-4","status":"draft","idea":"An irregular solid: read the water level before and after the stone goes in. The difference is the stone's volume.","vars":{"a":40,"b":58},"example":["Before {a} mL, after {b} mL: the stone is {b - a} cm³."],"checks":[],"check":{"ref":"p16-disp"},"figure":"displacement(a, b)"}]},"questions":[{"id":"p16-convert1","type":"numeric","level":1,"review":"rule","sources":["units"],"vars":{"p":{"pick":[{"a":"L","b":"mL"},{"a":"L","b":"cm³"}]},"k":{"int":[2,30]}},"prompt":"{k / 2} {p.a} = ? {p.b}","answer":"convertUnit(k / 2, p.a, p.b)","unit":"{p.b}","misconceptions":[{"id":"small","wrong":"k / 2","explain":"Change the unit: 1 {p.a} = {factor(p.a, p.b)} {p.b}."}],"solution":["1 {p.a} = {factor(p.a, p.b)} {p.b}.","{k / 2} × {factor(p.a, p.b)} = {answer} {p.b}."]},{"id":"p16-cyl","type":"numeric","level":1,"review":"rule","sources":["volume"],"vars":{"v":{"int":[6,48]},"step":2},"figure":"cylinder(step * v, 100, step)","prompt":"How much water is in the measuring cylinder?","answer":"step * v","unit":"mL","misconceptions":[{"id":"top","wrong":"step * v + step","explain":"Read at the bottom of the curved surface, not at the edges."}],"hint":"Each small mark is {step} mL. Look at the bottom of the curve.","solution":["Each small mark is {step} mL.","The bottom of the meniscus is on {answer} mL."]},{"id":"p16-cuboid","type":"numeric","level":1,"review":"rule","sources":["volume"],"vars":{"l":{"int":[2,12]},"w":{"int":[2,10]},"h":{"int":[2,9]},"it":{"pick":["box of chalk","brick","wooden block","box of matches"]}},"prompt":"A {it} is {l} cm long, {w} cm wide and {h} cm high. What is its volume?","answer":"cuboid(l, w, h)","unit":"cm³","misconceptions":[{"id":"add","wrong":"l + w + h","explain":"Volume = length × width × height: multiply, do not add."}],"solution":["Volume = length × width × height = {l} × {w} × {h}.","= {answer} cm³."]},{"id":"p16-disp","type":"numeric","level":1,"review":"rule","sources":["volume"],"vars":{"a":{"int":[10,30]},"d":{"int":[4,15]}},"figure":"displacement(2 * a, 2 * a + 2 * d)","prompt":"What is the volume of the stone, in cm³?","answer":"2 * d","unit":"cm³","misconceptions":[{"id":"after","wrong":"2 * a + 2 * d","explain":"That is the water and the stone together. Subtract the reading before the stone went in."}],"hint":"Read both cylinders, then subtract.","solution":["Before: {2 * a} mL. After: {2 * a + 2 * d} mL.","Stone = {2 * a + 2 * d} − {2 * a} = {answer} mL = {answer} cm³."]},{"id":"p16-tank","type":"numeric","level":2,"review":"rule","sources":["volume","units"],"vars":{"l":{"int":[1,4]},"w":{"int":[1,3]},"h":{"int":[1,3]}},"prompt":"A water tank is {l} m long, {w} m wide and {h} m high. How many litres of water can it hold?","answer":"convertUnit(cuboid(l, w, h), 'm³', 'L')","unit":"L","misconceptions":[{"id":"m3","wrong":"cuboid(l, w, h)","explain":"That is in cubic metres. 1 m³ = 1000 L."}],"solution":["Volume = {l} × {w} × {h} = {cuboid(l, w, h)} m³.","1 m³ = {factor('m³', 'L')} L, so the tank holds {answer} L."]},{"id":"p16-convert","type":"numeric","level":2,"review":"rule","sources":["units"],"vars":{"p":{"pick":[{"a":"L","b":"mL"},{"a":"L","b":"cm³"},{"a":"m³","b":"L"},{"a":"dm³","b":"cm³"}]},"k":{"int":[2,95]},"up":{"pick":[true,false]}},"prompt":"Convert this volume: {up ? k / 10 : k * 10} {up ? p.a : p.b} = ? {up ? p.b : p.a}","answer":"up ? convertUnit(k / 10, p.a, p.b) : convertUnit(k * 10, p.b, p.a)","unit":"{up ? p.b : p.a}","misconceptions":[{"id":"wrong-way","wrong":"up ? convertUnit(k / 10, p.b, p.a) : convertUnit(k * 10, p.a, p.b)","explain":"You went the wrong way. From a bigger unit to a smaller one, the number gets bigger; from smaller to bigger, it gets smaller."}],"solution":["1 {p.a} = {factor(p.a, p.b)} {p.b}.","{up ? 'Multiply' : 'Divide'} by {factor(p.a, p.b)}: {up ? k / 10 : k * 10} {up ? p.a : p.b} = {answer} {up ? p.b : p.a}."]},{"id":"p16-spot","type":"spot_error","level":3,"review":"rule","sources":["volume"],"vars":{"a":{"int":[2,6]},"b":{"int":[2,6]},"c":{"int":[2,6]},"d":{"int":[3,7]},"e":{"int":[2,5]},"f":{"int":[2,5]},"x":{"int":[10,30]},"y":{"int":[3,12]}},"where":"d + e + f != d * e * f","prompt":"One answer is wrong. Which one?","pool":{"right":[{"text":"A box {a} cm × {b} cm × {c} cm has a volume of {a * b * c} cm³.","truth":"cuboid(a, b, c) == a * b * c"},{"text":"Water rises from {2 * x} mL to {2 * x + 2 * y} mL: the stone is {2 * y} cm³.","truth":"true"},{"text":"{a} L = {convertUnit(a, 'L', 'mL')} mL.","truth":"true"}],"wrong":[{"text":"A box {d} cm × {e} cm × {f} cm has a volume of {d + e + f} cm³.","truth":"d + e + f == cuboid(d, e, f)","explain":"Multiply, do not add: {d} × {e} × {f} = {cuboid(d, e, f)} cm³."}]},"pick":{"right":3,"wrong":1}}]},"17":{"subject":"physics","class":"Form 1","lesson_no":17,"language":"en","prerequisites":[14,16],"skills":[{"id":"p17","name":"Density"}],"note":{"status":"draft","text":"Density is the mass of each unit of volume: density = mass ÷ volume.\nUnits: g/cm³ or kg/m³ (the SI unit). 1 g/cm³ = 1000 kg/m³.\nTo find the density of a stone: measure its mass with a balance and its volume by displacement, then divide.\nThe density of water is 1 g/cm³. A body less dense than water floats; a body more dense than water sinks. Some densities: ice about 0.92 g/cm³ (it floats), kerosene about 0.8 g/cm³, iron about 7.9 g/cm³ (it sinks).\nTwo bodies of the same size can have different masses because their densities are different: a block of iron is much heavier than a block of wood of the same size.","checks":[]},"worked_example":{"status":"draft","vars":{"m":54,"v":20,"w":1},"problem":"A metal block has a mass of {m} g and a volume of {v} cm³. What is its density? Will it float in water?","steps":["Density = mass ÷ volume = {m} ÷ {v} = {density(m, v)} g/cm³.","Water is {w} g/cm³. {density(m, v)} is more than {w}, so the block sinks."],"answer":"{density(m, v)} g/cm³; it sinks.","checks":["density(m, v) == 2.7","!floatsInWater(density(m, v))"]},"teach":{"cards":[{"id":"pc17-1","status":"draft","idea":"Density = mass ÷ volume. It tells how much mass is packed into each cm³.","vars":{"m":30,"v":12},"example":["{m} g in {v} cm³: {m} ÷ {v} = {density(m, v)} g/cm³."],"checks":[],"check":{"ref":"p17-d"}},{"id":"pc17-2","status":"draft","idea":"Water has a density of 1 g/cm³. Less dense than water: it floats. More dense: it sinks.","vars":{"w":0.6,"i":7.9},"example":["Wood (about {w} g/cm³) floats. Iron (about {i} g/cm³) sinks."],"checks":[],"check":{"id":"pc17-2-check","type":"mcq","level":1,"review":"rule","sources":["density"],"show":2,"vars":{"d":{"pick":[0.5,0.8,1.5,2,2.5,2.7,3,4,8]}},"prompt":"A block has a density of {d} g/cm³. Will it float or sink in water?","correct":"{floatsInWater(d) ? 'It floats.' : 'It sinks.'}","distractors":[{"text":"It floats.","misconception":"fs"},{"text":"It sinks.","misconception":"fs"}],"misconceptions":[{"id":"fs","explain":"Compare with water, 1 g/cm³: less than 1 floats, more than 1 sinks."}],"solution":["{d} g/cm³ is {floatsInWater(d) ? 'less' : 'more'} than the density of water.","{answer}"]}},{"id":"pc17-3","status":"draft","idea":"Units of density: g/cm³ or kg/m³. 1 g/cm³ = {convertUnit(1, 'kg', 'g')} kg/m³.","vars":{},"example":["Water: 1 g/cm³ = {convertUnit(1, 'kg', 'g')} kg/m³."],"checks":[],"check":{"ref":"p17-unit-l1"}}]},"questions":[{"id":"p17-d","type":"numeric","level":1,"review":"rule","sources":["density"],"vars":{"d":{"pick":[0.5,0.8,1.5,2,2.5,2.7,3,4,8]},"v":{"int":[2,25]}},"prompt":"A block has a mass of {d * v} g and a volume of {v} cm³. What is its density?","answer":"density(d * v, v)","unit":"g/cm³","misconceptions":[{"id":"times","wrong":"d * v * v","explain":"Density = mass ÷ volume: divide, do not multiply."},{"id":"upside","wrong":"round(v / (d * v), 2)","explain":"Divide the mass by the volume, not the volume by the mass."}],"solution":["Density = mass ÷ volume = {d * v} ÷ {v}.","= {answer} g/cm³."]},{"id":"p17-unit-l1","type":"numeric","level":1,"review":"rule","sources":["density"],"vars":{"d":{"pick":[0.5,0.8,1.5,2,2.5,2.7,3,4,8]}},"prompt":"Change {d} g/cm³ into kg/m³.","answer":"d * 1000","unit":"kg/m³","misconceptions":[{"id":"divide","wrong":"d / 1000","explain":"1 g/cm³ = 1000 kg/m³: multiply by 1000."}],"solution":["1 g/cm³ = {convertUnit(1, 'kg', 'g')} kg/m³.","{d} × {convertUnit(1, 'kg', 'g')} = {answer} kg/m³."]},{"id":"p17-m","type":"numeric","level":2,"review":"rule","sources":["density"],"vars":{"d":{"pick":[0.5,0.8,1.5,2,2.5,2.7,3,4,8]},"v":{"int":[2,30]}},"prompt":"A stone has a density of {d} g/cm³ and a volume of {v} cm³. What is its mass?","answer":"d * v","unit":"g","misconceptions":[{"id":"divide","wrong":"round(d / v, 2)","explain":"Mass = density × volume."}],"solution":["Mass = density × volume = {d} × {v}.","= {answer} g."]},{"id":"p17-float","type":"mcq","level":2,"review":"rule","sources":["density"],"show":2,"vars":{"d":{"pick":[0.5,0.8,1.5,2,2.5,2.7,3,4,8]},"v":{"int":[2,20]}},"prompt":"A block has a mass of {d * v} g and a volume of {v} cm³. Will it float or sink in water?","correct":"{floatsInWater(d) ? 'It floats.' : 'It sinks.'}","distractors":[{"text":"It floats.","misconception":"fs"},{"text":"It sinks.","misconception":"fs"}],"misconceptions":[{"id":"fs","explain":"Work out the density (mass ÷ volume) and compare it with water, 1 g/cm³."}],"solution":["Density = {d * v} ÷ {v} = {density(d * v, v)} g/cm³.","That is {floatsInWater(d) ? 'less' : 'more'} than water (1 g/cm³): {answer}"]},{"id":"p17-spot","type":"spot_error","level":3,"review":"authored","sources":["density"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"Density = mass ÷ volume.","truth":"true"},{"text":"Ice floats because it is less dense than water.","truth":"true"},{"text":"1 g/cm³ = 1000 kg/m³.","truth":"true"},{"text":"A body denser than water sinks.","truth":"true"}],"wrong":[{"text":"A big log sinks because it is heavy.","truth":"false","explain":"Size does not decide: wood floats because its density is less than water's."},{"text":"Density = mass × volume.","truth":"false","explain":"Density = mass ÷ volume."},{"text":"Iron floats in water.","truth":"false","explain":"Iron (about 7.9 g/cm³) is denser than water: it sinks."}]},"pick":{"right":3,"wrong":1}}]},"18":{"subject":"physics","class":"Form 1","lesson_no":18,"language":"en","prerequisites":[8],"skills":[{"id":"p18","name":"Temperature"}],"note":{"status":"draft","text":"Temperature tells how hot or cold a body is. The SI unit is the kelvin (K); in daily life we use degrees Celsius (°C).\nT(K) = T(°C) + 273. So 0 °C = 273 K and 100 °C = 373 K.\nFixed points (at normal air pressure): pure ice melts at 0 °C; pure water boils at 100 °C.\nA liquid-in-glass thermometer has mercury or coloured alcohol in a thin tube. When it gets warmer, the liquid expands and rises. Read it with your eye level with the top of the liquid.\nA change of 1 °C is the same as a change of 1 K.","checks":[]},"worked_example":{"status":"draft","vars":{"t":25},"figure":"thermometer(t, 0)","problem":"Read the thermometer, then give the temperature in kelvin.","steps":["Each small mark is 1 °C. The red liquid ends at {t} °C.","T(K) = T(°C) + {toKelvin(0)} = {t} + {toKelvin(0)} = {toKelvin(t)} K."],"answer":"{t} °C = {toKelvin(t)} K","checks":["toKelvin(t) == 298"]},"teach":{"cards":[{"id":"pc18-1","status":"draft","idea":"Temperature tells how hot or cold something is. We read it on a thermometer, in °C.","vars":{"t":31},"example":["The liquid rises when it gets warmer. This one shows {t} °C."],"checks":[],"check":{"ref":"p18-read"},"figure":"thermometer(t, 0)"},{"id":"pc18-2","status":"draft","idea":"The SI unit is the kelvin: T(K) = T(°C) + {toKelvin(0)}.","vars":{"t":37,"z":0},"example":["{z} °C = {toKelvin(z)} K. {t} °C = {toKelvin(t)} K."],"checks":[],"check":{"ref":"p18-k"}},{"id":"pc18-3","status":"draft","idea":"Fixed points: pure ice melts at {melt} °C; pure water boils at {b} °C (at normal air pressure).","vars":{"b":100,"melt":0},"example":["Boiling water: {b} °C = {toKelvin(b)} K."],"checks":[],"check":{"id":"pc18-3-check","type":"mcq","level":1,"review":"authored","sources":["temperature"],"vars":{},"prompt":"At normal air pressure, pure water boils at:","pool":{"right":[{"text":"100 °C","truth":"true"}],"wrong":[{"text":"0 °C","truth":"false","explain":"0 °C is where pure ice melts."},{"text":"37 °C","truth":"false","explain":"37 °C is about normal body temperature."},{"text":"273 °C","truth":"false","explain":"273 is the number added to change °C into kelvin."}]},"pick":{"right":1,"wrong":3}}}]},"questions":[{"id":"p18-read","type":"numeric","level":1,"review":"rule","sources":["temperature"],"vars":{"t":{"int":[3,47]}},"figure":"thermometer(t, 0)","prompt":"What temperature does the thermometer show?","answer":"t","unit":"°C","misconceptions":[{"id":"next","wrong":"t + 10","explain":"Count the small marks after the last number carefully: each one is 1 °C."}],"hint":"Find the last number before the end of the red liquid, then count the small marks.","solution":["Each small mark is 1 °C.","The red liquid ends at {answer} °C."]},{"id":"p18-k","type":"numeric","level":1,"review":"rule","sources":["temperature"],"vars":{"t":{"int":[-20,120]}},"prompt":"Change {t} °C into kelvin.","answer":"toKelvin(t)","unit":"K","misconceptions":[{"id":"minus","wrong":"t - 273","explain":"From °C to K, add 273."}],"solution":["T(K) = T(°C) + {toKelvin(0)} = {t} + {toKelvin(0)}.","= {answer} K."]},{"id":"p18-c","type":"numeric","level":2,"review":"rule","sources":["temperature"],"vars":{"k":{"int":[253,393]}},"prompt":"Change {k} K into degrees Celsius.","answer":"toCelsius(k)","unit":"°C","misconceptions":[{"id":"plus","wrong":"k + 273","explain":"From K to °C, subtract 273."}],"solution":["T(°C) = T(K) − {toKelvin(0)} = {k} − {toKelvin(0)}.","= {answer} °C."]},{"id":"p18-rise","type":"numeric","level":2,"review":"rule","sources":["temperature"],"vars":{"a":{"int":[18,30]},"r":{"int":[5,60]}},"prompt":"Water in a pot was at {a} °C. After heating it is at {a + r} °C. By how many kelvin did its temperature rise?","answer":"r","unit":"K","misconceptions":[{"id":"add273","wrong":"r + 273","explain":"A change of 1 °C is the same as a change of 1 K: do not add 273 to a difference."}],"solution":["Rise = {a + r} − {a} = {r} °C.","A rise of 1 °C is a rise of 1 K, so the rise is {answer} K."]},{"id":"p18-spot","type":"spot_error","level":3,"review":"authored","sources":["temperature"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"The SI unit of temperature is the kelvin.","truth":"true"},{"text":"0 °C = 273 K.","truth":"true"},{"text":"Pure water boils at 100 °C at normal air pressure.","truth":"true"},{"text":"The liquid in a thermometer rises when it gets warmer.","truth":"true"}],"wrong":[{"text":"To change °C into kelvin, subtract 273.","truth":"false","explain":"From °C to K, add 273: 0 °C = 273 K."},{"text":"Pure ice melts at 100 °C.","truth":"false","explain":"Pure ice melts at 0 °C."}]},"pick":{"right":3,"wrong":1}}]},"19":{"subject":"physics","class":"Form 1","lesson_no":19,"language":"en","prerequisites":[6],"skills":[{"id":"p19","name":"Safety information on products"}],"note":{"status":"draft","text":"Read the label before you use any product. A label tells you the name, how to use it, how to store it, warnings, who made it, and the date of manufacture and the expiry date (“use before …”). Do not use a product after its expiry date.\nHazard symbols warn of danger:\n• a flame: flammable (kerosene, petrol);\n• a skull and crossbones: toxic (rat poison);\n• liquid dripping onto a hand and metal: corrosive (battery acid);\n• an exclamation mark: harmful or irritant;\n• a gas bottle: gas under pressure (cooking gas);\n• a dead tree and fish: dangerous for the environment.\nKeep such products away from children and food, in their own containers, never in drink bottles.","checks":[]},"worked_example":{"status":"draft","vars":{"d1":7,"m1":10,"y1":2026,"d2":30,"m2":9,"y2":2026},"problem":"Today is {ddmmyyyy(d1, m1, y1)}. A tin of milk says “Use before {ddmmyyyy(d2, m2, y2)}”. Can we still use it?","steps":["Compare the dates: first the year, then the month, then the day.","The use-before date, {ddmmyyyy(d2, m2, y2)}, is before today, {ddmmyyyy(d1, m1, y1)}."],"answer":"No: it has expired. Do not use it.","checks":["!stillGood(d1, m1, y1, d2, m2, y2)"]},"teach":{"cards":[{"id":"pc19-1","status":"draft","idea":"Hazard symbols warn of danger. A flame means flammable; a skull and crossbones means toxic.","vars":{},"example":["Kerosene has the flame symbol: keep it away from fire."],"checks":[],"check":{"ref":"p19-symbol"}},{"id":"pc19-2","status":"draft","idea":"A label tells how to use and store a product, warnings, who made it and the expiry date.","vars":{},"example":["“Keep out of reach of children” is a warning."],"checks":[],"check":{"ref":"p19-label-l1"}},{"id":"pc19-3","status":"draft","idea":"Never use a product after its expiry (“use before”) date.","vars":{"d1":7,"m1":10,"y1":2026,"d2":1,"m2":3,"y2":2027},"example":["Today {ddmmyyyy(d1, m1, y1)}; use before {ddmmyyyy(d2, m2, y2)}: still good."],"checks":["stillGood(d1, m1, y1, d2, m2, y2)"],"check":{"ref":"p19-expiry"}}]},"questions":[{"id":"p19-symbol","type":"matching","level":1,"review":"authored","sources":["hazards"],"prompt":"Match each hazard symbol (described in words) with what it means.","pick":4,"pool":[{"left its expiry date.","truth":"false","explain":"After the expiry date, do not use it."}]},"pick":{"right":3,"wrong":1}}]}},"chemistry":{"1":{"subject":"chemistry","class":"Form 1","lesson_no":1,"language":"en","prerequisites":[],"skills":[{"id":"ch1","name":"What chemistry is"}],"note":{"status":"draft","text":"Chemistry is the study of matter: what substances are made of, their properties, and how they change into new substances.\nA chemist asks: What is it made of? How does it behave? What happens when it reacts with something else?\nSome branches of chemistry:\n• Organic chemistry: compounds of carbon (in living things, fuels, plastics).\n• Inorganic chemistry: metals, salts and minerals.\n• Physical chemistry: energy changes and how fast reactions go.\n• Analytical chemistry: finding what a sample contains.\n• Biochemistry: chemical changes inside living things.\nA chemist works safely, measures carefully and records results honestly.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"A laboratory in Douala tests a sample of tap water to find out how much chlorine it contains. Which branch of chemistry is this?","steps":["The question is “what does the sample contain, and how much?”","Finding what a sample contains is analytical chemistry."],"answer":"Analytical chemistry.","checks":[]},"teach":{"cards":[{"id":"chc1-1","status":"draft","idea":"Chemistry studies matter: what substances are made of, how they behave, and how they change into new substances.","vars":{},"example":["When firewood burns, it changes into ash, smoke and gases: new substances. Chemistry studies changes like this."],"checks":[],"check":{"id":"chc1-1-check","type":"mcq","level":1,"review":"authored","sources":["chemistry"],"vars":{},"prompt":"Which question is a chemistry question?","pool":{"right":[{"text":"What is table salt made of?","truth":"true"},{"text":"Why does iron rust?","truth":"true"}],"wrong":[{"text":"How fast does a taxi move?","truth":"false","explain":"Speed and motion are Physics."},{"text":"How does a goat digest grass?","truth":"false","explain":"Digestion in an animal is Biology."},{"text":"What will the weather be tomorrow?","truth":"false","explain":"Weather is Meteorology."}]},"pick":{"right":1,"wrong":3}}},{"id":"chc1-2","status":"draft","idea":"Chemistry has branches: organic, inorganic, physical, analytical chemistry and biochemistry.","vars":{},"example":["Plastics and fuels: organic chemistry. Salts and metals: inorganic chemistry."],"checks":[],"check":{"ref":"ch1-branch"}},{"id":"chc1-3","status":"draft","idea":"A chemist observes, measures carefully, works safely and records results honestly.","vars":{},"example":["Ndi weighs a sample twice and writes both results, even when they are different."],"checks":[],"check":{"ref":"ch1-which"}}]},"questions":[{"id":"ch1-branch","type":"matching","level":1,"review":"authored","sources":["chemistry"],"prompt":"Match each branch of chemistry with what it studies.","pick":4,"pool":[{"left":"Organic chemistry","right":"the compounds of carbon found in living things, fuels and plastics"},{"left":"Inorganic chemistry","right":"metals, salts and minerals"},{"left":"Analytical chemistry","right":"what a sample contains and how much of each substance"},{"left":"Biochemistry","right":"the chemical changes that happen inside living things"},{"left":"Physical chemistry","right":"energy changes and how fast reactions happen"}]},{"id":"ch1-which","type":"mcq","level":1,"review":"authored","sources":["chemistry"],"vars":{"x":{"pick":[{"t":"the compounds of carbon found in living things, fuels and plastics","a":"Organic chemistry","why":"Organic chemistry studies the compounds of carbon found in living things, fuels and plastics."},{"t":"metals, salts and minerals","a":"Inorganic chemistry","why":"Inorganic chemistry studies metals, salts and minerals."},{"t":"what a sample contains and how much of each substance","a":"Analytical chemistry","why":"Analytical chemistry studies w ach action safe or not safe in the chemistry laboratory?","pool":[{"left":"Wear safety goggles when heating or using acids.","right":"safe"},{"left":"Waft a smell towards your nose with your hand.","right":"safe"},{"left":"Add acid to water, slowly, not water to acid.","right":"safe"},{"left":"Point a heated test tube away from people.","right":"safe"},{"left":"Label every container you fill.","right":"safe"},{"left":"Wash your hands after the practical.","right":"safe"},{"left":"Taste a chemical to identify it.","right":"not safe"},{"left":"Smell a gas by putting your nose over the test tube.","right":"not safe"},{"left":"Pour unused chemicals back into the stock bottle.","right":"not safe"},{"left":"Eat your lunch at the laboratory bench.","right":"not safe"},{"left":"Heat a test tube pointing at your neighbour.","right":"not safe"},{"left":"Pour water into concentrated acid.","right":"not safe"}]},{"id":"ch6-what","type":"mcq","level":1,"review":"authored","sources":["safety-chem"],"vars":{"x":{"pick":[{"t":"acid splashes on your hand","a":"Wash it with plenty of running water and tell the teacher.","why":"If acid splashes on your hand: Wash it with plenty of running water and tell the teacher."},{"t":"a chemical splashes into your eye","a":"Rinse the eye with clean water for a long time and get help at once.","why":"If a chemical splashes into your eye: Rinse the eye with clean water for a long time and get help at once."},{"t":"you smell gas from the Bunsen burner tap","a":"Turn off the gas, open windows and tell the teacher.","why":"If you smell gas from the Bunsen burner tap: Turn off the gas, open windows and tell the teacher."},{"t":"your classmate's test tube starts to spit while heating","a":"Move away and tell your classmate to point it away and stop heating.","why":"If your classmate's test tube starts to spit while heating: Move away and tell your classmate to point it away and stop heating."}]}},"prompt":"What should you do if {x.t}?","correct":"{x.a}","distractors":[{"text":"Wash it with plenty of running water and tell the teacher.","misconception":"other"},{"text":"Rinse the eye with clean water for a long time and get help at once.","misconception":"other"},{"text":"Turn off the gas, open windows and tell the teacher.","misconception":"other"},{"text":"Move away and tell your classmate to point it away and stop heating.","misconception":"other"}],"misconceptions":[{"id":"other","explain":"That is the right action for a different accident."}],"solution":["{x.why}","Answer: {answer}."]},{"id":"ch6-why","type":"mcq","level":2,"review":"authored","sources":["safety-chem"],"vars":{},"prompt":"Why must we never pour unused chemicals back into the stock bottle?","pool":{"right":[{"text":"It could spoil (contaminate) the whole bottle for everyone.","truth":"true"}],"wrong":[{"text":"Because it wastes time.","truth":"false","explain":"The danger is contaminating the whole stock bottle."},{"text":"Because the bottle is too small.","truth":"false","explain":"The real reason: the chemical may be dirty or mixed and spoil the stock."},{"text":"Because the teacher wants to count them.","truth":"false","explain":"The reason is safety and purity: it could contaminate the stock."}]},"pick":{"right":1,"wrong":3}},{"id":"ch6-spot","type":"spot_error","level":3,"review":"authored","sources":["safety-chem"],"vars":{},"prompt":"One rule is wrong. Which one?","pool":{"right":[{"text":"Wear safety goggles when heating.","truth":"true"},{"text":"Label every container you fill.","truth":"true"},{"text":"Wash your hands after a practical.","truth":"true"},{"text":"Waft a gas towards your nose to smell it.","truth":"true"}],"wrong":[{"text":"Add water to concentrated acid.","truth":"false","explain":"Always add acid to water, slowly."},{"text":"You may keep a chemical in an empty drink bottle if you label it.","truth":"false","explain":"Never use drink bottles: someone may drink from it."}]},"pick":{"right":3,"wrong":1}}]},"7":{"subject":"chemistry","class":"Form 1","lesson_no":7,"language":"en","prerequisites":[3],"skills":[{"id":"ch7","name":"Measuring mass and volume"}],"note":{"status":"draft","text":"Mass is measured with a balance, in kilograms (kg) or grams (g): 1 kg = 1000 g, 1 g = 1000 mg. In the laboratory we use a top-pan (electronic) balance. Put the empty container on first and press “zero” (tare), then add the substance: the screen shows only the substance's mass.\nVolume of a liquid is measured in cm³ or mL (1 cm³ = 1 mL; 1 L = 1000 cm³):\n• measuring cylinder for most volumes;\n• pipette or burette when the volume must be exact.\nRead the bottom of the meniscus with your eye level with it.","checks":[]},"worked_example":{"status":"draft","vars":{"b":52.4,"t":61.9},"problem":"A beaker has a mass of {b} g. With salt in it, the mass is {t} g. What is the mass of the salt?","steps":["Mass of the salt = mass with salt − mass of the empty beaker.","{t} − {b} = {t - b} g.","(With a tare button, set the empty beaker to zero and read the salt directly.)"],"answer":"{t - b} g","checks":["t - b == 9.5"]},"teach":{"cards":[{"id":"chc7-1","status":"draft","idea":"Mass: use a balance. 1 kg = {factor('kg', 'g')} g, 1 g = {factor('g', 'mg')} mg.","vars":{"m":500},"example":["A packet of {m} g of salt has a mass of {convertUnit(m, 'g', 'kg')} kg."],"checks":[],"check":{"ref":"ch7-mass"}},{"id":"chc7-2","status":"draft","idea":"Weighing by difference: mass of substance = (container + substance) − container. Or press “zero” with the empty container on.","vars":{"a":30,"b":42},"example":["Empty dish {a} g; dish with sugar {b} g; sugar {b - a} g."],"checks":[],"check":{"ref":"ch7-diff"}},{"id":"chc7-3","status":"draft","idea":"Volume of a liquid: read the bottom of the meniscus in a measuring cylinder. 1 L = {factor('L', 'cm³')} cm³ and 1 mL = 1 cm³.","vars":{"v":34},"example":["This cylinder holds {v} cm³."],"checks":[],"check":{"ref":"ch7-cyl"},"figure":"cylinder(v, 50, 1)"}]},"questions":[{"id":"ch7-mass","type":"numeric","level":1,"review":"rule","sources":["measure-chem"],"vars":{"p":{"pick":[{"a":"kg","b":"g"},{"a":"g","b":"mg"}]},"k":{"int":[2,95]},"up":{"pick":[true,false]}},"prompt":"Convert this mass: {up ? k / 10 : k * 10} {up ? p.a : p.b} = ? {up ? p.b : p.a}","answer":"up ? convertUnit(k / 10, p.a, p.b) : convertUnit(k * 10, p.b, p.a)","unit":"{up ? p.b : p.a}","misconceptions":[{"id":"wrong-way","wrong":"up ? convertUnit(k / 10, p.b, p.a) : convertUnit(k * 10, p.a, p.b)","explain":"You went the wrong way: to a smaller unit the number gets bigger."}],"solution":["1 {p.a} = {factor(p.a, p.b)} {p.b}.","{up ? 'Multiply' : 'Divide'} by {factor(p.a, p.b)}: {answer} {up ? p.b : p.a}."]},{"id":"ch7-diff","type":"numeric","level":1,"review":"rule","sources":["measure-chem"],"vars":{"a":{"int":[250,600]},"s":{"int":[15,180]}},"prompt":"An empty beaker has a mass of {a / 10} g. With copper(II) sulfate crystals in it, the mass is {(a + s) / 10} g. What is the mass of the crystals?","answer":"s / 10","unit":"g","misconceptions":[{"id":"add","wrong":"(2 * a + s) / 10","explain":"Subtract the empty beaker from the total; do not add."}],"solution":["Crystals = total − empty beaker = {(a + s) / 10} − {a / 10}.","= {answer} g."]},{"id":"ch7-cyl","type":"numeric","level":1,"review":"rule","sources":["measure-chem"],"vars":{"v":{"int":[8,48]},"step":1},"figure":"cylinder(v, 50, step)","prompt":"What volume of water is in the measuring cylinder, in cm³?","answer":"v","unit":"cm³","misconceptions":[{"id":"top","wrong":"v + step","explain":"Read at the bottom of the curved surface (the meniscus)."}],"hint":"Each small mark is {step} cm³. Look at the bottom of the curve.","solution":["Each small mark is {step} cm³.","The bottom of the meniscus is on {answer} cm³."]},{"id":"ch7-vol","type":"numeric","level":2,"review":"rule","sources":["measure-chem"],"vars":{"p":{"pick":[{"a":"L","b":"mL"},{"a":"L","b":"cm³"},{"a":"dm³","b":"cm³"}]},"k":{"int":[2,95]},"up":{"pick":[true,false]}},"prompt":"Convert this volume: {up ? k / 10 : k * 10} {up ? p.a : p.b} = ? {up ? p.b : p.a}","answer":"up ? convertUnit(k / 10, p.a, p.b) : convertUnit(k * 10, p.b, p.a)","unit":"{up ? p.b : p.a}","misconceptions":[{"id":"wrong-way","wrong":"up ? convertUnit(k / 10, p.b, p.a) : convertUnit(k * 10, p.a, p.b)","explain":"You went the wrong way: to a smaller unit the number gets bigger."}],"solution":["1 {p.a} = {factor(p.a, p.b)} {p.b}.","{up ? 'Multiply' : 'Divide'} by {factor(p.a, p.b)}: {answer} {up ? p.b : p.a}."]},{"id":"ch7-total","type":"numeric","level":2,"review":"rule","sources":["measure-chem"],"vars":{"a":{"int":[5,40]},"b":{"int":[5,40]}},"prompt":"Tabe pours {a} cm³ of water and then {b} cm³ of dilute acid into a beaker. What volume of liquid is in the beaker, in cm³?","answer":"a + b","unit":"cm³","misconceptions":[{"id":"diff","wrong":"abs(a - b)","explain":"Both liquids are in the beaker: add the volumes."}],"solution":["Total = {a} + {b}.","= {answer} cm³."]},{"id":"ch7-spot","type":"spot_error","level":3,"review":"rule","sources":["measure-chem"],"vars":{"a":{"int":[20,60]},"s":{"int":[3,15]},"b":{"int":[20,60]},"t":{"int":[3,15]},"v":{"int":[2,9]}},"where":"a != b","prompt":"One result is worked out wrongly. Which one?","pool":{"right":[{"text":"Empty beaker {a} g, beaker with salt {a + s} g: the salt is {s} g.","truth":"true"},{"text":"{v} L = {convertUnit(v, 'L', 'cm³')} cm³.","truth":"true"},{"text":"{v} kg = {convertUnit(v, 'kg', 'g')} g.","truth":"true"}],"wrong":[{"text":"Empty beaker {b} g, beaker with sugar {b + t} g: the sugar is {2 * b + t} g.","truth":"false","explain":"Subtract: {b + t} − {b} = {t} g."}]},"pick":{"right":3,"wrong":1}}]},"8":{"subject":"chemistry","class":"Form 1","lesson_no":8,"language":"en","prerequisites":[7],"skills":[{"id":"ch8","name":"Measuring time and temperature"}],"note":{"status":"draft","text":"Time is measured with a stopwatch or stop clock. The SI unit is the second (s): 1 min = 60 s; 1 h = 60 min = 3600 s. In experiments we often time how long a reaction or a change takes: time taken = finishing time − starting time.\nTemperature is measured with a thermometer, in degrees Celsius (°C); the SI unit is the kelvin (K): T(K) = T(°C) + 273.\nUse the thermometer carefully: hold it in the liquid without touching the bottom of the beaker, wait until the reading stops changing, and read with your eye level with the top of the liquid. Pure water boils at 100 °C and pure ice melts at 0 °C.","checks":[]},"worked_example":{"status":"draft","vars":{"m":2,"s":35},"problem":"Magnesium ribbon fizzes in acid for {m} min {s} s. How many seconds is that?","steps":["1 min = {convertUnit(1, 'min', 's')} s, so {m} min = {convertUnit(m, 'min', 's')} s.","{convertUnit(m, 'min', 's')} + {s} = {convertUnit(m, 'min', 's') + s} s."],"answer":"{convertUnit(m, 'min', 's') + s} s","checks":["convertUnit(m, 'min', 's') + s == 155"]},"teach":{"cards":[{"id":"chc8-1","status":"draft","idea":"Time: a stopwatch. 1 min = {convertUnit(1, 'min', 's')} s and 1 h = {convertUnit(1, 'h', 'min')} min.","vars":{"m":3},"example":["{m} min = {convertUnit(m, 'min', 's')} s."],"checks":[],"check":{"ref":"ch8-time"}},{"id":"chc8-2","status":"draft","idea":"Temperature: a thermometer, in °C. Keep the bulb in the liquid, not touching the beaker, and wait for the reading to stop changing.","vars":{"t":42},"example":["This thermometer shows {t} °C."],"checks":[],"check":{"ref":"ch8-read"},"figure":"thermometer(t, 0)"},{"id":"chc8-3","status":"draft","idea":"In kelvin: T(K) = T(°C) + {toKelvin(0)}.","vars":{"b":100},"example":["Boiling water: {b} °C = {toKelvin(b)} K."],"checks":[],"check":{"ref":"ch8-k"}}]},"questions":[{"id":"ch8-time","type":"numeric","level":1,"review":"rule","sources":["measure-chem"],"vars":{"m":{"int":[1,9]},"s":{"int":[5,55]}},"prompt":"A reaction takes {m} min {s} s. How many seconds is that?","answer":"convertUnit(m, 'min', 's') + s","unit":"s","misconceptions":[{"id":"hundred","wrong":"100 * m + s","explain":"One minute is 60 seconds, not 100."}],"solution":["{m} min = {m} × {convertUnit(1, 'min', 's')} = {convertUnit(m, 'min', 's')} s.","{convertUnit(m, 'min', 's')} + {s} = {answer} s."]},{"id":"ch8-read","type":"numeric","level":1,"review":"rule","sources":["measure-chem"],"vars":{"t":{"int":[3,47]}},"figure":"thermometer(t, 0)","prompt":"What temperature does the thermometer show?","answer":"t","unit":"°C","misconceptions":[{"id":"next","wrong":"t + 10","explain":"Count the small marks after the last number: each one is 1 °C."}],"solution":["Each small mark is 1 °C.","The liquid ends at {answer} °C."]},{"id":"ch8-k","type":"numeric","level":1,"review":"rule","sources":["measure-chem"],"vars":{"t":{"int":[-10,110]}},"prompt":"Change {t} °C into kelvin.","answer":"toKelvin(t)","unit":"K","misconceptions":[{"id":"minus","wrong":"t - 273","explain":"From °C to K, add 273."}],"solution":["T(K) = {t} + {toKelvin(0)}.","= {answer} K."]},{"id":"ch8-taken","type":"numeric","level":2,"review":"rule","sources":["measure-chem"],"vars":{"a":{"int":[5,40]},"d":{"int":[15,140]}},"prompt":"The stopwatch read {a} s when a piece of chalk was dropped into acid, and {a + d} s when the fizzing stopped. How long did the fizzing last?","answer":"d","unit":"s","misconceptions":[{"id":"end","wrong":"a + d","explain":"That is the finishing reading. Time taken = finish − start."}],"solution":["Time taken = finish − start = {a + d} − {a}.","= {answer} s."]},{"id":"ch8-rise","type":"numeric","level":2,"review":"rule","sources":["measure-chem"],"vars":{"a":{"int":[18,30]},"r":{"int":[4,40]}},"prompt":"When sodium hydroxide dissolves in water, the temperature rises from {a} °C to {a + r} °C. By how many degrees does it rise?","answer":"r","unit":"°C","misconceptions":[{"id":"end","wrong":"a + r","explain":"That is the final temperature. The rise is final − start."}],"solution":["Rise = {a + r} − {a}.","= {answer} °C."]},{"id":"ch8-spot","type":"spot_error","level":3,"review":"authored","sources":["measure-chem"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"One minute is 60 seconds.","truth":"true"},{"text":"A thermometer bulb should not touch the bottom of the beaker.","truth":"true"},{"text":"0 °C is 273 K.","truth":"true"},{"text":"Time taken = finishing time − starting time.","truth":"true"}],"wrong":[{"text":"One minute is 100 seconds.","truth":"false","explain":"One minute is 60 seconds."},{"text":"Read the thermometer as soon as you put it in.","truth":"false","explain":"Wait until the reading stops changing."}]},"pick":{"right":3,"wrong":1}}]},"9":{"subject":"chemistry","class":"Form 1","lesson_no":9,"language":"en","prerequisites":[1],"skills":[{"id":"ch9","name":"Physical and chemical changes"}],"note":{"status":"draft","text":"A physical change makes no new substance. Only the form or state changes, and it is often easy to reverse: ice melting, sugar dissolving, water boiling, cutting paper.\nA chemical change makes one or more new substances. It is usually hard to reverse: firewood burning, iron rusting, cooking an egg, palm wine or milk turning sour.\nSigns of a chemical change:\n• a gas is given off (bubbles, fizzing);\n• the colour changes;\n• heat or light is given out;\n• a new solid appears (a precipitate);\n• a new smell.\nSome physical changes also give bubbles (boiling) or change colour, so look for a new substance.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"When an egg is boiled, the clear liquid inside turns white and solid. Is this a physical or a chemical change?","steps":["The clear liquid becomes a white solid that does not turn back when it cools.","A new substance has formed and the change cannot be reversed."],"answer":"A chemical change.","checks":[]},"teach":{"cards":[{"id":"chc9-1","status":"draft","idea":"A physical change makes no new substance and is often easy to reverse.","vars":{},"example":["Ice → water → ice again: the same substance all the time."],"checks":[],"check":{"ref":"ch9-sort"}},{"id":"chc9-2","status":"draft","idea":"A chemical change makes a new substance and is hard to reverse.","vars":{},"example":["Firewood burns to ash and smoke: you cannot turn the ash back into wood."],"checks":[],"check":{"ref":"ch9-which"}},{"id":"chc9-3","status":"draft","idea":"Signs of a chemical change: gas given off, colour change, heat or light given out, a new solid or a new smell.","vars":{},"example":["A piece of chalk in vinegar fizzes: a gas is made."],"checks":[],"check":{"ref":"ch9-sign"}}]},"questions":[{"id":"ch9-sort","type":"matching","level":1,"review":"authored","sources":["changes"],"groups":true,"pick":6,"group_order":["physical change","chemical change"],"prompt":"Sort each change: physical or chemical?","pool":[{"left":"ice melting","right":"physical change"},{"left":"sugar dissolving in tea","right":"physical change"},{"left":"water boiling","right":"physical change"},{"left":"cutting paper","right":"physical change"},{"left":"breaking a glass","right":"physical change"},{"left":"palm oil turning solid in the cold","right":"physical change"},{"left":"grinding maize into flour","right":"physical change"},{"left":"firewood burning","right":"chemical change"},{"left":"an iron roof rusting","right":"chemical change"},{"left":"cooking an egg","right":"chemical change"},{"left":"palm wine turning sour","right":"chemical change"},{"left":"milk going sour","right":"chemical change"},{"left":"bread dough rising with yeast","right":"chemical change"},{"left":"a match burning","right":"chemical change"}]},{"id":"ch9-which","type":"mcq","level":1,"review":"authored","sources":["changes"],"vars":{},"prompt":"Which of these is a chemical change?","pool":{"right":[{"text":"firewood burning","truth":"true"},{"text":"an iron roof rusting","truth":"true"},{"text":"cooking an egg","truth":"true"},{"text":"palm wine turning sour","truth":"true"},{"text":"milk going sour","truth":"true"},{"text":"bread dough rising with yeast","truth":"true"},{"text":"a match burning","truth":"true"}],"wrong":[{"text":"ice melting","truth":"false","explain":"Ice melting makes no new substance: it is a physical change."},{"text":"sugar dissolving in tea","truth":"false","explain":"Sugar dissolving in tea makes no new substance: it is a physical change."},{"text":"water boiling","truth":"false","explain":"Water boiling makes no new substance: it is a physical change."},{"text":"cutting paper","truth":"false","explain":"Cutting paper makes no new substance: it is a physical change."},{"text":"breaking a glass","truth":"false","explain":"Breaking a glass makes no new substance: it is a physical change."},{"text":"palm oil turning solid in the cold","truth":"false","explain":"Palm oil turning solid in the cold makes no new substance: it is a physical change."},{"text":"grinding maize into flour","truth":"false","explain":"Grinding maize into flour makes no new substance: it is a physical change."}]},"pick":{"right":1,"wrong":3}},{"id":"ch9-sign","type":"mcq","level":1,"review":"authored","sources":["changes"],"vars":{"x":{"pick":[{"t":"Bubbles of gas appear when chalk is put in vinegar.","a":"a gas is given off","why":"Bubbles of gas appear when chalk is put in vinegar. The sign is: a gas is given off."},{"t":"A shiny iron nail turns orange-brown.","a":"the colour changes","why":"A shiny iron nail turns orange-brown. The sign is: the colour changes."},{"t":"Burning kerosene gives out heat and light.","a":"heat or light is given out","why":"Burning kerosene gives out heat and light. The sign is: heat or light is given out."},{"t":"Two clear liquids are mixed and a cloudy white solid appears.","a":"a new solid appears","why":"Two clear liquids are mixed and a cloudy white solid appears. The sign is: a new solid appears."}]}},"prompt":"{x.t} Which sign of a chemical change is this?","correct":"{x.a}","distractors":[{"text":"a gas is given off","misconception":"other"},{"text":"the colour changes","misconception":"other"},{"text":"heat or light is given out","misconception":"other"},{"text":"a new solid appears","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Look again at what you can see happening."}],"solution":["{x.why}","Answer: {answer}."]},{"id":"ch9-why","type":"mcq","level":2,"review":"authored","sources":["changes"],"vars":{},"prompt":"Water boils and gives bubbles. Why is boiling a physical change?","pool":{"right":[{"text":"The bubbles are steam, which is still water: no new substance is made.","truth":"true"}],"wrong":[{"text":"Because it needs heat.","truth":"false","explain":"Many chemical changes also need heat. What matters is whether a new substance forms."},{"text":"Because bubbles always mean a physical change.","truth":"false","explain":"Bubbles can come from chemical changes too (chalk in vinegar)."},{"text":"Because water is a liquid.","truth":"false","explain":"The state does not decide; ask whether a new substance forms."}]},"pick":{"right":1,"wrong":3}},{"id":"ch9-spot","type":"spot_error","level":3,"review":"authored","sources":["changes"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"Rusting is a chemical change.","truth":"true"},{"text":"Dissolving sugar is a physical change.","truth":"true"},{"text":"Burning firewood makes new substances.","truth":"true"},{"text":"Melting ice can be reversed by freezing.","truth":"true"}],"wrong":[{"text":"Cooking an egg is a physical change.","truth":"false","explain":"Cooking makes new substances that do not change back: a chemical change."},{"text":"Grinding maize into flour is a chemical change.","truth":"false","explain":"Flour is still maize in small pieces: a physical change."}]},"pick":{"right":3,"wrong":1}}]},"10":{"subject":"chemistry","class":"Form 1","lesson_no":10,"language":"en","prerequisites":[9],"skills":[{"id":"ch10","name":"States of matter and changes of state"}],"note":{"status":"draft","text":"Matter exists as solid, liquid or gas.\n• Solid: fixed shape and volume. Liquid: fixed volume, takes the shape of its container. Gas: fills its container, can be compressed.\nChanges of state are physical changes:\n• melting (solid → liquid) at the melting point; ice melts at 0 °C;\n• freezing (liquid → solid);\n• evaporation and boiling (liquid → gas); water boils at 100 °C;\n• condensation (gas → liquid);\n• sublimation (solid → gas directly), for example iodine and ammonium chloride.\nA pure substance melts and boils at fixed temperatures; an impure one melts and boils over a range.","checks":[]},"worked_example":{"status":"draft","vars":{"f":"solid","t":"gas"},"problem":"When iodine crystals are warmed gently, a purple gas appears and no liquid forms. What is this change called?","steps":["Iodine goes from {f} straight to {t}, with no liquid in between.","A {f} → {t} change is {processName(f, t)}."],"answer":"{processName(f, t)}","checks":["processName(f, t) == 'sublimation'"]},"teach":{"cards":[{"id":"chc10-1","status":"draft","idea":"Solid, liquid and gas: a solid keeps its shape, a liquid takes the shape of its container, a gas fills its container.","vars":{},"example":["Kerosene in a lamp takes the shape of the lamp."],"checks":[],"check":{"ref":"ch10-state"}},{"id":"chc10-2","status":"draft","idea":"Melting, freezing, evaporation, condensation and sublimation are changes of state: no new substance is made.","vars":{"f":"solid","t":"gas"},"example":["Iodine: {f} → {t} is {processName(f, t)}."],"checks":[],"check":{"ref":"ch10-name"}},{"id":"chc10-3","status":"draft","idea":"A pure substance has a fixed melting point and boiling point. Pure water boils at {b} °C at normal pressure.","vars":{"b":100},"example":["Salt water boils above {b} °C: it is not pure."],"checks":[],"check":{"id":"chc10-3-check","type":"mcq","level":1,"review":"authored","sources":["states"],"vars":{},"prompt":"How can we tell that a sample of water is pure?","pool":{"right":[{"text":"It boils at exactly 100 °C at normal pressure.","truth":"true"}],"wrong":[{"text":"It looks clear.","truth":"false","explain":"Salt water also looks clear."},{"text":"It has no smell.","truth":"false","explain":"Many impure liquids have no smell."},{"text":"It is cold.","truth":"false","explain":"Temperature does not show purity; the boiling point does."}]},"pick":{"right":1,"wrong":3}}}]},"questions":[{"id":"ch10-name","type":"mcq","level":1,"review":"rule","sources":["states"],"vars":{"p":{"pick":[{"f":"solid","t":"liquid"},{"f":"liquid","t":"solid"},{"f":"liquid","t":"gas"},{"f":"gas","t":"liquid"},{"f":"solid","t":"gas"}]}},"prompt":"A {p.f} changes into a {p.t}. What is this change called?","correct":"{processName(p.f, p.t)}","distractors":[{"text":"melting","misconception":"name"},{"text":"freezing","misconception":"name"},{"text":"evaporation","misconception":"name"},{"text":"condensation","misconception":"name"},{"text":"sublimation","misconception":"name"}],"misconceptions":[{"id":"name","explain":"Not this one. Which state does it start in, and which does it end in?"}],"solution":["{p.f} → {p.t}: {answer}."]},{"id":"ch10-state","type":"mcq","level":1,"review":"authored","sources":["states"],"vars":{"x":{"pick":[{"t":"keeps its own shape","a":"solid","why":"A solid keeps its own shape."},{"t":"takes the shape of its container but keeps its volume","a":"liquid","why":"A liquid takes the shape of its container but keeps its volume."},{"t":"spreads to fill the whole container","a":"gas","why":"A gas spreads to fill the whole container."}]}},"prompt":"Which state of matter {x.t}?","correct":"{x.a}","distractors":[{"text":"solid","misconception":"other"},{"text":"liquid","misconception":"other"},{"text":"gas","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Think: does it keep its shape? its volume?"}],"solution":["{x.why}","Answer: {answer}."],"show":3},{"id":"ch10-example","type":"mcq","level":2,"review":"authored","sources":["states"],"vars":{"x":{"pick":[{"t":"Iodine crystals warmed in a beaker give a purple gas, with no liquid.","a":"sublimation","why":"Iodine crystals warmed in a beaker give a purple gas, with no liquid. This is sublimation."},{"t":"Candle wax becomes liquid near the flame.","a":"melting","why":"Candle wax becomes liquid near the flame. This is melting."},{"t":"A mirror in the bathroom becomes covered with water drops.","a":"condensation","why":"A mirror in the bathroom becomes covered with water drops. This is condensation."},{"t":"A puddle disappears in the afternoon sun.","a":"evaporation","why":"A puddle disappears in the afternoon sun. This is evaporation."},{"t":"Hot lead poured into a mould becomes hard.","a":"freezing","why":"Hot lead poured into a mould becomes hard. This is freezing."}]}},"prompt":"{x.t} What change of state is this?","correct":"{x.a}","distractors":[{"text":"melting","misconception":"other"},{"text":"freezing","misconception":"other"},{"text":"evaporation","misconception":"other"},{"text":"condensation","misconception":"other"},{"text":"sublimation","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Which state does it start in, and which does it end in?"}],"solution":["{x.why}","Answer: {answer}."]},{"id":"ch10-spot","type":"spot_error","level":3,"review":"authored","sources":["states"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"Melting is a physical change.","truth":"true"},{"text":"Iodine can sublime.","truth":"true"},{"text":"A pure substance has a fixed boiling point.","truth":"true"},{"text":"Condensation turns a gas into a liquid.","truth":"true"}],"wrong":[{"text":"Salt water boils at exactly 100 °C.","truth":"false","explain":"Salt water is impure: it boils above 100 °C."},{"text":"Boiling makes a new substance.","truth":"false","explain":"Steam is still water: boiling is a physical change."}]},"pick":{"right":3,"wrong":1}}]},"11":{"subject":"chemistry","class":"Form 1","lesson_no":11,"language":"en","prerequisites":[10],"skills":[{"id":"ch11","name":"Kinetic theory of matter"}],"note":{"status":"draft","text":"The kinetic theory says:\n• All matter is made of tiny particles.\n• The particles are always moving. In a solid they vibrate in fixed places; in a liquid they slide past each other; in a gas they move fast in all directions.\n• When a substance is heated, its particles gain energy and move faster.\nThis explains changes of state: when a solid is heated, its particles vibrate so much that they break free (melting); heated more, they escape from the liquid (boiling).\nDiffusion: particles spread out from where there are many to where there are few. The smell of ndolé cooking fills the house; a purple crystal colours still water. Diffusion is fastest in gases and faster when warm.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Why does the smell of fried plantains reach the next room, even with no wind?","steps":["The smell is made of tiny gas particles from the food.","Gas particles move fast in all directions and spread out into the air (diffusion).","They spread from the kitchen, where there are many, to the room, where there are few."],"answer":"The smell particles diffuse through the air.","checks":[]},"teach":{"cards":[{"id":"chc11-1","status":"draft","idea":"All matter is made of tiny particles that are always moving.","vars":{},"example":["Even in a stone, the particles vibrate in their places."],"checks":[],"check":{"ref":"ch11-move"}},{"id":"chc11-2","status":"draft","idea":"Heating gives the particles more energy: they move faster. That is why solids melt and liquids boil.","vars":{},"example":["Ice melts because its particles vibrate so much that they break free."],"checks":[],"check":{"ref":"ch11-heat"}},{"id":"chc11-3","status":"draft","idea":"Diffusion: particles spread out from where there are many to where there are few. It is fastest in gases and when warm.","vars":{},"example":["A drop of ink slowly colours a whole glass of still water."],"checks":[],"check":{"ref":"ch11-diffusion"}}]},"questions":[{"id":"ch11-move","type":"mcq","level":1,"review":"authored","sources":["kinetic"],"vars":{"x":{"pick":[{"t":"vibrate in fixed places","a":"solid","why":"In a solid the particles vibrate in fixed places."},{"t":"slide past each other","a":"liquid","why":"In a liquid the particles slide past each other."},{"t":"move fast in all directions","a":"gas","why":"In a gas the particles move fast in all directions."}]}},"prompt":"In which state do the particles {x.t}?","correct":"{x.a}","distractors":[{"text":"solid","misconception":"other"},{"text":"liquid","misconception":"other"},{"text":"gas","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Think about how freely the particles can move."}],"solution":["{x.why}","Answer: {answer}."],"show":3},{"id":"ch11-heat","type":"mcq","level":1,"review":"authored","sources":["kinetic"],"vars":{},"prompt":"What happens to the particles of a substance when it is heated?","pool":{"right":[{"text":"They gain energy and move faster.","truth":"true"}],"wrong":[{"text":"They get bigger.","truth":"false","explain":"The particles do not grow; they move faster."},{"text":"They stop moving.","truth":"false","explain":"Cooling slows them down; heating speeds them up."},{"text":"They change into new particles.","truth":"false","explain":"Heating alone does not make new particles in a change of state."}]},"pick":{"right":1,"wrong":3}},{"id":"ch11-diffusion","type":"mcq","level":1,"review":"authored","sources":["kinetic"],"vars":{"x":{"pick":[{"t":"The smell of ndolé cooking fills the house.","a":"diffusion","why":"The smell of ndolé cooking fills the house. This is diffusion."},{"t":"A purple crystal slowly colours still water.","a":"diffusion","why":"A purple crystal slowly colours still water. This is diffusion."},{"t":"Water in a pot turns to steam.","a":"boiling","why":"Water in a pot turns to steam. This is boiling."},{"t":"Ice cubes in a drink turn to water.","a":"melting","why":"Ice cubes in a drink turn to water. This is melting."}]}},"prompt":"{x.t} Which of these explains it?","correct":"{x.a}","distractors":[{"text":"diffusion","misconception":"other"},{"text":"boiling","misconception":"other"},{"text":"melting","misconception":"other"},{"text":"condensation","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Is something spreading out, or changing state?"}],"solution":["{x.why}","Answer: {answer}."]},{"id":"ch11-faster","type":"mcq","level":2,"review":"authored","sources":["kinetic"],"vars":{},"prompt":"In which case does diffusion happen fastest?","pool":{"right":[{"text":"a smell spreading through warm air","truth":"true"}],"wrong":[{"text":"a smell spreading through cold air","truth":"false","explain":"Diffusion is faster when it is warm: the particles move faster."},{"text":"ink spreading through cold water","truth":"false","explain":"Diffusion is much faster in gases than in liquids."},{"text":"a solid spreading into another solid","truth":"false","explain":"In solids the particles only vibrate: diffusion is extremely slow."}]},"pick":{"right":1,"wrong":3}},{"id":"ch11-spot","type":"spot_error","level":3,"review":"authored","sources":["kinetic"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"Particles in a gas move fast in all directions.","truth":"true"},{"text":"Heating makes particles move faster.","truth":"true"},{"text":"Diffusion is faster in gases than in liquids.","truth":"true"},{"text":"All matter is made of tiny particles.","truth":"true"}],"wrong":[{"text":"Particles in a solid do not move at all.","truth":"false","explain":"They vibrate in fixed places."},{"text":"When ice melts, its particles get bigger.","truth":"false","explain":"The particles move more; they do not get bigger."}]},"pick":{"right":3,"wrong":1}}]},"12":{"subject":"chemistry","class":"Form 1","lesson_no":12,"language":"en","prerequisites":[9],"skills":[{"id":"ch12","name":"Mixtures and pure substances"}],"note":{"status":"draft","text":"A pure substance is made of only one kind of matter. It is either an element (iron, oxygen, gold) or a compound (water, table salt, sugar, carbon dioxide). It has fixed melting and boiling points.\nA mixture contains two or more substances that are not chemically joined. Each keeps its own properties, and they can be separated by physical methods (filtering, evaporating, distilling…). Examples: air, sea water, soil, tap water, palm wine, a soft drink, concrete, milk.\nThe amounts in a mixture can vary: tea can be weak or strong. The make-up of a pure substance never varies: water is always hydrogen and oxygen in the same ratio.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Is sea water a pure substance or a mixture? How do you know?","steps":["Sea water contains water and dissolved salts.","If you let it evaporate, the salt is left behind: the parts were separated by a physical method.","Its saltiness varies from place to place."],"answer":"A mixture.","checks":[]},"teach":{"cards":[{"id":"chc12-1","status":"draft","idea":"A pure substance is one kind of matter only: an element or a compound. It has fixed melting and boiling points.","vars":{},"example":["Distilled water, table salt, oxygen, gold."],"checks":[],"check":{"ref":"ch12-sort"}},{"id":"chc12-2","status":"draft","idea":"A mixture has two or more substances, not chemically joined, that can be separated by physical methods.","vars":{},"example":["Sea water: evaporate the water and the salt is left."],"checks":[],"check":{"ref":"ch12-which"}},{"id":"chc12-3","status":"draft","idea":"The amounts in a mixture can vary; in a pure substance they are fixed.","vars":{},"example":["Tea can be weak or strong; water is always H₂O."],"checks":[],"check":{"id":"chc12-3-check","type":"mcq","level":1,"review":"authored","sources":["mixtures"],"vars":{},"prompt":"Which sentence is about a mixture?","pool":{"right":[{"text":"Its parts can be present in any amounts.","truth":"true"}],"wrong":[{"text":"It has a fixed boiling point.","truth":"false","explain":"That is a pure substance."},{"text":"It is made of only one kind of matter.","truth":"false","explain":"That is a pure substance."},{"text":"It can only be split by a chemical reaction.","truth":"false","explain":"Mixtures can be separated by physical methods."}]},"pick":{"right":1,"wrong":3}}}]},"questions":[{"id":"ch12-sort","type":"matching","level":1,"review":"authored","sources":["mixtures"],"groups":true,"pick":6,"group_order":["pure substance","mixture"],"prompt":"Sort them: pure substance or mixture?","pool":[{"left":"distilled water","right":"pure substance"},{"left":"table salt (sodium chloride)","right":"pure substance"},{"left":"sugar","right":"pure substance"},{"left":"oxygen","right":"pure substance"},{"left":"iron","right":"pure substance"},{"left":"gold","right":"pure substance"},{"left":"carbon dioxide","right":"pure substance"},{"left":"air","right":"mixture"},{"left":"sea water","right":"mixture"},{"left":"soil","right":"mixture"},{"left":"tap water","right":"mixture"},{"left":"palm wine","right":"mixture"},{"left":"concrete","right":"mixture"},{"left":"milk","right":"mixture"},{"left":"a soft drink","right":"mixture"}]},{"id":"ch12-which","type":"mcq","level":1,"review":"authored","sources":["mixtures"],"vars":{},"prompt":"Which of these is a mixture?","pool":{"right":[{"text":"air","truth":"true"},{"text":"sea water","truth":"true"},{"text":"soil","truth":"true"},{"text":"tap water","truth":"true"},{"text":"palm wine","truth":"true"},{"text":"concrete","truth":"true"},{"text":"milk","truth":"true"},{"text":"a soft drink","truth":"true"}],"wrong":[{"text":"distilled water","truth":"false","explain":"Distilled water is one kind of matter only: a pure substance."},{"text":"table salt (sodium chloride)","truth":"false","explain":"Table salt (sodium chloride) is one kind of matter only: a pure substance."},{"text":"sugar","truth":"false","explain":"Sugar is one kind of matter only: a pure substance."},{"text":"oxygen","truth":"false","explain":"Oxygen is one kind of matter only: a pure substance."},{"text":"iron","truth":"false","explain":"Iron is one kind of matter only: a pure substance."},{"text":"gold","truth":"false","explain":"Gold is one kind of matter only: a pure substance."},{"text":"carbon dioxide","truth":"false","explain":"Carbon dioxide is one kind of matter only: a pure substance."}]},"pick":{"right":1,"wrong":3}},{"id":"ch12-why","type":"mcq","level":2,"review":"authored","sources":["mixtures"],"vars":{},"prompt":"Why is air a mixture and not a pure substance?","pool":{"right":[{"text":"It contains several gases (nitrogen, oxygen, carbon dioxide…) that are not chemically joined.","truth":"true"}],"wrong":[{"text":"Because we cannot see it.","truth":"false","explain":"We cannot see oxygen either, and oxygen is pure."},{"text":"Because it is a gas.","truth":"false","explain":"Oxygen is a gas and it is pure."},{"text":"Because it is everywhere.","truth":"false","explain":"That does not decide; air is several gases mixed together."}]},"pick":{"right":1,"wrong":3}},{"id":"ch12-spot","type":"spot_error","level":3,"review":"authored","sources":["mixtures"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"Sea water is a mixture.","truth":"true"},{"text":"Oxygen is a pure substance.","truth":"true"},{"text":"The parts of a mixture can be separated by physical methods.","truth":"true"},{"text":"Distilled water is pure.","truth":"true"}],"wrong":[{"text":"Tap water is a pure substance.","truth":"false","explain":"Tap water contains dissolved substances: it is a mixture."},{"text":"A mixture has a fixed boiling point.","truth":"false","explain":"Mixtures boil over a range of temperatures."}]},"pick":{"right":3,"wrong":1}}]},"13":{"subject":"chemistry","class":"Form 1","lesson_no":13,"language":"en","prerequisites":[12],"skills":[{"id":"ch13","name":"Types of mixtures"}],"note":{"status":"draft","text":"Mixtures are named by the states of their parts:\n• solid–solid: sand and salt; garri with small stones;\n• solid–liquid: muddy water, salt water;\n• liquid–liquid: palm oil and water (they do not mix: immiscible); ethanol and water (they mix: miscible);\n• gas–liquid: a soft drink (carbon dioxide dissolved in water);\n• gas–gas: air;\n• solid–gas: smoke.\nA solution is a mixture where a solid, liquid or gas (the solute) dissolves completely in a liquid (the solvent): salt water. A suspension has solid pieces that do not dissolve and settle on standing: muddy water.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Palm oil and water are shaken in a bottle, then left to stand. What happens, and what type of mixture is it?","steps":["Both parts are liquids: a liquid–liquid mixture.","On standing, the oil floats on top as a separate layer: they do not mix (immiscible)."],"answer":"A liquid–liquid mixture of immiscible liquids: two layers form.","checks":[]},"teach":{"cards":[{"id":"chc13-1","status":"draft","idea":"A mixture is named by the states of its parts: solid–solid, solid–liquid, liquid–liquid, gas–liquid, gas–gas.","vars":{},"example":["Muddy water: solid–liquid. Air: gas–gas."],"checks":[],"check":{"ref":"ch13-type"}},{"id":"chc13-2","status":"draft","idea":"Liquids that mix are miscible (ethanol and water); liquids that form layers are immiscible (palm oil and water).","vars":{},"example":["Kerosene floats on water in a separate layer: immiscible."],"checks":[],"check":{"ref":"ch13-misc"}},{"id":"chc13-3","status":"draft","idea":"A solution: the solute dissolves completely in the solvent. A suspension: solid pieces that settle on standing.","vars":{},"example":["Salt water is a solution; muddy water is a suspension."],"checks":[],"check":{"id":"chc13-3-check","type":"mcq","level":1,"review":"authored","sources":["mixtures"],"vars":{},"prompt":"In salt water, which is the solvent?","pool":{"right":[{"text":"water","truth":"true"}],"wrong":[{"text":"salt","truth":"false","explain":"The salt is the solute: it dissolves."},{"text":"the cup","truth":"false","explain":"The solvent is the liquid that does the dissolving."},{"text":"the air","truth":"false","explain":"Air is not part of the solution."}]},"pick":{"right":1,"wrong":3}}}]},"questions":[{"id":"ch13-type","type":"mcq","level":1,"review":"authored","sources":["mixtures"],"vars":{"x":{"pick":[{"t":"sand and salt","a":"solid and solid","why":"sand and salt: a mixture of solid and solid."},{"t":"garri mixed with small stones","a":"solid and solid","why":"garri mixed with small stones: a mixture of solid and solid."},{"t":"muddy water","a":"solid and liquid","why":"muddy water: a mixture of solid and liquid."},{"t":"salt water","a":"solid and liquid","why":"salt water: a mixture of solid and liquid."},{"t":"palm oil and water","a":"liquid and liquid","why":"palm oil and water: a mixture of liquid and liquid."},{"t":"ethanol and water","a":"liquid and liquid","why":"ethanol and water: a mixture of liquid and liquid."},{"t":"a soft drink (carbon dioxide in water)","a":"gas and liquid","why":"a soft drink (carbon dioxide in water): a mixture of gas and liquid."},{"t":"air","a":"gas and gas","why":"air: a mixture of gas and gas."},{"t":"smoke (soot in air)","a":"solid and gas","why":"smoke (soot in air): a mixture of solid and gas."}]}},"prompt":"What type of mixture is {x.t}?","correct":"{x.a}","distractors":[{"text":"solid and solid","misconception":"other"},{"text":"solid and liquid","misconception":"other"},{"text":"liquid and liquid","misconception":"other"},{"text":"gas and liquid","misconception":"other"},{"text":"gas and gas","misconception":"other"},{"text":"solid and gas","misconception":"other"}],"misconceptions":[{"id":"other","explain":"Think about the state of each part."}],"solution":["{x.why}","Answer: {answer}."]},{"id":"ch13-misc","type":"matching","level":1,"review":"authored","sources":["mixtures"],"groups":true,"pick":4,"group_order":["miscible (they mix)","immiscible (two layers)"],"prompt":"Do these liquids mix with water, or form layers?","pool":[{"left":"ethanol and water","right":"miscible (they mix)"},{"left":"vinegar and water","right":"miscible (they mix)"},{"left":"milk and water","right":"miscible (they mix)"},{"left":"palm oil and water","right":"immiscible (two layers)"},{"left":"kerosene and water","right":"immiscible (two layers)"},{"left":"petrol and water","right":"immiscible (two layers)"}]},{"id":"ch13-solution","type":"matching","level":2,"review":"authored","sources":["mixtures"],"groups":true,"pick":5,"group_order":["solution","suspension"],"prompt":"Solution (dissolves completely) or suspension (pieces settle)?","pool":[{"left":"salt in water","right":"solution"},{"left":"sugar in tea","right":"solution"},{"left":"copper(II) sulfate in water","right":"solution"},{"left":"muddy water","right":"suspension"},{"left":"chalk dust in water","right":"suspension"},{"left":"sand in water","right":"suspension"}]},{"id":"ch13-spot","type":"spot_error","level":3,"review":"authored","sources":["mixtures"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"Air is a gas–gas mixture.","truth":"true"},{"text":"Palm oil and water are immiscible.","truth":"true"},{"text":"In salt water, salt is the solute.","truth":"true"},{"text":"A soft drink contains a dissolved gas.","truth":"true"}],"wrong":[{"text":"Muddy water is a solution.","truth":"false","explain":"The mud does not dissolve and settles: it is a suspension."},{"text":"Ethanol and water form two layers.","truth":"false","explain":"Ethanol and water are miscible: they mix completely."}]},"pick":{"right":3,"wrong":1}}]},"14":{"subject":"chemistry","class":"Form 1","lesson_no":14,"language":"en","prerequisites":[13],"skills":[{"id":"ch14","name":"Separating solid–solid mixtures"}],"note":{"status":"draft","text":"Solid–solid mixtures are separated by using a difference between the two solids:\n• hand-picking: big pieces of different colour (stones from rice or beans);\n• sieving: different sizes (garri, sand and gravel);\n• magnetic separation: one solid is attracted by a magnet (iron filings from sand);\n• winnowing: one part is much lighter (chaff from rice, maize or beans);\n• sublimation: one solid sublimes on heating (iodine or ammonium chloride from sand or salt);\n• dissolving, filtering and evaporating: one solid dissolves in water and the other does not (salt from sand).","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"How can Bih get clean salt from a mixture of salt and sand?","steps":["Add water and stir: the salt dissolves, the sand does not.","Filter: the sand stays on the filter paper; salt water (the filtrate) passes through.","Evaporate the water from the filtrate: salt crystals are left."],"answer":"Dissolve in water, filter, then evaporate the filtrate.","checks":[]},"teach":{"cards":[{"id":"chc14-1","status":"draft","idea":"Use a difference: size (sieving), colour or size you can see (hand-picking), magnetism (magnet), weight (winnowing).","vars":{},"example":["A magnet pulls iron filings out of sand."],"checks":[],"check":{"ref":"ch14-method"}},{"id":"chc14-2","status":"draft","idea":"If one solid sublimes (iodine, ammonium chloride), heat the mixture and collect it as it cools.","vars":{},"example":["Iodine turns into a purple gas and forms crystals again on a cold surface."],"checks":[],"check":{"ref":"ch14-match"}},{"id":"chc14-3","status":"draft","idea":"If one solid dissolves and the other does not: dissolve, filter, then evaporate.","vars":{},"example":["Salt and sand → salt water + sand → salt crystals."],"checks":[],"check":{"ref":"ch14-steps"}}]},"questions":[{"id":"ch14-method","type":"mcq","level":1,"review":"authored","sources":["separation"],"vars":{"x":{"pick":[{"t":"stones from rice","a":"hand-picking","why":"To separate stones from rice, use hand-picking."},{"t":"fine garri from lumps","a":"sieving","why":"To separate fine garri from lumps, use sieving."},{"t":"iron filings from sand","a":"magnetic separation","why":"To separate iron filings from sand, use magnetic separation."},{"t":"chaff from rice grains","a":"winnowing","why":"To separate chaff from rice grains, use winnowing."},{"t":"iodine from sand","a":"sublimation","why":"To separate iodine from sand, use sublimation."},{"t":"salt from sand","a":"dissolving, filtering and evaporating","why":"To separate salt from sand, use dissolving, filtering and evaporating."}]}},"prompt":"Which method would you use to separate {x.t}?","correct":"{x.a}","distractors":[{"text":"hand-picking","misconception":"other"},{"text":"sieving","misconception":"other"},{"text":"magnetic separation","misconception":"other"},{"text":"winnowing","misconception":"other"},{"text":"sublimation","misconception":"other"},{"text":"dissolving, filtering and evaporating","misconception":"other"}],"misconceptions":[{"id":"other","explain":"That method uses a different difference between the solids."}],"solution":["{x.why}","Answer: {answer}."]},{"id":"ch14-match","type":"matching","level":1,"review":"authored","sources":["separation"],"prompt":"Match each method with how it works.","pick":4,"pool":[{"left":"hand-picking","right":"pick out the unwanted pieces by hand"},{"left":"sieving","right":"shake through a sieve: small pieces fall through, big ones stay"},{"left":"magnetic separation","right":"a magnet pulls out the iron"},{"left":"winnowing","right":"the wind blows away the light chaff"},{"left":"sublimation","right":"heat: one solid turns into a gas and is collected when it cools"},{"left":"dissolving, filtering and evaporating","right":"dissolve one solid, filter out the other, evaporate the water"}]},{"id":"ch14-steps","type":"ordering","level":1,"review":"authored","sources":["separation"],"order":"as_written","vars":{},"prompt":"Put the steps in order to get salt from a mixture of salt and sand.","items":[{"text":"Add water and stir until the salt dissolves."},{"text":"Filter the mixture."},{"text":"Collect the salt water (filtrate) in an evaporating dish."},{"text":"Heat until the water evaporates and salt is left."}]},{"id":"ch14-why","type":"mcq","level":2,"review":"authored","sources":["separation"],"vars":{},"prompt":"Why can a magnet separate iron filings from sand?","pool":{"right":[{"text":"Iron is attracted by a magnet; sand is not.","truth":"true"}],"wrong":[{"text":"Iron is heavier than sand.","truth":"false","explain":"Weight is not used here; magnetism is."},{"text":"Iron dissolves in water.","truth":"false","explain":"Iron does not dissolve in water."},{"text":"Sand is attracted by a magnet.","truth":"false","explain":"Sand is not attracted; iron is."}]},"pick":{"right":1,"wrong":3}},{"id":"ch14-spot","type":"spot_error","level":3,"review":"authored","sources":["separation"],"vars":{},"prompt":"One sentence is wrong. Which one?","pool":{"right":[{"text":"Winnowing removes the light chaff from grain.","truth":"true"},{"text":"Sieving separates pieces of different sizes.","truth":"true"},{"text":"Iodine can be separated from sand by sublimation.","truth":"true"},{"text":"Hand-picking removes stones from beans.","truth":"true"}],"wrong":[{"text":"A magnet separates salt from sand.","truth":"false","explain":"Neither salt nor sand is magnetic: dissolve, filter and evaporate."},{"text":"Sieving separates salt from sugar.","truth":"false","explain":"Their grains are the same size; sieving cannot separate them."}]},"pick":{"right":3,"wrong":1}}]},"15":{"subject":"chemistry","class":"Form 1","lesson_no":15,"language":"en","prerequisites":[13],"skills":[{"id":"ch15","name":"Separating solid–liquid mixtures"}],"note":{"status":"draft","text":"Solid–liquid mixtures:\n• Decantation: let the solid settle, then gently pour off the liquid.\n• Filtration: pour through filter paper in a funnel. The solid left on the paper is the residue; the liquid that passes through is the filtrate.\n• Evaporation: heat a solution until the water has gone and the dissolved solid is left (salt from salt water).\n• Crystallisation: heat the solution until it is strong, then let it cool slowly: crystals form (copper(II) sulfate).\n• Simple distillation: boil the solution, cool the vapour in a condenser and collect the pure liquid (the distillate): pure water from salt water.","checks":[]},"worked_example":{"status":"draft","vars":{},"problem":"Ayuk wants drinking water from salt water and wants to keep the water, not the salt. Which method?","steps":["Evaporation would lose the water into the air.","Simple distillation boils the water, then cools the steam in a condenser so it turns back into liquid water.","The salt stays behind in the flask."],"answer":"Simple distillation.","checks":[]},"teach":{"cards":[{"id":"chc15-1","status":"draft","idea":"Filtration: the solid stays on the filter paper (residue); the liquid passes through (filtrate).","vars":{},"example":["Muddy water → filtrate (clear water) + residue (mud)."],"checks":[],"check":{"ref":"ch15-method"}},{"id":"chc15-2","status":"draft","idea":"Evaporation keeps the dissolved solid; distillation keeps the liquid too.","vars":{},"example":["Salt water: evaporate to get salt; distil to get pure water."],"checks":[],"check":{"ref":"ch15-match"}},{"id":"chc15-3","status":"draft","idea":"Decantation: let the solid settle, then pour off the liquid gently.","vars":{},"example":["Water from a bucket of muddy water left overnight."],"checks":[],"check":{"id":"chc15-3-check","type":"mcq","level":1,"review":"authored","sources":["separation"],"vars":{},"prompt":"In filtration, what is the filtrate?","pool":{"right":[{"text":"the liquid that passes through the filter paper","truth":"true"}],"wrong":[{"text":"the solid left on the filter paper","truth":"false","explain":"That is the residue."},{"text":"the filter paper itself","truth":"false","explain":"The filtrate is the liquid that passes through."},{"text":"the steam from the liquid","truth":"false","explain":"Steam comes from distillation or evaporation, not filtration."}]},"pick":{"right":1,"wrong":3}}}]},"questions":[{"id":"ch15-method","type":"mcq","level":1,"review":"authored","sources":["separation"],"vars":{"x":{"pick":[{"t":"water from settled sand in a bucket","a":"decantation","why":"To separate water from settled sand in a bucket, use decantation."},{"t":"sand from muddy water","a":"filtration","why":"To separate sand from muddy water, use filtration."},{"t":"salt from salt water","a":"evaporation","why":"To separate salt from salt water, use evaporation."},{"t":"copper(II) sulfate crystals from its solution","a":"crystallisation","why":"To separate copper(II) sulfate crystals from its solution, use crystallisation."},{"t":"pure water from salt water","a":"simple distillation","why":"To separate pure water from salt water, use simple distillation."}]}},"prompt":"Which method would you use to get {x.t}?","correct":"{x.a}","distractors":[{"text":"decantation","misconception":"other"},{"text":"filtration","misconception":"other"},{"text":"evaporation","misconception":"other"},{"text":"crystallisation","misconception":"other"},{"text":"simple distillation","misconception":"other"}],"misconceptions":[{"id":"other","explain":"That method gives a different product. Do you want to keep the solid, the liquid, or both?"}],"solution":["{x.why}","Answer: {answer}."]},{"id":"ch15-match","type":"matching","level":1,"review":"authored","sources":["separation"],"prompt":"Match each method with how it works.","pick":4,"pool":[{"left":"decantation","right":"let the solid settle, then pour off the liquid"},{"left":"filtration","right":"pass through filter paper: the solid stays (residue), the liquid passes (filtrate)"},{"left":"evaporation","right":"heat to drive off the liquid and keep the dissolved solid"},{"left":"crystallisation","right":"heat to make a hot, strong solution, then let it co
