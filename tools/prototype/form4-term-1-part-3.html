:[{"id":"l4-9","name":"Disjunctive propositions"}],"note":{"status":"draft","text":"Inclusive OR permits either or both and fails only when both are false. Exclusive OR requires exactly one true alternative. State the intended reading. Denying one alternative of an accepted OR requires the other; affirming one does not exclude the other under inclusive OR.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to distinguish inclusive from exclusive or, evaluate each and infer the remaining alternative when one is denied. Builds on: compound propositions and truth-value evaluation in the conditional lesson. Leads to: accurate translation and later truth tables for logical connectives."},{"heading":"Alternatives joined by or","text":"A disjunction combines propositions as P or Q. In the default formal convention here, or is inclusive: P, Q or both can make it true. Both false makes it false. For an invented Douala club notice, a message can be printed or sent electronically, allowing both methods. Do not silently read an extra not both into that statement."},{"heading":"Exactly one is a different rule","text":"An exclusive disjunction requires one true alternative and one false alternative. A task that says choose drawing or poetry, but not both explicitly uses that rule. Both true then fails, as does both false. Ordinary either…or can depend on context, so these exercises always specify the reading instead of asking pupils to guess the speaker’s intention."},{"heading":"What follows from denying an alternative","text":"If P or Q is accepted and P is false, Q must be true: otherwise both would be false. But if P is true, inclusive OR leaves Q open. This difference matters when translating everyday rules. Neither P nor Q denies both; it is not another spelling of P or Q."}],"key_words":[{"word":"disjunct","meaning":"one component of an or-statement"},{"word":"inclusive or","meaning":"at least one alternative, permitting both"},{"word":"exclusive or","meaning":"exactly one true alternative"},{"word":"neither…nor","meaning":"denial of both alternatives"}],"mistake":{"wrong":"P OR Q and P prove that Q is false.","right":"Inclusive OR allows P and Q together.","why":"Only an added exclusive condition rules out both."}},"worked_example":{"status":"draft","vars":{},"problem":"The fictional notice permits printing or electronic delivery, inclusively. Printing was not used. What must hold if the notice was followed?","steps":["At least one allowed method must have been used.","Printing is ruled out by the additional premise.","Without electronic delivery both alternatives would be false."],"answer":"Electronic delivery was used.","checks":[]},"teach":{"cards":[{"id":"l4-9-c1","status":"draft","idea":"Inclusive OR permits either or both.","vars":{},"example":["A printed and electronic notice can satisfy inclusive OR."],"checks":[],"check":{"ref":"l4-9-inclusive"}},{"id":"l4-9-c2","status":"draft","idea":"Inclusive OR fails only when both claims are false.","vars":{},"example":["At least one true claim is enough; both true is allowed."],"checks":[],"check":{"ref":"l4-9-truth"}},{"id":"l4-9-c3","status":"draft","idea":"Exclusive OR needs different truth values.","vars":{},"example":["Exactly one means both true is forbidden as well as both false."],"checks":[],"check":{"id":"l4-9-exclusive-card","type":"numeric","level":1,"review":"rule","sources":["categorical"],"vars":{"p":{"int":[0,1]},"q":{"int":[0,1]}},"prompt":"Now use exclusive OR: exactly one claim must be true. P = {p}, Q = {q}, with {1} true and {0} false. Give its value.","answer":"p != q ? 1 : 0","misconceptions":[{"id":"inclusive","wrong":"p || q ? 1 : 0","explain":"Inclusive OR accepts both true; this question explicitly forbids that.","when":"p == 1 && q == 1"},{"id":"same","wrong":"p == q ? 1 : 0","explain":"You accepted equal truth values, whereas exactly one requires different values."}],"solution":["Exactly one true means the truth values differ.","For these values the answer is {answer}."]}}]},"questions":[{"id":"l4-9-inclusive","type":"mcq","level":1,"review":"authored","sources":["categorical"],"vars":{"X":{"pick":[{"q":"Read inclusive or: Bih reads or Ayuk writes. Which possibility is allowed?","r":"Either claim, including the possibility that both hold.","w":["Exactly one claim, with both forbidden.","Neither claim must hold for the disjunction to be true.","Both claims must hold together."],"e":["That is exclusive or, not the specified inclusive reading.","Both false makes inclusive OR false.","That is AND; inclusive OR needs at least one."],"y":"Inclusive OR permits either or both."},{"q":"Read inclusive or: the club meets indoors or the club meets online. Which possibility is allowed?","r":"Either claim, including the possibility that both hold.","w":["Exactly one claim, with both forbidden.","Neither claim must hold for the disjunction to be true.","Both claims must hold together."],"e":["That is exclusive or, not the specified inclusive reading.","Both false makes inclusive OR false.","That is AND; inclusive OR needs at least one."],"y":"Inclusive OR permits either or both."},{"q":"Read inclusive or: the notice is printed or the notice is sent electronically. Which possibility is allowed?","r":"Either claim, including the possibility that both hold.","w":["Exactly one claim, with both forbidden.","Neither claim must hold for the disjunction to be true.","Both claims must hold together."],"e":["That is exclusive or, not the specified inclusive reading.","Both false makes inclusive OR false.","That is AND; inclusive OR needs at least one."],"y":"Inclusive OR permits either or both."},{"q":"Read inclusive or: a learner chooses drawing or a learner chooses poetry. Which possibility is allowed?","r":"Either claim, including the possibility that both hold.","w":["Exactly one claim, with both forbidden.","Neither claim must hold for the disjunction to be true.","Both claims must hold together."],"e":["That is exclusive or, not the specified inclusive reading.","Both false makes inclusive OR false.","That is AND; inclusive OR needs at least one."],"y":"Inclusive OR permits either or both."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"l4-9-truth","type":"numeric","level":1,"review":"rule","sources":["categorical"],"vars":{"p":{"int":[0,1]},"q":{"int":[0,1]}},"prompt":"Use inclusive OR. P = {p}, Q = {q}, with {1} true and {0} false. Give the value of P OR Q.","answer":"p || q ? 1 : 0","misconceptions":[{"id":"and","wrong":"p && q ? 1 : 0","explain":"AND needs both; OR accepts either true claim.","when":"p != q"},{"id":"exclusive","wrong":"p != q ? 1 : 0","explain":"That forbids both being true, which is exclusive OR.","when":"p == 1 && q == 1"},{"id":"reverse","wrong":"p || q ? 0 : 1","explain":"That reverses the inclusive-OR value."}],"solution":["Inclusive OR is false only when both claims are false.","For these inputs the value is {answer}."]},{"id":"l4-9-exclusive","type":"numeric","level":2,"review":"rule","sources":["categorical"],"vars":{"p":{"int":[0,1]},"q":{"int":[0,1]}},"prompt":"Now use exclusive OR: exactly one claim must be true. P = {p}, Q = {q}, with {1} true and {0} false. Give its value.","answer":"p != q ? 1 : 0","misconceptions":[{"id":"inclusive","wrong":"p || q ? 1 : 0","explain":"Inclusive OR accepts both true; this question explicitly forbids that.","when":"p == 1 && q == 1"},{"id":"same","wrong":"p == q ? 1 : 0","explain":"You accepted equal truth values, whereas exactly one requires different values."}],"solution":["Exactly one true means the truth values differ.","For these values the answer is {answer}."]},{"id":"l4-9-infer","type":"mcq","level":2,"review":"authored","sources":["categorical"],"vars":{"X":{"pick":[{"q":"Accept “Bih reads or Ayuk writes” inclusively, and also accept that “Bih reads” is false. What follows?","r":"Ayuk writes is true.","w":["Ayuk writes is false.","Bih reads is true.","Neither alternative’s truth is constrained."],"e":["That would make both alternatives false, contrary to the accepted OR.","This contradicts the given denial of that alternative.","Denying one accepted alternative leaves the other required."],"y":"The disjunction requires at least one true claim; the remaining claim must hold."},{"q":"Accept “the club meets indoors or the club meets online” inclusively, and also accept that “the club meets indoors” is false. What follows?","r":"the club meets online is true.","w":["the club meets online is false.","the club meets indoors is true.","Neither alternative’s truth is constrained."],"e":["That would make both alternatives false, contrary to the accepted OR.","This contradicts the given denial of that alternative.","Denying one accepted alternative leaves the other required."],"y":"The disjunction requires at least one true claim; the remaining claim must hold."},{"q":"Accept “the notice is printed or the notice is sent electronically” inclusively, and also accept that “the notice is printed” is false. What follows?","r":"the notice is sent electronically is true.","w":["the notice is sent electronically is false.","the notice is printed is true.","Neither alternative’s truth is constrained."],"e":["That would make both alternatives false, contrary to the accepted OR.","This contradicts the given denial of that alternative.","Denying one accepted alternative leaves the other required."],"y":"The disjunction requires at least one true claim; the remaining claim must hold."},{"q":"Accept “a learner chooses drawing or a learner chooses poetry” inclusively, and also accept that “a learner chooses drawing” is false. What follows?","r":"a learner chooses poetry is true.","w":["a learner chooses poetry is false.","a learner chooses drawing is true.","Neither alternative’s truth is constrained."],"e":["That would make both alternatives false, contrary to the accepted OR.","This contradicts the given denial of that alternative.","Denying one accepted alternative leaves the other required."],"y":"The disjunction requires at least one true claim; the remaining claim must hold."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"l4-9-repair","type":"spot_error","level":3,"review":"authored","sources":["categorical"],"prompt":"Find the incorrect claim, then read the reason for the correction.","pool":{"right":[{"text":"Inclusive OR allows both alternatives to be true.","truth":"true","explain":"This is a correct rule: Inclusive OR allows both alternatives to be true. Look for a claim that breaks a rule taught in Learn."},{"text":"Exclusive OR requires exactly one true alternative.","truth":"true","explain":"This is a correct rule: Exclusive OR requires exactly one true alternative. Look for a claim that breaks a rule taught in Learn."},{"text":"Inclusive OR is false when both alternatives are false.","truth":"true","explain":"This is a correct rule: Inclusive OR is false when both alternatives are false. Look for a claim that breaks a rule taught in Learn."},{"text":"If an accepted OR has one false alternative, the other must be true.","truth":"true","explain":"This is a correct rule: If an accepted OR has one false alternative, the other must be true. Look for a claim that breaks a rule taught in Learn."}],"wrong":[{"text":"Either in ordinary speech always settles the inclusive/exclusive reading without context.","truth":"false","explain":"Ordinary wording can be ambiguous; state the intended convention."},{"text":"P OR Q and P alone entail not Q under inclusive OR.","truth":"false","explain":"Both may be true, so P does not exclude Q."},{"text":"Inclusive OR requires both claims to be true.","truth":"false","explain":"That is AND; OR requires at least one."},{"text":"Neither P nor Q means inclusive P OR Q.","truth":"false","explain":"Neither denies both alternatives rather than accepting at least one."}]},"pick":{"right":3,"wrong":1}}]},"10":{"subject":"logic","class":"Form 4","lesson_no":10,"language":"en","prerequisites":[4,6,8,9],"skills":[{"id":"l4-10","name":"Other propositions and translation into standard form"}],"note":{"status":"draft","text":"Translate only by checking the direction of restriction; translate not all as some…not. Treat singular claims under an explicit convention and clarify indefinite scope. Preserve exceptions and both parts of compound claims rather than forcing every sentence into one blanket categorical statement.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to translate only and not all accurately, recognise singular and indefinite cases, and preserve an exception. Builds on: sentence parts, categorical forms, conditionals and disjunctions. Leads to: Term Two’s translation into symbolic logic and later argument analysis."},{"heading":"Preserve scope, not word order","text":"Only club members are voters means All voters are club members: being a member is required for voting in the fictional rule. It does not say every member votes. Not all members are voters means Some members are not voters. Identify who is restricted, then choose subject, predicate, quantifier and quality. An accurate rewrite preserves meaning even when it changes word order."},{"heading":"Singular and indefinite claims","text":"Bih is a member is singular: it concerns an individual. One explicit standardisation treats S as persons identical with Bih, giving All persons identical with Bih are members; assume the name denotes a person. Teachers should confirm their course’s singular convention. Members are readers, without an explicit quantifier, is indefinite in the traditional classroom sense. Ask whether context means all or some; do not guess from the plural alone."},{"heading":"Do not erase an exception","text":"For this explicit rule, every library book except damaged library books is loanable, and none of the damaged books is loanable. Preserve both parts: All undamaged library books are loanable items; No damaged library books are loanable items. One blanket All library books are loanable items would erase the exception. Other compound claims may require more than one categorical statement, or the conditional/disjunctive forms just studied."}],"key_words":[{"word":"exclusive categorical wording","meaning":"only restricts one class to another; distinct from exclusive OR"},{"word":"singular","meaning":"concerning a specified individual"},{"word":"indefinite","meaning":"lacking an explicit quantifier in this school terminology"},{"word":"exceptive","meaning":"expressing an exception that must be preserved"}],"mistake":{"wrong":"Only members are voters means every member votes.","right":"It means every voter is a member.","why":"Only makes membership necessary for being a voter, without asserting that all members vote."}},"worked_example":{"status":"draft","vars":{},"problem":"Translate Only badge holders are club voters.","steps":["The restricted group is club voters.","Every club voter must be within the badge-holder class.","The claim leaves open whether all badge holders vote."],"answer":"All club voters are badge holders.","checks":[]},"teach":{"cards":[{"id":"l4-10-c1","status":"draft","idea":"Only S are P translates as All P are S.","vars":{},"example":["Only members are voters: All voters are members."],"checks":[],"check":{"ref":"l4-10-only"}},{"id":"l4-10-c2","status":"draft","idea":"A singular claim specifies an individual.","vars":{},"example":["Bih is a member differs from an explicit all-members claim."],"checks":[],"check":{"ref":"l4-10-singular"}},{"id":"l4-10-c3","status":"draft","idea":"Not all means at least one exception, not no members.","vars":{},"example":["Not all S are P: Some S are not P."],"checks":[],"check":{"id":"l4-10-not-all-card","type":"mcq","level":1,"review":"authored","sources":["categorical"],"vars":{"X":{"pick":[{"q":"Preserve the meaning of Not all club members are badge holders.","r":"Some club members are not badge holders.","w":["No club members are badge holders.","All club members are badge holders.","Some club members are badge holders."],"e":["No excludes every shared member, stronger than not all.","That asserts what the original denies.","That affirms membership but does not supply the required exception."],"y":"Denying universal inclusion requires an existing S outside P: O."},{"q":"Preserve the meaning of Not all library books are loanable items.","r":"Some library books are not loanable items.","w":["No library books are loanable items.","All library books are loanable items.","Some library books are loanable items."],"e":["No excludes every shared member, stronger than not all.","That asserts what the original denies.","That affirms membership but does not supply the required exception."],"y":"Denying universal inclusion requires an existing S outside P: O."},{"q":"Preserve the meaning of Not all school gardens are cultivated areas.","r":"Some school gardens are not cultivated areas.","w":["No school gardens are cultivated areas.","All school gardens are cultivated areas.","Some school gardens are cultivated areas."],"e":["No excludes every shared member, stronger than not all.","That asserts what the original denies.","That affirms membership but does not supply the required exception."],"y":"Denying universal inclusion requires an existing S outside P: O."},{"q":"Preserve the meaning of Not all reading rooms are quiet places.","r":"Some reading rooms are not quiet places.","w":["No reading rooms are quiet places.","All reading rooms are quiet places.","Some reading rooms are quiet places."],"e":["No excludes every shared member, stronger than not all.","That asserts what the original denies.","That affirms membership but does not supply the required exception."],"y":"Denying universal inclusion requires an existing S outside P: O."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}}]},"questions":[{"id":"l4-10-only","type":"mcq","level":1,"review":"authored","sources":["categorical"],"vars":{"X":{"pick":[{"q":"Translate Only club members are badge holders into standard form.","r":"All badge holders are club members.","w":["All club members are badge holders.","No badge holders are club members.","Some club members are not badge holders."],"e":["That reverses the restriction: only S permits P only within S.","That denies the membership required by only.","The original does not assert an existing counterexample within S."],"y":"Only restricts who may belong to the predicate class: every P must be S."},{"q":"Translate Only library books are loanable items into standard form.","r":"All loanable items are library books.","w":["All library books are loanable items.","No loanable items are library books.","Some library books are not loanable items."],"e":["That reverses the restriction: only S permits P only within S.","That denies the membership required by only.","The original does not assert an existing counterexample within S."],"y":"Only restricts who may belong to the predic merely some.","w":["Always force A because every plural noun means all.","Always force I because all indefinite sentences mean some but not all.","Treat it as E solely because the quantifier is missing."],"e":["Plural wording alone does not settle universal scope.","That invents both a fixed quantifier and a not-all restriction.","A missing quantifier does not establish universal denial."],"y":"An indefinite statement needs contextual scope; do not manufacture certainty from missing information."},{"q":"The isolated sentence “Reading rooms are quiet places” gives no explicit quantifier. What should you do before fixing A or I?","r":"Ask whether the context intends every subject member or merely some.","w":["Always force A because every plural noun means all.","Always force I because all indefinite sentences mean some but not all.","Treat it as E solely because the quantifier is missing."],"e":["Plural wording alone does not settle universal scope.","That invents both a fixed quantifier and a not-all restriction.","A missing quantifier does not establish universal denial."],"y":"An indefinite statement needs contextual scope; do not manufacture certainty from missing information."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]},{"id":"l4-10-repair","type":"spot_error","level":3,"review":"authored","sources":["categorical"],"prompt":"Find the incorrect claim, then read the reason for the correction.","pool":{"right":[{"text":"Only S are P restricts every P to S.","truth":"true","explain":"This is a correct rule: Only S are P restricts every P to S. Look for a claim that breaks a rule taught in Learn."},{"text":"Not all S are P has O meaning.","truth":"true","explain":"This is a correct rule: Not all S are P has O meaning. Look for a claim that breaks a rule taught in Learn."},{"text":"A singular proposition concerns a specified individual.","truth":"true","explain":"This is a correct rule: A singular proposition concerns a specified individual. Look for a claim that breaks a rule taught in Learn."},{"text":"An unclear quantifier may need contextual clarification.","truth":"true","explain":"This is a correct rule: An unclear quantifier may need contextual clarification. Look for a claim that breaks a rule taught in Learn."}],"wrong":[{"text":"Only S are P always translates as All S are P.","truth":"false","explain":"Preserve the restriction: All P are S, not the reverse."},{"text":"An indefinite plural sentence always explicitly asserts all.","truth":"false","explain":"The intended scope needs context; a plural noun is not an explicit all."},{"text":"All S except Q are P is fully preserved by simply writing All S are P.","truth":"false","explain":"That discards the exception. The permitted S and the excluded Q need separate treatment."},{"text":"A single A/E/I/O sentence always preserves every compound ordinary-language claim.","truth":"false","explain":"Some claims need more than one categorical statement, or a compound symbolic form."}]},"pick":{"right":3,"wrong":1}},{"id":"l4-10-exceptions","type":"mcq","level":3,"review":"authored","sources":["categorical"],"vars":{"X":{"pick":[{"q":"A fictional rule says: All club members outside the excluded group are voters, and none of the excluded club members are voters. Which rewrite preserves both parts?","r":"All non-excluded club members are voters; no excluded club members are voters.","w":["All club members are voters.","No club members are voters.","All voters are club members."],"e":["This erases the stated excluded group.","This erases the permitted non-excluded group.","This reverses class inclusion and says nothing about the exception."],"y":"Keep both the affirmative rule for the non-excluded class and the negative rule for the excluded class."},{"q":"A fictional rule says: All library books outside the excluded group are loanable items, and none of the excluded library books are loanable items. Which rewrite preserves both parts?","r":"All non-excluded library books are loanable items; no excluded library books are loanable items.","w":["All library books are loanable items.","No library books are loanable items.","All loanable items are library books."],"e":["This erases the stated excluded group.","This erases the permitted non-excluded group.","This reverses class inclusion and says nothing about the exception."],"y":"Keep both the affirmative rule for the non-excluded class and the negative rule for the excluded class."},{"q":"A fictional rule says: All school rooms outside the excluded group are available spaces, and none of the excluded school rooms are available spaces. Which rewrite preserves both parts?","r":"All non-excluded school rooms are available spaces; no excluded school rooms are available spaces.","w":["All school rooms are available spaces.","No school rooms are available spaces.","All available spaces are school rooms."],"e":["This erases the stated excluded group.","This erases the permitted non-excluded group.","This reverses class inclusion and says nothing about the exception."],"y":"Keep both the affirmative rule for the non-excluded class and the negative rule for the excluded class."},{"q":"A fictional rule says: All submitted forms outside the excluded group are processable items, and none of the excluded submitted forms are processable items. Which rewrite preserves both parts?","r":"All non-excluded submitted forms are processable items; no excluded submitted forms are processable items.","w":["All submitted forms are processable items.","No submitted forms are processable items.","All processable items are submitted forms."],"e":["This erases the stated excluded group.","This erases the permitted non-excluded group.","This reverses class inclusion and says nothing about the exception."],"y":"Keep both the affirmative rule for the non-excluded class and the negative rule for the excluded class."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is “{answer}”."]}]}},"f4-maths":{"2":{"subject":"mathematics","class":"Form 4","lesson_no":2,"language":"en","prerequisites":[],"skills":[{"id":"m4-2","name":"Expand products of brackets, including the special products"}],"note":{"status":"draft","text":"To expand a product of brackets, multiply every term in one bracket by every term in the other, then collect like terms.\n• (x + 3)(x + 5) = x² + 5x + 3x + 15 = x² + 8x + 15.\n• (2x + 3)(x − 4) = 2x² − 8x + 3x − 12 = 2x² − 5x − 12.\nThree special products are worth knowing by heart:\n• (a + b)² = a² + 2ab + b²\n• (a − b)² = a² − 2ab + b²\n• (a + b)(a − b) = a² − b²\nA common mistake is (x + 3)² = x² + 9: the middle term 2 × 3 × x = 6x is missing.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to expand any product of two brackets and spot the three special products on sight.\nBuilds on: Form Three expansion of a(b + c) and of (x + a)(x + b); collecting like terms.\nLeads to: factorisation (the next lessons undo expansion) and solving quadratic equations."},{"heading":"Every term times every term","text":"To expand ({poly([2, 'x'], [3, ''])})({poly([1, 'x'], [-4, ''])}), multiply each term of the first bracket by each term of the second.\n• {mono(2, 'x')} × x = {mono(2, 'x²')}\n• {mono(2, 'x')} × {br(-4)} = {mono(-8, 'x')}\n• {3} × x = {mono(3, 'x')}\n• {3} × {br(-4)} = {-12}\nTwo terms times two terms always make four products. Then collect the like terms: {mono(-8, 'x')} + {mono(3, 'x')} = {mono(-5, 'x')}, so the answer is {quad(2, -5, -12)}."},{"heading":"Three special products","text":"Some products appear so often that it is worth knowing them by heart.\n• (a + b)² = a² + {2}ab + b²: for example ({poly([1, 'x'], [5, ''])})² = {quad(1, 10, 25)}.\n• (a − b)² = a² − {2}ab + b²: for example ({poly([1, 'x'], [-3, ''])})² = {quad(1, -6, 9)}.\n• (a + b)(a − b) = a² − b²: for example {lin2(1, 7, 1, -7)} = {quad(1, 0, -49)}.\nIn the last one the middle terms cancel. This is called the difference of two squares, and the next lesson uses it backwards."}],"key_words":[{"word":"expand","meaning":"remove the brackets by multiplying every term inside"},{"word":"product","meaning":"the result of a multiplication"},{"word":"perfect square","meaning":"a bracket times itself, such as ({poly([1, 'x'], [5, ''])})²"},{"word":"difference of two squares","meaning":"an expression a² − b², which equals (a + b)(a − b)"}],"examples":["{lin2(1, 2, 1, 6)} = {quad(1, 8, 12)}","({poly([3, 'x'], [-1, ''])})² = {quad(9, -6, 1)}","{lin2(2, 5, 2, -5)} = {quad(4, 0, -25)}"],"mistake":{"wrong":"({poly([1, 'x'], [3, ''])})² = {quad(1, 0, 9)}","right":"({poly([1, 'x'], [3, ''])})² = {quad(1, 6, 9)}","why":"Squaring a bracket means multiplying it by itself. The two middle products {mono(3, 'x')} + {mono(3, 'x')} give {mono(6, 'x')}."}},"worked_example":{"status":"draft","vars":{"a":2,"b":3,"c":1,"d":-4},"problem":"Expand and simplify {lin2(a, b, c, d)}.","steps":["Multiply each term of the first bracket by each term of the second.","{mono(a, 'x')} × {mono(c, 'x')} = {mono(a * c, 'x²')} and {mono(a, 'x')} × {br(d)} = {mono(a * d, 'x')}.","{b} × {mono(c, 'x')} = {mono(b * c, 'x')} and {b} × {br(d)} = {b * d}.","Collect the x terms: {a * d} + {b * c} = {a * d + b * c}."],"answer":"{quad(a * c, a * d + b * c, b * d)}","checks":["a * c == 2","a * d + b * c == -5","b * d == -12"]},"teach":{"cards":[{"id":"c4m2-1","status":"draft","idea":"Every term in one bracket multiplies every term in the other. Two terms times two terms make four products.","vars":{},"example":["{lin2(1, 3, 1, 5)} = {poly([1, 'x²'], [5, 'x'], [3, 'x'], [15, ''])} = {quad(1, 8, 15)}"],"checks":[],"check":{"ref":"m4-2-xpq"}},{"id":"c4m2-2","status":"draft","idea":"A square of a bracket is the bracket times itself, so it has a middle term: twice the product of the two terms.","vars":{},"example":["{lin2(1, 3, 1, 3)} = {quad(1, 6, 9)}, not {quad(1, 0, 9)}"],"checks":[],"check":{"ref":"m4-2-square"}},{"id":"c4m2-3","status":"draft","idea":"When the brackets differ only by a sign, the middle terms cancel: the answer is a difference of two squares.","vars":{},"example":["{lin2(1, 4, 1, -4)} = {quad(1, 4, 0)} − {mono(4, 'x')} − {16} = {quad(1, 0, -16)}"],"checks":[],"check":{"id":"m4-2-dos-card","type":"mcq","level":1,"review":"rule","sources":["algebra-expand"],"vars":{"p":{"int":[1,6]},"q":{"int":[1,9]}},"prompt":"Expand {lin2(p, q, p, -q)}.","correct":"{quad(p * p, 0, -q * q)}","distractors":[{"text":"{quad(p * p, 0, q * q)}","misconception":"plus"},{"text":"{quad(p * p, -2 * p * q, -q * q)}","misconception":"mid"},{"text":"{quad(p, 0, -q * q)}","misconception":"nosq"}],"misconceptions":[{"id":"plus","explain":"The last product is {q} × {br(-q)}: a positive times a negative is negative, so {-q * q}."},{"id":"mid","explain":"The middle products are {mono(-p * q, 'x')} and {mono(p * q, 'x')}: they cancel to zero."},{"id":"nosq","explain":"{mono(p, 'x')} × {mono(p, 'x')} = {mono(p * p, 'x²')}: the {p} is squared too."}],"solution":["The middle products are {mono(-p * q, 'x')} and {mono(p * q, 'x')}: they cancel.","First: {mono(p, 'x')} × {mono(p, 'x')} = {mono(p * p, 'x²')}. Last: {q} × {br(-q)} = {-q * q}.","So the answer is {answer}."],"where":["p != 1"]}}]},"questions":[{"id":"m4-2-xpq","type":"mcq","level":1,"review":"rule","sources":["algebra-expand"],"vars":{"p":{"int":[-9,9]},"q":{"int":[-9,9]}},"prompt":"Expand {lin2(1, p, 1, q)}.","correct":"{quad(1, p + q, p * q)}","distractors":[{"text":"{quad(1, 0, p * q)}","misconception":"nomid"},{"text":"{quad(1, p + q, p + q)}","misconception":"addend"},{"text":"{quad(1, p * q, p + q)}","misconception":"swap"}],"misconceptions":[{"id":"nomid","explain":"Two products are missing: x × {br(q)} and {br(p)} × x. Together they give {mono(p + q, 'x')}."},{"id":"addend","explain":"The last term is a product: {br(p)} × {br(q)} = {p * q}, not a sum."},{"id":"swap","explain":"The x term comes from adding: {p} + {br(q)} = {p + q}. The number term comes from multiplying: {p * q}."}],"solution":["x × x = x²; x × {br(q)} and {br(p)} × x give {p} + {br(q)} = {p + q} lots of x.","{br(p)} × {br(q)} = {p * q}.","So the answer is {answer}."],"where":["p != 0 && q != 0","p + q != 0","p * q != p + q","p != q"]},{"id":"m4-2-square","type":"numeric","level":1,"review":"rule","sources":["algebra-expand"],"vars":{"a":{"int":[-9,9]}},"prompt":"Expand {lin2(1, a, 1, a)}, that is ({poly([1, 'x'], [a, ''])})². What is the coefficient of x?","answer":"2 * a","misconceptions":[{"id":"once","wrong":"a","explain":"There are two middle products, x × {br(a)} and {br(a)} × x: {a} + {br(a)} = {2 * a}."},{"id":"square","wrong":"a * a","explain":"{a * a} is the number term ({br(a)} × {br(a)}). The x term is {2 * a}x."}],"solution":["({poly([1, 'x'], [a, ''])})² = ({poly([1, 'x'], [a, ''])})({poly([1, 'x'], [a, ''])}).","The two middle products are {br(a)} × x and x × {br(a)}: together {mono(2 * a, 'x')}.","So the coefficient of x is {answer}."],"where":["a != 0 && a != 2 && a != -2","a * a != 2 * a"],"signed":true},{"id":"m4-2-pair","type":"mcq","level":2,"review":"rule","sources":["algebra-expand"],"vars":{"a":{"int":[2,5]},"b":{"int":[1,9]},"c":{"int":[1,4]},"d":{"int":[-9,9]}},"prompt":"Expand and simplify {lin2(a, b, c, d)}.","correct":"{quad(a * c, a * d + b * c, b * d)}","distractors":[{"text":"{quad(a * c, a * b + c * d, b * d)}","misconception":"cross"},{"text":"{quad(a * c, 0, b * d)}","misconception":"nomid"},{"text":"{quad(a + c, a * d + b * c, b + d)}","misconception":"add"}],"misconceptions":[{"id":"cross","explain":"Multiply a term of the first bracket by a term of the second: {mono(a, 'x')} × {br(d)} and {b} × {mono(c, 'x')}."},{"id":"nomid","explain":"The two middle products are missing: {mono(a * d, 'x')} and {mono(b * c, 'x')}."},{"id":"add","explain":"Terms are multiplied, not added: {mono(a, 'x')} × {mono(c, 'x')} = {mono(a * c, 'x²')} and {b} × {br(d)} = {b * d}."}],"solution":["{mono(a, 'x')} × {mono(c, 'x')} = {mono(a * c, 'x²')}.","Middle: {mono(a, 'x')} × {br(d)} + {b} × {mono(c, 'x')} = {mono(a * d, 'x')} + {mono(b * c, 'x')} = {mono(a * d + b * c, 'x')}.","Last: {b} × {br(d)} = {b * d}.","So the answer is {answer}."],"where":["d != 0","a * d + b * c != 0","a * b + c * d != a * d + b * c","a + c != a * c","b + d != b * d"]},{"id":"m4-2-dos","type":"mcq","level":2,"review":"rule","sources":["algebra-expand"],"vars":{"p":{"int":[1,6]},"q":{"int":[1,9]}},"prompt":"Expand {lin2(p, q, p, -q)}.","correct":"{quad(p * p, 0, -q * q)}","distractors":[{"text":"{quad(p * p, 0, q * q)}","misconception":"plus"},{"text":"{quad(p * p, -2 * p * q, -q * q)}","misconception":"mid"},{"text":"{quad(p, 0, -q * q)}","misconception":"nosq"}],"misconceptions":[{"id":"plus","explain":"The last product is {q} × {br(-q)}: a positive times a negative is negative, so {-q * q}."},{"id":"mid","explain":"The middle products are {mono(-p * q, 'x')} and {mono(p * q, 'x')}: they cancel to zero."},{"id":"nosq","explain":"{mono(p, 'x')} × {mono(p, 'x')} = {mono(p * p, 'x²')}: the {p} is squared too."}],"solution":["The middle products are {mono(-p * q, 'x')} and {mono(p * q, 'x')}: they cancel.","First: {mono(p, 'x')} × {mono(p, 'x')} = {mono(p * p, 'x²')}. Last: {q} × {br(-q)} = {-q * q}.","So the answer is {answer}."],"where":["p != 1"]},{"id":"m4-2-three","type":"numeric","level":3,"review":"rule","sources":["algebra-expand"],"vars":{"a":{"int":[-6,6]},"b":{"int":[-6,6]},"c":{"int":[-9,9]}},"prompt":"Expand ({poly([1, 'x'], [a, ''])})({quad(1, b, c)}). What is the coefficient of x?","answer":"c + a * b","misconceptions":[{"id":"onlyc","wrong":"c","explain":"There is a second x term: {br(a)} × {mono(b, 'x')} = {mono(a * b, 'x')}."},{"id":"onlyab","wrong":"a * b","explain":"There is a second x term: x × {br(c)} = {mono(c, 'x')}."},{"id":"x2","wrong":"b + a","explain":"{b} + {br(a)} is the coefficient of x². For x add {c} and {a} × {br(b)}."}],"solution":["The x terms come from x × {br(c)} and {br(a)} × {mono(b, 'x')}.","That gives {mono(c, 'x')} and {mono(a * b, 'x')}.","So the coefficient of x is {c} + {br(a * b)} = {answer}."],"where":["a != 0 && b != 0 && c != 0","c + a * b != 0","a * b != c + a * b","b + a != c + a * b","c != c + a * b"],"signed":true}]},"3":{"subject":"mathematics","class":"Form 4","lesson_no":3,"language":"en","prerequisites":[2],"skills":[{"id":"m4-3","name":"Factorise by grouping and as a difference of two squares"}],"note":{"status":"draft","text":"Factorising is expanding backwards: write an expression as a product.\n• Grouping, for four terms: pair them, take a common factor from each pair, then take out the common bracket. ax + ay + bx + by = a(x + y) + b(x + y) = (a + b)(x + y).\n• Difference of two squares: a² − b² = (a + b)(a − b). For example x² − 49 = (x + 7)(x − 7) and 9x² − 4 = (3x + 2)(3x − 2).\nAlways take out a common number factor first: 2x² − 18 = 2(x² − 9) = 2(x + 3)(x − 3).\nA sum of two squares, such as x² + 9, does not factorise this way.\nCheck any factorisation by expanding it again.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to factorise four-term expressions by grouping and any difference of two squares, taking out common factors first.\nBuilds on: Lesson {2} (expansion and the product (a + b)(a − b)); Form Three common factors.\nLeads to: factorising quadratic trinomials and solving quadratic equations by factorisation."},{"heading":"Grouping four terms","text":"Some expressions have four terms and no factor common to all of them, such as xy + {mono(3, 'x')} + {mono(5, 'y')} + {15}.\n• Pair the terms: (xy + {mono(3, 'x')}) + ({mono(5, 'y')} + {15}).\n• Take a factor out of each pair: x(y + {3}) + {5}(y + {3}).\n• Both parts now share the bracket (y + {3}). Take it out: (x + {5})(y + {3}).\nIf the brackets do not match, try pairing the terms differently. Expand your answer to check it."},{"heading":"The difference of two squares","text":"Lesson {2} showed that (a + b)(a − b) = a² − b². Read backwards, this factorises any difference of two squares.\n• {quad(1, 0, -64)} = x² − {8}² = {lin2(1, 8, 1, -8)}\n• {quad(9, 0, -4)} = ({mono(3, 'x')})² − {2}² = {lin2(3, 2, 3, -2)}\nAlways look for a common factor first: {quad(5, 0, -45)} = {5}({quad(1, 0, -9)}) = {5}{lin2(1, 3, 1, -3)}.\nA sum such as {quad(1, 0, 9)} has no factors of this kind."}],"key_words":[{"word":"factorise","meaning":"write an expression as a product of factors"},{"word":"common factor","meaning":"a number or letter that divides every term"},{"word":"grouping","meaning":"pairing terms so that each pair has a common factor and the pairs share a bracket"},{"word":"factorise completely","meaning":"go on until no factor can be split further"}],"examples":["{quad(1, 0, -100)} = {lin2(1, 10, 1, -10)}","{mono(1, 'ab')} + {mono(4, 'a')} + {mono(2, 'b')} + {8} = (a + {2})(b + {4})","{quad(2, 0, -50)} = {2}{lin2(1, 5, 1, -5)}"],"mistake":{"wrong":"{quad(1, 0, -25)} = ({poly([1, 'x'], [-5, ''])})²","right":"{quad(1, 0, -25)} = {lin2(1, 5, 1, -5)}","why":"({poly([1, 'x'], [-5, ''])})² expands to {quad(1, -10, 25)}. A difference of two squares needs one plus and one minus bracket."}},"worked_example":{"status":"draft","vars":{"p":3,"q":5},"problem":"Factorise xy + {p}x + {q}y + {p * q}.","steps":["Group the terms in pairs: (xy + {mono(p, 'x')}) + ({mono(q, 'y')} + {p * q}).","Take x out of the first pair and {q} out of the second: x({poly([1, 'y'], [p, ''])}) + {q}({poly([1, 'y'], [p, ''])}).","The bracket ({poly([1, 'y'], [p, ''])}) is common to both: take it out.","Check: ({poly([1, 'x'], [q, ''])})({poly([1, 'y'], [p, ''])}) = xy + {mono(p, 'x')} + {mono(q, 'y')} + {p * q}."],"answer":"({poly([1, 'x'], [q, ''])})({poly([1, 'y'], [p, ''])})","checks":["p * q == 15"]},"teach":{"cards":[{"id":"c4m3-1","status":"draft","idea":"Grouping: pair the four terms, take a common factor out of each pair, then take out the bracket they share.","vars":{},"example":["{mono(1, 'ax')} + {mono(1, 'ay')} + {mono(2, 'x')} + {mono(2, 'y')} = a(x + y) + {2}(x + y) = (a + {2})(x + y)"],"checks":[],"check":{"ref":"m4-3-group"}},{"id":"c4m3-2","status":"draft","idea":"A difference of two squares factorises as (first + second)(first − second), where first and second are the square roots.","vars":{},"example":["{quad(1, 0, -36)} = {lin2(1, 6, 1, -6)}","{quad(25, 0, -1)} = {lin2(5, 1, 5, -1)}"],"checks":[],"check":{"ref":"m4-3-dos"}},{"id":"c4m3-3","status":"draft","idea":"Look for a common number factor first. What is left is often a difference of two squares.","vars":{},"example":["{quad(3, 0, -12)} = {3}({quad(1, 0, -4)}) = {3}{lin2(1, 2, 1, -2)}"],"checks":[],"check":{"id":"m4-3-common-card","type":"mcq","level":1,"review":"rule","sources":["algebra-factorise"],"vars":{"k":{"int":[2,7]},"a":{"int":[2,9]}},"prompt":"Factorise completely {quad(k, 0, -k * a * a)}.","correct":"{k}{lin2(1, a, 1, -a)}","distractors":[{"text":"{k}({quad(1, 0, -a * a)})","misconception":"stop"},{"text":"{lin2(k, a, 1, -a)}","misconception":"onebr"},{"text":"{k}({poly([1, 'x'], [-a, ''])})²","misconception":"square"}],"misconceptions":[{"id":"stop","explain":"'Completely' means keep going: x² − {a * a} still factorises as {lin2(1, a, 1, -a)}."},{"id":"onebr","explain":"Expand it: {lin2(k, a, 1, -a)} has a middle term. Take {k} out in front instead."},{"id":"square","explain":"{k}({poly([1, 'x'], [-a, ''])})² = {k}({quad(1, -2 * a, a * a)}): that has a middle term."}],"solution":["Take out the common factor {k}: {k}({quad(1, 0, -a * a)}).","x² − {a * a} is a difference of two squares: {lin2(1, a, 1, -a)}.","So the answer is {answer}."]}}]},"questions":[{"id":"m4-3-dos","type":"mcq","level":1,"review":"rule","sources":["algebra-factorise"],"vars":{"a":{"int":[2,12]}},"prompt":"Factorise {quad(1, 0, -a * a)}.","correct":"{lin2(1, a, 1, -a)}","distractors":[{"text":"({poly([1, 'x'], [-a, ''])})²","misconception":"square"},{"text":"{lin2(1, a * a, 1, -1)}","misconception":"noroot"},{"text":"x({poly([1, 'x'], [-a * a, ''])})","misconception":"commonx"}],"misconceptions":[{"id":"square","explain":"({poly([1, 'x'], [-a, ''])})² = {quad(1, -2 * a, a * a)}: it has a middle term and a plus sign at the end."},{"id":"noroot","explain":"Use the square root of {a * a}, which is {a}: {lin2(1, a, 1, -a)}."},{"id":"commonx","explain":"{a * a} has no x, so x is not a common factor."}],"solution":["{a * a} = {a}², so {quad(1, 0, -a * a)} = x² − {a}².","a² − b² = (a + b)(a − b).","So the answer is {answer}."]},{"id":"m4-3-group","type":"mcq","level":1,"review":"rule","sources":["algebra-factorise"],"vars":{"p":{"int":[2,9]},"q":{"int":[2,9]}},"prompt":"Factorise {mono(1, 'ax')} + {mono(p, 'a')} + {mono(q, 'x')} + {p * q}.","correct":"({poly([1, 'a'], [q, ''])})({poly([1, 'x'], [p, ''])})","distractors":[{"text":"({poly([1, 'a'], [p, ''])})({poly([1, 'x'], [q, ''])})","misconception":"swap"},{"text":"a({poly([1, 'x'], [p, ''])}) + {q}","misconception":"half"},{"text":"({poly([1, 'a'], [q, ''])})({poly([1, 'x'], [p * q, ''])})","misconception":"keep"}],"misconceptions":[{"id":"swap","explain":"Expand it: (a + {p})(x + {q}) gives {mono(q, 'a')} + {mono(p, 'x')}, not {mono(p, 'a')} + {mono(q, 'x')}."},{"id":"half","explain":"That is only part way: {q}(x + {p}) also has the bracket (x + {p}), so take it out of both."},{"id":"keep","explain":"Taking {q} out of {mono(q, 'x')} + {p * q} leaves x + {p}, not x + {p * q}."}],"solution":["Group: a(x + {p}) + {q}(x + {p}).","Take out the common bracket (x + {p}).","So the answer is {answer}."],"where":["p != q"]},{"id":"m4-3-squares","type":"mcq","level":2,"review":"rule","sources":["algebra-factorise"],"vars":{"a":{"int":[2,7]},"b":{"int":[1,9]}},"prompt":"Factorise {quad(a * a, 0, -b * b)}.","correct":"{lin2(a, b, a, -b)}","distractors":[{"text":"{lin2(a * a, b, 1, -b)}","misconception":"half"},{"text":"{lin2(a, b * b, a, -1)}","misconception":"noroot"},{"text":"{lin2(a, b, a, b)}","misconception":"signs"}],"misconceptions":[{"id":"half","explain":"Take the square root of the whole term {mono(a * a, 'x²')}: it is {mono(a, 'x')}, in both brackets."},{"id":"noroot","explain":"Use {b}, the square root of {b * b}, in both brackets."},{"id":"signs","explain":"{lin2(a, b, a, b)} = ({poly([a, 'x'], [b, ''])})², which ends with +{b * b}. One bracket needs a minus sign."}],"solution":["{mono(a * a, 'x²')} = ({mono(a, 'x')})² and {b * b} = {b}².","a² − b² = (a + b)(a − b) with a = {mono(a, 'x')} and b = {b}.","So the answer is {answer}."],"where":["hcf(a, b) == 1"]},{"id":"m4-3-common","type":"mcq","level":2,"review":"rule","sources":["algebra-factorise"],"vars":{"k":{"int":[2,7]},"a":{"int":[2,9]}},"prompt":"Factorise completely {quad(k, 0, -k * a * a)}.","correct":"{k}{lin2(1, a, 1, -a)}","distractors":[{"text":"{k}({quad(1, 0, -a * a)})","misconception":"stop"},{"text":"{lin2(k, a, 1, -a)}","misconception":"onebr"},{"text":"{k}({poly([1, 'x'], [-a, ''])})²","misconception":"square"}],"misconceptions":[{"id":"stop","explain":"'Completely' means keep going: x² − {a * a} still factorises as {lin2(1, a, 1, -a)}."},{"id":"onebr","explain":"Expand it: {lin2(k, a, 1, -a)} has a middle term. Take {k} out in front instead."},{"id":"square","explain":"{k}({poly([1, 'x'], [-a, ''])})² = {k}({quad(1, -2 * a, a * a)}): that has a middle term."}],"solution":["Take out the common factor {k}: {k}({quad(1, 0, -a * a)}).","x² − {a * a} is a difference of two squares: {lin2(1, a, 1, -a)}.","So the answer is {answer}."]},{"id":"m4-3-calc","type":"numeric","level":3,"review":"rule","sources":["algebra-factorise"],"vars":{"n":{"int":[51,99]},"d":{"int":[1,9]},"m":{"expr":"n - d"}},"prompt":"Use a difference of two squares to calculate {n}² − {m}² without squaring the large numbers.","answer":"(n + m) * (n - m)","misconceptions":[{"id":"diffsq","wrong":"(n - m) * (n - m)","explain":"a² − b² is not (a − b)². Use ({n} + {m})({n} − {m})."},{"id":"sub","wrong":"n - m","explain":"{n}² − {m}² is not {n} − {m}. Multiply the sum by the difference: {n + m} × {n - m}."}],"solution":["{n}² − {m}² = ({n} + {m})({n} − {m}).","= {n + m} × {n - m}.","= {answer}."],"where":["d > 1"]}]},"4":{"subject":"mathematics","class":"Form 4","lesson_no":4,"language":"en","prerequisites":[2,3],"skills":[{"id":"m4-4","name":"Use the identities for the sum and the difference of two cubes"}],"note":{"status":"draft","text":"Two identities factorise a sum or a difference of two cubes:\n• a³ + b³ = (a + b)(a² − ab + b²)\n• a³ − b³ = (a − b)(a² + ab + b²)\nWrite each term as a cube first: 8 = 2³, 27x³ = (3x)³.\nFor example x³ − 8 = (x − 2)(x² + 2x + 4) and 27x³ + 1 = (3x + 1)(9x² − 3x + 1).\nSign rule: the small bracket has the same sign as the expression; the middle term of the long bracket has the opposite sign; the last term is always +.\nThe long bracket does not factorise further. Check by expanding.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to factorise a sum or a difference of two cubes with the right signs, and check by expanding.\nBuilds on: Lesson {3} (difference of two squares); Form Three cubes and cube roots.\nLeads to: factorising cubic polynomials with the factor theorem and solving cubic equations."},{"heading":"Two identities","text":"A cube is a number times itself three times: {2}³ = {8}, ({mono(3, 'x')})³ = {mono(27, 'x³')}.\nExpand (a − b)(a² + ab + b²): a³ + a²b + ab² − a²b − ab² − b³. Four terms cancel, leaving a³ − b³.\nSo:\n• a³ − b³ = (a − b)(a² + ab + b²)\n• a³ + b³ = (a + b)(a² − ab + b²)\nSign rule: the small bracket has the same sign as the expression. The middle term of the long bracket has the opposite sign. The last term is always plus."},{"heading":"Using them","text":"First write each term as a cube, then read off a and b.\n• {poly([1, 'x³'], [-125, ''])}: a = x, b = {5}, so ({poly([1, 'x'], [-5, ''])})({quad(1, 5, 25)}).\n• {poly([8, 'x³'], [27, ''])}: a = {mono(2, 'x')}, b = {3}, so ({poly([2, 'x'], [3, ''])})({quad(4, -6, 9)}).\nThe long bracket never factorises further with whole numbers. Take out a common factor first if there is one: {poly([2, 'x³'], [-16, ''])} = {2}({poly([1, 'x³'], [-8, ''])})."}],"key_words":[{"word":"cube","meaning":"a number multiplied by itself three times, such as {4}³ = {64}"},{"word":"cube root","meaning":"the number whose cube is given: the cube root of {64} is {4}"},{"word":"identity","meaning":"an equation that is true for every value of the letters"}],"examples":["{poly([1, 'x³'], [1, ''])} = ({poly([1, 'x'], [1, ''])})({quad(1, -1, 1)})","{poly([1, 'x³'], [-64, ''])} = ({poly([1, 'x'], [-4, ''])})({quad(1, 4, 16)})"],"mistake":{"wrong":"{poly([1, 'x³'], [-8, ''])} = ({poly([1, 'x'], [-2, ''])})³","right":"{poly([1, 'x³'], [-8, ''])} = ({poly([1, 'x'], [-2, ''])})({quad(1, 2, 4)})","why":"({poly([1, 'x'], [-2, ''])})³ = {poly([1, 'x³'], [-6, 'x²'], [12, 'x'], [-8, ''])}. A difference of cubes needs the long bracket."}},"worked_example":{"status":"draft","vars":{"a":2},"problem":"Factorise {poly([1, 'x³'], [-a ^ 3, ''])}.","steps":["Write each term as a cube: x³ and {a ^ 3} = {a}³.","Use a³ − b³ = (a − b)(a² + ab + b²) with a = x and b = {a}.","a² = x², ab = {mono(a, 'x')}, b² = {a * a}.","Check: x × ({quad(1, a, a * a)}) − {a} × ({quad(1, a, a * a)}) = {poly([1, 'x³'], [-a ^ 3, ''])}."],"answer":"({poly([1, 'x'], [-a, ''])})({quad(1, a, a * a)})","checks":["a ^ 3 == 8"]},"teach":{"cards":[{"id":"c4m4-1","status":"draft","idea":"Before using an identity, write each term as a cube: {8} = {2}³, {64} = {4}³, {mono(27, 'x³')} = ({mono(3, 'x')})³.","vars":{},"example":["{125} = {5}³ and {mono(8, 'x³')} = ({mono(2, 'x')})³"],"checks":[],"check":{"ref":"m4-4-cube"}},{"id":"c4m4-2","status":"draft","idea":"Difference of two cubes: a³ − b³ = (a − b)(a² + ab + b²).","vars":{},"example":["{poly([1, 'x³'], [-27, ''])} = ({poly([1, 'x'], [-3, ''])})({quad(1, 3, 9)})"],"checks":[],"check":{"ref":"m4-4-diff"}},{"id":"c4m4-3","status":"draft","idea":"Sum of two cubes: a³ + b³ = (a + b)(a² − ab + b²). Only the small bracket keeps the + sign.","vars":{},"example":["{poly([1, 'x³'], [64, ''])} = ({poly([1, 'x'], [4, ''])})({quad(1, -4, 16)})"],"checks":[],"check":{"id":"m4-4-sum-card","type":"mcq","level":1,"review":"rule","sources":["algebra-factorise"],"vars":{"k":{"int":[2,5]}},"prompt":"Factorise {poly([k ^ 3, 'x³'], [1, ''])}.","correct":"({poly([k, 'x'], [1, ''])})({quad(k * k, -k, 1)})","distractors":[{"text":"({poly([k, 'x'], [1, ''])})({quad(k * k, k, 1)})","misconception":"midsign"},{"text":"({poly([k, 'x'], [1, ''])})({quad(k, -k, 1)})","misconception":"nosq"},{"text":"({poly([k ^ 3, 'x'], [1, ''])})({quad(1, -1, 1)})","misconception":"nocube"}],"misconceptions":[{"id":"midsign","explain":"For a sum of cubes the middle term of the long bracket is minus: a² − ab + b²."},{"id":"nosq","explain":"a² = ({mono(k, 'x')})² = {mono(k * k, 'x²')}: square the {k} too."},{"id":"nocube","explain":"First write {mono(k ^ 3, 'x³')} as a cube: ({mono(k, 'x')})³. Then a = {mono(k, 'x')}."}],"solution":["{mono(k ^ 3, 'x³')} = ({mono(k, 'x')})³ and {1} = {1}³.","a³ + b³ = (a + b)(a² − ab + b²) with a = {mono(k, 'x')}, b = {1}.","a² = {mono(k * k, 'x²')}, ab = {mono(k, 'x')}, b² = {1}.","So the answer is {answer}."]}}]},"questions":[{"id":"m4-4-cube","type":"numeric","level":1,"review":"rule","sources":["algebra-factorise"],"vars":{"a":{"int":[2,10]},"n":{"expr":"a ^ 3"}},"prompt":"{n} is a cube number. It is the cube of which whole number?","answer":"a","misconceptions":[{"id":"third","wrong":"n / 3","explain":"Cubing is not multiplying by {3}: {a}³ = {a} × {a} × {a}."},{"id":"square","wrong":"sqrtFloor(n)","explain":"That is near the square root. The cube root of {n} is {a}, because {a} × {a} × {a} = {n}."}],"solution":["Try whole numbers: {a} × {a} × {a} = {n}.","So {n} = {a}³ and the answer is {answer}."]},{"id":"m4-4-diff","type":"mcq","level":1,"review":"rule","sources":["algebra-factorise"],"vars":{"a":{"int":[2,6]}},"prompt":"Factorise {poly([1, 'x³'], [-a ^ 3, ''])}.","correct":"({poly([1, 'x'], [-a, ''])})({quad(1, a, a * a)})","distractors":[{"text":"({poly([1, 'x'], [-a, ''])})({quad(1, -a, a * a)})","misconception":"midsign"},{"text":"({poly([1, 'x'], [a, ''])})({quad(1, -a, a * a)})","misconception":"sum"},{"text":"({poly([1, 'x'], [-a, ''])})³","misconception":"cube"}],"misconceptions":[{"id":"midsign","explain":"For a difference of cubes the long bracket is all plus: a² + ab + b²."},{"id":"sum","explain":"That is the factorisation of x³ + {a ^ 3}, a sum. Here there is a minus sign."},{"id":"cube","explain":"({poly([1, 'x'], [-a, ''])})³ expands to four terms with x² and x terms. It is not x³ − {a ^ 3}."}],"solution":["{a ^ 3} = {a}³, so use a³ − b³ = (a − b)(a² + ab + b²).","a = x, b = {a}: a² = x², ab = {mono(a, 'x')}, b² = {a * a}.","So the answer is {answer}."]},{"id":"m4-4-sum","type":"mcq","level":2,"review":"rule","sources":["algebra-factorise"],"vars":{"k":{"int":[2,5]}},"prompt":"Factorise {poly([k ^ 3, 'x³'], [1, ''])}.","correct":"({poly([k, 'x'], [1, ''])})({quad(k * k, -k, 1)})","distractors":[{"text":"({poly([k, 'x'], [1, ''])})({quad(k * k, k, 1)})","misconception":"midsign"},{"text":"({poly([k, 'x'], [1, ''])})({quad(k, -k, 1)})","misconception":"nosq"},{"text":"({poly([k ^ 3, 'x'], [1, ''])})({quad(1, -1, 1)})","misconception":"nocube"}],"misconceptions":[{"id":"midsign","explain":"For a sum of cubes the middle term of the long bracket is minus: a² − ab + b²."},{"id":"nosq","explain":"a² = ({mono(k, 'x')})² = {mono(k * k, 'x²')}: square the {k} too."},{"id":"nocube","explain":"First write {mono(k ^ 3, 'x³')} as a cube: ({mono(k, 'x')})³. Then a = {mono(k, 'x')}."}],"solution":["{mono(k ^ 3, 'x³')} = ({mono(k, 'x')})³ and {1} = {1}³.","a³ + b³ = (a + b)(a² − ab + b²) with a = {mono(k, 'x')}, b = {1}.","a² = {mono(k * k, 'x²')}, ab = {mono(k, 'x')}, b² = {1}.","So the answer is {answer}."]},{"id":"m4-4-which","type":"mcq","level":2,"review":"rule","sources":["algebra-factorise"],"vars":{"a":{"int":[2,6]},"s":{"pick":[1,-1]}},"prompt":"Which identity factorises {poly([1, 'x³'], [s * a ^ 3, ''])}?","correct":"{s > 0 ? 'a³ + b³ = (a + b)(a² − ab + b²)' : 'a³ − b³ = (a − b)(a² + ab + b²)'}","distractors":[{"text":"{s > 0 ? 'a³ + b³ = (a + b)(a² + ab + b²)' : 'a³ − b³ = (a − b)(a² − ab + b²)'}","misconception":"mid"},{"text":"{s > 0 ? 'a³ + b³ = (a + b)³' : 'a³ − b³ = (a − b)³'}","misconception":"cube"},{"text":"a² − b² = (a + b)(a − b)","misconception":"squares"}],"misconceptions":[{"id":"mid","explain":"The middle term of the long bracket has the opposite sign to the small bracket."},{"id":"cube","explain":"(a ± b)³ expands to four terms. It is not a³ ± b³."},{"id":"squares","explain":"That identity is for squares. x³ and {a ^ 3} = {a}³ are cubes."}],"solution":["{a ^ 3} = {a}³, so the expression is {s > 0 ? 'a sum' : 'a difference'} of two cubes.","The small bracket keeps the sign; the middle of the long bracket has the opposite sign.","So the answer is: {answer}."]},{"id":"m4-4-value","type":"numeric","level":3,"review":"rule","sources":["algebra-factorise"],"vars":{"s":{"int":[3,9]},"p":{"int":[1,8]}},"prompt":"Given that a + b = {s} and ab = {p}, use a³ + b³ = (a + b)(a² − ab + b²) to find a³ + b³. (Hint: a² + b² = (a + b)² − {2}ab.)","answer":"s * (s * s - 3 * p)","misconceptions":[{"id":"cube","wrong":"s ^ 3","explain":"(a + b)³ is not a³ + b³: it also has the terms {3}a²b + {3}ab²."},{"id":"noab","wrong":"s * (s * s - 2 * p)","explain":"That is (a + b)(a² + b²). The long bracket is a² − ab + b²: subtract ab = {p} once more."},{"id":"plusab","wrong":"s * (s * s - p)","explain":"a² + b² is (a + b)² − {2}ab, not (a + b)²; then subtract ab."}],"solution":["a² + b² = (a + b)² − {2}ab = {s * s} − {2 * p} = {s * s - 2 * p}.","a² − ab + b² = {s * s - 2 * p} − {p} = {s * s - 3 * p}.","a³ + b³ = {s} × {s * s - 3 * p} = {answer}."],"where":["s * s - 3 * p > 0"]}]},"5":{"subject":"mathematics","class":"Form 4","lesson_no":5,"language":"en","prerequisites":[2,3],"skills":[{"id":"m4-5","name":"Factorise quadratic trinomials x² + bx + c"}],"note":{"status":"draft","text":"To factorise x² + bx + c, find two numbers that multiply to c and add to b. Then x² + bx + c = (x + p)(x + q).\n• x² + 7x + 12: 3 × 4 = 12 and 3 + 4 = 7, so (x + 3)(x + 4).\n• x² − 2x − 15: −5 × 3 = −15 and −5 + 3 = −2, so (x − 5)(x + 3).\nSigns: if c is positive, both numbers have the sign of b. If c is negative, the numbers have opposite signs and the larger one has the sign of b.\nCheck by expanding: the middle term must come back.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to factorise any trinomial x² + bx + c with whole numbers, choosing the signs correctly.\nBuilds on: Lesson {2} (expanding (x + p)(x + q)) and Lesson {3} (factorising by grouping).\nLeads to: Lesson {6} (trinomials with a number in front of x²) and solving quadratic equations by factorisation."},{"heading":"Product and sum","text":"Expand {lin2(1, 3, 1, 4)}: x² + {mono(4, 'x')} + {mono(3, 'x')} + {12} = {quad(1, 7, 12)}.\nThe two numbers {3} and {4} multiply to give {12} and add to give {7}. So to factorise {quad(1, 7, 12)}, ask: which two numbers multiply to {12} and add to {7}?\nList the factor pairs of {12}: {1} × {12}, {2} × {6}, {3} × {4}. Only {3} and {4} add to {7}.\nThen {quad(1, 7, 12)} = {lin2(1, 3, 1, 4)}."},{"heading":"Getting the signs right","text":"• c positive, b positive: both numbers positive. {quad(1, 8, 15)} = {lin2(1, 3, 1, 5)}.\n• c positive, b negative: both negative. {quad(1, -8, 15)} = {lin2(1, -3, 1, -5)}.\n• c negative: one positive, one negative. The larger has the sign of b. {quad(1, -2, -15)} = {lin2(1, -5, 1, 3)}.\nAlways expand to check. Common factors come out first: {quad(2, 14, 24)} = {2}({quad(1, 7, 12)})."}],"key_words":[{"word":"trinomial","meaning":"an expression with three terms, such as {quad(1, 5, 6)}"},{"word":"quadratic","meaning":"with x² as the highest power of x"},{"word":"factor pair","meaning":"two whole numbers that multiply to a given number"}],"examples":["{quad(1, 5, 6)} = {lin2(1, 2, 1, 3)}","{quad(1, -9, 14)} = {lin2(1, -2, 1, -7)}","{quad(1, 4, -21)} = {lin2(1, 7, 1, -3)}"],"mistake":{"wrong":"{quad(1, -2, -15)} = {lin2(1, 5, 1, -3)}","right":"{quad(1, -2, -15)} = {lin2(1, -5, 1, 3)}","why":"{5} + {br(-3)} = {2}, but the middle term is {mono(-2, 'x')}. The larger number takes the sign of b: {-5} and {3}."}},"worked_example":{"status":"draft","vars":{"p":-5,"q":3},"problem":"Factorise {quad(1, p + q, p * q)}.","steps":["Look for two numbers with product {p * q} and sum {p + q}.","The product is negative, so the numbers have opposite signs.","Pairs with product {p * q}: … {p} and {q} add to {p + q}.","Check: {lin2(1, p, 1, q)} = {quad(1, p + q, p * q)}."],"answer":"{lin2(1, p, 1, q)}","checks":["p * q == -15","p + q == -2"]},"teach":{"cards":[{"id":"c4m5-1","status":"draft","idea":"For x² + bx + c, look for two numbers whose product is c and whose sum is b.","vars":{},"example":["{quad(1, 9, 20)}: {4} × {5} = {20} and {4} + {5} = {9}, so {lin2(1, 4, 1, 5)}"],"checks":[],"check":{"ref":"m4-5-pos"}},{"id":"c4m5-2","status":"draft","idea":"If c is positive and b is negative, both numbers are negative.","vars":{},"example":["{quad(1, -8, 15)}: {br(-3)} × {br(-5)} = {15}, {-3} + {br(-5)} = {-8}, so {lin2(1, -3, 1, -5)}"],"checks":[],"check":{"ref":"m4-5-neg"}},{"id":"c4m5-3","status":"draft","idea":"If c is negative, the two numbers have opposite signs; the larger one has the sign of b.","vars":{},"example":["{quad(1, 2, -24)}: {6} × {br(-4)} = {-24} and {6} + {br(-4)} = {2}, so {lin2(1, 6, 1, -4)}"],"checks":[],"check":{"id":"m4-5-mixed-card","type":"mcq","level":1,"review":"rule","sources":["algebra-factorise"],"vars":{"p":{"int":[1,12]},"q":{"int":[-12,-1]}},"prompt":"Factorise {quad(1, p + q, p * q)}.","correct":"{lin2(1, p, 1, q)}","distractors":[{"text":"{lin2(1, -p, 1, -q)}","misconception":"swap"},{"text":"{lin2(1, -p, 1, q)}","misconception":"pos"},{"text":"{lin2(1, p, 1, -q)}","misconception":"pos2"}],"misconceptions":[{"id":"swap","explain":"Expand it: the middle term would be {mono(-(p + q), 'x')}. Swap the signs."},{"id":"pos","explain":"{br(-p)} × {br(q)} = {-p * q}: the product would be positive."},{"id":"pos2","explain":"{p} × {br(-q)} = {-p * q}: the product would be positive."}],"solution":["The product {p * q} is negative: the numbers have opposite signs.","{p} × {br(q)} = {p * q} and {p} + {br(q)} = {p + q}.","So the answer is {answer}."],"where":["p + q != 0","p != -q"]}}]},"questions":[{"id":"m4-5-pos","type":"mcq","level":1,"review":"rule","sources":["algebra-factorise"],"vars":{"p":{"int":[1,9]},"q":{"int":[2,9]}},"prompt":"Factorise {quad(1, p + q, p * q)}.","correct":"{lin2(1, p, 1, q)}","distractors":[{"text":"{lin2(1, p * q, 1, 1)}","misconception":"one"},{"text":"{lin2(1, p + q, 1, p * q)}","misconception":"bc"},{"text":"{lin2(1, -p, 1, -q)}","misconception":"sign"}],"misconceptions":[{"id":"one","explain":"{p * q} × {1} = {p * q}, but {p * q} + {1} = {p * q + 1}, not {p + q}."},{"id":"bc","explain":"The numbers in the brackets must multiply to {p * q} and add to {p + q}. {p + q} and {p * q} do not."},{"id":"sign","explain":"{br(-p)} + {br(-q)} = {-p - q}. The middle term is +{p + q}x, so both numbers are positive."}],"solution":["Two numbers with product {p * q} and sum {p + q}: {p} and {q}.","So the answer is {answer}."],"where":["p \u003c q","p * q != p + q"]},{"id":"m4-5-neg","type":"mcq","level":1,"review":"rule","sources":["algebra-factorise"],"vars":{"p":{"int":[1,9]},"q":{"int":[2,9]}},"prompt":"Factorise {quad(1, -(p + q), p * q)}.","correct":"{lin2(1, -p, 1, -q)}","distractors":[{"text":"{lin2(1, p, 1, q)}","misconception":"sign"},{"text":"{lin2(1, p, 1, -q)}","misconception":"mixed"},{"text":"{lin2(1, -p * q, 1, -1)}","misconception":"one"}],"misconceptions":[{"id":"sign","explain":"{lin2(1, p, 1, q)} expands to {quad(1, p + q, p * q)}: the middle sign is wrong."},{"id":"mixed","explain":"One plus and one minus give a negative product, {-p * q}. Here the product is +{p * q}."},{"id":"one","explain":"{br(-p * q)} + {br(-1)} = {-p * q - 1}, not {-(p + q)}."}],"solution":["The product +{p * q} is positive and the sum {-(p + q)} is negative: both numbers are negative.","{br(-p)} × {br(-q)} = {p * q} and {-p} + {br(-q)} = {-(p + q)}.","So the answer is {answer}."],"where":["p \u003c q","p * q != p + q","p * q + 1 != p + q"]},{"id":"m4-5-mixed","type":"mcq","level":2,"review":"rule","sources":["algebra-factorise"],"vars":{"p":{"int":[1,12]},"q":{"int":[-12,-1]}},"prompt":"Factorise {quad(1, p + q, p * q)}.","correct":"{lin2(1, p, 1, q)}","distractors":[{"text":"{lin2(1, -p, 1, -q)}","misconception":"swap"},{"text":"{lin2(1, -p, 1, q)}","misconception":"pos"},{"text":"{lin2(1, p, 1, -q)}","misconception":"pos2"}],"misconceptions":[{"id":"swap","explain":"Expand it: the middle term would be {mono(-(p + q), 'x')}. Swap the signs."},{"id":"pos","explain":"{br(-p)} × {br(q)} = {-p * q}: the product would be positive."},{"id":"pos2","explain":"{p} × {br(-q)} = {-p * q}: the product would be positive."}],"solution":["The product {p * q} is negative: the numbers have opposite signs.","{p} × {br(q)} = {p * q} and {p} + {br(q)} = {p + q}.","So the answer is {answer}."],"where":["p + q != 0","p != -q"]},{"id":"m4-5-find","type":"numeric","level":2,"review":"rule","sources":["algebra-factorise"],"vars":{"p":{"int":[-9,9]},"q":{"int":[-9,9]}},"prompt":"{quad(1, p + q, p * q)} = (x + {br(p)})(x + k). What is k?","answer":"q","misconceptions":[{"id":"sum","wrong":"p + q","explain":"k is not the middle coefficient. The two numbers multiply to {p * q}: k = {q}."},{"id":"neg","wrong":"-q","explain":"Check: {p} × {br(-q)} = {-p * q}, not {p * q}."}],"solution":["The two numbers multiply to {p * q}: {p} × k = {p * q}, so k = {q}.","Check the sum: {p} + {br(q)} = {p + q}."],"where":["p != 0 && q != 0","p + q != 0","p != q","p + q != q"],"signed":true},{"id":"m4-5-spot","type":"mcq","level":3,"review":"rule","sources":["algebra-factorise"],"vars":{"p":{"int":[-9,9]},"q":{"int":[-9,9]}},"prompt":"Ayuk factorised {quad(1, p + q, p * q)} as {lin2(1, -p, 1, -q)}. What went wrong?","correct":"The signs are swapped: the answer is {lin2(1, p, 1, q)}","distractors":[{"text":"Nothing: it is correct","misconception":"ok"},{"text":"The numbers should be {p * q} and {1}","misconception":"one"},{"text":"It cannot be factorised","misconception":"none"}],"misconceptions":[{"id":"ok","explain":"Expand it: Ayuk's brackets give {mono(-(p + q), 'x')}, not {mono(p + q, 'x')}."},{"id":"one","explain":"{p * q} + {1} = {p * q + 1}, not {p + q}."},{"id":"none","explain":"It does factorise: {p} and {q} multiply to {p * q} and add to {p + q}."}],"solution":["Expand Ayuk's answer: {lin2(1, -p, 1, -q)} = {quad(1, -(p + q), p * q)}.","The middle term has the wrong sign. The right factorisation is {lin2(1, p, 1, q)}.","So the answer is: {answer}."],"where":["p != 0 && q != 0","p + q != 0","p * q + 1 != p + q","p \u003c q"]}]},"6":{"subject":"mathematics","class":"Form 4","lesson_no":6,"language":"en","prerequisites":[5],"skills":[{"id":"m4-6","name":"Factorise quadratic trinomials ax² + bx + c with a ≠ 1"}],"note":{"status":"draft","text":"To factorise ax² + bx + c when a is not 1, use the ac method.\n• Multiply a × c.\n• Find two numbers that multiply to ac and add to b.\n• Split the middle term with them, then factorise by grouping.\nExample: 2x² + 7x + 3. ac = 6; 6 and 1 multiply to 6 and add to 7. 2x² + 6x + x + 3 = 2x(x + 3) + 1(x + 3) = (2x + 1)(x + 3).\nTake out any common factor first. Check by expanding.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to factorise trinomials such as {quad(2, 7, 3)} and {quad(3, -10, -8)} by the ac method, and check by expanding.\nBuilds on: Lesson {5} (product and sum for x² + bx + c) and Lesson {3} (grouping).\nLeads to: solving quadratic equations by factorisation (Lesson {7}) and the factor theorem."},{"heading":"The ac method","text":"When the number in front of x² is not {1}, the product-and-sum trick needs one extra step.\nTake {quad(2, 7, 3)}.\n• Multiply a × c: {2} × {3} = {6}.\n• Find two numbers that multiply to {6} and add to {7}: {6} and {1}.\n• Split {mono(7, 'x')} into {mono(6, 'x')} + x: {poly([2, 'x²'], [6, 'x'], [1, 'x'], [3, ''])}.\n• Group: {mono(2, 'x')}(x + {3}) + {1}(x + {3}) = {lin2(2, 1, 1, 3)}."},{"heading":"Negative numbers and checking","text":"The sign rules from Lesson {5} still apply to the two numbers.\nFor {quad(3, -10, -8)}: a × c = {-24}. The numbers {-12} and {2} multiply to {-24} and add to {-10}.\n{poly([3, 'x²'], [-12, 'x'], [2, 'x'], [-8, ''])} = {mono(3, 'x')}(x − {4}) + {2}(x − {4}) = {lin2(3, 2, 1, -4)}.\nCheck: {mono(3, 'x')} × {br(-4)} + {2} × x = {mono(-10, 'x')}. The middle term comes back, so the answer is right."}],"key_words":[{"word":"coefficient","meaning":"the number multiplying a term, such as {3} in {mono(3, 'x²')}"},{"word":"ac method","meaning":"splitting the middle term using two numbers that multiply to a × c and add to b"},{"word":"split the middle term","meaning":"write bx as the sum of two x terms so that grouping works"}],"examples":["{quad(2, 5, 2)} = {lin2(2, 1, 1, 2)}","{quad(3, 1, -2)} = {lin2(3, -2, 1, 1)}","{quad(6, -7, 2)} = {lin2(2, -1, 3, -2)}"],"mistake":{"wrong":"{quad(2, 7, 3)} = {lin2(2, 3, 1, 1)}","right":"{quad(2, 7, 3)} = {lin2(2, 1, 1, 3)}","why":"Expand to check: {lin2(2, 3, 1, 1)} gives {mono(5, 'x')} in the middle, not {mono(7, 'x')}. The position of each number matters."}},"worked_example":{"status":"draft","vars":{"a":3,"b":-10,"c":-8},"problem":"Factorise {quad(a, b, c)}.","steps":["Multiply a × c: {a} × {br(c)} = {a * c}.","Find two numbers with product {a * c} and sum {b}: {-12} and {2}.","Split the middle term: {poly([a, 'x²'], [-12, 'x'], [2, 'x'], [c, ''])}.","Group: {mono(3, 'x')}({poly([1, 'x'], [-4, ''])}) + {2}({poly([1, 'x'], [-4, ''])}) = {lin2(3, 2, 1, -4)}."],"answer":"{lin2(3, 2, 1, -4)}","checks":["a * c == -24","-12 + 2 == b","-12 * 2 == a * c"]},"teach":{"cards":[{"id":"c4m6-1","status":"draft","idea":"The ac method starts by multiplying the first and last coefficients.","vars":{},"example":["{quad(2, 7, 3)}: a × c = {2} × {3} = {6}"],"checks":[],"check":{"ref":"m4-6-ac"}},{"id":"c4m6-2","status":"draft","idea":"Find two numbers that multiply to ac and add to b, and use them to split the middle term.","vars":{},"example":["{6} = {6} × {1} and {6} + {1} = {7}: {quad(2, 7, 3)} = {poly([2, 'x²'], [6, 'x'], [1, 'x'], [3, ''])}"],"checks":[],"check":{"ref":"m4-6-split"}},{"id":"c4m6-3","status":"draft","idea":"Group the four terms; the two brackets must match.","vars":{},"example":["{mono(2, 'x')}(x + {3}) + {1}(x + {3}) = {lin2(2, 1, 1, 3)}"],"checks":[],"check":{"id":"m4-6-full-card","type":"mcq","level":1,"review":"rule","sources":["algebra-factorise"],"vars":{"r":{"int":[2,4]},"s":{"int":[-5,5]},"t":{"int":[1,3]},"u":{"int":[-5,5]}},"prompt":"Factorise {quad(r * t, r * u + s * t, s * u)}.","correct":"{lin2(r, s, t, u)}","distractors":[{"text":"{lin2(r, u, t, s)}","misconception":"cross"},{"text":"{lin2(r * t, s, 1, u)}","misconception":"aone"},{"text":"{lin2(r, -s, t, -u)}","misconception":"sign"}],"misconceptions":[{"id":"cross","explain":"Expand it: {lin2(r, u, t, s)} gives the middle term {mono(r * s + u * t, 'x')}, not {mono(r * u + s * t, 'x')}."},{"id":"aone","explain":"Expand it: {lin2(r * t, s, 1, u)} gives the middle term {mono(r * t * u + s, 'x')}."},{"id":"sign","explain":"Expand it: the middle term would be {mono(-(r * u + s * t), 'x')}."}],"solution":["a × c = {r * t} × {br(s * u)} = {r * t * s * u}; the numbers {r * u} and {s * t} multiply to {r * t * s * u} and add to {r * u + s * t}.","Split and group, then check: {lin2(r, s, t, u)} = {quad(r * t, r * u + s * t, s * u)}.","So the answer is {answer}."],"where":["s != 0 && u != 0","r * u + s * t != 0","r * s + u * t != r * u + s * t","r * t * u + s != r * u + s * t","hcf(r, abs(s)) == 1 && hcf(t, abs(u)) == 1","s != u"]}}]},"questions":[{"id":"m4-6-ac","type":"numeric","level":1,"review":"rule","sources":["algebra-factorise"],"vars":{"r":{"int":[2,4]},"s":{"int":[-5,5]},"t":{"int":[1,2]},"u":{"int":[-5,5]},"a":{"expr":"r * t"},"b":{"expr":"r * u + s * t"},"c":{"expr":"s * u"}},"prompt":"To factorise {quad(a, b, c)} by the ac method, which number do the two numbers multiply to?","answer":"a * c","misconceptions":[{"id":"c","wrong":"c","explain":"With a ≠ {1}, the numbers multiply to a × c = {a} × {br(c)}, not to c alone."},{"id":"b","wrong":"b","explain":"{b} is what they add to. They multiply to a × c = {a * c}."}],"solution":["Multiply the coefficient of x² by the number term: {a} × {br(c)} = {answer}."],"where":["s != 0 && u != 0","b != 0","a * c != b","hcf(r, abs(s)) == 1 && hcf(t, abs(u)) == 1"],"signed":true},{"id":"m4-6-split","type":"mcq","level":1,"review":"rule","sources":["algebra-factorise"],"vars":{"a":{"int":[2,5]},"p":{"int":[-9,9]},"q":{"int":[-9,9]},"c":{"expr":"p * q / a"}},"prompt":"To factorise {quad(a, p + q, c)}, the middle term is split using two numbers with product {a * c} and sum {p + q}. Which pair?","correct":"{p} and {q}","distractors":[{"text":"{a} and {c}","misconception":"ac"},{"text":"{p * q} and {1}","misconception":"one"},{"text":"{-p} and {-q}","misconception":"sign"}],"misconceptions":[{"id":"ac","explain":"{a} and {c} multiply to {a * c}, but they add to {a + c}, not {p + q}."},{"id":"one","explain":"{p * q} + {1} = {p * q + 1}, not {p + q}."},{"id":"sign","explain":"{-p} + {br(-q)} = {-p - q}: the sum has the wrong sign."}],"solution":["Product: {p} × {br(q)} = {p * q} = {a} × {br(c)}.","Sum: {p} + {br(q)} = {p + q}.","So the answer is {answer}."],"where":["p != 0 && q != 0","(p * q) % a == 0","p + q != 0","a + c != p + q","p * q + 1 != p + q","p \u003c q","p != -q","hcf3(a, abs(p + q), abs(c)) == 1"]},{"id":"m4-6-full","type":"mcq","level":2,"review":"rule","sources":["algebra-factorise"],"vars":{"r":{"int":[2,4]},"s":{"int":[-5,5]},"t":{"int":[1,3]},"u":{"int":[-5,5]}},"prompt":"Factorise {quad(r * t, r * u + s * t, s * u)}.","correct":"{lin2(r, s, t, u)}","distractors":[{"text":"{lin2(r, u, t, s)}","misconception":"cross"},{"text":"{lin2(r * t, s, 1, u)}","misconception":"aone"},{"text":"{lin2(r, -s, t, -u)}","misconception":"sign"}],"misconceptions":[{"id":"cross","explain":"Expand it: {lin2(r, u, t, s)} gives the middle term {mono(r * s + u * t, 'x')}, not {mono(r * u + s * t, 'x')}."},{"id":"aone","explain":"Expand it: {lin2(r * t, s, 1, u)} gives the middle term {mono(r * t * u + s, 'x')}."},{"id":"sign","explain":"Expand it: the middle term would be {mono(-(r * u + s * t), 'x')}."}],"solution":["a × c = {r * t} × {br(s * u)} = {r * t * s * u}; the numbers {r * u} and {s * t} multiply to {r * t * s * u} and add to {r * u + s * t}.","Split and group, then check: {lin2(r, s, t, u)} = {quad(r * t, r * u + s * t, s * u)}.","So the answer is {answer}."],"where":["s != 0 && u != 0","r * u + s * t != 0","r * s + u * t != r * u + s * t","r * t * u + s != r * u + s * t","hcf(r, abs(s)) == 1 && hcf(t, abs(u)) == 1","s != u"]},{"id":"m4-6-find","type":"numeric","level":2,"review":"rule","sources":["algebra-factorise"],"vars":{"r":{"int":[2,4]},"s":{"int":[-5,5]},"t":{"int":[1,3]},"u":{"int":[-5,5]}},"prompt":"{quad(r * t, r * u + s * t, s * u)} = ({poly([r, 'x'], [s, ''])})({mono(t, 'x')} + k). What is k?","answer":"u","misconceptions":[{"id":"prod","wrong":"s * u","explain":"{s * u} is the whole number term. k is the number that times {s} gives {s * u}: {u}."},{"id":"neg","wrong":"-u","explain":"Check: {s} × {br(-u)} = {-s * u}, not {s * u}."}],"solution":["The last terms multiply to {s * u}: {s} × k = {s * u}, so k = {u}.","Check the middle: {mono(r, 'x')} × {br(u)} + {s} × {mono(t, 'x')} = {mono(r * u + s * t, 'x')}."],"where":["s != 0 && u != 0","r * u + s * t != 0","s * u != u","hcf(r, abs(s)) == 1 && hcf(t, abs(u)) == 1"],"signed":true},{"id":"m4-6-common","type":"mcq","level":3,"review":"rule","sources":["algebra-factorise"],"vars":{"k":{"int":[2,4]},"r":{"int":[2,3]},"s":{"int":[-5,5]},"t":{"int":[1,2]},"u":{"int":[-5,5]}},"prompt":"Factorise completely {quad(k * r * t, k * (r * u + s * t), k * s * u)}.","correct":"{k}{lin2(r, s, t, u)}","distractors":[{"text":"{lin2(r, s, t, u)}","misconception":"lost"},{"text":"{k}({quad(r * t, r * u + s * t, s * u)})","misconception":"stop"},{"text":"{lin2(k * r, s, t, k * u)}","misconception":"both"}],"misconceptions":[{"id":"lost","explain":"Expand it: that gives {quad(r * t, r * u + s * t, s * u)}. The common factor {k} is missing."},{"id":"stop","explain":"'Completely' means factorise the trinomial too: {quad(r * t, r * u + s * t, s * u)} = {lin2(r, s, t, u)}."},{"id":"both","explain":"{k} was put into both brackets, which multiplies by {k * k}. Put it in front once."}],"solution":["Every coefficient is a multiple of {k}: take {k} out first.","Then factorise {quad(r * t, r * u + s * t, s * u)} = {lin2(r, s, t, u)}.","So the answer is {answer}."],"where":["s != 0 && u != 0","r * u + s * t != 0","hcf(r, abs(s)) == 1 && hcf(t, abs(u)) == 1","s != u"]}]},"7":{"subject":"mathematics","class":"Form 4","lesson_no":7,"language":"en","prerequisites":[5,6],"skills":[{"id":"m4-7","name":"Solve quadratic equations by factorisation"}],"note":{"status":"draft","text":"To solve a quadratic equation by factorisation:\n1. Rearrange so that one side is 0: ax² + bx + c = 0.\n2. Factorise the left side.\n3. If a product is 0, one of the factors is 0: set each bracket equal to 0 and solve.\nExample: x² − x − 12 = 0 → (x − 4)(x + 3) = 0 → x = 4 or x = −3.\nNever divide both sides by x: in x² = 5x you would lose the root x = 0. Write x² − 5x = 0, x(x − 5) = 0, so x = 0 or x = 5.\nA quadratic equation has at most two roots. Check each by substituting it back.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to solve any quadratic equation that factorises, including x² = kx, and reject roots that make no sense.\nBuilds on: Lessons {5} and {6} (factorising trinomials) and Form Three linear equations.\nLeads to: completing the square and the quadratic formula, for equations that do not factorise."},{"heading":"Why a product of {0} helps","text":"If two numbers multiply to give {0}, at least one of them must be {0}. So once a quadratic is written as a product of two brackets equal to {0}, each bracket gives a root.\nSolve {quad(1, -1, -12)} = {0}:\n• Factorise: {lin2(1, -4, 1, 3)} = {0}.\n• Either x − {4} = {0}, so x = {4}; or x + {3} = {0}, so x = {-3}.\nCheck x = {4}: {16} − {4} − {12} = {0}. Correct.\nThe rule works only when one side is {0}: (x − {1})(x − {2}) = {6} does not mean x − {1} = {6}."},{"heading":"Rearrange first","text":"Bring every term to one side before factorising.\n• {quad(1, 0, 0)} + {mono(2, 'x')} = {15} becomes {quad(1, 2, -15)} = {0}, so {lin2(1, 5, 1, -3)} = {0}: x = {-5} or x = {3}.\n• {quad(1, 0, 0)} = {mono(7, 'x')}: do not divide by x. Write {quad(1, -7, 0)} = {0}, x(x − {7}) = {0}, so x = {0} or x = {7}.\n• {quad(2, -1, -3)} = {0}: {lin2(2, -3, 1, 1)} = {0}, so x = {frac(3, 2)} or x = {-1}.\nIn a word problem, reject a root that makes no sense, such as a negative length."}],"key_words":[{"word":"root","meaning":"a value of x that makes the equation true"},{"word":"quadratic equation","meaning":"an equation with x² as the highest power, such as {quad(1, -1, -12)} = {0}"},{"word":"reject","meaning":"leave out a root that does not fit the problem"}],"examples":["{quad(1, -5, 6)} = {0} → x = {2} or x = {3}","{quad(1, 0, -9)} = {0} → x = {3} or x = {-3}","{quad(1, 4, 0)} = {0} → x = {0} or x = {-4}"],"mistake":{"wrong":"{quad(1, 0, 0)} = {mono(5, 'x')}, so x = {5}","right":"x² − {mono(5, 'x')} = {0}, so x = {0} or x = {5}","why":"Dividing both sides by x throws away the root x = {0}. Factorise instead."}},"worked_example":{"status":"draft","vars":{"p":4,"q":-3},"problem":"Solve {quad(1, -(p + q), p * q)} = {0}.","steps":["Factorise: two numbers with product {p * q} and sum {-(p + q)} are {-p} and {-q}.","So {lin2(1, -p, 1, -q)} = {0}.","Either x − {p} = {0}, giving x = {p}, or x + {-q} = {0}, giving x = {q}.","Check x = {p}: {p}² − {p + q} × {p} + {br(p * q)} = {p * p - (p + q) * p + p * q}."],"answer":"x = {p} or x = {q}","checks":["p * p - (p + q) * p + p * q == 0","q * q - (p + q) * q + p * q == 0"]},"teach":{"cards":[{"id":"c4m7-1","status":"draft","idea":"If two factors multiply to give {0}, at least one of them is {0}.","vars":{},"example":["{lin2(1, -2, 1, 7)} = {0} means x − {2} = {0} or x + {7} = {0}: x = {2} or x = {-7}"],"checks":[],"check":{"ref":"m4-7-zero"}},{"id":"c4m7-2","status":"draft","idea":"Make one side {0} and factorise before using that rule.","vars":{},"example":["{quad(1, 0, 0)} = {mono(6, 'x')} − {8} → {quad(1, -6, 8)} = {0} → {lin2(1, -2, 1, -4)} = {0}"],"checks":[],"check":{"ref":"m4-7-solve"}},{"id":"c4m7-3","status":"draft","idea":"Never divide by x: you lose the root x = {0}. Take x out as a common factor instead.","vars":{},"example":["{quad(1, 0, 0)} = {
