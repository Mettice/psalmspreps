mono(3, 'x')} → x({poly([1, 'x'], [-3, ''])}) = {0} → x = {0} or x = {3}"],"checks":[],"check":{"id":"m4-7-commonx-card","type":"mcq","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"k":{"int":[2,12]}},"prompt":"Solve {quad(1, 0, 0)} = {mono(k, 'x')}.","correct":"x = {0} or x = {k}","distractors":[{"text":"x = {k} only","misconception":"divide"},{"text":"x = {sqrtFloor(k)}","misconception":"root"},{"text":"x = {0} or x = {-k}","misconception":"sign"}],"misconceptions":[{"id":"divide","explain":"Dividing both sides by x loses the root x = {0}. Factorise x({poly([1, 'x'], [-k, ''])}) = {0} instead."},{"id":"root","explain":"x² = {mono(k, 'x')} is not x² = {k}. Bring {mono(k, 'x')} over and factorise."},{"id":"sign","explain":"x − {k} = {0} gives x = {k}, not {-k}."}],"solution":["Make one side {0}: {quad(1, -k, 0)} = {0}.","Factorise: x({poly([1, 'x'], [-k, ''])}) = {0}.","So x = {0} or x = {k}."],"where":["sqrtFloor(k) != k","sqrtFloor(k) != 0"]}}]},"questions":[{"id":"m4-7-zero","type":"numeric","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"p":{"int":[-9,9]},"q":{"int":[-9,9]}},"prompt":"Solve {lin2(1, -p, 1, -q)} = {0}. Give the larger root.","answer":"max(p, q)","misconceptions":[{"id":"sign","wrong":"max(-p, -q)","explain":"x − {br(p)} = {0} gives x = {p}: the root has the opposite sign to the number in the bracket."},{"id":"small","wrong":"min(p, q)","explain":"That is the smaller root. The larger is {max(p, q)}."}],"solution":["Either x − {br(p)} = {0} or x − {br(q)} = {0}.","So x = {p} or x = {q}.","The larger root is {answer}."],"where":["p != q","p != 0 && q != 0","max(-p, -q) != max(p, q)"],"signed":true},{"id":"m4-7-solve","type":"mcq","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"p":{"int":[-9,9]},"q":{"int":[-9,9]}},"prompt":"Solve {quad(1, -(p + q), p * q)} = {0}.","correct":"x = {p} or x = {q}","distractors":[{"text":"x = {-p} or x = {-q}","misconception":"sign"},{"text":"x = {p * q}","misconception":"const"},{"text":"x = {p} only","misconception":"one"}],"misconceptions":[{"id":"sign","explain":"The factors are {lin2(1, -p, 1, -q)}. x − {br(p)} = {0} gives x = {p}, not {-p}."},{"id":"const","explain":"{p * q} is the number term, not a root. Factorise and set each bracket to {0}."},{"id":"one","explain":"A quadratic has two roots here: the other bracket gives x = {q}."}],"solution":["Factorise: {lin2(1, -p, 1, -q)} = {0}.","Each bracket can be {0}: x = {p} or x = {q}.","So the answer is {answer}."],"where":["p \u003c q","p != 0 && q != 0","p != -q"]},{"id":"m4-7-commonx","type":"mcq","level":2,"review":"rule","sources":["quadratic-equations"],"vars":{"k":{"int":[2,12]}},"prompt":"Solve {quad(1, 0, 0)} = {mono(k, 'x')}.","correct":"x = {0} or x = {k}","distractors":[{"text":"x = {k} only","misconception":"divide"},{"text":"x = {sqrtFloor(k)}","misconception":"root"},{"text":"x = {0} or x = {-k}","misconception":"sign"}],"misconceptions":[{"id":"divide","explain":"Dividing both sides by x loses the root x = {0}. Factorise x({poly([1, 'x'], [-k, ''])}) = {0} instead."},{"id":"root","explain":"x² = {mono(k, 'x')} is not x² = {k}. Bring {mono(k, 'x')} over and factorise."},{"id":"sign","explain":"x − {k} = {0} gives x = {k}, not {-k}."}],"solution":["Make one side {0}: {quad(1, -k, 0)} = {0}.","Factorise: x({poly([1, 'x'], [-k, ''])}) = {0}.","So x = {0} or x = {k}."],"where":["sqrtFloor(k) != k","sqrtFloor(k) != 0"]},{"id":"m4-7-ax","type":"mcq","level":2,"review":"rule","sources":["quadratic-equations"],"vars":{"r":{"int":[2,4]},"s":{"int":[-5,5]},"t":{"int":[1,3]},"u":{"int":[-5,5]}},"prompt":"Solve {quad(r * t, r * u + s * t, s * u)} = {0}.","correct":"x = {frac(-s, r)} or x = {frac(-u, t)}","distractors":[{"text":"x = {frac(s, r)} or x = {frac(u, t)}","misconception":"sign"},{"text":"x = {-s} or x = {-u}","misconception":"noa"},{"text":"x = {frac(-r, s)} or x = {frac(-t, u)}","misconception":"flip"}],"misconceptions":[{"id":"sign","explain":"Moving {s} to the other side changes its sign: {mono(r, 'x')} = {-s}."},{"id":"noa","explain":"After {mono(r, 'x')} = {-s}, divide by {r}: x = {frac(-s, r)}."},{"id":"flip","explain":"{mono(r, 'x')} = {-s} gives x = {-s} ÷ {r} = {frac(-s, r)}, not {r} ÷ {br(-s)}."}],"solution":["Factorise: {lin2(r, s, t, u)} = {0}.","{mono(r, 'x')} + {br(s)} = {0} gives x = {frac(-s, r)}; {mono(t, 'x')} + {br(u)} = {0} gives x = {frac(-u, t)}.","So the answer is {answer}."],"where":["s != 0 && u != 0","hcf(r, abs(s)) == 1 && hcf(t, abs(u)) == 1","s * t != u * r","r * u + s * t != 0"]},{"id":"m4-7-area","type":"numeric","level":3,"review":"rule","sources":["quadratic-equations"],"vars":{"w":{"int":[3,15]},"d":{"int":[2,9]}},"prompt":"A rectangular garden in Bamenda is {d} m longer than it is wide. Its area is {w * (w + d)} m². Write an equation in x, the width in metres, and solve it. What is the width?","answer":"w","misconceptions":[{"id":"length","wrong":"w + d","explain":"{w + d} m is the length. The width is {d} m less: {w} m."},{"id":"neg","wrong":"-(w + d)","explain":"A length cannot be negative: reject x = {-(w + d)}."}],"solution":["x(x + {d}) = {w * (w + d)}, so {quad(1, d, -w * (w + d))} = {0}.","Factorise: {lin2(1, -w, 1, w + d)} = {0}, so x = {w} or x = {-(w + d)}.","A width cannot be negative, so the width is {answer} m."],"unit":"m"}]},"8":{"subject":"mathematics","class":"Form 4","lesson_no":8,"language":"en","prerequisites":[2,7],"skills":[{"id":"m4-8","name":"Solve quadratic equations by completing the square"}],"note":{"status":"draft","text":"Completing the square writes x² + bx + c as (x + b/2)² + something.\nx² + bx = (x + b/2)² − (b/2)². Add (b/2)² to make a perfect square.\nExample: x² + 6x + 2 = 0 → (x + 3)² − 9 + 2 = 0 → (x + 3)² = 7 → x + 3 = ±√7 → x = −3 ± √7.\nDo not forget the ± when you take a square root: both roots count.\nIf the coefficient of x² is not 1, divide the whole equation by it first.\nThe completed square also gives the minimum value of x² + bx + c: it is c − (b/2)², reached when x = −b/2.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to complete the square for x² + bx + c and use it to solve equations that do not factorise, with exact (surd) answers.\nBuilds on: Lesson {2} (the perfect square (a + b)²) and Lesson {7} (solving by factorisation).\nLeads to: Lesson {9}, where completing the square on ax² + bx + c gives the quadratic formula."},{"heading":"Making a perfect square","text":"From Lesson {2}: ({poly([1, 'x'], [3, ''])})² = {quad(1, 6, 9)}. The {6} is twice {3}, and the {9} is {3}².\nSo to turn {quad(1, 6, 0)} into a perfect square, take half of {6}, which is {3}, and add {3}² = {9}.\nIn general: x² + bx = (x + b/{2})² − (b/{2})².\n• {quad(1, 6, 2)} = ({poly([1, 'x'], [3, ''])})² − {9} + {2} = ({poly([1, 'x'], [3, ''])})² − {7}.\n• {quad(1, -4, 1)} = ({poly([1, 'x'], [-2, ''])})² − {4} + {1} = ({poly([1, 'x'], [-2, ''])})² − {3}."},{"heading":"Solving with it","text":"Solve {quad(1, 6, 2)} = {0}.\n• Complete the square: ({poly([1, 'x'], [3, ''])})² − {7} = {0}, so ({poly([1, 'x'], [3, ''])})² = {7}.\n• Take the square root, both signs: x + {3} = ±√{7}.\n• x = {-3} + √{7} or x = {-3} − √{7}. As decimals: {roundTo(-3 + sqrt(7), 0.01)} or {roundTo(-3 - sqrt(7), 0.01)}.\nIf the number in front of x² is not {1}, divide every term by it first: {quad(2, 8, -6)} = {0} becomes {quad(1, 4, -3)} = {0}."}],"key_words":[{"word":"perfect square","meaning":"an expression equal to (x + p)²"},{"word":"completing the square","meaning":"writing x² + bx + c as (x + p)² + q"},{"word":"surd","meaning":"a root that is not a whole number, such as √{7}, left exact"},{"word":"±","meaning":"plus or minus: both signs give a root"}],"examples":["{quad(1, 8, 0)} = ({poly([1, 'x'], [4, ''])})² − {16}","({poly([1, 'x'], [-1, ''])})² = {5} → x = {1} ± √{5}","minimum of {quad(1, -6, 11)} = {11} − {9} = {2}"],"mistake":{"wrong":"({poly([1, 'x'], [3, ''])})² = {7} → x = {-3} + √{7}","right":"x = {-3} + √{7} or x = {-3} − √{7}","why":"√{7} and −√{7} both square to {7}. Taking the square root needs ±, or one root is lost."}},"worked_example":{"status":"draft","vars":{"h":3,"c":2},"problem":"Solve {quad(1, 2 * h, c)} = {0} by completing the square. Leave the answer as a surd.","steps":["Half the coefficient of x is {h}, and {h}² = {h * h}.","{quad(1, 2 * h, 0)} = (x + {h})² − {h * h}, so the equation is (x + {h})² − {h * h} + {c} = {0}.","(x + {h})² = {h * h - c}.","x + {h} = ±√{h * h - c}, so x = {-h} ± √{h * h - c}."],"answer":"x = {-h} + √{h * h - c} or x = {-h} − √{h * h - c}","checks":["h * h - c == 7"]},"teach":{"cards":[{"id":"c4m8-1","status":"draft","idea":"To make x² + bx a perfect square, add the square of half of b.","vars":{},"example":["{quad(1, 10, 0)} + {25} = ({poly([1, 'x'], [5, ''])})², because half of {10} is {5} and {5}² = {25}"],"checks":[],"check":{"ref":"m4-8-add"}},{"id":"c4m8-2","status":"draft","idea":"x² + bx + c = (x + b/{2})² − (b/{2})² + c.","vars":{},"example":["{quad(1, 8, 3)} = ({poly([1, 'x'], [4, ''])})² − {16} + {3} = ({poly([1, 'x'], [4, ''])})² − {13}"],"checks":[],"check":{"ref":"m4-8-form"}},{"id":"c4m8-3","status":"draft","idea":"Taking a square root gives two answers: + and −.","vars":{},"example":["({poly([1, 'x'], [2, ''])})² = {9} → x + {2} = {3} or x + {2} = {-3} → x = {1} or x = {-5}"],"checks":[],"check":{"id":"m4-8-root-card","type":"numeric","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"h":{"int":[-9,9]},"k":{"int":[2,9]}},"prompt":"Solve ({poly([1, 'x'], [h, ''])})² = {k * k}. Give the larger root.","answer":"k - h","misconceptions":[{"id":"plush","wrong":"k + h","explain":"Subtract {h} from both sides: x = {k} − {br(h)} = {k - h}."},{"id":"square","wrong":"k * k - h","explain":"First take the square root: x + {br(h)} = ±{k}."},{"id":"small","wrong":"-k - h","explain":"That is the smaller root. The larger is {k - h}."}],"solution":["x + {br(h)} = {k} or x + {br(h)} = {-k}.","x = {k - h} or x = {-k - h}.","The larger root is {answer}."],"where":["h != 0","k != h && k != -h"],"signed":true}}]},"questions":[{"id":"m4-8-add","type":"numeric","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"h":{"int":[-9,9]}},"prompt":"What number must be added to {quad(1, 2 * h, 0)} to make a perfect square?","answer":"h * h","misconceptions":[{"id":"half","wrong":"h","explain":"Half of {2 * h} is {h}, but you add its square: {h}² = {h * h}."},{"id":"bsq","wrong":"4 * h * h","explain":"Square half of b, not b itself: ({h})² = {h * h}."}],"solution":["Half of {2 * h} is {h}.","{h}² = {answer}, and {quad(1, 2 * h, h * h)} = ({poly([1, 'x'], [h, ''])})²."],"where":["h != 0 && h != 1 && h != -1"]},{"id":"m4-8-form","type":"mcq","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"h":{"int":[-6,6]},"c":{"int":[-12,12]}},"prompt":"Write {quad(1, 2 * h, c)} in the form (x + p)² + q.","correct":"({poly([1, 'x'], [h, ''])})² {c - h * h >= 0 ? '+' : '−'} {abs(c - h * h)}","distractors":[{"text":"({poly([1, 'x'], [h, ''])})² {c + h * h >= 0 ? '+' : '−'} {abs(c + h * h)}","misconception":"plus"},{"text":"({poly([1, 'x'], [2 * h, ''])})² {c - 4 * h * h >= 0 ? '+' : '−'} {abs(c - 4 * h * h)}","misconception":"full"},{"text":"({poly([1, 'x'], [h, ''])})² {c >= 0 ? '+' : '−'} {abs(c)}","misconception":"forgot"}],"misconceptions":[{"id":"plus","explain":"({poly([1, 'x'], [h, ''])})² is {h * h} too big, so subtract {h * h}: q = {c} − {h * h}."},{"id":"full","explain":"Use half of {2 * h}, which is {h}, inside the bracket."},{"id":"forgot","explain":"({poly([1, 'x'], [h, ''])})² already adds {h * h}. Take it away again: q = {c - h * h}."}],"solution":["Half of {2 * h} is {h}: {quad(1, 2 * h, 0)} = ({poly([1, 'x'], [h, ''])})² − {h * h}.","Add {c}: q = {c} − {h * h} = {c - h * h}.","So the answer is {answer}."],"where":["h != 0","c != 0","c - h * h != 0","c + h * h != 0"]},{"id":"m4-8-root","type":"numeric","level":2,"review":"rule","sources":["quadratic-equations"],"vars":{"h":{"int":[-9,9]},"k":{"int":[2,9]}},"prompt":"Solve ({poly([1, 'x'], [h, ''])})² = {k * k}. Give the larger root.","answer":"k - h","misconceptions":[{"id":"plush","wrong":"k + h","explain":"Subtract {h} from both sides: x = {k} − {br(h)} = {k - h}."},{"id":"square","wrong":"k * k - h","explain":"First take the square root: x + {br(h)} = ±{k}."},{"id":"small","wrong":"-k - h","explain":"That is the smaller root. The larger is {k - h}."}],"solution":["x + {br(h)} = {k} or x + {br(h)} = {-k}.","x = {k - h} or x = {-k - h}.","The larger root is {answer}."],"where":["h != 0","k != h && k != -h"],"signed":true},{"id":"m4-8-surd","type":"mcq","level":2,"review":"rule","sources":["quadratic-equations"],"vars":{"h":{"int":[1,6]},"c":{"int":[-9,9]}},"prompt":"Solve {quad(1, 2 * h, c)} = {0} by completing the square.","correct":"x = {-h} ± √{h * h - c}","distractors":[{"text":"x = {h} ± √{h * h - c}","misconception":"sign"},{"text":"x = {-h} ± √{h * h + c}","misconception":"plus"},{"text":"x = {-h} + √{h * h - c} only","misconception":"one"}],"misconceptions":[{"id":"sign","explain":"x + {h} = ±√… gives x = {-h} ± √…: move {h} across and its sign changes."},{"id":"plus","explain":"(x + {h})² = {h * h} − {br(c)} = {h * h - c}: the {c} moves across with its sign changed."},{"id":"one","explain":"A square root has two signs: x + {h} = +√{h * h - c} or −√{h * h - c}."}],"solution":["(x + {h})² − {h * h} + {br(c)} = {0}, so (x + {h})² = {h * h - c}.","x + {h} = ±√{h * h - c}.","So the answer is {answer}."],"where":["c != 0","h * h - c > 1","!isPerfectSquare(h * h - c)","!isPerfectSquare(h * h + c) || h * h + c \u003c= 0","h * h + c > 0"]},{"id":"m4-8-min","type":"numeric","level":3,"review":"rule","sources":["quadratic-equations"],"vars":{"h":{"int":[-6,6]},"c":{"int":[-12,12]}},"prompt":"By completing the square, find the minimum value of {quad(1, 2 * h, c)}.","answer":"c - h * h","misconceptions":[{"id":"c","wrong":"c","explain":"x = {0} is not where the minimum is. Complete the square: the minimum is {c} − {h * h}."},{"id":"x","wrong":"-h","explain":"{-h} is the value of x at the minimum. The minimum value itself is {c - h * h}."},{"id":"plus","wrong":"c + h * h","explain":"({poly([1, 'x'], [h, ''])})² is {h * h} too big: subtract {h * h}, do not add it."}],"solution":["{quad(1, 2 * h, c)} = ({poly([1, 'x'], [h, ''])})² + {br(c - h * h)}.","A square is never negative, so the smallest it can be is {0}, when x = {-h}.","The minimum value is {answer}."],"where":["h != 0","c - h * h != -h","c != 0"],"signed":true}]},"9":{"subject":"mathematics","class":"Form 4","lesson_no":9,"language":"en","prerequisites":[8],"skills":[{"id":"m4-9","name":"Develop the quadratic formula by completing the square"}],"note":{"status":"draft","text":"Completing the square on ax² + bx + c = 0 gives the quadratic formula:\nx = (−b ± √(b² − 4ac)) / 2a.\nSteps: divide by a; move c/a; add (b/2a)² to both sides; write the left side as (x + b/2a)²; take the square root with ±; subtract b/2a.\nIdentify a, b and c with their signs: in 3x² − 5x + 2 = 0, a = 3, b = −5, c = 2.\nb² − 4ac is called the discriminant. In 3x² − 5x + 2 = 0 it is 25 − 24 = 1.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to explain each step that turns ax² + bx + c = {0} into the quadratic formula, and put the numbers of an equation into it.\nBuilds on: Lesson {8} (completing the square, with the ± root).\nLeads to: Lesson {10} (solving any quadratic with the formula) and later the discriminant and the nature of roots."},{"heading":"Completing the square on letters","text":"Do on ax² + bx + c = {0} what Lesson {8} did with numbers.\n• Divide by a: x² + (b/a)x + c/a = {0}.\n• Move c/a: x² + (b/a)x = −c/a.\n• Add (b/{2}a)², the square of half the x coefficient: (x + b/{2}a)² = b²/{4}a² − c/a = (b² − {4}ac)/{4}a².\n• Square root with ±: x + b/{2}a = ±√(b² − {4}ac)/{2}a.\n• Subtract b/{2}a: x = (−b ± √(b² − {4}ac)) / {2}a."},{"heading":"Reading a, b and c","text":"Write the equation as ax² + bx + c = {0} first, then read each number with its sign.\n• {quad(3, -5, 2)} = {0}: a = {3}, b = {-5}, c = {2}.\n• {quad(1, 4, -7)} = {0}: a = {1}, b = {4}, c = {-7}.\n• {quad(2, 0, -9)} = {0}: a = {2}, b = {0}, c = {-9}.\nThe number under the root, b² − {4}ac, is the discriminant. For {quad(3, -5, 2)} it is {25} − {24} = {1}."}],"key_words":[{"word":"quadratic formula","meaning":"x = (−b ± √(b² − {4}ac)) / {2}a"},{"word":"discriminant","meaning":"b² − {4}ac, the number under the square root"},{"word":"derive","meaning":"show where a formula comes from, step by step"}],"examples":["{quad(1, 3, -4)} = {0}: a = {1}, b = {3}, c = {-4}, discriminant {9} + {16} = {25}","{quad(2, -1, -6)} = {0}: discriminant {1} + {48} = {49}"],"mistake":{"wrong":"{quad(1, -5, 6)} = {0}: b = {5}","right":"b = {-5}","why":"The sign in front of a term belongs to its coefficient. Here −b = {5} in the formula."}},"worked_example":{"status":"draft","vars":{"a":2,"b":3,"c":-5},"problem":"Write the quadratic formula with the numbers of {quad(a, b, c)} = {0} put in.","steps":["Read off a = {a}, b = {b}, c = {c}, with their signs.","b² − {4}ac = {b * b} − {4} × {a} × {br(c)} = {b * b - 4 * a * c}.","{2}a = {2 * a} and −b = {-b}."],"answer":"x = ({-b} ± √{b * b - 4 * a * c}) / {2 * a}","checks":["b * b - 4 * a * c == 49"]},"teach":{"cards":[{"id":"c4m9-1","status":"draft","idea":"Read a, b and c with their signs from ax² + bx + c = {0}.","vars":{},"example":["{quad(3, -5, 2)} = {0}: a = {3}, b = {-5}, c = {2}"],"checks":[],"check":{"ref":"m4-9-abc"}},{"id":"c4m9-2","status":"draft","idea":"b² − {4}ac is the discriminant: the number under the square root in the formula.","vars":{},"example":["{quad(3, -5, 2)}: b² − {4}ac = {25} − {24} = {1}"],"checks":[],"check":{"ref":"m4-9-disc"}},{"id":"c4m9-3","status":"draft","idea":"The formula comes from completing the square on ax² + bx + c = {0}.","vars":{},"example":["divide by a → add (b/{2}a)² → take ± square root → x = (−b ± √(b² − {4}ac))/{2}a"],"checks":[],"check":{"id":"m4-9-step-card","type":"mcq","level":1,"review":"authored","sources":["quadratic-equations"],"vars":{"X":{"pick":[{"q":"Deriving the formula from ax² + bx + c = {0}, what is the first step?","r":"Divide every term by a","w":["Take the square root of both sides","Subtract b from both sides","Multiply every term by c"],"e":["There is no square yet to take the root of; first make the x² coefficient {1}.","bx is a term with x; subtracting b alone does not keep the equation balanced.","Multiplying by c does not help; the aim is x² with coefficient {1}."],"y":"Dividing by a gives x² + (b/a)x + c/a = {0}, ready for completing the square."},{"q":"After dividing by a and moving c/a, we have x² + (b/a)x = −c/a. What is added to both sides?","r":"(b/{2}a)²","w":["(b/a)²","b/{2}a","c/a"],"e":["Half of the coefficient b/a is b/{2}a; square that, not b/a.","b/{2}a must be squared to complete the square.","c/a is already used; the added term comes from the x coefficient."],"y":"Half of b/a is b/{2}a; adding (b/{2}a)² makes the left side (x + b/{2}a)²."},{"q":"The completed square is (x + b/{2}a)² = (b² − {4}ac)/{4}a². What is the next step?","r":"Take the square root of both sides, with ±","w":["Divide both sides by {4}a²","Square both sides","Take the square root with + only"],"e":["{4}a² is inside the fraction; the next step removes the square on the left.","Squaring makes it more complicated; we need to undo the square.","Both signs give roots; the ± is the reason a quadratic can have two roots."],"y":"x + b/{2}a = ±√(b² − {4}ac)/{2}a, then subtract b/{2}a."},{"q":"Which expression decides how many real roots ax² + bx + c = {0} has?","r":"b² − {4}ac","w":["b² + {4}ac","{2}a","−b"],"e":["The formula has b² minus {4}ac under the root.","{2}a is the denominator; it never changes the number of roots.","−b only shifts both roots together."],"y":"b² − {4}ac is under the square root: positive gives two roots, zero one, negative none."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is {answer}."]}}]},"questions":[{"id":"m4-9-abc","type":"mcq","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"a":{"int":[2,7]},"b":{"int":[-9,9]},"c":{"int":[-9,9]}},"prompt":"In {quad(a, b, c)} = {0}, what are a, b and c?","correct":"a = {a}, b = {b}, c = {c}","distractors":[{"text":"a = {a}, b = {-b}, c = {c}","misconception":"bsign"},{"text":"a = {a}, b = {b}, c = {-c}","misconception":"csign"},{"text":"a = {c}, b = {b}, c = {a}","misconception":"swap"}],"misconceptions":[{"id":"bsign","explain":"The sign in front of the x term belongs to b: b = {b}."},{"id":"csign","explain":"The sign in front of the number belongs to c: c = {c}."},{"id":"swap","explain":"a goes with x² and c is the number term."}],"solution":["a is the coefficient of x², b of x, c is the number term, each with its sign.","So the answer is {answer}."],"where":["b != 0 && c != 0","a != c","a != abs(c)"]},{"id":"m4-9-disc","type":"numeric","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"a":{"int":[1,5]},"b":{"int":[-9,9]},"c":{"int":[-9,9]}},"prompt":"Find the discriminant b² − {4}ac of {quad(a, b, c)} = {0}.","answer":"b * b - 4 * a * c","misconceptions":[{"id":"plus","wrong":"b * b + 4 * a * c","explain":"It is b² minus {4}ac: {b * b} − {br(4 * a * c)}."},{"id":"bsign","wrong":"-(b * b) - 4 * a * c","explain":"b² is always positive: ({b})² = {b * b}."},{"id":"twoac","wrong":"b * b - 2 * a * c","explain":"Use {4}ac, not {2}ac: {4} × {a} × {br(c)} = {4 * a * c}."}],"solution":["b² = {b * b}.","{4}ac = {4} × {a} × {br(c)} = {4 * a * c}.","b² − {4}ac = {b * b} − {br(4 * a * c)} = {answer}."],"where":["b != 0 && c != 0","b * b - 4 * a * c != b * b + 4 * a * c"],"signed":true},{"id":"m4-9-step","type":"mcq","level":2,"review":"authored","sources":["quadratic-equations"],"vars":{"X":{"pick":[{"q":"Deriving the formula from ax² + bx + c = {0}, what is the first step?","r":"Divide every term by a","w":["Take the square root of both sides","Subtract b from both sides","Multiply every term by c"],"e":["There is no square yet to take the root of; first make the x² coefficient {1}.","bx is a term with x; subtracting b alone does not keep the equation balanced.","Multiplying by c does not help; the aim is x² with coefficient {1}."],"y":"Dividing by a gives x² + (b/a)x + c/a = {0}, ready for completing the square."},{"q":"After dividing by a and moving c/a, we have x² + (b/a)x = −c/a. What is added to both sides?","r":"(b/{2}a)²","w":["(b/a)²","b/{2}a","c/a"],"e":["Half of the coefficient b/a is b/{2}a; square that, not b/a.","b/{2}a must be squared to complete the square.","c/a is already used; the added term comes from the x coefficient."],"y":"Half of b/a is b/{2}a; adding (b/{2}a)² makes the left side (x + b/{2}a)²."},{"q":"The completed square is (x + b/{2}a)² = (b² − {4}ac)/{4}a². What is the next step?","r":"Take the square root of both sides, with ±","w":["Divide both sides by {4}a²","Square both sides","Take the square root with + only"],"e":["{4}a² is inside the fraction; the next step removes the square on the left.","Squaring makes it more complicated; we need to undo the square.","Both signs give roots; the ± is the reason a quadratic can have two roots."],"y":"x + b/{2}a = ±√(b² − {4}ac)/{2}a, then subtract b/{2}a."},{"q":"Which expression decides how many real roots ax² + bx + c = {0} has?","r":"b² − {4}ac","w":["b² + {4}ac","{2}a","−b"],"e":["The formula has b² minus {4}ac under the root.","{2}a is the denominator; it never changes the number of roots.","−b only shifts both roots together."],"y":"b² − {4}ac is under the square root: positive gives two roots, zero one, negative none."}]}},"prompt":"{X.q}","correct":"{X.r}","distractors":[{"text":"{X.w[0]}","misconception":"w0"},{"text":"{X.w[1]}","misconception":"w1"},{"text":"{X.w[2]}","misconception":"w2"}],"misconceptions":[{"id":"w0","explain":"{X.e[0]}"},{"id":"w1","explain":"{X.e[1]}"},{"id":"w2","explain":"{X.e[2]}"}],"solution":["{X.y}","So the answer is {answer}."]},{"id":"m4-9-sub","type":"mcq","level":2,"review":"rule","sources":["quadratic-equations"],"vars":{"a":{"int":[1,5]},"b":{"int":[-9,9]},"c":{"int":[-9,9]}},"prompt":"Which is the quadratic formula with the numbers of {quad(a, b, c)} = {0} put in?","correct":"x = ({-b} ± √{b * b - 4 * a * c}) / {2 * a}","distractors":[{"text":"x = ({b} ± √{b * b - 4 * a * c}) / {2 * a}","misconception":"minusb"},{"text":"x = ({-b} ± √{b * b + 4 * a * c}) / {2 * a}","misconception":"plus"},{"text":"x = ({-b} ± √{b * b - 4 * a * c}) / {a}","misconception":"twoa"}],"misconceptions":[{"id":"minusb","explain":"The formula starts with −b: −({b}) = {-b}."},{"id":"plus","explain":"Under the root it is b² minus {4}ac: {b * b} − {br(4 * a * c)} = {b * b - 4 * a * c}."},{"id":"twoa","explain":"Divide by {2}a = {2 * a}, not by a."}],"solution":["a = {a}, b = {b}, c = {c}.","−b = {-b}; b² − {4}ac = {b * b - 4 * a * c}; {2}a = {2 * a}.","So the answer is {answer}."],"where":["b != 0 && c != 0","b * b - 4 * a * c > 0","b * b + 4 * a * c != b * b - 4 * a * c","a != 2 * a"]},{"id":"m4-9-nature","type":"numeric","level":3,"review":"rule","sources":["quadratic-equations"],"vars":{"a":{"int":[1,4]},"b":{"int":[-8,8]},"c":{"int":[-6,6]}},"prompt":"For {quad(a, b, c)} = {0}, the discriminant is {b * b - 4 * a * c}. How many real roots does the equation have? (Type 0, 1 or 2.)","answer":"b * b - 4 * a * c > 0 ? 2 : b * b - 4 * a * c == 0 ? 1 : 0","misconceptions":[{"id":"always2","wrong":"b * b - 4 * a * c > 0 ? 1 : 2","explain":"Look at the sign of {b * b - 4 * a * c}: positive gives {2}, zero {1}, negative {0}."}],"solution":["Under the square root is b² − {4}ac = {b * b - 4 * a * c}.","Positive: two roots (±). Zero: one repeated root. Negative: no real square root, so no real roots.","So the answer is {answer}."],"where":["c != 0"]}]},"10":{"subject":"mathematics","class":"Form 4","lesson_no":10,"language":"en","prerequisites":[9],"skills":[{"id":"m4-10","name":"Solve quadratic equations using the quadratic formula"}],"note":{"status":"draft","text":"The quadratic formula solves any quadratic equation ax² + bx + c = 0:\nx = (−b ± √(b² − 4ac)) / 2a.\nSteps: rearrange to ax² + bx + c = 0; write down a, b, c with signs; work out b² − 4ac; take its square root; work out the two roots, one with + and one with −; round at the end.\nExample: 2x² + 3x − 4 = 0: b² − 4ac = 9 + 32 = 41, so x = (−3 ± √41)/4, x ≈ 0.85 or x ≈ −2.35.\nDivide the whole top by 2a, not just the square root.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to solve any quadratic equation with the formula, giving exact roots or roots to {2} decimal places.\nBuilds on: Lesson {9} (where the formula comes from) and Lesson {7} (rearranging and rejecting roots).\nLeads to: the discriminant and the nature of roots, and solving word problems in physics and business."},{"heading":"The method","text":"Solve {quad(2, 3, -4)} = {0}.\n• a = {2}, b = {3}, c = {-4}.\n• b² − {4}ac = {9} − {4} × {2} × {br(-4)} = {9} + {32} = {41}.\n• x = ({-3} ± √{41}) / {4}.\n• √{41} ≈ {roundTo(sqrt(41), 0.0001)}, so x ≈ ({-3} + {roundTo(sqrt(41), 0.0001)})/{4} ≈ {roundTo((-3 + sqrt(41)) / 4, 0.01)} or x ≈ ({-3} − {roundTo(sqrt(41), 0.0001)})/{4} ≈ {roundTo((-3 - sqrt(41)) / 4, 0.01)}.\nKeep all the calculator digits until the last step, then round."},{"heading":"Traps to avoid","text":"• −b changes the sign of b: if b = {-6}, then −b = {6}.\n• −{4}ac with a negative c becomes a plus: c = {-4} gives −{4} × {2} × {br(-4)} = +{32}.\n• The whole top is divided by {2}a: ({-3} + √{41})/{4}, not {-3} + √{41}/{4}.\n• Rearrange first: x(x + {3}) = {5} is {quad(1, 3, -5)} = {0}, so c = {-5}.\nIf b² − {4}ac is negative there are no real roots: the calculator gives an error for the square root."}],"key_words":[{"word":"quadratic formula","meaning":"x = (−b ± √(b² − {4}ac)) / {2}a"},{"word":"decimal places","meaning":"digits after the decimal point; {2} d.p. means hundredths"},{"word":"exact","meaning":"left as a surd or fraction, not rounded"}],"examples":["{quad(1, -6, 4)} = {0} → x = {3} ± √{5} ≈ {roundTo(3 + sqrt(5), 0.01)} or {roundTo(3 - sqrt(5), 0.01)}","{quad(1, -1, -6)} = {0} → x = ({1} ± {5})/{2} = {3} or {-2}"],"mistake":{"wrong":"x = {-3} + √{41}/{4}","right":"x = ({-3} + √{41})/{4}","why":"The fraction line goes under the whole top. Work out {-3} + √{41} first, then divide by {4}."}},"worked_example":{"status":"draft","vars":{"a":2,"b":3,"c":-4},"problem":"Solve {quad(a, b, c)} = {0}, giving the roots to {2} decimal places.","steps":["a = {a}, b = {b}, c = {c}.","b² − {4}ac = {b * b} − {4} × {a} × {br(c)} = {b * b - 4 * a * c}; √{b * b - 4 * a * c} ≈ {roundTo(sqrt(b * b - 4 * a * c), 0.0001)}.","x = ({-b} + {roundTo(sqrt(b * b - 4 * a * c), 0.0001)}) / {2 * a} ≈ {roundTo((-b + sqrt(b * b - 4 * a * c)) / (2 * a), 0.01)}.","x = ({-b} − {roundTo(sqrt(b * b - 4 * a * c), 0.0001)}) / {2 * a} ≈ {roundTo((-b - sqrt(b * b - 4 * a * c)) / (2 * a), 0.01)}."],"answer":"x ≈ {roundTo((-b + sqrt(b * b - 4 * a * c)) / (2 * a), 0.01)} or x ≈ {roundTo((-b - sqrt(b * b - 4 * a * c)) / (2 * a), 0.01)}","checks":["b * b - 4 * a * c == 41"]},"teach":{"cards":[{"id":"c4m10-1","status":"draft","idea":"When b² − {4}ac is a square number, the roots are exact.","vars":{},"example":["{quad(1, -2, -15)} = {0}: b² − {4}ac = {64}, √{64} = {8}, x = ({2} ± {8})/{2} = {5} or {-3}"],"checks":[],"check":{"ref":"m4-10-exact"}},{"id":"c4m10-2","status":"draft","idea":"Otherwise use a calculator for the square root and round only at the end.","vars":{},"example":["{quad(1, 4, 1)} = {0}: x = ({-4} ± √{12})/{2} ≈ {roundTo((-4 + sqrt(12)) / 2, 0.01)} or {roundTo((-4 - sqrt(12)) / 2, 0.01)}"],"checks":[],"check":{"ref":"m4-10-dp"}},{"id":"c4m10-3","status":"draft","idea":"Divide the whole top by {2}a, not only the square root.","vars":{},"example":["({-4} + √{12})/{2} = {-2} + √{3}, not {-4} + √{12}/{2}"],"checks":[],"check":{"id":"m4-10-small-card","type":"numeric","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"a":{"int":[1,4]},"b":{"int":[-9,9]},"c":{"int":[-9,9]}},"prompt":"Solve {quad(a, b, c)} = {0}. Give the smaller root to {2} decimal places.","answer":"roundTo((-b - sqrt(b * b - 4 * a * c)) / (2 * a), 0.01)","misconceptions":[{"id":"big","wrong":"roundTo((-b + sqrt(b * b - 4 * a * c)) / (2 * a), 0.01)","explain":"That is the larger root (with +). The smaller one uses −."},{"id":"plusb","wrong":"roundTo((b - sqrt(b * b - 4 * a * c)) / (2 * a), 0.01)","explain":"The formula starts with −b = {-b}."},{"id":"ona","wrong":"roundTo((-b - sqrt(b * b - 4 * a * c)) / a, 0.01)","explain":"Divide by {2}a = {2 * a}, not by a."}],"solution":["b² − {4}ac = {b * b - 4 * a * c}.","The smaller root uses −: x = ({-b} − √{b * b - 4 * a * c}) / {2 * a}.","x ≈ {answer}."],"where":["b != 0 && c != 0","b * b - 4 * a * c > 0","!isPerfectSquare(b * b - 4 * a * c)","abs((-b - sqrt(b * b - 4 * a * c)) / (2 * a) * 1000 - round((-b - sqrt(b * b - 4 * a * c)) / (2 * a) * 1000)) > 0.01 || abs(round((-b - sqrt(b * b - 4 * a * c)) / (2 * a) * 1000)) % 10 != 5"],"signed":true}}]},"questions":[{"id":"m4-10-exact","type":"numeric","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"p":{"int":[-9,9]},"q":{"int":[-9,9]}},"prompt":"Use the quadratic formula to solve {quad(1, -(p + q), p * q)} = {0}. Give the larger root.","answer":"max(p, q)","misconceptions":[{"id":"nohalf","wrong":"p + q + abs(p - q)","explain":"Divide the whole top by {2}a = {2}: ({p + q} + {abs(p - q)}) / {2}."},{"id":"minusb","wrong":"max(-p, -q)","explain":"−b = {p + q}, not {-(p + q)}: the sign of b changes."}],"solution":["b² − {4}ac = {(p + q) * (p + q)} − {4 * p * q} = {(p - q) * (p - q)}, and its square root is {abs(p - q)}.","x = ({p + q} ± {abs(p - q)}) / {2}.","The larger root is ({p + q} + {abs(p - q)}) / {2} = {answer}."],"where":["p != q","p + q != 0","p * q != 0","max(-p, -q) != max(p, q)"],"signed":true},{"id":"m4-10-dp","type":"numeric","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"a":{"int":[1,4]},"b":{"int":[-9,9]},"c":{"int":[-9,9]}},"prompt":"Solve {quad(a, b, c)} = {0}. Give the larger root to {2} decimal places.","answer":"roundTo((-b + sqrt(b * b - 4 * a * c)) / (2 * a), 0.01)","misconceptions":[{"id":"plusb","wrong":"roundTo((b + sqrt(b * b - 4 * a * c)) / (2 * a), 0.01)","explain":"The formula starts with −b = {-b}."},{"id":"rootonly","wrong":"roundTo(-b + sqrt(b * b - 4 * a * c) / (2 * a), 0.01)","explain":"Divide the whole top, ({-b} + √{b * b - 4 * a * c}), by {2 * a}."},{"id":"ona","wrong":"roundTo((-b + sqrt(b * b - 4 * a * c)) / a, 0.01)","explain":"Divide by {2}a = {2 * a}, not by a."}],"solution":["b² − {4}ac = {b * b - 4 * a * c}.","x = ({-b} + √{b * b - 4 * a * c}) / {2 * a}.","x ≈ {answer}."],"where":["b != 0 && c != 0","b * b - 4 * a * c > 0","!isPerfectSquare(b * b - 4 * a * c)","abs((-b + sqrt(b * b - 4 * a * c)) / (2 * a) * 1000 - round((-b + sqrt(b * b - 4 * a * c)) / (2 * a) * 1000)) > 0.01 || abs(round((-b + sqrt(b * b - 4 * a * c)) / (2 * a) * 1000)) % 10 != 5"],"signed":true},{"id":"m4-10-small","type":"numeric","level":2,"review":"rule","sources":["quadratic-equations"],"vars":{"a":{"int":[1,4]},"b":{"int":[-9,9]},"c":{"int":[-9,9]}},"prompt":"Solve {quad(a, b, c)} = {0}. Give the smaller root to {2} decimal places.","answer":"roundTo((-b - sqrt(b * b - 4 * a * c)) / (2 * a), 0.01)","misconceptions":[{"id":"big","wrong":"roundTo((-b + sqrt(b * b - 4 * a * c)) / (2 * a), 0.01)","explain":"That is the larger root (with +). The smaller one uses −."},{"id":"plusb","wrong":"roundTo((b - sqrt(b * b - 4 * a * c)) / (2 * a), 0.01)","explain":"The formula starts with −b = {-b}."},{"id":"ona","wrong":"roundTo((-b - sqrt(b * b - 4 * a * c)) / a, 0.01)","explain":"Divide by {2}a = {2 * a}, not by a."}],"solution":["b² − {4}ac = {b * b - 4 * a * c}.","The smaller root uses −: x = ({-b} − √{b * b - 4 * a * c}) / {2 * a}.","x ≈ {answer}."],"where":["b != 0 && c != 0","b * b - 4 * a * c > 0","!isPerfectSquare(b * b - 4 * a * c)","abs((-b - sqrt(b * b - 4 * a * c)) / (2 * a) * 1000 - round((-b - sqrt(b * b - 4 * a * c)) / (2 * a) * 1000)) > 0.01 || abs(round((-b - sqrt(b * b - 4 * a * c)) / (2 * a) * 1000)) % 10 != 5"],"signed":true},{"id":"m4-10-rearrange","type":"numeric","level":2,"review":"rule","sources":["quadratic-equations"],"vars":{"b":{"int":[-7,7]},"k":{"int":[2,20]}},"prompt":"Solve x({poly([1, 'x'], [b, ''])}) = {k}. Give the positive root to {2} decimal places.","answer":"roundTo((-b + sqrt(b * b + 4 * k)) / 2, 0.01)","misconceptions":[{"id":"csign","wrong":"roundTo((-b + sqrt(b * b - 4 * k)) / 2, 0.01)","explain":"Moving {k} to the left makes c = {-k}, so −{4}ac = +{4 * k}.","when":"b * b - 4 * k > 0"}],"solution":["Expand and make one side {0}: {quad(1, b, -k)} = {0}.","a = {1}, b = {b}, c = {-k}: b² − {4}ac = {b * b + 4 * k}.","x = ({-b} + √{b * b + 4 * k}) / {2} ≈ {answer}."],"where":["b != 0","!isPerfectSquare(b * b + 4 * k)","abs((-b + sqrt(b * b + 4 * k)) / 2 * 1000 - round((-b + sqrt(b * b + 4 * k)) / 2 * 1000)) > 0.01 || abs(round((-b + sqrt(b * b + 4 * k)) / 2 * 1000)) % 10 != 5"]},{"id":"m4-10-word","type":"numeric","level":3,"review":"rule","sources":["quadratic-equations"],"vars":{"u":{"int":[5,20]},"s":{"int":[10,60]}},"prompt":"A ball is thrown up from a cliff. After t seconds its height above the sea is h = {u}t − {5}t² + {s} metres. Use the quadratic formula to find when it reaches the sea (h = {0}). Give t to {2} decimal places.","answer":"roundTo((u + sqrt(u * u + 20 * s)) / 10, 0.01)","misconceptions":[{"id":"neg","wrong":"roundTo((u - sqrt(u * u + 20 * s)) / 10, 0.01)","explain":"That root is negative: the ball cannot reach the sea before it is thrown."},{"id":"five","wrong":"roundTo((u + sqrt(u * u + 20 * s)) / 5, 0.01)","explain":"Divide by {2}a = {10}, not by {5}."}],"solution":["Set h = {0}: {quad(-5, u, s, 't')} = {0}, or {quad(5, -u, -s, 't')} = {0}.","a = {5}, b = {-u}, c = {-s}: b² − {4}ac = {u * u} + {20 * s} = {u * u + 20 * s}.","t = ({u} ± √{u * u + 20 * s}) / {10}. Time cannot be negative, so take +.","t ≈ {answer} s."],"unit":"s","where":["!isPerfectSquare(u * u + 20 * s)","abs((u + sqrt(u * u + 20 * s)) / 10 * 1000 - round((u + sqrt(u * u + 20 * s)) / 10 * 1000)) > 0.01 || abs(round((u + sqrt(u * u + 20 * s)) / 10 * 1000)) % 10 != 5"]}]},"11":{"subject":"mathematics","class":"Form 4","lesson_no":11,"language":"en","prerequisites":[7,10],"skills":[{"id":"m4-11","name":"Form a quadratic equation from its roots; sum and product of roots"}],"note":{"status":"draft","text":"If the roots are p and q, the equation is (x − p)(x − q) = 0, that is x² − (p + q)x + pq = 0.\nIn words: x² − (sum of roots)x + (product of roots) = 0.\nExample: roots 3 and −5: sum −2, product −15, so x² + 2x − 15 = 0.\nFractions: roots ½ and 3 give (2x − 1)(x − 3) = 0, that is 2x² − 7x + 3 = 0.\nFor ax² + bx + c = 0, the sum of the roots is −b/a and the product is c/a. Then α² + β² = (α + β)² − 2αβ, without finding the roots.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to write the equation that has two given roots, and find the sum, the product and expressions such as α² + β² without solving.\nBuilds on: Lesson {7} (roots from factors) and Lesson {10} (the formula).\nLeads to: checking answers to quadratic equations quickly and, in Form Five, harder problems on roots."},{"heading":"From roots back to the equation","text":"Solving goes from the equation to the roots. Here we go backwards.\nIf x = {3} is a root, then x − {3} is a factor. If x = {-5} is a root, then x + {5} is a factor.\nSo the equation with roots {3} and {-5} is {lin2(1, -3, 1, 5)} = {0}, that is {quad(1, 2, -15)} = {0}.\nPattern: x² − (sum of roots)x + (product of roots) = {0}. Sum {-2}, product {-15}: x² − ({-2})x + ({-15}) = {quad(1, 2, -15)}.\nFor a fractional root such as {frac(1, 2)}, use the factor {mono(2, 'x')} − {1} to keep whole numbers."},{"heading":"Sum and product for any quadratic","text":"Divide ax² + bx + c = {0} by a: x² + (b/a)x + c/a = {0}. Compare with x² − (sum)x + product:\n• sum of roots α + β = −b/a\n• product αβ = c/a\nExample: {quad(2, -7, 3)} = {0} has α + β = {frac(7, 2)} and αβ = {frac(3, 2)}.\nUse these to find other expressions without solving: α² + β² = (α + β)² − {2}αβ = {frac(49, 4)} − {3} = {frac(37, 4)}."}],"key_words":[{"word":"sum of roots","meaning":"α + β = −b/a"},{"word":"product of roots","meaning":"αβ = c/a"},{"word":"α, β","meaning":"Greek letters alpha and beta, often used for the two roots"}],"examples":["roots {2} and {7}: {quad(1, -9, 14)} = {0}","roots {-1} and {-4}: {quad(1, 5, 4)} = {0}","{quad(1, -3, -10)} = {0}: sum {3}, product {-10}"],"mistake":{"wrong":"roots {2} and {7}: {quad(1, 9, 14)} = {0}","right":"{quad(1, -9, 14)} = {0}","why":"Check by putting x = {2} in: {4} + {18} + {14} is not {0}. The x term is minus the sum."}},"worked_example":{"status":"draft","vars":{"p":3,"q":-5},"problem":"Form the quadratic equation whose roots are {p} and {q}.","steps":["Sum of the roots: {p} + {br(q)} = {p + q}.","Product of the roots: {p} × {br(q)} = {p * q}.","x² − (sum)x + (product) = {0}.","Check: {lin2(1, -p, 1, -q)} = {quad(1, -(p + q), p * q)}."],"answer":"{quad(1, -(p + q), p * q)} = {0}","checks":["p + q == -2","p * q == -15"]},"teach":{"cards":[{"id":"c4m11-1","status":"draft","idea":"Roots p and q come from the brackets (x − p)(x − q): the sign inside each bracket is opposite to the root.","vars":{},"example":["roots {4} and {-2}: {lin2(1, -4, 1, 2)} = {0}"],"checks":[],"check":{"ref":"m4-11-form"}},{"id":"c4m11-2","status":"draft","idea":"x² − (sum of roots)x + (product of roots) = {0}.","vars":{},"example":["roots {4} and {-2}: sum {2}, product {-8}: {quad(1, -2, -8)} = {0}"],"checks":[],"check":{"ref":"m4-11-sum"}},{"id":"c4m11-3","status":"draft","idea":"For ax² + bx + c = {0}: sum of roots = −b/a, product = c/a.","vars":{},"example":["{quad(2, -6, 4)} = {0}: sum = {6}/{2} = {3}, product = {4}/{2} = {2}"],"checks":[],"check":{"id":"m4-11-prod-card","type":"numeric","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"a":{"int":[2,6]},"b":{"int":[-9,9]},"k":{"int":[-6,6]}},"prompt":"What is the product of the roots of {quad(a, b, a * k)} = {0}?","answer":"k","misconceptions":[{"id":"c","wrong":"a * k","explain":"Divide c by a: {a * k} ÷ {a} = {k}."},{"id":"neg","wrong":"-k","explain":"The product is +c/a = {k}; only the sum has the minus sign."},{"id":"sum","wrong":"-b / a","explain":"That is the sum of the roots. The product is c/a."}],"solution":["Divide by a = {a}: product = c/a = {a * k}/{a}.","So the product is {answer}."],"where":["b != 0 && k != 0","k != -k","b % a != 0 || -b / a != k"],"signed":true}}]},"questions":[{"id":"m4-11-form","type":"mcq","level":1,"review":"rule","sources":["quadratic-equations"],"vars":{"p":{"int":[-9,9]},"q":{"int":[-9,9]}},"prompt":"Which equation has roots {p} and {q}?","correct":"{quad(1, -(p + q), p * q)} = {0}","distractors":[{"text":"{quad(1, p + q, p * q)} = {0}","misconception":"sign"},{"text":"{quad(1, -(p + q), -p * q)} = {0}","misconception":"prod"},{"text":"{quad(1, -p * q, p + q)} = {0}","misconception":"swap"}],"misconceptions":[{"id":"sign","explain":"The x term is minus the sum: −({p + q})x. Check: x = {p} must make it {0}."},{"id":"prod","explain":"The number term is the product {p} × {br(q)} = {p * q}."},{"i // v1 (Maths only, 2026-10-05) had lessons keyed by number and one current lesson; it is upgraded in place.
const KEY = "psalmspreps-maths-v1";  // kept so existing progress survives the upgrade
const fresh = () => ({ v: 2, readiness: null, subject: "maths", lessons: {}, current: {} });
/** A saved lesson in progress is kept only if its flow is usable; a damaged one is dropped, never a blank page. */
const usable = (c) => c && c.flow && Array.isArray(c.flow.steps) && Array.isArray(c.rows) && Number.isInteger(c.lesson);
const cleanCurrent = (cur) => Object.fromEntries(Object.entries(cur || {}).filter(([, c]) => usable(c)));
function upgrade(s) {
  if (s.v === 2) return { ...fresh(), ...s, current: cleanCurrent(s.current) };
  if (s.v !== 1) return fresh();
  const lessons = Object.fromEntries(Object.entries(s.lessons || {}).map(([n, x]) => [`maths:${n}`, x]));
  return { ...fresh(), readiness: s.readiness || null, lessons, current: cleanCurrent({ maths: s.current }) };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    return s ? upgrade(s) : fresh();
  } catch { return fresh(); }  // private mode, blocked storage or a broken value: start fresh
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* still works, just forgets */ } };

/** A typed answer box (numbers or words): Enter or "Check" submits; the engine picks the keyboard. */
function answerBox(q, finish, inline = false) {
  const input = el("input", { type: "text", inputmode: inputModeFor(q), autocomplete: "off", autocorrect: "off", autocapitalize: "off",
    spellcheck: "false", "aria-label": T("Your answer"), class: inline ? "blank-input" : "" });
  const go = () => { const v = normaliseInput(input.value, q); if (v) finish(v); };
  input.addEventListener("keydown", (e) => e.key === "Enter" && go());
  setTimeout(() => input.focus(), 50);
  return { input, check: button(T("Check"), go, "primary") };
}

/** Cloze: the sentence with its blank inline. Typed: a box in the gap. Choose: a dotted gap, options below. */
function clozeSentence(q, box = null) {
  const [before, after] = q.sentence.split("___");
  return el("div", { class: "sentence" }, before, box || el("span", { class: "blank", "aria-label": "blank" }, " "), after);
}

/** Word order: tap a word to place it; tap a placed word to send it back. The final . ? or ! is fixed. */
function wordOrder(q, finish) {
  const placed = [];
  const line = el("div", { class: "built", "aria-live": "polite" });
  const pool = el("div", { class: "tiles" });
  const done = button(T("Check"), () => placed.length === q.items.length && finish([...placed]), "primary");
  const redraw = () => {
    line.replaceChildren(...(placed.length
      ? [...placed.map((i, k) => button(q.items[i], () => { placed.splice(k, 1); redraw(); }, "tile placed")), ...(q.end ? [el("span", { class: "end" }, q.end)] : [])]
      : [el("span", { class: "muted" }, T("Tap the words below."))]));
    fill(pool, q.items.map((t, i) => (placed.includes(i) ? null : button(t, () => { placed.push(i); redraw(); }, "tile"))));
    done.disabled = placed.length !== q.items.length;
  };
  redraw();
  return [para(T("Tap a word to add it. Tap a word in your sentence to take it out."), "muted"), line, pool, done];
}

/** Matching: tap a left item, then a right item, to pair them; tap a pair to undo it. */
function matching(q, finish) {
  const pairOf = q.left.map(() => null);  // left index → right index
  let picked = null;
  const done = button(T("Check"), () => pairOf.every((r) => r !== null) && finish([...pairOf]), "primary");
  const wrap = el("div", {});
  const redraw = () => {
    const rightUsed = new Map(pairOf.map((r, l) => [r, l]).filter(([r]) => r !== null));
    const badge = (n) => el("span", { class: "badge", "aria-hidden": "true" }, String(n + 1));

    const rights = q.right.map((t, r) => {

}

/** Sorting (matching with groups): tap a word, then tap its group; tap a word inside a group to take it out. */
function sorting(q, finish) {
  const groupOf = q.left.map(() => null);
  let picked = null;
  const done = button(T("Check"), () => groupOf.every((g) => g !== null) && finish([...groupOf]), "primary");
  const wrap = el("div", {});
  const redraw = () => {
    const loose = q.left.map((t, i) => (groupOf[i] === null ? button(t, () => { picked = picked === i ? null : i; redraw(); }, `tile${picked === i ? " picked" : ""}`) : null));
    const groups = q.right.map((g, gi) => el("div", { class: `group${picked !== null ? " ready" : ""}`, role: "button", tabindex: "0",
      onclick: (e) => { if (e.target.closest(".tile") || picked === null) return; groupOf[picked] = gi; picked = null; redraw(); },
      onkeydown: (e) => { if ((e.key === "Enter" || e.key === " ") && picked !== null) { e.preventDefault(); groupOf[picked] = gi; picked = null; redraw(); } } },
      el("div", { class: "group-name" }, g),
      el("div", { class: "tiles" }, ...q.left.map((t, i) => (groupOf[i] === gi ? button(t, () => { groupOf[i] = null; redraw(); }, "tile placed") : null)))));
    wrap.replaceChildren(el("div", { class: "tiles" }, ...loose), ...groups);
    done.disabled = groupOf.some((g) => g === null);
  };
  redraw();
  return [para(T("Tap a word, then tap its group. Tap a word in a group to take it out."), "muted"), wrap, done];
}

/** A base answer: the small base is printed after the box, so the pupil types only the digits (2026-10-24). */
const baseTag = (q) => el("span", { class: "base-tag", "aria-label": T("in base {a}", { a: q.base }) }, LIB().sub(q.base));
const baseTip = (q) => para(T("Type only the digits. The small {a} is already there.", { a: LIB().sub(q.base) }), "muted");

/** Shows q; calls onAnswer({result, ms}) when the pupil answers or presses "I don't know". */
function askQuestion(q, { kicker, title, onAnswer, bar = null, back = null }) {
  const t0 = performance.now();
  const finish = (response) => onAnswer({ result: check(q, response), ms: Math.round(performance.now() - t0), response });
  const body = [bar, header(kicker, title), el("div", { class: "prompt" }, q.prompt), figureBox(q.figure)];
  if (q.type === "blanks") {
    // a step-by-step line: one small box per blank, all checked together (2026-10-19)
    // a text value is a base numeral (the last box of a division ladder): a wider box, the base shown after it
    const inputs = q.answers.map((_, i) => el("input", { type: "text", inputmode: "numeric", autocomplete: "off",
      class: typeof q.answerValues[i] === "string" ? "blank-input wide" : "blank-input", "aria-label": T("Box {a}", { a: i + 1 }) }));
    const go = () => { const v = inputs.map((x) => normaliseInput(x.value, q)); if (v.every(Boolean)) finish(v); else inputs[v.findIndex((x) => !x)].focus(); };
    inputs.forEach((x, i) => x.addEventListener("keydown", (e) => { if (e.key === "Enter") (i < inputs.length - 1 && !inputs[i + 1].value ? inputs[i + 1].focus() : go()); }));
    setTimeout(() => inputs[0].focus(), 50);
    body.push(para(T("Fill in each box, then check."), "muted"),
      el("div", { class: "sentence blanks" }, q.parts.flatMap((p, i) => (i < inputs.length ? [p, inputs[i], q.base && typeof q.answerValues[i] === "string" ? baseTag(q) : null] : [p]))),
      q.base ? baseTip(q) : null, button(T("Check"), go, "primary"));
  } else if (q.type === "numeric") {
    const { input, check: go } = answerBox(q, finish);
    body.push(el("div", { class: q.base ? "answer has-base" : "answer" }, input, q.base ? baseTag(q) : null, q.unit ? el("span", { class: "unit" }, q.unit) : null), q.base ? baseTip(q) : null, go);
  } else if (q.type === "cloze" && q.mode === "type") {
    const { input, check: go } = answerBox(q, finish, true);
    body.push(clozeSentence(q, input), go);
  } else if (q.type === "cloze") {
    body.push(clozeSentence(q), el("div", { class: "options" }, q.options.map((o, i) => button(o.text, () => finish(i), "option"))));
  } else if (q.type === "mcq" || q.type === "spot_error") {
    if (q.type === "spot_error") body.push(para(T("Tap the one that is wrong."), "muted"));
    body.push(el("div", { class: "options" }, q.options.map((o, i) => button(o.text, () => finish(i), "option"))));
  } else if (q.type === "ordering") {
    const chosen = [];
    const list = el("ol", { class: "chosen" });
    const pool = el("div", { class: "options" });
    const redraw = () => {
      list.replaceChildren(...chosen.map((i) => el("li", {}, q.items[i])));
      fill(pool, q.items.map((t, i) => (chosen.includes(i) ? null : button(t, () => { chosen.push(i); redraw(); }, "option"))));
      if (chosen.length === q.items.length) finish([...chosen]);
    };
    body.push(para(T("Tap them in order."), "muted"), list, pool, button(T("Start again"), () => { chosen.length = 0; redraw(); }, "link"));
    redraw();
  } else if (q.type === "word_order") {
    body.push(...wordOrder(q, finish));
  } else if (q.type === "matching") {
    body.push(...(q.groups ? sorting(q, finish) : matching(q, finish)));
  }
  body.push(button(T("I don't know"), () => finish(DONT_KNOW), "idk"), back);
  screen(...body);
}

const recordOf = (q, r, ms, phase, response) => ({
  phase, id: q.id, level: q.level, result: r.correct ? "right" : r.dontKnow ? "idk" : "wrong",
  seconds: Math.round(ms / 100) / 10, misconception: r.misconception?.id || "",
  typed: typedText(q, response, r), expected: expectedText(q),

// For "Copy results" (2026-10-24): what the pupil answered and the right answer, so a mistake the app did not
// foresee can still be seen. Step-by-step boxes: each box, a wrong one marked ✗.
const short = (x) => String(x ?? "").replace(/\s+/g, " ").trim().slice(0, 60);
function typedText(q, response, r) {
  if (response === undefined || response === DONT_KNOW) return "";
  if (q.type === "blanks") return response.map((v, i) => `${v}${r.wrongBlanks?.includes(i) ? "✗" : ""}`).join(" | ");
  if (q.options && Number.isInteger(response)) return short(q.options[response]?.text);
  if (Array.isArray(response)) return short(response.map((i) => (q.items || q.right || [])[i] ?? i).join(" / "));
  return short(response);
}
function expectedText(q) {
  if (q.type === "blanks") return q.answers.join(" | ");
  if (q.type === "numeric" || (q.type === "cloze" && q.mode === "type")) return short(`${q.answer}${q.base ? LIB().sub(q.base) : ""}`);
  if (q.options && Number.isInteger(q.correctIndex)) return short(q.options[q.correctIndex]?.text);
  return "";
}

// Lesson content is loaded one subject at a time in the installed app (subjects/<id>.js); the single-file copy has

const loading = {};
function loadSubject(s) {

const dayOf = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayNum = (s) => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 86400000);
/** Marks today as a learning day (called on every answer in a lesson). */
function recordDay() {
  state.days = state.days || [];
  const t = dayOf();
  if (state.days[state.days.length - 1] !== t) state.days.push(t);
}
/** Learning days in the current run; a run survives up to two days off in a row. 0 if the last learning day was too long ago. */
function streak() {
  const days = [...new Set(state.days || [])].map(dayNum).sort((a, b) => a - b);
  if (!days.length || dayNum(dayOf()) - days[days.length - 1] > 3) return 0;
  let n = 1;
  for (let i = days.length - 1; i > 0 && days[i] - days[i - 1] <= 3; i--) n++;
  return n;
}
/** Stars for a finished lesson: 3 if at least 80% of first tries were right, 2 if at least half, otherwise 1. */
function starsOf(r) {
  if (!r?.done) return 0;
  if (r.stars) return r.stars;
  const first = r.rows.filter((x) => x.phase === "practice" && x.attempt === 1);
  const asked = first.length || r.rows.filter((x) => x.attempt === 1).length;
  if (!asked) return 3;
  const right = (first.length ? first : r.rows.filter((x) => x.attempt === 1)).filter((x) => x.result === "right").length / asked;
  return right >= 0.8 ? 3 : right >= 0.5 ? 2 : 1;
}
const doneIn = (s) => LESSONS[s].filter((n) => state.lessons[lessonKey(s, n)]?.done);
