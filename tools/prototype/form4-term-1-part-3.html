}, Italy’s invasion of Ethiopia in {1935}, German remilitarisation of the Rhineland in {1936}, and Munich in {1938}. German occupation of the Czech lands in March {1939} undermined further promises of restraint. The German-Soviet non-aggression pact in August {1939} reduced Hitler’s immediate fear of a two-front war; it did not create a permanent alliance. The Soviet Union also invaded Poland later that September. Different crises weakened the international order before the invasion that triggered the wider European war."},{"heading":"Reason and check","text":"Build an explanation rather than a list: identify a condition, explain how it enabled aggression, then connect it to a decision. Distinguish motives, failed responses and the trigger. Compare diplomatic promises with subsequent actions. A contemporary speech reveals its speaker’s position; it does not prove that every citizen agreed or that a promised peace occurred."}],"key_words":[{"word":"expansionism","meaning":"a policy seeking territorial conquest and domination"},{"word":"appeasement","meaning":"concessions intended to avoid war with an aggressive power"},{"word":"failure of collective security","meaning":"the inability of international cooperation to restrain major aggression effectively"},{"word":"economic instability","meaning":"hardship that increased political tensions without making aggression inevitable"},{"word":"immediate European trigger","meaning":"Germany’s invasion of Poland leading to British and French declarations of war"}],"mistake":{"wrong":"Nazi expansion was simply a peaceful request with no conquest aim.","right":"expansionism: a policy seeking territorial conquest and domination.","why":"Expansionist policy involved deliberate conquest; economic hardship alone did not force that choice."}},"worked_example":{"status":"draft","vars":{},"problem":"Analyse this invented classroom source, not an archive quotation: Nazi leaders pursued an empire in eastern Europe and used force against n iers, drivers, producers and families had different experiences. French-administered Cameroon rallied to Free France in August 1940; this must not be confused with the British-administered territory or with independence. Contributions included military service, transport, supplies and production.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to explain why colonial rule drew Cameroonians into the conflict and distinguish military, labour and material contributions. Builds on: the causes of war and the division of Cameroon under British and French mandates. Leads to: wartime effects in each administered territory."},{"heading":"Explain the history","text":"Cameroon was divided into British- and French-administered mandate territories, not an independent state making a single war declaration. Imperial administration drew people and resources into the conflict. Recruitment could involve pressure as well as personal motives such as pay, livelihood or opposition to fascism. Soldiers, carriers, drivers, producers and families had different experiences. French-administered Cameroon rallied to Free France in August {1940}; this must not be confused with the British-administered territory or with independence. Contributions included military service, transport, supplies and production."},{"heading":"Follow the evidence and examples","text":"The conventional date of the Free French rallying is {27} August {1940}. Leclerc and associates secured control at Douala with local support and a change of authority, rather than a vote of every inhabitant. Ports and transport routes supported the Allied effort. Labour and agricultural output mattered alongside troops. British administration connected its Cameroons territory to the Nigerian wartime system. Avoid assigning every African campaign to every Cameroonian recruit: an individual’s unit and service record are needed for that claim."},{"heading":"Reason and check","text":"Separate reasons for involvement from roles performed. Colonial recruitment explains a route into service; carrying supplies describes a role. Ask who chose, who ordered and who bore costs. A military communiqué may reveal commanders’ aims while giving little about African workers or families. Compare it with service records and local accounts. Do not interpret administrative rallying as universal free consent."}],"key_words":[{"word":"colonial mobilisation","meaning":"administrative recruitment of people and resources through imperial rule"},{"word":"Free French rallying","meaning":"the shift of French-administered Cameroon to de Gaulle’s wartime movement"},{"word":"military contribution","meaning":"service in armed units and their operational support"},{"word":"civilian and material contribution","meaning":"work and supplies supporting operations beyond direct combat"}],"mistake":{"wrong":"Cameroon acted as a single independent government in the war.","right":"colonial mobilisation: administrative recruitment of people and resources through imperial rule.","why":"The territories were under different colonial administrations; mobilisation reflected those structures."}},"worked_example":{"status":"draft","vars":{},"problem":"Analyse this invented classroom source, not an archive quotation: A mandate administration calls for labour and supplies for its wartime effort.","steps":["Identify the action, actor and setting stated in the text.","Administrative recruitment of people and resources through imperial rule.","The territories were under different colonial administrations; mobilisation reflected those structures.","This practice text helps test reasoning; authenticate and compare real sources before claiming historical proof."],"answer":"colonial mobilisation","checks":[]},"teach":{"cards":[{"id":"y4-2-c1","status":"draft","idea":"Distinguish the historical features before explaining their relationship.","vars":{},"example":["colo  provided employment. Wartime experience and new political networks encouraged demands for representation and improved conditions. These developments were uneven; the war neither granted immediate independence nor gave every household the same result. Postwar plantation reorganisation led to the Cameroon Development Corporation, operating from {1947}."},{"heading":"Follow the evidence and examples","text":"Distinguish a wartime action from a later response. Enemy-property control during the conflict was not identical to the CDC’s postwar establishment. Plantation development created employment and infrastructure but continued disputes over land and working conditions, including Bakweri land concerns. The Cameroon Youth League formed in Lagos in {1940}, showing that political organisation already existed during the war. British administration remained linked to Nigeria. UN trusteeship in {1946} later added international scrutiny; it did not instantly remove British authority."},{"heading":"Reason and check","text":"Organise effects as political, economic and social, then show connections: plantation change affected labour, land and political claims. Explain both opportunities and burdens. Compare workers’ accounts with administrative reports. A later institution may be part of the postwar response without being created during the fighting. Avoid claiming uniform prosperity or a direct, automatic path from military service to independence."}],"key_words":[{"word":"enemy-property control","meaning":"wartime administration of German-owned assets by British authorities"},{"word":"postwar plantation reorganisation","meaning":"the establishment of the CDC after the conflict to operate plantation assets"},{"word":"political organisation","meaning":"collective activity seeking a stronger voice and representation"},{"word":"uneven social effects","meaning":"different experiences of employment pressures land and household burdens"}],"mistake":{"wrong":"All German plantations r red Cameroon’s Free French commitment brought recruitment, production demands and financial burdens. Scarcity and rising living costs could intensify workers’ grievances. Wartime mobilisation and discussion of reform helped expand political expectations, while colonial power and inequality continued. Trade-union activity developed during the later war years. In Douala in September 1945, labour conflict and violent repression exposed the gulf between claims of freedom and the conditions experienced locally. Neither rallying nor victory brought immediate independence.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to explain political openings and economic burdens and distinguish promised reform from continued colonial inequality. Builds on: wartime contributions and the Southern British Cameroons comparison. Leads to: Brazzaville and the rise of pressure groups."},{"heading":"Explain the history","text":"French-administered Cameroon’s Free French commitment brought recruitment, production demands and financial burdens. Scarcity and rising living costs could intensify workers’ grievances. Wartime mobilisation and discussion of reform helped expand political expectations, while colonial power and inequality continued. Trade-union activity developed during the later war years. In Douala in September {1945}, labour conflict and violent repression exposed the gulf between claims of freedom and the conditions experienced locally. Neither rallying nor victory brought immediate independence."},{"heading":"Follow the evidence and examples","text":"The USCC emerged in {1944} as an important union federation. Workers sought pay and conditions, while networks helped some activists move into wider politics. Postwar changes included representation through ARCAM and UN trusteeship in {1946}, but these were limited institutions within continued French administration. The UPC was founded in {1948}, after the fighting ended. Treat these as connected stages, not one event. Estimates of casualties and responsibility in the Douala violence need careful comparison; this lesson does not invent a precise death toll."},{"heading":"Reason and check","text":"Explain a chain: mobilisation and scarcity → grievances → organisation and demands → reform or repression. Do not assume that one reform abolished all inequality. Separate workers’ immediate objectives from every later party programme. Identify whether a source is a union appeal, official report or later account; compare what each includes and omits."}],"key_words":[{"word":"wartime economic burdens","meaning":"production demands and scarcity affecting workers and households"},{"word":"trade-union organisation","meaning":"collective worker action for pay rights and conditions"},{"word":"Douala conflict","meaning":"the labour confrontation and violent repression of September {1945}"},{"word":"limited postwar political opening","meaning":"new representation and scrutiny under continued French administration"}],"mistake":{"wrong":"Supporting Free France removed every economic hardship.","right":"wartime economic burdens: production demands and scarcity affecting workers and households.","why":"The contribution to war could increase burdens; political allegiance did not ensure prosperity."}},"worked_example":{"status":"draft","vars":{},"problem":"Analyse this invented classroom source, not an archive quotation: Supplies were directed towards war while shortages and living costs burdened local households.","steps":["Identify the action, actor and setting stated in the text.","Production demands and scarcity affecting workers and households.","The contribution to war could increase burdens; political allegiance did not ensure prosperity.","This practice text helps test reasoning; authenticate and compare real sources before claiming historical proof."],"answer":"wartime economic burdens","checks":[]},"teach":{"card terials and work. Participation did not mean equal rights, identical motives or uniform support for imperial rule.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to explain varied reasons for involvement and classify military and civilian roles using named regional examples. Builds on: Cameroonian mobilisation and contrasting wartime effects. Leads to: reform debates and the growth of African nationalism."},{"heading":"Explain the history","text":"Africa’s participation was diverse. Colonial powers recruited troops and labour and demanded production; individuals could also seek wages, defend homes or oppose Axis rule. Some recruitment involved coercion. North and East Africa were battlefields, and Africans also fought outside the continent. Soldiers from West and East Africa served in the Burma campaign against Japan. African producers, transport workers and households supported armies with food, raw materials and work. Participation did not mean equal rights, identical motives or uniform support for imperial rule."},{"heading":"Follow the evidence and examples","text":"Use distinct examples. Ethiopian resistance and Allied forces fought Italian occupation; North Africa saw major Allied-Axis campaigns. West African units served in Burma, alongside forces from other regions. Cameroon’s Free French contribution belonged to a particular imperial and territorial setting. Mining, farming, transport and provisioning supported operations beyond the battlefield. Overseas contact could broaden expectations, but veterans returned to differing conditions and political choices. Avoid turning a continental contribution into an unsupported biography of one recruit."},{"heading":"Reason and check","text":"For each example identify where, who and what role. Distinguish a reason for enlistment from a task performed. A photograph of an African soldier in Burma supports presence there; it does not by itself reveal willingness, pay or later nationalist beliefs. Compare recruitment records, personal accounts and production evidence. African agency and colonial pressure can both be part of the explanation."}],"key_words":[{"word":"imperial recruitment","meaning":"colonial authorities drawing people into their war effort"},{"word":"African battlefields","meaning":"fighting on the continent as part of the global conflict"},{"word":"overseas military service","meaning":"African troops serving in campaigns outside Africa"},{"word":"economic and logistical support","meaning":"production and movement of goods sustaining the war"}],"mistake":{"wrong":"Every recruit independently decided the colony’s foreign policy.","right":"imperial recruitment: colonial authorities drawing people into their war effort.","why":"Colonial authority structured mobilisation; individual motives and pressures varied."}},"worked_example":{"status":"draft","vars":{},"problem":"Analyse this invented classroom source, not an archive quotation: Officials recruit soldiers in a dependent territory for an imperial army.","steps":["Identify the action, actor and setting stated in the text.","Colonial authorities drawing people into their war effort.","Colonial authority structured mobilisation; individual motives and pressures varied.","This practice text helps test reasoning; authenticate and compare real sources before claiming historical proof."],"answer":"imperial recruitment","checks":[]},"teach":{"cards":[{"id":"y4-5-c1","status":"draft","idea":"Distinguish the historical features before explaining their relationship.","vars":{},"example":["imperial recruitment: colonial authorities drawing people into their war effort.","African battlefields: fighting on the continent as part of the global conflict.","overseas military service: African troops serving in campaigns outside Africa.","economic and logistical support: production and movement of goods sustaining the war."],"checks":[],"check":  of Africa experienced military campaigning.","truth":"false","explain":"African territory included major theatres of war as well as places supplying overseas operations."},{"text":"All African soldiers remained on the African continent throughout the war.","truth":"false","explain":"The Burma example demonstrates overseas service without proving that every recruit went there."},{"text":"An army needs combatants but no supplies or civilian labour.","truth":"false","explain":"Operations depended on food, transport and materials as well as combat service."}]},"pick":{"right":3,"wrong":1}}]},"6":{"subject":"history","class":"Form 4","lesson_no":6,"language":"en","prerequisites":[4,5],"skills":[{"id":"y4-6","name":"The Brazzaville Conference: reasons and setting"}],"note":{"status":"draft","text":"The Brazzaville Conference met from 30 January to 8 February 1944, before the war ended. De Gaulle opened it; René Pleven presided over its work. French officials wanted to reconsider imperial administration, recognise Africa’s wartime importance and strengthen France’s future position. Growing expectations and the need for reconstruction made reform urgent. It was primarily a conference of French colonial authorities, not an elected assembly of African peoples negotiating independence. Its framework sought a reformed relationship within French power.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to explain why French leaders convened the conference and distinguish its colonial reform agenda from an independence congress. Builds on: Africa’s wartime contributions and reform expectations. Leads to: the recommendations and limits of Brazzaville."},{"heading":"Explain the history","text":"The Brazzaville Conference met from {30} January to {8} February {1944}, before the war ended. De Gaulle opened it; René Pleven presided over its work. French officials wanted to reconsider imperial administration, recognise Africa’s wartime importance and strengthen France’s future position. Growing expectations and the need for reconstruction made reform urgent. It was primarily a conference of French colonial authorities, not an elected assembly of African peoples negotiating independence. Its framework sought a reformed relationship within French power."},{"heading":"Follow the evidence and examples","text":"Brazzaville had served as a centre of Free France in equatorial Africa. Wartime dependence on African people and resources made the future of empire a pressing issue. Proposed reform also sought to preserve French influence, so gratitude and imperial interest must be examined together. Read the opening address as a statement of leadership aims; compare it with the recommendations to see what was proposed and excluded. The conference’s location in Africa did not make its participants representative of every African community."},{"heading":"Reason and check","text":"Ask why now, why here and who was represented. Distinguish reasons for convening from results. A statement recognising African contributions may support a reform agenda without promising national sovereignty. Do not transfer later independence dates backwards into a wartime conference. Explain how the desire to preserve empire could coexist with proposed improvements."}],"key_words":[{"word":"wartime setting","meaning":"a reform conference held before the Second World War ended"},{"word":"recognition of African contribution","meaning":"attention to the people and resources sustaining Free France"},{"word":"imperial reconstruction","meaning":"an effort to reshape French rule while maintaining French influence"},{"word":"limited representation","meaning":"official deliberation without an elected African independence delegation"}],"mistake":{"wrong":"Brazzaville was held only after the Second World War ended.","right":"wartime setting: a reform conference held before the Second World War ended.","wh ille Conference opens in January {1944}"},{"a":"European war begins in {1939}","b":"French Cameroon rallies to Free France in {1940}","c":"Second World War ends in {1945}"},{"a":"European war begins in {1939}","b":"Brazzaville Conference opens in January {1944}","c":"Second World War ends in {1945}"},{"a":"French Cameroon rallies to Free France in {1940}","b":"Brazzaville Conference opens in January {1944}","c":"Second World War ends in {1945}"}]}},"prompt":"Put these dated events in chronological order, earliest first. Then use their sequence to distinguish an earlier condition from a later response.","items":[{"text":"{X.a}"},{"text":"{X.b}"},{"text":"{X.c}"}],"order":"as_written"},{"id":"y4-6-assess","type":"spot_error","level":3,"review":"authored","sources":["brazzaville"],"prompt":"Find the claim that misrepresents the history or the evidence.","pool":{"right":[{"text":"wartime setting: a reform conference held before the Second World War ended.","truth":"true","explain":"This is an accurate distinction: Its wartime timing helps explain both urgency and France’s dependence on its African base. Look for a claim that reverses the event, relationship or limit."},{"text":"recognition of African contribution: attention to the people and resources sustaining Free France.","truth":"true","explain":"This is an accurate distinction: The importance of Africa formed part of the setting for reconsidering imperial policy. Look for a claim that reverses the event, relationship or limit."},{"text":"imperial reconstruction: an effort to reshape French rule while maintaining French influence.","truth":"true","explain":"This is an accurate distinction: Reform within French power was distinct from a commitment to independence. Look for a claim that reverses the event, relationship or limit."},{"text":"limited representation: official deliberation without an elected African independence delegation.","truth":"true","explain":"This is an accurate distinction: Location and representative authority are different; examine who actually attended and spoke. Look for a claim that reverses the event, relationship or limit."}],"wrong":[{"text":"Brazzaville was held only after the Second World War ended.","truth":"false","explain":"Its wartime timing helps explain both urgency and France’s dependence on its African base."},{"text":"Africa had supplied no useful base or resources to Free France.","truth":"false","explain":"The importance of Africa formed part of the setting for reconsidering imperial policy."},{"text":"Discussing reform necessarily meant agreeing to dissolve the empire immediately.","truth":"false","explain":"Reform within French power was distinct from a commitment to independence."},{"text":"Meeting in Africa proves all Africans elected the conference delegates.","truth":"false","explain":"Location and representative authority are different; examine who actually attended and spoke."}]},"pick":{"right":3,"wrong":1}}]},"7":{"subject":"history","class":"Form 4","lesson_no":7,"language":"en","prerequisites":[6],"skills":[{"id":"y4-7","name":"The Brazzaville Conference: recommendations and limits"}],"note":{"status":"draft","text":"Brazzaville recommended wider representation, local assemblies, access to employment and improvements in education and social conditions. It proposed ending the indigénat system of exceptional administrative penalties and moving towards free labour. These were recommendations requiring later action, not proof of immediate universal enforcement. The conference rejected political development outside the French framework and did not promise independence. Its reform language nevertheless helped raise expectations that could be compared with continued inequality.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to classify political social and labour recommendations and explain why reform did not amount to a promise of independence. Builds on: the reasons and official setting of Brazzaville. Leads to: postwar nationalism and the trusteeship debate."},{"heading":"Explain the history","text":"Brazzaville recommended wider representation, local assemblies, access to employment and improvements in education and social conditions. It proposed ending the indigénat system of exceptional administrative penalties and moving towards free labour. These were recommendations requiring later action, not proof of immediate universal enforcement. The conference rejected political development outside the French framework and did not promise independence. Its reform language nevertheless helped raise expectations that could be compared with continued inequality."},{"heading":"Follow the evidence and examples","text":"Follow proposal and implementation separately. The conference called for labour change, but its labour recommendation allowed a transition rather than instantly ending all compulsion. The French law abolishing forced labour in overseas territories came in {1946}. Recommendations for representation did not automatically establish equal voting power everywhere. Brazzaville therefore combined reform proposals with an intention to maintain imperial unity. Later nationalist demands cannot be reduced to gratitude for a French promise of immediate sovereignty, because that promise was not made."},{"heading":"Reason and check","text":"Make a comparison: proposed change, limitation, later action. Check dates before claiming an effect. A statement about improving participation is different from a commitment to independent statehood. Recommendations can be historically important even when incomplete, delayed or used to preserve authority. Use later records to test implementation rather than assuming that the conference’s words transformed every locality."}],"key_words":[{"word":"political recommendation","meaning":"greater representation and local consultative or representative institutions"},{"word":"social recommendation","meaning":"improvements in education access and social conditions"},{"word":"labour reform","meaning":"movement towards free labour and ending exceptional colonial constraints"},{"word":"imperial limit","meaning":"the rejection of political evolution outside the French framework"}],"mistake":{"wrong":"A representation proposal automatically grants full national sovereignty.","right":"political recommendation: greater representation and local consultative or representative institutions.","why":"Participation within an empire is different from independent control of a state."}},"worked_example":{"status":"draft","vars":{},"problem":"Analyse this invented classroom source, not an archive quotation: Officials recommended wider representation and local assemblies within the French framework.","steps":["Identify the action, actor and setting stated in the text.","Greater representation and local consultative or representative institutions.","Participation within an empire is different from independent control of a state.","This practice text helps test reasoning; authenticate and compare real sources before claiming historical proof."],"answer":"political recommendation","checks":[]},"teach":{"cards":[{"id":"y4-7-c1","status":"draft","idea":"Distinguish the historical features before explaining their relationship.","vars":{},"example":["political recommendation: greater representation and local consultative or representative institutions.","social recommendation: improvements in education access and social conditions.","labour reform: movement towards free labour and ending exceptional colonial constraints.","imperial limit: the rejection of political evolution outside the French framework."],"checks":[],"check":{"ref":"y4-7-identify"}},{"id":"y4-7-c2","status":"draft","idea":"Connect a specific action or event to the historical feature it illustrates.","vars":{},"example":["Officials recommended wider representation and local assemblies within the Fr n accurate distinction: The conference maintained the French framework; later independence was not its immediate grant. Look for a claim that reverses the event, relationship or limit."}],"wrong":[{"text":"A representation proposal automatically grants full national sovereignty.","truth":"false","explain":"Participation within an empire is different from independent control of a state."},{"text":"Every social recommendation was already fully achieved when the conference opened.","truth":"false","explain":"A proposed improvement must be distinguished from its implementation and reach."},{"text":"Every form of compelled labour ended instantly at Brazzaville.","truth":"false","explain":"The recommendations and later abolition measures belong to different stages."},{"text":"Brazzaville guaranteed immediate independence for all French African territories.","truth":"false","explain":"The conference maintained the French framework; later independence was not its immediate grant."}]},"pick":{"right":3,"wrong":1}}]},"9":{"subject":"history","class":"Form 4","lesson_no":9,"language":"en","prerequisites":[5,7],"skills":[{"id":"y4-9","name":"African nationalism: meaning and forms"}],"note":{"status":"draft","text":"In this course, African nationalism means movements and ideas asserting a people’s right to determine its political future, especially to end colonial domination. A campaign could begin with demands for rights or representation and later seek independence; the stages were not identical everywhere. A nation is not simply one ethnic group, and nationalist movements could unite people across language or regional differences. Pan-Africanism promoted solidarity among Africans and people of African descent across territorial boundaries. Nationalism and Pan-Africanism could reinforce one another without being interchangeable.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to distinguish demands for collective self-government from a limited reform and explain how nationalism differed from Pan-Africanism. Builds on: colonial rule, wartime change and the limits of Brazzaville. Leads to: the internal and external factors strengthening nationalist movements."},{"heading":"Explain the history","text":"In this course, African nationalism means movements and ideas asserting a people’s right to determine its political future, especially to end colonial domination. A campaign could begin with demands for rights or representation and later seek independence; the stages were not identical everywhere. A nation is not simply one ethnic group, and nationalist movements could unite people across language or regional differences. Pan-Africanism promoted solidarity among Africans and people of African descent across territorial boundaries. Nationalism and Pan-Africanism could reinforce one another without being interchangeable."},{"heading":"Follow the evidence and examples","text":"A petition for fair pay addresses an immediate grievance. A demand that inhabitants control the territory’s government raises the wider issue of self-government. A Pan-African meeting connects struggles across territories and the diaspora. Methods included petitions, associations, newspapers, unions, elections and, in some settings, armed struggle. No method alone defines every nationalist movement. Leaders disagreed over aims and tactics, and claims to represent a nation must be examined alongside the experiences of workers, women, rural communities and minorities."},{"heading":"Reason and check","text":"Identify the political objective rather than labelling every protest nationalist automatically. Ask who should govern, whose rights are claimed and how broadly support is organised. Distinguish solidarity across Africa from one territory’s constitutional objective. Explain a movement’s programme without treating all its assertions as established facts or assuming that national unity eliminated internal disagreement."}],"key_words":[{"word":"self-determination","meaning":"a people’s claim to decide its political future"},{"word":"nationalist mobilisation","meaning":"organisation around collective political rights and self-government"},{"word":"Pan-African solidarity","meaning":"cooperation among Africans and the diaspora across territorial boundaries"},{"word":"limited reform demand","meaning":"a request for a particular improvement without necessarily demanding independent rule"}],"mistake":{"wrong":"Self-determination means permanent rule without the inhabitants’ wishes.","right":"self-determination: a people’s claim to decide its political future.","why":"The concept concerns political choice by the people, not their exclusion from deciding."}},"worked_example":{"status":"draft","vars":{},"problem":"Analyse this invented classroom source, not an archive quotation: An association demands that inhabitants determine the territory’s future government.","steps":["Identify the action, actor and setting stated in the text.","A people’s claim to decide its political future.","The concept concerns political choice by the people, not their exclusion from deciding.","This practice text helps test reasoning; authenticate and compare real sources before claiming historical proof."],"answer":"self-determination","checks":[]},"teach":{"cards":[{"id":"y4-9-c1","status":"draft","idea":"Distinguish the historical features before explaining their relationship.","vars":{},"example":["self-determination: a people’s claim to decide its political future.","nationalist mobilisation: organisation around collective political rights and self-government.","Pan-African solidarity: cooperation among Africans and the diaspora across territorial boundaries.","limited reform demand: a request for a particular improvement without necessarily demanding independent rule."],"checks":[],"check":{"ref":"y4-9-identify"}},{"id":"y4-9-c2","status":"draft","idea":"Connect a specific  exchange ideas and organise. The war brought burdens and new experiences and weakened claims of European invincibility. Pan-African networks and examples of Asian independence encouraged activists; UN principles offered language and forums for claims. None automatically produced independence: organisation, popular support, political choices and the authorities’ responses mattered.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to classify internal and external influences and explain how a grievance became organised pressure for political change. Builds on: the meaning of nationalism and Pan-African solidarity. Leads to: Cameroonian pressure groups and party formation."},{"heading":"Explain the history","text":"Nationalism grew through interacting internal and external influences. Colonial land, labour, tax and racial inequalities produced grievances. Education, newspapers, religious and welfare associations, unions and towns helped people exchange ideas and organise. The war brought burdens and new experiences and weakened claims of European invincibility. Pan-African networks and examples of Asian independence encouraged activists; UN principles offered language and forums for claims. None automatically produced independence: organisation, popular support, political choices and the authorities’ responses mattered."},{"heading":"Follow the evidence and examples","text":"At Manchester in {1945}, the Pan-African Congress brought together activists calling for an end to colonial domination. India’s independence in {1947} supplied a powerful external example, not a law instantly freeing Africa. In Cameroon, workers’ organisation linked employment grievances with wider political networks. Wartime service could expose contradictions between fighting for freedom and experiencing colonial inequality. A factor’s classification depends on the question: overseas congresses are external influences, while local organising turns ideas into action."},{"heading":"Reason and check","text":"Explain the mechanism: a grievance supplies an issue; communication spreads it; an organisation sustains demands; an external example strengthens expectations. Avoid simply listing factors without links. Not all educated people or veterans held the same views. Superpower rhetoric about colonialism was selective and tied to strategic interests, rather than a guarantee of African freedom."}],"key_words":[{"word":"internal grievance","meaning":"a local colonial inequality or burden encouraging opposition"},{"word":"organising network","meaning":"institutions and communication linking people around political demands"},{"word":"international solidarity","meaning":"cross-border contacts strengthening anticolonial arguments and cooperation"},{"word":"external independence example","meaning":"another country’s achievement encouraging expectations without determining the local outcome"}],"mistake":{"wrong":"Local land grievances were events occurring only in distant foreign capitals.","right":"internal grievance: a local colonial inequality or burden encouraging opposition.","why":"These grievances arise within the society experiencing colonial rule."}},"worked_example":{"status":"draft","vars":{},"problem":"Analyse this invented classroom source, not an archive quotation: Residents oppose unfair land loss and unequal treatment under colonial administration.","steps":["Identify the action, actor and setting stated in the text.","A local colonial inequality or burden encouraging opposition.","These grievances arise within the society experiencing colonial rule.","This practice text helps test reasoning; authenticate and compare real sources before claiming historical proof."],"answer":"internal grievance","checks":[]},"teach":{"cards":[{"id":"y4-10-c1","status":"draft","idea":"Distinguish the historical features before explaining their relationship.","vars":{},"example":["int "false","explain":"Its international setting and participants made it a source of wider solidarity."},{"text":"Indian independence legally granted every African territory immediate independence.","truth":"false","explain":"An example can inspire activists without changing another territory’s legal status automatically."}]},"pick":{"right":3,"wrong":1}}]},"11":{"subject":"history","class":"Form 4","lesson_no":11,"language":"en","prerequisites":[1,10],"skills":[{"id":"y4-11","name":"Origins of the Cold War"}],"note":{"status":"draft","text":"The Cold War was a prolonged rivalry centred on the United States and Soviet Union, involving power, ideology, security and competing political-economic systems. Their wartime alliance against Nazi Germany did not remove earlier distrust. After 1945, disputes over Germany, Eastern Europe and reconstruction intensified suspicion. The United States feared expanding communist influence; Soviet leaders sought security and imposed influence over neighbouring states. These explanations must be assessed critically rather than accepted as complete justifications. Rivalry developed through a sequence, not one universally agreed starting incident.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to explain how the wartime alliance gave way to rivalry and distinguish ideological disagreement from postwar security disputes. Builds on: the Second World War and the changing international setting of African nationalism. Leads to: the Cold War’s policies, alliances and conflicts."},{"heading":"Explain the history","text":"The Cold War was a prolonged rivalry centred on the United States and Soviet Union, involving power, ideology, security and competing political-economic systems. Their wartime alliance against Nazi Germany did not remove earlier distrust. After {1945}, disputes over Germany, Eastern Europe and reconstruction intensified suspicion. The United States feared expanding communist influence; Soviet leaders sought security and imposed influence over neighbouring states. These explanations must be assessed critically rather than accepted as complete justifications. Rivalry developed through a sequence, not one universally agreed starting incident."},{"heading":"Follow the evidence and examples","text":"Yalta and Potsdam in {1945} concerned the postwar settlement. Differences over elections, occupation zones, reparations and influence in Eastern Europe helped undermine cooperation. Churchill’s Iron Curtain speech in {1946} expressed a Western interpretation of the division; it did not create every division by itself. American and Soviet accounts often presented their own actions as defensive and the other side’s as aggressive. Compare those claims with decisions and effects. Germany’s occupation and later division became a central arena of tension."},{"heading":"Reason and check","text":"Distinguish a background disagreement from an action escalating it. Explain how one side’s security measure could be read as a threat by the other, while still examining coercion and responsibility. Do not describe all countries as passive objects: smaller states and anticolonial movements pursued aims of their own. Cold does not mean that no armed conflicts or deaths occurred."}],"key_words":[{"word":"ideological rivalry","meaning":"competition involving opposing political and economic systems"},{"word":"postwar security dispute","meaning":"conflict over influence borders and political control after the common enemy’s defeat"},{"word":"breakdown of the wartime alliance","meaning":"the weakening of cooperation once the common war effort ended"},{"word":"competing interpretations","meaning":"different explanations of responsibility requiring comparison with evidence"}],"mistake":{"wrong":"The former allies had identical political systems and no ideological differences.","right":"ideological rivalry: competition involving opposing political and economic systems.","why":"Shared opposition to Nazi Germany did not eliminate their different systems or aims."}},"worked_example":{"status":"draft","vars":{},"problem":"Analyse this invented classroom source, not an archive quotation: American and Soviet leaders promoted contrasting visions of political power and economic organisation.","steps":["Identify the action, actor and setting stated in the text.","Competition involving opposing political and economic systems.","Shared opposition to Nazi Germany did not eliminate their different systems or aims.","This practice text helps test reasoning; authenticate and compare real sources before claiming historical proof."],"answer":"ideological rivalry","checks":[]},"teach":{"cards":[{"id":"y4-11-c1","status":"draft","idea":"Distinguish the historical features before explaining their relationship.","vars":{},"example":["ideological rivalry: competition involving opposing political and economic systems.","postwar security dispute: conflict over influence borders and political control after the common enemy’s defeat.","breakdown of the wartime alliance: the weakening of cooperation once the common war effort ended.","competing interpretations: different explanations of responsibility requiring comparison with evidence."],"checks":[],"check":{"ref":"y4-11-identify"}},{"id":"y4-11-c2","status":"draft","idea":"Connect a specific action or event to the historical feature it illustrates.","vars":{},"example":["American and Soviet leaders promoted contrasting visions of political power and economic organisation.","Disagreement over Eastern European governments intensified mistrust after {1945}.","Former allies increasingly disagreed over Germany’s future and reconstruction.","Each government describes its policy as defensive while criticising its rival’s intentions."],"checks":[],"check":{"ref":"y4-11-case"}},{"id":"y4-11-c3","status":"draft","idea":"Check a claim against the sequence, setting and limits of th ated from 1948 to aid European recovery and support Western stability. Soviet leaders opposed American influence and consolidated their own bloc. NATO formed in 1949; the Warsaw Pact followed in 1955. The Berlin blockade and airlift of 1948–1949 showed confrontation over access without a direct general war between the superpowers.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to connect containment, aid, alliances, arms competition and proxy conflicts to the rivalry without treating every local war as wholly foreign-made. Builds on: the breakdown of the wartime alliance. Leads to: détente and attempts to manage superpower competition."},{"heading":"Explain the history","text":"The Cold War appeared in policy, alliances, propaganda, economic competition, arms races and conflicts involving other countries. The Truman Doctrine in {1947} expressed American support against communist pressure; the Marshall Plan operated from {1948} to aid European recovery and support Western stability. Soviet leaders opposed American influence and consolidated their own bloc. NATO formed in {1949}; the Warsaw Pact followed in {1955}. The Berlin blockade and airlift of {1948}–{1949} showed confrontation over access without a direct general war between the superpowers."},{"heading":"Follow the evidence and examples","text":"Nuclear competition increased risks and encouraged deterrence: a state sought to prevent attack by threatening unacceptable costs. This was a strategy, not proof that weapons made everyone safe. The Korean War of {1950}–{1953} illustrates a conflict with local roots and major outside intervention. Propaganda promoted each bloc’s claims. Economic assistance could serve both recovery and strategic aims; it must not be reduced to one motive without evidence. Not every African government or nationalist movement simply followed orders from a superpower."},{"heading":"Reason and check","text":"For each manifestation state what happened and how it expressed rivalry. Separate alliance from aid, propaganda from military action and local objectives from outside intervention. The word cold refers to the absence of a full-scale direct US-Soviet war, not an absence of fighting elsewhere. Compare a policy’s announced purpose with its recipients, conditions and consequences."}],"key_words":[{"word":"containment and aid","meaning":"policy using support and resources to limit perceived communist expansion"},{"word":"military blocs","meaning":"formal security alliances grouping states around rival powers"},{"word":"Berlin confrontation","meaning":"the blockade and airlift illustrating tension over access to the Western sectors"},{"word":"conflict with outside intervention","meaning":"a war combining local struggles and major external military involvement"}],"mistake":{"wrong":"All economic aid was unrelated to political strategy.","right":"containment and aid: policy using support and resources to limit perceived communist expansion.","why":"Aid could address recovery while also serving strategic objectives."}},"worked_example":{"status":"draft","vars":{},"problem":"Analyse this invented classroom source, not an archive quotation: The United States pairs assistance with the aim of resisting communist influence.","steps":["Identify the action, actor and setting stated in the text.","Policy using support and resources to limit perceived communist expansion.","Aid could address recovery while also serving strategic objectives.","This practice text helps test reasoning; authenticate and compare real sources before claiming historical proof."],"answer":"containment and aid","checks":[]},"teach":{"cards":[{"id":"y4-12-c1","status":"draft","idea":"Distinguish the historical features before explaining their relationship.","vars":{},"example":["containment and aid: policy using support and resources to limit perceived communist expansion.","military blocs: formal s differences, alliances or conflicts elsewhere. Arms limitation controlled specified weapons or systems; it was not the destruction of every weapon. A temporary easing must be distinguished from a permanent settlement.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to recognise negotiated reductions in tension and distinguish arms limitation from disarmament or the end of the Cold War. Builds on: Cold War rivalry, alliances and nuclear risk. Leads to: assessing agreements and the continued choices of states during decolonisation."},{"heading":"Explain the history","text":"Détente means an easing of international tension through negotiation and practical accommodation. In Cold War study it commonly refers to improved US-Soviet relations, especially in the late {1960}s and {1970}s. Fear of nuclear escalation, the costs of competition and strategic calculations encouraged talks. Détente did not erase ideological differences, alliances or conflicts elsewhere. Arms limitation controlled specified weapons or systems; it was not the destruction of every weapon. A temporary easing must be distinguished from a permanent settlement."},{"heading":"Follow the evidence and examples","text":"The Limited Test Ban Treaty of {1963} was an earlier step towards controlling nuclear danger; it did not ban all underground testing. SALT agreements in {1972} included the ABM Treaty and an interim limit on specified strategic offensive weapons. The Helsinki Final Act in {1975} addressed European security, cooperation and human rights. Meetings, exchanges and agreements offered channels for managing rivalry. Continued intervention and renewed tension, notably around the Soviet invasion of Afghanistan in {1979}, show the limits of accommodation."},{"heading":"Reason and check","text":"Ask what an agreement actually covers: testing, launchers, defensive systems or diplomatic principles. Compare obligations with implementation and later events. A photograph of leaders meeting proves contact, not complete agreement. Do not confuse the date of signing with ratification or enforcement. Explain both what changed and which rivalries continued."}],"key_words":[{"word":"détente","meaning":"an easing of tension through negotiation while rivalry can continue"},{"word":"arms limitation","meaning":"restrictions on specified weapons or systems rather than total abolition"},{"word":"Helsinki cooperation","meaning":"European security and cooperation commitments associated with the {1975} Final Act"},{"word":"limits of accommodation","meaning":"continued rivalry and renewed crises despite improved relations"}],"mistake":{"wrong":"Détente means every political disagreement and conflict has ended permanently.","right":"détente: an easing of tension through negotiation while rivalry can continue.","why":"Accommodation can reduce tension without eliminating the underlying rivalry."}},"worked_example":{"status":"draft","vars":{},"problem":"Analyse this invented classroom source, not an archive quotation: Rival governments hold talks and agree measures to reduce the danger of confrontation.","steps":["Identify the action, actor and setting stated in the text.","An easing of tension through negotiation while rivalry can continue.","Accommodation can reduce tension without eliminating the underlying rivalry.","This practice text helps test reasoning; authenticate and compare real sources before claiming historical proof."],"answer":"détente","checks":[]},"teach":{"cards":[{"id":"y4-13-c1","status":"draft","idea":"Distinguish the historical features before explaining their relationship.","vars":{},"example":["détente: an easing of tension through negotiation while rivalry can continue.","arms limitation: restrictions on specified weapons or systems rather than total abolition.","Helsinki cooperation: European security and cooperation commitments associated with the {1975} Final Act.","lim he UN did not become the ordinary local government and did not grant immediate independence through approval alone.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to explain why mandate territories entered trusteeship and distinguish the administering authority from UN supervision and petitions. Builds on: mandate administration, postwar reform and international institutions. Leads to: pressure groups using local organisation and international scrutiny."},{"heading":"Explain the history","text":"After the League of Nations period, UN trusteeship provided an international framework for administering and supervising designated territories. It aimed at political, economic, social and educational advancement and progress towards self-government or independence according to circumstances and the people’s wishes. The General Assembly approved separate agreements for the British- and French-administered Cameroons on {13} December {1946}. Britain and France continued to administer their respective territories under agreed obligations. The UN did not become the ordinary local government and did not grant immediate independence through approval alone."},{"heading":"Follow the evidence and examples","text":"The process involved proposed terms, agreement by the states directly concerned and approval by the appropriate UN organ. For these non-strategic Cameroons agreements, approval lay with the General Assembly. Under its authority the Trusteeship Council considered reports, examined petitions in consultation with administrators and arranged agreed periodic visits. British Cameroons remained administered in connection with Nigeria; French Cameroon remained under French authority. Petitions and visiting missions offered routes for inhabitants’ claims, but scrutiny did not guarantee an immediate remedy or a predetermined constitutional outcome."},{"heading":"Reason and check","text":"Sepa mes and competed for political authority or representation. In French Cameroon, labour grievances, unequal rights, educated activists, urban networks and postwar openings encouraged organisation. The colonial-sponsored JEUCAFRA, established in {1938}, opposed a return to German rule but also became a space where some Cameroonians developed political experience. It must not be treated as if it already had the later UPC’s programme. Unions and associations helped activists build networks while pursuing their own immediate objectives."},{"heading":"Follow the evidence and examples","text":"The USCC developed in {1944} around workers’ rights and conditions. The UPC, founded in {1948}, pressed for independence and reunification; Ruben Um Nyobè became a leading figure. Later party competition included Aujoulat’s BDC, founded in {1951}, whose approach differed from the UPC’s. Representation and international petitioning gave activists additional arenas, while colonial authorities also used surveillance, restriction and repression. These organisations were neither identical nor supported by every inhabitant. Detailed later conflict belongs to subsequent study, not an invented peaceful transition."},{"heading":"Reason and check","text":"For each organisation record setting, immediate aims, methods and relationship with colonial authority. Trace connections between unions and parties without saying they were the same body. Compare programmes with practice and distinguish an organisation’s claim to represent people from evidence of support. Do not infer that all political change came from foreign leaders or that every reform-minded association demanded immediate independence."}],"key_words":[{"word":"JEUCAFRA","meaning":"an initially colonial-sponsored political association opposing German return and providing political experience"},{"word":"USCC","meaning":"a union federation concerned with workers’ rights and conditions"},{"word":"UPC","meaning":"the party founded in {1948} nd predicate term in a standard categorical statement. Builds on: Form Three’s distinction between a term, a judgment and an argument. Leads to: categorical propositions, where these parts express a relation between classes."},{"heading":"A claim has a structure","text":"A proposition expresses an assertion that can be true or false. A question or command does not automatically assert a proposition. The standard categorical model makes its parts visible: quantifier + subject term + copula + predicate term. The quantifier sets the scope; the subject names the class discussed; the copula links; the predicate names the class attributed or denied. Other propositions need different analyses, which come later."},{"heading":"Follow the parts in a local example","text":"In an invented Buea club rule, All club members are badge holders, All is the quantifier, club members the subject term, are the copula and badge holders the predicate term. Both class expressions contain several words. A term is not restricted to one word, and naming the parts does not prove the club actually follows that rule."},{"heading":"Keep whole terms together","text":"First identify what class is discussed. Then locate the relation and the class attributed to it. Finally check the quantifier. In Some library books are not loanable items, library books is the subject, loanable items the predicate and are not the negative copula in this school model. The words not and are do not create a new class name."}],"key_words":[{"word":"quantifier","meaning":"how much of the subject class is covered"},{"word":"subject term","meaning":"the class about which the claim is made"},{"word":"copula","meaning":"the linking expression joining subject and predicate"},{"word":"predicate term","meaning":"the class attributed to, or denied of, the subject"}],"mistake":{"wrong":"Each word is a separate logical term.","right":"Club members is one multiword term.","why":"Logical function depends on the expression’s role, not ut justification.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to state and justify which terms are distributed in each categorical form. Builds on: the A, E, I and O forms. Leads to: interpreting diagrams and avoiding illicit class-wide conclusions in later syllogisms."},{"heading":"What distributed means","text":"A term is distributed when the proposition speaks about every member of the class it names. This concerns logical coverage, not how many objects a classroom sample contains. Ask separately about S and P. A: S only. E: both. I: neither. O: P only. Learn the pattern with its reason, rather than treating a quantifier as a signal that both terms are distributed."},{"heading":"Why the affirmative forms differ","text":"All club members are badge holders covers every club member. It leaves open whether other badge holders exist, so P is undistributed. Some club members are badge holders covers selected members and does not exhaust either class. Thus A distributes S, while I distributes neither. Reversing an A statement would add a claim about the entire predicate class that the original did not make."},{"heading":"Why negative predicates are distributed","text":"No S are P excludes every S from the whole P class, so both terms are distributed. Some S are not P selects at least one S and excludes that member from P as a whole: S is undistributed, P distributed. The claim does not assert that all S are outside P. Distribution will later help test whether a conclusion claims more class coverage than its premises supply."}],"key_words":[{"word":"distributed","meaning":"covering every member of the term’s class"},{"word":"undistributed","meaning":"not covering every member of the term’s class"},{"word":"subject coverage","meaning":"whether every S is covered"},{"word":"predicate coverage","meaning":"whether P is covered as a whole"}],"mistake":{"wrong":"All S are P distribu east one object in a region. An unmarked region is unspecified, not necessarily occupied. Here we use the modern convention: a universal proposition alone adds no existence mark. An explicit existence assumption must be stated if a traditional treatment is used."},{"heading":"Translate each form","text":"A, All S are P: shade S-only, because no S may be outside P. E, No S are P: shade the overlap. I, Some S are P: put x in the overlap. O, Some S are not P: put x in S-only. The example diagram shows A. Its blank overlap is not evidence of existence.","figure":"\"\u003csvg xmlns=\\\"http://www.w3.org/2000/svg\\\" viewBox=\\\"0 0 320 190\\\" role=\\\"img\\\" aria-label=\\\"Categorical Venn diagram. Left circle S, right circle P. Shading means empty; x means existence.\\\">\u003cdefs>\u003cclipPath id=\\\"subject\\\">\u003ccircle cx=\\\"120\\\" cy=\\\"95\\\" r=\\\"65\\\"/>\u003c/clipPath>\u003c/defs>\u003crect width=\\\"320\\\" height=\\\"190\\\" fill=\\\"white\\\"/>\u003ccircle cx=\\\"120\\\" cy=\\\"95\\\" r=\\\"65\\\" fill=\\\"#b4c9bf\\\"/>\u003cg clip-path=\\\"url(#subject)\\\">\u003ccircle cx=\\\"195\\\" cy=\\\"95\\\" r=\\\"65\\\" fill=\\\"white\\\"/>\u003c/g>\u003cg fill=\\\"none\\\" stroke=\\\"#233e31\\\" stroke-width=\\\"2\\\">\u003ccircle cx=\\\"120\\\" cy=\\\"95\\\" r=\\\"65\\\"/>\u003ccircle cx=\\\"195\\\" cy=\\\"95\\\" r=\\\"65\\\"/>\u003c/g>\u003cg font-size=\\\"18\\\" text-anchor=\\\"middle\\\" fill=\\\"#17251c\\\">\u003ctext x=\\\"105\\\" y=\\\"22\\\">S\u003c/text>\u003ctext x=\\\"211\\\" y=\\\"22\\\">P\u003c/text>\u003c/g>\u003c/svg>\""},{"heading":"Read back to check","text":"For an invented Bamenda club, let S be club members and P badge holders. An x in S-only represents a member without a badge, so it is O. Read your completed diagram back into words before accepting it. Changing shading to x reverses empty into occupied; placing the right kind of mark in the wrong region also changes the assertion."}],"key_words":[{"word":"shading","meaning":"an asse requisites":[2,4],"skills":[{"id":"l4-8","name":"Hypothetical or conditional propositions"}],"note":{"status":"draft","text":"A conditional links antecedent to consequent without asserting either separately. Material implication is false only for true P and false Q. Preserve direction, distinguish necessary from sufficient, and do not confuse a truth function with causal evidence.","checks":[]},"learn":{"status":"draft","vars":{},"sections":[{"heading":"Your goal and connections","text":"By the end, you should be able to identify antecedent and consequent, preserve the direction of a condition and recognise its counterexample. Builds on: a proposition as a truth-valued claim; categorical inclusion as a directed relation. Leads to: disjunctions and the later symbolic-logic truth tables."},{"heading":"A compound with a direction","text":"If P then Q is a conditional: P is the antecedent and Q the consequent. Under the stated rule, P is sufficient for Q and Q necessary for P. The rule does not assert P, and it does not automatically reverse. If a fictional club meets, then its room is reserved does not say a reserved room guarantees a club meeting."},{"heading":"Find the violating case","text":"For the material-conditional convention, the conditional is false only when P is true and Q false. True/true, false/true and false/false do not refute it. A false antecedent does not establish that a real causal explanation is good: truth-functional evaluation and causal evidence are different questions. These exercises state their convention explicitly."},{"heading":"Use the relation carefully","text":"A club meeting without the required reservation refutes the invented rule. A reservation without a meeting need not refute it: another group could have booked the room. Do not infer P from Q alone. When translating only if, the condition following only if is necessary: P only if Q becomes If P then Q."}],"key_words":[{"word":"antecedent","meaning":"the condition following if"},{"word":"consequent","meaning":"the clause following then"},{"word":"sufficient condition","meaning":"one that guarantees the consequent under the stated rule"},{"word":"counterexample","meaning":"a case fulfilling P without Q"}],"mistake":{"wrong":"If P then Q permits inferring P just from Q.","right":"The direction is from P to Q; the converse needs support.","why":"Q can be true for another reason."}},"worked_example":{"status":"draft","vars":{},"problem":"A fictional rule says: If the club meets, the room is reserved. The room is reserved. Must the club meet?","steps":["P is the meeting; Q is the reservation.","The rule forbids P without Q.","Q without P remains possible: another activity may use the reservation."],"answer":"No. Inferring P from Q alone reverses the rule.","checks":[]},"teach":{"cards":[{"id":"l4-8-c1","status":"draft","idea":"Identify the if-clause before evaluating the whole claim.","vars":{},"example":["If the club meets, the room is reserved: club meets is the antecedent."],"checks":[],"check":{"ref":"l4-8-antecedent"}},{"id":"l4-8-c2","status":"draft","idea":"The antecedent is sufficient for the consequent under the rule.","vars":{},"example":["The reverse direction requires a separate rule."],"checks":[],"check":{"ref":"l4-8-conditions"}},{"id":"l4-8-c3","status":"draft","idea":"A counterexample needs the condition without the required result.","vars":{},"example":["True P, false Q is the violating case."],"checks":[],"check":{"id":"l4-8-counterexample-card","type":"mcq","level":1,"review":"authored","sources":["categorical"],"vars":{"X":{"pick":[{"q":"Which situation refutes If the club meets, then the room is reserved?","r":"the club meets is true, but the room is reserved is false.","w":["the club meets is false and the room is reserved is true.","the club meets is false and the room is reserved is false.","the club meets is true and the room is reserved is true."],"e":["A false antecedent is not the violation specified by the rule.","Bot
